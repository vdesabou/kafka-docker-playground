
name: Update Change Logs

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  milestone:
    types: [closed]
  # refresh the change log as soon as an issue belonging to a milestone is closed
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      milestoneId:
        description: 'Milestone ID'
        required: true
        default: '1'

# every run pushes docs/changelog.md to the same docs repo: run them one at a time. When several issues are
# closed in a row, the pending run is replaced by the newest one, which regenerates the whole milestone anyway
concurrency:
  group: update-changelogs
  cancel-in-progress: false

jobs:
  build:
    name: Update Change Logs
    # on issues events, only for issues that belong to a milestone
    if: github.event_name != 'issues' || github.event.issue.milestone != null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: vdesabou/kafka-docker-playground
          fetch-depth: 0
      # github.event.milestone is only set on milestone events, github.event.issue.milestone on issues events,
      # resolve it from the input on workflow_dispatch
      - name: Resolve milestone
        id: milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE_NUMBER: ${{ github.event.milestone.number || github.event.issue.milestone.number || inputs.milestoneId }}
        run: |
          title=$(gh api "repos/${GITHUB_REPOSITORY}/milestones/${MILESTONE_NUMBER}" --jq '.title')
          echo "milestone ${MILESTONE_NUMBER}: ${title}"
          echo "number=${MILESTONE_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"

      # issues need to be closed to generate release notes
      # only when the milestone itself is closed: closing one issue must not close the rest of the milestone
      - name: Close issues
        id: close_issues
        if: github.event_name != 'issues'
        uses: lee-dohm/close-matching-issues@v2.1.0
        with:
          query: 'milestone:"${{ steps.milestone.outputs.title }}"'
          token: ${{ secrets.GITHUB_TOKEN }}

      # the GitHub API is eventually consistent: right after closing them, the release notes generator
      # can still see the issues as open and silently leave them out
      # on issues events the rest of the milestone is legitimately still open, only wait for the closed issue
      - name: Wait for closed issues to be visible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE_NUMBER: ${{ steps.milestone.outputs.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          for i in $(seq 1 30); do
            if [ -n "${ISSUE_NUMBER}" ]; then
              open=$(gh api "repos/${GITHUB_REPOSITORY}/issues?milestone=${MILESTONE_NUMBER}&state=open&per_page=100" --paginate --jq ".[] | select(.number == ${ISSUE_NUMBER}) | .number" | wc -l | tr -d ' ')
              echo "issue #${ISSUE_NUMBER} still listed as open in milestone ${MILESTONE_NUMBER}: ${open}"
            else
              open=$(gh api "repos/${GITHUB_REPOSITORY}/issues?milestone=${MILESTONE_NUMBER}&state=open&per_page=100" --jq 'length')
              echo "open issues in milestone ${MILESTONE_NUMBER}: ${open}"
            fi
            [ "${open}" = "0" ] && break
            sleep 5
          done
          # list endpoints can lag behind each other, give the generator's query some extra margin
          sleep 20

      - name: Create Release Notes
        uses: vdesabou/release-notes-generator-action@1.0.3
        id: Changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FOLDER: temp_release_notes
          MILESTONE_NUMBER: ${{ steps.milestone.outputs.number }}

      - name: Read temp_release_notes/release_file.md
        id: read_release_file
        uses: juliangruber/read-file-action@v1
        with:
          path: ./temp_release_notes/release_file.md

      - name: Update changelog.md
        run: |
          curl -s -o changelog_orig.md https://raw.githubusercontent.com/vdesabou/kafka-docker-playground-docs/refs/heads/main/docs/changelog.md

          tail -n +2 changelog_orig.md > changelog_tmp.md

          cat <<'EOF_RELEASE_NOTES' > release_notes_raw.md
          ${{ steps.read_release_file.outputs.content }}
          EOF_RELEASE_NOTES

          sed 's/^#/##/g' release_notes_raw.md | sed 's/###/#####/g' > release_notes_formatted.md

          current_month=$(date +"%B %Y")
          
          # Check if current month section already exists
          if grep -q "^## ${current_month}$" changelog_orig.md; then
            echo "Month section '${current_month}' already exists, replacing it"
            
            # Get content before the current month section
            awk -v month="## ${current_month}" '
              $0 == month { exit }
              { print }
            ' changelog_orig.md > before_current.md
            
            # Get content after current month section (from next ## onwards)
            awk -v month="## ${current_month}" '
              BEGIN { found=0; after=0 }
              found && /^## / && !after { after=1 }
              after { print }
              $0 == month { found=1 }
            ' changelog_orig.md > after_current.md
            
            # Build new changelog
            cat before_current.md > ./docs/changelog.md
            echo "## ${current_month}" >> ./docs/changelog.md
            cat release_notes_formatted.md >> ./docs/changelog.md
            cat after_current.md >> ./docs/changelog.md
          else
            echo "Creating new month section '${current_month}'"
            echo "# 📜 Change Log" > ./docs/changelog.md
            echo "" >> ./docs/changelog.md
            echo "## ${current_month}" >> ./docs/changelog.md
            cat release_notes_formatted.md >> ./docs/changelog.md
            cat changelog_tmp.md >> ./docs/changelog.md
          fi

      - name: Pushes docs
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.CI_GITHUB_TOKEN }}
        with:
          source_file: './docs'
          destination_repo: 'vdesabou/kafka-docker-playground-docs'
          user_email: 'vincent.desaboulin@gmail.com'
          user_name: 'vdesabou'
          commit_message: "updating with milestone ${{ steps.milestone.outputs.title }}${{ github.event.issue.number && format(' (closed #{0})', github.event.issue.number) || '' }}"
