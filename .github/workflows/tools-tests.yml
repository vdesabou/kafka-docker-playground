name: Tools tests

# the unit tests of the Python helpers of the reports (sanitizer, known causes, exports of log events, overview) and the log
# digest with every awk: plain asserts, no dependency, a few seconds. On the pull requests and pushes that change them
on:
  pull_request:
    paths:
      - "tools/report-common/**"
      - "tools/log-analyzer/**"
      - "cfk-analysis/log_banner.py"
      - "scripts/cli/src/lib/cli_function.sh"
      - ".github/workflows/tools-tests.yml"
  push:
    branches:
      - master
    paths:
      - "tools/report-common/**"
      - "tools/log-analyzer/**"
      - "cfk-analysis/log_banner.py"
      - "scripts/cli/src/lib/cli_function.sh"
      - ".github/workflows/tools-tests.yml"
  workflow_dispatch:

jobs:
  tools-tests:
    name: Tools tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sanitizer and known causes (leaks, over-redaction, speed on adversarial lines)
        run: python3 -I tools/report-common/test_sanitizer.py

      - name: Exports of log events, overview, progress
        run: python3 -I tools/log-analyzer/test_log_analyzer.py

      # the digest of analyze logs, container logs --errors, get-ci-result: mawk is the default awk of Debian / Ubuntu, a
      # construct it refuses made the whole digest fail there (records of every file lost)
      - name: Log digest with mawk, gawk and busybox awk
        run: |
          sudo apt-get install -y -qq mawk gawk busybox > /dev/null
          tools/log-analyzer/test_digest_awk.sh gawk mawk "busybox awk"
