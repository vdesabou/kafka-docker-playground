name: Tools tests

# the unit tests of the Python helpers of the reports (sanitizer, known causes, exports of log events, overview), the same
# with Python 3.8 (the oldest supported), and the log digest with every awk: plain asserts, no dependency, a few seconds.
# On the pull requests and pushes that change them
on:
  pull_request:
    paths:
      - "tools/report-common/**"
      - "tools/log-analyzer/**"
      - "tools/streams-analyzer/**"
      - "tools/thread-analyzer/**"
      - "cfk-analysis/**"
      - "scripts/cli/src/lib/cli_function.sh"
      - ".github/workflows/tools-tests.yml"
  push:
    branches:
      - master
    paths:
      - "tools/report-common/**"
      - "tools/log-analyzer/**"
      - "tools/streams-analyzer/**"
      - "tools/thread-analyzer/**"
      - "cfk-analysis/**"
      - "scripts/cli/src/lib/cli_function.sh"
      - ".github/workflows/tools-tests.yml"
  workflow_dispatch:

jobs:
  tools-tests:
    name: Tools tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sanitizer and known causes (leaks, over-redaction, speed on adversarial lines)
        run: python3 -I tools/report-common/test_sanitizer.py

      - name: Share dialog of the HTML reports
        run: python3 -I tools/report-common/test_share_dialog.py

      - name: Exports of log events, overview, progress
        run: python3 -I tools/log-analyzer/test_log_analyzer.py

      - name: CFK analyzer (reconcile loops, kubectl get pods tables)
        run: |
          pip install -q -r cfk-analysis/requirements.txt
          python3 -I cfk-analysis/test_analyzer.py

      # python3 3.8 is the oldest version analyze logs supports (Ubuntu 20.04; also UBI 9 and macOS /usr/bin/python3 are
      # 3.9): a construct of a newer Python (a 3.12 f-string with nested quotes, a match statement) made every run fail
      # there with a SyntaxError, the tests above use 3.12. Every file must compile with 3.8, and the tests pass with it
      - name: Python 3.8, the oldest supported version
        run: |
          docker run --rm -v "$PWD":/src:ro -w /src -e PYTHONPYCACHEPREFIX=/tmp/pyc python:3.8-slim sh -ec '
            python -m compileall -q tools/log-analyzer tools/report-common tools/streams-analyzer tools/thread-analyzer cfk-analysis
            python -I tools/report-common/test_sanitizer.py
            python -I tools/report-common/test_share_dialog.py
            python -I tools/log-analyzer/test_log_analyzer.py
            pip install -q --root-user-action=ignore -r cfk-analysis/requirements.txt
            python -I cfk-analysis/test_analyzer.py
          '

      # the digest of analyze logs, container logs --errors, get-ci-result: mawk is the default awk of Debian / Ubuntu, a
      # construct it refuses made the whole digest fail there (records of every file lost)
      - name: Log digest with mawk, gawk and busybox awk
        run: |
          sudo apt-get install -y -qq mawk gawk busybox > /dev/null
          tools/log-analyzer/test_digest_awk.sh gawk mawk "busybox awk"
