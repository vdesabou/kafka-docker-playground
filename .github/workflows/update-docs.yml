name: Update Docs

on:
  workflow_dispatch:
  # publish a merged change to the hand-written pages or to the CLI help right away, instead of waiting for the nightly CI
  # (Run workflow also regenerates content.md, badges.md and introduction.md from the last CI results)
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      # the command tree: src/bashly.yml, one src/commands/<command>.yml per command, shared flags in src/flags/
      - 'scripts/cli/src/bashly.yml'
      - 'scripts/cli/src/commands/**.yml'
      - 'scripts/cli/src/flags/**'
      - 'scripts/cli/docs-template/**'
      - 'scripts/publish-docs.sh'
      # the generator of content.md, badges.md and introduction.md (playground update-readme; their templates are in docs/)
      - 'scripts/cli/src/commands/update-readme.sh'

# a later merge publishes everything a pending run would have published
concurrency:
  group: update-docs
  cancel-in-progress: true

jobs:
  update-docs:
    name: Update Docs
    # needs CI_GITHUB_TOKEN to push to the docs repository: not in forks
    if: github.repository == 'vdesabou/kafka-docker-playground'
    runs-on: ubuntu-latest
    # actions: read for the last successful run of this workflow (the push to the docs repository uses CI_GITHUB_TOKEN)
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: vdesabou/kafka-docker-playground
          fetch-depth: 0
          ssh-strict: 'false'

      - name: Update DOCS
        run: |
          sudo gem install bashly
          cd ./scripts/cli
          ./playground update-docs

      # content.md, badges.md and introduction.md, from the results of the last CI runs (S3): on workflow_dispatch, or when
      # a template changed. Otherwise they are left as published by the nightly CI (publish-docs.sh never deletes a generated page)
      # "changed" since the commit of the last successful run of this workflow, not only in this push: a run cancelled by a
      # later merge (concurrency) did not publish its templates, and the diff of the later push alone does not have them
      # (the home page change of #10293 was skipped that way). No successful run found: the before of this push. A diff
      # that cannot be computed (unknown commit): generated, to be safe
      - name: Check if content.md must be generated
        id: readme
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]
          then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # on an error, gh api prints the error JSON on stdout: only a commit id is kept
          base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/update-docs.yml/runs?branch=master&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' 2> /dev/null || true)
          if [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          then
            echo "templates compared with $base (the last successful run)"
          else
            base="$BEFORE_SHA"
            echo "templates compared with $base (the before of this push: no successful run found)"
          fi
          if ! changed=$(git diff --name-only "$base" "$AFTER_SHA" 2> /dev/null)
          then
            echo "no diff with $base: generated"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif grep -qE '^docs/(content-template|badges-template|introduction-header|introduction-footer)\.md$|^scripts/cli/src/commands/update-readme\.sh$' <<< "$changed"
          then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # --skip-gh-issues: only the nightly CI creates, comments and closes the 🔥 issues
      - name: Update README
        if: steps.readme.outputs.run == 'true'
        run: |
          tag=$(grep '# default tag' scripts/utils.sh | sed -E 's/.*TAG=([^ ]+).*/\1/')
          cd ./scripts/cli
          ./playground update-readme --tags "$tag" --skip-gh-issues
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_REGION: ${{ vars.AWS_REGION}}

      # publishes docs/ (hand-written pages + the pages generated above) to the repository serving kafka-docker-playground.io
      - name: Pushes docs
        env:
          API_TOKEN_GITHUB: ${{ secrets.CI_GITHUB_TOKEN }}
        run: ./scripts/publish-docs.sh "updating with latest versions"
