name: Update Docs

on:
  workflow_dispatch:

jobs:
  update-docs:
    name: Update Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          repository: vdesabou/kafka-docker-playground
          fetch-depth: 0
          ssh-strict: 'false'

      - name: Update DOCS
        run: |
          sudo gem install bashly
          cd ./scripts/cli
          ./playground update-docs

      # not using dmnemec/copy_file_to_another_repo_action: it only adds files, so pages of removed or renamed commands were never deleted
      - name: Pushes docs
        env:
          API_TOKEN_GITHUB: ${{ secrets.CI_GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${API_TOKEN_GITHUB}@github.com/vdesabou/kafka-docker-playground-docs.git" /tmp/kafka-docker-playground-docs
          # CLI reference pages are all re-generated by playground update-docs: remove the existing ones first
          if ls ./docs/playground\ *.md > /dev/null 2>&1
          then
            rm -f /tmp/kafka-docker-playground-docs/docs/playground\ *.md
          fi
          cp -R ./docs/. /tmp/kafka-docker-playground-docs/docs/
          cd /tmp/kafka-docker-playground-docs
          git config user.email 'vincent.desaboulin@gmail.com'
          git config user.name 'vdesabou'
          git add -A docs
          if ! git diff --cached --quiet
          then
            git commit -m 'updating with latest versions'
            git push origin main
          fi
