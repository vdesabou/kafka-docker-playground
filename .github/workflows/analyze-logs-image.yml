name: analyze logs image

# ghcr.io/vdesabou/kdp-analyze-logs: playground analyze logs with nothing installed but Docker
# (tools/analyze-logs-image). Built and tested on the pull requests that change it; built for linux/amd64 and
# linux/arm64, tested, then published on master, every week (security updates of the base image) and on demand.
on:
  pull_request:
    paths:
      - "tools/analyze-logs-image/**"
      - "tools/log-analyzer/**"
      - "tools/report-common/**"
      - "tools/streams-analyzer/**"
      - "cfk-analysis/**"
      - "scripts/cli/playground"
      - ".github/workflows/analyze-logs-image.yml"
  push:
    branches:
      - master
    paths:
      - "tools/analyze-logs-image/**"
      - "tools/log-analyzer/**"
      - "tools/report-common/**"
      - "tools/streams-analyzer/**"
      - "cfk-analysis/**"
      - "scripts/cli/playground"
      - ".github/workflows/analyze-logs-image.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: analyze-logs-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/vdesabou/kdp-analyze-logs

jobs:
  image:
    name: Build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # the image of the runner, loaded in docker for the tests
      - name: Build (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/analyze-logs-image/Dockerfile
          platforms: linux/amd64
          load: true
          tags: kdp-analyze-logs:test
          build-args: |
            KDP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        run: |
          tools/analyze-logs-image/test-image.sh kdp-analyze-logs:test
          docker image ls kdp-analyze-logs:test --format 'size: {{.Size}}'

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' && github.repository == 'vdesabou/kafka-docker-playground'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest, :<commit sha> (a pinned version) and :<date> (the version used in a case)
      - name: Tags
        if: github.event_name != 'pull_request' && github.repository == 'vdesabou/kafka-docker-playground'
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo "${IMAGE}:$(date -u +%Y-%m-%d)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish (linux/amd64, linux/arm64)
        if: github.event_name != 'pull_request' && github.repository == 'vdesabou/kafka-docker-playground'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/analyze-logs-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            KDP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
