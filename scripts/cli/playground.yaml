name: playground
description: | 
  🧠 CLI for Kafka Docker Playground 🐳
  
  👉 Check documentation https://kafka-docker-playground.io/#/cli
usage: playground [OPTIONS] COMMAND
options: []
inheritedOptions: []
subcommands:
  - name: help
    description: | 
        Show help about a command
    usage: playground help [COMMAND]
    options: []
    subcommands:

  - name: status
    description: | 
        🗺️ Show a status
        
        A single screen answering "what is running right now, and is it healthy":
        the example currently running and its documentation link, the state of
        every container (flagging the exited or restarting ones), the version of
        every connector, the status and configuration of each of them, the topics
        that exist, and whether an EC2 instance of yours is still up.
        
        Everything comes from the running containers and from playground.ini, so
        it is also the quickest way to get back your bearings after a break.
    usage: playground status
    options: []
    subcommands:
  - name: config
    description: | 
        ⚙️ Configure CLI
        
        Your preferences, kept between sessions:
        
          editor <name>                      the editor every command opens files
                                             with (code, vi, nano...)
          folder_zip_or_jar <dir>...         where to look for connector zips and
                                             jars, in addition to the current
                                             folder
          clipboard true|false               copy connector config to the
                                             clipboard (macOS only)
          container-kill-all-before-run      kill every container before each run,
                                             or just stop the example
          check-and-update-repo-version      warn when your clone is out of date
          open-ccloud-connector-in-browser   open fully managed connectors, and in
          open-grafana-in-browser            which browser
    usage: playground config COMMAND
    options: []
    subcommands:
      - name: editor
        description: | 
          editor to use to open files
        usage: playground config editor EDITOR
        options: []
      - name: folder_zip_or_jar
        description: | 
          📂 list of folders where to search for zip or jar
            current folder is always included
            
            default is ~ (home dir)
        usage: playground config folder_zip_or_jar FOLDER...
        options: []
      - name: clipboard
        description: | 
          copy to clipboard connector config (only working on MacOS)
        usage: playground config clipboard [ENABLED]
        options: []
      - name: open-ccloud-connector-in-browser
        description: | 
          when running a fully managed connector example, it opens the connector in browser
            
        usage: playground config open-ccloud-connector-in-browser COMMAND
        options: []
      - name: open-grafana-in-browser
        description: | 
          when running an example with --enable-jmx-grafana flag, it opens grafana in browser
            
        usage: playground config open-grafana-in-browser COMMAND
        options: []
      - name: container-kill-all-before-run
        description: | 
          when running an example, always call playground container kill-all first. If set to false, it will call playground stop instead.
            
        usage: playground config container-kill-all-before-run [ENABLED]
        options: []
      - name: check-and-update-repo-version
        description: | 
          when running an example, always check if repo version is older than 3 days, if disabled, it will skip this check.
            
        usage: playground config check-and-update-repo-version [ENABLED]
        options: []
  - name: open-ccloud-connector-in-browser
    description: | 
        when running a fully managed connector example, it opens the connector in browser
        
    usage: playground config open-ccloud-connector-in-browser COMMAND
    options: []
    subcommands:
      - name: automatically
        description: | 
          automatically open the connector in browser
        usage: playground config open-ccloud-connector-in-browser automatically [AUTOMATICALLY]
        options: []
      - name: browser
        description: | 
          browser to use
        usage: playground config open-ccloud-connector-in-browser browser [BROWSER]
        options: []
  - name: open-grafana-in-browser
    description: | 
        when running an example with --enable-jmx-grafana flag, it opens grafana in browser
        
    usage: playground config open-grafana-in-browser COMMAND
    options: []
    subcommands:
      - name: automatically
        description: | 
          automatically open grafana in browser
        usage: playground config open-grafana-in-browser automatically [AUTOMATICALLY]
        options: []
      - name: browser
        description: | 
          browser to use
        usage: playground config open-grafana-in-browser browser [BROWSER]
        options: []
  - name: secrets
    description: | 
        🔐 Credentials required by examples
        
        Examples declare the environment variables they need. Store them once here
        and 'playground run' loads them automatically, picking only the ones the
        example at hand declares:
        
          playground secrets set SALESFORCE_PASSWORD    🔐 store it, prompted
          playground secrets check -f <example>         ✅ what is still missing
          playground run -f <example>                   🚀 loaded for you
        
        📂 Where it is stored
        
        In ~/.config/kafka-docker-playground, never in the repository, so it
        survives 'git clean -fdx' and can never be committed by mistake:
        
          secrets.ini  0600  credentials, as a reference to the backend ('op://...', 'keychain:...'), not as a value
          env.ini      0644  plain variables, in clear text
        
        A name containing PASSWORD, PASSPHRASE, SECRET, TOKEN, KEY, CREDS, PWD or
        LICENSE is treated as a credential, anything else as a plain variable
        (GCP_PROJECT, AWS_REGION, an account name, a URL). Use 'secrets set
        --secret' or '--plain' to decide yourself.
        
        🏦 Backends
        
        Where the credential values themselves are kept:
        
          - keychain     macOS Keychain
          - secret-tool  freedesktop secret service (GNOME Keyring, KWallet)
          - pass         the standard unix password manager
          - op           1Password, through the 'op' CLI
          - vault        HashiCorp Vault
          - file         clear text in secrets.ini, no encryption, last resort
        
        With no configuration, the first available of keychain (macOS), then
        secret-tool, then pass is used, and file is the fallback. op and vault
        are never picked automatically, so that an example never blocks on an
        unlock prompt. Choose one explicitly with:
        
          playground secrets backend op
        
        op creates and rotates the items it stores. vault is reference-only:
        create the secret in Vault, then point a variable at it. Any backend can
        also reuse a secret you already have, instead of storing a new one:
        
          playground secrets link SALESFORCE_PASSWORD op://Private/sfdc/password
        
        🗂️ Profiles
        
        A profile is an independent set of variables, typically one per customer
        or per support case, so last week's credentials never leak into this
        week's reproduction model:
        
          - playground secrets profile customer-123456    🗂️ switch to it
          - playground secrets profile                    📋 list them, with counts
          - playground secrets list --profile default     🎯 use one just this once
        
        Lookup falls back to the 'default' profile, so what is shared between all
        of them (CONFLUENT_LICENSE, NGROK_AUTH_TOKEN) is stored there once.
        
        🔍 Resolution order
        
          1. an exported environment variable, which always wins
          2. the active profile
          3. the default profile
        
        So 'export FOO=bar' and 'source secret.properties' keep working, and
        'playground secrets list' flags what the environment overrides.
        
        ⚙️ Configuration
        
          - playground config set secrets.backend <backend>      🏦 see above
          - playground config set secrets.profile <name>         🗂️ active profile
          - playground config set secrets.op-vault <vault>       🔑 1Password vault
        
        PLAYGROUND_SECRETS_DIR, PLAYGROUND_SECRETS_BACKEND,
        PLAYGROUND_SECRETS_PROFILE and PLAYGROUND_OP_VAULT override them for a
        single command.
    usage: playground secrets COMMAND
    options: []
    subcommands:
      - name: set
        description: | 
          🔐 Store a credential
            
            Without --value the value is prompted without echo, so it never lands in
            the shell history.
            
            A name that looks like a credential (PASSWORD, SECRET, TOKEN, KEY, CREDS,
            PWD, PASSPHRASE, LICENSE) goes to the secure backend, anything else is
            kept as a plain variable. Use --secret or --plain to decide yourself.
            
            Run again on a name already stored to rotate it. The value is then
            updated where the existing reference points, which is not necessarily
            the backend currently configured.
            
            🎓 Tip: set the config key secrets.github-repo and every value stored
            here is also pushed to that repository's GitHub Actions secrets.
        usage: playground secrets set NAME [OPTIONS]
        options:
        - names:
          - --value
          argument: VALUE
          description: | 
            🔓 Value to store
            
            ❗ it will be visible in your shell history, prefer the prompt ❗
            
        - names:
          - --secret
          argument: ""
          description: | 
            🔐 Treat the value as a credential, whatever the variable name is
            
            It goes to the secure backend (keychain, 1Password, pass…) instead of
            being kept in clear text.
            
            Conflicts with: --plain
            
        - names:
          - --plain
          argument: ""
          description: | 
            📝 Treat the value as a non sensitive variable
            
            It is kept in clear text in env.ini, which is handy for a URL, an
            account name or a project id.
            
            Conflicts with: --secret
            
        - names:
          - --profile
          argument: PROFILE
          description: | 
            🗂️ Secrets profile to use (default is the active one)
            
      - name: get
        description: | 
          🔍 Show a stored credential (masked unless --reveal is used)
            
            Resolved the same way an example does: an exported environment variable
            first, then the active profile, then the default one.
        usage: playground secrets get NAME [OPTIONS]
        options:
        - names:
          - --reveal
          argument: ""
          description: | 
            👀 Print the value in clear text
            
            ❗ it will be visible in your terminal scrollback ❗
            
        - names:
          - --profile
          argument: PROFILE
          description: | 
            🗂️ Secrets profile to use (default is the active one)
            
      - name: unset
        description: | 
          🗑️ Remove a stored credential
            
            The value goes too, not only the reference: the keychain entry is
            deleted, the 1Password item is archived.
            
            A secret pointed at with 'playground secrets link' is left untouched,
            since it belongs to you and not to the playground.
        usage: playground secrets unset NAME [OPTIONS]
        options:
        - names:
          - --profile
          argument: PROFILE
          description: | 
            🗂️ Secrets profile to use (default is the active one)
            
      - name: list
        description: | 
          📋 List stored credentials
            
            Values are never printed: secrets are shown as a masked fingerprint
            (last 4 characters and a sha256 prefix), which is enough to tell whether
            it is the token you rotated yesterday. Plain variables are shown as is.
            
            Two markers to look out for:
            
              ⚠️ overridden by the environment   an exported variable is what the
                                                example will actually get
              ❌ cannot be resolved              the reference is there but the
                                                backend gave nothing back, usually
                                                a locked session or a deleted item
        usage: playground secrets list [OPTIONS]
        options:
        - names:
          - --show-source
          argument: ""
          description: | 
            🔗 Show the backend reference instead of the fingerprint
            
        - names:
          - --profile
          argument: PROFILE
          description: | 
            🗂️ Secrets profile to use (default is the active one)
            
      - name: link
        description: | 
          🔗 Point a variable at a secret manager, without storing any value
            
            The store then only contains a reference, which is safe to back up, sync
            between machines, or share with your team.
            
            Use it to reuse a secret that already exists, rather than storing a
            second copy of it, and for the vault backend which playground never
            writes to. The reference is resolved right away, so a typo or a locked
            session is reported on the spot.
            
            'playground secrets unset' drops the reference but leaves the secret
            itself alone.
        usage: playground secrets link NAME REFERENCE [OPTIONS]
        options:
        - names:
          - --profile
          argument: PROFILE
          description: | 
            🗂️ Secrets profile to use (default is the active one)
            
      - name: check
        description: | 
          ✅ Show what an example needs, and what is missing
            
            One line per variable, saying where the value comes from (environment,
            or which backend and which reference) or how to store it. AWS and GCP
            examples also get their ~/.aws/credentials and keyfile.json checked.
            
            The list comes from the example itself: every variable it declares with
            the standard 'Export it as environment variable or pass it as argument'
            error string, which is also what 'playground run' loads.
            
            Exits 1 when something is missing.
            
            🎓 Tip: run it before a long example, it fails in a second instead of
            several minutes into the environment startup.
        usage: playground secrets check [OPTIONS]
        options:
        - names:
          - --file
          - -f
          argument: FILE
          description: | 
            📄 Example script (default is the last example ran)
            
        - names:
          - --profile
          argument: PROFILE
          description: | 
            🗂️ Secrets profile to use (default is the active one)
            
      - name: env
        description: | 
          🐚 Export what an example needs into the current shell
            
            This is the replacement for 'source secret.properties'. Instead of putting
            every credential into every shell, it exports only the variables the example
            at hand declares, read from the secrets store:
            
              source <(playground secrets env)
            
            Handy when copy pasting pieces of an example script into a terminal. With no
            --file it uses the last example ran, like 'playground secrets check'.
            
            The shell code goes to stdout and everything else to stderr, so nothing
            unexpected ever gets executed. Running it straight in a terminal is
            refused rather than printing every value on screen, use --force for
            that.
            
            🎓 Tip: put a shortcut in your shell profile:
            
              alias pgenv='source <(playground secrets env)'
        usage: playground secrets env [OPTIONS]
        options:
        - names:
          - --file
          - -f
          argument: FILE
          description: | 
            📄 Example script (default is the last example ran)
            
        - names:
          - --all
          argument: ""
          description: | 
            📦 Export the whole profile, not only what the example needs
            
        - names:
          - --force
          argument: ""
          description: | 
            🙈 Print to a terminal anyway, showing every value in clear
            
        - names:
          - --profile
          argument: PROFILE
          description: | 
            🗂️ Secrets profile to use (default is the active one)
            
      - name: import
        description: | 
          📥 Import an existing secret.properties / variable.properties file
            
            Each KEY=value line is classified and stored in the right place. A
            leading 'export', comments, blank lines and one level of surrounding
            quotes are handled; anything that is not an uppercase variable name is
            skipped and reported.
            
            This is the one step migration away from 'source secret.properties'.
        usage: playground secrets import [OPTIONS]
        options:
        - names:
          - --file
          argument: FILE
          description: | 
            📄 File to import
            
            Required: ✓ Yes
            
        - names:
          - --shred
          argument: ""
          description: | 
            🔥 Securely delete the source file after a successful import
            
        - names:
          - --secret
          argument: ""
          description: | 
            🔐 Treat every line as a credential, whatever the variable names are
            
            Conflicts with: --plain
            
        - names:
          - --plain
          argument: ""
          description: | 
            📝 Treat every line as a non sensitive variable
            
            That is what a variables.properties file usually is: regions, project
            ids, account names, URLs.
            
            Conflicts with: --secret
            
        - names:
          - --profile
          argument: PROFILE
          description: | 
            🗂️ Secrets profile to use (default is the active one)
            
      - name: export
        description: | 
          📤 Write every credential of a profile to a file, in clear text
            
            ❗ Only for the rare case where a tool needs a properties file ❗
            
            The file is written with mode 0600, and a path inside the repository is
            refused: it would be one 'git add -A' away from being committed.
            
            🎓 Tip: to feed a shell instead of a file, 'playground secrets env' is
            what you want, it exports without writing anything to disk.
        usage: playground secrets export [OPTIONS]
        options:
        - names:
          - --file
          argument: FILE
          description: | 
            📄 Destination file, outside the repository
            
            Required: ✓ Yes
            
        - names:
          - --yes-i-want-plaintext
          argument: ""
          description: | 
            🔓 Required, this writes credentials in clear text
            
        - names:
          - --only
          argument: all
          description: | 
            🎯 Export only the credentials, only the plain variables, or both
            
            Default value: all
            
            Allowed values: secret, plain, all
            
        - names:
          - --profile
          argument: PROFILE
          description: | 
            🗂️ Secrets profile to use (default is the active one)
            
      - name: edit
        description: | 
          ✏️ Open the store in your editor
            
            secrets.ini by default, env.ini with --plain. Unless the backend is
            file, secrets.ini holds references and not values, so this is where you
            rename a variable or move one between profiles, not where you read a
            password.
            
            Uses the config key editor, then the EDITOR environment variable, then
            vi.
        usage: playground secrets edit [OPTIONS]
        options:
        - names:
          - --plain
          argument: ""
          description: | 
            📝 Edit the non sensitive variables instead of the secrets
            
      - name: backend
        description: | 
          🏦 Show or change where secrets are kept
            
              keychain     macOS Keychain, through 'security'
              secret-tool  freedesktop secret service (GNOME Keyring, KWallet)
              pass         the standard unix password manager
              op           1Password, through the 'op' CLI
              vault        HashiCorp Vault, through the 'vault' CLI
              file         clear text in secrets.ini, no encryption, last resort
            
            With no configuration, the first available of keychain (macOS),
            secret-tool and pass is used, and file is the fallback. op and vault
            have to be chosen here, so that an example never blocks on an unlock
            prompt halfway through.
            
            Only new values are affected: what is already stored keeps being read
            from, and rotated in, the backend it went to.
            
            vault is reference-only, playground never writes to it: create the
            secret there, then use 'playground secrets link'. op creates the item
            for you, named kdp-<profile>-<NAME> in the vault set by
            'playground config set secrets.op-vault' (default: Private), and can
            also point at an existing one with 'playground secrets link'.
        usage: playground secrets backend [BACKEND]
        options: []
      - name: profile
        description: | 
          🗂️ Show or switch the active profile
            
            A profile is an independent set of variables. Without an argument it
            lists them all with their variable count, and marks the active one.
            
            A variable missing from the active profile is looked up in 'default',
            so what is shared between all of them (CONFLUENT_LICENSE,
            NGROK_AUTH_TOKEN) only needs to be stored once, there.
            
            Switching is persistent, it writes the config key secrets.profile. To
            use another one just for a command, every secrets command takes
            --profile.
            
            🎓 Tip: use one profile per support case, so last week's customer
            credentials never leak into this week's reproduction model.
        usage: playground secrets profile [PROFILE]
        options: []
      - name: scan
        description: | 
          🔎 Look for stored credentials in clear text in the repository
            
            Resolves every credential of the profile and greps the working tree,
            tracked and untracked files alike, for the values themselves. Catches
            the password pasted into a reproduction model, which no pattern based
            scanner would recognise.
            
            Plain variables are skipped, a region or a bucket name is expected to
            appear in an example, and so are values shorter than 8 characters,
            which would match everywhere. Exits 1 as soon as one is found.
            
            🎓 Tip: wire it as a pre-commit hook with
            'playground secrets scan --staged'
        usage: playground secrets scan [OPTIONS]
        options:
        - names:
          - --staged
          argument: ""
          description: | 
            📦 Scan the staged diff instead of the whole working tree
            
        - names:
          - --profile
          argument: PROFILE
          description: | 
            🗂️ Secrets profile to use (default is the active one)
            
  - name: cloud-resources
    description: | 
        ☁️ What the playground left behind in your cloud accounts, and what it costs
        
        Examples that talk to a real cloud create real resources, and an
        interrupted run leaves them behind. These commands show what is still
        alive and what you are being billed for:
        
          cloud-resources aws list            resources still up, scoped to you
          cloud-resources aws costs           spend over a range of dates
          cloud-resources aws costs-history   spend per month over the last year
        
        The same three exist for azure.
        
        🧹 Nothing is deleted here. To actually remove the resources, use
           'playground cleanup-cloud-resources'.
    usage: playground cloud-resources COMMAND
    options: []
    subcommands:
      - name: aws
        description: | 
          ☁️ What is still running in AWS, and what it costs
            
              list            resources created by the playground, still alive
              costs           spend over a range of dates, by service
              costs-history   spend per month over the last year
            
            Uses the credentials and region of your aws CLI. Nothing is deleted
            here, use 'playground cleanup-cloud-resources' for that.
            
        usage: playground cloud-resources aws COMMAND
        options: []
      - name: azure
        description: | 
          ☁️ What is still running in Azure, and what it costs
            
              list            resources created by the playground, still alive
              costs           spend over a range of dates
              costs-history   spend per month over the last year
            
            Uses the subscription your az CLI is logged into. Nothing is deleted
            here, use 'playground cleanup-cloud-resources' for that.
            
        usage: playground cloud-resources azure COMMAND
        options: []
  - name: aws
    description: | 
        ☁️ What is still running in AWS, and what it costs
        
          list            resources created by the playground, still alive
          costs           spend over a range of dates, by service
          costs-history   spend per month over the last year
        
        Uses the credentials and region of your aws CLI. Nothing is deleted
        here, use 'playground cleanup-cloud-resources' for that.
        
    usage: playground cloud-resources aws COMMAND
    options: []
    subcommands:
      - name: list
        description: | 
          📋 List all active resources
            
            AWS resources created by the playground and still running, matched on
            your username. Anything in the list is still being billed.
            
        usage: playground cloud-resources aws list [OPTIONS]
        options:
        - names:
          - --user
          argument: USER
          description: | 
            ☢️ force user
            
      - name: costs
        description: | 
          💰 Show aws costs
            
            Spend over a range of dates, broken down by AWS service, using the
            Cost Explorer API. Run it after a week of heavy examples to see which
            service the money actually went to, then use
            'playground cloud-resources aws list' to find what is still up.
            
            Defaults cover the last month, ending 3 days ago because AWS needs a
            couple of days to consolidate. --start-date cannot go back more than
            one year.
            
        usage: playground cloud-resources aws costs [OPTIONS]
        options:
        - names:
          - --user
          argument: USER
          description: | 
            ☢️ force user
            
        - names:
          - --start-date
          argument: START_DATE
          description: | 
            🗓️ start date in format yyyy-mm-dd
            
            Default is 30 days ago
            
        - names:
          - --end-date
          argument: END_DATE
          description: | 
            🗓️ end date in format yyyy-mm-dd
            
              Default is 3 days ago
            
        - names:
          - --display-only-total-cost
          argument: ""
          description: | 
            💰 display only total cost
            
      - name: costs-history
        description: | 
          👛  Retrieve aws costs for each month since last year
            
            One line per month over the past year, drawn as a histogram, which
            makes a month that went wrong obvious at a glance. Use costs when you
            then want to know which service it was.
            
            By default it will only display total cost in dollars. Use the --detailed flag to see more information.
        usage: playground cloud-resources aws costs-history [OPTIONS]
        options:
        - names:
          - --detailed
          argument: ""
          description: | 
            💹 display all details for each month
            
  - name: azure
    description: | 
        ☁️ What is still running in Azure, and what it costs
        
          list            resources created by the playground, still alive
          costs           spend over a range of dates
          costs-history   spend per month over the last year
        
        Uses the subscription your az CLI is logged into. Nothing is deleted
        here, use 'playground cleanup-cloud-resources' for that.
        
    usage: playground cloud-resources azure COMMAND
    options: []
    subcommands:
      - name: list
        description: | 
          📋 List all active resources
            
            Azure resources created by the playground and still running, matched
            on your username. Anything in the list is still being billed.
            
        usage: playground cloud-resources azure list [OPTIONS]
        options:
        - names:
          - --user
          argument: USER
          description: | 
            ☢️ force user
            
      - name: costs
        description: | 
          💰 Show azure costs
            
            Spend over a range of dates for your subscription, using the Azure
            Cost Management API. You need to be logged in with the az CLI.
            
            Defaults cover the last month, ending 3 days ago because the data
            takes a couple of days to consolidate. --start-date cannot go back
            more than one year.
            
        usage: playground cloud-resources azure costs [OPTIONS]
        options:
        - names:
          - --user
          argument: USER
          description: | 
            ☢️ force user
            
        - names:
          - --start-date
          argument: START_DATE
          description: | 
            🗓️ start date in format yyyy-mm-dd
            
            Default is 30 days ago
            
        - names:
          - --end-date
          argument: END_DATE
          description: | 
            🗓️ end date in format yyyy-mm-dd
            
              Default is 3 days ago
            
        - names:
          - --display-only-total-cost
          argument: ""
          description: | 
            💰 display only total cost
            
      - name: costs-history
        description: | 
          👛  Retrieve azure costs for each month since last year
            
            One line per month over the past year, so you can spot the month that
            went wrong before digging into it with costs.
            
            By default it will only display total cost in dollars. Use the --detailed flag to see more information.
        usage: playground cloud-resources azure costs-history [OPTIONS]
        options:
        - names:
          - --detailed
          argument: ""
          description: | 
            💹 display all details for each month
            

  - name: ccloud-costs
    description: | 
        💰  Retrieve ccloud costs for a range of dates
        
        All you have to do is to be already logged in with confluent CLI. It is using https://docs.confluent.io/cloud/current/billing/overview.html#retrieve-costs-for-a-range-of-dates
        
        Cost data can take up to 72 hours to become available.
        
        Start date can reach a maximum of one year into the past
        
        One month is the maximum window between start and end dates
        
        For accuracy, Confluent recommends using a start_date that is at least 72 hours prior to the current date and time.
    usage: playground ccloud-costs [OPTIONS]
    options:
    - names:
      - --start-date
      argument: START_DATE
      description: | 
        🗓️ start date in format yyyy-mm-dd
        
        Default is 30 days ago
        
    - names:
      - --end-date
      argument: END_DATE
      description: | 
        🗓️ end date in format yyyy-mm-dd
        
          Default is 3 days ago
        
    - names:
      - --display-only-total-cost
      argument: ""
      description: | 
        💰 display only total cost
        
    subcommands:

  - name: ccloud-costs-history
    description: | 
        👛  Retrieve ccloud costs for each month since last year
        
        All you have to do is to be already logged in with confluent CLI. It is using https://docs.confluent.io/cloud/current/billing/overview.html#retrieve-costs-for-a-range-of-dates
        
        By default it will only display total cost in dollars. Use the --detailed flag to see more information.
    usage: playground ccloud-costs-history [OPTIONS]
    options:
    - names:
      - --detailed
      argument: ""
      description: | 
        💹 display all details for each month
        
    subcommands:

  - name: run
    description: | 
        🕹️ Run any example !
        
        🔥 It start an interactive mode where you'll be fully guided !
        
          playground run                       🔍 pick an example, guided
          playground run -f <example.sh>       🚀 run that one directly
          playground re-run                    ⚡ same example, same flags
        
        Each run stops what was running, starts the environment the example asks
        for, brings up its containers, creates the connector and produces data.
        Credentials the example needs are loaded from 'playground secrets'.
        
        🔢 Choosing versions
          --tag             Confluent Platform version for every component
          --connect-tag     Confluent Platform version for connect only
          --connector-tag   connector version from Confluent Hub
          --connector-zip   connector from a local zip or a URL
          --connector-jar   a single jar, dropped into the existing plugin
        
        🧰 Adding to the example
          --environment     run a connector example under another security setup
          --enable-<x>      add control-center, ksqldb, flink, grafana, kcat...
          --pipeline        chain a source example into a sink example
          --sql-datagen     continuous realistic data instead of a fixed batch
        
        
        ⛅ When running Confluent Cloud (ccloud) example:
        
          All you have to do is to be already logged in with confluent CLI.
        
          By default, a new Confluent Cloud environment with a Cluster will be created.
        
          You can configure the new cluster by setting:
        
          --cluster-type (or CLUSTER_TYPE environment variable): The type of cluster (possible values: basic, standard and dedicated, default basic)
          --cluster-cloud (or CLUSTER_CLOUD environment variable): The Cloud provider (possible values: aws, gcp and azure, default aws)
          --cluster-region (or CLUSTER_REGION environment variable): The Cloud region (use confluent kafka region list to get the list, default eu-west-2 for aws, westeurope for azure and europe-west2 for gcp)
          --cluster-environment (or ENVIRONMENT environment variable) (optional): The environment id where want your new cluster (example: txxxxx) 
        
          In case you want to use your own existing cluster, you need to setup, in addition to previous ones:
        
          --cluster-name (or CLUSTER_NAME environment variable): The cluster name
          --cluster-creds (or CLUSTER_CREDS environment variable): The Kafka api key and secret to use, it should be separated with colon (example: <API_KEY>:<API_KEY_SECRET>)
          --cluster-schema-registry-creds (or SCHEMA_REGISTRY_CREDS environment variable) (optional, if not set, new one will be created): The Schema Registry api key and secret to use, it should be separated with colon (example: <SR_API_KEY>:<SR_API_KEY_SECRET>)
        
        ❗ this command will kill all containers using "playground container kill-all", you can disable this by running "playground config container-kill-all-before-run false"
    usage: playground run [OPTIONS]
    options:
    - names:
      - --environment
      argument: plaintext
      description: | 
        🔐 The environment to start when running a connector example 
        
        - plaintext
        - ccloud
        - cfk
        - 2way-ssl
        - kerberos
        - ldap-authorizer-sasl-plain
        - ldap-sasl-plain
        - rbac-sasl-plain
        - sasl-plain
        - sasl-scram
        - sasl-ssl
        - ssl_kerberos
        
        Default is plaintext.
        This is only supported when example is a connector example
        
        Default value: plaintext
        
        Allowed values: ccloud, cfk, plaintext, sasl-ssl, sasl-plain, 2way-ssl, sasl-scram, kerberos, ssl_kerberos, ldap-authorizer-sasl-plain, ldap-sasl-plain, rbac-sasl-plain
        
    - names:
      - --file
      - -f
      argument: FILE
      description: | 
        🔖 Example file to run
        
        ❕ It must be absolute full path
        
        🎓 Tip: use <tab> completion to trigger fzf completion
        
    - names:
      - --open
      - -o
      argument: ""
      description: | 
        📖 Opening example files (including docker-compose file) with text editor set with playground config editor <editor> (default is code)
        
    - names:
      - --tag
      argument: TAG
      description: | 
        🎯 Confluent Platform (CP) version to use. Applies to all components (broker, connect, schema registry, ksqlDB, etc...)
        
        It sets TAG environment variable
        
        Must be greater or equal to 5.3.0
        
        🎓 Tip: use <tab> completion to trigger fzf completion
        
    - names:
      - --connect-tag
      argument: CONNECT_TAG
      description: | 
        🔗 Confluent Platform (CP) version to use. Applies to connect only.
        
        It sets CP_CONNECT_TAG environment variable
        
        Must be greater or equal to 5.3.0
        
        🎓 Tip: use <tab> completion to trigger fzf completion
        
    - names:
      - --connector-tag
      argument: CONNECTOR_TAG
      description: | 
        🔗 Connector version to use
        
        By default, for each connector, the latest available version on Confluent Hub is used
        
        🎓 Tip: set to " " in order to select the version dynamically
        
        Conflicts with: --connector-zip
        
    - names:
      - --connector-zip
      argument: CONNECTOR_ZIP
      description: | 
        🤐 Connector zip to use
        
        ❕ It must be absolute full path
        
        🎓 Tip: use <tab> completion to trigger fzf completion 
                use playground config folder_zip_or_jar <folder1> <folder2>... (default is home folder and current folder is always included) to configure where to search the files
                use <option+enter> to use the value you typed manually
        
        Conflicts with: --connector-tag
        
    - names:
      - --connector-jar
      argument: CONNECTOR_JAR
      description: | 
        🤎 Connector jar to use
        
        ❕ It must be absolute full path
        
        🎓 Tip: use <tab> completion to trigger fzf completion 
                use playground config folder_zip_or_jar <folder1> <folder2>... (default is home folder and current folder is always included) to configure where to search the files
                use <option+enter> to use the value you typed manually
        
    - names:
      - --enable-ksqldb
      argument: ""
      description: | 
        🚀 Enable ksqlDB 
        
        ❗ not supported with ccloud examples
        
        By default, ksqldb-server and ksqldb-cli containers are not started for every test
        
    - names:
      - --enable-rest-proxy
      argument: ""
      description: | 
        🧲 Enable Rest Proxy
        
        ❗ not supported with ccloud examples
        
        By default, rest-proxy container is not started for every test
        
    - names:
      - --enable-control-center
      argument: ""
      description: | 
        💠 Enable Control Center
        
        By default, control-center container is not started for every test
        
        Control Center is reachable at http://127.0.0.1:9021
        
    - names:
      - --enable-flink
      argument: ""
      description: | 
        🐿️ Enable Flink
        
        By default, flink is not started for every test
        
        Once enabled, the CLI will ask if you need to download any connectors. Based on the response, you can download one or more connectors from Flink maven repository.
        
        Flink UI is reacheable using http://127.0.0.1:8081 within the flink child directory. If you enable Flink by starting connector deployment, http://127.0.0.1:18081 will be used.
        
    - names:
      - --enable-conduktor
      argument: ""
      description: | 
        🐺 Enable Conduktor Platform
        
        By default, Conduktor Platform container is not started for every test
        
        Conduktor is reachable at http://127.0.0.1:8080/console (admin/admin)
        
    - names:
      - --enable-multiple-brokers
      argument: ""
      description: | 
        3️⃣ Enable multiple brokers
        
        By default, there is only one broker node enabled
        
    - names:
      - --enable-multiple-connect-workers
      argument: ""
      description: | 
        🥉 Enable multiple connect worker node
        
        By default, there is only one connect worker node enabled
        
    - names:
      - --enable-jmx-grafana
      argument: ""
      description: | 
        Enable Grafana, Prometheus and Pyroscope
        
        📊 Grafana is reachable at http://127.0.0.1:3000 (login/password is admin/password)
        
        🛡️ Prometheus is reachable at http://127.0.0.1:9090
        
        📛 Pyroscope is reachable at http://127.0.0.1:4040
        
    - names:
      - --enable-kcat
      argument: ""
      description: | 
        🐈‍⬛ Enable kcat
        
        You can use it with:
        
        $ docker exec kcat kcat -b broker:9092 -L
        
    - names:
      - --enable-sql-datagen
      argument: ""
      description: | 
        🌪️ Enable SQL Datagen injection
        
        This only works for Oracle, MySql, Postgres and Microsoft Sql Server source connector examples with JDBC and Debezium
        
    - names:
      - --cluster-cloud
      argument: [aws, gcp, azure]
      description: | 
        🌤 The cloud provider: aws, gcp or azure. Default is aws
        
        🎓 Tip: you can also use CLUSTER_CLOUD environment variable
        
        Allowed values: aws, gcp, azure
        
    - names:
      - --cluster-type
      argument: [basic, standard, dedicated]
      description: | 
        🔋 The cluster type: basic, standard or dedicated. Default is basic
        
        🎓 Tip: you can also use CLUSTER_TYPE environment variable
        
        Allowed values: basic, standard, dedicated
        
    - names:
      - --cluster-region
      argument: CLUSTER-REGION
      description: | 
        🗺 The Cloud region. 
        
        🎓 Tip: you can also use CLUSTER_REGION environment variable
        🎓 Tip: use <tab> completion to trigger fzf completion
        
    - names:
      - --cluster-environment
      argument: CLUSTER-ENVIRONMENT
      description: | 
        🌐 The environment id where want your new cluster (example: txxxxx)
        
        ℹ️ Optional, if not set, new environment will be created
        
        🎓 Tip: you can also use ENVIRONMENT environment variable
        🎓 Tip: use <tab> completion to trigger fzf completion
        
    - names:
      - --cluster-name
      argument: CLUSTER-NAME
      description: | 
        🎰 The cluster name. 
        
        ❣️ Only required if you want to use your own existing cluster
        
        🎓 Tip: you can also use CLUSTER_NAME environment variable
        🎓 Tip: use <tab> completion to trigger fzf completion
        
    - names:
      - --cluster-creds
      argument: CLUSTER-CREDS
      description: | 
        🔒 The Kafka api key and secret to use, it should be separated with colon (example: <API_KEY>:<API_KEY_SECRET>)
        
        ❣️ Only required if you want to use your own existing cluster
        
        🎓 Tip: you can also use CLUSTER_CREDS environment variable
        
    - names:
      - --cluster-schema-registry-creds
      argument: CLUSTER-SCHEMA-REGISTRY-CREDS
      description: | 
        🔒 The Schema Registry api key and secret to use, it should be separated with colon (example: <SR_API_KEY>:<SR_API_KEY_SECRET>)
        
        ℹ️ Optional, if not set, new credentials will be created
        
        ❣️ Only required if you want to use your own existing cluster
        
        🎓 Tip: you can also use SCHEMA_REGISTRY_CREDS environment variable
        
    - names:
      - --force-interactive-re-run
      argument: ""
      description: | 
        Force interactive mode
        
    - names:
      - --force-interactive-repro
      argument: ""
      description: | 
        Force interactive mode
        
    subcommands:

  - name: re-run
    description: | 
        ⚡ Simply re-run last example you ran with <playground run>
        
        Same script and same flags as last time: the --tag, --connector-tag,
        --connector-zip and --enable-* you picked are replayed from playground.ini,
        so there is nothing to retype after a code change.
        
        🎓 Tip: to re-run with a different version, use 'playground run' again and
        change the flag, or 'playground update-version' on the running example.
    usage: playground re-run
    options: []
    subcommands:

  - name: get-ci-result
    description: | 
        🤖 get CI result for current example
        
        Tells you whether the example you are running is green in the nightly CI,
        both for the default environment and for cfk, by reading the published
        badges from kafka-docker-playground.io.
        
        👉 Useful before you spend time debugging: if CI is red too, the breakage
        is probably not on your side. Reproduction models are always reported as
        fine, they are not part of the CI matrix.
    usage: playground get-ci-result
    options: []
    subcommands:

  - name: history
    description: | 
        🏰 Get an history of the examples which were run with run command and run it again
        
        Opens a picker over every 'playground run' command you have executed,
        most recent first and de-duplicated. The command you select is shown for
        editing before it runs, so you can change a --tag or add a flag on the way.
    usage: playground history
    options: []
    subcommands:

  - name: find-example
    description: | 
        🔎 Find examples matching a free-text query, without the interactive picker
        
        Searches every runnable example script (connect/, ccloud/, ksqldb/,
        flink/, reproduction-models/, ...) by path, connector class, README title
        and script body. Every word of the query must match somewhere; matches in
        the path and connector class rank higher than matches in the body.
        
        Prints the ready-to-paste 'playground run -f' command for each hit, best
        first. Use 'playground run' instead to browse examples interactively.
    usage: playground find-example QUERY [OPTIONS] [--] [MORE QUERY WORDS...]
    options:
    - names:
      - --category
      argument: [connect, ccloud, ksqldb, flink, schema-registry, rest-proxy, multi-data-center, other, operator, academy, environment, reproduction-models]
      description: | 
        📂 Restrict the search to one top-level folder
        
        Allowed values: connect, ccloud, ksqldb, flink, schema-registry, rest-proxy, multi-data-center, other, operator, academy, environment, reproduction-models
        
    - names:
      - --limit
      argument: 10
      description: | 
        🔢 Maximum number of hits (default 10)
        
        Default value: 10
        
    subcommands:

  - name: switch-ccloud
    description: | 
        🌩️  Switch to ccloud environment.
        
        It will bootstrap ccloud environment based on your previously ran ccloud example.
        
        Points the CLI at the Confluent Cloud cluster of your last ccloud run, so
        that 'playground topic', 'playground connector' and 'playground schema'
        talk to Confluent Cloud instead of the local containers. Nothing is
        created or destroyed, and no container is started or stopped.
        
        ❕ Requires that you ran a ccloud example at least once, so that the
           environment, cluster and credentials are cached in playground.ini.
           The environment you were on is remembered for 'playground switch-back'.
    usage: playground switch-ccloud
    options: []
    subcommands:

  - name: switch-back
    description: | 
        💺  Switch back from previous environment before switch-ccloud was called.
        
        Restores the environment and connector type that were active before
        'playground switch-ccloud', so the CLI talks to your local containers
        again.
    usage: playground switch-back
    options: []
    subcommands:

  - name: update-version
    description: | 
        ✨ Update current confluent platform components (all with --tag or only connect with --connect-tag) or connector(s) with new version(s)
        
        Re-runs the example you are currently on with different versions, which is
        the fastest way to answer "does it still happen on 8.x?" or "is it fixed in
        connector 10.6.0?".
        
          --tag            🔢 every Confluent Platform component
          --connect-tag    🔗 only the connect container, other components untouched
          --connector-tag  🧩 the connector, from Confluent Hub
          --connector-zip  📦 the connector, from a local zip or a URL
          --connector-jar  ☕ a single jar, dropped into the existing plugin
        
        With no flag, you are prompted with the versions available. The versions
        currently running are read from the broker and connect containers, so the
        example must be up.
        
        🎓 Tip: this is a version bisect tool. Keep the example running and call it
        repeatedly until you find the version where the behaviour changes.
    usage: playground update-version [OPTIONS]
    options:
    - names:
      - --tag
      argument: TAG
      description: | 
        🎯 Confluent Platform (CP) version to use. Applies to all components (broker, connect, schema registry, ksqlDB, etc...)
        
        It sets TAG environment variable
        
        Must be greater or equal to 5.3.0
        
        🎓 Tip: use <tab> completion to trigger fzf completion
        
    - names:
      - --connect-tag
      argument: CONNECT_TAG
      description: | 
        🔗 Confluent Platform (CP) version to use. Applies to connect only.
        
        It sets CP_CONNECT_TAG environment variable
        
        Must be greater or equal to 5.3.0
        
        🎓 Tip: use <tab> completion to trigger fzf completion
        
    - names:
      - --connector-tag
      argument: CONNECTOR_TAG
      description: | 
        🔗 Connector version to use
        
        By default, for each connector, the latest available version on Confluent Hub is used
        
        🎓 Tip: set to " " in order to select the version dynamically
        
        Conflicts with: --connector-zip
        
    - names:
      - --connector-zip
      argument: CONNECTOR_ZIP
      description: | 
        🤐 Connector zip to use
        
        ❕ It must be absolute full path
        
        🎓 Tip: use <tab> completion to trigger fzf completion 
                use playground config folder_zip_or_jar <folder1> <folder2>... (default is home folder and current folder is always included) to configure where to search the files
                use <option+enter> to use the value you typed manually
        
        Conflicts with: --connector-tag
        
    - names:
      - --connector-jar
      argument: CONNECTOR_JAR
      description: | 
        🤎 Connector jar to use
        
        ❕ It must be absolute full path
        
        🎓 Tip: use <tab> completion to trigger fzf completion 
                use playground config folder_zip_or_jar <folder1> <folder2>... (default is home folder and current folder is always included) to configure where to search the files
                use <option+enter> to use the value you typed manually
        
    subcommands:

  - name: open
    description: | 
        👐 When --file is not provided, simply open last example you ran with <playground run>
        
        Otherwise, open any file from the playground using --file.
        
        Opens in the editor of your choice: 'playground config editor code'
        (or vi, nano, sublime, etc). Add --open-docker-compose to also open the
        docker-compose override file the example uses, which is where the
        containers around Kafka are defined.
    usage: playground open [OPTIONS]
    options:
    - names:
      - --file
      - -f
      argument: FILE
      description: | 
        🔎 Search any file and open it.
        
        ❕ It must be absolute full path
        
        🎓 Tip: use <tab> completion to trigger fzf completion
                use <option+enter> to use the value you typed manually
        
    - names:
      - --open-docker-compose
      argument: ""
      description: | 
        🐳 Also open associated docker-compose file for the current example
        
    - names:
      - --wait
      argument: ""
      description: | 
        😴 Wait
        
    subcommands:

  - name: stop
    description: | 
        🛑 Stop currently running example
        
        Tears down every container of the environment and of the example, and
        removes their volumes, by replaying the docker compose command stored in
        playground.ini. Nothing is left behind, so the next example starts clean.
        
        ❕ Data is not kept: topics, connectors and the content of the databases
           started by the example are gone.
    usage: playground stop
    options: []
    subcommands:

  - name: remove-all-docker-images
    description: | 
        🧨 Remove all docker images (including docker volumes)
        
        Reclaims disk space by wiping your whole local Docker state, not just the
        playground one. Everything has to be pulled again afterwards, so the next
        run is slow.
        
        🎓 Tip: prefer 'playground remove-cp-docker-images' to drop only the
        Confluent Platform versions you no longer test.
    usage: playground remove-all-docker-images
    options: []
    subcommands:

  - name: remove-cp-docker-images
    description: | 
        🧹 Remove all Confluent Platform docker images related to a version installed locally (a confirmation will be required for every version present)
        
        Each Confluent Platform version you have ever run keeps a dozen images on
        disk, so this is usually where the space went. You are asked before every
        version, unless you name one with --version.
        
        The default version used by the playground is never proposed for removal.
    usage: playground remove-cp-docker-images [OPTIONS]
    options:
    - names:
      - --version
      argument: VERSION
      description: | 
        🔢 Specific version to remove
        
    subcommands:

  - name: refresh-cp-docker-images
    description: | 
        🔄 Refresh (pull from Docker) all Confluent Platform docker images related to a version installed locally
        
            It also refreshes images for aws, gcp and azure cli
        
        Useful when a version tag has been re-published, or when the cloud CLI
        images have drifted behind the API they talk to.
    usage: playground refresh-cp-docker-images [OPTIONS]
    options:
    - names:
      - --version
      argument: VERSION
      description: | 
        🔢 Specific version to pull 
        
        Required: ✓ Yes
        
    subcommands:

  - name: cleanup-cloud-details
    description: | 
        🧼 playground is actively caching ccloud details (https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%8c%a4%ef%b8%8f-confluent-cloud-examples)
           use this command if you notice that the playground is using unexpected ccloud details
        
        Drops the cached environment, cluster, endpoints and API keys, so the next
        ccloud example re-discovers them from scratch. Typically needed after you
        changed of Confluent Cloud organisation, or deleted the cluster from the UI
        behind the playground's back.
        
        ❕ Nothing is deleted in Confluent Cloud, only the local cache. To delete
           the cloud resources themselves, see 'playground cleanup-cloud-resources'.
    usage: playground cleanup-cloud-details
    options: []
    subcommands:

  - name: open-docs
    description: | 
        🧑‍🎓 Open Confluent documentation of currently running example
        
        Jumps straight to the official Confluent page for the connector or feature
        the running example demonstrates, so you do not have to search for it.
    usage: playground open-docs [OPTIONS]
    options:
    - names:
      - --only-show-url
      argument: ""
      description: | 
        🌐 Only show url
        
    subcommands:

  - name: open-changelog
    description: | 
        📜 Open playground changelog (https://kafka-docker-playground.io/#/changelog)
    usage: playground open-changelog [OPTIONS]
    options:
    - names:
      - --only-show-url
      argument: ""
      description: | 
        🌐 Only show url
        
    subcommands:

  - name: cleanup-cloud-resources
    description: | 
        🧹 Cleanup cloud resources that were created by running examples from the playground
        
        ❗it will remove all resources created by the playground, including topics, connectors, clusters, buckets, redshift cluster, etc...
        
        Examples that talk to a real cloud create real, billable resources, and an
        interrupted run leaves them behind. This sweeps them, scoped to the ones
        whose name contains your username, across AWS, GCP, Azure, Confluent Cloud
        and Salesforce. Restrict the scope with --resource, and run it regularly.
        
        You are asked to confirm every deletion, unless --force is given.
        
        ☢️ Deletions are permanent. Use a dedicated cloud account for the
           playground rather than one that also hosts resources you care about.
    usage: playground cleanup-cloud-resources [OPTIONS]
    options:
    - names:
      - --force
      argument: ""
      description: | 
        ☢️ do not ask for confirmation
        
        ❗use with caution
        
    - names:
      - --user
      argument: USER
      description: | 
        ☢️ force user
        
    - names:
      - --resource
      argument: ["aws", "gcp", "azure", "ccloud", "salesforce"]
      description: | 
        🛁 resource to cleanup
        
        If not provided, all of them are cleaned up
        
        🎓 Tip: you can pass multiple resources by specifying --resource multiple times
        
        Repeatable: ✓ Yes
        
        Default value: ["aws", "gcp", "azure", "ccloud", "salesforce"]
        
        Allowed values: aws, gcp, azure, ccloud, salesforce
        
    subcommands:
  - name: repro
    description: | 
        👷‍♂️ Reproduction model commands
        
        A reproduction model is an example written to demonstrate one specific
        problem, so that anyone can reproduce it with a single command.
        
          bootstrap   scaffold one from an existing example, then edit it
          export      package the models you have not committed, as a tgz
          import      unpack a tgz someone sent you, and run it
        
        👉 Always scaffold with bootstrap rather than copying a script by hand: it
        creates the header, the docker compose override, the CLI cheat sheet and
        registers the model, which a hand-written file would be missing.
        
        Keep a model minimal and about one issue, state expected versus actual
        behaviour in its comments header, and never put customer data in it.
    usage: playground repro COMMAND
    options: []
    subcommands:
      - name: export
        description: | 
          📤 Export as tgz file uncommitted reproduction models from the folder of current reproduction model
            
            Produces a single tgz that a colleague can feed to
            'playground repro import' to run your scenario as is. Use --all to take
            every uncommitted model rather than only the current folder.
        usage: playground repro export [OPTIONS]
        options:
        - names:
          - --all
          argument: ""
          description: | 
            Export all uncommitted reproduction models
            
      - name: import
        description: | 
          📥 Import tgz file which was created with export command
            
            Unpacks the models into your reproduction-models folder, from where you
            can run them with 'playground run'.
        usage: playground repro import [OPTIONS]
        options:
        - names:
          - --file
          - -f
          argument: FILE
          description: | 
            🤐 playground_repro_export.tgz file
            
            ❕ It must be absolute full path
            
            🎓 Tip: use <tab> completion to trigger fzf completion 
                    use playground config folder_zip_or_jar <folder1> <folder2>... (default is home folder and current folder is always included) to configure where to search the files
            
      - name: bootstrap
        description: | 
          🛠  Bootstrap reproduction model, just run <playground repro bootstrap> !
            
            🔥 HIGHLY RECOMMENDED: start in interactive mode by simple running <playground repro bootstrap> !
            
            👉 Check documentation https://kafka-docker-playground.io/#/reusables?id=%f0%9f%9b%a0-bootstrap-reproduction-model
        usage: playground repro bootstrap [OPTIONS]
        options:
        - names:
          - --file
          - -f
          argument: FILE
          description: | 
            🔖 Example file to use as basis, if not set, currently running example is used
            
            ❕ It must be absolute full path
            
            🎓 Tip: use <tab> completion to trigger fzf completion
            
        - names:
          - --description
          - -d
          argument: DESCRIPTION
          description: | 
            💭 Description for the reproduction model
            
        - names:
          - --producer
          - -p
          argument: none
          description: | 
            🤎 Java producer type to use
            
            One of avro, avro-with-key, protobuf, protobuf-with-key, json-schema, json-schema-with-key
            
            🎓 Tip: Most of times, it's much simpler to use 'playground topic produce'. Use java producer only if you have very specific requirements such as specifying record timestamp or to do perf testing (even though CLI is also good for that)
            
            🎓 Tip: 'with-key' will also produce key with selected converter, otherwise LongConverter is used
            
            Default value: none
            
            Allowed values: none, avro, avro-with-key, protobuf, protobuf-with-key, json-schema, json-schema-with-key
            
            Conflicts with: --pipeline
            
        - names:
          - --nb-producers
          - -n
          argument: NB-PRODUCERS
          description: | 
            2️⃣ Number of java producers to generate
            
        - names:
          - --producer-schema-key
          argument: ""
          description: | 
            🔰 Schema to use for the key
            
            ✨ Copy and paste the schema you want to use for the key, save and close the file to continue
            
        - names:
          - --producer-schema-value
          argument: ""
          description: | 
            🔰 Schema to use for the value
            
            ✨ Copy and paste the schema you want to use for the key, save and close the file to continue
            
        - names:
          - --custom-smt
          argument: ""
          description: | 
            🔧 Add a custom SMT (which is a no-op)
            
        - names:
          - --connector-plugin
          argument: CONNECTOR-PLUGIN
          description: | 
            🔌 Add Connector plugin to CONNECT_PLUGIN_PATH
            
            🎓 Tip: use <tab> completion to trigger fzf completion
            
            Repeatable: ✓ Yes
            
        - names:
          - --pipeline
          argument: SINK_FILE
          description: | 
            🔖 Sink example file to use for creating a pipeline. multiple --pipeline flags can be used to create a pipeline with multiple sinks.
            
            ❕ It must be absolute full path. 
            
            🎓 Tip: use <tab> completion to trigger fzf completion
            
            Repeatable: ✓ Yes
            
            Conflicts with: --producer
            

  - name: get-docker-compose
    description: | 
        🐋 Get docker-compose
        
        Prints the fully resolved docker compose configuration of the running
        example: every file merged, every profile applied and every variable
        substituted. This is what Docker actually received, which is the thing to
        look at when a container did not get the image, port or setting you
        expected.
    usage: playground get-docker-compose
    options: []
    subcommands:
  - name: schema
    description: | 
        🔰 Schema commands
        
        Talk to the Schema Registry of the running environment, whether it is the
        local container or the one in Confluent Cloud, without building the urls
        and the credentials yourself.
        
        🔍 Read
          get                  every version of a subject, or of all subjects
          get-compatibility    the compatibility rule in force
          get-mode / get-alias
        
        ✍️ Write
          register             add a new version to a subject
          delete               a version, or the whole subject
          set-compatibility    relax or tighten the evolution rule
          set-mode             READWRITE, READONLY or IMPORT
          set-normalize, validate-new-schemas   registry-wide behaviour
          set-alias            point one subject name at another
        
        🪄 derive-schema turns a sample payload into an avro, json schema or
        protobuf schema, which saves writing one by hand.
        
        A subject is normally named after the topic: <topic>-key and
        <topic>-value. 'playground topic delete' removes both along with the
        topic.
    usage: playground schema COMMAND
    options: []
    subcommands:
      - name: get
        description: | 
          🔰 Get all schemas versions for specified subject (if --subject is not specified, all subjects will be used)
        usage: playground schema get [OPTIONS]
        options:
        - names:
          - --subject
          argument: SUBJECT
          description: | 
            📛 Subject name
            
            Conflicts with: id
            
        - names:
          - --id
          argument: ID
          description: | 
            💯 Schema id
            
            Conflicts with: subject, deleted
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --deleted
          argument: ""
          description: | 
            🧟 Include soft deleted subjects
            
            Conflicts with: id
            
        - names:
          - --store-in-tmp
          argument: FOLDER
          description: | 
            store in /tmp folder
            
      - name: register
        description: | 
          ⏺️ Register a schema in specified subject
            
            Pushes a schema into the registry without producing any data, which is
            how you set up a subject before a connector starts, or add a new version
            to check whether it passes the compatibility rules.
            
            The format is detected from what you give it, avro, json schema or
            protobuf all work. Pass it on stdin with a quoted heredoc, or pick one of
            the bundled schemas with tab completion on --schema.
            
            Remember the naming convention: a topic's schemas live under the subjects
            <topic>-key and <topic>-value, not under the topic name.
            
            ☢️ --id forces a specific schema id and overwrites whatever is already
            registered at that id. It exists to reproduce id collisions, it is not
            something to use casually.
        usage: playground schema register [OPTIONS]
        options:
        - names:
          - --subject
          argument: SUBJECT
          description: | 
            📛 Subject name
            
            Required: ✓ Yes
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --schema
          argument: SCHEMA
          description: | 
            🔥 You can either:
            
            * Set your own schema (avro, json-schema, protobuf) with stdin (see example section). 
            
            * Use completion to select predefined schemas (or use your own schema file) 🎓 Tip: use <tab> completion to trigger fzf completion
            
            Default value: -
            
        - names:
          - --id
          argument: ID
          description: | 
            ☢️ Force schema id
            
            ❗it will replace any schema which already exists at given id
            
        - names:
          - --metadata-property
          argument: METADATA-PROPERTY
          description: | 
            🟡 Add metadata properties to schema contract
            
            See docs: https://docs.confluent.io/platform/current/schema-registry/fundamentals/data-contracts.html#metadata-properties
            
            🎓 Tip: you can pass multiple properties by specifying --metadata-property multiple times
            
            Example: --metadata-property "metadata1=value" --metadata-property "metadata2=value"
            
            Repeatable: ✓ Yes
            
        - names:
          - --normalize
          argument: ""
          description: | 
            🫧 Add ?normalize=true at the end of the request to normalize the schema. The default is false.
            
      - name: get-compatibility
        description: | 
          🛡️ Get subject-level compatibility
            
            The rule that decides whether a new schema version is accepted. When a
            producer fails with "Schema being registered is incompatible with an
            earlier schema", this is what rejected it.
        usage: playground schema get-compatibility [OPTIONS]
        options:
        - names:
          - --subject
          argument: SUBJECT
          description: | 
            📛 Subject name
            
            Required: ✓ Yes
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: set-compatibility
        description: | 
          🛡️ Set subject-level compatibility
            
            Overrides the rule for one subject:
            
              BACKWARD     new schema can read data written with the previous one
              FORWARD      previous schema can read data written with the new one
              FULL         both
              NONE         anything is accepted
              *_TRANSITIVE checked against all past versions, not just the last
            
            Set it to NONE when you deliberately want to register an incompatible
            schema, typically to reproduce what it does to consumers downstream.
        usage: playground schema set-compatibility [OPTIONS]
        options:
        - names:
          - --subject
          argument: SUBJECT
          description: | 
            📛 Subject name
            
            Required: ✓ Yes
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --compatibility
          argument: [BACKWARD, BACKWARD_TRANSITIVE, FORWARD, FORWARD_TRANSITIVE, FULL, FULL_TRANSITIVE, NONE]
          description: | 
            Schema Registry compatibility rule
            
            Required: ✓ Yes
            
            Allowed values: BACKWARD, BACKWARD_TRANSITIVE, FORWARD, FORWARD_TRANSITIVE, FULL, FULL_TRANSITIVE, NONE
            
      - name: get-mode
        description: | 
          🔏 Get subject-level mode
            
            READWRITE normally; READONLY if registration has been frozen; IMPORT
            while schemas are being migrated with their original ids and versions.
        usage: playground schema get-mode [OPTIONS]
        options:
        - names:
          - --subject
          argument: SUBJECT
          description: | 
            📛 Subject name
            
            Required: ✓ Yes
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: set-mode
        description: | 
          🔏 Set subject-level mode
            
              READWRITE   the normal mode, schemas can be read and registered
              READONLY    freeze the subject, registration is refused
              IMPORT      allow registering schemas at a chosen id and version,
                          which is what a migration between registries needs
            
            ⚠️ To enable mode changes on a Schema Registry cluster, you must also set
            mode.mutability=true in the Schema Registry properties file before
            starting Schema Registry, otherwise this command is rejected.
        usage: playground schema set-mode [OPTIONS]
        options:
        - names:
          - --subject
          argument: SUBJECT
          description: | 
            📛 Subject name
            
            Required: ✓ Yes
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --mode
          argument: [IMPORT, READONLY, READWRITE]
          description: | 
            Schema Registry mode
            
            Required: ✓ Yes
            
            Allowed values: IMPORT, READONLY, READWRITE
            
      - name: set-normalize
        description: | 
          🧽 Set normalize at schema registry level
            
            With normalization on, the registry rewrites a schema into a canonical
            form before storing it, so two schemas that differ only in field order,
            whitespace or the way defaults are written get the same id instead of
            creating a new version every time.
            
            This applies to the whole registry, not to one subject. Turn it on when
            an example keeps registering a new version of an unchanged schema.
            
            See https://docs.confluent.io/platform/current/schema-registry/fundamentals/serdes-develop/index.html#schema-normalization
        usage: playground schema set-normalize [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --value
          argument: [true, false]
          description: | 
            true or false
            
            Required: ✓ Yes
            
            Allowed values: true, false
            
      - name: validate-new-schemas
        description: | 
          🩺 Validate new schemas (default is true since CP 8.2.0)
            
            Controls whether the registry checks a schema is well formed before
            accepting it. Since CP 8.2.0 this is on by default, and Avro 1.12 added
            strict namespace validation, so schemas that a customer registered years
            ago can now be rejected on a newer version.
            
            Set it to false to reproduce what that customer had, or to let a legacy
            schema through while you investigate. It applies to the whole registry.
            
            See https://docs.confluent.io/cloud/current/sr/fundamentals/serdes-develop/index.html#supported-formats:~:text=Strict%20namespace%20validation%20with%20Avro%20version%201.12
        usage: playground schema validate-new-schemas [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --value
          argument: [true, false]
          description: | 
            true or false
            
            Required: ✓ Yes
            
            Allowed values: true, false
            
      - name: delete
        description: | 
          🧟 Delete schema
            
            Without --version the whole subject goes; with it, only that version.
            
            A plain delete is soft: the schema is hidden but its id and version
            number stay taken, so re-registering does not reuse them. Add
            --permanent to really remove it, which is what you need before
            re-creating the same subject from scratch.
            
            ❕ The registry requires a soft delete before a permanent one; with
               --permanent the command does both for you.
        usage: playground schema delete [OPTIONS]
        options:
        - names:
          - --subject
          argument: SUBJECT
          description: | 
            📛 Subject name to delete:
              
              if --version is provided, only that version will be deleted. Otherwise the complete subject will be deleted
            
        - names:
          - --version
          argument: VERSION
          description: | 
            🔢 Schema version of the provided subject to delete
            
            Can only be used when --subject is provided
            
        - names:
          - --permanent
          argument: ""
          description: | 
            💀 Hard delete (default is soft delete)
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: derive-schema
        description: | 
          🪄 Derive a schema based on payload
            
            Give it one or more json records, on stdin or with --payload, and it
            works out a schema that covers them all. Much faster than writing an
            avro schema by hand, and it handles unions when a field has different
            types across records.
        usage: playground schema derive-schema [OPTIONS]
        options:
        - names:
          - --payload
          argument: PAYLOAD
          description: | 
            📦 Payload to derive schema from
            
            Default value: -
            
        - names:
          - --schema-type
          argument: AVRO
          description: | 
            🧩 Schema Registry schema "type":
            
            - AVRO
            - JSON (json schema)
            - PROTOBUF
            
            Default is AVRO
            
            Default value: AVRO
            
            Allowed values: AVRO, JSON, PROTOBUF
            
      - name: set-alias
        description: | 
          🔯 Set a subject alias
            
            Makes --alias point at --subject, so a client asking for the alias gets
            the real subject's schemas. That is how you let a consumer keep its own
            subject name while the data actually lives under another one, typically
            after a topic rename or a migration between registries.
            
            CP 7.4.1 or higher is required to have this feature.
            
            See https://docs.confluent.io/platform/current/schema-registry/fundamentals/index.html#subject-aliases
        usage: playground schema set-alias [OPTIONS]
        options:
        - names:
          - --subject
          argument: SUBJECT
          description: | 
            📛 Subject name
            
            Required: ✓ Yes
            
        - names:
          - --alias
          argument: ALIAS
          description: | 
            🔯 Alias name
            
            Required: ✓ Yes
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: get-alias
        description: | 
          🔯 Get subject alias
            
            Shows which real subject an alias resolves to. Use it when a client reads
            schemas that do not match the subject it asked for, the alias is often
            the missing piece.
            
            CP 7.4.1 or higher is required to have this feature.
        usage: playground schema get-alias [OPTIONS]
        options:
        - names:
          - --alias
          argument: ALIAS
          description: | 
            🔯 Alias name
            
            Required: ✓ Yes
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
  - name: tcp-proxy
    description: | 
        🏚 Zazkia TCP Proxy commands
        
        Simulate TCP connection issues (reset,delay,throttle,corrupt) using emicklei/zazkia (https://github.com/emicklei/zazkia) TCP proxy
        
        Slips a controllable proxy between a connector and the system it talks to,
        so you can break the connection on purpose and watch what the connector
        does: does it retry, does it lose records, does it fail the task.
        
          start        put the proxy in the path, rewriting the connector config
          delay        add latency to the responses
          break        drop a percentage of the responses
          close-connection, close-all-connection-with-error
          toggle-*     cut reads or writes in one direction only
          get-connections   the live connections and their statistics
          open-ui      drive all of the above from the Zazkia web UI
        
        🎓 Tip: start with 'playground tcp-proxy open-ui' to see what is
        happening, then reproduce the same actions from the CLI in a script.
    usage: playground tcp-proxy COMMAND
    options: []
    subcommands:
      - name: start
        description: | 
          💗 Start the TCP proxy and automatically replace connector config with zazkia hostname and port 49998
            
            Starts the proxy in front of --hostname and --port, then rewrites the
            running connector configuration so its traffic goes through it. Nothing
            else to change on your side.
        usage: playground tcp-proxy start [OPTIONS]
        options:
        - names:
          - --hostname
          argument: HOSTNAME
          description: | 
            Hostname used by the tcp proxy to forward request
            
            Required: ✓ Yes
            
        - names:
          - --port
          argument: PORT
          description: | 
            Port used by the tcp proxy to forward request
            
            Required: ✓ Yes
            
        - names:
          - --throttle-service-response
          argument: 0
          description: | 
            🐌 Throttle service response. This is bytes per second.
            
            Default value: 0
            
        - names:
          - --delay-service-response
          argument: 0
          description: | 
            ⏲️ Add milliseconds delay to service response. Default is 0 ms.
            
            Default value: 0
            
        - names:
          - --break-service-response
          argument: 0
          description: | 
            💔 Percentage of broken connections. Default is 0%.
            
            Default value: 0
            
        - names:
          - --service-response-corrupt
          argument: ""
          description: | 
            🦹‍♂️ Corrupt service response with random mangled bytes. By default, there is no corruption.
            
        - names:
          - --skip-automatic-connector-config
          argument: ""
          description: | 
            🤖 By default, script will attempt to modify automatically the running connector config to use Zazkia proxy.
            
            This flag allows to skip this automatic configuration (only useful if you want to manually update connector config with zazkia tcp proxy details)
            
      - name: get-connections
        description: | 
          🧲 Get Zazkia active TCP connections config and stats
            
            Lists every TCP connection currently going through the proxy, with its
            id, its state (the toggles and the delay or break currently applied) and
            its stats (bytes sent and received each way).
            
            Start here: the id printed by this command is what the other tcp-proxy
            commands take as --connection-id. Connections in EOF state are hidden.
            
            🎓 Tip: every other tcp-proxy command applies to all active connections
            when you do not pass --connection-id, which is normally what you want.
        usage: playground tcp-proxy get-connections [OPTIONS]
        options:
        - names:
          - --connection-id
          argument: CONNECTION-ID
          description: | 
            🧲 Zazkia TCP connection id
                  
            
      - name: delay
        description: | 
          ⏲️ Add milliseconds delay to service response.
            
            Slows down every response coming back from the service, without
            breaking anything. This is how you reproduce a slow database or a slow
            API: request timeouts, retries, rebalances caused by a task that takes
            too long to answer.
            
            Set it back to 0 to remove the delay.
            
            The new state is printed afterwards, so you can check it was applied.
        usage: playground tcp-proxy delay [OPTIONS]
        options:
        - names:
          - --delay-service-response
          argument: DELAY-SERVICE-RESPONSE
          description: | 
            ⏲️ Add milliseconds delay to service response.
            
            Required: ✓ Yes
            
        - names:
          - --connection-id
          argument: CONNECTION-ID
          description: | 
            🧲 Zazkia TCP connection id
                  
            
      - name: break
        description: | 
          💔 Break sending the response to the client.
            
            Drops the response part way through, for the given percentage of
            responses. Unlike close-connection, which kills the connection once,
            this keeps failing intermittently, which is what you need to reproduce
            the flaky network a customer is seeing rather than a clean outage.
            
            Set it back to 0 to stop breaking responses.
            
            The new state is printed afterwards, so you can check it was applied.
        usage: playground tcp-proxy break [OPTIONS]
        options:
        - names:
          - --break-service-response
          argument: BREAK-SERVICE-RESPONSE
          description: | 
            💔 Percentage of broken connections.
            
            Required: ✓ Yes
            
        - names:
          - --connection-id
          argument: CONNECTION-ID
          description: | 
            🧲 Zazkia TCP connection id
                  
            
      - name: close-connection
        description: | 
          ❌ Close the Zazkia active TCP connections
            
            Kills the connection abruptly, the way a firewall or a restarted
            database would. Use it to check that the connector reconnects on its
            own, and how long it takes.
            
            Without --connection-id, every active connection is closed.
        usage: playground tcp-proxy close-connection [OPTIONS]
        options:
        - names:
          - --connection-id
          argument: CONNECTION-ID
          description: | 
            🧲 Zazkia TCP connection id
                  
            
      - name: close-all-connection-with-error
        description: | 
          🧹 Close all Zazkia TCP connections which are in error state
            
            Same as the "close all with error" button in the Zazkia UI. Connections
            left behind by a previous break or delay clutter get-connections;
            this cleans them up so you only see the live ones.
        usage: playground tcp-proxy close-all-connection-with-error
        options: []
      - name: toggle-accept-connections
        description: | 
          🙅‍♂️ Change whether new connections can be accepted
            
            Turn it off and the service looks down to anything trying to connect,
            while the connections already open keep working. That is the way to
            reproduce a connector that cannot reconnect after a failure, or an
            exhausted connection pool.
            
            This is a toggle, run it again to accept connections once more.
        usage: playground tcp-proxy toggle-accept-connections
        options: []
      - name: toggle-reads-client
        description: | 
          ✅ Change whether reading data from the client is enabled.
            
            Stops the proxy from reading what the client sends. The client's writes
            pile up in its socket buffer and it eventually blocks, which is how you
            reproduce backpressure and produce timeouts.
            
            This is a toggle, run it again to restore the flow.
            
              See diagram in https://github.com/emicklei/zazkia#how-does-it-work- (or locally http://localhost:9191/help.html)
        usage: playground tcp-proxy toggle-reads-client [OPTIONS]
        options:
        - names:
          - --connection-id
          argument: CONNECTION-ID
          description: | 
            🧲 Zazkia TCP connection id
                  
            
      - name: toggle-reads-service
        description: | 
          ✅ Change whether reading data from the service is enabled.
            
            Stops the proxy from reading what the service replies. Nothing comes
            back to the client, so requests hang until they time out, without the
            connection ever being closed. This is the classic black hole that a
            TCP keepalive misconfiguration produces.
            
            This is a toggle, run it again to restore the flow.
            
              See diagram in https://github.com/emicklei/zazkia#how-does-it-work- (or locally http://localhost:9191/help.html)
        usage: playground tcp-proxy toggle-reads-service [OPTIONS]
        options:
        - names:
          - --connection-id
          argument: CONNECTION-ID
          description: | 
            🧲 Zazkia TCP connection id
                  
            
      - name: toggle-writes-client
        description: | 
          ✅ Change whether writing data to the client is enabled.
            
            The proxy keeps reading the service's response but never forwards it to
            the client. Close to toggle-reads-service from the client's point of
            view, except the service sees its response as fully sent, so both sides
            disagree about what happened.
            
            This is a toggle, run it again to restore the flow.
            
              See diagram in https://github.com/emicklei/zazkia#how-does-it-work- (or locally http://localhost:9191/help.html)
        usage: playground tcp-proxy toggle-writes-client [OPTIONS]
        options:
        - names:
          - --connection-id
          argument: CONNECTION-ID
          description: | 
            🧲 Zazkia TCP connection id
                  
            
      - name: toggle-writes-service
        description: | 
          ✅ Change whether writing data to the service is enabled.
            
            The proxy keeps reading the client's request but never forwards it to
            the service. The client believes it sent its data, the service never
            receives it, so nothing ever answers.
            
            This is a toggle, run it again to restore the flow.
            
              See diagram in https://github.com/emicklei/zazkia#how-does-it-work- (or locally http://localhost:9191/help.html)
        usage: playground tcp-proxy toggle-writes-service [OPTIONS]
        options:
        - names:
          - --connection-id
          argument: CONNECTION-ID
          description: | 
            🧲 Zazkia TCP connection id
                  
            
      - name: open-ui
        description: | 
          🌐 Just open Zazkia UI (http://localhost:9191) in your browser
            
            The UI shows the same connections as get-connections, but live, with
            the toggles as buttons and a diagram of which direction each one cuts.
            Easier than the CLI when you are exploring, the CLI is what you put in
            a reproduction script once you know which fault you want.
        usage: playground tcp-proxy open-ui
        options: []
  - name: tools
    description: | 
        🧰 Tools commands
        
        Small utilities that are handy around the playground but are not tied to a
        running environment:
        
          read-avro-file        dump an avro file as readable json
          read-parquet-file     same, for parquet
          certs-create          generate a keystore and truststore for a component
          redos-check           check a topics.regex for catastrophic backtracking
          install-vscode-extension   playground completion inside VS Code
        
        🎓 Tip: the file readers are what you use to check what a sink connector
        really wrote, after pulling the file out with 'playground container cp'.
    usage: playground tools COMMAND
    options: []
    subcommands:
      - name: install-vscode-extension
        description: | 
          🪄 Install a slightly modified version of "Shell Script Command Completion" Visual Studio Code extension (https://marketplace.visualstudio.com/items?itemName=tetradresearch.vscode-h2o)
            
            Gives you the same completion inside VS Code as in your terminal: while
            editing an example or a reproduction model, playground commands, flags
            and their allowed values are proposed as you type, with the help text
            on hover. Worth the two minutes of setup if you write example scripts.
            
            After installation, install "playground" command:
            
            * Go on a .sh file
            
            * Type Ctrl+Shift+P (or ⌘+⇧+P on macOS) and choose "Shell Completion: Load Command Spec (experimental)"" and then type "playground"
            
            👉 Check documentation https://kafka-docker-playground.io/#/cli?id=%f0%9f%aa%84-setup-shell-script-command-completion-visual-studio-code-extension
        usage: playground tools install-vscode-extension
        options: []
      - name: read-avro-file
        description: | 
          🔖 Read provided avro file
            
            Prints the records as json, along with the writer schema embedded in the
            file. The way to check what a sink connector actually produced.
        usage: playground tools read-avro-file [OPTIONS]
        options:
        - names:
          - --file
          - -f
          argument: FILE
          description: | 
            🔖 Avro file to read
            
            ❕ It must be absolute full path
            
            🎓 Tip: use <tab> completion to trigger fzf completion
                    use <option+enter> to use the value you typed manually
            
      - name: read-parquet-file
        description: | 
          🔖 Read provided parquet file
            
            Prints the rows and the parquet schema, so you can verify what a sink
            connector wrote without an external tool.
        usage: playground tools read-parquet-file [OPTIONS]
        options:
        - names:
          - --file
          - -f
          argument: FILE
          description: | 
            🔖 Parquet file to read
            
            ❕ It must be absolute full path
            
            🎓 Tip: use <tab> completion to trigger fzf completion
                    use <option+enter> to use the value you typed manually
            
      - name: certs-create
        description: | 
          🔐 Generate keys and certificates used for SSL
            
            Creates a certificate authority and, for each container, a keystore and
            a truststore in --output-folder. This is how the certificates of the
            ssl environments are produced; regenerate them when they have expired,
            or to build a set for a container the playground does not know about.
        usage: playground tools certs-create [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: ["broker", "broker2", "broker3", "client", "schema-registry", "restproxy", "connect", "connect2", "connect3", "control-center", "clientrestproxy", "ksqldb-server", "conduktor"]
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: ["broker", "broker2", "broker3", "client", "schema-registry", "restproxy", "connect", "connect2", "connect3", "control-center", "clientrestproxy", "ksqldb-server", "conduktor"]
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --output-folder
          argument: FOLDER
          description: | 
            📁 Folder where certificates are created
            
            Required: ✓ Yes
            
      - name: redos-check
        description: | 
          🪖 Check topics.regex for ReDos vulnerabilities using recheck (https://github.com/makenowjust-labs/recheck)
            
            Some regular expressions take exponential time on certain inputs. A sink
            connector using such a pattern in topics.regex can pin a CPU and stall
            the whole worker on a topic name that happens to hit the bad case, with
            nothing in the logs to explain it.
            
            Give it the regex and it answers safe, vulnerable, or timeout when the
            analysis itself takes longer than --timeout. The exit code matches:
            0 safe, 1 vulnerable, 2 timeout.
            
            🎓 Tip: worth running whenever a customer reports a connect worker at
            100% CPU with no progress and a topics.regex in the configuration.
        usage: playground tools redos-check [OPTIONS]
        options:
        - names:
          - --topic-regex
          argument: REGEX
          description: | 
            🔣 Topic regex to test
            
            Required: ✓ Yes
            
        - names:
          - --timeout
          argument: 1
          description: | 
            Max number of seconds to wait for ReDos check.
            
            Default is 1 second
            
            Default value: 1
            
  - name: debug
    description: | 
        🐞 Debug commands
        
        The heavy tooling, made usable: the JDK utilities, tcpdump, iptables and
        the analysis tools are run inside the right container, installed on the
        fly when missing, and their output is brought back to your machine.
        
        🐌 It hangs, or it is slow
          thread-dump         what every thread is doing right now
          flight-recorder     record the JVM over a period, open it in JMC
          gc-analyze          GC pauses, heap trends and tuning advice
        
        💾 It eats memory
          heap-dump           take a .hprof, optionally as a histogram
          heap-analyze        run Eclipse MAT on it, leak suspects report
        
        🌐 It is a network or TLS problem
          tcp-dump            capture traffic, open it in Wireshark
          testssl             probe a TLS endpoint, locally or in the cloud
          block-traffic       cut a route with iptables, to simulate an outage
          java-debug          turn on the JVM SSL, Kerberos or class loading traces
        
        🔬 It is in the code
          log-level set       raise the level of any package, without a restart
          enable-remote-debugging   attach your IDE debugger to a container
          jscissors           trace method calls, arguments and return values
        
        📦 Hand it over
          generate-diagnostics   a support bundle for connect or broker
    usage: playground debug COMMAND
    options: []
    subcommands:
      - name: enable-remote-debugging
        description: | 
          ✨ Enable java remote debugging for container
            
            👉 Check documentation https://kafka-docker-playground.io/#/reusables?id=%e2%9c%a8-remote-debugging
        usage: playground debug enable-remote-debugging [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
        - names:
          - --skip-vs-code-config-display
          argument: ""
          description: | 
            
            
      - name: disable-remote-debugging
        description: | 
          🛑 Disable java remote debugging for container
        usage: playground debug disable-remote-debugging [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
      - name: testssl
        description: | 
          🔐 Testing TLS/SSL encryption using https://testssl.sh/
        usage: playground debug testssl [OPTIONS] [--] [TESTSSL ARGUMENTS...]
        options:
        - names:
          - --uri
          argument: URI
          description: | 
            host|host:port|URL|URL:port   port 443 is default, URL can only contain HTTPS protocol
            
            Required: ✓ Yes
            
      - name: generate-diagnostics
        description: | 
          ⛑️ Generate a diagnostic bundle with Diagnostics Bundle Tool
            
            ⚠️ only connect and broker containers are supported for now
            
            see https://docs.confluent.io/platform/current/tools/diagnostics-tool.html#collect-diagnostics
        usage: playground debug generate-diagnostics [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
      - name: thread-dump
        description: | 
          🎯 Take a java thread dump
            
            🔖 It will save output to a file and open with text editor set with playground config editor <editor> (default is code)
            
            The first thing to take when something is stuck: it shows the stack of
            every thread, and the deadlocks if any.
            
            🎓 Tip: take two or three dumps a few seconds apart. Threads that appear
            in the same place every time are the ones that are really blocked.
        usage: playground debug thread-dump [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
      - name: heap-dump
        description: | 
          👻 Take a heap dump
            
            🔖 It will save output to a .hprof file. VisualVM (https://visualvm.github.io/) or MAT (https://www.eclipse.org/mat/) can be used to read the file.
            
            It will run a full gc first. If you don't want this, use
        usage: playground debug heap-dump [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
        - names:
          - --live
          argument: ""
          description: | 
            🧬 dump only live objects; if not specified, all objects in the heap are dumped
            
        - names:
          - --histo
          argument: ""
          description: | 
            📊 print histogram of java object heap
            
      - name: heap-analyze
        description: | 
          🔬 Analyze a heap dump file using Eclipse MAT (Memory Analyzer Tool)
            
            📊 Generates automated leak suspects report, top components, and memory usage analysis
            
            🔖 Analyzes .hprof files and generates HTML/ZIP reports with insights
        usage: playground debug heap-analyze [OPTIONS]
        options:
        - names:
          - --file
          - -f
          argument: FILE
          description: | 
            🔖 HPROF heap dump file to analyze
            
            ❕ It must be absolute full path
            
            🎓 Tip: use <tab> completion to trigger fzf completion
                    use <option+enter> to use the value you typed manually
            
            Required: ✓ Yes
            
        - names:
          - --output-dir
          - -o
          argument: ./heap-analysis
          description: | 
            📂 Output directory for analysis reports (default: ./heap-analysis)
            
            Default value: ./heap-analysis
            
        - names:
          - --report-type
          - -r
          argument: all
          description: | 
            📋 Type of report to generate
            
            - all: Generate all available reports
            - leaks: Leak suspects report only
            - overview: System overview report
            - top-components: Top memory consumers
            
            Default value: all
            
            Allowed values: all, leaks, overview, top-components
            
      - name: gc-analyze
        description: | 
          📈 Analyze JVM Garbage Collection logs
            
            📊 Parses GC logs from a local file or running container and generates a detailed analysis with pause time statistics, heap trends, GC cause breakdown, and concrete tuning recommendations.
            
            🔖 Supports JDK 7–21+ and all major collectors: G1GC, CMS, ZGC, Generational ZGC, Shenandoah, ParallelGC, SerialGC
            
            🔖 Use --html to generate a self-contained HTML dashboard with interactive Chart.js charts
        usage: playground debug gc-analyze [OPTIONS]
        options:
        - names:
          - --file
          - -f
          argument: FILE
          description: | 
            🗒️  GC log file to analyze
            
            ❕ Provide either --file or --container, not both
            
            🎓 Tip: use <tab> completion to trigger fzf completion
                    use <option+enter> to use the value you typed manually
            
        - names:
          - --container
          - -c
          argument: CONTAINER
          description: | 
            🐳 Container name (or pod name when cfk environment is used) to extract GC log from
            
            ❕ Provide either --file or --container, not both
            
            🔖 The GC log path is auto-detected from the container's Java process flags.
                 Falls back to searching common log locations (/tmp, /var/log, /opt).
            
        - names:
          - --output-dir
          - -o
          argument: ./gc-analysis-output
          description: | 
            📂 Output directory for the HTML report (default: ./gc-analysis-output)
            
            Default value: ./gc-analysis-output
            
        - names:
          - --html
          argument: ""
          description: | 
            🌐 Generate a self-contained HTML report with interactive charts
            
            📊 Report includes: pause timeline, heap evolution, pause distribution,
               GC type breakdown, KPI cards, detected JVM parameters, tuning flags,
               and color-coded recommendations
            
        - names:
          - --json
          argument: ""
          description: | 
            🗂️  Output raw JSON stats (skips text report and HTML)
            
        - names:
          - --top-pauses
          argument: 10
          description: | 
            📊 Number of longest pauses to display in the report (default: 10)
            
            Default value: 10
            
      - name: tcp-dump
        description: | 
          🕵️‍♂️ Take a tcp dump (sniffing network)
            
            Captures the traffic in or out of a container for --duration seconds and
            brings the capture file back, ready to open in Wireshark. Narrow it with
            --port when you know which one you care about.
            
            ❕ On an encrypted listener you will see the handshake and the failures,
               but not the records themselves.
        usage: playground debug tcp-dump [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
        - names:
          - --port
          argument: PORT
          description: | 
            Port on which tcp dump should be done, if not set sniffing is done on every port
            
        - names:
          - --duration
          argument: 30
          description: | 
            Duration of the dump (default is 30 seconds).
            
            Default value: 30
            
      - name: block-traffic
        description: | 
          🚫 Blocking traffic using iptables
            
            Cuts the route from a container to a destination, so you can see how the
            system behaves during a network outage: a broker that loses the
            controller, a connector that can no longer reach its database, a client
            that cannot resolve the schema registry.
            
            Blocking with --action start and restoring with --action stop, so the
            failure is reversible without restarting anything.
        usage: playground debug block-traffic [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
        - names:
          - --destination
          argument: DESTINATION
          description: | 
            Destination: it could be an ip address, a container name or a hostname
            
            Required: ✓ Yes
            
        - names:
          - --port
          argument: PORT
          description: | 
            Port on which tcp traffic should be blocked
            
        - names:
          - --action
          argument: [start, stop]
          description: | 
            🟢 start or stop
            
            Required: ✓ Yes
            
            Allowed values: start, stop
            
      - name: java-debug
        description: | 
          🤎 JVM arguments for SSL, Kerberos or Class Loading
            
            Turns on the JVM's own diagnostic traces in a container and restarts it.
            This is how you find out why a TLS handshake fails, why a Kerberos
            login is refused, or which jar a class was loaded from when two
            versions collide.
            
            ❗ These traces are extremely verbose. Turn them back off with
               --action disable once you have what you need.
        usage: playground debug java-debug [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
        - names:
          - --type
          argument: [ssl_all, ssl_handshake, class_loading, kerberos]
          description: | 
            - ssl_all: Enable all SSL debugging, i.e -Djavax.net.debug=all
            - ssl_handshake: Enable SSL handshake debugging, i.e -Djavax.net.debug=ssl:handshake
            - class_loading: Enable class loading debugging, i.e -verbose:class
            - kerberos: Enable Kerberos debugging, i.e -Dsun.security.krb5.debug=true
            
            Required: ✓ Yes
            
            Allowed values: ssl_all, ssl_handshake, class_loading, kerberos
            
        - names:
          - --action
          argument: enable
          description: | 
            🟢 enable or disable
            
            Default value: enable
            
            Allowed values: enable, disable
            
      - name: jscissors
        description: | 
          ✂️ jscissors is an instrumentation framework and can help to analyse control flow and perform some specific logging
            
            * Control Flow Tracing: By dynamically instrumenting Java code, the tool meticulously tracks the precise sequence of executed methods at runtime. This capability offers invaluable insights into how an application navigates its logic. The tool provides a way to generate a stack trace when a method is called. 
            * Additional Logging: This enhanced logging capability provides a way to print the input arguments to a method and return value from a method. 
            * Delve into heap area: Generating heap dump at a method call will be crucial to analyze the state of JVM at a given point. The tool has capabilities to generate thread dump as well to track the state of all the threads when a method is called. 
        usage: playground debug jscissors [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
        - names:
          - --operation
          argument: ["VALUES", "RETURN_VALUE", "DELAY", "STACK"]
          description: | 
            🥼 operation to perform:
            
            * VALUES: print method input arguments
            * RETURN_VALUE: print method return value
            * THREADS: print thread dump when method is called
            * HEAP: print heap dump when method is called
            * STACK: print stack trace when method is called
            * EXCEPTION_HEAP: print heap dump when an exception is thrown during method execution
            * DELAY: print time taken for method execution
            
            Default values: VALUES, RETURN_VALUE, DELAY and STACK
            
            🎓 Tip: you can pass multiple operations by specifying --operation multiple times
            
            Repeatable: ✓ Yes
            
            Default value: ["VALUES", "RETURN_VALUE", "DELAY", "STACK"]
            
            Allowed values: VALUES, RETURN_VALUE, THREADS, HEAP, STACK, EXCEPTION_HEAP, DELAY
            
        - names:
          - --class
          argument: CLASS
          description: | 
            class name to instrument (it supports regex like oracle.jdbc.*)
            
            Required: ✓ Yes
            
        - names:
          - --method
          argument: .*
          description: | 
            method name to instrument (it supports regex like .*find.*)
            
            🎓 Tip: you can pass multiple methods by specifying --method multiple times
            
            Repeatable: ✓ Yes
            
            Default value: .*
            
        - names:
          - --action
          argument: enable
          description: | 
            🟢 enable or disable
            
            Default value: enable
            
            Allowed values: enable, disable
            
      - name: flight-recorder
        description: | 
          🛩️ Record flight recorder
            
            Read more about it at https://www.baeldung.com/java-flight-recorder-monitoring
            
            Open the jfr file with JDK Mission Control JMC(https://jdk.java.net/jmc/)
        usage: playground debug flight-recorder [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
        - names:
          - --action
          argument: [start, stop]
          description: | 
            🟢 start or stop
            
            Required: ✓ Yes
            
            Allowed values: start, stop
            
      - name: log-level
        description: | 
          🧬 Set log level for any package
            
            Changes the level of any logger on the running connect worker, straight
            away and without a restart, so you do not have to edit log4j properties
            and rebuild the container.
            
            🎓 Tip: raise only the package you suspect, for instance
            io.confluent.connect.s3 or org.apache.kafka.clients.consumer, rather
            than the root logger, or the useful lines will be lost in the noise.
        usage: playground debug log-level COMMAND
        options: []
      - name: cfk
        description: | 
          🧱 CFK debug sub-commands
        usage: playground debug cfk COMMAND
        options: []
  - name: log-level
    description: | 
        🧬 Set log level for any package
        
        Changes the level of any logger on the running connect worker, straight
        away and without a restart, so you do not have to edit log4j properties
        and rebuild the container.
        
        🎓 Tip: raise only the package you suspect, for instance
        io.confluent.connect.s3 or org.apache.kafka.clients.consumer, rather
        than the root logger, or the useful lines will be lost in the noise.
    usage: playground debug log-level COMMAND
    options: []
    subcommands:
      - name: get
        description: | 
          Get log levels
            
            With no --package, every logger with an explicit level is listed.
        usage: playground debug log-level get [OPTIONS]
        options:
        - names:
          - --package
          - -p
          argument: PACKAGE
          description: | 
            Package name
            
      - name: set
        description: | 
          Set log level for specific logger
            
            Takes effect immediately and applies to the logger and everything
            below it in the package hierarchy.
        usage: playground debug log-level set [OPTIONS]
        options:
        - names:
          - --package
          - -p
          argument: PACKAGE
          description: | 
            📦 Package name
            
            Required: ✓ Yes
            
        - names:
          - --level
          - -l
          argument: [INFO, WARN, DEBUG, TRACE]
          description: | 
            ❕Log level
            
            Required: ✓ Yes
            
            Allowed values: INFO, WARN, DEBUG, TRACE
            
  - name: cfk
    description: | 
        🧱 CFK debug sub-commands
    usage: playground debug cfk COMMAND
    options: []
    subcommands:
      - name: cfk-bundle-analyze
        description: | 
          📦 Analyze a Confluent for Kubernetes (CFK) support bundle
            
            🔍 Scans pod describes, events, component CRs, and logs for ~30 issue categories (pod failures, TLS, auth, MDS/RBAC, license, KRaft, replication, storage, scheduling, …) and prints concrete remediation steps per category.
            
            🔒 Sanitization (IPs / hostnames / emails / secrets) is ON by default — pass --no-sanitize only for internal/test bundles.
            
            🔖 Accepts a directory or a .tar / .tar.gz / .tgz / .zip archive.
            
            🔖 Use --json to emit machine-readable output for downstream tooling.
        usage: playground debug cfk cfk-bundle-analyze [OPTIONS]
        options:
        - names:
          - --bundle
          - -b
          argument: PATH
          description: | 
            🗂️  Path to the CFK support bundle (directory or .tar/.tar.gz/.tgz/.zip)
            
            Required: ✓ Yes
            
        - names:
          - --json
          argument: ""
          description: | 
            📄 Emit machine-readable JSON (includes per-issue recommendation) instead of the text report
            
        - names:
          - --no-sanitize
          argument: ""
          description: | 
            ⚠️  Disable sanitization of IPs, hostnames, emails, and credentials.
            
            🚫 NEVER use this for customer bundles. Internal/test bundles only.
            
        - names:
          - --severity
          argument: [critical, high, medium, low]
          description: | 
            🎚️  Filter issues by minimum severity (critical | high | medium | low)
            
            Allowed values: critical, high, medium, low
            
        - names:
          - --top
          argument: 5
          description: | 
            🔢 Max number of issues to display per category in text mode (default: 5)
            
            Default value: 5
            
        - names:
          - --html
          argument: ""
          description: | 
            🌐 Generate a self-contained HTML report and open it in the default browser
            
            ❕ No external CDN/network needed — single offline-viewable file you can share.
            
        - names:
          - --output-dir
          argument: ./cfk-reports
          description: | 
            📁 Directory for the HTML report (default: ./cfk-reports). Only used with --html.
            
            Default value: ./cfk-reports
            
      - name: generate-bundle
        description: | 
          ⛑️ Generate a Support bundle
            
            see https://docs.confluent.io/operator/current/co-troubleshooting.html#support-bundle
        usage: playground debug cfk generate-bundle [OPTIONS]
        options:
        - names:
          - --follow-logs-duration
          argument: 0
          description: | 
            Max duration to follow logs
            
            Default value: 0
            

  - name: get-jmx-metrics
    description: | 
        🔢 Get JMX metrics from a container
        
        👉 Check documentation https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%94%a2-jmx-metrics
    usage: playground get-jmx-metrics [OPTIONS]
    options:
    - names:
      - --container
      - -c
      argument: connect
      description: | 
        🐳 container name (or pod name when cfk environment is used)
        
        🎓 Tip: you can pass multiple containers by specifying --container multiple times
        
        Repeatable: ✓ Yes
        
        Default value: connect
        
    - names:
      - --open
      - -o
      argument: ""
      description: | 
        🔖 Save output to a file and open with text editor set with playground config editor <editor> (default is code)
        
    - names:
      - --domain
      - -d
      argument: DOMAIN
      description: | 
        Domain name
        
    subcommands:
  - name: container
    description: | 
        🐳 Container commands
        
        Work on the containers of the running example without having to remember
        their names, their users or their file layout. The same commands work
        against Kubernetes pods when the example runs on the cfk environment,
        which is why 'pod' is an accepted alias.
        
        🔍 Look inside
          logs                 tail logs, grep them, or block until a line appears
          display-error-all    every ERROR and FATAL across all containers
          get-properties       the properties file a component actually loaded
          get-ip-addresses     addresses on the docker network
          exec / ssh           run a command, or get a shell
        
        🔁 Act on them
          restart / kill / pause / resume
          recreate             re-create with the same compose definition
          update               edit the compose or Kubernetes definition, apply it
          set-environment-variables   add settings, then recreate
          cp                   copy files in and out
          change-jdk           swap the JDK, to reproduce a JVM-specific issue
          kill-all             kill everything and prune volumes
        
        Most commands accept --container several times to act on a few containers
        at once.
        
        🎓 Tip: the usual names are broker, connect, schema-registry,
        control-center, ksqldb-server, plus whatever the example adds.
    usage: playground container COMMAND
    options: []
    subcommands:
      - name: get-properties
        description: | 
          📝 Get properties file from a container
            
            👉 Check documentation https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%93%9d-see-properties-file
        usage: playground container get-properties [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
      - name: recreate
        description: | 
          💫 Recreate container(s)
            
            👉 Check documentation https://kafka-docker-playground.io/#/how-to-use?id=%e2%99%bb%ef%b8%8f-re-create-containers
            
            Replays the docker compose command of the example, so a container is
            rebuilt from its current definition. This is what applies a change
            made with 'playground container set-environment-variables' or
            'playground container update', and what you use to restart a component
            from scratch without re-running the whole example.
        usage: playground container recreate [OPTIONS]
        options:
        - names:
          - --ignore-current-versions
          argument: ""
          description: | 
            Ignore current confluent platform version
            
            By default, the current version is used
            
      - name: update
        description: | 
          ✍️ Edit and apply runtime container/pod definition
            
            Opens the current docker-compose (non-CFK) or Kubernetes resource YAML (CFK)
            for the target container/pod in your configured editor and applies changes
            when you save and close the file.
        usage: playground container update [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
      - name: get-ip-addresses
        description: | 
          🖥️  Get ip address of running containers
            
            The address each container has on the docker network, which is what
            you need when a component must be reached by IP rather than by name,
            or when you are checking what a client actually connected to.
        usage: playground container get-ip-addresses
        options: []
      - name: kill-all
        description: | 
          💀 Kill all containers and prune all volumes
            
            Kills every container on your machine, playground or not, and prunes
            the volumes. Used automatically before each 'playground run' to
            guarantee a clean slate; disable that with
            'playground config container-kill-all-before-run false'.
        usage: playground container kill-all
        options: []
      - name: logs
        description: | 
          🕵️  Tail and follow container logs
            
            Three ways to use it:
            
              --grep "ERROR"                    keep only the lines that matter
              --open                            read the whole log in your editor
              --wait-for-log "Started" -m 120   block until the line shows up
            
            The last one is what example scripts use to synchronise on a component
            being ready, instead of sleeping and hoping.
        usage: playground container logs [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
        - names:
          - --open
          - -o
          argument: ""
          description: | 
            🔖 Save output to a file and open with text editor set with playground config editor <editor> (default is code)
            
            Conflicts with: --wait-for-log, --grep
            
        - names:
          - --wait-for-log
          - -w
          argument: LOG
          description: | 
            😴 Wait until log appears
            
            Conflicts with: --open, --grep
            
        - names:
          - --max-wait
          - -m
          argument: 600
          description: | 
            ⏳ Max time in seconds to wait when using --wait-for-log (default 600s)
            
            Default value: 600
            
            Conflicts with: --open, --grep
            
        - names:
          - --grep
          argument: 
          description: | 
            🎯 Grep pattern to filter logs
            
            Default value: 
            
            Conflicts with: --open, --wait-for-log
            
        - names:
          - --previous
          argument: ""
          description: | 
            🕰️ Show logs from the previous pod instance (only relevant when --environment=cfk is used)
            
        - names:
          - --since
          argument: SINCE
          description: | 
            🕐 Only show logs newer than a relative duration (10m, 1h) or a timestamp (2026-09-24T16:00:00)
            
            Conflicts with: --open, --wait-for-log
            
        - names:
          - --tail
          argument: LINES
          description: | 
            🔢 Number of lines to show from the end of the logs, or "all"
            
            Default is 200, or all when --since, --errors, or --grep with --no-follow is used
            
            Conflicts with: --open, --wait-for-log
            
        - names:
          - --no-follow
          argument: ""
          description: | 
            🛑 Print the logs and exit instead of following them
            
            🎓 Tip: use it in scripts and from AI agents, which otherwise never get the command back
            
            Conflicts with: --open, --wait-for-log
            
        - names:
          - --errors
          argument: ""
          description: | 
            🔥 Only show a digest of ERROR/FATAL records, then exit
            
            Repeated records are de-duplicated with an occurrence count, stack
            traces are collapsed to the exception chain ("Caused by:") plus a few
            frames of the deepest cause. Records logged at INFO/DEBUG/TRACE are
            never reported, even when their message contains "Error" or "Exception".
            
            Scans the whole log unless --since or --tail narrow it.
            
            Conflicts with: --open, --wait-for-log, --grep
            
        - names:
          - --include-warnings
          argument: ""
          description: | 
            🟠 With --errors, also report WARN records
            
        - names:
          - --max-findings
          argument: 40
          description: | 
            ✂️ With --errors, maximum number of distinct records to show (default 40)
            
            Default value: 40
            
      - name: display-error-all
        description: | 
          🔥 Display all ERROR/FATAL logs in all containers/pods. Useful for quick troubleshooting
            
            The first command to run when an example misbehaves and you do not yet
            know which component is at fault. It sweeps every container at once,
            so you do not have to guess where to look.
        usage: playground container display-error-all
        options: []
      - name: ssh
        description: | 
          🛬 SSH into container
            
            Interactive shell inside the container, as the user the component runs
            with. Use 'playground container exec' instead when you want to run a
            single command from a script.
        usage: playground container ssh [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
        - names:
          - --shell
          - -s
          argument: bash
          description: | 
            💾 Shell to use (default is bash)
            
            Default value: bash
            
            Allowed values: bash, sh, ksh, zsh
            
      - name: change-jdk
        description: | 
          🤎 Change java JDK version using Azul JDK (https://www.azul.com/downloads/#downloads-table-zulu)
            
            PS: It works for UBI8 docker images only
        usage: playground container change-jdk [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
        - names:
          - --version
          argument: [8, 11, 17, 21, 22, 25]
          description: | 
            🤎 JDK version to use
            
            Required: ✓ Yes
            
            Allowed values: 8, 11, 17, 21, 22, 25
            
      - name: exec
        description: | 
          🪄 Execute command in a container
            
            Runs one command and returns, which makes it the form to use inside
            example scripts. Add --root when the component user is not allowed to
            do what you are asking, typically to install a package or read a file
            under /etc.
        usage: playground container exec [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
        - names:
          - --command
          argument: COMMAND
          description: | 
            📲 Command to execute
            
            Required: ✓ Yes
            
        - names:
          - --root
          argument: ""
          description: | 
            👑 Run command as root
            
        - names:
          - --shell
          argument: bash
          description: | 
            💾 Shell to use (default is bash)
            
            Default value: bash
            
            Allowed values: bash, sh, ksh, zsh
            
      - name: cp
        description: | 
          🪄 Copy files between local filesystem and container
            
            Works in both directions, using the container:path notation. Typically
            used to drop a jar, a certificate or a test file into a component, or
            to pull out a file the connector has written.
        usage: playground container cp [OPTIONS]
        options:
        - names:
          - --source
          argument: SOURCE
          description: | 
            📥 Source path (local path or container:path)
            
            Required: ✓ Yes
            
        - names:
          - --destination
          argument: DESTINATION
          description: | 
            📤 Destination path (local path or container:path)
            
            Required: ✓ Yes
            
      - name: restart
        description: | 
          🔁 Restart a container
            
            Stops and starts the container, keeping its definition and its data.
            Use 'playground container recreate' instead if you changed the compose
            definition or an environment variable.
        usage: playground container restart [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
      - name: pause
        description: | 
          ⏸️  Pause a container
            
            Freezes the processes without stopping the container: it keeps its
            connections but stops responding. A good way to simulate a hung
            broker, an unresponsive database or a GC pause, and to see how the
            rest of the system reacts.
        usage: playground container pause [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
      - name: resume
        description: | 
          ⏯️  Resume a container
            
            Unfreezes a container paused with 'playground container pause'.
        usage: playground container resume [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
      - name: kill
        description: | 
          🔫 Kill a container
            
            Stops the container abruptly, without letting it shut down cleanly,
            which is how you simulate a crash. Bring it back with
            'playground container recreate'.
        usage: playground container kill [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
      - name: set-environment-variables
        description: | 
          📦  Set environment variable(s) for a container
            
            🎓 Tip: you can pass multiple environment variables by specifying --env multiple times
            
            Example: --env "KAFKA_OPTS: -verbose:class" --env "CONNECT_LOG4J_LOGGERS: org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR,org.apache.kafka.connect.runtime.rest.RestServer=ERROR"
        usage: playground container set-environment-variables [OPTIONS]
        options:
        - names:
          - --container
          - -c
          argument: connect
          description: | 
            🐳 container name (or pod name when cfk environment is used)
            
            🎓 Tip: you can pass multiple containers by specifying --container multiple times
            
            Repeatable: ✓ Yes
            
            Default value: connect
            
        - names:
          - --env
          argument: ENV
          description: | 
            📦 Environment variables to set
            
            🎓 Tip: you can pass multiple environment variables by specifying --env multiple times
            
            Repeatable: ✓ Yes
            
            Conflicts with: --restore-original-values
            
        - names:
          - --restore-original-values
          argument: ""
          description: | 
            🧽 Restore back original values before any changes was made
            
            Conflicts with: --env
            
        - names:
          - --mount-jscissors-files
          argument: ""
          description: | 
            Mount jscissors files for debugging
            
  - name: topic
    description: | 
        🗳 Topic commands
        
        Produce, consume and manage topics without dealing with the kafka-* shell
        scripts: the bootstrap server, the security properties and the schema
        registry url are all derived from the running environment, so the same
        command works on plaintext, on sasl-ssl and on Confluent Cloud.
        
        📤 Get data in
          produce         generate records from a schema, or from your own data
          create          create a topic with the partitions you need
        
        📥 Get data out
          consume         read from the beginning, deserialising automatically
          get-number-records   count what is in the topic
          get-offsets          earliest and latest offsets per partition
          display-consumer-offsets   read the internal offsets topic
        
        🔧 Manage
          list / describe / alter / delete
          set-schema-compatibility   compatibility of the topic subjects
          tag             stream catalog tags (Confluent Cloud only)
        
        Serialisation is handled for you: 'produce' registers the schema you give
        it and 'consume' works out from the payload whether it is avro, protobuf,
        json schema or plain text.
        
        🎓 Tip: in an example script, 'consume --min-expected-messages N' is the
        assertion that the data made it through; it fails the run if it did not.
    usage: playground topic COMMAND
    options: []
    subcommands:
      - name: get-number-records
        description: | 
          💯 Get number of records in a topic
            
            Counts the records currently in the topic, from the partition offsets.
            The cheap way to check that a source connector produced something, or
            that a sink has data to read.
        usage: playground topic get-number-records [OPTIONS]
        options:
        - names:
          - --topic
          - -t
          argument: TOPIC
          description: | 
            🗳 Topic name
            
        - names:
          - --isolation-level
          argument: read_uncommitted
          description: | 
            🫥 The isolation level to use, see https://docs.confluent.io/platform/current/installation/configuration/consumer-configs.html#isolation-level
            If not set, default is read_uncommitted
            
            Default value: read_uncommitted
            
            Allowed values: read_uncommitted, read_committed
            
      - name: get-offsets
        description: | 
          📍 Get earliest and latest offsets per partition of a topic
            
            The low and high watermarks of every partition, and the number of
            records in between. Useful to see whether retention has already
            deleted data, which partitions received records, or which offsets a
            connector should be at.
        usage: playground topic get-offsets [OPTIONS]
        options:
        - names:
          - --topic
          - -t
          argument: TOPIC
          description: | 
            🗳 Topic name
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: display-consumer-offsets
        description: | 
          📭 Display content of __consumer_offsets topic
            
            Decodes the internal topic where Kafka keeps committed offsets, so you
            can see exactly what each consumer group, including a sink connector,
            has committed and when.
        usage: playground topic display-consumer-offsets [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: list
        description: | 
          🔘 List topics
            
            Add --show-internal to also see the topics Kafka and Connect maintain
            for themselves, such as the connect configs, offsets and status
            topics.
        usage: playground topic list [OPTIONS]
        options:
        - names:
          - --show-internal
          argument: ""
          description: | 
            🫥 Display internal topics
            
      - name: describe
        description: | 
          🔬 Describe topic
            
            Partitions, replicas, in-sync replicas and the configuration overrides
            set on the topic. Where to look when records go to an unexpected
            partition, or when a topic is not retaining what you expected.
        usage: playground topic describe [OPTIONS]
        options:
        - names:
          - --topic
          - -t
          argument: TOPIC
          description: | 
            🗳 Topic name
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: set-schema-compatibility
        description: | 
          🛡️ Change topic's schema compatibility
            
            Sets the compatibility level on the subjects of the topic, which is
            what you relax to let an otherwise rejected schema evolution through,
            for instance to reproduce a schema compatibility issue.
        usage: playground topic set-schema-compatibility [OPTIONS]
        options:
        - names:
          - --topic
          - -t
          argument: TOPIC
          description: | 
            🗳 Topic name
            
        - names:
          - --compatibility
          argument: [BACKWARD, BACKWARD_TRANSITIVE, FORWARD, FORWARD_TRANSITIVE, FULL, FULL_TRANSITIVE, NONE]
          description: | 
            Schema Registry compatibility rule
            
            Required: ✓ Yes
            
            Allowed values: BACKWARD, BACKWARD_TRANSITIVE, FORWARD, FORWARD_TRANSITIVE, FULL, FULL_TRANSITIVE, NONE
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: consume
        description: | 
          📥 Consume topic from beginning
            
            Reads from the earliest offset and deserialises records on its own:
            avro, protobuf, json schema and plain formats are all detected from
            the payload, so you do not have to pick a console consumer.
            
            🎓 Tip: --min-expected-messages turns it into an assertion. It waits
            up to --timeout for that many records and fails otherwise, which is
            how examples verify that data actually flowed.
        usage: playground topic consume [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --topic
          - -t
          argument: TOPIC
          description: | 
            🗳 Topic name
            
        - names:
          - --max-messages
          argument: 100
          description: | 
            Max number of messages to display (default is 100)
            
            You can use -1 to display all messages
            
            Default value: 100
            
        - names:
          - --min-expected-messages
          argument: 0
          description: | 
            Minimum expected number of messages to be present in topic, returns an error if this is not the case
            
            Note: --topic should be specified in this case.
            
            Default value: 0
            
        - names:
          - --grep
          argument: 
          description: | 
            Verify that topic content contains record which contains specified string
            
            Default value: 
            
        - names:
          - --timeout
          argument: 60
          description: | 
            Max number of seconds to wait when --min-expected-messages is used.
            
            Default is 60 seconds
            
            Default value: 60
            
        - names:
          - --tail
          argument: ""
          description: | 
            Tail on logs.
            
            Conflicts with: --min-expected-messages, --max-messages, --open
            
        - names:
          - --plot-latencies-timestamp-field
          argument: TIMESTAMP
          description: | 
            🗳 Timestamp field name that represents when record was created in source system
            
        - names:
          - --key-subject
          argument: KEY-SUBJECT
          description: | 
            📛 Subject for key in schema-registry to use (useful when data was produced with --key-subject-name-strategy other than TopicNameStrategy)
            
            Note: --topic should be specified in this case.
            
        - names:
          - --value-subject
          argument: VALUE-SUBJECT
          description: | 
            📛 Subject for value in schema-registry to use (useful when data was produced with --value-subject-name-strategy other than TopicNameStrategy)
            
            Note: --topic should be specified in this case.
            
        - names:
          - --max-characters
          argument: 3000
          description: | 
            Max characters per message to display (default is 3000)
            
            Default value: 3000
            
        - names:
          - --open
          - -o
          argument: ""
          description: | 
            🔖 Save full dump of topic to a file and open with text editor set with playground config editor <editor> (default is code)
            
            Conflicts with: --max-characters, --tail, --min-expected-messages
            
        - names:
          - --isolation-level
          argument: read_uncommitted
          description: | 
            🫥 The isolation level to use, see https://docs.confluent.io/platform/current/installation/configuration/consumer-configs.html#isolation-level
            If not set, default is read_uncommitted
            
            Default value: read_uncommitted
            
            Allowed values: read_uncommitted, read_committed
            
      - name: produce
        description: | 
          📤 Produce to a topic
            
            See video tutorial https://youtu.be/mbzHCewG_XE
            
            Generates records for you rather than making you write them. Give it
            a schema, in avro, json schema or protobuf, and it registers the
            schema and produces --nb-messages records of realistic random data.
            The topic is created if it does not exist.
            
            Three ways to say what to send:
            
              a schema on stdin           generated data matching that schema
              --value <predefined>        one of the bundled schemas
              --forced-value '{...}'      your exact payload, %g being the index
            
            🎓 Tip: pipe the schema with a quoted heredoc, << 'EOF', so that the
            %g placeholders survive the shell.
        usage: playground topic produce [OPTIONS]
        options:
        - names:
          - --key
          argument: KEY
          description: | 
            🗝️ Key to use. If not set, no key is used.
            
            🔥 You can either:
            
            * Set your own schema (avro, json-schema, protobuf) within single quotes (see examples) 
            
            * You can also generate json data using json or sql format using syntax from https://github.com/MaterializeInc/datagen
            
            * You can also generate json data using syntax from https://github.com/vdesabou/avro-random-generator (same as datagen source connector)
            
            * Use completion to select predefined schemas (or use your own schema file) 🎓 Tip: use <tab> completion to trigger fzf completion
            
            * Directly set payload ("%g" can be used to generate a counter)
            
            In case of 'raw' data (i.e not using schema):
            
            If the key contain a number, it will be used as starting point and incremented for each record. 
            
            Example: key1 will start with key1, then key2, etc..
            Example: mykey-10-suffix will start with mykey-10-suffix then mykey-11-suffix, etc..
            
            "%g" can also be used to generate a counter
            
            Example: key%g will start with key1, then key2, etc..
            
            Otherwise, the key will be same for all records.
            
        - names:
          - --value
          argument: VALUE
          description: | 
            🔥 You can either:
            
            * Set your own schema (avro, json-schema, protobuf) with stdin (see example section). 
            
            * You can also generate json data using json or sql format using syntax from https://github.com/MaterializeInc/datagen
            
            * You can also generate json data using syntax from https://github.com/vdesabou/avro-random-generator (same as datagen source connector)
            
            * Use completion to select predefined schemas (or use your own schema file) 🎓 Tip: use <tab> completion to trigger fzf completion
            
            * Directly set payload ("%g" can be used to generate a counter)
            
            Default value: -
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --debug
          - -d
          argument: ""
          description: | 
            debug mode (internal)
            
        - names:
          - --topic
          - -t
          argument: TOPIC
          description: | 
            🗳 Topic name
            
            Required: ✓ Yes
            
        - names:
          - --nb-messages
          argument: 1
          description: | 
            💯 Number of messages to produce (default is 1)
               
            🎓  - if > <value of --max-nb-messages-per-batch> (default 300000), messages will be sent in batches of <value of --max-nb-messages-per-batch> (default 300000) records
                - if you set it to -1, an infinite number of records will also be sent in batches
            
            Default value: 1
            
        - names:
          - --max-nb-messages-per-batch
          argument: 300000
          description: | 
            🔼 Max number of messages to send per batch when --nb-messages > --max-nb-messages-per-batch
               if --nb-messages is set to -1, this is the number of messages sent per batch
               default is 300000
            
            Default value: 300000
            
        - names:
          - --max-nb-messages-to-generate
          argument: MAX-NB-MESSAGES-TO-GENERATE
          description: | 
            🔨 Max number of different messages to generate.
            
               - when protobuf is used, default is 50 as protobuf generation is really slow
               - when json or sql datagen format is used, default is 1000
               - when --record-size is set, default is 100
               --when nb-messages is set to -1, default is 1000
               - otherwise default is 100000
            
        - names:
          - --sleep-time-between-batch
          argument: 0
          description: | 
            💤 Sleep time in seconds between batches
               default is 0
            
            Default value: 0
            
        - names:
          - --nb-partitions
          argument: 1
          description: | 
            🔢 Number of partitions for the topic. (default is 1)
            
            ❌ Important: If topic is existing, it will be re-created before producing to topic.
            
            Default value: 1
            
        - names:
          - --compression-codec
          argument: [gzip, snappy, lz4, zstd]
          description: | 
            🤐 The compression codec: either 'gzip', 'snappy', 'lz4', or 'zstd'
            If not set, there is no compression
            
            Allowed values: gzip, snappy, lz4, zstd
            
        - names:
          - --compatibility
          argument: [BACKWARD, BACKWARD_TRANSITIVE, FORWARD, FORWARD_TRANSITIVE, FULL, FULL_TRANSITIVE, NONE]
          description: | 
            Schema Registry compatibility rule
            
            Allowed values: BACKWARD, BACKWARD_TRANSITIVE, FORWARD, FORWARD_TRANSITIVE, FULL, FULL_TRANSITIVE, NONE
            
        - names:
          - --key-subject-name-strategy
          argument: [TopicNameStrategy, RecordNameStrategy, TopicRecordNameStrategy]
          description: | 
            Key Subject Name Strategy
            
            Allowed values: TopicNameStrategy, RecordNameStrategy, TopicRecordNameStrategy
            
        - names:
          - --value-subject-name-strategy
          argument: [TopicNameStrategy, RecordNameStrategy, TopicRecordNameStrategy]
          description: | 
            Value Subject Name Strategy
            
            Allowed values: TopicNameStrategy, RecordNameStrategy, TopicRecordNameStrategy
            
        - names:
          - --headers
          argument: HEADERS
          description: | 
            🚏 Headers to use for all records. If not set, no header is used.
            
            Example: --headers "header1:value1,header2:value2"
            
            Note: CP 7.2+ is required.
            
        - names:
          - --forced-key
          argument: FORCED-KEY
          description: | 
            ☢️ Key to use for all records. 
            
            🎓 Tip: use --generate-only first with avro, json-schema or protobuf to get skeleton of messages and then use --forced-key to send the message you need. 
            
        - names:
          - --forced-value
          argument: FORCED-VALUE
          description: | 
            ☢️ Value to use for all records. 
            
            🎓 Tip: use --generate-only first with avro, json-schema or protobuf to get skeleton of messages and then use --forced-value to send the message you need. 
            
        - names:
          - --generate-only
          argument: ""
          description: | 
            🚪 Only generate messages without sending to kafka topic.
            
            Used with --forced-value, this is a powerful way to send specific messages.
            
        - names:
          - --tombstone
          argument: ""
          description: | 
            ⚰️ Generate tombstone (record with null value). 
            
            Setting --key is recommended when this flag is used. 
            If not set, the key will also be null, hence generating a null record (both key and value being null)
            
            Note: CP 7.2+ is required.
            
        - names:
          - --schema-id-in-header
          argument: ""
          description: | 
            🎯 Include schema ID in kafka header. 
            
            Uses HeaderSchemaIdSerializer for schema.id.seserializer
            
            Note: CP 8.1.1+ is required.
            
        - names:
          - --validate
          argument: ""
          description: | 
            ☑️ Validate schema according to connect sink converter used
            
        - names:
          - --derive-key-schema-as
          argument: [AVRO, JSON, PROTOBUF]
          description: | 
            🪄 Use playground schema derive-schema command to deduce schema from key payload
            
            Possible values:
            
            - AVRO
            - JSON (json schema)
            - PROTOBUF
            
            Allowed values: AVRO, JSON, PROTOBUF
            
        - names:
          - --derive-value-schema-as
          argument: [AVRO, JSON, PROTOBUF]
          description: | 
            🪄 Use playground schema derive-schema command to deduce schema from value payload
            
            Possible values:
            
            - AVRO
            - JSON (json schema)
            - PROTOBUF
            
            Allowed values: AVRO, JSON, PROTOBUF
            
        - names:
          - --no-null
          argument: ""
          description: | 
            🪹 Never generate null fields even for optional fields
            
            N.B: only work with avro and json-schema
            
        - names:
          - --consume
          argument: ""
          description: | 
            📥 After producing, directly consume topic.
            
        - names:
          - --delete-topic
          argument: ""
          description: | 
            ❌ Delete topic and associated schema/subject if applicable before producing data.
            
        - names:
          - --reference
          argument: REFERENCE
          description: | 
            🖇️ Schema reference
            
            See docs: https://docs.confluent.io/platform/7.6/schema-registry/fundamentals/serdes-develop/index.html#schema-references
            
            🎓 Tip: you can pass multiple references by specifying --reference multiple times
            
            🔥 You can either:
            
            * Set your own schema (avro, json-schema, protobuf) within single quotes (see examples) 
            
            * Use completion to select predefined schemas (or use your own schema file) 🎓 Tip: use <tab> completion to trigger fzf completion
            
            Repeatable: ✓ Yes
            
        - names:
          - --validate-config
          argument: [scrub.invalid.names=true, enhanced.avro.schema.support=true, connect.meta.data=false, object.additional.properties=false, use.optional.for.nonrequired=true, ignore.default.for.nullables=true, generalized.sum.type.support=true, enhanced.protobuf.schema.support=true, generate.index.for.unions=false, int.for.enums=true, optional.for.nullables=true, generate.struct.for.nulls=true, wrapper.for.nullables=true, wrapper.for.raw.primitives=false]
          description: | 
            🔩 Converter configuration parameters to use 
            
            See docs: https://docs.confluent.io/platform/current/schema-registry/connect.html#using-kconnect-long-with-sr
            
            🎓 Tip: you can pass multiple parameters by specifying --validate-config multiple times
            
            Repeatable: ✓ Yes
            
            Allowed values: scrub.invalid.names=true, enhanced.avro.schema.support=true, connect.meta.data=false, object.additional.properties=false, use.optional.for.nonrequired=true, ignore.default.for.nullables=true, generalized.sum.type.support=true, enhanced.protobuf.schema.support=true, generate.index.for.unions=false, int.for.enums=true, optional.for.nullables=true, generate.struct.for.nulls=true, wrapper.for.nullables=true, wrapper.for.raw.primitives=false
            
        - names:
          - --producer-property
          argument: PRODUCER-PROPERTY
          description: | 
            🔩 Producer configuration parameters to use 
            
            See docs: https://docs.confluent.io/platform/current/installation/configuration/producer-configs.html#cp-config-producer
            
            🎓 Tip: you can pass multiple parameters by specifying --producer-property multiple times
            
            Example: --producer-property "max.request.size=990485760" --producer-property "client.id=myid"
            
            Repeatable: ✓ Yes
            
        - names:
          - --record-size
          argument: 0
          description: | 
            🏋️ Record size in bytes, eg. 1048576 for 1MB
            
            📢 If size is > 1Mb, --producer-property max.request.size and topic max.message.bytes will be automatically set to support the record size.
            
            Note that --no-null will be used when this option is set
            
            Default value: 0
            
        - names:
          - --value-schema-id
          argument: VALUE-SCHEMA-ID
          description: | 
            🔰 Do not auto register schema and specify schema id to use. 
            
            It sets --property value.schema.id=x --property auto.register=false --property use.latest.version=true
            
      - name: create
        description: | 
          🆕 Create topic
            
            Only needed when you want something other than the defaults, since
            'playground topic produce' creates the topic on the fly. Any extra
            argument is passed through to kafka-topics --create, so --config works
            as usual.
        usage: playground topic create [OPTIONS] [--] [ARGUMENTS...]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --topic
          - -t
          argument: TOPIC
          description: | 
            🗳 Topic name
            
            Required: ✓ Yes
            
        - names:
          - --nb-partitions
          argument: 1
          description: | 
            Number of partitions for the topic. (default is 1)
            
            Default value: 1
            
      - name: delete
        description: | 
          ❌ Delete topic and associated schema/subject if applicable
            
            Also removes the key and value subjects from the schema registry,
            which is what you usually want: a topic re-created with a leftover
            subject keeps the old compatibility rules and the old schema history.
            Keep them with --skip-delete-schema.
            
            A regex is accepted, matched in full, to clean up a family of topics
            at once.
        usage: playground topic delete [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --topic
          - -t
          argument: TOPIC
          description: | 
            🗳 Topic name or regex pattern (full match)
            
            Examples: my-topic, my-topic-.*
            
            Required: ✓ Yes
            
        - names:
          - --skip-delete-schema
          argument: ""
          description: | 
            🔰 Do not delete subject/schema
            
      - name: alter
        description: | 
          🪛 Alter topic config
            
            Changes topic level settings on a live topic, which is how you
            reproduce behaviour driven by configuration: a small
            max.message.bytes to trigger a record too large error, a short
            retention.ms to expire data, a compacted cleanup.policy, and so on.
        usage: playground topic alter [OPTIONS] [--] [ARGUMENTS...]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --topic
          - -t
          argument: TOPIC
          description: | 
            🗳 Topic name
            
            Required: ✓ Yes
            
      - name: tag
        description: | 
          🏷️ Stream Catalog tags (Confluent Cloud only)
            
            Tag definitions live in the Stream Catalog of the environment, served
            by the Schema Registry endpoint. Create a tag once, then assign it to
            topics and search topics by tag.
            
              list     tag definitions
              create   create a tag definition
              delete   delete a tag definition
              add      assign a tag to a topic
              remove   remove a tag from a topic
              show     tags assigned to a topic
              search   topics having a tag
            
            🎓 Tip: a newly created topic can take a minute to show up in the
            Stream Catalog before a tag can be assigned to it.
        usage: playground topic tag COMMAND
        options: []
  - name: tag
    description: | 
        🏷️ Stream Catalog tags (Confluent Cloud only)
        
        Tag definitions live in the Stream Catalog of the environment, served
        by the Schema Registry endpoint. Create a tag once, then assign it to
        topics and search topics by tag.
        
          list     tag definitions
          create   create a tag definition
          delete   delete a tag definition
          add      assign a tag to a topic
          remove   remove a tag from a topic
          show     tags assigned to a topic
          search   topics having a tag
        
        🎓 Tip: a newly created topic can take a minute to show up in the
        Stream Catalog before a tag can be assigned to it.
    usage: playground topic tag COMMAND
    options: []
    subcommands:
      - name: list
        description: | 
          🏷️ List tag definitions
        usage: playground topic tag list [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: create
        description: | 
          🆕 Create a tag definition
        usage: playground topic tag create [OPTIONS]
        options:
        - names:
          - --tag
          argument: TAG
          description: | 
            🏷️ Tag name (letters, digits and underscores, starting with a letter)
            
            Required: ✓ Yes
            
        - names:
          - --description
          argument: 
          description: | 
            📝 Tag description
            
            Default value: 
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: delete
        description: | 
          ❌ Delete a tag definition
            
            The tag must not be assigned to any topic anymore.
        usage: playground topic tag delete [OPTIONS]
        options:
        - names:
          - --tag
          argument: TAG
          description: | 
            🏷️ Tag name
            
            Required: ✓ Yes
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: add
        description: | 
          🏷️ Assign a tag to a topic
        usage: playground topic tag add [OPTIONS]
        options:
        - names:
          - --topic
          - -t
          argument: TOPIC
          description: | 
            🗳 Topic name
            
            Required: ✓ Yes
            
        - names:
          - --tag
          argument: TAG
          description: | 
            🏷️ Tag name
            
            Required: ✓ Yes
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: remove
        description: | 
          🧽 Remove a tag from a topic
        usage: playground topic tag remove [OPTIONS]
        options:
        - names:
          - --topic
          - -t
          argument: TOPIC
          description: | 
            🗳 Topic name
            
            Required: ✓ Yes
            
        - names:
          - --tag
          argument: TAG
          description: | 
            🏷️ Tag name
            
            Required: ✓ Yes
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: show
        description: | 
          🔎 Show tags assigned to a topic
