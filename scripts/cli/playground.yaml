  - name: consumer-group
    description: | 
        👥 Consumer group commands
        
        Inspect any consumer group (not only the ones of sink connectors): which
        groups exist, their state and members, and the committed offsets and lag
        per partition. Works on plaintext, secured environments, cfk and
        Confluent Cloud.
        
          list       consumer groups, optionally with their state
          describe   committed offsets and lag, or --state, or --members
        
        🎓 Tip: for a sink connector, 'playground connector show-lag' follows the
        lag until it reaches 0.
    usage: playground consumer-group COMMAND
    options: []
    subcommands:
      - name: list
        description: | 
          👥 List consumer groups
        usage: playground consumer-group list [OPTIONS]
        options:
        - names:
          - --state
          argument: ""
          description: | 
            🚦 Also display the state of each group (Stable, Empty, PreparingRebalance...)
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: describe
        description: | 
          🔬 Describe consumer group
            
            By default, shows the committed offset, log end offset and lag of
            every partition consumed by the group, followed by the total lag.
            Use --state for the coordinator, assignment strategy and state, and
            --members for the members and their assigned partitions.
        usage: playground consumer-group describe [OPTIONS]
        options:
        - names:
          - --group
          - -g
          argument: GROUP
          description: | 
            👥 Consumer group name
            
            ℹ️ If not set, all consumer groups are described
            
        - names:
          - --state
          argument: ""
          description: | 
            🚦 Display state of the group (coordinator, assignment strategy, state, number of members)
            
        - names:
          - --members
          argument: ""
          description: | 
            🧑‍🤝‍🧑 Display members of the group and their assigned partitions
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
  - name: connector-plugin
    description: | 
        🔌 Connector-plugin commands
        
        Questions about connector plugins on Confluent Hub, answered without a
        running environment:
        
          versions              every released version of a plugin
          display-last-updated  what was published recently, by vendor
          search-jar            which jars ship in it, and which class is where
          sourcecode            open the source on GitHub
        
        🎓 Tip: search-jar answers "is this class really in the plugin, and with
        which signature", which is the question behind most NoSuchMethodError and
        ClassNotFoundException reports.
    usage: playground connector-plugin COMMAND
    options: []
    subcommands:
      - name: search-jar
        description: | 
          ☕ List jars for a connector plugin from confluent hub https://www.confluent.io/hub/
            
            Downloads the plugin and lists the jars it ships. With --class it also
            finds which jar contains that class and prints its method signatures
            with javap.
            
            That answers the two questions a NoClassDefFoundError or a
            NoSuchMethodError raises: is the class actually shipped, and does the
            bundled version have the signature the code is calling. Run it again
            with another --connector-tag to see when a dependency changed.
        usage: playground connector-plugin search-jar [OPTIONS]
        options:
        - names:
          - --connector-plugin
          - -c
          argument: CONNECTOR-PLUGIN
          description: | 
            🔌 Connector plugin name
            
            🎓 Tip: use <tab> completion to trigger fzf completion
            
            Required: ✓ Yes
            
        - names:
          - --connector-tag
          argument: CONNECTOR_TAG
          description: | 
            🔗 Connector version to use
            
            By default, for each connector, the latest available version on Confluent Hub is used
            
            🎓 Tip: set to " " in order to select the version dynamically
            
            Conflicts with: --connector-zip
            
        - names:
          - --class
          argument: CLASS
          description: | 
            ☕ Java class name to search for in all jars
            
      - name: versions
        description: | 
          💯 List versions for a connector plugin from confluent hub https://www.confluent.io/hub/
            
            What to feed to --connector-tag when you want to test another version,
            and the way to find out which release you are behind on. The list is
            cached; use --force-refresh after a brand new release.
        usage: playground connector-plugin versions [OPTIONS]
        options:
        - names:
          - --connector-plugin
          - -c
          argument: CONNECTOR-PLUGIN
          description: | 
            🔌 Connector plugin name
            
            🎓 Tip: use <tab> completion to trigger fzf completion
            
            Required: ✓ Yes
            
        - names:
          - --force-refresh
          argument: ""
          description: | 
            ☢️ Force refresh.
            
        - names:
          - --last
          argument: LAST
          description: | 
            🆕 Number of last versions to show
            
            Conflicts with: --all
            
      - name: display-last-updated
        description: | 
          🆕 List last updated connector plugins from confluent hub https://www.confluent.io/hub/
            
            A quick way to see what has just been released on the Hub, which often
            explains why an example that passed yesterday behaves differently today.
        usage: playground connector-plugin display-last-updated [OPTIONS]
        options:
        - names:
          - --days
          argument: 3
          description: | 
            📅 Number of days to look back
            
            Default is 3 days
            
            Default value: 3
            
        - names:
          - --vendor
          argument: VENDOR
          description: | 
            🏢 Only display results for this vendor
            
      - name: sourcecode
        description: | 
          🧑‍💻 Open source code url in your browser (or in your editor when used with --open)
            
            You can compare different sourcecode versions by specifying --connector-tag two times, in such case it will open github in comparison mode
            
            🏗️ Compile code and generate zip file(s) by providing --compile flag
            
        usage: playground connector-plugin sourcecode [OPTIONS]
        options:
        - names:
          - --connector-plugin
          - -c
          argument: CONNECTOR-PLUGIN
          description: | 
            🔌 Connector plugin name
            
            🎓 Tip: use <tab> completion to trigger fzf completion
            
            Required: ✓ Yes
            
        - names:
          - --only-show-url
          argument: ""
          description: | 
            🌐 Only show url
            
        - names:
          - --connector-tag
          argument: CONNECTOR_TAG
          description: | 
            🔗 Connector version to use
            
            By default, for each connector, the latest available version on Confluent Hub is used (for Confluent employees, it will also get latest versions for fully managed connectors)
            
            💌 Confluent employees only: for fully managed connectors, use the cc-connect image version for the pcc. You must have a Confluent Github token set with GITHUB_TOKEN or GH_TOKEN environment variable and also be using Confluent VPN.
            
            🎓 Tip: set to " " in order to select the version dynamically
            
            🎓 Tip: you can compare different sourcecode versions by specifying --connector-tag two times, in such case it will open github in comparison mode
            
            Repeatable: ✓ Yes
            
        - names:
          - --compile
          argument: ""
          description: | 
            🏗️ Checkout and compile code
            
            You must have git installed.
            
            💌 Confluent employees only: make sure to follow "Maven FAQ", you also need to be on Confluent VPN with proper AWS credentials set in order to be able to download proprietary dependencies.
            
        - names:
          - --compile-jdk-version
          argument: [8, 11, 17, 21, 25]
          description: | 
            🤎 JDK version to use when compiling
            It will check in pom.xml for maven-compiler-plugin source/target version or release version and set jdk accordingly
            Default is 11
            
            Allowed values: 8, 11, 17, 21, 25
            
        - names:
          - --compile-verbose
          - -v
          argument: ""
          description: | 
            🐞 Show output of compilation.
            
        - names:
          - --open
          - -o
          argument: ""
          description: | 
            🔖 Checkout the code and open with text editor set with playground config editor <editor> (default is code)
            
  - name: connector
    description: | 
        🔗 Connector commands
        
        Everything you would otherwise do with curl on the Connect REST API, with
        the right host, port and credentials already figured out. The same
        commands work whether the connector is self managed in the connect
        container or fully managed in Confluent Cloud.
        
        🔍 Look at what is running
          status                  is it RUNNING, and if not, the full stack trace
          error-recommendations   suggested fixes for a failed fully managed connector
          show-config             the configuration actually applied
          logs                    tail connect logs, filtered and followed
          show-lag                consumer lag of a sink, until it reaches zero
          offsets get             where the connector is reading or writing
        
        🛠️ Change it
          create-or-update        create it, or apply a new config, from stdin
          update                  edit the running config in your editor
          pause / resume / stop / restart / delete
          offsets alter / reset   rewind or fast-forward a connector
        
        🧑‍🔬 Understand it
          show-config-parameters  every parameter the plugin accepts
          select-config           pick parameters interactively
          versions                installed version vs latest on Confluent Hub
          sourcecode              open the source on GitHub, or diff two versions
          open-docs               open the Confluent documentation
          snippets                ready-to-paste converter and dlq config
        
        🐞 Dig deeper
          log-level               raise connect log level for this connector
          enable-remote-debugging attach a java debugger to the connector code
          translate               self managed config to fully managed config
        
        Without --connector, commands apply to every connector of the example,
        which is usually what you want since most examples run only one.
    usage: playground connector COMMAND
    options: []
    subcommands:
      - name: status
        description: | 
          🧩 Show status of all connectors
            
            The connector state, the state of each task, and for a failed task the
            full stack trace, which is the thing you actually need. Add --verbose to
            see the underlying REST call.
        usage: playground connector status [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
      - name: error-recommendations
        description: | 
          💡 Show error recommendations for fully managed connectors
            
            Confluent Cloud analyses the failure stack trace of a failed fully
            managed or custom connector and suggests remediation steps. Nothing is
            returned for a healthy connector, or for one that only failed config
            validation: 'playground connector status' shows those errors.
        usage: playground connector error-recommendations [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
      - name: oracle-cdc-xstream
        description: | 
          🅾️ Specific Oracle CDC Xstream commands
            
            With XStream, half of the interesting state lives in the database, not
            in Connect. A connector that shows RUNNING while no change arrives is
            almost always a capture process or an outbound server that is stuck on
            the Oracle side, and the connect logs say nothing about it.
            
              debug             query the XStream views from the Oracle container
              generate-report   run the official diagnostics script
            
            Only available when an oracle container is running.
            
        usage: playground connector oracle-cdc-xstream COMMAND
        options: []
      - name: offsets
        description: | 
          💈 Handle source and sink connectors offsets
            
            Where a connector is in its data: for a source, the position it keeps in
            the system it reads from (a SCN, a binlog position, a file offset); for a
            sink, the consumer group offsets of the topics it consumes.
            
              get                          show them
              alter                        edit them in your editor, then apply
              reset                        start over from the beginning
              get-offsets-request-status   did the last change go through
            
            This uses the first-class offsets API (KIP-875), so it needs CP 7.5 for
            get and CP 7.6 for alter and reset. On older CP the playground falls back
            to kafka-consumer-groups, which only covers sink connectors.
            
            The connector must not be running while its offsets change: alter and
            reset stop it and resume it for you.
            
            🎓 Tip: a sink that reprocesses everything and a source that re-snapshots
            are usually offsets problems, not connector problems. Look here first.
            
        usage: playground connector offsets COMMAND
        options: []
      - name: plugins
        description: | 
          🎨 Show all connector plugins installed. You can also display transforms, converters and predicates using --all flag
            
            The first thing to check when a connector fails to be created with
            "Failed to find any class that implements Connector": the class you
            asked for is not in this list, so the plugin was not installed or not
            picked up from the plugin path.
        usage: playground connector plugins [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --all
          argument: ""
          description: | 
            🌕 Show also transforms, converters, predicates available
            
      - name: pause
        description: | 
          ⏸️  Pause connector
            
            Tasks stop processing but stay assigned, and the configuration is kept.
            Handy to let a backlog build up, or to freeze a connector while you
            change the system it talks to. Resume with 'playground connector resume'.
        usage: playground connector pause [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
      - name: versions
        description: | 
          🧞 Get current and latest versions available on Confluent Hub for connector(s) used in example
            
            Tells you in one line whether you are testing an outdated connector.
            To move to the version reported as latest, re-run the example with
            'playground update-version --connector-tag <version>'.
            
        usage: playground connector versions
        options: []
      - name: sourcecode
        description: | 
          🧑‍💻 open source code url for connector(s) used in example
            
            You can compare different sourcecode versions by specifying --connector-tag two times, in such case it will open github in comparison mode
            
            💌 Confluent employees only: for fully managed connectors, use the cc-connect image version for the pcc. You must have a Confluent Github token set with GITHUB_TOKEN or GH_TOKEN environment variable and also be using Confluent VPN.
            
        usage: playground connector sourcecode [OPTIONS]
        options:
        - names:
          - --only-show-url
          argument: ""
          description: | 
            🌐 Only show url
            
        - names:
          - --connector-tag
          argument: CONNECTOR_TAG
          description: | 
            🔗 Connector version to use
            
            By default, for each connector, the current version is used (for Confluent employees, it will also get latest versions for fully managed connectors)
            
            🎓 Tip: set to " " in order to select the version dynamically
            
            🎓 Tip: you can compare different sourcecode versions by specifying --connector-tag two times, in such case it will open github in comparison mode
            
            Repeatable: ✓ Yes
            
        - names:
          - --compile
          argument: ""
          description: | 
            
            
        - names:
          - --compile-jdk-version
          argument: [8, 11, 17, 21, 25]
          description: | 
            🤎 JDK version to use when compiling
            It will check in pom.xml for maven-compiler-plugin source/target version or release version and set jdk accordingly
            Default is 11
            
            Allowed values: 8, 11, 17, 21, 25
            
        - names:
          - --compile-verbose
          - -v
          argument: ""
          description: | 
            🐞 Show output of compilation.
            
        - names:
          - --forced-url
          argument: ""
          description: | 
            🔗 Set github url (to compile cp for example)
            
        - names:
          - --enable-remote-debugging
          argument: ""
          description: | 
            ✨ This will enable java remote debugging for connect container
            
            👉 Check documentation https://kafka-docker-playground.io/#/reusables?id=%e2%9c%a8-remote-debugging
            
            ⚠️ This does not work for fully and custom connectors.
            
      - name: enable-remote-debugging
        description: | 
          ✨ Enable java remote debugging for the connector.
            
            👉 Check documentation https://kafka-docker-playground.io/#/reusables?id=%e2%9c%a8-remote-debugging
            
            🏗️ It will checkout (you need git installed) and compile code for the connector (required for remote debugging).
            
            💌 Confluent employees only: make sure to follow "Maven FAQ", you also need to be on Confluent VPN with proper AWS credentials set in order to be able to download proprietary dependencies.
            
            ⚠️ This does not work for fully and custom connectors.
        usage: playground connector enable-remote-debugging
        options: []
      - name: disable-remote-debugging
        description: | 
          🛑 Disable java remote debugging for the connector.
        usage: playground connector disable-remote-debugging
        options: []
      - name: restart
        description: | 
          ♻️  Restart connector
            
            The usual way to recover a connector whose tasks are FAILED after you
            fixed the cause. Use --task-id to restart a single failed task and leave
            the healthy ones alone.
        usage: playground connector restart [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
        - names:
          - --task-id
          - -t
          argument: TASK_ID
          description: | 
            🔧 Restart specific task ID only (instead of restarting entire connector)
            
      - name: stop
        description: | 
          🛑 Stop connector (only available if CP > 7.5)
            
            Stronger than pause: the tasks are shut down and unassigned, so the
            connector consumes no resources at all. This is the state in which
            offsets can be altered or reset.
        usage: playground connector stop [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
      - name: resume
        description: | 
          ⏯️  Resume connector
            
            Restarts processing after a pause or a stop, from the offsets where the
            connector left off.
        usage: playground connector resume [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
      - name: delete
        description: | 
          🗑️  Delete connector
            
            Removes the connector and its configuration. Its offsets survive in the
            Kafka internal topics, so re-creating it under the same name resumes
            where it stopped rather than starting over.
        usage: playground connector delete [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
      - name: show-lag
        description: | 
          🐢 Show lag of sink connector
            
            The consumer lag of the sink, refreshed every --interval seconds, so you
            see whether it is catching up, standing still or falling behind. A lag
            that does not move while the connector reports RUNNING means the tasks
            are stuck rather than slow.
            
            It will run until all lag becomes 0 (press ctrl-c to exit)
            
        usage: playground connector show-lag [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
        - names:
          - --interval
          argument: 20
          description: | 
            Interval between lag checks (default is 20 seconds).
            
            Default value: 20
            
        - names:
          - --max-wait
          argument: 0
          description: | 
            ⏳ Max time in seconds to wait for lag to become 0. If set to 0 (default), it will run until all lag becomes 0.
            
            Default value: 0
            
      - name: show-config
        description: | 
          🧰 Show current connector config that was applied
            
            use --force-rest-endpoint to get results with REST API /config endpoint (https://docs.confluent.io/platform/current/connect/references/restapi.html#get--connectors-(string-name)-config)
            
        usage: playground connector show-config [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
        - names:
          - --no-clipboard
          argument: ""
          description: | 
            do not copy to clipboard (internal)
            
        - names:
          - --force-rest-endpoint
          argument: ""
          description: | 
            ☢️ Force using REST API /config endpoint (https://docs.confluent.io/platform/current/connect/references/restapi.html#get--connectors-(string-name)-config)
            
      - name: show-config-parameters
        description: | 
          🔩 Show all possible configuration parameters of connector
            
            The full reference of what the plugin accepts, with types, defaults,
            importance and documentation, read from the plugin itself rather than
            from the website. Use it to check the exact spelling of a property, or
            to discover the knob you need.
            
            Use --open to read it in your editor, --only-show-json to get it as
            json.
        usage: playground connector show-config-parameters [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
        - names:
          - --open
          - -o
          argument: ""
          description: | 
            🔖 Save output to a file and open with text editor set with playground config editor <editor> (default is code)
            
        - names:
          - --force-refresh
          argument: ""
          description: | 
            ☢️ Force refresh.
            
        - names:
          - --only-show-file-path
          argument: ""
          description: | 
            📂 Only show the path of the file containing the configuration parameters
            
        - names:
          - --only-show-json
          argument: ""
          description: | 
            📗 Only show list of all available parameters for connector (with default value when applicable)
            
        - names:
          - --only-show-json-file-path
          argument: ""
          description: | 
            📂 Only show the path of the json file containing the configuration parameters
            
      - name: display-metrics-api
        description: | 
          〽️ Display metrics api for fully managed connector
            
            Queries the Confluent Cloud Telemetry API for the connector: a summary
            with the connector and task statuses, then every metric that is not
            zero. A fully managed connector gives you no jmx and little logging, so
            this is how you tell whether it is actually doing work.
            
            See https://api.telemetry.confluent.cloud/docs/descriptors/datasets/cloud
        usage: playground connector display-metrics-api [OPTIONS]
        options:
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
        - names:
          - --open
          - -o
          argument: ""
          description: | 
            🔖 Save output to a file and open with text editor set with playground config editor <editor> (default is code)
            
            Conflicts with: --wait-for-log, --grep
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: display-metrics-api-with-grafana
        description: | 
          📊 Display metrics api for fully managed connector in Grafana dashboard
            
            Same metrics as display-metrics-api, but plotted over time in Grafana
            instead of printed once. Use it when you need to see a trend, a spike or
            the moment throughput dropped, rather than the current value.
            
            It starts its own prometheus and grafana containers with a dashboard
            already provisioned, so there is nothing to enable beforehand and it
            does not interfere with the grafana of the example.
            
            Not supported for custom connectors.
        usage: playground connector display-metrics-api-with-grafana [OPTIONS]
        options:
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
      - name: select-config
        description: | 
          🗜️ Easily select config from all possible configuration parameters of connector
            
            An fzf picker over everything the plugin accepts. Type a few letters,
            pick the properties you want and they are printed, with their default
            value when there is one, ready to paste into a connector configuration.
            On macOS they are copied to your clipboard as well.
            
            Faster than show-config-parameters when you already know roughly what
            you are after and just want the exact property names.
            
            🎓 Tip: use <tab> to select multiple config at once, then press <enter> to confirm
        usage: playground connector select-config [OPTIONS]
        options:
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
      - name: snippets
        description: | 
          🔌 useful snippets
            
            Prints ready-to-paste blocks of connector configuration: the key and
            value converter properties for a given format with --converter, and the
            dead letter queue properties with --dlq. Saves you from looking up the
            exact property names and the schema registry settings that go with them.
        usage: playground connector snippets [OPTIONS]
        options:
        - names:
          - --converter
          argument: [avro, protobuf, json-schema, json, json-schema-enabled, string, bytearray]
          description: | 
            🔌 Converter
            
            Allowed values: avro, protobuf, json-schema, json, json-schema-enabled, string, bytearray
            
        - names:
          - --dlq
          argument: ""
          description: | 
            💀 dlq
            
      - name: open-docs
        description: | 
          🧑‍🎓 Open connector documentation of currently running connector(s)
            
            Works out the documentation page from the connector class actually
            running and opens it, so you land on the right page for the right
            connector without searching for it.
            
            Use --only-show-url to print the link instead, for pasting in a case.
        usage: playground connector open-docs [OPTIONS]
        options:
        - names:
          - --only-show-url
          argument: ""
          description: | 
            🌐 Only show url
            
      - name: log-level
        description: | 
          🧬 Set connect log level
            
            Raises the log level for the packages of the connector that is running,
            without restarting anything. Set it to TRACE, reproduce the problem,
            then read 'playground connector logs'.
            
            This is the difference between "the task failed" and seeing the request
            that failed, the record that broke and what the SMT chain did to it.
            
            🎓 Tip: it will also set io.confluent.kafka.schemaregistry.client.rest.RestService (to see schema registry rest requests) and org.apache.kafka.connect.runtime.TransformationChain (to see records before and after SMTs)
                    it will also set org.apache.kafka.connect.runtime.WorkerSinkTask for sink and org.apache.kafka.connect.runtime.WorkerSourceTask for source connectors.
        usage: playground connector log-level [OPTIONS]
        options:
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
        - names:
          - --level
          - -l
          argument: [INFO, WARN, DEBUG, TRACE]
          description: | 
            ❕Log level
            
            Required: ✓ Yes
            
            Allowed values: INFO, WARN, DEBUG, TRACE
            
      - name: logs
        description: | 
          🕵️  Tail and follow connect logs
            
            The logs of the worker running your connector. Combine it with
            'playground connector log-level' to get more than the stack trace, and
            with --wait-for-log to block until a given line appears, which is how
            examples assert that something happened.
            
            For onprem connectors, this is basically a shortcut for "playground container logs --container connect", --connector flag is not relevant
            
            For Fully Managed connectors, limitations apply (see https://docs.confluent.io/cloud/current/connectors/logging-cloud-connectors.html#using-ccloud-cli)
        usage: playground connector logs [OPTIONS]
        options:
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
        - names:
          - --open
          - -o
          argument: ""
          description: | 
            🔖 Save output to a file and open with text editor set with playground config editor <editor> (default is code)
            
            Conflicts with: --wait-for-log, --grep
            
        - names:
          - --wait-for-log
          - -w
          argument: LOG
          description: | 
            😴 Wait until log appears
            
            Conflicts with: --open, --grep
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: open-ccloud-connector-in-browser
        description: | 
          🤖 Open Fully Managed connector in browser (Confluent Cloud dashboard)
            
            Jumps straight to the connector's page in the Confluent Cloud console,
            resolving its lcc id for you, so you do not have to hunt through the
            environment and cluster menus.
        usage: playground connector open-ccloud-connector-in-browser [OPTIONS]
        options:
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
        - names:
          - --browser
          argument: BROWSER
          description: | 
            🌎 browser name
            
            Default browser from your system if not set
            
      - name: display-leader-name
        description: | 
          👑 Display Connect Worker leader name using JMX MBean leader-name from kafka.connect:type=connect-worker-rebalance-metrics
            
            This is useful when you have multiple connect workers and want to know which one is the leader.
            
            For onprem connectors, this is basically a shortcut for "playground container exec -c connect -- bash -c 'export JMX_PORT=9404; jmxterm -l localhost:9404 -n -v silent -u admin -p admin123 -e \"get -b kafka.connect:type=connect-worker-rebalance-metrics name=leader-name\"'", --connector flag is not relevant
            
            For Fully Managed connectors, this is not available as JMX is not accessible.
        usage: playground connector display-leader-name
        options: []
      - name: translate
        description: | 
          💱 Translate Self Managed Connector Plugin Configurations to Fully Managed Connector Plugin Configuration
            
            Takes the configuration of the self managed connector that is running
            and asks Confluent Cloud what the fully managed equivalent looks like.
            Properties are renamed, some disappear, some have no equivalent at all,
            and this tells you which before you promise a customer a migration.
            
            Only translates the configuration. To actually move the connector along
            with its offsets, use 'playground connector connect-migration-utility'.
            
            See https://docs.confluent.io/cloud/current/api.html#tag/Managed-Connector-Plugins-(connectv1)/operation/translateConnectv1ConnectorPlugin
            
            The connector example should be ran with --environment flag set to <ccloud>
            
        usage: playground connector translate [OPTIONS]
        options:
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector-plugin
          argument: CONNECTOR-PLUGIN
          description: | 
            🔌 Connector plugin name
            
            🎓 Tip: use <tab> completion to trigger fzf completion
            
            Required: ✓ Yes
            
      - name: connect-migration-utility
        description: | 
          🧩 Run Kafka Connector Migration Utility (see https://github.com/confluentinc/connect-migration-utility/) on running connect cluster
            
            Takes a self managed connector running in the connect container and
            recreates it as a fully managed connector in Confluent Cloud, keeping
            its offsets so consumers do not replay or skip data. Two steps:
            
              discovery   read the local connectors and export their configurations
              migrate     create the equivalent connectors on Confluent Cloud
            
            Run discovery first, migrate second. Use it to rehearse a customer's
            migration and see what their configuration turns into.
            
            The connector example should be ran with --environment flag set to ccloud.
            
            See a full example at https://github.com/vdesabou/kafka-docker-playground/blob/master/ccloud/connect-migration-utility/README.md
            
        usage: playground connector connect-migration-utility COMMAND
        options: []
      - name: create-or-update
        description: | 
          🧑‍🎨  Create or update connector
            
            The command every example uses to deploy its connector. The json config
            is read from stdin, usually as a heredoc, so it stays readable in the
            script. If the connector already exists it is updated in place, which
            makes the command safe to re-run while you iterate on a configuration.
            
            The command waits for the connector to be RUNNING and fails with the
            error if it is not, so a broken config stops the example immediately
            instead of failing silently later.
            
            🎓 Tip: add --validate to have the config checked by the plugin before
            it is deployed, which reports every invalid property at once.
        usage: playground connector create-or-update [JSON] [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --no-clipboard
          argument: ""
          description: | 
            do not copy to clipboard (internal)
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            Required: ✓ Yes
            
        - names:
          - --level
          - -l
          argument: [INFO, WARN, DEBUG, TRACE]
          description: | 
            ❕Log level
            
            ⚠️ Not available for ccloud connectors
            
            Allowed values: INFO, WARN, DEBUG, TRACE
            
        - names:
          - --package
          - -p
          argument: PACKAGE
          description: | 
            Package name
            
        - names:
          - --wait-for-zero-lag
          argument: ""
          description: | 
            😴 Wait until lag becomes 0
            
        - names:
          - --validate
          argument: ""
          description: | 
            ✅ Validate config using PUT /connector-plugins/(string:name)/config/validate (https://docs.confluent.io/platform/current/connect/references/restapi.html#put--connector-plugins-(string-name)-config-validate)
            
        - names:
          - --skip-automatic-connector-config
          argument: ""
          description: | 
            🤖 If example is run (playground run) with --environment flag, automatic configuration to adapt to the environment is added. 
            
            This flag allows to skip this automatic configuration (only useful to reproduce issues)
            
        - names:
          - --offsets
          argument: OFFSETS
          description: | 
            📍 Create connector with offsets (https://docs.confluent.io/cloud/current/connectors/offsets.html#create-connectors-with-offsets)
            
            ⚠️ Only available for ccloud connectors, the connector should not really exists
            
        - names:
          - --initial-state
          argument: [RUNNING, PAUSED, STOPPED]
          description: | 
            🪵 Create connector with specific status (https://cwiki.apache.org/confluence/display/KAFKA/KIP-980%3A+Allow+creating+connectors+in+a+stopped+state)
            
            Only available if CP > 7.7
            
            ⚠️ not available for ccloud connectors
            
            Allowed values: RUNNING, PAUSED, STOPPED
            
        - names:
          - --terraform
          argument: ""
          description: | 
            🏗️ Deploy connector using Terraform instead of REST API
            
            Dynamically converts JSON connector config to Terraform HCL and deploys using terraform apply
            
            ⚠️ Only available for Confluent Cloud connectors
            
      - name: update
        description: | 
          🛠️ Update connector configuration by opening current connector config in text editor set with playground config editor <editor> (default is code). Once file is saved, the new configuration is updated.
            
            The quickest loop to try a configuration change: edit, save, close, and
            the connector is updated. Nothing is applied if you close the file
            without saving.
        usage: playground connector update [OPTIONS]
        options:
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
  - name: oracle-cdc-xstream
    description: | 
        🅾️ Specific Oracle CDC Xstream commands
        
        With XStream, half of the interesting state lives in the database, not
        in Connect. A connector that shows RUNNING while no change arrives is
        almost always a capture process or an outbound server that is stuck on
        the Oracle side, and the connect logs say nothing about it.
        
          debug             query the XStream views from the Oracle container
          generate-report   run the official diagnostics script
        
        Only available when an oracle container is running.
        
    usage: playground connector oracle-cdc-xstream COMMAND
    options: []
    subcommands:
      - name: generate-report
        description: | 
          ⚙️ Generate and open oracle cdc xstream connector diagnostics
            
            Runs the diagnostics script Confluent support asks for, and opens the
            result. This is the file to attach to a case rather than pasting
            individual query outputs.
            
            See https://docs.confluent.io/kafka-connectors/oracle-xstream-cdc-source/current/troubleshooting.html#connector-diagnostics-script
            
        usage: playground connector oracle-cdc-xstream generate-report
        options: []
      - name: debug
        description: | 
          🐞 Execute various SQL commands to debug xstream components
            
            Runs a series of queries against the XStream views inside the oracle
            container and prints the results, with a link to the Oracle
            documentation of each view:
            
              capture processes   their status, SCN values and latencies
              redo logs           the files each capture process still needs
              outbound server     general state, current transaction, low position
              parameters          capture and apply settings actually in effect
              rules               the rules the XStream components are using
            
            Read it top to bottom when a connector is RUNNING but idle: a capture
            process not in CAPTURING CHANGES, or an SCN that never moves, tells
            you the problem is in the database and not in the connector.
            
        usage: playground connector oracle-cdc-xstream debug
        options: []
  - name: offsets
    description: | 
        💈 Handle source and sink connectors offsets
        
        Where a connector is in its data: for a source, the position it keeps in
        the system it reads from (a SCN, a binlog position, a file offset); for a
        sink, the consumer group offsets of the topics it consumes.
        
          get                          show them
          alter                        edit them in your editor, then apply
          reset                        start over from the beginning
          get-offsets-request-status   did the last change go through
        
        This uses the first-class offsets API (KIP-875), so it needs CP 7.5 for
        get and CP 7.6 for alter and reset. On older CP the playground falls back
        to kafka-consumer-groups, which only covers sink connectors.
        
        The connector must not be running while its offsets change: alter and
        reset stop it and resume it for you.
        
        🎓 Tip: a sink that reprocesses everything and a source that re-snapshots
        are usually offsets problems, not connector problems. Look here first.
        
    usage: playground connector offsets COMMAND
    options: []
    subcommands:
      - name: get
        description: | 
          🏹 Get current offsets for source and sink connectors
            
            Prints the offsets json returned by the Connect REST API, or the
            Confluent Cloud offsets API for a fully managed connector. For a sink
            on CP older than 7.5, it falls back to kafka-consumer-groups
            --describe on the connect-<connector> consumer group.
            
            Run it before and after alter or reset to check what really moved.
            
            See https://docs.confluent.io/cloud/current/connectors/offsets.html
            
        usage: playground connector offsets get [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
      - name: reset
        description: | 
          🆕 Reset offsets for source and sink connectors
            
            Wipes the recorded offsets so the connector starts over: a source
            re-reads its origin from the beginning, a sink re-consumes its topics
            from the earliest offset. The connector is stopped and resumed around
            the reset.
            
            ⚠️ Everything is reprocessed, so expect duplicates downstream unless
            the target is idempotent. Use alter when you only want to move back
            to a specific point.
            
            See https://docs.confluent.io/cloud/current/connectors/offsets.html
            
        usage: playground connector offsets reset [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
      - name: alter
        description: | 
          ⛏️ Alter offsets for source and sink connectors
            
            Fetches the current offsets, opens them in your editor, and applies
            what you saved once you close the file. That is how you rewind a sink
            to a given offset, or move a source back to an earlier position,
            without replaying everything.
            
            The connector is stopped before the change and resumed after it. On
            Confluent Cloud the change is asynchronous, so the command then polls
            get-offsets-request-status and prints the resulting offsets.
            
            See https://docs.confluent.io/cloud/current/connectors/offsets.html
            
        usage: playground connector offsets alter [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
      - name: get-offsets-request-status
        description: | 
          👁️‍🗨️ Get the status of the previous offset request
            
            On Confluent Cloud, alter and reset only queue a request. This shows
            whether it was APPLIED or FAILED, and the error when it failed, which
            is the only place the reason shows up.
            
            Only for fully managed and custom connectors, self managed connectors
            apply the change synchronously.
            
            See https://docs.confluent.io/cloud/current/connectors/offsets.html
            
        usage: playground connector offsets get-offsets-request-status [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
        - names:
          - --connector
          - -c
          argument: CONNECTOR
          description: | 
            🔗 Connector name
            
            🎓 Tip: If not specified, the command will apply to all connectors
            
  - name: connect-migration-utility
    description: | 
        🧩 Run Kafka Connector Migration Utility (see https://github.com/confluentinc/connect-migration-utility/) on running connect cluster
        
        Takes a self managed connector running in the connect container and
        recreates it as a fully managed connector in Confluent Cloud, keeping
        its offsets so consumers do not replay or skip data. Two steps:
        
          discovery   read the local connectors and export their configurations
          migrate     create the equivalent connectors on Confluent Cloud
        
        Run discovery first, migrate second. Use it to rehearse a customer's
        migration and see what their configuration turns into.
        
        The connector example should be ran with --environment flag set to ccloud.
        
        See a full example at https://github.com/vdesabou/kafka-docker-playground/blob/master/ccloud/connect-migration-utility/README.md
        
    usage: playground connector connect-migration-utility COMMAND
    options: []
    subcommands:
      - name: discovery
        description: | 
          👨‍🔬 Discover connectors in the local connect cluster and export their configurations to files
              
              see https://github.com/confluentinc/connect-migration-utility/tree/master?tab=readme-ov-file#step-1-specify-the-connector-configuration
            
        usage: playground connector connect-migration-utility discovery [OPTIONS]
        options:
        - names:
          - --verbose
          - -v
          argument: ""
          description: | 
            🐞 Show command being ran.
            
      - name: migrate
        description: | 
          🪄 Migrate discovered connectors to fully managed connectors
            
              see https://github.com/confluentinc/connect-migration-utility/tree/master?tab=readme-ov-file#step-2-migrate-the-connector
              ⚠️ <discovery> command should be run first
            
        usage: playground connector connect-migration-utility migrate [OPTIONS]
        options:
        - names:
          - --migration-mode
          argument: create
          description: | 
            - create: Create connector without any offset consideration
            - stop_create_latest_offset: Create a connector with no data loss/duplication (the python script stops the self-managed connector and fetches the latest offset and creates a fully-managed connector on Confluent Cloud using the fetched offset). See https://github.com/confluentinc/connect-migration-utility/tree/master?tab=readme-ov-file#create-a-connector-with-no-data-lossduplication.
            - create_latest_offset: Create a connector with no downtime (the python script fetches the latest offset without stopping the connector and creates a fully-managed connector on Confluent Cloud using the fetched offset. This option may cause data duplication as the self-managed connector is still running). See https://github.com/confluentinc/connect-migration-utility/tree/master?tab=readme-ov-file#create-a-connector-with-no-downtime.
            
            Default value: create
            
            Allowed values: stop_create_latest_offset, create, create_latest_offset
            
        - names:
          - --sensitive-property
          argument: SENSITIVE-PROPERTY
          description: | 
            🔐 Pass sensitive config properties when migrating connector
            
            🎓 Tip: you can pass multiple properties by specifying --sensitive-property multiple times
            
            Example: --sensitive-property "aws.access.key.id=xxx" --sensitive-property "aws.secret.access.key=xxx"
            
            Repeatable: ✓ Yes
            
  - name: ec2
    description: | 
        ✨ Create and manage AWS EC2 instances (using Cloud Formation) to run kafka-docker-playground
        
        🪄 Open EC2 instances directly in Visual Studio code using Remote Development (over SSH)
        
        Run the playground on a remote machine instead of your laptop, which is
        what you want for an example that needs far more CPU or memory than you
        have, or one that must run for hours.
        
          create              provision the instance with Cloud Formation
          open                open it in VS Code over SSH, as if it were local
          push-secrets        send your credentials to it, over ssh
          sync-repro-folder   keep reproduction-models in step, both directions
          list / status / start / stop / delete
        
        💰 The instance is billed while it runs. Use 'playground ec2 stop' when
           you pause, and 'playground ec2 delete' when you are done;
           'playground status' reminds you when one is still up.
        
        🔐 A pem file is created at the root of the repository when the instance
           is created. Back it up, it is the only way in, and only your current
           ip address is allowed to connect.
    usage: playground ec2 COMMAND
    options: []
    subcommands:
      - name: create
        description: | 
          👷 Create kafka-docker-playground EC2 instance using AWS Cloud Formation
            
            One command does the whole thing: a Cloud Formation stack, an instance
            with docker and the playground repository already installed, a key pair,
            a security group opened to your ip only. Your credentials are pushed to
            it over ssh, then VS Code opens on it.
            
            Creation takes a few minutes, and Cloud Formation keeps installing in the
            background for about ten more. Follow output.log in the root folder of
            the instance to see where it is.
            
            🔐 AWS EC2 pem file for the ec2 instance will be created and stored in the
            root folder of the repository (make sure to do a backup, it is the only
            way in).
            
            🌍 Region being used will be the one set in your environment
            (aws configure get region) either by the AWS_REGION environment variable
            or ~/.aws/config.
            
            💰 The instance is billed from now on. Stop it when you pause and delete
            it when you are done.
            
            🐚 Use zsh on the instance to have everything working out of the box.
        usage: playground ec2 create [OPTIONS]
        options:
        - names:
          - --instance-type
          argument: t3.2xlarge
          description: | 
            🧑‍💻 instance type. default is t3.2xlarge
            
            Default value: t3.2xlarge
            
            Allowed values: c1.medium, c1.xlarge, c3.2xlarge, c3.4xlarge, c3.8xlarge, c3.large, c3.xlarge, c4.2xlarge, c4.4xlarge, c4.large, c4.xlarge, m1.large, m1.medium, m1.small, m1.xlarge, m2.2xlarge, m2.4xlarge, m2.xlarge, m3.2xlarge, m3.large, m3.medium, m3.xlarge, m4.10xlarge, m4.2xlarge, m4.4xlarge, m4.large, m4.xlarge, t1.micro, t2.large, t2.medium, t2.micro, t2.nano, t2.small, t3.2xlarge
            
        - names:
          - --size
          argument: 1000
          description: | 
            💾 instance size in Gb. default is 1000 Gb
            
            Default value: 1000
            
        - names:
          - --suffix
          argument: SUFFIX
          description: | 
            📮 suffix to add to instance name, giving pg-<username>-<suffix>
            
            if not set, the name is pg-<username>-<6 random characters>
            
            🎓 Tip: set it to the case number you are working on, so you can tell
            your instances apart in 'playground ec2 list'.
            
      - name: delete
        description: | 
          ❌ Delete an EC2 instance created with Cloud Formation
            
            Deletes the Cloud Formation stack, which takes the instance, its volume
            and its security group with it, then removes the key pair on AWS and the
            local pem file. This is what stops the billing for good, unlike stop
            which only pauses it.
            
            ⚠️ Everything on the instance is lost, including any reproduction model
            you have not synced back with 'playground ec2 sync-repro-folder'.
            
            Without --instance it applies to all your instances, and asks you to
            confirm first.
        usage: playground ec2 delete [OPTIONS]
        options:
        - names:
          - --instance
          - -i
          argument: INSTANCE
          description: | 
            🌀 ec2 instance cloudformation (need to use completion to get all required details)
            
            🎓 Tip: If not specified, the command will apply to all ec2 instances
            
      - name: open
        description: | 
          👨‍💻 Open an EC2 instance using Visual Studio code
            
            Opens a VS Code window on the instance over ssh, using Remote
            Development. The editor, the terminal and the playground CLI all run
            there, so it feels like working locally while the containers use the
            remote machine's CPU and memory.
            
            The security group is refreshed with your current ip on the way, so this
            is also the command to run after your ip changed and ssh stopped working.
            
            🔐 Only your current ip address will be allowed to connect.
        usage: playground ec2 open [OPTIONS]
        options:
        - names:
          - --instance
          - -i
          argument: INSTANCE
          description: | 
            🖥️ ec2 instance (need to use completion to get all required details)
            
            🎓 Tip: If not specified, the command will apply to all ec2 instances
            
        - names:
          - --enable-sync-repro-folder
          argument: ""
          description: | 
            👉 Enable sync reproduction-models folder between local and ec2 instance
            
      - name: list
        description: | 
          🔘 List all EC2 instance
            
            Your playground instances and their state. Anything not stopped is
            costing money.
        usage: playground ec2 list
        options: []
      - name: stop
        description: | 
          🔴 Stop an EC2 instance
            
            Shuts the instance down while keeping its disk, so you stop paying for
            compute and find your work again on 'playground ec2 start'.
        usage: playground ec2 stop [OPTIONS]
        options:
        - names:
          - --instance
          - -i
          argument: INSTANCE
          description: | 
            🖥️ ec2 instance (need to use completion to get all required details)
            
            🎓 Tip: If not specified, the command will apply to all ec2 instances
            
      - name: start
        description: | 
          🟢 Start an EC2 instance
            
            Boots an instance stopped earlier. Its public address changes, so use
            'playground ec2 open' rather than a bookmarked ssh command.
        usage: playground ec2 start [OPTIONS]
        options:
        - names:
          - --instance
          - -i
          argument: INSTANCE
          description: | 
            🖥️ ec2 instance (need to use completion to get all required details)
            
            🎓 Tip: If not specified, the command will apply to all ec2 instances
            
      - name: sync-repro-folder
        description: | 
          ↔️ Synchronize reproduction-models folder between local and ec2 instance
            
            The reproduction models you write are the only thing on the instance
            worth keeping, and deleting the instance destroys them. These two
            commands copy that folder in one direction or the other with rsync.
            
              local-to-ec2   push what you wrote locally, before running it there
              ec2-to-local   pull back what you wrote there, before deleting it
            
            'playground ec2 create' runs local-to-ec2 for you, and
            'playground ec2 open --enable-sync-repro-folder' does it again each
            time you open the instance.
            
            ⚠️ Get into the habit of running ec2-to-local before
            'playground ec2 delete', nothing else brings those files back.
            
            Note: rsync needs to be installed
            
        usage: playground ec2 sync-repro-folder COMMAND
        options: []
      - name: push-secrets
        description: | 
          🔐 Send the secrets store to an ec2 instance
            
            Writes ~/.playground-secrets.properties (mode 0600) on the instance, which
            the playground .zshrc sources on login. This replaces the encrypted
            secrets.tar.gpg committed in the repository.
            
            The file is piped over ssh, so no clear text copy is ever written locally
            and the values never appear in 'ps'.
            
            The credentials that cannot be stored as name=value pairs are sent too,
            when they exist at the root of the repository:
            
              aws_credentials_with_assuming_iam_role       -> ~/.aws/credentials-with-assuming-iam-role
              aws_credentials_aws_account_with_assume_role -> ~/.aws/credentials_aws_account_with_assume_role
              github_ssh_key_file                          -> ~/.ssh/id_rsa
        usage: playground ec2 push-secrets [OPTIONS]
        options:
        - names:
          - --instance
          - -i
          argument: INSTANCE
          description: | 
            🖥️ ec2 instance (need to use completion to get all required details)
            
            🎓 Tip: If not specified, the command will apply to all ec2 instances
            
        - names:
          - --profile
          argument: PROFILE
          description: | 
            🗂️ Secrets profile to use (default is the active one)
            
        - names:
          - --dry-run
          argument: ""
          description: | 
            🔍 List what would be sent, change nothing
            
  - name: sync-repro-folder
    description: | 
        ↔️ Synchronize reproduction-models folder between local and ec2 instance
        
        The reproduction models you write are the only thing on the instance
        worth keeping, and deleting the instance destroys them. These two
        commands copy that folder in one direction or the other with rsync.
        
          local-to-ec2   push what you wrote locally, before running it there
          ec2-to-local   pull back what you wrote there, before deleting it
        
        'playground ec2 create' runs local-to-ec2 for you, and
        'playground ec2 open --enable-sync-repro-folder' does it again each
        time you open the instance.
        
        ⚠️ Get into the habit of running ec2-to-local before
        'playground ec2 delete', nothing else brings those files back.
        
        Note: rsync needs to be installed
        
    usage: playground ec2 sync-repro-folder COMMAND
    options: []
    subcommands:
      - name: local-to-ec2
        description: | 
          👉 Sync local reproduction-models folder to ec2 instance
            
            Copies your local reproduction-models to the instance, so you can run
            there a model you started writing on your laptop.
        usage: playground ec2 sync-repro-folder local-to-ec2 [OPTIONS]
        options:
        - names:
          - --instance
          - -i
          argument: INSTANCE
          description: | 
            🖥️ ec2 instance (need to use completion to get all required details)
            
            🎓 Tip: If not specified, the command will apply to all ec2 instances
            
      - name: ec2-to-local
        description: | 
          👈 Sync ec2 instance reproduction-models folder to local
            
            Brings back the models you wrote on the instance. Run it before
            'playground ec2 delete', otherwise they go with the instance.
        usage: playground ec2 sync-repro-folder ec2-to-local [OPTIONS]
        options:
        - names:
          - --instance
          - -i
          argument: INSTANCE
          description: | 
            🖥️ ec2 instance (need to use completion to get all required details)
            
            🎓 Tip: If not specified, the command will apply to all ec2 instances
            
