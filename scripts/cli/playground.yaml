---
name: playground
description: "\U0001F9E0 CLI for Kafka Docker Playground \U0001F433\n\n\U0001F449
  Check documentation https://kafka-docker-playground.io/#/cli"
usage: playground [OPTIONS] COMMAND
options:
- names:
  - "--vvv"
  - "-v"
  argument: ''
  description: "\U0001F41B set verbose output (set -x)\n\n❗ it can print sensitive
    information ❗"
- names:
  - "--output-level"
  - "-o"
  argument: LEVEL
  description: |-
    ❕Log level used by all commands

    Default is INFO (all INFO, WARN and ERROR will be printed in command output)

    Allowed values: INFO, WARN, ERROR
subcommands:
- name: help
  description: Show help about a command
  usage: playground help [COMMAND]
  options: []
- name: status
  description: "\U0001F5FA️ Show a status\n\nA single screen answering \"what is running
    right now, and is it healthy\":\nthe example currently running and its documentation
    link, the state of\nevery container (flagging the exited or restarting ones),
    the version of\nevery connector, the status and configuration of each of them,
    the topics\nthat exist, and whether an EC2 instance of yours is still up.\n\nEverything
    comes from the running containers and from playground.ini, so\nit is also the
    quickest way to get back your bearings after a break."
  usage: playground status
  options: []
- name: doctor
  description: "\U0001FA7A Check that the container engine is ready for the playground\n\nReports
    which engine the 'docker' CLI is really talking to — \U0001F433 Docker or\n\U0001F9AD
    Podman — and checks what has to be right before any example can start:\nthe engine
    is reachable, compose v2 is there, there is enough memory, and,\nwith podman,
    that short image names resolve, that privileged ports can be\npublished and that
    bind mounts will be readable from the host.\n\nThis is the one command that still
    runs when the engine is down, so it is\nwhat to run first when an example fails
    before a single container starts.\n\nExits 1 if it found a blocking problem, 0
    otherwise.\n\n\U0001F449 Check documentation https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%a6%ad-using-podman-instead-of-docker"
  usage: playground doctor
  options: []
- name: config
  description: "⚙️ Configure CLI\n\nYour preferences, kept between sessions:\n\n  editor
    <name>                      the editor every command opens files\n                                     with
    (code, vi, nano...)\n  folder_zip_or_jar <dir>...         where to look for connector
    zips and\n                                     jars, in addition to the current\n
    \                                    folder\n  clipboard true|false               copy
    connector config to the\n                                     clipboard (macOS
    only)\n  container-kill-all-before-run      kill every container before each run,\n
    \                                    or just stop the example\n  cleanup-ccloud-resources-after-run
    delete the Confluent Cloud connectors\n                                     and
    topics of the last ccloud run on\n                                     stop and
    before the next run\n                                     (ask, true or false)\n
    \ check-and-update-repo-version      warn when your clone is out of date\n  open-ccloud-connector-in-browser
    \  open fully managed connectors, and in\n  open-grafana-in-browser            which
    browser\n\n\U0001F393 Tip: all of them can also be changed from the '⚙️ CLI preferences'\nentry
    of the 'playground run' menu."
  usage: playground config COMMAND
  options: []
  subcommands:
  - name: editor
    description: editor to use to open files
    usage: playground config editor EDITOR
    options: []
  - name: folder_zip_or_jar
    description: "\U0001F4C2 list of folders where to search for zip or jar\ncurrent
      folder is always included\n\ndefault is ~ (home dir)"
    usage: playground config folder_zip_or_jar FOLDER...
    options: []
  - name: clipboard
    description: copy to clipboard connector config (only working on MacOS)
    usage: playground config clipboard [ENABLED]
    options: []
  - name: open-ccloud-connector-in-browser
    description: when running a fully managed connector example, it opens the connector
      in browser
    usage: playground config open-ccloud-connector-in-browser COMMAND
    options: []
    subcommands:
    - name: automatically
      description: automatically open the connector in browser
      usage: playground config open-ccloud-connector-in-browser automatically [AUTOMATICALLY]
      options: []
    - name: browser
      description: browser to use
      usage: playground config open-ccloud-connector-in-browser browser [BROWSER]
      options: []
  - name: open-grafana-in-browser
    description: when running an example with --enable-jmx-grafana flag, it opens
      grafana in browser
    usage: playground config open-grafana-in-browser COMMAND
    options: []
    subcommands:
    - name: automatically
      description: automatically open grafana in browser
      usage: playground config open-grafana-in-browser automatically [AUTOMATICALLY]
      options: []
    - name: browser
      description: browser to use
      usage: playground config open-grafana-in-browser browser [BROWSER]
      options: []
  - name: container-kill-all-before-run
    description: when running an example, always call playground container kill-all
      first. If set to false, it will call playground stop instead.
    usage: playground config container-kill-all-before-run [ENABLED]
    options: []
  - name: cleanup-ccloud-resources-after-run
    description: "\U0001F9F9 delete the Confluent Cloud resources left by the last
      ccloud example\n\nConnectors and topics created by a ccloud 'playground run'
      are recorded\nwith the run. On 'playground stop', and at the start of the next\n'playground
      run', the ones still alive are listed and deleted:\n\n  ask     list them and
      ask for confirmation (default)\n  true    delete them without asking\n  false
      \  never delete them\n\nFully managed connectors are billed while they exist,
      and an\ninterrupted example never reaches its final 'playground connector\ndelete'.
      Resources of older runs, or created outside a run, are left\nalone: use 'playground
      cleanup-cloud-resources --resource ccloud'."
    usage: playground config cleanup-ccloud-resources-after-run [MODE]
    options: []
  - name: check-and-update-repo-version
    description: when running an example, always check if repo version is older than
      3 days, if disabled, it will skip this check.
    usage: playground config check-and-update-repo-version [ENABLED]
    options: []
- name: secrets
  description: "\U0001F510 Credentials required by examples\n\nExamples declare the
    environment variables they need. Store them once here\nand 'playground run' loads
    them automatically, picking only the ones the\nexample at hand declares:\n\n  playground
    secrets set SALESFORCE_PASSWORD    \U0001F510 store it, prompted\n  playground
    secrets check -f <example>         ✅ what is still missing\n  playground run -f
    <example>                   \U0001F680 loaded for you\n\n\U0001F4C2 Where it is
    stored\n\nIn ~/.config/kafka-docker-playground, never in the repository, so it\nsurvives
    'git clean -fdx' and can never be committed by mistake:\n\n  secrets.ini  0600
    \ credentials, as a reference to the backend ('op://...', 'keychain:...'), not
    as a value\n  env.ini      0644  plain variables, in clear text\n\nA name containing
    PASSWORD, PASSPHRASE, SECRET, TOKEN, KEY, CREDS, PWD or\nLICENSE is treated as
    a credential, anything else as a plain variable\n(GCP_PROJECT, AWS_REGION, an
    account name, a URL). Use --secret or\n--plain with 'playground secrets set' to
    decide yourself.\n\n\U0001F3E6 Backends\n\nWhere the credential values themselves
    are kept:\n\n  - keychain     macOS Keychain\n  - secret-tool  freedesktop secret
    service (GNOME Keyring, KWallet)\n  - pass         the standard unix password
    manager\n  - op           1Password, through the 'op' CLI\n  - vault        HashiCorp
    Vault\n  - file         clear text in secrets.ini, no encryption, last resort\n\nWith
    no configuration, the first available of keychain (macOS), then\nsecret-tool,
    then pass is used, and file is the fallback. op and vault\nare never picked automatically,
    so that an example never blocks on an\nunlock prompt. Choose one explicitly with:\n\n
    \ playground secrets backend op\n\nop creates and rotates the items it stores.
    vault is reference-only:\ncreate the secret in Vault, then point a variable at
    it. Any backend can\nalso reuse a secret you already have, instead of storing
    a new one:\n\n  playground secrets link SALESFORCE_PASSWORD op://Private/sfdc/password\n\n\U0001F5C2️
    Profiles\n\nA profile is an independent set of variables, typically one per customer\nor
    per support case, so last week's credentials never leak into this\nweek's reproduction
    model:\n\n  - playground secrets profile customer-123456    \U0001F5C2️ switch
    to it\n  - playground secrets profile                    \U0001F4CB list them,
    with counts\n  - playground secrets list --profile default     \U0001F3AF use
    one just this once\n\nLookup falls back to the 'default' profile, so what is shared
    between all\nof them (CONFLUENT_LICENSE, NGROK_AUTH_TOKEN) is stored there once.\n\n\U0001F50D
    Resolution order\n\n  1. an exported environment variable, which always wins\n
    \ 2. the active profile\n  3. the default profile\n\nSo 'export FOO=bar' and 'source
    secret.properties' keep working, and\n'playground secrets list' flags what the
    environment overrides.\n\n⚙️ Configuration\n\n  - playground config set secrets.backend
    <backend>      \U0001F3E6 see above\n  - playground config set secrets.profile
    <name>         \U0001F5C2️ active profile\n  - playground config set secrets.op-vault
    <vault>       \U0001F511 1Password vault\n\nPLAYGROUND_SECRETS_DIR, PLAYGROUND_SECRETS_BACKEND,\nPLAYGROUND_SECRETS_PROFILE
    and PLAYGROUND_OP_VAULT override them for a\nsingle command."
  usage: playground secrets COMMAND
  options: []
  subcommands:
  - name: set
    description: "\U0001F510 Store a credential\n\nWithout --value the value is prompted
      without echo, so it never lands in\nthe shell history.\n\nA name that looks
      like a credential (PASSWORD, SECRET, TOKEN, KEY, CREDS,\nPWD, PASSPHRASE, LICENSE)
      goes to the secure backend, anything else is\nkept as a plain variable. Use
      --secret or --plain to decide yourself.\n\nRun again on a name already stored
      to rotate it. The value is then\nupdated where the existing reference points,
      which is not necessarily\nthe backend currently configured.\n\n\U0001F393 Tip:
      set the config key secrets.github-repo and every value stored\nhere is also
      pushed to that repository's GitHub Actions secrets."
    usage: playground secrets set NAME [OPTIONS]
    options:
    - names:
      - "--value"
      argument: VALUE
      description: "\U0001F513 Value to store\n\n❗ it will be visible in your shell
        history, prefer the prompt ❗"
    - names:
      - "--secret"
      argument: ''
      description: "\U0001F510 Treat the value as a credential, whatever the variable
        name is\n\nIt goes to the secure backend (keychain, 1Password, pass…) instead
        of\nbeing kept in clear text.\n\nConflicts with: --plain"
    - names:
      - "--plain"
      argument: ''
      description: "\U0001F4DD Treat the value as a non sensitive variable\n\nIt is
        kept in clear text in env.ini, which is handy for a URL, an\naccount name
        or a project id.\n\nConflicts with: --secret"
    - names:
      - "--profile"
      argument: PROFILE
      description: "\U0001F5C2️ Secrets profile to use (default is the active one)"
  - name: get
    description: "\U0001F50D Show a stored credential (masked unless --reveal is used)\n\nResolved
      the same way an example does: an exported environment variable\nfirst, then
      the active profile, then the default one."
    usage: playground secrets get NAME [OPTIONS]
    options:
    - names:
      - "--reveal"
      argument: ''
      description: "\U0001F440 Print the value in clear text\n\n❗ it will be visible
        in your terminal scrollback ❗"
    - names:
      - "--profile"
      argument: PROFILE
      description: "\U0001F5C2️ Secrets profile to use (default is the active one)"
  - name: unset
    description: "\U0001F5D1️ Remove a stored credential\n\nThe value goes too, not
      only the reference: the keychain entry is\ndeleted, the 1Password item is archived.\n\nA
      secret pointed at with 'playground secrets link' is left untouched,\nsince it
      belongs to you and not to the playground."
    usage: playground secrets unset NAME [OPTIONS]
    options:
    - names:
      - "--profile"
      argument: PROFILE
      description: "\U0001F5C2️ Secrets profile to use (default is the active one)"
    aliases:
    - delete
    - rm
  - name: list
    description: "\U0001F4CB List stored credentials\n\nValues are never printed:
      secrets are shown as a masked fingerprint\n(last 4 characters and a sha256 prefix),
      which is enough to tell whether\nit is the token you rotated yesterday. Plain
      variables are shown as is.\n\nTwo markers to look out for:\n\n  ⚠️ overridden
      by the environment   an exported variable is what the\n                                    example
      will actually get\n  ❌ cannot be resolved              the reference is there
      but the\n                                    backend gave nothing back, usually\n
      \                                   a locked session or a deleted item"
    usage: playground secrets list [OPTIONS]
    options:
    - names:
      - "--show-source"
      argument: ''
      description: "\U0001F517 Show the backend reference instead of the fingerprint"
    - names:
      - "--profile"
      argument: PROFILE
      description: "\U0001F5C2️ Secrets profile to use (default is the active one)"
  - name: link
    description: "\U0001F517 Point a variable at a secret manager, without storing
      any value\n\nThe store then only contains a reference, which is safe to back
      up, sync\nbetween machines, or share with your team.\n\nUse it to reuse a secret
      that already exists, rather than storing a\nsecond copy of it, and for the vault
      backend which playground never\nwrites to. The reference is resolved right away,
      so a typo or a locked\nsession is reported on the spot.\n\n'playground secrets
      unset' drops the reference but leaves the secret\nitself alone."
    usage: playground secrets link NAME REFERENCE [OPTIONS]
    options:
    - names:
      - "--profile"
      argument: PROFILE
      description: "\U0001F5C2️ Secrets profile to use (default is the active one)"
  - name: check
    description: "✅ Show what an example needs, and what is missing\n\nOne line per
      variable, saying where the value comes from (environment,\nor which backend
      and which reference) or how to store it. AWS and GCP\nexamples also get their
      ~/.aws/credentials and keyfile.json checked.\n\nThe list comes from the example
      itself: every variable it declares with\nthe standard 'Export it as environment
      variable or pass it as argument'\nerror string, which is also what 'playground
      run' loads.\n\nExits 1 when something is missing.\n\n\U0001F393 Tip: run it
      before a long example, it fails in a second instead of\nseveral minutes into
      the environment startup."
    usage: playground secrets check [OPTIONS]
    options:
    - names:
      - "--file"
      - "-f"
      argument: FILE
      description: "\U0001F4C4 Example script (default is the last example ran)"
    - names:
      - "--profile"
      argument: PROFILE
      description: "\U0001F5C2️ Secrets profile to use (default is the active one)"
  - name: env
    description: "\U0001F41A Export what an example needs into the current shell\n\nThis
      is the replacement for 'source secret.properties'. Instead of putting\nevery
      credential into every shell, it exports only the variables the example\nat hand
      declares, read from the secrets store:\n\n  source <(playground secrets env)\n\nHandy
      when copy pasting pieces of an example script into a terminal. With no\n--file
      it uses the last example ran, like 'playground secrets check'.\n\nThe shell
      code goes to stdout and everything else to stderr, so nothing\nunexpected ever
      gets executed. Running it straight in a terminal is\nrefused rather than printing
      every value on screen, use --force for\nthat.\n\n\U0001F393 Tip: put a shortcut
      in your shell profile:\n\n  alias pgenv='source <(playground secrets env)'"
    usage: playground secrets env [OPTIONS]
    options:
    - names:
      - "--file"
      - "-f"
      argument: FILE
      description: "\U0001F4C4 Example script (default is the last example ran)"
    - names:
      - "--all"
      argument: ''
      description: "\U0001F4E6 Export the whole profile, not only what the example
        needs"
    - names:
      - "--force"
      argument: ''
      description: "\U0001F648 Print to a terminal anyway, showing every value in
        clear"
    - names:
      - "--profile"
      argument: PROFILE
      description: "\U0001F5C2️ Secrets profile to use (default is the active one)"
  - name: import
    description: "\U0001F4E5 Import an existing secret.properties / variable.properties
      file\n\nEach KEY=value line is classified and stored in the right place. A\nleading
      'export', comments, blank lines and one level of surrounding\nquotes are handled;
      anything that is not an uppercase variable name is\nskipped and reported.\n\nThis
      is the one step migration away from 'source secret.properties'."
    usage: playground secrets import [OPTIONS]
    options:
    - names:
      - "--file"
      argument: FILE
      description: "\U0001F4C4 File to import\n\nRequired: ✓ Yes"
    - names:
      - "--shred"
      argument: ''
      description: "\U0001F525 Securely delete the source file after a successful
        import"
    - names:
      - "--secret"
      argument: ''
      description: "\U0001F510 Treat every line as a credential, whatever the variable
        names are\n\nConflicts with: --plain"
    - names:
      - "--plain"
      argument: ''
      description: "\U0001F4DD Treat every line as a non sensitive variable\n\nThat
        is what a variables.properties file usually is: regions, project\nids, account
        names, URLs.\n\nConflicts with: --secret"
    - names:
      - "--profile"
      argument: PROFILE
      description: "\U0001F5C2️ Secrets profile to use (default is the active one)"
  - name: export
    description: "\U0001F4E4 Write every credential of a profile to a file, in clear
      text\n\n❗ Only for the rare case where a tool needs a properties file ❗\n\nThe
      file is written with mode 0600, and a path inside the repository is\nrefused:
      it would be one 'git add -A' away from being committed.\n\n\U0001F393 Tip: to
      feed a shell instead of a file, 'playground secrets env' is\nwhat you want,
      it exports without writing anything to disk."
    usage: playground secrets export [OPTIONS]
    options:
    - names:
      - "--file"
      argument: FILE
      description: "\U0001F4C4 Destination file, outside the repository\n\nRequired:
        ✓ Yes"
    - names:
      - "--yes-i-want-plaintext"
      argument: ''
      description: "\U0001F513 Required, this writes credentials in clear text"
    - names:
      - "--only"
      argument: ONLY
      description: "\U0001F3AF Export only the credentials, only the plain variables,
        or both\n\nDefault value: all\nAllowed values: secret, plain, all"
    - names:
      - "--profile"
      argument: PROFILE
      description: "\U0001F5C2️ Secrets profile to use (default is the active one)"
  - name: edit
    description: |-
      ✏️ Open the store in your editor

      secrets.ini by default, env.ini with --plain. Unless the backend is
      file, secrets.ini holds references and not values, so this is where you
      rename a variable or move one between profiles, not where you read a
      password.

      Uses the config key editor, then the EDITOR environment variable, then
      vi.
    usage: playground secrets edit [OPTIONS]
    options:
    - names:
      - "--plain"
      argument: ''
      description: "\U0001F4DD Edit the non sensitive variables instead of the secrets"
  - name: backend
    description: "\U0001F3E6 Show or change where secrets are kept\n\n  keychain     macOS
      Keychain, through 'security'\n  secret-tool  freedesktop secret service (GNOME
      Keyring, KWallet)\n  pass         the standard unix password manager\n  op           1Password,
      through the 'op' CLI\n  vault        HashiCorp Vault, through the 'vault' CLI\n
      \ file         clear text in secrets.ini, no encryption, last resort\n\nWith
      no configuration, the first available of keychain (macOS),\nsecret-tool and
      pass is used, and file is the fallback. op and vault\nhave to be chosen here,
      so that an example never blocks on an unlock\nprompt halfway through.\n\nOnly
      new values are affected: what is already stored keeps being read\nfrom, and
      rotated in, the backend it went to.\n\nvault is reference-only, playground never
      writes to it: create the\nsecret there, then use 'playground secrets link'.
      op creates the item\nfor you, named kdp-<profile>-<NAME> in the vault set by\n'playground
      config set secrets.op-vault' (default: Private), and can\nalso point at an existing
      one with 'playground secrets link'."
    usage: playground secrets backend [BACKEND]
    options: []
  - name: profile
    description: "\U0001F5C2️ Show or switch the active profile\n\nA profile is an
      independent set of variables. Without an argument it\nlists them all with their
      variable count, and marks the active one.\n\nA variable missing from the active
      profile is looked up in 'default',\nso what is shared between all of them (CONFLUENT_LICENSE,\nNGROK_AUTH_TOKEN)
      only needs to be stored once, there.\n\nSwitching is persistent, it writes the
      config key secrets.profile. To\nuse another one just for a command, every secrets
      command takes\n--profile.\n\n\U0001F393 Tip: use one profile per support case,
      so last week's customer\ncredentials never leak into this week's reproduction
      model."
    usage: playground secrets profile [PROFILE]
    options: []
  - name: scan
    description: "\U0001F50E Look for stored credentials in clear text in the repository\n\nResolves
      every credential of the profile and greps the working tree,\ntracked and untracked
      files alike, for the values themselves. Catches\nthe password pasted into a
      reproduction model, which no pattern based\nscanner would recognise.\n\nPlain
      variables are skipped, a region or a bucket name is expected to\nappear in an
      example, and so are values shorter than 8 characters,\nwhich would match everywhere.
      Exits 1 as soon as one is found.\n\n\U0001F393 Tip: wire it as a pre-commit
      hook with\n'playground secrets scan --staged'"
    usage: playground secrets scan [OPTIONS]
    options:
    - names:
      - "--staged"
      argument: ''
      description: "\U0001F4E6 Scan the staged diff instead of the whole working tree"
    - names:
      - "--profile"
      argument: PROFILE
      description: "\U0001F5C2️ Secrets profile to use (default is the active one)"
- name: cloud-resources
  description: "☁️ What the playground left behind in your cloud accounts, and what
    it costs\n\nExamples that talk to a real cloud create real resources, and an\ninterrupted
    run leaves them behind. These commands show what is still\nalive and what you
    are being billed for:\n\n  cloud-resources aws list            resources still
    up, scoped to you\n  cloud-resources aws costs           spend over a range of
    dates\n  cloud-resources aws costs-history   spend per month over the last year\n\nThe
    same three exist for azure.\n\n\U0001F9F9 Nothing is deleted here. To actually
    remove the resources, use\n   'playground cleanup-cloud-resources'."
  usage: playground cloud-resources COMMAND
  options: []
  subcommands:
  - name: aws
    description: |-
      ☁️ What is still running in AWS, and what it costs

        list            resources created by the playground, still alive
        costs           spend over a range of dates, by service
        costs-history   spend per month over the last year

      Uses the credentials and region of your aws CLI. Nothing is deleted
      here, use 'playground cleanup-cloud-resources' for that.
    usage: playground cloud-resources aws COMMAND
    options: []
    subcommands:
    - name: list
      description: "\U0001F4CB List all active resources\n\nAWS resources created
        by the playground and still running, matched on\nyour username. Anything in
        the list is still being billed."
      usage: playground cloud-resources aws list [OPTIONS]
      options: []
    - name: costs
      description: "\U0001F4B0 Show aws costs\n\nSpend over a range of dates, broken
        down by AWS service, using the\nCost Explorer API. Run it after a week of
        heavy examples to see which\nservice the money actually went to, then use\n'playground
        cloud-resources aws list' to find what is still up.\n\nDefaults cover the
        last month, ending 3 days ago because AWS needs a\ncouple of days to consolidate.
        --start-date cannot go back more than\none year."
      usage: playground cloud-resources aws costs [OPTIONS]
      options:
      - names:
        - "--start-date"
        argument: START_DATE
        description: "\U0001F5D3️ start date in format yyyy-mm-dd\n\nDefault is 30
          days ago"
      - names:
        - "--end-date"
        argument: END_DATE
        description: "\U0001F5D3️ end date in format yyyy-mm-dd\n\n  Default is 3
          days ago"
    - name: costs-history
      description: "\U0001F45B  Retrieve aws costs for each month since last year\n\nOne
        line per month over the past year, drawn as a histogram, which\nmakes a month
        that went wrong obvious at a glance. Use costs when you\nthen want to know
        which service it was.\n\nBy default it will only display total cost in dollars.
        Use the --detailed flag to see more information."
      usage: playground cloud-resources aws costs-history [OPTIONS]
      options:
      - names:
        - "--detailed"
        argument: ''
        description: "\U0001F4B9 display all details for each month"
  - name: azure
    description: |-
      ☁️ What is still running in Azure, and what it costs

        list            resources created by the playground, still alive
        costs           spend over a range of dates
        costs-history   spend per month over the last year

      Uses the subscription your az CLI is logged into. Nothing is deleted
      here, use 'playground cleanup-cloud-resources' for that.
    usage: playground cloud-resources azure COMMAND
    options: []
    subcommands:
    - name: list
      description: "\U0001F4CB List all active resources\n\nAzure resources created
        by the playground and still running, matched\non your username. Anything in
        the list is still being billed."
      usage: playground cloud-resources azure list [OPTIONS]
      options: []
    - name: costs
      description: "\U0001F4B0 Show azure costs\n\nSpend over a range of dates for
        your subscription, using the Azure\nCost Management API. You need to be logged
        in with the az CLI.\n\nDefaults cover the last month, ending 3 days ago because
        the data\ntakes a couple of days to consolidate. --start-date cannot go back\nmore
        than one year."
      usage: playground cloud-resources azure costs [OPTIONS]
      options:
      - names:
        - "--start-date"
        argument: START_DATE
        description: "\U0001F5D3️ start date in format yyyy-mm-dd\n\nDefault is 30
          days ago"
      - names:
        - "--end-date"
        argument: END_DATE
        description: "\U0001F5D3️ end date in format yyyy-mm-dd\n\n  Default is 3
          days ago"
    - name: costs-history
      description: "\U0001F45B  Retrieve azure costs for each month since last year\n\nOne
        line per month over the past year, so you can spot the month that\nwent wrong
        before digging into it with costs.\n\nBy default it will only display total
        cost in dollars. Use the --detailed flag to see more information."
      usage: playground cloud-resources azure costs-history [OPTIONS]
      options:
      - names:
        - "--detailed"
        argument: ''
        description: "\U0001F4B9 display all details for each month"
- name: ccloud-costs
  description: "\U0001F4B0  Retrieve ccloud costs for a range of dates\n\nAll you
    have to do is to be already logged in with confluent CLI. It is using https://docs.confluent.io/cloud/current/billing/overview.html#retrieve-costs-for-a-range-of-dates\n\nCost
    data can take up to 72 hours to become available.\n\nStart date can reach a maximum
    of one year into the past\n\nOne month is the maximum window between start and
    end dates\n\nFor accuracy, Confluent recommends using a start_date that is at
    least 72 hours prior to the current date and time."
  usage: playground ccloud-costs [OPTIONS]
  options:
  - names:
    - "--start-date"
    argument: START_DATE
    description: "\U0001F5D3️ start date in format yyyy-mm-dd\n\nDefault is 30 days
      ago"
  - names:
    - "--end-date"
    argument: END_DATE
    description: "\U0001F5D3️ end date in format yyyy-mm-dd\n\n  Default is 3 days
      ago"
- name: ccloud-costs-history
  description: "\U0001F45B  Retrieve ccloud costs for each month since last year\n\nAll
    you have to do is to be already logged in with confluent CLI. It is using https://docs.confluent.io/cloud/current/billing/overview.html#retrieve-costs-for-a-range-of-dates\n\nBy
    default it will only display total cost in dollars. Use the --detailed flag to
    see more information."
  usage: playground ccloud-costs-history [OPTIONS]
  options:
  - names:
    - "--detailed"
    argument: ''
    description: "\U0001F4B9 display all details for each month"
- name: run
  description: "\U0001F579️ Run any example !\n\n\U0001F525 It start an interactive
    mode where you'll be fully guided !\n\n  playground run                       \U0001F50D
    pick an example, guided\n  playground run -f <example.sh>       \U0001F680 run
    that one directly\n  playground re-run                    ⚡ same example, same
    flags\n\nEach run stops what was running, starts the environment the example asks\nfor,
    brings up its containers, creates the connector and produces data.\nCredentials
    the example needs are loaded from 'playground secrets'.\n\n\U0001F522 Choosing
    versions\n  --tag             Confluent Platform version for every component\n
    \ --connect-tag     Confluent Platform version for connect only\n  --schema-registry-tag,
    --ksqldb-tag, --control-center-tag\n                    version for that component
    only\n  --connector-tag   connector version from Confluent Hub\n  --connector-zip
    \  connector from a local zip or a URL\n  --connector-jar   a single jar, dropped
    into the existing plugin\n\n\U0001F9F0 Adding to the example\n  --environment
    \    run a connector example under another security setup\n  --enable-<x>      add
    control-center, ksqldb, flink, grafana, kcat...\n  --enable-sql-datagen\n                    continuous
    realistic data for CDC source examples\n  --benchmark       benchmark the connector
    once the example succeeded\n  --connect-community-image, --kafka-community-image\n
    \                   use community images instead of enterprise ones\n  --enable-kraft
    \   KRaft instead of Zookeeper for CP 7.4 to 7.9\n  --connect-log-level\n                    log
    levels set on connect before the connector is created\n\n\n⛅ When running Confluent
    Cloud (ccloud) example:\n\n  All you have to do is to be already logged in with
    confluent CLI.\n\n  By default, a new Confluent Cloud environment with a Cluster
    will be created.\n\n  You can configure the new cluster by setting:\n\n  --cluster-type
    (or CLUSTER_TYPE environment variable): The type of cluster (possible values:
    basic, standard and dedicated, default basic)\n  --cluster-cloud (or CLUSTER_CLOUD
    environment variable): The Cloud provider (possible values: aws, gcp and azure,
    default aws)\n  --cluster-region (or CLUSTER_REGION environment variable): The
    Cloud region (use confluent kafka region list to get the list, default eu-west-2
    for aws, westeurope for azure and europe-west2 for gcp)\n  --cluster-environment
    (or ENVIRONMENT environment variable) (optional): The environment id where want
    your new cluster (example: txxxxx) \n\n  In case you want to use your own existing
    cluster, you need to setup, in addition to previous ones:\n\n  --cluster-name
    (or CLUSTER_NAME environment variable): The cluster name\n  --cluster-creds (or
    CLUSTER_CREDS environment variable): The Kafka api key and secret to use, it should
    be separated with colon (example: <API_KEY>:<API_KEY_SECRET>)\n  --cluster-schema-registry-creds
    (or SCHEMA_REGISTRY_CREDS environment variable) (optional, if not set, new one
    will be created): The Schema Registry api key and secret to use, it should be
    separated with colon (example: <SR_API_KEY>:<SR_API_KEY_SECRET>)\n\n❗ this command
    will kill all containers using \"playground container kill-all\", you can disable
    this by running \"playground config container-kill-all-before-run false\""
  usage: playground run [OPTIONS]
  options:
  - names:
    - "--environment"
    argument: ENVIRONMENT
    description: "\U0001F510 The environment to start when running a connector example
      \n\n- plaintext\n- ccloud\n- cfk\n- cfk-rbac\n- 2way-ssl\n- kerberos\n- ldap-authorizer-sasl-plain\n-
      ldap-sasl-plain\n- rbac-sasl-plain\n- sasl-plain\n- sasl-scram\n- sasl-ssl\n-
      ssl_kerberos\n\nDefault is plaintext.\nThis is only supported when example is
      a connector example\n\nDefault value: plaintext\nAllowed values: ccloud, cfk,
      cfk-rbac, plaintext, sasl-ssl, sasl-plain, 2way-ssl, sasl-scram, kerberos, ssl_kerberos,
      ldap-authorizer-sasl-plain, ldap-sasl-plain, rbac-sasl-plain"
  - names:
    - "--file"
    - "-f"
    argument: FILE
    description: "\U0001F516 Example file to run\n\n❕ It must be absolute full path\n\n\U0001F393
      Tip: use <tab> completion to trigger fzf completion"
  - names:
    - "--open"
    - "-o"
    argument: ''
    description: "\U0001F4D6 Opening example files (including docker-compose file)
      with text editor set with playground config editor <editor> (default is code)"
  - names:
    - "--tag"
    argument: TAG
    description: "\U0001F3AF Confluent Platform (CP) version to use. Applies to all
      components (broker, connect, schema registry, ksqlDB, etc...)\n\nIt sets TAG
      environment variable\n\nMust be greater or equal to 5.3.0\n\n\U0001F393 Tip:
      use <tab> completion to trigger fzf completion"
  - names:
    - "--connect-tag"
    argument: CONNECT_TAG
    description: "\U0001F517 Confluent Platform (CP) version to use. Applies to connect
      only.\n\nIt sets CP_CONNECT_TAG environment variable\n\nMust be greater or equal
      to 5.3.0\n\n\U0001F393 Tip: use <tab> completion to trigger fzf completion"
  - names:
    - "--schema-registry-tag"
    argument: SCHEMA_REGISTRY_TAG
    description: "\U0001F530 Confluent Platform (CP) version to use for schema registry
      only\n\nIt sets CP_SCHEMA_REGISTRY_TAG environment variable\n\n❗ not supported
      with ccloud examples (schema registry is in Confluent Cloud)\n\n\U0001F393 Tip:
      use <tab> completion to trigger fzf completion"
  - names:
    - "--ksqldb-tag"
    argument: KSQLDB_TAG
    description: "\U0001F38F Confluent Platform (CP) version to use for ksqlDB server
      and CLI only, with --enable-ksqldb\n\nIt sets CP_KSQL_TAG and CP_KSQL_CLI_TAG
      environment variables\n\n❗ not supported with ccloud examples\n\n\U0001F393
      Tip: use <tab> completion to trigger fzf completion"
  - names:
    - "--control-center-tag"
    argument: CONTROL_CENTER_TAG
    description: "\U0001F4A0 Control Center version to use, with --enable-control-center\n\nIt
      sets CP_CONTROL_CENTER_TAG environment variable\n\nWith Control Center Next
      Gen (default), this is the version of the confluentinc/cp-enterprise-control-center-next-gen
      image (for example 2.2.0, default is latest)\n\nWith --enable-legacy-control-center,
      this is a CP version (< 8), by default the one of --tag"
  - names:
    - "--connector-tag"
    argument: CONNECTOR_TAG
    description: "\U0001F517 Connector version to use\n\nBy default, for each connector,
      the latest available version on Confluent Hub is used\n\n\U0001F393 Tip: set
      to \" \" in order to select the version dynamically\n\nConflicts with: --connector-zip"
  - names:
    - "--connector-zip"
    argument: CONNECTOR_ZIP
    description: "\U0001F910 Connector zip to use\n\n❕ It must be absolute full path\n\n\U0001F393
      Tip: use <tab> completion to trigger fzf completion \n        use playground
      config folder_zip_or_jar <folder1> <folder2>... (default is home folder and
      current folder is always included) to configure where to search the files\n
      \       use <option+enter> to use the value you typed manually\n\nConflicts
      with: --connector-tag"
  - names:
    - "--connector-jar"
    argument: CONNECTOR_JAR
    description: "\U0001F90E Connector jar to use\n\n❕ It must be absolute full path\n\n\U0001F393
      Tip: use <tab> completion to trigger fzf completion \n        use playground
      config folder_zip_or_jar <folder1> <folder2>... (default is home folder and
      current folder is always included) to configure where to search the files\n
      \       use <option+enter> to use the value you typed manually"
  - names:
    - "--enable-ksqldb"
    argument: ''
    description: "\U0001F680 Enable ksqlDB \n\n❗ not supported with ccloud examples\n\nBy
      default, ksqldb-server and ksqldb-cli containers are not started for every test"
  - names:
    - "--enable-rest-proxy"
    argument: ''
    description: "\U0001F9F2 Enable Rest Proxy\n\n❗ not supported with ccloud examples\n\nBy
      default, rest-proxy container is not started for every test"
  - names:
    - "--enable-control-center"
    argument: ''
    description: "\U0001F4A0 Enable Control Center\n\nBy default, control-center container
      is not started for every test\n\nControl Center is reachable at http://127.0.0.1:9021"
  - names:
    - "--enable-flink"
    argument: ''
    description: "\U0001F43F️ Enable Flink\n\nBy default, flink is not started for
      every test\n\nOnce enabled, the CLI will ask if you need to download any connectors.
      Based on the response, you can download one or more connectors from Flink maven
      repository.\n\nFlink UI is reacheable using http://127.0.0.1:8081 within the
      flink child directory. If you enable Flink by starting connector deployment,
      http://127.0.0.1:18081 will be used."
  - names:
    - "--enable-conduktor"
    argument: ''
    description: "\U0001F43A Enable Conduktor Platform\n\nBy default, Conduktor Platform
      container is not started for every test\n\nConduktor is reachable at http://127.0.0.1:8080/console
      (admin/admin)"
  - names:
    - "--enable-multiple-brokers"
    argument: ''
    description: |-
      3️⃣ Enable multiple brokers

      By default, there is only one broker node enabled
  - names:
    - "--enable-multiple-connect-workers"
    argument: ''
    description: "\U0001F949 Enable multiple connect worker node\n\nBy default, there
      is only one connect worker node enabled"
  - names:
    - "--enable-jmx-grafana"
    argument: ''
    description: "Enable Grafana, Prometheus and Pyroscope\n\n\U0001F4CA Grafana is
      reachable at http://127.0.0.1:3000 (login/password is admin/password)\n\n\U0001F6E1️
      Prometheus is reachable at http://127.0.0.1:9090\n\n\U0001F4DB Pyroscope is
      reachable at http://127.0.0.1:4040"
  - names:
    - "--enable-kcat"
    argument: ''
    description: "\U0001F408‍⬛ Enable kcat\n\nYou can use it with:\n\n$ docker exec
      kcat kcat -b broker:9092 -L"
  - names:
    - "--enable-sql-datagen"
    argument: ''
    description: "\U0001F32A️ Enable SQL Datagen injection\n\nOnce the example succeeded,
      rows are injected with the benchmark-load.bash next to the example script (the
      load of\nplayground connector benchmark): one row per transaction, in parallel
      sessions, for a few minutes, while Grafana shows\nthe connector. Works with
      the JDBC, Debezium, Oracle CDC and XStream source examples (Oracle, MySQL, MariaDB,\nPostgreSQL,
      SQL Server), self-managed and fully managed, and with their reproduction models.\n\nSQL_DATAGEN_DURATION
      (minutes, default 10) and SQL_DATAGEN_SESSIONS (default 5) change the duration
      and the number of\nparallel sessions, BENCHMARK_LOAD_SCRIPT another load script
      than benchmark-load.bash (see playground connector\nbenchmark)."
  - names:
    - "--benchmark"
    argument: ''
    description: "\U0001F3CE️ Benchmark the connector once the example succeeded\n\nRuns
      playground connector benchmark on the connector of the example: a\ndrain of
      the load of a source (benchmark-load.bash next to the example\nscript) or of
      the records produced by a sink example, then the\nthroughput, the HTML report
      and where the task time went. Self-managed\nand fully managed connectors, not
      with the cfk environment.\n\nBENCHMARK_ARGS adds flags to playground connector
      benchmark (e.g.\nBENCHMARK_ARGS=\"--mode steady --duration 5m\"), and BENCHMARK_LOAD_SCRIPT\nselects
      another load script than benchmark-load.bash. If the benchmark\nfails, the command
      exits with its exit code."
  - names:
    - "--connect-community-image"
    argument: ''
    description: "\U0001F331 Use the community connect image (confluentinc/cp-kafka-connect)
      instead of the enterprise one (confluentinc/cp-server-connect)\n\nIt sets CP_CONNECT_IMAGE
      environment variable\n\nMonitoring interceptors are disabled, as they are not
      part of the community image"
  - names:
    - "--kafka-community-image"
    argument: ''
    description: "\U0001F33F Use the community kafka image (confluentinc/cp-kafka)
      instead of the enterprise one (confluentinc/cp-server)\n\nIt sets CP_KAFKA_IMAGE
      environment variable\n\nConfluent Metrics Reporter and Telemetry Reporter are
      disabled, as they are not part of the community image"
  - names:
    - "--enable-kraft"
    argument: ''
    description: "\U0001F6F0️ Start Confluent Platform in KRaft mode\n\nIt sets ENABLE_KRAFT
      environment variable\n\nOnly useful for CP versions from 7.4 to 7.9, where Zookeeper
      is used by default (KRaft is always used for CP >= 8)"
  - names:
    - "--enable-legacy-control-center"
    argument: ''
    description: "\U0001F468‍\U0001F9B3 Use legacy Control Center (confluentinc/cp-enterprise-control-center)
      instead of Control Center Next Gen\n\nIt sets ENABLE_LEGACY_CONTROL_CENTER environment
      variable\n\nLegacy Control Center is not available for CP >= 8. It implies --enable-control-center"
  - names:
    - "--connect-log-level"
    argument: CONNECT-LOG-LEVEL
    description: "\U0001F50A Log level(s) to set on connect, as a comma separated
      list of <package>=<level> (level is one of INFO, WARN, DEBUG, TRACE)\n\nThey
      are applied with 'playground debug log-level set' as soon as the environment
      is started and connect is ready, so before the example creates its connector\n\nExample:
      --connect-log-level \"io.confluent.connect.s3=TRACE,org.apache.kafka.connect.runtime.WorkerSinkTask=DEBUG\""
  - names:
    - "--cluster-cloud"
    argument: CLUSTER-CLOUD
    description: "\U0001F324 The cloud provider: aws, gcp or azure. Default is aws\n\n\U0001F393
      Tip: you can also use CLUSTER_CLOUD environment variable\n\nAllowed values:
      aws, gcp, azure"
  - names:
    - "--cluster-type"
    argument: CLUSTER-TYPE
    description: "\U0001F50B The cluster type: basic, standard or dedicated. Default
      is basic\n\n\U0001F393 Tip: you can also use CLUSTER_TYPE environment variable\n\nAllowed
      values: basic, standard, dedicated"
  - names:
    - "--cluster-region"
    argument: CLUSTER-REGION
    description: "\U0001F5FA The Cloud region. \n\n\U0001F393 Tip: you can also use
      CLUSTER_REGION environment variable\n\U0001F393 Tip: use <tab> completion to
      trigger fzf completion"
  - names:
    - "--cluster-environment"
    argument: CLUSTER-ENVIRONMENT
    description: "\U0001F310 The environment id where want your new cluster (example:
      txxxxx)\n\nℹ️ Optional, if not set, new environment will be created\n\n\U0001F393
      Tip: you can also use ENVIRONMENT environment variable\n\U0001F393 Tip: use
      <tab> completion to trigger fzf completion"
  - names:
    - "--cluster-name"
    argument: CLUSTER-NAME
    description: "\U0001F3B0 The cluster name. \n\n❣️ Only required if you want to
      use your own existing cluster\n\n\U0001F393 Tip: you can also use CLUSTER_NAME
      environment variable\n\U0001F393 Tip: use <tab> completion to trigger fzf completion"
  - names:
    - "--cluster-creds"
    argument: CLUSTER-CREDS
    description: "\U0001F512 The Kafka api key and secret to use, it should be separated
      with colon (example: <API_KEY>:<API_KEY_SECRET>)\n\n❣️ Only required if you
      want to use your own existing cluster\n\n\U0001F393 Tip: you can also use CLUSTER_CREDS
      environment variable"
  - names:
    - "--cluster-schema-registry-creds"
    argument: CLUSTER-SCHEMA-REGISTRY-CREDS
    description: "\U0001F512 The Schema Registry api key and secret to use, it should
      be separated with colon (example: <SR_API_KEY>:<SR_API_KEY_SECRET>)\n\nℹ️ Optional,
      if not set, new credentials will be created\n\n❣️ Only required if you want
      to use your own existing cluster\n\n\U0001F393 Tip: you can also use SCHEMA_REGISTRY_CREDS
      environment variable"
  - names:
    - "--ccloud-service-account"
    argument: ''
    description: "\U0001F464 Run the fully managed connectors with a service account
      (kafka.auth.mode=SERVICE_ACCOUNT)\n\nInstead of the API key of the example,
      each fully managed or custom\nconnector gets its own service account, with the
      ACLs listed in\nhttps://docs.confluent.io/cloud/current/connectors/service-account.html\n(derived
      from the connector config), and the owner of\nCONFLUENT_CLOUD_API_KEY gets the
      Assigner role on it. The example is\nnot changed.\n\nThe service accounts and
      their ACLs are deleted with the connectors\n(playground connector delete, end-of-run
      cleanup, playground\ncleanup-cloud-resources).\n\n\U0001F393 Tip: to reproduce
      an authorization error, delete or deny an ACL with\nplayground rbac acl delete|create
      --connector <connector> [--deny],\nrestart the connector and run playground
      connector diagnose.\nPG_CCLOUD_SERVICE_ACCOUNT_ACL_EXCLUDE skips ACLs when they
      are created."
  - names:
    - "--ccloud-service-account-acls"
    argument: PROFILE
    description: "\U0001F6A6 ACLs of the service accounts created by --ccloud-service-account
      (implies it)\n\n  docs  the ACLs of the documentation, derived from the connector
      config (default)\n  full  every operation on every topic, group and transactional
      id (same as the API key of the example)\n  none  no ACL, add them with playground
      rbac acl create --connector <connector>\n\nAllowed values: docs, full, none"
  - names:
    - "--ccloud-service-account-id"
    argument: SERVICE-ACCOUNT
    description: "\U0001F464 Use this existing service account (sa-xxxxx) for the
      fully managed connectors, as is (implies --ccloud-service-account)\n\nNo ACL
      is created nor deleted, and the service account is kept."
- name: re-run
  description: "⚡ Simply re-run last example you ran with <playground run>\n\nSame
    script and same flags as last time: the --tag, --connector-tag,\n--connector-zip
    and --enable-* you picked are replayed from playground.ini,\nso there is nothing
    to retype after a code change.\n\n\U0001F393 Tip: to re-run with a different version,
    use 'playground run' again and\nchange the flag, or 'playground update-version'
    on the running example."
  usage: playground re-run
  options: []
- name: get-ci-result
  description: "\U0001F916 get CI result for current example\n\nTells you whether
    the example you are running is green in the nightly CI,\nboth for the default
    environment and for cfk, by reading the published\nbadges from kafka-docker-playground.io.\n\n\U0001F449
    Useful before you spend time debugging: if CI is red too, the breakage\nis probably
    not on your side. Reproduction models are always reported as\nfine, they are not
    part of the CI matrix.\n\n\U0001F525 With --logs, also tells why it is red: the
    latest failing CI job of the\nexample is located from its '\U0001F525' GitHub
    issue, its full log is downloaded,\nand for each failing script the last lines
    before the failure are shown\nwith a digest of the ERROR/FATAL records (same digest
    as 'playground\ncontainer logs --errors').\n\nUse --test to ask about any example,
    without running it."
  usage: playground get-ci-result [OPTIONS]
  options:
  - names:
    - "--test"
    - "-t"
    argument: TEST
    description: "\U0001F4C2 Example directory (or script) to check, instead of the
      current example\n\nExamples: connect/connect-aws-s3-sink, other/connect-secret-registry"
  - names:
    - "--environment"
    argument: ENVIRONMENT
    description: "\U0001F510 CI environment to check: plaintext or cfk\n\nDefault
      is the environment of the current example, or plaintext with --test\n\nAllowed
      values: plaintext, cfk"
  - names:
    - "--podman"
    argument: ''
    description: "\U0001F9AD Check the podman CI run instead of the docker one"
  - names:
    - "--logs"
    argument: ''
    description: "\U0001F525 When CI is red, show why: tail and ERROR/FATAL digest
      of each failing script of the latest failing job"
  - names:
    - "--max-findings"
    argument: MAX_FINDINGS
    description: |-
      ✂️ With --logs, maximum number of distinct records to show per failing script (default 20)

      Default value: 20
- name: history
  description: "\U0001F3F0 Get an history of the examples which were run with run
    command and run it again\n\nOpens a picker over every 'playground run' command
    you have executed,\nmost recent first and de-duplicated. The command you select
    is shown for\nediting before it runs, so you can change a --tag or add a flag
    on the way."
  usage: playground history
  options: []
- name: find-example
  description: "\U0001F50E Find examples matching a free-text query, without the interactive
    picker\n\nSearches every runnable example script (connect/, ccloud/, ksqldb/,\nflink/,
    reproduction-models/, ...) by path, connector class, README title\nand script
    body. Every word of the query must match somewhere; matches in\nthe path and connector
    class rank higher than matches in the body.\n\nPrints the ready-to-paste 'playground
    run -f' command for each hit, best\nfirst. Use 'playground run' instead to browse
    examples interactively."
  usage: playground find-example QUERY [OPTIONS] [--] [MORE QUERY WORDS...]
  options:
  - names:
    - "--category"
    argument: CATEGORY
    description: "\U0001F4C2 Restrict the search to one top-level folder\n\nAllowed
      values: connect, ccloud, ksqldb, flink, schema-registry, rest-proxy, multi-data-center,
      other, operator, academy, environment, reproduction-models"
  - names:
    - "--limit"
    argument: LIMIT
    description: "\U0001F522 Maximum number of hits (default 10)\n\nDefault value:
      10"
  - names:
    - "--json"
    argument: ''
    description: "\U0001F4D7 Print the hits as a JSON array, best first, and nothing
      else\n\nEach hit has script (absolute path), path (relative to the repository),\ntitle
      (README), connector_classes, environment, score and run_command.\nNo hit prints
      [] and exits with code 1.\n\n\U0001F393 Tip: use it in scripts and from AI agents,
      for example with\njq -r '.[0].script'"
- name: switch-ccloud
  description: "\U0001F329️  Switch to ccloud environment.\n\nIt will bootstrap ccloud
    environment based on your previously ran ccloud example.\n\nPoints the CLI at
    the Confluent Cloud cluster of your last ccloud run, so\nthat 'playground topic',
    'playground connector' and 'playground schema'\ntalk to Confluent Cloud instead
    of the local containers. Nothing is\ncreated or destroyed, and no container is
    started or stopped.\n\n❕ Requires that you ran a ccloud example at least once,
    so that the\n   environment, cluster and credentials are cached in playground.ini.\n
    \  The environment you were on is remembered for 'playground switch-back'."
  usage: playground switch-ccloud
  options: []
- name: switch-back
  description: "\U0001F4BA  Switch back from previous environment before switch-ccloud
    was called.\n\nRestores the environment and connector type that were active before\n'playground
    switch-ccloud', so the CLI talks to your local containers\nagain."
  usage: playground switch-back
  options: []
- name: switch-podman
  description: "\U0001F9AD Switch the container engine to Podman\n\nPoints the 'docker'
    CLI, 'docker compose' and the playground at the rootful\nPodman socket, through
    a 'podman' docker context: the switch applies to your\ncurrent shell and to new
    ones, with nothing to export. On macOS the podman\nmachine is started if needed.
    Ends with 'playground doctor'.\n\nContainers are not moved between engines: stop
    the running example first.\n\n❕ Podman must be set up once, see\n   https://kafka-docker-playground.io/#/how-to-use?id=\U0001F9AD-using-podman-instead-of-docker\n
    \  The docker context you were on is remembered for 'playground switch-docker'."
  usage: playground switch-podman
  options: []
- name: switch-docker
  description: "\U0001F433 Switch the container engine back to Docker\n\nRestores
    the docker context that was active before 'playground switch-podman'\n(Docker
    Desktop's 'desktop-linux', or 'default', if none was remembered).\nEnds with 'playground
    doctor'.\n\nContainers are not moved between engines: stop the running example
    first."
  usage: playground switch-docker
  options: []
- name: update-version
  description: "✨ Update current confluent platform components (all with --tag or
    only connect with --connect-tag) or connector(s) with new version(s)\n\nRe-runs
    the example you are currently on with different versions, which is\nthe fastest
    way to answer \"does it still happen on 8.x?\" or \"is it fixed in\nconnector
    10.6.0?\".\n\n  --tag            \U0001F522 every Confluent Platform component\n
    \ --connect-tag    \U0001F517 only the connect container, other components untouched\n
    \ --connector-tag  \U0001F9E9 the connector, from Confluent Hub\n  --connector-zip
    \ \U0001F4E6 the connector, from a local zip or a URL\n  --connector-jar  ☕ a
    single jar, dropped into the existing plugin\n\nWith no flag, you are prompted
    with the versions available. The versions\ncurrently running are read from the
    broker and connect containers, so the\nexample must be up.\n\n\U0001F393 Tip:
    this is a version bisect tool. Keep the example running and call it\nrepeatedly
    until you find the version where the behaviour changes."
  usage: playground update-version [OPTIONS]
  options:
  - names:
    - "--tag"
    argument: TAG
    description: "\U0001F3AF Confluent Platform (CP) version to use. Applies to all
      components (broker, connect, schema registry, ksqlDB, etc...)\n\nIt sets TAG
      environment variable\n\nMust be greater or equal to 5.3.0\n\n\U0001F393 Tip:
      use <tab> completion to trigger fzf completion"
  - names:
    - "--connect-tag"
    argument: CONNECT_TAG
    description: "\U0001F517 Confluent Platform (CP) version to use. Applies to connect
      only.\n\nIt sets CP_CONNECT_TAG environment variable\n\nMust be greater or equal
      to 5.3.0\n\n\U0001F393 Tip: use <tab> completion to trigger fzf completion"
  - names:
    - "--connector-tag"
    argument: CONNECTOR_TAG
    description: "\U0001F517 Connector version to use\n\nBy default, for each connector,
      the latest available version on Confluent Hub is used\n\n\U0001F393 Tip: set
      to \" \" in order to select the version dynamically\n\nConflicts with: --connector-zip"
  - names:
    - "--connector-zip"
    argument: CONNECTOR_ZIP
    description: "\U0001F910 Connector zip to use\n\n❕ It must be absolute full path\n\n\U0001F393
      Tip: use <tab> completion to trigger fzf completion \n        use playground
      config folder_zip_or_jar <folder1> <folder2>... (default is home folder and
      current folder is always included) to configure where to search the files\n
      \       use <option+enter> to use the value you typed manually\n\nConflicts
      with: --connector-tag"
  - names:
    - "--connector-jar"
    argument: CONNECTOR_JAR
    description: "\U0001F90E Connector jar to use\n\n❕ It must be absolute full path\n\n\U0001F393
      Tip: use <tab> completion to trigger fzf completion \n        use playground
      config folder_zip_or_jar <folder1> <folder2>... (default is home folder and
      current folder is always included) to configure where to search the files\n
      \       use <option+enter> to use the value you typed manually"
- name: open
  description: "\U0001F450 When --file is not provided, simply open last example you
    ran with <playground run>\n\nOtherwise, open any file from the playground using
    --file.\n\nOpens in the editor of your choice: 'playground config editor code'\n(or
    vi, nano, sublime, etc). Add --open-docker-compose to also open the\ndocker-compose
    override file the example uses, which is where the\ncontainers around Kafka are
    defined."
  usage: playground open [OPTIONS]
  options:
  - names:
    - "--file"
    - "-f"
    argument: FILE
    description: "\U0001F50E Search any file and open it.\n\n❕ It must be absolute
      full path\n\n\U0001F393 Tip: use <tab> completion to trigger fzf completion\n
      \       use <option+enter> to use the value you typed manually"
  - names:
    - "--open-docker-compose"
    argument: ''
    description: "\U0001F433 Also open associated docker-compose file for the current
      example"
- name: stop
  description: "\U0001F6D1 Stop currently running example\n\nTears down every container
    of the environment and of the example, and\nremoves their volumes, by replaying
    the docker compose command stored in\nplayground.ini. Nothing is left behind,
    so the next example starts clean.\n\n❕ Data is not kept: topics, connectors and
    the content of the databases\n   started by the example are gone.\n\nFor a Confluent
    Cloud example, the connectors and topics it created are\nlisted and deleted too,
    after asking for confirmation. Change this with\n'playground config cleanup-ccloud-resources-after-run
    ask|true|false'."
  usage: playground stop
  options: []
- name: remove-all-docker-images
  description: "\U0001F9E8 Remove all docker images (including docker volumes)\n\nReclaims
    disk space by wiping your whole local Docker state, not just the\nplayground one.
    Everything has to be pulled again afterwards, so the next\nrun is slow.\n\n\U0001F393
    Tip: prefer 'playground remove-cp-docker-images' to drop only the\nConfluent Platform
    versions you no longer test."
  usage: playground remove-all-docker-images
  options: []
- name: remove-cp-docker-images
  description: "\U0001F9F9 Remove all Confluent Platform docker images related to
    a version installed locally (a confirmation will be required for every version
    present)\n\nEach Confluent Platform version you have ever run keeps a dozen images
    on\ndisk, so this is usually where the space went. You are asked before every\nversion,
    unless you name one with --version.\n\nThe default version used by the playground
    is never proposed for removal."
  usage: playground remove-cp-docker-images [OPTIONS]
  options:
  - names:
    - "--version"
    argument: VERSION
    description: "\U0001F522 Specific version to remove"
- name: refresh-cp-docker-images
  description: "\U0001F504 Refresh (pull from Docker) all Confluent Platform docker
    images related to a version installed locally\n\n    It also refreshes images
    for aws, gcp and azure cli\n\nUseful when a version tag has been re-published,
    or when the cloud CLI\nimages have drifted behind the API they talk to."
  usage: playground refresh-cp-docker-images [OPTIONS]
  options:
  - names:
    - "--version"
    argument: VERSION
    description: "\U0001F522 Specific version to pull\n\nRequired: ✓ Yes"
- name: cleanup-cloud-details
  description: "\U0001F9FC playground is actively caching ccloud details (https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%8c%a4%ef%b8%8f-confluent-cloud-examples)\n
    \  use this command if you notice that the playground is using unexpected ccloud
    details\n\nDrops the cached environment, cluster, endpoints and API keys, so the
    next\nccloud example re-discovers them from scratch. Typically needed after you\nchanged
    of Confluent Cloud organisation, or deleted the cluster from the UI\nbehind the
    playground's back.\n\n❕ Nothing is deleted in Confluent Cloud, only the local
    cache. To delete\n   the cloud resources themselves, see 'playground cleanup-cloud-resources'."
  usage: playground cleanup-cloud-details
  options: []
- name: open-docs
  description: "\U0001F9D1‍\U0001F393 Open Confluent documentation of currently running
    example\n\nJumps straight to the official Confluent page for the connector or
    feature\nthe running example demonstrates, so you do not have to search for it."
  usage: playground open-docs [OPTIONS]
  options:
  - names:
    - "--only-show-url"
    argument: ''
    description: "\U0001F310 Only show url"
- name: open-changelog
  description: "\U0001F4DC Open playground changelog (https://kafka-docker-playground.io/#/changelog)"
  usage: playground open-changelog [OPTIONS]
  options:
  - names:
    - "--only-show-url"
    argument: ''
    description: "\U0001F310 Only show url"
- name: cleanup-cloud-resources
  description: "\U0001F9F9 Cleanup cloud resources that were created by running examples
    from the playground\n\n❗it will remove all resources created by the playground,
    including topics, connectors, clusters, buckets, redshift cluster, etc...\n\nExamples
    that talk to a real cloud create real, billable resources, and an\ninterrupted
    run leaves them behind. This sweeps them, scoped to the ones\nwhose name contains
    your username, across AWS, GCP, Azure, Confluent Cloud\nand Salesforce. Restrict
    the scope with --resource, and run it regularly.\n\nConfluent Cloud: connectors
    whose name contains your username are deleted,\nwith their dlq, success and error
    topics. All topics of the cluster are\ndeleted only when the cluster was created
    by the playground for you\n(pg-<user>-*). On a cluster you provided with CLUSTER_NAME,
    which may be\nshared with your team, only the topics recorded as created by your
    own\nruns are deleted (local file playground-ccloud-created-topics): topics\ncreated
    with playground topic create / produce, and topics your fully\nmanaged source
    connectors write to, as set in their config (kafka.topic,\napi1.topics, topic.prefix...).\n\nYou
    are asked to confirm every deletion, unless --force is given.\n\n☢️ Deletions
    are permanent. Use a dedicated cloud account for the\n   playground rather than
    one that also hosts resources you care about."
  usage: playground cleanup-cloud-resources [OPTIONS]
  options:
  - names:
    - "--force"
    argument: ''
    description: |-
      ☢️ do not ask for confirmation

      ❗use with caution
  - names:
    - "--resource"
    argument: RESOURCE
    description: "\U0001F6C1 resource to cleanup\n\nIf not provided, all of them are
      cleaned up\n\n\U0001F393 Tip: you can pass multiple resources by specifying
      --resource multiple times\n\nRepeatable: ✓ Yes\nDefault value: [\"aws\", \"gcp\",
      \"azure\", \"ccloud\", \"salesforce\"]\nAllowed values: aws, gcp, azure, ccloud,
      salesforce"
- name: repro
  description: "\U0001F477‍♂️ Reproduction model commands\n\nA reproduction model
    is an example written to demonstrate one specific\nproblem, so that anyone can
    reproduce it with a single command.\n\n  bootstrap   scaffold one from an existing
    example, then edit it\n  export      package the models you have not committed,
    as a tgz\n  import      unpack a tgz someone sent you, and run it\n\n\U0001F449
    Always scaffold with bootstrap rather than copying a script by hand: it\ncreates
    the header, the docker compose override, the CLI cheat sheet and\nregisters the
    model, which a hand-written file would be missing.\n\nKeep a model minimal and
    about one issue, state expected versus actual\nbehaviour in its comments header,
    and never put customer data in it."
  usage: playground repro COMMAND
  options: []
  subcommands:
  - name: export
    description: "\U0001F4E4 Export as tgz file uncommitted reproduction models from
      the folder of current reproduction model\n\nProduces a single tgz that a colleague
      can feed to\n'playground repro import' to run your scenario as is. Use --all
      to take\nevery uncommitted model rather than only the current folder."
    usage: playground repro export [OPTIONS]
    options:
    - names:
      - "--all"
      argument: ''
      description: Export all uncommitted reproduction models
  - name: import
    description: "\U0001F4E5 Import tgz file which was created with export command\n\nUnpacks
      the models into your reproduction-models folder, from where you\ncan run them
      with 'playground run'."
    usage: playground repro import [OPTIONS]
    options:
    - names:
      - "--file"
      - "-f"
      argument: FILE
      description: "\U0001F910 playground_repro_export.tgz file\n\n❕ It must be absolute
        full path\n\n\U0001F393 Tip: use <tab> completion to trigger fzf completion
        \n        use playground config folder_zip_or_jar <folder1> <folder2>... (default
        is home folder and current folder is always included) to configure where to
        search the files"
  - name: bootstrap
    description: "\U0001F6E0  Bootstrap reproduction model, just run <playground repro
      bootstrap> !\n\n\U0001F525 HIGHLY RECOMMENDED: start in interactive mode by
      simple running <playground repro bootstrap> !\n\n\U0001F449 Check documentation
      https://kafka-docker-playground.io/#/reusables?id=%f0%9f%9b%a0-bootstrap-reproduction-model"
    usage: playground repro bootstrap [OPTIONS]
    options:
    - names:
      - "--file"
      - "-f"
      argument: FILE
      description: "\U0001F516 Example file to use as basis, if not set, currently
        running example is used\n\n❕ It must be absolute full path\n\n\U0001F393 Tip:
        use <tab> completion to trigger fzf completion"
    - names:
      - "--description"
      - "-d"
      argument: DESCRIPTION
      description: "\U0001F4AD Description for the reproduction model"
    - names:
      - "--custom-smt"
      argument: ''
      description: "\U0001F527 Add a custom SMT (which is a no-op)"
    - names:
      - "--connector-plugin"
      argument: CONNECTOR-PLUGIN
      description: "\U0001F50C Add Connector plugin to CONNECT_PLUGIN_PATH\n\n\U0001F393
        Tip: use <tab> completion to trigger fzf completion\n\nRepeatable: ✓ Yes"
    - names:
      - "--pipeline"
      argument: SINK_FILE
      description: "\U0001F516 Sink example file to use for creating a pipeline. multiple
        --pipeline flags can be used to create a pipeline with multiple sinks.\n\n❕
        It must be absolute full path.\n\n\U0001F393 Tip: use <tab> completion to
        trigger fzf completion\n\nRepeatable: ✓ Yes\nConflicts with: --producer"
    - names:
      - "--no-run"
      argument: ''
      description: "\U0001F6D1 Only generate the reproduction model files, then exit\n\nSkips
        opening the generated file in the editor and running it, so\nthe running environment
        is left untouched.\n\n\U0001F393 Tip: use it in scripts and from AI agents,
        together with --file and --description"
- name: get-docker-compose
  description: "\U0001F40B Get docker-compose\n\nPrints the fully resolved docker
    compose configuration of the running\nexample: every file merged, every profile
    applied and every variable\nsubstituted. This is what Docker actually received,
    which is the thing to\nlook at when a container did not get the image, port or
    setting you\nexpected."
  usage: playground get-docker-compose
  options: []
- name: schema
  description: "\U0001F530 Schema commands\n\nTalk to the Schema Registry of the running
    environment, whether it is the\nlocal container or the one in Confluent Cloud,
    without building the urls\nand the credentials yourself.\n\n\U0001F50D Read\n
    \ get                  every version of a subject, or of all subjects\n  get-compatibility
    \   the compatibility rule in force\n  get-mode / get-alias\n\n✍️ Write\n  register
    \            add a new version to a subject\n  delete               a version,
    or the whole subject\n  set-compatibility    relax or tighten the evolution rule\n
    \ set-mode             READWRITE, READONLY or IMPORT\n  set-normalize, validate-new-schemas
    \  registry-wide behaviour\n  set-alias            point one subject name at another\n\n\U0001FA84
    derive-schema turns a sample payload into an avro, json schema or\nprotobuf schema,
    which saves writing one by hand.\n\nA subject is normally named after the topic:
    <topic>-key and\n<topic>-value. 'playground topic delete' removes both along with
    the\ntopic."
  usage: playground schema COMMAND
  options: []
  subcommands:
  - name: get
    description: "\U0001F530 Get all schemas versions for specified subject (if --subject
      is not specified, all subjects will be used)"
    usage: playground schema get [OPTIONS]
    options:
    - names:
      - "--subject"
      argument: SUBJECT
      description: "\U0001F4DB Subject name\n\nConflicts with: id"
    - names:
      - "--id"
      argument: ID
      description: "\U0001F4AF Schema id\n\nConflicts with: subject, deleted"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--deleted"
      argument: ''
      description: "\U0001F9DF Include soft deleted subjects\n\nConflicts with: id"
  - name: register
    description: |-
      ⏺️ Register a schema in specified subject

      Pushes a schema into the registry without producing any data, which is
      how you set up a subject before a connector starts, or add a new version
      to check whether it passes the compatibility rules.

      The format is detected from what you give it, avro, json schema or
      protobuf all work. Pass it on stdin with a quoted heredoc, or pick one of
      the bundled schemas with tab completion on --schema.

      Remember the naming convention: a topic's schemas live under the subjects
      <topic>-key and <topic>-value, not under the topic name.

      ☢️ --id forces a specific schema id and overwrites whatever is already
      registered at that id. It exists to reproduce id collisions, it is not
      something to use casually.
    usage: playground schema register [OPTIONS]
    options:
    - names:
      - "--subject"
      argument: SUBJECT
      description: "\U0001F4DB Subject name\n\nRequired: ✓ Yes"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--schema"
      argument: SCHEMA
      description: "\U0001F525 You can either:\n\n* Set your own schema (avro, json-schema,
        protobuf) with stdin (see example section). \n\n* Use completion to select
        predefined schemas (or use your own schema file) \U0001F393 Tip: use <tab>
        completion to trigger fzf completion\n\nDefault value: -"
    - names:
      - "--id"
      argument: ID
      description: |-
        ☢️ Force schema id

        ❗it will replace any schema which already exists at given id
    - names:
      - "--metadata-property"
      argument: METADATA-PROPERTY
      description: "\U0001F7E1 Add metadata properties to schema contract\n\nSee docs:
        https://docs.confluent.io/platform/current/schema-registry/fundamentals/data-contracts.html#metadata-properties\n\n\U0001F393
        Tip: you can pass multiple properties by specifying --metadata-property multiple
        times\n\nExample: --metadata-property \"metadata1=value\" --metadata-property
        \"metadata2=value\"\n\nRepeatable: ✓ Yes"
    - names:
      - "--normalize"
      argument: ''
      description: "\U0001FAE7 Add ?normalize=true at the end of the request to normalize
        the schema. The default is false."
  - name: get-compatibility
    description: "\U0001F6E1️ Get subject-level compatibility\n\nThe rule that decides
      whether a new schema version is accepted. When a\nproducer fails with \"Schema
      being registered is incompatible with an\nearlier schema\", this is what rejected
      it."
    usage: playground schema get-compatibility [OPTIONS]
    options:
    - names:
      - "--subject"
      argument: SUBJECT
      description: "\U0001F4DB Subject name\n\nRequired: ✓ Yes"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
  - name: set-compatibility
    description: "\U0001F6E1️ Set subject-level compatibility\n\nOverrides the rule
      for one subject:\n\n  BACKWARD     new schema can read data written with the
      previous one\n  FORWARD      previous schema can read data written with the
      new one\n  FULL         both\n  NONE         anything is accepted\n  *_TRANSITIVE
      checked against all past versions, not just the last\n\nSet it to NONE when
      you deliberately want to register an incompatible\nschema, typically to reproduce
      what it does to consumers downstream."
    usage: playground schema set-compatibility [OPTIONS]
    options:
    - names:
      - "--subject"
      argument: SUBJECT
      description: "\U0001F4DB Subject name\n\nRequired: ✓ Yes"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--compatibility"
      argument: COMPATIBILITY
      description: |-
        Schema Registry compatibility rule

        Required: ✓ Yes
        Allowed values: BACKWARD, BACKWARD_TRANSITIVE, FORWARD, FORWARD_TRANSITIVE, FULL, FULL_TRANSITIVE, NONE
  - name: get-mode
    description: "\U0001F50F Get subject-level mode\n\nREADWRITE normally; READONLY
      if registration has been frozen; IMPORT\nwhile schemas are being migrated with
      their original ids and versions."
    usage: playground schema get-mode [OPTIONS]
    options:
    - names:
      - "--subject"
      argument: SUBJECT
      description: "\U0001F4DB Subject name\n\nRequired: ✓ Yes"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
  - name: set-mode
    description: "\U0001F50F Set subject-level mode\n\n  READWRITE   the normal mode,
      schemas can be read and registered\n  READONLY    freeze the subject, registration
      is refused\n  IMPORT      allow registering schemas at a chosen id and version,\n
      \             which is what a migration between registries needs\n\n⚠️ To enable
      mode changes on a Schema Registry cluster, you must also set\nmode.mutability=true
      in the Schema Registry properties file before\nstarting Schema Registry, otherwise
      this command is rejected."
    usage: playground schema set-mode [OPTIONS]
    options:
    - names:
      - "--subject"
      argument: SUBJECT
      description: "\U0001F4DB Subject name\n\nRequired: ✓ Yes"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--mode"
      argument: MODE
      description: |-
        Schema Registry mode

        Required: ✓ Yes
        Allowed values: IMPORT, READONLY, READWRITE
  - name: set-normalize
    description: "\U0001F9FD Set normalize at schema registry level\n\nWith normalization
      on, the registry rewrites a schema into a canonical\nform before storing it,
      so two schemas that differ only in field order,\nwhitespace or the way defaults
      are written get the same id instead of\ncreating a new version every time.\n\nThis
      applies to the whole registry, not to one subject. Turn it on when\nan example
      keeps registering a new version of an unchanged schema.\n\nSee https://docs.confluent.io/platform/current/schema-registry/fundamentals/serdes-develop/index.html#schema-normalization"
    usage: playground schema set-normalize [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--value"
      argument: VALUE
      description: |-
        true or false

        Required: ✓ Yes
        Allowed values: true, false
  - name: validate-new-schemas
    description: "\U0001FA7A Validate new schemas (default is true since CP 8.2.0)\n\nControls
      whether the registry checks a schema is well formed before\naccepting it. Since
      CP 8.2.0 this is on by default, and Avro 1.12 added\nstrict namespace validation,
      so schemas that a customer registered years\nago can now be rejected on a newer
      version.\n\nSet it to false to reproduce what that customer had, or to let a
      legacy\nschema through while you investigate. It applies to the whole registry.\n\nSee
      https://docs.confluent.io/cloud/current/sr/fundamentals/serdes-develop/index.html#supported-formats:~:text=Strict%20namespace%20validation%20with%20Avro%20version%201.12"
    usage: playground schema validate-new-schemas [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--value"
      argument: VALUE
      description: |-
        true or false

        Required: ✓ Yes
        Allowed values: true, false
  - name: delete
    description: "\U0001F9DF Delete schema\n\nWithout --version the whole subject
      goes; with it, only that version.\n\nA plain delete is soft: the schema is hidden
      but its id and version\nnumber stay taken, so re-registering does not reuse
      them. Add\n--permanent to really remove it, which is what you need before\nre-creating
      the same subject from scratch.\n\n❕ The registry requires a soft delete before
      a permanent one; with\n   --permanent the command does both for you."
    usage: playground schema delete [OPTIONS]
    options:
    - names:
      - "--subject"
      argument: SUBJECT
      description: "\U0001F4DB Subject name to delete:\n  \n  if --version is provided,
        only that version will be deleted. Otherwise the complete subject will be
        deleted"
    - names:
      - "--version"
      argument: VERSION
      description: "\U0001F522 Schema version of the provided subject to delete\n\nCan
        only be used when --subject is provided"
    - names:
      - "--permanent"
      argument: ''
      description: "\U0001F480 Hard delete (default is soft delete)"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
  - name: derive-schema
    description: "\U0001FA84 Derive a schema based on payload\n\nGive it one or more
      json records, on stdin or with --payload, and it\nworks out a schema that covers
      them all. Much faster than writing an\navro schema by hand, and it handles unions
      when a field has different\ntypes across records."
    usage: playground schema derive-schema [OPTIONS]
    options:
    - names:
      - "--payload"
      argument: PAYLOAD
      description: "\U0001F4E6 Payload to derive schema from\n\nDefault value: -"
    - names:
      - "--schema-type"
      argument: SCHEMA-TYPE
      description: "\U0001F9E9 Schema Registry schema \"type\":\n\n- AVRO\n- JSON
        (json schema)\n- PROTOBUF\n\nDefault is AVRO\n\nDefault value: AVRO\nAllowed
        values: AVRO, JSON, PROTOBUF"
  - name: set-alias
    description: "\U0001F52F Set a subject alias\n\nMakes --alias point at --subject,
      so a client asking for the alias gets\nthe real subject's schemas. That is how
      you let a consumer keep its own\nsubject name while the data actually lives
      under another one, typically\nafter a topic rename or a migration between registries.\n\nCP
      7.4.1 or higher is required to have this feature.\n\nSee https://docs.confluent.io/platform/current/schema-registry/fundamentals/index.html#subject-aliases"
    usage: playground schema set-alias [OPTIONS]
    options:
    - names:
      - "--subject"
      argument: SUBJECT
      description: "\U0001F4DB Subject name\n\nRequired: ✓ Yes"
    - names:
      - "--alias"
      argument: ALIAS
      description: "\U0001F52F Alias name\n\nRequired: ✓ Yes"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
  - name: get-alias
    description: "\U0001F52F Get subject alias\n\nShows which real subject an alias
      resolves to. Use it when a client reads\nschemas that do not match the subject
      it asked for, the alias is often\nthe missing piece.\n\nCP 7.4.1 or higher is
      required to have this feature."
    usage: playground schema get-alias [OPTIONS]
    options:
    - names:
      - "--alias"
      argument: ALIAS
      description: "\U0001F52F Alias name\n\nRequired: ✓ Yes"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
- name: tcp-proxy
  description: "\U0001F3DA Zazkia TCP Proxy commands\n\nSimulate TCP connection issues
    (reset,delay,throttle,corrupt) using emicklei/zazkia (https://github.com/emicklei/zazkia)
    TCP proxy\n\nSlips a controllable proxy between a connector and the system it
    talks to,\nso you can break the connection on purpose and watch what the connector\ndoes:
    does it retry, does it lose records, does it fail the task.\n\n  start        put
    the proxy in the path, rewriting the connector config\n  delay        add latency
    to the responses\n  break        drop a percentage of the responses\n  close-connection,
    close-all-connection-with-error\n  toggle-*     cut reads or writes in one direction
    only\n  get-connections   the live connections and their statistics\n  open-ui
    \     drive all of the above from the Zazkia web UI\n\n\U0001F393 Tip: start with
    'playground tcp-proxy open-ui' to see what is\nhappening, then reproduce the same
    actions from the CLI in a script."
  usage: playground tcp-proxy COMMAND
  options: []
  subcommands:
  - name: start
    description: "\U0001F497 Start the TCP proxy and automatically replace connector
      config with zazkia hostname and port 49998\n\nStarts the proxy in front of --hostname
      and --port, then rewrites the\nrunning connector configuration so its traffic
      goes through it. Nothing\nelse to change on your side."
    usage: playground tcp-proxy start [OPTIONS]
    options:
    - names:
      - "--hostname"
      argument: HOSTNAME
      description: |-
        Hostname used by the tcp proxy to forward request

        Required: ✓ Yes
    - names:
      - "--port"
      argument: PORT
      description: |-
        Port used by the tcp proxy to forward request

        Required: ✓ Yes
    - names:
      - "--throttle-service-response"
      argument: THROTTLE-SERVICE-RESPONSE
      description: "\U0001F40C Throttle service response. This is bytes per second.\n\nDefault
        value: 0"
    - names:
      - "--delay-service-response"
      argument: DELAY-SERVICE-RESPONSE
      description: |-
        ⏲️ Add milliseconds delay to service response. Default is 0 ms.

        Default value: 0
    - names:
      - "--break-service-response"
      argument: BREAK-SERVICE-RESPONSE
      description: "\U0001F494 Percentage of broken connections. Default is 0%.\n\nDefault
        value: 0"
    - names:
      - "--service-response-corrupt"
      argument: ''
      description: "\U0001F9B9‍♂️ Corrupt service response with random mangled bytes.
        By default, there is no corruption."
    - names:
      - "--skip-automatic-connector-config"
      argument: ''
      description: "\U0001F916 By default, script will attempt to modify automatically
        the running connector config to use Zazkia proxy.\n\nThis flag allows to skip
        this automatic configuration (only useful if you want to manually update connector
        config with zazkia tcp proxy details)"
  - name: get-connections
    description: "\U0001F9F2 Get Zazkia active TCP connections config and stats\n\nLists
      every TCP connection currently going through the proxy, with its\nid, its state
      (the toggles and the delay or break currently applied) and\nits stats (bytes
      sent and received each way).\n\nStart here: the id printed by this command is
      what the other tcp-proxy\ncommands take as --connection-id. Connections in EOF
      state are hidden.\n\n\U0001F393 Tip: every other tcp-proxy command applies to
      all active connections\nwhen you do not pass --connection-id, which is normally
      what you want."
    usage: playground tcp-proxy get-connections [OPTIONS]
    options:
    - names:
      - "--connection-id"
      argument: CONNECTION-ID
      description: "\U0001F9F2 Zazkia TCP connection id"
  - name: delay
    description: |-
      ⏲️ Add milliseconds delay to service response.

      Slows down every response coming back from the service, without
      breaking anything. This is how you reproduce a slow database or a slow
      API: request timeouts, retries, rebalances caused by a task that takes
      too long to answer.

      Set it back to 0 to remove the delay.

      The new state is printed afterwards, so you can check it was applied.
    usage: playground tcp-proxy delay [OPTIONS]
    options:
    - names:
      - "--delay-service-response"
      argument: DELAY-SERVICE-RESPONSE
      description: |-
        ⏲️ Add milliseconds delay to service response.

        Required: ✓ Yes
    - names:
      - "--connection-id"
      argument: CONNECTION-ID
      description: "\U0001F9F2 Zazkia TCP connection id"
  - name: break
    description: "\U0001F494 Break sending the response to the client.\n\nDrops the
      response part way through, for the given percentage of\nresponses. Unlike close-connection,
      which kills the connection once,\nthis keeps failing intermittently, which is
      what you need to reproduce\nthe flaky network a customer is seeing rather than
      a clean outage.\n\nSet it back to 0 to stop breaking responses.\n\nThe new state
      is printed afterwards, so you can check it was applied."
    usage: playground tcp-proxy break [OPTIONS]
    options:
    - names:
      - "--break-service-response"
      argument: BREAK-SERVICE-RESPONSE
      description: "\U0001F494 Percentage of broken connections.\n\nRequired: ✓ Yes"
    - names:
      - "--connection-id"
      argument: CONNECTION-ID
      description: "\U0001F9F2 Zazkia TCP connection id"
  - name: close-connection
    description: |-
      ❌ Close the Zazkia active TCP connections

      Kills the connection abruptly, the way a firewall or a restarted
      database would. Use it to check that the connector reconnects on its
      own, and how long it takes.

      Without --connection-id, every active connection is closed.
    usage: playground tcp-proxy close-connection [OPTIONS]
    options:
    - names:
      - "--connection-id"
      argument: CONNECTION-ID
      description: "\U0001F9F2 Zazkia TCP connection id"
  - name: close-all-connection-with-error
    description: "\U0001F9F9 Close all Zazkia TCP connections which are in error state\n\nSame
      as the \"close all with error\" button in the Zazkia UI. Connections\nleft behind
      by a previous break or delay clutter get-connections;\nthis cleans them up so
      you only see the live ones."
    usage: playground tcp-proxy close-all-connection-with-error
    options: []
  - name: toggle-accept-connections
    description: "\U0001F645‍♂️ Change whether new connections can be accepted\n\nTurn
      it off and the service looks down to anything trying to connect,\nwhile the
      connections already open keep working. That is the way to\nreproduce a connector
      that cannot reconnect after a failure, or an\nexhausted connection pool.\n\nThis
      is a toggle, run it again to accept connections once more."
    usage: playground tcp-proxy toggle-accept-connections
    options: []
  - name: toggle-reads-client
    description: |-
      ✅ Change whether reading data from the client is enabled.

      Stops the proxy from reading what the client sends. The client's writes
      pile up in its socket buffer and it eventually blocks, which is how you
      reproduce backpressure and produce timeouts.

      This is a toggle, run it again to restore the flow.

        See diagram in https://github.com/emicklei/zazkia#how-does-it-work- (or locally http://localhost:9191/help.html)
    usage: playground tcp-proxy toggle-reads-client [OPTIONS]
    options:
    - names:
      - "--connection-id"
      argument: CONNECTION-ID
      description: "\U0001F9F2 Zazkia TCP connection id"
  - name: toggle-reads-service
    description: |-
      ✅ Change whether reading data from the service is enabled.

      Stops the proxy from reading what the service replies. Nothing comes
      back to the client, so requests hang until they time out, without the
      connection ever being closed. This is the classic black hole that a
      TCP keepalive misconfiguration produces.

      This is a toggle, run it again to restore the flow.

        See diagram in https://github.com/emicklei/zazkia#how-does-it-work- (or locally http://localhost:9191/help.html)
    usage: playground tcp-proxy toggle-reads-service [OPTIONS]
    options:
    - names:
      - "--connection-id"
      argument: CONNECTION-ID
      description: "\U0001F9F2 Zazkia TCP connection id"
  - name: toggle-writes-client
    description: |-
      ✅ Change whether writing data to the client is enabled.

      The proxy keeps reading the service's response but never forwards it to
      the client. Close to toggle-reads-service from the client's point of
      view, except the service sees its response as fully sent, so both sides
      disagree about what happened.

      This is a toggle, run it again to restore the flow.

        See diagram in https://github.com/emicklei/zazkia#how-does-it-work- (or locally http://localhost:9191/help.html)
    usage: playground tcp-proxy toggle-writes-client [OPTIONS]
    options:
    - names:
      - "--connection-id"
      argument: CONNECTION-ID
      description: "\U0001F9F2 Zazkia TCP connection id"
  - name: toggle-writes-service
    description: |-
      ✅ Change whether writing data to the service is enabled.

      The proxy keeps reading the client's request but never forwards it to
      the service. The client believes it sent its data, the service never
      receives it, so nothing ever answers.

      This is a toggle, run it again to restore the flow.

        See diagram in https://github.com/emicklei/zazkia#how-does-it-work- (or locally http://localhost:9191/help.html)
    usage: playground tcp-proxy toggle-writes-service [OPTIONS]
    options:
    - names:
      - "--connection-id"
      argument: CONNECTION-ID
      description: "\U0001F9F2 Zazkia TCP connection id"
  - name: open-ui
    description: "\U0001F310 Just open Zazkia UI (http://localhost:9191) in your browser\n\nThe
      UI shows the same connections as get-connections, but live, with\nthe toggles
      as buttons and a diagram of which direction each one cuts.\nEasier than the
      CLI when you are exploring, the CLI is what you put in\na reproduction script
      once you know which fault you want."
    usage: playground tcp-proxy open-ui
    options: []
- name: tools
  description: "\U0001F9F0 Tools commands\n\nSmall utilities that are handy around
    the playground but are not tied to a\nrunning environment:\n\n  read-avro-file
    \       dump an avro file as readable json\n  read-parquet-file     same, for
    parquet\n  certs-create          generate a keystore and truststore for a component\n
    \ redos-check           check a topics.regex for catastrophic backtracking\n  install-vscode-extension
    \  playground completion inside VS Code\n\n\U0001F393 Tip: the file readers are
    what you use to check what a sink connector\nreally wrote, after pulling the file
    out with 'playground container cp'."
  usage: playground tools COMMAND
  options: []
  subcommands:
  - name: install-vscode-extension
    description: "\U0001FA84 Install a slightly modified version of \"Shell Script
      Command Completion\" Visual Studio Code extension (https://marketplace.visualstudio.com/items?itemName=tetradresearch.vscode-h2o)\n\nGives
      you the same completion inside VS Code as in your terminal: while\nediting an
      example or a reproduction model, playground commands, flags\nand their allowed
      values are proposed as you type, with the help text\non hover. Worth the two
      minutes of setup if you write example scripts.\n\nIt is installed as \"Shell
      Script Command Completion (kafka-docker-playground)\"\n(tetradresearch.vscode-h2o-playground),
      in place of the marketplace one,\nso that VS Code does not auto-update it with
      the unpatched version. Run\nthe command again to get a newer upstream version.\n\nAfter
      installation, install \"playground\" command:\n\n* Go on a .sh file\n\n* Type
      Ctrl+Shift+P (or ⌘+⇧+P on macOS) and choose \"Shell Completion: Load Command
      Spec (experimental)\" and then type \"playground\"\n\n\U0001F516 The command
      spec is downloaded from the master branch: commands added in a local branch
      are only proposed once merged. Run \"Load Command Spec\" again to refresh it.\n\n\U0001F449
      Check documentation https://kafka-docker-playground.io/#/cli?id=%f0%9f%aa%84-setup-shell-script-command-completion-visual-studio-code-extension"
    usage: playground tools install-vscode-extension
    options: []
  - name: read-avro-file
    description: "\U0001F516 Read provided avro file\n\nPrints the records as json,
      along with the writer schema embedded in the\nfile. The way to check what a
      sink connector actually produced."
    usage: playground tools read-avro-file [OPTIONS]
    options:
    - names:
      - "--file"
      - "-f"
      argument: FILE
      description: "\U0001F516 Avro file to read\n\n❕ It must be absolute full path\n\n\U0001F393
        Tip: use <tab> completion to trigger fzf completion\n        use <option+enter>
        to use the value you typed manually"
  - name: read-parquet-file
    description: "\U0001F516 Read provided parquet file\n\nPrints the rows and the
      parquet schema, so you can verify what a sink\nconnector wrote without an external
      tool."
    usage: playground tools read-parquet-file [OPTIONS]
    options:
    - names:
      - "--file"
      - "-f"
      argument: FILE
      description: "\U0001F516 Parquet file to read\n\n❕ It must be absolute full
        path\n\n\U0001F393 Tip: use <tab> completion to trigger fzf completion\n        use
        <option+enter> to use the value you typed manually"
  - name: certs-create
    description: "\U0001F510 Generate keys and certificates used for SSL\n\nCreates
      a certificate authority and, for each container, a keystore and\na truststore
      in --output-folder. This is how the certificates of the\nssl environments are
      produced; regenerate them when they have expired,\nor to build a set for a container
      the playground does not know about."
    usage: playground tools certs-create [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: [\"broker\", \"broker2\",
        \"broker3\", \"client\", \"schema-registry\", \"restproxy\", \"connect\",
        \"connect2\", \"connect3\", \"control-center\", \"clientrestproxy\", \"ksqldb-server\",
        \"conduktor\"]"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--output-folder"
      argument: FOLDER
      description: "\U0001F4C1 Folder where certificates are created\n\nRequired:
        ✓ Yes"
  - name: redos-check
    description: "\U0001FA96 Check topics.regex for ReDos vulnerabilities using recheck
      (https://github.com/makenowjust-labs/recheck)\n\nSome regular expressions take
      exponential time on certain inputs. A sink\nconnector using such a pattern in
      topics.regex can pin a CPU and stall\nthe whole worker on a topic name that
      happens to hit the bad case, with\nnothing in the logs to explain it.\n\nGive
      it the regex and it answers safe, vulnerable, or timeout when the\nanalysis
      itself takes longer than --timeout. The exit code matches:\n0 safe, 1 vulnerable,
      2 timeout.\n\n\U0001F393 Tip: worth running whenever a customer reports a connect
      worker at\n100% CPU with no progress and a topics.regex in the configuration."
    usage: playground tools redos-check [OPTIONS]
    options:
    - names:
      - "--topic-regex"
      argument: REGEX
      description: "\U0001F523 Topic regex to test\n\nRequired: ✓ Yes"
    - names:
      - "--timeout"
      argument: TIMEOUT
      description: |-
        Max number of seconds to wait for ReDos check.

        Default is 1 second

        Default value: 1
- name: analyze
  description: "\U0001F50E Analyze commands\n\nTurn what you collected into findings:
    each command reads a file (a\ndump, a log, a bundle, a report, yours or one a
    customer sent) or takes\nit from a running container, and prints a digest with
    what is wrong and\nwhat to do, plus an HTML report to share (opened in your browser).
    They\nall work offline, and --sample runs them on the samples shipped with the\nplayground,
    to see what they report.\n\n  thread-dump             deadlocks, lock contention,
    stuck threads\n  gc-logs                 GC pauses, failures, live set, leak trend\n
    \ heap-dump               Eclipse MAT leak suspects, retained sizes\n  logs                    ERROR/FATAL
    digest of logs, folders, zips\n  oracle-xstream-report   Oracle XStream diagnostics
    (orclcdc_diag)\n  cfk-bundle              CFK support bundle: pods, events, CRs,
    logs\n  flight-recorder         JFR: where the time of the connector tasks goes\n\nTo
    collect them: playground debug thread-dump, heap-dump, flight-recorder,\nplayground
    connector oracle-cdc-xstream generate-report,\nplayground debug cfk generate-bundle."
  usage: playground analyze COMMAND
  options: []
  aliases:
  - analyse
  subcommands:
  - name: thread-dump
    description: "\U0001F9F5 Analyze java thread dumps: deadlocks, lock contention,
      stuck and CPU-hungry threads\n\n\U0001F4CA Reads jstack / jcmd Thread.print
      / kill -3 output (JDK 8 to 25), several dumps per file and container logs included,
      and reports: thread states and pools, deadlocks, locks with their owner and
      waiters, the most common stacks, and with several dumps of the same JVM: threads
      stuck on the same frames, the CPU used by each thread between dumps, and growing
      thread pools. Kafka / Connect aware (task threads, herder, broker request handlers).\n\n\U0001F433
      With --container (default: connect), it takes --count dumps --interval seconds
      apart with kill -3: the JVM prints them to the container logs, no JDK is needed
      in the image.\n\n\U0001F310 Also writes a self-contained HTML report (inline
      SVG charts, works offline) in --output-dir, opened in the browser in an interactive
      terminal\n\n\U0001F9EA With --sample, it analyzes the samples shipped in tools/thread-analyzer/samples:
      a quick way to see what it reports.\n\n\U0001F516 Exit code is 0 when the analysis
      completed, 2 when no thread dump was found"
    usage: playground analyze thread-dump [OPTIONS]
    options:
    - names:
      - "--file"
      - "-f"
      argument: FILE
      description: "\U0001F5D2️  Thread dump file or folder (repeat --file for several
        dumps of the same JVM)\n\n❕ Provide only one of --file, --container and --sample\n\n\U0001F393
        Tip: use <tab> completion to trigger fzf completion\n        use <option+enter>
        to use the value you typed manually\n\nRepeatable: ✓ Yes"
    - names:
      - "--sample"
      - "-s"
      argument: SAMPLE
      description: "\U0001F9EA Sample of tools/thread-analyzer/samples\n\n  deadlock_jdk21
        \    3 jstack -l dumps of one JDK 21 JVM, 3 s apart: deadlock, blocked threads,
        CPU-hot thread, stuck task, leaking pool\n  deadlock_jdk8      the same scenario,
        one dump, JDK 8\n  healthy_connect    3 kill -3 dumps of a healthy CP 8.3.2
        Connect worker, from its container logs\n\nRepeatable: ✓ Yes\nAllowed values:
        deadlock_jdk21, deadlock_jdk8, healthy_connect"
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 Container name (or pod name when cfk environment is
        used) to take the thread dumps from (default: connect)"
    - names:
      - "--count"
      argument: COUNT
      description: "\U0001F522 Number of thread dumps to take with --container (default:
        3)\n\nDefault value: 3"
    - names:
      - "--interval"
      argument: INTERVAL
      description: |-
        ⏱️  Seconds between two thread dumps with --container (default: 5)

        Default value: 5
    - names:
      - "--output-dir"
      - "-o"
      argument: OUTPUT_DIR
      description: "\U0001F4C2 Output directory for the thread dumps taken from a
        container and the HTML report (default: ./thread-analysis-output)\n\nDefault
        value: ./thread-analysis-output"
    - names:
      - "--json"
      argument: ''
      description: "\U0001F5C2️  Output JSON (no text report, no HTML report)"
    - names:
      - "--top"
      argument: TOP
      description: "\U0001F4CA Number of rows per section (default: 10)\n\nDefault
        value: 10"
  - name: heap-dump
    description: "\U0001F52C Analyze a heap dump with Eclipse Memory Analyzer (MAT),
      run headless in Docker\n\n\U0001F575️ Prints a text digest: heap overview, MAT
      leak suspects (accumulation point and who holds it) and the top retained sizes
      by class (dominator tree), and saves the MAT HTML reports (Leak_Suspects, System_Overview,
      Top_Components) in --output-dir\n\n\U0001F4C8 Use --compare with a second dump
      of the same JVM, taken later under the same load, to see which classes grow\n\n\U0001F433
      MAT needs roughly as much memory as the used heap of the dump (1 to 1.5x the
      .hprof size): give Docker enough memory or use --max-memory\n\n\U0001F9EA With
      --sample, it analyzes the samples shipped in tools/heap-analyzer/samples: a
      quick way to see what it reports.\n\n\U0001F516 Exit code is 0 when the analysis
      completed, non-zero when MAT could not parse the dump (truncated file, out of
      memory): never a \"healthy\" verdict on a failed parse"
    usage: playground analyze heap-dump [OPTIONS]
    options:
    - names:
      - "--file"
      - "-f"
      argument: FILE
      description: "\U0001F516 Heap dump to analyze (.hprof, or .hprof.gz as written
        by jcmd GC.heap_dump -gz)\n\n\U0001F393 Tip: use <tab> completion to trigger
        fzf completion\n        use <option+enter> to use the value you typed manually"
    - names:
      - "--sample"
      - "-s"
      argument: SAMPLE
      description: "\U0001F9EA Sample of tools/heap-analyzer/samples\n\n  leak          heap
        dump of a JVM with a session cache that is never evicted (MAT leak suspect)\n
        \ leak_growth   two dumps of that JVM a few seconds apart: the later one is
        compared with the earlier one\n\nAllowed values: leak, leak_growth"
    - names:
      - "--output-dir"
      - "-o"
      argument: OUTPUT_DIR
      description: "\U0001F4C2 Output directory for the digest (summary.txt), the
        MAT HTML reports and mat.log (default: ./heap-analysis)\n\nDefault value:
        ./heap-analysis"
    - names:
      - "--report-type"
      - "-r"
      argument: REPORT_TYPE
      description: "\U0001F4CB MAT HTML report(s) to generate (the text digest is
        always printed)\n\n- all: the three reports below\n- leaks: leak suspects
        (org.eclipse.mat.api:suspects)\n- overview: system overview (org.eclipse.mat.api:overview)\n-
        top-components: top components per class loader (org.eclipse.mat.api:top_components)\n\nDefault
        value: all\nAllowed values: all, leaks, overview, top-components"
    - names:
      - "--max-memory"
      argument: MAX_MEMORY
      description: "\U0001F9E0 Java heap given to MAT, e.g. 8g (default: 80% of the
        Docker memory)"
    - names:
      - "--compare"
      argument: FILE
      description: "\U0001F4C8 Second heap dump of the same JVM, taken later: prints
        the classes whose instance count and shallow size grew"
  - name: logs
    description: "\U0001F525 Show a digest of ERROR/FATAL records found in log files,
      folders or zip bundles\n\nThe offline counterpart of 'playground container logs
      --errors', for\nlogs that do not come from a running container: a customer support\nbundle,
      a CI artifact, a log file you were sent.\n\nRepeated records are de-duplicated
      with an occurrence count, stack\ntraces are collapsed to the exception chain
      (\"Caused by:\") plus a few\nframes of the deepest cause. Only records with
      an explicit level are\nreported (\" ERROR \", \"[ERROR]\", level=error, \"level\":\"error\"),
      plus\nuncaught java exceptions: records logged at INFO/DEBUG/TRACE, and\nlevel-less
      lines that merely contain \"error\" or \"failed\", never are.\n\n\U0001F4C2
      Folders are scanned recursively. .zip, .tar, .tar.gz and .tgz files\nare extracted
      in a temporary folder, .gz files are decompressed on the\nfly, binary files
      are skipped. Only files with findings are shown."
    usage: playground analyze logs [OPTIONS]
    options:
    - names:
      - "--file"
      - "-f"
      argument: FILE
      description: "\U0001F5D2️  Log file, folder, .zip, .tar(.gz) or .gz file to
        analyze\n\n\U0001F393 Tip: can be set several times\n\nRepeatable: ✓ Yes"
    - names:
      - "--sample"
      - "-s"
      argument: SAMPLE
      description: "\U0001F9EA Sample of tools/log-analyzer/samples\n\n  connect_task_failure
        \  Connect worker log: Oracle XStream connector with a wrong password, an
        unknown\n                         outbound server, and a task failing after
        the outbound server was stopped\n  support_bundle         .zip with that log
        and a gzipped broker log\n\nRepeatable: ✓ Yes\nAllowed values: connect_task_failure,
        support_bundle"
    - names:
      - "--include-warnings"
      argument: ''
      description: "\U0001F7E0 Also report WARN records"
    - names:
      - "--max-findings"
      argument: MAX_FINDINGS
      description: |-
        ✂️ Maximum number of distinct records to show per file (default 40)

        Default value: 40
  - name: gc-logs
    description: "\U0001F4C8 Analyze JVM Garbage Collection logs\n\n\U0001F4CA Parses
      GC logs from local files / folders or a running container: pause statistics,
      Full GC and evacuation / concurrent mode failures, live set, heap floor trend
      (leak), allocation stalls, GC causes, and recommendations backed by a finding
      (Kafka-aware: compared with Kafka's own G1 settings).\n\n\U0001F516 Supports
      JDK 7–21+ and all major collectors: G1GC, CMS, ZGC, Generational ZGC, Shenandoah,
      ParallelGC, SerialGC, in legacy (-XX:+PrintGCDetails) and unified (-Xlog:gc*)
      formats, any decoration\n\n\U0001F504 Pass every rotated file (kafkaServer-gc.log,
      .log.0…, .gz) or their folder: files are ordered by timestamp and split by JVM
      restart, the latest run is analyzed (--run to pick another)\n\n\U0001F9EA With
      --sample, it analyzes the samples shipped in gc-analysis/samples: a quick way
      to see what it reports.\n\n\U0001F516 Exit code is 0 when the analysis completed,
      2 when no GC event was found\n\n\U0001F310 Also writes a self-contained HTML
      dashboard (pause timeline, heap before / after GC, pause distribution, KPI cards,
      recommendations; no external resource) in --output-dir, opened in the browser
      in an interactive terminal"
    usage: playground analyze gc-logs [OPTIONS]
    options:
    - names:
      - "--file"
      - "-f"
      argument: FILE
      description: "\U0001F5D2️  GC log file or folder to analyze (repeat --file for
        the rotated files of the same JVM)\n\n❕ Provide only one of --file, --container
        and --sample\n\n\U0001F393 Tip: use <tab> completion to trigger fzf completion\n
        \       use <option+enter> to use the value you typed manually\n\nRepeatable:
        ✓ Yes"
    - names:
      - "--sample"
      - "-s"
      argument: SAMPLE
      description: "\U0001F9EA Sample of gc-analysis/samples (repeat --sample to analyze
        several)\n\n  GC logs of JDK 7 to 21 and every collector, named <jdk>_<collector>[_real]\n
        \ (_real: taken from a real Kafka / Connect JVM)\n\nRepeatable: ✓ Yes\nAllowed
        values: jdk7_parallel, jdk8_cms, jdk8_cms_cmf_real, jdk8_g1gc, jdk8_g1gc_details_real,
        jdk11_zgc, jdk17_g1gc, jdk17_shenandoah, jdk21_g1_kafka_real, jdk21_genzgc,
        jdk21_genzgc_real"
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 Container name (or pod name when cfk environment is
        used) to extract the GC log from\n\n❕ Provide only one of --file, --container
        and --sample\n\n\U0001F516 The GC log path is read from the java command line
        (-Xlog:gc*:file=… or -Xloggc:…), and its rotated files are copied too.\n     Falls
        back to searching common log locations (/var/log, /tmp, /opt).\n     The playground
        environments write a GC log for ZooKeeper, brokers, controllers, Schema Registry,\n
        \    Connect (-loggc, /var/log/kafka/<name>-gc.log) and ksqlDB."
    - names:
      - "--output-dir"
      - "-o"
      argument: OUTPUT_DIR
      description: "\U0001F4C2 Output directory for the HTML report and the GC logs
        copied from a container (default: ./gc-analysis-output)\n\nDefault value:
        ./gc-analysis-output"
    - names:
      - "--json"
      argument: ''
      description: "\U0001F5C2️  Output JSON stats (no text report, no HTML report)"
    - names:
      - "--run"
      argument: RUN
      description: "\U0001F504 JVM run to analyze when the log spans restarts (default:
        the latest, see the \"JVM runs\" table)"
    - names:
      - "--top-pauses"
      argument: TOP_PAUSES
      description: "\U0001F4CA Number of longest pauses to display in the report (default:
        10)\n\nDefault value: 10"
  - name: oracle-xstream-report
    description: "\U0001F17E️ Analyze Oracle XStream CDC diagnostics reports (orclcdc_diag.sql)\n\n\U0001F4CA
      Reads the HTML report of the Confluent diagnostics script (the file support
      asks for, orclcdc_diag_<date>.html) and reports: prerequisites (archivelog,
      supplemental logging, streams_pool_size, MAX_SGA_SIZE), the state of the capture
      process (its position as a date, and whether it waits for redo it cannot read),
      LogMiner, outbound server, apply reader, buffered queue and streams pool with
      thresholds, open and long running transactions, overlapping capture rules, alerts
      and errors of the last 7 days, the findings sorted by severity with the report
      section and the exact values, and the matched root-cause patterns.\n\n\U0001F4C8
      Give several reports of the same database (repeat --file) to see what moved
      between them: captured SCN, messages captured, LCRs sent, latency, restarts.\n\n\U0001F3AF
      Describe the problem with --problem (\"no records since 11th of OCT\"): the
      report is matched against it, the date where the capture stopped is compared
      with yours, and the findings that explain it come first.\n\n\U0001F433 With
      --container (default: oracle), it runs 'playground connector oracle-cdc-xstream
      generate-report' on the running example first, and analyzes the result.\n\n\U0001F9EA
      With --sample, it analyzes the reports shipped in tools/xstream-analyzer/samples:
      a quick way to see what it reports without an Oracle database.\n\n\U0001F310
      Also writes a self-contained HTML report (findings, prerequisites, components,
      streams pool advice chart, deltas between reports) in --output-dir, to share
      in a case; opened in the browser in an interactive terminal\n\n\U0001F516 Exit
      code is 0 when the analysis completed, 2 when the file is not an orclcdc_diag
      report\n\n\U0001F449 Check documentation https://docs.confluent.io/kafka-connectors/oracle-xstream-cdc-source/current/troubleshooting.html#connector-diagnostics-script"
    usage: playground analyze oracle-xstream-report [OPTIONS]
    options:
    - names:
      - "--file"
      - "-f"
      argument: FILE
      description: "\U0001F5D2️  orclcdc_diag HTML report (repeat --file for several
        reports of the same database)\n\n❕ Provide only one of --file, --container
        and --sample\n\n\U0001F393 Tip: use <tab> completion to trigger fzf completion\n
        \       use <option+enter> to use the value you typed manually\n\nRepeatable:
        ✓ Yes"
    - names:
      - "--container"
      - "-c"
      argument: CONTAINER
      description: "\U0001F433 Oracle container of a running XStream example to generate
        the report from (default: oracle)"
    - names:
      - "--sample"
      - "-s"
      argument: SAMPLE
      description: "\U0001F9EA Sample report of tools/xstream-analyzer/samples (repeat
        --sample to compare several)\n\n  healthy                connector running,
        idle database\n  large_transaction      uncommitted 150,000-row insert\n  detached
        \              connector deleted: outbound server DETACHED\n  older_script_version
        \  report of an older orclcdc_diag.sql\n  synthetic_failures     NOARCHIVELOG,
        capture ABORTED, flow control, LogMiner memory, spills, alerts\n  missing_archived_log
        \  capture WAITING FOR REDO on an archived log it cannot read: nothing captured\n\nRepeatable:
        ✓ Yes\nAllowed values: healthy, large_transaction, detached, older_script_version,
        synthetic_failures, missing_archived_log"
    - names:
      - "--problem"
      - "-p"
      argument: PROBLEM
      description: "\U0001F3AF Problem statement, in your own words: symptom and since
        when (example: \"no records processed since 11th of OCT\")\n\nThe symptoms
        (no data, lag, missing data, duplicates, errors, memory) and dates it recognizes
        are matched against the report: capture position as a date, messages captured
        and LCRs sent, and the findings that explain it, most relevant first"
    - names:
      - "--output-dir"
      - "-o"
      argument: OUTPUT_DIR
      description: "\U0001F4C2 Output directory for the report generated with --container
        and the HTML report (default: ./xstream-analysis-output)\n\nDefault value:
        ./xstream-analysis-output"
    - names:
      - "--json"
      argument: ''
      description: "\U0001F5C2️  Output JSON (findings, prerequisites, summary per
        component, deltas between reports)"
    - names:
      - "--top"
      argument: TOP
      description: "\U0001F4CA Maximum number of rows per list: transactions, alerts,
        errors, tables (default: 10)\n\nDefault value: 10"
  - name: cfk-bundle
    description: "\U0001F4E6 Analyze a Confluent for Kubernetes (CFK) support bundle\n\n\U0001F50D
      Checks Warning events, pods (phase, waiting reasons, restarts, OOMKilled), every
      platform.confluent.io custom resource (phase/state, ready replicas, False conditions,
      failed connector tasks) and the ERROR/FATAL records of every log (rotated and
      .gz included, with their Caused by chain and an occurrence count), sorts them
      into ~30 categories (pod failures, TLS, auth, MDS/RBAC, license, KRaft, replication,
      storage, scheduling, …) and prints concrete remediation steps per category.\n\n\U0001F9ED
      Also prints the environment (Kubernetes version, CFK operator version, application
      / init image of every component, from cluster-details.txt and the CRs) and checks
      it against the CFK support matrix (Kubernetes, Confluent Platform and Control
      Center ranges, init container on the operator version), lists the recent changes
      (who edited which CR and when, from managedFields, StatefulSet rollouts, pod
      (re)starts) and flags a JVM default truststore (-Djavax.net.ssl.trustStore)
      set without its password, the cause of \"trustAnchors parameter must be non-empty\".
      One issue per root cause: the connector tasks it affects are listed with it.\n\n✅
      Works offline on any bundle produced by kubectl confluent support-bundle (or
      playground debug cfk generate-bundle): no cfk environment needed.\n\n\U0001F512
      Sanitization (secrets / IPs / hostnames / emails / LDAP DNs) is ON by default.
      It is best effort: review the output before sharing it. Pass --no-sanitize only
      for internal/test bundles.\n\n\U0001F516 Accepts a directory or a .tar / .tar.gz
      / .tgz / .zip archive.\n\n\U0001F516 Use --json to emit machine-readable output
      for downstream tooling.\n\n\U0001F9E9 Each issue is attributed to a component
      (kafka, kraftcontroller, connect, schemaregistry, operator…) and to the instance
      (CR name, e.g. connect-peh) it comes from. Use --component to keep only some
      of them, or the Component / Instance buttons of the HTML report.\n\n\U0001F310
      Prints the text digest and also writes a self-contained HTML report in --output-dir,
      opened in the browser in an interactive terminal.\n\n\U0001F9EA With --sample,
      it analyzes the samples shipped in cfk-analysis/samples: a quick way to see
      what it reports.\n\n\U0001F516 Exit code is 0 when the analysis completed (whatever
      was found, read the summary), 64 for an invalid, unsafe or empty bundle."
    usage: playground analyze cfk-bundle [OPTIONS]
    options:
    - names:
      - "--bundle"
      - "-b"
      argument: PATH
      description: "\U0001F5C2️  Path to the CFK support bundle (directory or .tar/.tar.gz/.tgz/.zip)"
    - names:
      - "--sample"
      - "-s"
      argument: SAMPLE
      description: "\U0001F9EA Sample of cfk-analysis/samples\n\n  synthetic   CFK
        bundle: kafka-2 crash-looping on an expired certificate, pending volume, OOMKilled
        Connect\n              pod, failed connector task, Schema Registry authentication
        failure, operator reconcile errors\n\nAllowed values: synthetic"
    - names:
      - "--json"
      argument: ''
      description: "\U0001F4C4 Emit machine-readable JSON (includes per-issue recommendation)
        instead of the text report"
    - names:
      - "--no-sanitize"
      argument: ''
      description: "⚠️  Disable sanitization of IPs, hostnames, emails, and credentials.\n\n\U0001F6AB
        NEVER use this for customer bundles. Internal/test bundles only."
    - names:
      - "--severity"
      argument: LEVEL
      description: "\U0001F39A️  Filter issues by minimum severity (critical | high
        | medium | low)\n\nAllowed values: critical, high, medium, low"
    - names:
      - "--component"
      argument: COMPONENT
      description: "\U0001F9E9 Only keep the issues of this component (repeat --component
        for several). other = not a CFK component (nodes, volumes, unknown pods)\n\nRepeatable:
        ✓ Yes\nAllowed values: kafka, kraftcontroller, zookeeper, connect, schemaregistry,
        ksqldb, controlcenter, kafkarestproxy, operator, other"
    - names:
      - "--top"
      argument: "N"
      description: "\U0001F522 Max number of issues to display per category in text
        mode (default: 5)\n\nDefault value: 5"
    - names:
      - "--include-warnings"
      argument: ''
      description: "⚠️  Also report WARN log records that match no known category
        (WARN records matching a known category are always reported)"
    - names:
      - "--output-dir"
      argument: DIR
      description: "\U0001F4C1 Directory for the HTML report (default: ./cfk-reports)\n\nDefault
        value: ./cfk-reports"
  - name: flight-recorder
    description: "\U0001F6E9️ Analyze a Java Flight Recorder recording: where the
      time of the connector tasks goes\n\n\U0001F4CA For the Kafka Connect task threads
      (task-thread-*, or --threads / --connector): the time of each thread by state
      (running, blocked on network I/O by remote host, Kafka client, locks, waiting,
      file I/O), the CPU by layer (connector, converters, SMTs, Kafka client, connect
      framework, libraries, logging, JDK), the hot methods, the allocation by class,
      locks and waits by site, the busiest threads of the JVM, GC pauses and exceptions,
      and findings with next steps. Without task thread in the recording, every thread
      is analyzed.\n\n\U0001F433 With --container (default: connect), it records the
      JVM for --duration over JMX (FlightRecorderMXBean: no jcmd, which the cp images
      do not have, and no restart) with the settings of tools/jfr-analyzer/playground.jfc,
      then analyzes the recording. playground connector benchmark records the measure
      the same way.\n\n\U0001F516 Reads .jfr files of JDK 11+ JVMs with the JDK flight
      recorder API, run in a eclipse-temurin:25-jdk container (pulled the first time).
      The settings of the recording matter: playground.jfc records socket, file, lock
      and park events from 1 ms and the CPU of each thread every second; a recording
      made with the default or profile settings of the JDK gives fewer details (throttled
      socket events, 10 ms thresholds).\n\n\U0001F310 Also writes a self-contained
      HTML report (inline SVG charts, works offline) in --output-dir, opened in the
      browser in an interactive terminal\n\n\U0001F9EA With --sample, it analyzes
      the digests shipped in tools/jfr-analyzer/samples (no Docker needed): a quick
      way to see what it reports.\n\n\U0001F516 Exit code is 0 when the analysis completed,
      2 when the file is not a flight recording or has no event"
    usage: playground analyze flight-recorder [OPTIONS]
    options:
    - names:
      - "--file"
      - "-f"
      argument: FILE
      description: "\U0001F5D2️  .jfr file to analyze (repeat --file for the recordings
        of several connect workers over the same period)\n\n❕ Provide only one of
        --file, --container and --sample\n\n\U0001F393 Tip: use <tab> completion to
        trigger fzf completion\n        use <option+enter> to use the value you typed
        manually\n\nRepeatable: ✓ Yes"
    - names:
      - "--sample"
      - "-s"
      argument: SAMPLE
      description: "\U0001F9EA Sample of tools/jfr-analyzer/samples\n\n  jdbc_postgres_sink
        \  drain of 3M avro records by the JDBC sink to PostgreSQL, 1 task, CP 8.3.2
        (JDK 25)\n\nAllowed values: jdbc_postgres_sink"
    - names:
      - "--container"
      - "-c"
      argument: CONTAINER
      description: "\U0001F433 Container to record over JMX for --duration (default:
        connect). Its JMX port (KAFKA_JMX_PORT, SCHEMA_REGISTRY_JMX_PORT...) must
        be set, as in the playground environments"
    - names:
      - "--duration"
      argument: DURATION
      description: |-
        ⏱️ Duration of the recording with --container, in seconds or with a s/m/h suffix (default is 60s)

        Default value: 60s
    - names:
      - "--connector"
      argument: CONNECTOR
      description: "\U0001F517 Analyze the task threads of this connector only (task-thread-<connector>-<n>),
        and classify its frames as connector code (its class is read from the connect
        REST API when connect is running)"
    - names:
      - "--connector-class"
      argument: CONNECTOR_CLASS
      description: "\U0001F50C Class of the connector, to classify its frames as connector
        code (default: read from --connector, or guessed from the package)"
    - names:
      - "--threads"
      argument: REGEX
      description: "\U0001F9F5 Regular expression of the thread names to analyze (default:
        ^task-thread-, or the task threads of --connector)"
    - names:
      - "--output-dir"
      - "-o"
      argument: OUTPUT_DIR
      description: "\U0001F4C2 Output directory for the recording taken from a container,
        the digest and the HTML report (default: ./jfr-analysis-output)\n\nDefault
        value: ./jfr-analysis-output"
    - names:
      - "--json"
      argument: ''
      description: "\U0001F5C2️  Output JSON (no text report, no HTML report)"
    - names:
      - "--top"
      argument: TOP
      description: "\U0001F4CA Number of rows per section (default: 10)\n\nDefault
        value: 10"
- name: debug
  description: "\U0001F41E Debug commands\n\nThe heavy tooling, made usable: the JDK
    utilities, tcpdump, iptables and\nthe analysis tools are run inside the right
    container, installed on the\nfly when missing, and their output is brought back
    to your machine.\n\n\U0001F40C It hangs, or it is slow\n  thread-dump         what
    every thread is doing right now\n  flight-recorder     record the JVM from start
    to stop, then analyze it\n\n\U0001F4BE It eats memory\n  heap-dump           take
    a .hprof, optionally as a histogram\n\n\U0001F310 It is a network or TLS problem\n
    \ tcp-dump            capture traffic, open it in Wireshark\n  testssl             probe
    a TLS endpoint, locally or in the cloud\n  block-traffic       cut a route with
    iptables, to simulate an outage\n  java-debug          turn on the JVM SSL, Kerberos
    or class loading traces\n\n\U0001F52C It is in the code\n  log-level set       raise
    the level of any package, without a restart\n  enable-remote-debugging   attach
    your IDE debugger to a container\n  jscissors           trace method calls, arguments
    and return values\n\n\U0001F4E6 Hand it over\n  generate-diagnostics   a support
    bundle for connect or broker\n\n\U0001F50E To analyze what you collected (thread
    dumps, GC logs, heap dumps,\nlogs, Oracle XStream reports, CFK bundles, flight
    recordings): playground analyze"
  usage: playground debug COMMAND
  options: []
  subcommands:
  - name: enable-remote-debugging
    description: "✨ Enable java remote debugging for container\n\n\U0001F449 Check
      documentation https://kafka-docker-playground.io/#/reusables?id=%e2%9c%a8-remote-debugging"
    usage: playground debug enable-remote-debugging [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
  - name: disable-remote-debugging
    description: "\U0001F6D1 Disable java remote debugging for container"
    usage: playground debug disable-remote-debugging [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
  - name: testssl
    description: "\U0001F510 Testing TLS/SSL encryption using https://testssl.sh/"
    usage: playground debug testssl [OPTIONS] [--] [TESTSSL ARGUMENTS...]
    options:
    - names:
      - "--uri"
      argument: URI
      description: |-
        host|host:port|URL|URL:port   port 443 is default, URL can only contain HTTPS protocol

        Required: ✓ Yes
  - name: generate-diagnostics
    description: |-
      ⛑️ Generate a diagnostic bundle with Diagnostics Bundle Tool

      ⚠️ only connect and broker containers are supported for now

      see https://docs.confluent.io/platform/current/tools/diagnostics-tool.html#collect-diagnostics
    usage: playground debug generate-diagnostics [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
  - name: thread-dump
    description: "\U0001F3AF Take a java thread dump\n\n\U0001F516 It will save output
      to a file and open with text editor set with playground config editor <editor>
      (default is code)\n\nThe first thing to take when something is stuck: it shows
      the stack of\nevery thread, and the deadlocks if any.\n\n\U0001F516 It sends
      kill -3 to the JVM, which prints the dump to the container logs: no JDK is needed
      in the image and the container is not restarted. It falls back to jstack -l
      when the dump does not reach the logs.\n\n\U0001F393 Tip: take two or three
      dumps a few seconds apart. Threads that appear\nin the same place every time
      are the ones that are really blocked. playground analyze thread-dump does it
      and analyzes them."
    usage: playground debug thread-dump [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    - names:
      - "--jstack"
      argument: ''
      description: "\U0001F527 Use jstack -l instead of kill -3: adds the owners of
        java.util.concurrent locks (\"Locked ownable synchronizers\"). Needs a JDK
        in the image (on cfk, a debug container is attached); the container is never
        restarted"
  - name: heap-dump
    description: "\U0001F47B Take a heap dump\n\n\U0001F516 It will save output to
      a .hprof file. VisualVM (https://visualvm.github.io/) or MAT (https://www.eclipse.org/mat/)
      can be used to read the file.\n\nIt will run a full gc first. If you don't want
      this, use"
    usage: playground debug heap-dump [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    - names:
      - "--live"
      argument: ''
      description: "\U0001F9EC dump only live objects; if not specified, all objects
        in the heap are dumped"
    - names:
      - "--histo"
      argument: ''
      description: "\U0001F4CA print histogram of java object heap"
  - name: tcp-dump
    description: "\U0001F575️‍♂️ Take a tcp dump (sniffing network)\n\nCaptures the
      traffic in or out of a container for --duration seconds and\nbrings the capture
      file back, ready to open in Wireshark. Narrow it with\n--port when you know
      which one you care about.\n\n❕ On an encrypted listener you will see the handshake
      and the failures,\n   but not the records themselves."
    usage: playground debug tcp-dump [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    - names:
      - "--port"
      argument: PORT
      description: Port on which tcp dump should be done, if not set sniffing is done
        on every port
    - names:
      - "--duration"
      argument: DURATION
      description: |-
        Duration of the dump (default is 30 seconds).

        Default value: 30
  - name: block-traffic
    description: "\U0001F6AB Blocking traffic using iptables\n\nCuts the route from
      a container to a destination, so you can see how the\nsystem behaves during
      a network outage: a broker that loses the\ncontroller, a connector that can
      no longer reach its database, a client\nthat cannot resolve the schema registry.\n\nBlocking
      with --action start and restoring with --action stop, so the\nfailure is reversible
      without restarting anything."
    usage: playground debug block-traffic [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    - names:
      - "--destination"
      argument: DESTINATION
      description: |-
        Destination: it could be an ip address, a container name or a hostname

        Required: ✓ Yes
    - names:
      - "--port"
      argument: PORT
      description: Port on which tcp traffic should be blocked
    - names:
      - "--action"
      argument: ACTION
      description: "\U0001F7E2 start or stop\n\nRequired: ✓ Yes\nAllowed values: start,
        stop"
  - name: java-debug
    description: "\U0001F90E JVM arguments for SSL, Kerberos or Class Loading\n\nTurns
      on the JVM's own diagnostic traces in a container and restarts it.\nThis is
      how you find out why a TLS handshake fails, why a Kerberos\nlogin is refused,
      or which jar a class was loaded from when two\nversions collide.\n\n❗ These
      traces are extremely verbose. Turn them back off with\n   --action disable once
      you have what you need."
    usage: playground debug java-debug [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    - names:
      - "--type"
      argument: TYPE
      description: |-
        - ssl_all: Enable all SSL debugging, i.e -Djavax.net.debug=all
        - ssl_handshake: Enable SSL handshake debugging, i.e -Djavax.net.debug=ssl:handshake
        - class_loading: Enable class loading debugging, i.e -verbose:class
        - kerberos: Enable Kerberos debugging, i.e -Dsun.security.krb5.debug=true

        Required: ✓ Yes
        Allowed values: ssl_all, ssl_handshake, class_loading, kerberos
    - names:
      - "--action"
      argument: ACTION
      description: "\U0001F7E2 enable or disable\n\nDefault value: enable\nAllowed
        values: enable, disable"
  - name: jscissors
    description: "✂️ jscissors is an instrumentation framework and can help to analyse
      control flow and perform some specific logging\n\n* Control Flow Tracing: By
      dynamically instrumenting Java code, the tool meticulously tracks the precise
      sequence of executed methods at runtime. This capability offers invaluable insights
      into how an application navigates its logic. The tool provides a way to generate
      a stack trace when a method is called. \n* Additional Logging: This enhanced
      logging capability provides a way to print the input arguments to a method and
      return value from a method. \n* Delve into heap area: Generating heap dump at
      a method call will be crucial to analyze the state of JVM at a given point.
      The tool has capabilities to generate thread dump as well to track the state
      of all the threads when a method is called."
    usage: playground debug jscissors [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    - names:
      - "--operation"
      argument: OPERATION
      description: "\U0001F97C operation to perform:\n\n* VALUES: print method input
        arguments\n* RETURN_VALUE: print method return value\n* THREADS: print thread
        dump when method is called\n* HEAP: print heap dump when method is called\n*
        STACK: print stack trace when method is called\n* EXCEPTION_HEAP: print heap
        dump when an exception is thrown during method execution\n* DELAY: print time
        taken for method execution\n\nDefault values: VALUES, RETURN_VALUE, DELAY
        and STACK\n\n\U0001F393 Tip: you can pass multiple operations by specifying
        --operation multiple times\n\nRepeatable: ✓ Yes\nDefault value: [\"VALUES\",
        \"RETURN_VALUE\", \"DELAY\", \"STACK\"]\nAllowed values: VALUES, RETURN_VALUE,
        THREADS, HEAP, STACK, EXCEPTION_HEAP, DELAY"
    - names:
      - "--class"
      argument: CLASS
      description: |-
        class name to instrument (it supports regex like oracle.jdbc.*)

        Required: ✓ Yes
    - names:
      - "--method"
      argument: METHOD
      description: "method name to instrument (it supports regex like .*find.*)\n\n\U0001F393
        Tip: you can pass multiple methods by specifying --method multiple times\n\nRepeatable:
        ✓ Yes\nDefault value: .*"
    - names:
      - "--action"
      argument: ACTION
      description: "\U0001F7E2 enable or disable\n\nDefault value: enable\nAllowed
        values: enable, disable"
  - name: flight-recorder
    description: "\U0001F6E9️ Record a JVM with Java Flight Recorder, from --action
      start to --action stop\n\nFor a window of any length, in a script or by hand:
      start, reproduce the problem, stop. --action stop copies the\n.jfr to --output-dir
      and analyzes it with playground analyze flight-recorder (where the time of the
      connector tasks\ngoes: states, CPU by layer, hot methods, allocation, locks,
      GC, findings), unless --no-analyze. Open it with JDK\nMission Control (https://jdk.java.net/jmc/)
      for the details. To record for a fixed time and analyze in one\ncommand: playground
      analyze flight-recorder -c <container> --duration 2m.\n\n\U0001F50C The recording
      is driven over JMX (FlightRecorderMXBean) when the container has a JMX port
      (KAFKA_JMX_PORT, SCHEMA_REGISTRY_JMX_PORT...), as in the\nplayground environments:
      the cp images ship a JRE without jcmd, and nothing is installed or restarted.
      Otherwise\n(cfk pods), jcmd is used when the image has it.\n\n⚙️ --settings
      playground (default) records what the analysis needs with a low overhead\n(tools/jfr-analyzer/playground.jfc);
      profile and default are the settings of the JDK; all records every event\nwith
      no threshold (scripts/cli/all.jfc), for a deep dive in JDK Mission Control,
      with a high overhead.\n\n\U0001F516 The recording of each container is kept
      in playground.ini (flight_recorder.<container>), --action status shows it."
    usage: playground debug flight-recorder [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    - names:
      - "--action"
      argument: ACTION
      description: "\U0001F7E2 start, stop (copy the recording and analyze it) or
        status\n\nRequired: ✓ Yes\nAllowed values: start, stop, status"
    - names:
      - "--settings"
      argument: SETTINGS
      description: |-
        ⚙️ Settings of the recording, used by --action start (default: playground)

          playground   what playground analyze flight-recorder needs, low overhead (tools/jfr-analyzer/playground.jfc)
          profile      settings of the JDK for profiling, about 2% overhead
          default      settings of the JDK for continuous recording, about 1% overhead
          all          every event, no threshold (scripts/cli/all.jfc): high overhead, for JDK Mission Control

        Default value: playground
        Allowed values: playground, profile, default, all
    - names:
      - "--output-dir"
      - "-o"
      argument: OUTPUT_DIR
      description: "\U0001F4C2 Folder for the .jfr and the HTML report of the analysis,
        used by --action stop (default: current folder)\n\nDefault value: ."
    - names:
      - "--no-analyze"
      argument: ''
      description: "\U0001F648 With --action stop, only copy the recording, do not
        analyze it"
  - name: log-level
    description: "\U0001F9EC Set log level for any package\n\nChanges the level of
      any logger on the running connect worker, straight\naway and without a restart,
      so you do not have to edit log4j properties\nand rebuild the container.\n\n\U0001F393
      Tip: raise only the package you suspect, for instance\nio.confluent.connect.s3
      or org.apache.kafka.clients.consumer, rather\nthan the root logger, or the useful
      lines will be lost in the noise."
    usage: playground debug log-level COMMAND
    options: []
    subcommands:
    - name: get
      description: |-
        Get log levels

        With no --package, every logger with an explicit level is listed.
      usage: playground debug log-level get [OPTIONS]
      options:
      - names:
        - "--package"
        - "-p"
        argument: PACKAGE
        description: Package name
    - name: set
      description: |-
        Set log level for specific logger

        Takes effect immediately and applies to the logger and everything
        below it in the package hierarchy.
      usage: playground debug log-level set [OPTIONS]
      options:
      - names:
        - "--package"
        - "-p"
        argument: PACKAGE
        description: "\U0001F4E6 Package name\n\nRequired: ✓ Yes"
      - names:
        - "--level"
        - "-l"
        argument: LEVEL
        description: |-
          ❕Log level

          Required: ✓ Yes
          Allowed values: INFO, WARN, DEBUG, TRACE
  - name: cfk
    description: "\U0001F9F1 CFK debug sub-commands"
    usage: playground debug cfk COMMAND
    options: []
    subcommands:
    - name: generate-bundle
      description: |-
        ⛑️ Generate a Support bundle

        see https://docs.confluent.io/operator/current/co-troubleshooting.html#support-bundle
      usage: playground debug cfk generate-bundle [OPTIONS]
      options:
      - names:
        - "--follow-logs-duration"
        argument: FOLLOW-LOGS-DURATION
        description: |-
          Max duration to follow logs

          Default value: 0
- name: get-jmx-metrics
  description: "\U0001F522 Get JMX metrics from a container\n\n\U0001F449 Check documentation
    https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%94%a2-jmx-metrics"
  usage: playground get-jmx-metrics [OPTIONS]
  options:
  - names:
    - "--container"
    - "-c"
    - "--pod"
    - "-p"
    argument: CONTAINER
    description: "\U0001F433 container name (or pod name when cfk environment is used)\n\n\U0001F393
      Tip: you can pass multiple containers by specifying --container multiple times\n\nRepeatable:
      ✓ Yes\nDefault value: connect"
  - names:
    - "--open"
    - "-o"
    argument: ''
    description: "\U0001F516 Save output to a file and open with text editor set with
      playground config editor <editor> (default is code)"
  - names:
    - "--domain"
    - "-d"
    argument: DOMAIN
    description: Domain name
- name: container
  description: "\U0001F433 Container commands\n\nWork on the containers of the running
    example without having to remember\ntheir names, their users or their file layout.
    The same commands work\nagainst Kubernetes pods when the example runs on the cfk
    environment,\nwhich is why 'pod' is an accepted alias.\n\n\U0001F50D Look inside\n
    \ logs                 tail logs, grep them, or block until a line appears\n  display-error-all
    \   every ERROR and FATAL across all containers\n  get-properties       the properties
    file a component actually loaded\n  get-ip-addresses     addresses on the docker
    network\n  exec / ssh           run a command, or get a shell\n\n\U0001F501 Act
    on them\n  restart / kill / pause / resume\n  recreate             re-create with
    the same compose definition\n  update               edit the compose or Kubernetes
    definition, apply it\n  set-environment-variables   add settings, then recreate\n
    \ cp                   copy files in and out\n  change-jdk           swap the
    JDK, to reproduce a JVM-specific issue\n  kill-all             kill everything
    and prune volumes\n\nMost commands accept --container several times to act on
    a few containers\nat once.\n\n\U0001F393 Tip: the usual names are broker, connect,
    schema-registry,\ncontrol-center, ksqldb-server, plus whatever the example adds."
  usage: playground container COMMAND
  options: []
  aliases:
  - pod
  subcommands:
  - name: get-properties
    description: "\U0001F4DD Get properties file from a container\n\n\U0001F449 Check
      documentation https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%93%9d-see-properties-file"
    usage: playground container get-properties [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
  - name: recreate
    description: "\U0001F4AB Recreate container(s)\n\n\U0001F449 Check documentation
      https://kafka-docker-playground.io/#/how-to-use?id=%e2%99%bb%ef%b8%8f-re-create-containers\n\nReplays
      the docker compose command of the example, so a container is\nrebuilt from its
      current definition. This is what applies a change\nmade with 'playground container
      set-environment-variables' or\n'playground container update', and what you use
      to restart a component\nfrom scratch without re-running the whole example."
    usage: playground container recreate [OPTIONS]
    options:
    - names:
      - "--ignore-current-versions"
      argument: ''
      description: |-
        Ignore current confluent platform version

        By default, the current version is used
  - name: update
    description: |-
      ✍️ Edit and apply runtime container/pod definition

      Opens the current docker-compose (non-CFK) or Kubernetes resource YAML (CFK)
      for the target container/pod in your configured editor and applies changes
      when you save and close the file.
    usage: playground container update [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    aliases:
    - edit
    - alter
  - name: get-ip-addresses
    description: "\U0001F5A5️  Get ip address of running containers\n\nThe address
      each container has on the docker network, which is what\nyou need when a component
      must be reached by IP rather than by name,\nor when you are checking what a
      client actually connected to."
    usage: playground container get-ip-addresses
    options: []
  - name: kill-all
    description: "\U0001F480 Kill all containers and prune all volumes\n\nKills every
      container on your machine, playground or not, and prunes\nthe volumes. Used
      automatically before each 'playground run' to\nguarantee a clean slate; disable
      that with\n'playground config container-kill-all-before-run false'."
    usage: playground container kill-all
    options: []
  - name: logs
    description: "\U0001F575️  Tail and follow container logs\n\nThree ways to use
      it:\n\n  --grep \"ERROR\"                    keep only the lines that matter\n
      \ --open                            read the whole log in your editor\n  --wait-for-log
      \"Started\" -m 120   block until the line shows up\n\nThe last one is what example
      scripts use to synchronise on a component\nbeing ready, instead of sleeping
      and hoping."
    usage: playground container logs [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    - names:
      - "--open"
      - "-o"
      argument: ''
      description: "\U0001F516 Save output to a file and open with text editor set
        with playground config editor <editor> (default is code)\n\nConflicts with:
        --wait-for-log, --grep, --errors"
    - names:
      - "--wait-for-log"
      - "-w"
      argument: LOG
      description: "\U0001F634 Wait until log appears\n\nConflicts with: --open, --grep,
        --errors"
    - names:
      - "--max-wait"
      - "-m"
      argument: MAX_WAIT
      description: |-
        ⏳ Max time in seconds to wait when using --wait-for-log (default 600s)

        Default value: 600
        Conflicts with: --open, --grep
    - names:
      - "--grep"
      argument: GREP
      description: "\U0001F3AF Grep pattern to filter logs\n\nConflicts with: --open,
        --wait-for-log, --errors"
    - names:
      - "--previous"
      argument: ''
      description: "\U0001F570️ Show logs from the previous pod instance (only relevant
        when --environment=cfk is used)"
    - names:
      - "--since"
      argument: SINCE
      description: "\U0001F550 Only show logs newer than a relative duration (10m,
        1h) or a timestamp (2026-09-24T16:00:00)\n\nConflicts with: --open, --wait-for-log"
    - names:
      - "--tail"
      argument: LINES
      description: "\U0001F522 Number of lines to show from the end of the logs, or
        \"all\"\n\nDefault is 200, or all when --since, --errors, or --grep with --no-follow
        is used\n\nConflicts with: --open, --wait-for-log"
    - names:
      - "--no-follow"
      argument: ''
      description: "\U0001F6D1 Print the logs and exit instead of following them\n\n\U0001F393
        Tip: use it in scripts and from AI agents, which otherwise never get the command
        back\n\nConflicts with: --open, --wait-for-log"
    - names:
      - "--errors"
      argument: ''
      description: "\U0001F525 Only show a digest of ERROR/FATAL records, then exit\n\nRepeated
        records are de-duplicated with an occurrence count, stack\ntraces are collapsed
        to the exception chain (\"Caused by:\") plus a few\nframes of the deepest
        cause. Only records with an explicit level are\nreported (\" ERROR \", \"[ERROR]\",
        level=error, \"level\":\"error\"), plus\nuncaught java exceptions: records
        logged at INFO/DEBUG/TRACE, and\nlevel-less lines that merely contain \"error\"
        or \"failed\", never are.\n\nScans the whole log unless --since or --tail
        narrow it.\n\nConflicts with: --open, --wait-for-log, --grep"
    - names:
      - "--include-warnings"
      argument: ''
      description: "\U0001F7E0 With --errors, also report WARN records"
    - names:
      - "--max-findings"
      argument: MAX_FINDINGS
      description: |-
        ✂️ With --errors, maximum number of distinct records to show (default 40)

        Default value: 40
  - name: display-error-all
    description: "\U0001F525 Display all ERROR/FATAL logs in all containers/pods.
      Useful for quick troubleshooting\n\nThe first command to run when an example
      misbehaves and you do not yet\nknow which component is at fault. It sweeps every
      container at once,\nso you do not have to guess where to look.\n\nEach container
      gets the same digest as 'playground container logs\n--errors': repeated records
      are de-duplicated with an occurrence count\nand stack traces are collapsed to
      their \"Caused by:\" chain. Containers\nwithout any finding are only listed
      in a final one-line summary. The\nlast lines of connect are always shown raw,
      for failures that log no\nerror."
    usage: playground container display-error-all [OPTIONS]
    options:
    - names:
      - "--since"
      argument: SINCE
      description: "\U0001F550 Only scan logs newer than a relative duration (10m,
        1h) or a timestamp (2026-09-24T16:00:00)"
    - names:
      - "--include-warnings"
      argument: ''
      description: "\U0001F7E0 Also report WARN records"
    - names:
      - "--max-findings"
      argument: MAX_FINDINGS
      description: |-
        ✂️ Maximum number of distinct records to show per container (default 15)

        Default value: 15
  - name: ssh
    description: "\U0001F6EC SSH into container\n\nInteractive shell inside the container,
      as the user the component runs\nwith. Use 'playground container exec' instead
      when you want to run a\nsingle command from a script."
    usage: playground container ssh [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    - names:
      - "--shell"
      - "-s"
      argument: SHELL
      description: "\U0001F4BE Shell to use (default is bash)\n\nDefault value: bash\nAllowed
        values: bash, sh, ksh, zsh"
  - name: change-jdk
    description: "\U0001F90E Change java JDK version using Azul JDK (https://www.azul.com/downloads/#downloads-table-zulu)\n\nPS:
      It works for UBI8 docker images only"
    usage: playground container change-jdk [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    - names:
      - "--version"
      argument: VERSION
      description: "\U0001F90E JDK version to use\n\nRequired: ✓ Yes\nAllowed values:
        8, 11, 17, 21, 22, 25"
  - name: exec
    description: "\U0001FA84 Execute command in a container\n\nRuns one command and
      returns, which makes it the form to use inside\nexample scripts. Add --root
      when the component user is not allowed to\ndo what you are asking, typically
      to install a package or read a file\nunder /etc."
    usage: playground container exec [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    - names:
      - "--command"
      argument: COMMAND
      description: "\U0001F4F2 Command to execute\n\nRequired: ✓ Yes"
    - names:
      - "--root"
      argument: ''
      description: "\U0001F451 Run command as root"
    - names:
      - "--shell"
      argument: SHELL
      description: "\U0001F4BE Shell to use (default is bash)\n\nDefault value: bash\nAllowed
        values: bash, sh, ksh, zsh"
  - name: cp
    description: "\U0001FA84 Copy files between local filesystem and container\n\nWorks
      in both directions, using the container:path notation. Typically\nused to drop
      a jar, a certificate or a test file into a component, or\nto pull out a file
      the connector has written."
    usage: playground container cp [OPTIONS]
    options:
    - names:
      - "--source"
      argument: SOURCE
      description: "\U0001F4E5 Source path (local path or container:path)\n\nRequired:
        ✓ Yes"
    - names:
      - "--destination"
      argument: DESTINATION
      description: "\U0001F4E4 Destination path (local path or container:path)\n\nRequired:
        ✓ Yes"
  - name: restart
    description: "\U0001F501 Restart a container\n\nStops and starts the container,
      keeping its definition and its data.\nUse 'playground container recreate' instead
      if you changed the compose\ndefinition or an environment variable."
    usage: playground container restart [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
  - name: pause
    description: |-
      ⏸️  Pause a container

      Freezes the processes without stopping the container: it keeps its
      connections but stops responding. A good way to simulate a hung
      broker, an unresponsive database or a GC pause, and to see how the
      rest of the system reacts.
    usage: playground container pause [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
  - name: resume
    description: |-
      ⏯️  Resume a container

      Unfreezes a container paused with 'playground container pause'.
    usage: playground container resume [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    aliases:
    - unpause
  - name: kill
    description: "\U0001F52B Kill a container\n\nStops the container abruptly, without
      letting it shut down cleanly,\nwhich is how you simulate a crash. Bring it back
      with\n'playground container recreate'."
    usage: playground container kill [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
  - name: set-environment-variables
    description: "\U0001F4E6  Set environment variable(s) for a container\n\n\U0001F393
      Tip: you can pass multiple environment variables by specifying --env multiple
      times\n\nExample: --env \"KAFKA_OPTS: -verbose:class\" --env \"CONNECT_LOG4J_LOGGERS:
      org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR,org.apache.kafka.connect.runtime.rest.RestServer=ERROR\""
    usage: playground container set-environment-variables [OPTIONS]
    options:
    - names:
      - "--container"
      - "-c"
      - "--pod"
      - "-p"
      argument: CONTAINER
      description: "\U0001F433 container name (or pod name when cfk environment is
        used)\n\n\U0001F393 Tip: you can pass multiple containers by specifying --container
        multiple times\n\nRepeatable: ✓ Yes\nDefault value: connect"
    - names:
      - "--env"
      argument: ENV
      description: "\U0001F4E6 Environment variables to set\n\n\U0001F393 Tip: you
        can pass multiple environment variables by specifying --env multiple times\n\nRepeatable:
        ✓ Yes\nConflicts with: --restore-original-values"
    - names:
      - "--restore-original-values"
      argument: ''
      description: "\U0001F9FD Restore back original values before any changes was
        made\n\nConflicts with: --env"
- name: topic
  description: "\U0001F5F3 Topic commands\n\nProduce, consume and manage topics without
    dealing with the kafka-* shell\nscripts: the bootstrap server, the security properties
    and the schema\nregistry url are all derived from the running environment, so
    the same\ncommand works on plaintext, on sasl-ssl and on Confluent Cloud.\n\n\U0001F4E4
    Get data in\n  produce         generate records from a schema, or from your own
    data\n  create          create a topic with the partitions you need\n\n\U0001F4E5
    Get data out\n  consume         read from the beginning, deserialising automatically\n
    \ get-number-records   count what is in the topic\n  wait-for-records     wait
    until the topic contains N records\n  get-offsets          earliest and latest
    offsets per partition\n  display-consumer-offsets   read the internal offsets
    topic\n\n\U0001F527 Manage\n  list / describe / alter / delete\n  dlq inspect
    / replay   dead letter queue grouped by error, and replay\n  set-schema-compatibility
    \  compatibility of the topic subjects\n  tag             stream catalog tags
    (Confluent Cloud only)\n\nSerialisation is handled for you: 'produce' registers
    the schema you give\nit and 'consume' works out from the payload whether it is
    avro, protobuf,\njson schema or plain text.\n\n\U0001F393 Tip: in an example script,
    'consume --min-expected-messages N' is the\nassertion that the data made it through;
    it fails the run if it did not."
  usage: playground topic COMMAND
  options: []
  subcommands:
  - name: get-number-records
    description: "\U0001F4AF Get number of records in a topic\n\nCounts the records
      currently in the topic, from the partition offsets.\nThe cheap way to check
      that a source connector produced something, or\nthat a sink has data to read."
    usage: playground topic get-number-records [OPTIONS]
    options:
    - names:
      - "--topic"
      - "-t"
      argument: TOPIC
      description: "\U0001F5F3 Topic name"
  - name: wait-for-records
    description: "⏳ Wait for a topic to contain a minimum number of records\n\nCounts
      the records in the topic every --interval seconds (same count as\n'get-number-records')
      until there are at least\n--min-expected-messages, and fails after --max-wait
      seconds. A topic\nthat does not exist yet counts as empty, so it can be used
      before a\nsource connector has created its topic.\n\n\U0001F393 Tip: in an example
      script, use it instead of a fixed sleep before\nchecking what a source connector
      produced."
    usage: playground topic wait-for-records [OPTIONS]
    options:
    - names:
      - "--topic"
      - "-t"
      argument: TOPIC
      description: "\U0001F5F3 Topic name\n\nRequired: ✓ Yes"
    - names:
      - "--min-expected-messages"
      argument: MIN_EXPECTED_MESSAGES
      description: "\U0001F522 Minimum number of records to wait for (default is 1)\n\nDefault
        value: 1"
    - names:
      - "--max-wait"
      argument: MAX_WAIT
      description: |-
        ⏳ Max time in seconds to wait (default is 120)

        Default value: 120
    - names:
      - "--interval"
      argument: INTERVAL
      description: "\U0001F501 Interval in seconds between checks (default is 5)\n\nDefault
        value: 5"
  - name: get-offsets
    description: "\U0001F4CD Get earliest and latest offsets per partition of a topic\n\nThe
      low and high watermarks of every partition, and the number of\nrecords in between.
      Useful to see whether retention has already\ndeleted data, which partitions
      received records, or which offsets a\nconnector should be at."
    usage: playground topic get-offsets [OPTIONS]
    options:
    - names:
      - "--topic"
      - "-t"
      argument: TOPIC
      description: "\U0001F5F3 Topic name"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
  - name: display-consumer-offsets
    description: "\U0001F4ED Display content of __consumer_offsets topic\n\nDecodes
      the internal topic where Kafka keeps committed offsets, so you\ncan see exactly
      what each consumer group, including a sink connector,\nhas committed and when."
    usage: playground topic display-consumer-offsets [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
  - name: list
    description: "\U0001F518 List topics\n\nAdd --show-internal to also see the topics
      Kafka and Connect maintain\nfor themselves, such as the connect configs, offsets
      and status\ntopics.\n\nAdd --sort-by-size to show the size and number of partitions
      of each\ntopic, largest first (same as 'playground topic get-size')."
    usage: playground topic list [OPTIONS]
    options:
    - names:
      - "--show-internal"
      argument: ''
      description: "\U0001FAE5 Display internal topics"
    - names:
      - "--sort-by-size"
      argument: ''
      description: "\U0001F4CF Display size and number of partitions of each topic,
        largest first"
  - name: get-size
    description: "\U0001F4CF Get size of topics\n\nShows the size and number of partitions
      of each topic, largest first,\nto find which topics take the most disk space.
      Without --topic, all\ntopics are shown (add --show-internal to include internal
      topics).\n\nThe size of a partition is the size of its largest replica, the
      size\nof a topic is the sum of its partitions.\n\nWith ccloud environment, sizes
      come from the retained_bytes metric of\nthe Metrics API, which lags a few minutes
      behind and requires\nCONFLUENT_CLOUD_API_KEY and CONFLUENT_CLOUD_API_SECRET
      (Cloud API key)."
    usage: playground topic get-size [OPTIONS]
    options:
    - names:
      - "--topic"
      - "-t"
      argument: TOPIC
      description: "\U0001F5F3 Topic name"
    - names:
      - "--show-internal"
      argument: ''
      description: "\U0001FAE5 Include internal topics (when --topic is not set)"
  - name: describe
    description: "\U0001F52C Describe topic\n\nPartitions, replicas, in-sync replicas
      and the configuration overrides\nset on the topic. Where to look when records
      go to an unexpected\npartition, or when a topic is not retaining what you expected."
    usage: playground topic describe [OPTIONS]
    options:
    - names:
      - "--topic"
      - "-t"
      argument: TOPIC
      description: "\U0001F5F3 Topic name"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
  - name: set-schema-compatibility
    description: "\U0001F6E1️ Change topic's schema compatibility\n\nSets the compatibility
      level on the subjects of the topic, which is\nwhat you relax to let an otherwise
      rejected schema evolution through,\nfor instance to reproduce a schema compatibility
      issue."
    usage: playground topic set-schema-compatibility [OPTIONS]
    options:
    - names:
      - "--topic"
      - "-t"
      argument: TOPIC
      description: "\U0001F5F3 Topic name"
    - names:
      - "--compatibility"
      argument: COMPATIBILITY
      description: |-
        Schema Registry compatibility rule

        Required: ✓ Yes
        Allowed values: BACKWARD, BACKWARD_TRANSITIVE, FORWARD, FORWARD_TRANSITIVE, FULL, FULL_TRANSITIVE, NONE
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
  - name: consume
    description: "\U0001F4E5 Consume topic from beginning\n\nReads from the earliest
      offset and deserialises records on its own:\navro, protobuf, json schema and
      plain formats are all detected from\nthe payload, so you do not have to pick
      a console consumer.\n\n\U0001F393 Tip: --min-expected-messages turns it into
      an assertion. It waits\nup to --timeout for that many records and fails otherwise,
      which is\nhow examples verify that data actually flowed."
    usage: playground topic consume [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--topic"
      - "-t"
      argument: TOPIC
      description: "\U0001F5F3 Topic name"
    - names:
      - "--max-messages"
      argument: MAX-MESSAGES
      description: |-
        Max number of messages to display (default is 100)

        You can use -1 to display all messages

        Default value: 100
    - names:
      - "--min-expected-messages"
      argument: MIN-EXPECTED-MESSAGES
      description: |-
        Minimum expected number of messages to be present in topic, returns an error if this is not the case

        Note: --topic should be specified in this case.

        Default value: 0
    - names:
      - "--grep"
      argument: GREP
      description: Verify that topic content contains record which contains specified
        string
    - names:
      - "--timeout"
      argument: TIMEOUT
      description: |-
        Max number of seconds to wait when --min-expected-messages is used.

        Default is 60 seconds

        Default value: 60
    - names:
      - "--tail"
      argument: ''
      description: |-
        Tail on logs.

        Conflicts with: --min-expected-messages, --max-messages, --open
    - names:
      - "--plot-latencies-timestamp-field"
      argument: TIMESTAMP
      description: "\U0001F5F3 Timestamp field name that represents when record was
        created in source system"
    - names:
      - "--key-subject"
      argument: KEY-SUBJECT
      description: "\U0001F4DB Subject for key in schema-registry to use (useful when
        data was produced with --key-subject-name-strategy other than TopicNameStrategy)\n\nNote:
        --topic should be specified in this case."
    - names:
      - "--value-subject"
      argument: VALUE-SUBJECT
      description: "\U0001F4DB Subject for value in schema-registry to use (useful
        when data was produced with --value-subject-name-strategy other than TopicNameStrategy)\n\nNote:
        --topic should be specified in this case."
    - names:
      - "--max-characters"
      argument: MAX-CHARACTERS
      description: |-
        Max characters per message to display (default is 3000)

        Default value: 3000
    - names:
      - "--open"
      - "-o"
      argument: ''
      description: "\U0001F516 Save full dump of topic to a file and open with text
        editor set with playground config editor <editor> (default is code)\n\nConflicts
        with: --max-characters, --tail, --min-expected-messages"
    - names:
      - "--isolation-level"
      argument: ISOLATION-LEVEL
      description: "\U0001FAE5 The isolation level to use, see https://docs.confluent.io/platform/current/installation/configuration/consumer-configs.html#isolation-level\nIf
        not set, default is read_uncommitted\n\nDefault value: read_uncommitted\nAllowed
        values: read_uncommitted, read_committed"
  - name: produce
    description: "\U0001F4E4 Produce to a topic\n\nSee video tutorial https://youtu.be/mbzHCewG_XE\n\nGenerates
      records for you rather than making you write them. Give it\na schema, in avro,
      json schema or protobuf, and it registers the\nschema and produces --nb-messages
      records of realistic random data.\nThe topic is created if it does not exist.\n\nThree
      ways to say what to send:\n\n  a schema on stdin           generated data matching
      that schema\n  --value <predefined>        one of the bundled schemas\n  --forced-value
      '{...}'      your exact payload, %g being the index\n\n\U0001F393 Tip: pipe
      the schema with a quoted heredoc, << 'EOF', so that the\n%g placeholders survive
      the shell."
    usage: playground topic produce [OPTIONS]
    options:
    - names:
      - "--key"
      argument: KEY
      description: "\U0001F5DD️ Key to use. If not set, no key is used.\n\n\U0001F525
        You can either:\n\n* Set your own schema (avro, json-schema, protobuf) within
        single quotes (see examples) \n\n* You can also generate json data using json
        or sql format using syntax from https://github.com/MaterializeInc/datagen\n\n*
        You can also generate json data using syntax from https://github.com/vdesabou/avro-random-generator
        (same as datagen source connector)\n\n* Use completion to select predefined
        schemas (or use your own schema file) \U0001F393 Tip: use <tab> completion
        to trigger fzf completion\n\n* Directly set payload (\"%g\" can be used to
        generate a counter)\n\nIn case of 'raw' data (i.e not using schema):\n\nIf
        the key contain a number, it will be used as starting point and incremented
        for each record. \n\nExample: key1 will start with key1, then key2, etc..\nExample:
        mykey-10-suffix will start with mykey-10-suffix then mykey-11-suffix, etc..\n\n\"%g\"
        can also be used to generate a counter\n\nExample: key%g will start with key1,
        then key2, etc..\n\nOtherwise, the key will be same for all records."
    - names:
      - "--value"
      argument: VALUE
      description: "\U0001F525 You can either:\n\n* Set your own schema (avro, json-schema,
        protobuf) with stdin (see example section). \n\n* You can also generate json
        data using json or sql format using syntax from https://github.com/MaterializeInc/datagen\n\n*
        You can also generate json data using syntax from https://github.com/vdesabou/avro-random-generator
        (same as datagen source connector)\n\n* Use completion to select predefined
        schemas (or use your own schema file) \U0001F393 Tip: use <tab> completion
        to trigger fzf completion\n\n* Directly set payload (\"%g\" can be used to
        generate a counter)\n\nDefault value: -"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--topic"
      - "-t"
      argument: TOPIC
      description: "\U0001F5F3 Topic name\n\nRequired: ✓ Yes"
    - names:
      - "--nb-messages"
      argument: NB-MESSAGES
      description: "\U0001F4AF Number of messages to produce (default is 1)\n   \n\U0001F393
        \ - if > <value of --max-nb-messages-per-batch> (default 300000), messages
        will be sent in batches of <value of --max-nb-messages-per-batch> (default
        300000) records\n    - if you set it to -1, an infinite number of records
        will also be sent in batches\n\nDefault value: 1"
    - names:
      - "--max-nb-messages-per-batch"
      argument: MAX-NB-MESSAGES-PER-BATCH
      description: "\U0001F53C Max number of messages to send per batch when --nb-messages
        > --max-nb-messages-per-batch\n   if --nb-messages is set to -1, this is the
        number of messages sent per batch\n   default is 300000\n\nDefault value:
        300000"
    - names:
      - "--max-nb-messages-to-generate"
      argument: MAX-NB-MESSAGES-TO-GENERATE
      description: "\U0001F528 Max number of different messages to generate.\n\n   -
        when protobuf is used, default is 50 as protobuf generation is really slow\n
        \  - when json or sql datagen format is used, default is 1000\n   - when --record-size
        is set, default is 100\n   --when nb-messages is set to -1, default is 1000\n
        \  - otherwise default is 100000"
    - names:
      - "--sleep-time-between-batch"
      argument: SLEEP-TIME-BETWEEN-BATCH
      description: "\U0001F4A4 Sleep time in seconds between batches\n   default is
        0\n\nDefault value: 0"
    - names:
      - "--nb-partitions"
      argument: NB-PARTITIONS
      description: "\U0001F522 Number of partitions for the topic. (default is 1)\n\n❌
        Important: If topic is existing, it will be re-created before producing to
        topic.\n\nDefault value: 1"
    - names:
      - "--compression-codec"
      argument: COMPRESSION-CODEC
      description: "\U0001F910 The compression codec: either 'gzip', 'snappy', 'lz4',
        or 'zstd'\nIf not set, there is no compression\n\nAllowed values: gzip, snappy,
        lz4, zstd"
    - names:
      - "--compatibility"
      argument: COMPATIBILITY
      description: |-
        Schema Registry compatibility rule

        Allowed values: BACKWARD, BACKWARD_TRANSITIVE, FORWARD, FORWARD_TRANSITIVE, FULL, FULL_TRANSITIVE, NONE
    - names:
      - "--key-subject-name-strategy"
      argument: KEY-SUBJECT-NAME-STRATEGY
      description: |-
        Key Subject Name Strategy

        Allowed values: TopicNameStrategy, RecordNameStrategy, TopicRecordNameStrategy
    - names:
      - "--value-subject-name-strategy"
      argument: VALUE-SUBJECT-NAME-STRATEGY
      description: |-
        Value Subject Name Strategy

        Allowed values: TopicNameStrategy, RecordNameStrategy, TopicRecordNameStrategy
    - names:
      - "--headers"
      argument: HEADERS
      description: "\U0001F68F Headers to use for all records. If not set, no header
        is used.\n\nExample: --headers \"header1:value1,header2:value2\"\n\nNote:
        CP 7.2+ is required."
    - names:
      - "--forced-key"
      argument: FORCED-KEY
      description: "☢️ Key to use for all records. \n\n\U0001F393 Tip: use --generate-only
        first with avro, json-schema or protobuf to get skeleton of messages and then
        use --forced-key to send the message you need."
    - names:
      - "--forced-value"
      argument: FORCED-VALUE
      description: "☢️ Value to use for all records. \n\n\U0001F393 Tip: use --generate-only
        first with avro, json-schema or protobuf to get skeleton of messages and then
        use --forced-value to send the message you need."
    - names:
      - "--generate-only"
      argument: ''
      description: "\U0001F6AA Only generate messages without sending to kafka topic.\n\nUsed
        with --forced-value, this is a powerful way to send specific messages."
    - names:
      - "--tombstone"
      argument: ''
      description: "⚰️ Generate tombstone (record with null value). \n\nSetting --key
        is recommended when this flag is used. \nIf not set, the key will also be
        null, hence generating a null record (both key and value being null)\n\nNote:
        CP 7.2+ is required."
    - names:
      - "--schema-id-in-header"
      argument: ''
      description: "\U0001F3AF Include schema ID in kafka header. \n\nUses HeaderSchemaIdSerializer
        for schema.id.seserializer\n\nNote: CP 8.1.1+ is required."
    - names:
      - "--validate"
      argument: ''
      description: "☑️ Validate schema according to connect sink converter used"
    - names:
      - "--derive-key-schema-as"
      argument: DERIVE-KEY-SCHEMA-AS
      description: "\U0001FA84 Use playground schema derive-schema command to deduce
        schema from key payload\n\nPossible values:\n\n- AVRO\n- JSON (json schema)\n-
        PROTOBUF\n\nAllowed values: AVRO, JSON, PROTOBUF"
    - names:
      - "--derive-value-schema-as"
      argument: DERIVE-VALUE-SCHEMA-AS
      description: "\U0001FA84 Use playground schema derive-schema command to deduce
        schema from value payload\n\nPossible values:\n\n- AVRO\n- JSON (json schema)\n-
        PROTOBUF\n\nAllowed values: AVRO, JSON, PROTOBUF"
    - names:
      - "--no-null"
      argument: ''
      description: "\U0001FAB9 Never generate null fields even for optional fields\n\nN.B:
        only work with avro and json-schema"
    - names:
      - "--consume"
      argument: ''
      description: "\U0001F4E5 After producing, directly consume topic."
    - names:
      - "--delete-topic"
      argument: ''
      description: "❌ Delete topic and associated schema/subject if applicable before
        producing data."
    - names:
      - "--validate-config"
      argument: VALIDATE-CONFIG
      description: "\U0001F529 Converter configuration parameters to use \n\nSee docs:
        https://docs.confluent.io/platform/current/schema-registry/connect.html#using-kconnect-long-with-sr\n\n\U0001F393
        Tip: you can pass multiple parameters by specifying --validate-config multiple
        times\n\nRepeatable: ✓ Yes\nAllowed values: scrub.invalid.names=true, enhanced.avro.schema.support=true,
        connect.meta.data=false, object.additional.properties=false, use.optional.for.nonrequired=true,
        ignore.default.for.nullables=true, generalized.sum.type.support=true, enhanced.protobuf.schema.support=true,
        generate.index.for.unions=false, int.for.enums=true, optional.for.nullables=true,
        generate.struct.for.nulls=true, wrapper.for.nullables=true, wrapper.for.raw.primitives=false"
    - names:
      - "--producer-property"
      argument: PRODUCER-PROPERTY
      description: "\U0001F529 Producer configuration parameters to use \n\nSee docs:
        https://docs.confluent.io/platform/current/installation/configuration/producer-configs.html#cp-config-producer\n\n\U0001F393
        Tip: you can pass multiple parameters by specifying --producer-property multiple
        times\n\nExample: --producer-property \"max.request.size=990485760\" --producer-property
        \"client.id=myid\"\n\nRepeatable: ✓ Yes"
    - names:
      - "--record-size"
      argument: RECORD-SIZE
      description: "\U0001F3CB️ Record size in bytes, eg. 1048576 for 1MB\n\n\U0001F4E2
        If size is > 1Mb, --producer-property max.request.size and topic max.message.bytes
        will be automatically set to support the record size.\n\nNote that --no-null
        will be used when this option is set\n\nDefault value: 0"
  - name: create
    description: "\U0001F195 Create topic\n\nOnly needed when you want something other
      than the defaults, since\n'playground topic produce' creates the topic on the
      fly. Any extra\nargument is passed through to kafka-topics --create, so --config
      works\nas usual."
    usage: playground topic create [OPTIONS] [--] [ARGUMENTS...]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--topic"
      - "-t"
      argument: TOPIC
      description: "\U0001F5F3 Topic name\n\nRequired: ✓ Yes"
    - names:
      - "--nb-partitions"
      argument: NB-PARTITIONS
      description: |-
        Number of partitions for the topic. (default is 1)

        Default value: 1
  - name: delete
    description: |-
      ❌ Delete topic and associated schema/subject if applicable

      Also removes the key and value subjects from the schema registry,
      which is what you usually want: a topic re-created with a leftover
      subject keeps the old compatibility rules and the old schema history.
      Keep them with --skip-delete-schema.

      A regex is accepted, matched in full, to clean up a family of topics
      at once.
    usage: playground topic delete [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--topic"
      - "-t"
      argument: TOPIC
      description: "\U0001F5F3 Topic name or regex pattern (full match)\n\nExamples:
        my-topic, my-topic-.*\n\nRequired: ✓ Yes"
    - names:
      - "--skip-delete-schema"
      argument: ''
      description: "\U0001F530 Do not delete subject/schema"
  - name: alter
    description: "\U0001FA9B Alter topic config\n\nChanges topic level settings on
      a live topic, which is how you\nreproduce behaviour driven by configuration:
      a small\nmax.message.bytes to trigger a record too large error, a short\nretention.ms
      to expire data, a compacted cleanup.policy, and so on."
    usage: playground topic alter [OPTIONS] [--] [ARGUMENTS...]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--topic"
      - "-t"
      argument: TOPIC
      description: "\U0001F5F3 Topic name\n\nRequired: ✓ Yes"
  - name: dlq
    description: "\U0001F4EC Dead letter queue commands\n\nRead the dead letter queue
      of a sink connector\n(errors.tolerance=all with errors.deadletterqueue.topic.name,
      or the\ndlq-<lcc id> topic of a fully managed connector) without decoding\nits
      headers by hand, and send the records back once the cause is\nfixed.\n\n  inspect
      \  records grouped by error (exception, message, root cause,\n            original
      topic, partition and offsets)\n  replay    produce the records again to their
      original topic, or\n            to --to\n\nWithout --topic, the dead letter
      queue of --connector, or of the only\nrunning connector that has one, is used.\n\nThe
      errors are in the __connect.errors.* headers, which are only\nwritten with \"errors.deadletterqueue.context.headers.enable\":
      \"true\"\n('playground connector snippets --dlq' has it).\n\n\U0001F449 Example:
      https://github.com/vdesabou/kafka-docker-playground/tree/master/other/reprocess-dlq-messages-with-sink-connector"
    usage: playground topic dlq COMMAND
    options: []
    subcommands:
    - name: inspect
      description: "\U0001FA7A Show what is in a dead letter queue, grouped by error\n\nReads
        the whole dead letter queue (up to --max-messages) and groups\nthe records
        by connector, stage (key / value converter,\ntransformation, task put...)
        and exception, most frequent first.\nFor each group: the exception and its
        message, the root cause (last\n\"Caused by:\" of the stack trace), the original
        topic, partition and\noffsets, the offsets in the dead letter queue and a
        sample value.\n\nKeys and values are read as raw bytes, so it works whatever
        the\nformat of the records (avro, protobuf, json schema, plain json).\n\n\U0001F449
        Example: https://github.com/vdesabou/kafka-docker-playground/tree/master/other/reprocess-dlq-messages-with-sink-connector"
      usage: playground topic dlq inspect [OPTIONS]
      options:
      - names:
        - "--topic"
        - "-t"
        argument: TOPIC
        description: "\U0001F4EC Dead letter queue topic\n\nℹ️ If not set, the dead
          letter queue of --connector, or of the only running connector that has one"
      - names:
        - "--connector"
        - "-c"
        argument: CONNECTOR
        description: "\U0001F517 Connector whose dead letter queue is used (errors.deadletterqueue.topic.name,
          or dlq-<lcc id> for a fully managed connector)"
      - names:
        - "--max-messages"
        argument: MAX_MESSAGES
        description: "\U0001F522 Maximum number of records to read (default is 10000)\n\nDefault
          value: 10000"
      - names:
        - "--grep"
        argument: REGEX
        description: "\U0001F50E Only the records whose exception class, message or
          root cause match this regex (java syntax)"
      - names:
        - "--json"
        argument: ''
        description: "\U0001F916 Print the groups as JSON"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: replay
      description: "\U0001F501 Produce the records of a dead letter queue again\n\nOnce
        the cause is fixed (converter, schema, mapping...), sends the\nrecords back
        to the topic they came from (their\n__connect.errors.topic header), or to
        --to, so that the sink\nconnector processes them again. Keys, values, timestamps
        and the\nother headers are kept as they are (raw bytes), the\n__connect.errors.*
        headers are removed unless\n--keep-error-headers is set.\n\nOnly the records
        already in the dead letter queue when the command\nstarts are read, and they
        are not deleted from it: a record that\nfails again is added to the dead letter
        queue a second time.\n\n\U0001F393 Tip: --dry-run shows how many records would
        go to which topic,\nand --grep replays only one kind of error.\n\n\U0001F449
        Example: https://github.com/vdesabou/kafka-docker-playground/tree/master/other/reprocess-dlq-messages-with-sink-connector"
      usage: playground topic dlq replay [OPTIONS]
      options:
      - names:
        - "--topic"
        - "-t"
        argument: TOPIC
        description: "\U0001F4EC Dead letter queue topic\n\nℹ️ If not set, the dead
          letter queue of --connector, or of the only running connector that has one"
      - names:
        - "--connector"
        - "-c"
        argument: CONNECTOR
        description: "\U0001F517 Connector whose dead letter queue is used (errors.deadletterqueue.topic.name,
          or dlq-<lcc id> for a fully managed connector)"
      - names:
        - "--to"
        argument: TO
        description: "\U0001F4E4 Topic to produce to\n\nℹ️ If not set, each record
          goes back to its original topic (__connect.errors.topic header)"
      - names:
        - "--max-messages"
        argument: MAX_MESSAGES
        description: "\U0001F522 Maximum number of records to read (default is 10000)\n\nDefault
          value: 10000"
      - names:
        - "--grep"
        argument: REGEX
        description: "\U0001F50E Only the records whose exception class, message or
          root cause match this regex (java syntax)"
      - names:
        - "--keep-error-headers"
        argument: ''
        description: "\U0001F3F7️ Keep the __connect.errors.* headers on the replayed
          records"
      - names:
        - "--dry-run"
        argument: ''
        description: "\U0001F9EA Only display how many records would be replayed,
          and to which topics"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
  - name: tag
    description: "\U0001F3F7️ Stream Catalog tags (Confluent Cloud only)\n\nTag definitions
      live in the Stream Catalog of the environment, served\nby the Schema Registry
      endpoint. Create a tag once, then assign it to\ntopics and search topics by
      tag.\n\n  list     tag definitions\n  create   create a tag definition\n  delete
      \  delete a tag definition\n  add      assign a tag to a topic\n  remove   remove
      a tag from a topic\n  show     tags assigned to a topic\n  search   topics having
      a tag\n\n\U0001F393 Tip: a newly created topic can take a minute to show up
      in the\nStream Catalog before a tag can be assigned to it."
    usage: playground topic tag COMMAND
    options: []
    subcommands:
    - name: list
      description: "\U0001F3F7️ List tag definitions"
      usage: playground topic tag list [OPTIONS]
      options:
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: create
      description: "\U0001F195 Create a tag definition"
      usage: playground topic tag create [OPTIONS]
      options:
      - names:
        - "--tag"
        argument: TAG
        description: "\U0001F3F7️ Tag name (letters, digits and underscores, starting
          with a letter)\n\nRequired: ✓ Yes"
      - names:
        - "--description"
        argument: DESCRIPTION
        description: "\U0001F4DD Tag description"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: delete
      description: |-
        ❌ Delete a tag definition

        The tag must not be assigned to any topic anymore.
      usage: playground topic tag delete [OPTIONS]
      options:
      - names:
        - "--tag"
        argument: TAG
        description: "\U0001F3F7️ Tag name\n\nRequired: ✓ Yes"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: add
      description: "\U0001F3F7️ Assign a tag to a topic"
      usage: playground topic tag add [OPTIONS]
      options:
      - names:
        - "--topic"
        - "-t"
        argument: TOPIC
        description: "\U0001F5F3 Topic name\n\nRequired: ✓ Yes"
      - names:
        - "--tag"
        argument: TAG
        description: "\U0001F3F7️ Tag name\n\nRequired: ✓ Yes"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: remove
      description: "\U0001F9FD Remove a tag from a topic"
      usage: playground topic tag remove [OPTIONS]
      options:
      - names:
        - "--topic"
        - "-t"
        argument: TOPIC
        description: "\U0001F5F3 Topic name\n\nRequired: ✓ Yes"
      - names:
        - "--tag"
        argument: TAG
        description: "\U0001F3F7️ Tag name\n\nRequired: ✓ Yes"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: show
      description: "\U0001F50E Show tags assigned to a topic"
      usage: playground topic tag show [OPTIONS]
      options:
      - names:
        - "--topic"
        - "-t"
        argument: TOPIC
        description: "\U0001F5F3 Topic name\n\nRequired: ✓ Yes"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: search
      description: "\U0001F50E Search topics having a tag"
      usage: playground topic tag search [OPTIONS]
      options:
      - names:
        - "--tag"
        argument: TAG
        description: "\U0001F3F7️ Tag name\n\nRequired: ✓ Yes"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
- name: consumer-group
  description: "\U0001F465 Consumer group commands\n\nInspect any consumer group (not
    only the ones of sink connectors): which\ngroups exist, their state and members,
    and the committed offsets and lag\nper partition. Works on plaintext, secured
    environments, cfk and\nConfluent Cloud.\n\n  list       consumer groups, optionally
    with their state\n  describe   committed offsets and lag, or --state, or --members\n\n\U0001F393
    Tip: for a sink connector, 'playground connector show-lag' follows the\nlag until
    it reaches 0."
  usage: playground consumer-group COMMAND
  options: []
  subcommands:
  - name: list
    description: "\U0001F465 List consumer groups"
    usage: playground consumer-group list [OPTIONS]
    options:
    - names:
      - "--state"
      argument: ''
      description: "\U0001F6A6 Also display the state of each group (Stable, Empty,
        PreparingRebalance...)"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
  - name: describe
    description: "\U0001F52C Describe consumer group\n\nBy default, shows the committed
      offset, log end offset and lag of\nevery partition consumed by the group, followed
      by the total lag.\nUse --state for the coordinator, assignment strategy and
      state, and\n--members for the members and their assigned partitions."
    usage: playground consumer-group describe [OPTIONS]
    options:
    - names:
      - "--group"
      - "-g"
      argument: GROUP
      description: "\U0001F465 Consumer group name\n\nℹ️ If not set, all consumer
        groups are described"
    - names:
      - "--state"
      argument: ''
      description: "\U0001F6A6 Display state of the group (coordinator, assignment
        strategy, state, number of members)"
    - names:
      - "--members"
      argument: ''
      description: "\U0001F9D1‍\U0001F91D‍\U0001F9D1 Display members of the group
        and their assigned partitions"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
- name: rbac
  description: "\U0001F6E1️ RBAC commands (rbac-sasl-plain and cfk-rbac environments,
    plus Confluent Cloud ACLs)\n\nChange permissions of the running rbac-sasl-plain
    or cfk-rbac environment\nwithout opening a shell in a container: the commands
    call the MDS REST API\n(http://localhost:8091, a port-forward to the kafka service
    on cfk-rbac) as\nsuperUser.\n\n  role-binding   create, delete and list role bindings\n
    \ user           add, delete and list LDAP users and their groups\n  acl            create,
    delete and list ACLs (MDS centralized ACLs, or\n                 regular Kafka
    ACLs with --kafka-acls). On a Confluent\n                 Cloud run, ACLs of the
    Confluent Cloud cluster\n\n\U0001F393 Tip: principals are User:<name> or Group:<name>,
    a bare name means User:<name>."
  usage: playground rbac COMMAND
  options: []
  subcommands:
  - name: role-binding
    description: "\U0001F510 Role binding commands"
    usage: playground rbac role-binding COMMAND
    options: []
    subcommands:
    - name: create
      description: "\U0001F510 Create a role binding\n\nWithout --resource, the role
        is bound on the whole cluster\n(SystemAdmin, ClusterAdmin, SecurityAdmin,
        UserAdmin, AuditAdmin,\nOperator). With --resource, it is bound on that resource\n(ResourceOwner,
        DeveloperRead, DeveloperWrite, DeveloperManage).\n\nThe scope is deduced from
        the resource type when --scope is not set:\nSubject is schema-registry, Connector
        is connect, KsqlCluster is\nksqldb, anything else is kafka."
      usage: playground rbac role-binding create [OPTIONS]
      options:
      - names:
        - "--principal"
        - "-p"
        argument: PRINCIPAL
        description: "\U0001F9D1 Principal, User:<name> or Group:<name> (a bare name
          means User:<name>)\n\n❕ Required, unless --file is set"
      - names:
        - "--role"
        - "-r"
        argument: ROLE
        description: "\U0001F3A9 Role name\n\n❕ Required, unless --file is set\n\nAllowed
          values: ResourceOwner, DeveloperRead, DeveloperWrite, DeveloperManage, SystemAdmin,
          ClusterAdmin, SecurityAdmin, UserAdmin, AuditAdmin, Operator"
      - names:
        - "--resource"
        argument: RESOURCE
        description: "\U0001F4E6 Resource, <ResourceType>:<name>, for example Topic:orders,
          Group:my-app,\nSubject:orders-value, Connector:my-sink, TransactionalId:my-tx,
          Cluster:kafka-cluster\n\nℹ️ If not set, the role is bound on the whole cluster"
      - names:
        - "--prefix"
        argument: ''
        description: "\U0001F524 The resource name is a prefix (PREFIXED pattern)
          instead of a literal name"
      - names:
        - "--scope"
        argument: SCOPE
        description: "\U0001F3AF Cluster the role binding applies to\n\nℹ️ If not
          set, it is deduced from the resource type (kafka when there is no resource)\n\nAllowed
          values: kafka, schema-registry, connect, ksqldb"
      - names:
        - "--file"
        argument: FILE
        description: "\U0001F4C4 Create all the role bindings of a file, one per line:
          <principal> <role> <resource or -> [prefix] [scope=<scope>]\n\nSee environment/rbac-sasl-plain/role-bindings.txt
          (the default role bindings) for the format."
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: delete
      description: "\U0001F5D1️ Delete a role binding\n\nSame flags as 'playground
        rbac role-binding create'."
      usage: playground rbac role-binding delete [OPTIONS]
      options:
      - names:
        - "--principal"
        - "-p"
        argument: PRINCIPAL
        description: "\U0001F9D1 Principal, User:<name> or Group:<name> (a bare name
          means User:<name>)\n\nRequired: ✓ Yes"
      - names:
        - "--role"
        - "-r"
        argument: ROLE
        description: "\U0001F3A9 Role name\n\nRequired: ✓ Yes\nAllowed values: ResourceOwner,
          DeveloperRead, DeveloperWrite, DeveloperManage, SystemAdmin, ClusterAdmin,
          SecurityAdmin, UserAdmin, AuditAdmin, Operator"
      - names:
        - "--resource"
        argument: RESOURCE
        description: "\U0001F4E6 Resource, <ResourceType>:<name>, for example Topic:orders,
          Group:my-app,\nSubject:orders-value, Connector:my-sink, TransactionalId:my-tx,
          Cluster:kafka-cluster\n\nℹ️ If not set, the role is bound on the whole cluster"
      - names:
        - "--prefix"
        argument: ''
        description: "\U0001F524 The resource name is a prefix (PREFIXED pattern)
          instead of a literal name"
      - names:
        - "--scope"
        argument: SCOPE
        description: "\U0001F3AF Cluster the role binding applies to\n\nℹ️ If not
          set, it is deduced from the resource type (kafka when there is no resource)\n\nAllowed
          values: kafka, schema-registry, connect, ksqldb"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: list
      description: "\U0001F4CB List role bindings\n\nWithout --principal, every principal
        with a role binding is listed."
      usage: playground rbac role-binding list [OPTIONS]
      options:
      - names:
        - "--principal"
        - "-p"
        argument: PRINCIPAL
        description: "\U0001F9D1 Principal, User:<name> or Group:<name> (a bare name
          means User:<name>)\n\nℹ️ If not set, role bindings of all principals are
          listed"
      - names:
        - "--scope"
        argument: SCOPE
        description: "\U0001F3AF Only list role bindings of this cluster\n\nℹ️ If
          not set, all clusters are listed\n\nAllowed values: kafka, schema-registry,
          connect, ksqldb"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
  - name: user
    description: "\U0001F9D1 LDAP user commands\n\nUsers live in the openldap container.
      They authenticate on the broker\nwith SASL/PLAIN (their LDAP password) and log
      in to MDS, Control\nCenter, Schema Registry and Connect REST API with basic
      auth.\nChanges apply to the running environment, without restart."
    usage: playground rbac user COMMAND
    options: []
    subcommands:
    - name: add
      description: |-
        ➕ Add an LDAP user

        The user can connect right away. MDS picks up new group
        memberships (for Group:<name> role bindings) within its LDAP
        refresh interval (60 seconds by default).
      usage: playground rbac user add [OPTIONS]
      options:
      - names:
        - "--user"
        - "-u"
        argument: USER
        description: "\U0001F9D1 User name (principal User:<user>)\n\nRequired: ✓
          Yes"
      - names:
        - "--password"
        argument: PASSWORD
        description: "\U0001F511 Password\n\nℹ️ If not set, <user>-secret"
      - names:
        - "--group"
        - "-g"
        argument: GROUP
        description: "\U0001F465 Group to add the user to (principal Group:<group>),
          created if it does not exist. Can be set several times.\n\nRepeatable: ✓
          Yes"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: delete
      description: "\U0001F5D1️ Delete an LDAP user, and remove it from its groups\n\nIts
        role bindings and ACLs are not deleted."
      usage: playground rbac user delete [OPTIONS]
      options:
      - names:
        - "--user"
        - "-u"
        argument: USER
        description: "\U0001F9D1 User name (principal User:<user>)\n\nRequired: ✓
          Yes"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: list
      description: "\U0001F4CB List LDAP users and their groups"
      usage: playground rbac user list [OPTIONS]
      options:
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
  - name: acl
    description: "\U0001F6A6 ACL commands\n\nBy default, ACLs are MDS centralized
      ACLs (stored in the\n_confluent-metadata-auth topic and enforced by the CONFLUENT
      access rule\nprovider). With --kafka-acls, they are regular Kafka ACLs created
      with\nkafka-acls (ZK_ACL or KRAFT_ACL access rule provider).\n\n⛅ On a Confluent
      Cloud run, they are the ACLs of the Confluent Cloud\ncluster (confluent kafka
      acl). --connector then uses the service\naccount of a fully managed connector
      created with\nplayground run --ccloud-service-account as principal, to reproduce\nauthorization
      errors: delete or deny one of its ACLs, then restart the\nconnector."
    usage: playground rbac acl COMMAND
    options: []
    subcommands:
    - name: create
      description: "\U0001F6A6 Create ACLs, one per --operation"
      usage: playground rbac acl create [OPTIONS]
      options:
      - names:
        - "--principal"
        - "-p"
        argument: PRINCIPAL
        description: "\U0001F9D1 Principal, User:<name> or Group:<name> (a bare name
          means User:<name>)\n\n⛅ On Confluent Cloud, User:sa-xxxxx (service account)
          or User:u-xxxxx (user)\n\n❕ Required, unless --connector is set"
      - names:
        - "--connector"
        - "-c"
        argument: CONNECTOR
        description: "\U0001F517 Use the service account of this fully managed connector
          (kafka.service.account.id) as principal\n\n⛅ Confluent Cloud only, see playground
          run --ccloud-service-account"
      - names:
        - "--operation"
        - "-o"
        argument: OPERATION
        description: |-
          ⚙️ Operation, can be set several times

          Required: ✓ Yes
          Repeatable: ✓ Yes
          Allowed values: ALL, READ, WRITE, CREATE, DELETE, ALTER, DESCRIBE, CLUSTER_ACTION, DESCRIBE_CONFIGS, ALTER_CONFIGS, IDEMPOTENT_WRITE
      - names:
        - "--resource"
        argument: RESOURCE
        description: "\U0001F4E6 Resource, <ResourceType>:<name> with ResourceType
          one of Topic, Group,\nCluster, TransactionalId, DelegationToken. Use Cluster:kafka-cluster
          for the cluster.\n\nRequired: ✓ Yes"
      - names:
        - "--prefix"
        argument: ''
        description: "\U0001F524 The resource name is a prefix (PREFIXED pattern)
          instead of a literal name"
      - names:
        - "--deny"
        argument: ''
        description: "⛔ DENY instead of ALLOW"
      - names:
        - "--host"
        argument: HOST
        description: "\U0001F5A5️ Host the ACL applies to\n\nℹ️ If not set, all hosts
          (*)"
      - names:
        - "--kafka-acls"
        argument: ''
        description: "\U0001F9F0 Use regular Kafka ACLs (kafka-acls) instead of MDS
          centralized ACLs"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: delete
      description: "\U0001F5D1️ Delete ACLs, one per --operation\n\nSame flags as
        'playground rbac acl create'."
      usage: playground rbac acl delete [OPTIONS]
      options:
      - names:
        - "--principal"
        - "-p"
        argument: PRINCIPAL
        description: "\U0001F9D1 Principal, User:<name> or Group:<name> (a bare name
          means User:<name>)\n\n⛅ On Confluent Cloud, User:sa-xxxxx (service account)
          or User:u-xxxxx (user)\n\n❕ Required, unless --connector is set"
      - names:
        - "--connector"
        - "-c"
        argument: CONNECTOR
        description: "\U0001F517 Use the service account of this fully managed connector
          (kafka.service.account.id) as principal\n\n⛅ Confluent Cloud only, see playground
          run --ccloud-service-account"
      - names:
        - "--operation"
        - "-o"
        argument: OPERATION
        description: |-
          ⚙️ Operation, can be set several times

          Required: ✓ Yes
          Repeatable: ✓ Yes
          Allowed values: ALL, READ, WRITE, CREATE, DELETE, ALTER, DESCRIBE, CLUSTER_ACTION, DESCRIBE_CONFIGS, ALTER_CONFIGS, IDEMPOTENT_WRITE
      - names:
        - "--resource"
        argument: RESOURCE
        description: "\U0001F4E6 Resource, <ResourceType>:<name> with ResourceType
          one of Topic, Group,\nCluster, TransactionalId, DelegationToken. Use Cluster:kafka-cluster
          for the cluster.\n\nRequired: ✓ Yes"
      - names:
        - "--prefix"
        argument: ''
        description: "\U0001F524 The resource name is a prefix (PREFIXED pattern)
          instead of a literal name"
      - names:
        - "--deny"
        argument: ''
        description: "⛔ DENY instead of ALLOW"
      - names:
        - "--host"
        argument: HOST
        description: "\U0001F5A5️ Host the ACL applies to\n\nℹ️ If not set, all hosts
          (*)"
      - names:
        - "--kafka-acls"
        argument: ''
        description: "\U0001F9F0 Use regular Kafka ACLs (kafka-acls) instead of MDS
          centralized ACLs"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: list
      description: "\U0001F4CB List ACLs\n\nLists both MDS centralized ACLs and regular
        Kafka ACLs, or the ACLs of\nthe Confluent Cloud cluster on a Confluent Cloud
        run."
      usage: playground rbac acl list [OPTIONS]
      options:
      - names:
        - "--principal"
        - "-p"
        argument: PRINCIPAL
        description: "\U0001F9D1 Principal, User:<name> or Group:<name> (a bare name
          means User:<name>)\n\nℹ️ If not set, role bindings of all principals are
          listed"
      - names:
        - "--connector"
        - "-c"
        argument: CONNECTOR
        description: "\U0001F517 Use the service account of this fully managed connector
          (kafka.service.account.id) as principal\n\n⛅ Confluent Cloud only, see playground
          run --ccloud-service-account"
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
- name: connector-plugin
  description: "\U0001F50C Connector-plugin commands\n\nQuestions about connector
    plugins on Confluent Hub, answered without a\nrunning environment:\n\n  versions
    \             every released version of a plugin\n  display-last-updated  what
    was published recently, by vendor\n  search-jar            which jars ship in
    it, and which class is where\n  config-key            what a config key does,
    its default, since when, who sets it\n  sourcecode            open the source
    on GitHub\n\n\U0001F393 Tip: search-jar answers \"is this class really in the
    plugin, and with\nwhich signature\", which is the question behind most NoSuchMethodError
    and\nClassNotFoundException reports."
  usage: playground connector-plugin COMMAND
  options: []
  subcommands:
  - name: search-jar
    description: |-
      ☕ List jars for a connector plugin from confluent hub https://www.confluent.io/hub/

      Downloads the plugin and lists the jars it ships. With --class it also
      finds which jar contains that class and prints its method signatures
      with javap.

      That answers the two questions a NoClassDefFoundError or a
      NoSuchMethodError raises: is the class actually shipped, and does the
      bundled version have the signature the code is calling. Run it again
      with another --connector-tag to see when a dependency changed.
    usage: playground connector-plugin search-jar [OPTIONS]
    options:
    - names:
      - "--connector-plugin"
      - "-c"
      argument: CONNECTOR-PLUGIN
      description: "\U0001F50C Connector plugin name\n\n\U0001F393 Tip: use <tab>
        completion to trigger fzf completion\n\nRequired: ✓ Yes"
    - names:
      - "--connector-tag"
      argument: CONNECTOR_TAG
      description: "\U0001F517 Connector version to use\n\nBy default, for each connector,
        the latest available version on Confluent Hub is used\n\n\U0001F393 Tip: set
        to \" \" in order to select the version dynamically\n\nConflicts with: --connector-zip"
    - names:
      - "--class"
      argument: CLASS
      description: "☕ Java class name to search for in all jars"
  - name: versions
    description: "\U0001F4AF List versions for a connector plugin from confluent hub
      https://www.confluent.io/hub/\n\nWhat to feed to --connector-tag when you want
      to test another version,\nand the way to find out which release you are behind
      on. The list is\ncached; use --force-refresh after a brand new release."
    usage: playground connector-plugin versions [OPTIONS]
    options:
    - names:
      - "--connector-plugin"
      - "-c"
      argument: CONNECTOR-PLUGIN
      description: "\U0001F50C Connector plugin name\n\n\U0001F393 Tip: use <tab>
        completion to trigger fzf completion\n\nRequired: ✓ Yes"
    - names:
      - "--force-refresh"
      argument: ''
      description: "☢️ Force refresh."
    - names:
      - "--last"
      argument: LAST
      description: "\U0001F195 Number of last versions to show\n\nConflicts with:
        --all"
  - name: display-last-updated
    description: "\U0001F195 List last updated connector plugins from confluent hub
      https://www.confluent.io/hub/\n\nA quick way to see what has just been released
      on the Hub, which often\nexplains why an example that passed yesterday behaves
      differently today."
    usage: playground connector-plugin display-last-updated [OPTIONS]
    options:
    - names:
      - "--days"
      argument: DAYS
      description: "\U0001F4C5 Number of days to look back\n\nDefault is 3 days\n\nDefault
        value: 3"
    - names:
      - "--vendor"
      argument: VENDOR
      description: "\U0001F3E2 Only display results for this vendor"
  - name: config-key
    description: "\U0001F511 Explain a connector configuration key: documentation,
      type, default, since when, and which examples set it\n\nAnswers \"what does
      this key do, what is its default, since which\nversion does it exist, and how
      is it used\" in one call, without a\nrunning environment.\n\n\U0001F4D7 Documentation,
      type, default, importance and group come from the\nconfiguration reference that
      CI records for every tested connector,\nself-managed and fully managed (the
      config-<class>.txt files next to\nthe examples, refreshed with the latest connector
      version).\n\n\U0001F4C5 The git history of that file tells when CI first saw
      the key, which\nis when a new connector version introduced it. Versions you
      ran\nlocally (playground connector show-config-parameters cache) are also\nchecked
      one by one.\n\n\U0001F9EA Examples that set the key are listed with the value
      they use.\n\nWithout --connector-class, every connector having the key is listed.\nWhen
      the key is not found, similar keys are suggested."
    usage: playground connector-plugin config-key [OPTIONS]
    options:
    - names:
      - "--key"
      - "-k"
      argument: KEY
      description: "\U0001F511 Exact configuration key, for example behavior.on.null.values\n\nRequired:
        ✓ Yes"
    - names:
      - "--connector-class"
      - "-c"
      argument: CONNECTOR-CLASS
      description: "\U0001F50C Only this connector: part of its class name or fully
        managed type, case insensitive\n\nExamples: S3SinkConnector, io.confluent.connect.jdbc.JdbcSinkConnector,
        S3_SINK, jdbc"
    - names:
      - "--max-examples"
      argument: MAX_EXAMPLES
      description: "\U0001F9EA Maximum number of examples to show (default 10)\n\nDefault
        value: 10"
  - name: sourcecode
    description: "\U0001F9D1‍\U0001F4BB Open source code url in your browser (or in
      your editor when used with --open)\n\nYou can compare different sourcecode versions
      by specifying --connector-tag two times, in such case it will open github in
      comparison mode\n\n\U0001F3D7️ Compile code and generate zip file(s) by providing
      --compile flag"
    usage: playground connector-plugin sourcecode [OPTIONS]
    options:
    - names:
      - "--connector-plugin"
      - "-c"
      argument: CONNECTOR-PLUGIN
      description: "\U0001F50C Connector plugin name\n\n\U0001F393 Tip: use <tab>
        completion to trigger fzf completion\n\nRequired: ✓ Yes"
    - names:
      - "--only-show-url"
      argument: ''
      description: "\U0001F310 Only show url"
    - names:
      - "--connector-tag"
      argument: CONNECTOR_TAG
      description: "\U0001F517 Connector version to use\n\nBy default, for each connector,
        the latest available version on Confluent Hub is used (for Confluent employees,
        it will also get latest versions for fully managed connectors)\n\n\U0001F48C
        Confluent employees only: for fully managed connectors, use the cc-connect
        image version for the pcc. You must have a Confluent Github token set with
        GITHUB_TOKEN or GH_TOKEN environment variable and also be using Confluent
        VPN.\n\n\U0001F393 Tip: set to \" \" in order to select the version dynamically\n\n\U0001F393
        Tip: you can compare different sourcecode versions by specifying --connector-tag
        two times, in such case it will open github in comparison mode\n\nRepeatable:
        ✓ Yes"
    - names:
      - "--compile"
      argument: ''
      description: "\U0001F3D7️ Checkout and compile code\n\nYou must have git installed.\n\n\U0001F48C
        Confluent employees only: make sure to follow \"Maven FAQ\", you also need
        to be on Confluent VPN with proper AWS credentials set in order to be able
        to download proprietary dependencies.\n\nConflicts with: --checkout-only"
    - names:
      - "--compile-jdk-version"
      argument: COMPILE_JDK_VERSION
      description: "\U0001F90E JDK version to use when compiling\nIt will check in
        pom.xml for maven-compiler-plugin source/target version or release version
        and set jdk accordingly\nDefault is 11\n\nAllowed values: 8, 11, 17, 21, 25"
    - names:
      - "--compile-verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show output of compilation."
    - names:
      - "--open"
      - "-o"
      argument: ''
      description: "\U0001F516 Checkout the code and open with text editor set with
        playground config editor <editor> (default is code)\n\nConflicts with: --checkout-only"
    - names:
      - "--checkout-only"
      argument: ''
      description: "\U0001F4C2 Checkout the code at the right tag and print the path
        of the folder, nothing else\n\nNo browser, no editor, no question: an existing
        checkout of the same\nversion in /tmp/connector-plugin-sourcecode is reused.
        The path is\nthe last line of the output.\n\n\U0001F393 Tip: use it in scripts
        and from AI agents, which can then read the code\n\nConflicts with: --open,
        --compile"
- name: connector
  description: "\U0001F517 Connector commands\n\nEverything you would otherwise do
    with curl on the Connect REST API, with\nthe right host, port and credentials
    already figured out. The same\ncommands work whether the connector is self managed
    in the connect\ncontainer or fully managed in Confluent Cloud.\n\n\U0001F50D Look
    at what is running\n  status                  is it RUNNING, and if not, the full
    stack trace\n  wait                    wait until it is RUNNING (or another state)\n
    \ error-recommendations   suggested fixes for a failed fully managed connector\n
    \ show-config             the configuration actually applied\n  diff                    running
    config vs a file, another connector or the defaults\n  logs                    tail
    connect logs, filtered and followed\n  show-lag                consumer lag of
    a sink, until it reaches zero\n  benchmark               records per second, compared
    with the previous run\n  offsets get             where the connector is reading
    or writing\n  smt test                what a transform chain does to a record,
    step by step\n\n\U0001F6E0️ Change it\n  create-or-update        create it, or
    apply a new config, from stdin\n  validate                check a config with
    the plugin, without creating it\n  update                  edit the running config
    in your editor\n  pause / resume / stop / restart / delete\n  offsets alter /
    reset   rewind or fast-forward a connector\n\n\U0001F9D1‍\U0001F52C Understand
    it\n  show-config-parameters  every parameter the plugin accepts\n  select-config
    \          pick parameters interactively\n  versions                installed
    version vs latest on Confluent Hub\n  sourcecode              open the source
    on GitHub, or diff two versions\n  open-docs               open the Confluent
    documentation\n  snippets                ready-to-paste converter and dlq config\n\n\U0001F41E
    Dig deeper\n  log-level               raise connect log level for this connector\n
    \ enable-remote-debugging attach a java debugger to the connector code\n  translate
    \              self managed config to fully managed config\n\nWithout --connector,
    commands apply to every connector of the example,\nwhich is usually what you want
    since most examples run only one."
  usage: playground connector COMMAND
  options: []
  subcommands:
  - name: status
    description: "\U0001F9E9 Show status of all connectors\n\nThe connector state,
      the state of each task, and for a failed task the\nfull stack trace, which is
      the thing you actually need. Add --verbose to\nsee the underlying REST call."
    usage: playground connector status [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
  - name: wait
    description: "⏳ Wait for connectors to reach a state\n\nPolls the connector status
      every --interval seconds until the connector\nand all its tasks are in --state
      (RUNNING by default), and fails after\n--max-wait seconds, displaying the status
      with the stack trace.\n\nRUNNING is only reached when the connector and its
      tasks are still\nRUNNING one --interval later, since a task is RUNNING before
      it\nprocesses its first record and can fail right after.\n\nWhen waiting for
      RUNNING, it fails right away if the connector or one of\nits tasks is FAILED,
      since a failed task does not recover on its own.\nFor the same reason, --state
      FAILED is reached as soon as the connector\nor one of its tasks is FAILED (the
      connector itself usually stays\nRUNNING when only a task fails).\n\n\U0001F393
      Tip: in an example script, use it right after 'connector\ncreate-or-update'
      instead of a fixed sleep."
    usage: playground connector wait [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    - names:
      - "--state"
      argument: STATE
      description: "\U0001F3AF State to wait for (default is RUNNING)\n\nDefault value:
        RUNNING\nAllowed values: RUNNING, PAUSED, STOPPED, FAILED"
    - names:
      - "--max-wait"
      argument: MAX_WAIT
      description: |-
        ⏳ Max time in seconds to wait (default is 120)

        Default value: 120
    - names:
      - "--interval"
      argument: INTERVAL
      description: "\U0001F501 Interval in seconds between status checks (default
        is 5)\n\nDefault value: 5"
  - name: validate
    description: "✅ Validate a connector config without creating the connector\n\nSends
      the config to the validate endpoint of the plugin\n(PUT /connector-plugins/<class>/config/validate)
      and prints every\ninvalid property with its error message. Nothing is created
      or\nchanged, so it is the dry run of 'create-or-update' for a customer\nconfig.
      Exits with 1 if the config is invalid.\n\nThe config is read from stdin. Without
      stdin, --connector validates\nthe config of that running connector, for example
      after switching\nto another connector version.\n\nThe same automatic config
      as 'create-or-update' is added for the\nenvironment of the example (security
      settings on sasl-ssl...),\nunless --skip-automatic-connector-config is set.\n\n\U0001F393
      Tip: works for fully managed connectors too, with the validate\nendpoint of
      Confluent Cloud."
    usage: playground connector validate [JSON] [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\nName given to the validate endpoint
        with a config on stdin. Without\nstdin, the running connector whose config
        is validated."
    - names:
      - "--skip-automatic-connector-config"
      argument: ''
      description: "\U0001F916 Do not add the automatic configuration of the environment
        (security settings on sasl-ssl...) before validating"
  - name: diff
    description: "\U0001F500 Diff the config of a running connector with another config\n\nCompares
      the config of a running connector, key by key, with:\n\n  stdin              a
      config (plain json, or the heredoc printed by\n                     'show-config')\n
      \ --file             the same, from a file, e.g. the config of a\n                     customer\n
      \ --with-connector   another running connector\n  --defaults         the default
      value of each parameter of the plugin:\n                     shows only what
      the connector changes, and the\n                     keys set to their default
      that could be removed\n\nKeys only on one side, and keys with different values,
      are listed.\nPasswords masked by the REST API are not compared.\n\n\U0001F393
      Tip: run it with the config of a customer and the config of the\nexample to
      see right away what differs."
    usage: playground connector diff [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    - names:
      - "--file"
      - "-f"
      argument: FILE
      description: "\U0001F4C4 File with the config to compare with (json, or a create-or-update
        heredoc)"
    - names:
      - "--with-connector"
      argument: WITH_CONNECTOR
      description: "\U0001F517 Other running connector to compare with"
    - names:
      - "--defaults"
      argument: ''
      description: "\U0001F4A4 Compare with the default value of each parameter of
        the plugin"
    - names:
      - "--json"
      argument: ''
      description: "\U0001F916 Print the result as JSON"
  - name: error-recommendations
    description: "\U0001F4A1 Show error recommendations for fully managed connectors\n\nConfluent
      Cloud analyses the failure stack trace of a failed fully\nmanaged or custom
      connector and suggests remediation steps. Nothing is\nreturned for a healthy
      connector, or for one that only failed config\nvalidation: 'playground connector
      status' shows those errors."
    usage: playground connector error-recommendations [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
  - name: oracle-cdc-xstream
    description: "\U0001F17E️ Specific Oracle CDC Xstream commands\n\nWith XStream,
      half of the interesting state lives in the database, not\nin Connect. A connector
      that shows RUNNING while no change arrives is\nalmost always a capture process
      or an outbound server that is stuck on\nthe Oracle side, and the connect logs
      say nothing about it.\n\n  debug             query the XStream views from the
      Oracle container\n  generate-report   run the official diagnostics script\n\nOnly
      available when an oracle container is running. To analyze a report\n(also one
      sent by a customer), use 'playground analyze oracle-xstream-report'."
    usage: playground connector oracle-cdc-xstream COMMAND
    options: []
    subcommands:
    - name: generate-report
      description: "⚙️ Generate and open oracle cdc xstream connector diagnostics\n\nRuns
        the diagnostics script Confluent support asks for, and opens the\nresult.
        This is the file to attach to a case rather than pasting\nindividual query
        outputs.\n\n\U0001F50E 'playground analyze oracle-xstream-report -c oracle'
        generates it and\nanalyzes it in one go.\n\nSee https://docs.confluent.io/kafka-connectors/oracle-xstream-cdc-source/current/troubleshooting.html#connector-diagnostics-script"
      usage: playground connector oracle-cdc-xstream generate-report
      options: []
    - name: debug
      description: "\U0001F41E Execute various SQL commands to debug xstream components\n\nRuns
        a series of queries against the XStream views inside the oracle\ncontainer
        and prints the results, with a link to the Oracle\ndocumentation of each view:\n\n
        \ capture processes   their status, SCN values and latencies\n  redo logs
        \          the files each capture process still needs\n  outbound server     general
        state, current transaction, low position\n  parameters          capture and
        apply settings actually in effect\n  rules               the rules the XStream
        components are using\n\nRead it top to bottom when a connector is RUNNING
        but idle: a capture\nprocess not in CAPTURING CHANGES, or an SCN that never
        moves, tells\nyou the problem is in the database and not in the connector."
      usage: playground connector oracle-cdc-xstream debug
      options: []
  - name: smt
    description: "\U0001F9EA Single message transforms (SMT)\n\n  test                         apply
      a transform chain to a record, step by step"
    usage: playground connector smt COMMAND
    options: []
    subcommands:
    - name: test
      description: "\U0001F9EA Apply the transform chain (SMT) of a connector to a
        record, step by step\n\nShows what each transform changes (topic, key, value,
        headers, schema field by field), the result of each predicate, a record dropped
        by a transform, and the transform that throws with its config and its error.
        No topic or connector is created: the chain runs in a small harness in the
        connect container, with the classpath and the plugin.path of the worker, so
        the transforms, predicates and converters are the same classes and versions
        as in the worker.\n\nThe transforms come from a running connector (--connector)
        or from a connector config on stdin (or --config @file). The record is a json
        (--record): schemaless, or {\"schema\": ..., \"payload\": ...} like the JsonConverter
        for a record with a schema. Or a real record of a topic (--from-topic, --offset),
        converted with the converters of the connector (avro, protobuf, json schema
        with schema registry).\n\n--cp-version runs the same test with the built-in
        transforms of other CP versions (throwaway cp-server-connect containers),
        --smt-plugin installs a Confluent Hub plugin for the test only (the worker
        is not changed), --smt-jar adds a jar (custom SMT development).\n\nAn html
        report of the steps (the value after each step with the added, changed and
        removed fields highlighted, the schema diff, the predicates, the error with
        its stack trace, and with --cp-version a comparison of the versions) is written
        to /tmp/playground-smt-test, and opened in the browser in an interactive terminal.\n\n\U0001F393
        Tip: the connector config can be a whole connector config: only transforms.*,
        predicates.* and the converters are used."
      usage: playground connector smt test [OPTIONS]
      options:
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
      - names:
        - "--connector"
        - "-c"
        argument: CONNECTOR
        description: "\U0001F517 Use the transforms, predicates and converters of
          this running connector"
      - names:
        - "--config"
        argument: CONFIG
        description: "\U0001F4C4 Connector config with the transforms (json, or @file),
          instead of --connector or stdin"
      - names:
        - "--record"
        argument: RECORD
        description: "\U0001F9FE Record to transform (json, or @file): {\"topic\":
          \"orders\", \"key\": ..., \"value\": ..., \"headers\": {...}, \"timestamp\":
          <ms>}\n\nkey and value are schemaless json, or {\"schema\": ..., \"payload\":
          ...} for a record with a schema. Headers are typed like the SimpleHeaderConverter
          does (string, int64, float64, boolean, map, array), or {\"schema\": ...,
          \"payload\": ...}; give them as a list [{\"key\": ..., \"value\": ...}]
          for several headers with the same key. Default: a schemaless record with
          a value {\"id\": 1, \"name\": \"foo\"}"
      - names:
        - "--from-topic"
        argument: FROM-TOPIC
        description: "\U0001F5F3 Read the record from this topic instead of --record,
          and convert it with the converters of the connector"
      - names:
        - "--offset"
        argument: OFFSET
        description: "\U0001F4CD Offset of the record with --from-topic (default is
          0)\n\nDefault value: 0"
      - names:
        - "--partition"
        argument: PARTITION
        description: "\U0001F9E9 Partition of the record with --from-topic (default
          is 0)\n\nDefault value: 0"
      - names:
        - "--type"
        argument: TYPE
        description: "\U0001F500 Build a sink or a source record (default: the type
          of --connector, sink otherwise)\n\nAllowed values: sink, source"
      - names:
        - "--cp-version"
        argument: CP-VERSION
        description: "\U0001F522 Run the test with the built-in transforms of these
          CP versions (repeat the flag), in throwaway cp-server-connect containers,
          to compare them. The plugins of the running worker are not available there,
          only --smt-plugin and --smt-jar\n\nRepeatable: ✓ Yes"
      - names:
        - "--smt-plugin"
        argument: SMT-PLUGIN
        description: "\U0001F9E9 Confluent Hub plugin with transforms, installed for
          the test only (owner/name:version), e.g. confluentinc/connect-transforms:1.6.2\n\nRepeatable:
          ✓ Yes"
      - names:
        - "--smt-jar"
        argument: SMT-JAR
        description: |-
          ☕ Jar with transforms to add for the test (custom SMT development). Repeat it for the jars it depends on: they are loaded together, as one plugin

          Repeatable: ✓ Yes
      - names:
        - "--json"
        argument: ''
        description: "\U0001F4C4 Print the steps as json"
      - names:
        - "--no-open"
        argument: ''
        description: "\U0001F6AB Do not open the html report in the browser (it is
          still written, and its path printed)"
  - name: offsets
    description: "\U0001F488 Handle source and sink connectors offsets\n\nWhere a
      connector is in its data: for a source, the position it keeps in\nthe system
      it reads from (a SCN, a binlog position, a file offset); for a\nsink, the consumer
      group offsets of the topics it consumes.\n\n  get                          show
      them\n  alter                        edit them in your editor, then apply\n
      \ reset                        start over from the beginning\n  get-offsets-request-status
      \  did the last change go through\n\nThis uses the first-class offsets API (KIP-875),
      so it needs CP 7.5 for\nget and CP 7.6 for alter and reset. On older CP the
      playground falls back\nto kafka-consumer-groups, which only covers sink connectors.\n\nThe
      connector must not be running while its offsets change: alter and\nreset stop
      it and resume it for you.\n\n\U0001F393 Tip: a sink that reprocesses everything
      and a source that re-snapshots\nare usually offsets problems, not connector
      problems. Look here first."
    usage: playground connector offsets COMMAND
    options: []
    subcommands:
    - name: get
      description: "\U0001F3F9 Get current offsets for source and sink connectors\n\nPrints
        the offsets json returned by the Connect REST API, or the\nConfluent Cloud
        offsets API for a fully managed connector. For a sink\non CP older than 7.5,
        it falls back to kafka-consumer-groups\n--describe on the connect-<connector>
        consumer group.\n\nRun it before and after alter or reset to check what really
        moved.\n\nSee https://docs.confluent.io/cloud/current/connectors/offsets.html"
      usage: playground connector offsets get [OPTIONS]
      options:
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
      - names:
        - "--connector"
        - "-c"
        argument: CONNECTOR
        description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
          the command will apply to all connectors"
    - name: reset
      description: "\U0001F195 Reset offsets for source and sink connectors\n\nWipes
        the recorded offsets so the connector starts over: a source\nre-reads its
        origin from the beginning, a sink re-consumes its topics\nfrom the earliest
        offset. The connector is stopped and resumed around\nthe reset.\n\n⚠️ Everything
        is reprocessed, so expect duplicates downstream unless\nthe target is idempotent.
        Use alter when you only want to move back\nto a specific point.\n\nSee https://docs.confluent.io/cloud/current/connectors/offsets.html"
      usage: playground connector offsets reset [OPTIONS]
      options:
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
      - names:
        - "--connector"
        - "-c"
        argument: CONNECTOR
        description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
          the command will apply to all connectors"
    - name: alter
      description: |-
        ⛏️ Alter offsets for source and sink connectors

        Fetches the current offsets, opens them in your editor, and applies
        what you saved once you close the file. That is how you rewind a sink
        to a given offset, or move a source back to an earlier position,
        without replaying everything.

        The connector is stopped before the change and resumed after it. On
        Confluent Cloud the change is asynchronous, so the command then polls
        get-offsets-request-status and prints the resulting offsets.

        See https://docs.confluent.io/cloud/current/connectors/offsets.html
      usage: playground connector offsets alter [OPTIONS]
      options:
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
      - names:
        - "--connector"
        - "-c"
        argument: CONNECTOR
        description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
          the command will apply to all connectors"
    - name: get-offsets-request-status
      description: "\U0001F441️‍\U0001F5E8️ Get the status of the previous offset
        request\n\nOn Confluent Cloud, alter and reset only queue a request. This
        shows\nwhether it was APPLIED or FAILED, and the error when it failed, which\nis
        the only place the reason shows up.\n\nOnly for fully managed and custom connectors,
        self managed connectors\napply the change synchronously.\n\nSee https://docs.confluent.io/cloud/current/connectors/offsets.html"
      usage: playground connector offsets get-offsets-request-status [OPTIONS]
      options:
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
      - names:
        - "--connector"
        - "-c"
        argument: CONNECTOR
        description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
          the command will apply to all connectors"
  - name: plugins
    description: "\U0001F3A8 Show all connector plugins installed. You can also display
      transforms, converters and predicates using --all flag\n\nThe first thing to
      check when a connector fails to be created with\n\"Failed to find any class
      that implements Connector\": the class you\nasked for is not in this list, so
      the plugin was not installed or not\npicked up from the plugin path."
    usage: playground connector plugins [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--all"
      argument: ''
      description: "\U0001F315 Show also transforms, converters, predicates available"
  - name: pause
    description: |-
      ⏸️  Pause connector

      Tasks stop processing but stay assigned, and the configuration is kept.
      Handy to let a backlog build up, or to freeze a connector while you
      change the system it talks to. Resume with 'playground connector resume'.
    usage: playground connector pause [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
  - name: versions
    description: "\U0001F9DE Get current and latest versions available on Confluent
      Hub for connector(s) used in example\n\nTells you in one line whether you are
      testing an outdated connector.\nTo move to the version reported as latest, re-run
      the example with\n'playground update-version --connector-tag <version>'."
    usage: playground connector versions
    options: []
  - name: sourcecode
    description: "\U0001F9D1‍\U0001F4BB open source code url for connector(s) used
      in example\n\nYou can compare different sourcecode versions by specifying --connector-tag
      two times, in such case it will open github in comparison mode\n\n\U0001F48C
      Confluent employees only: for fully managed connectors, use the cc-connect image
      version for the pcc. You must have a Confluent Github token set with GITHUB_TOKEN
      or GH_TOKEN environment variable and also be using Confluent VPN."
    usage: playground connector sourcecode [OPTIONS]
    options:
    - names:
      - "--only-show-url"
      argument: ''
      description: "\U0001F310 Only show url"
    - names:
      - "--connector-tag"
      argument: CONNECTOR_TAG
      description: "\U0001F517 Connector version to use\n\nBy default, for each connector,
        the current version is used (for Confluent employees, it will also get latest
        versions for fully managed connectors)\n\n\U0001F393 Tip: set to \" \" in
        order to select the version dynamically\n\n\U0001F393 Tip: you can compare
        different sourcecode versions by specifying --connector-tag two times, in
        such case it will open github in comparison mode\n\nRepeatable: ✓ Yes"
  - name: enable-remote-debugging
    description: "✨ Enable java remote debugging for the connector.\n\n\U0001F449
      Check documentation https://kafka-docker-playground.io/#/reusables?id=%e2%9c%a8-remote-debugging\n\n\U0001F3D7️
      It will checkout (you need git installed) and compile code for the connector
      (required for remote debugging).\n\n\U0001F48C Confluent employees only: make
      sure to follow \"Maven FAQ\", you also need to be on Confluent VPN with proper
      AWS credentials set in order to be able to download proprietary dependencies.\n\n⚠️
      This does not work for fully and custom connectors."
    usage: playground connector enable-remote-debugging
    options: []
  - name: disable-remote-debugging
    description: "\U0001F6D1 Disable java remote debugging for the connector."
    usage: playground connector disable-remote-debugging
    options: []
  - name: restart
    description: |-
      ♻️  Restart connector

      The usual way to recover a connector whose tasks are FAILED after you
      fixed the cause. Use --task-id to restart a single failed task and leave
      the healthy ones alone.
    usage: playground connector restart [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    - names:
      - "--task-id"
      - "-t"
      argument: TASK_ID
      description: "\U0001F527 Restart specific task ID only (instead of restarting
        entire connector)"
  - name: stop
    description: "\U0001F6D1 Stop connector (only available if CP > 7.5)\n\nStronger
      than pause: the tasks are shut down and unassigned, so the\nconnector consumes
      no resources at all. This is the state in which\noffsets can be altered or reset."
    usage: playground connector stop [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
  - name: resume
    description: |-
      ⏯️  Resume connector

      Restarts processing after a pause or a stop, from the offsets where the
      connector left off.
    usage: playground connector resume [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    aliases:
    - unpause
  - name: delete
    description: "\U0001F5D1️  Delete connector\n\nRemoves the connector and its configuration.
      Its offsets survive in the\nKafka internal topics, so re-creating it under the
      same name resumes\nwhere it stopped rather than starting over.\n\nFor a fully
      managed or custom connector, the topics the connector\ncreated on its own are
      deleted as well: dead letter queue and, for\nconnectors with a reporter, success
      and error topics (dlq-lcc-xxxx,\nsuccess-lcc-xxxx, error-lcc-xxxx, or the names
      set in the config with\nerrors.deadletterqueue.topic.name, reporter.error.topic.name
      and\nreporter.result.topic.name). Keep them with --keep-related-topics."
    usage: playground connector delete [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    - names:
      - "--keep-related-topics"
      argument: ''
      description: "\U0001F530 Do not delete the dlq, success and error topics of
        a fully managed or custom connector"
  - name: diagnose
    description: "\U0001FA7A Diagnose a connector in one call: status, errors and
      progress\n\nChains the commands you would run one after the other when a connector\nmisbehaves,
      and returns:\n\n  \U0001F5FA️  status       connector and task states, with
      the trace of a failed task\n  \U0001F525 errors       digest of the connect
      ERROR/FATAL records (self-managed),\n                  or Confluent Cloud error
      recommendations (fully managed)\n  \U0001F422 progress     consumer lag of a
      sink (its committed offsets when a task is not\n                  RUNNING),
      or offsets of a source\n  \U0001F449 next steps   the commands to dig further\n\nIt
      never follows logs and never waits for the lag to reach 0, so it is\nsafe to
      use from scripts and AI agents."
    usage: playground connector diagnose [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    - names:
      - "--since"
      argument: SINCE
      description: "\U0001F550 Only look at connect logs newer than this (default
        1h). Docker durations: 10m, 2h... (self-managed only)\n\nDefault value: 1h"
    - names:
      - "--max-findings"
      argument: MAX_FINDINGS
      description: |-
        ✂️ Maximum number of distinct error records to show (default 15)

        Default value: 15
  - name: show-lag
    description: "\U0001F422 Show lag of sink connector\n\nThe consumer lag of the
      sink, refreshed every --interval seconds, so you\nsee whether it is catching
      up, standing still or falling behind. A lag\nthat does not move while the connector
      reports RUNNING means the tasks\nare stuck rather than slow.\n\nIt will run
      until all lag becomes 0 (press ctrl-c to exit)"
    usage: playground connector show-lag [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    - names:
      - "--interval"
      argument: INTERVAL
      description: |-
        Interval between lag checks (default is 20 seconds).

        Default value: 20
    - names:
      - "--max-wait"
      argument: MAX_WAIT
      description: |-
        ⏳ Max time in seconds to wait for lag to become 0. If set to 0 (default), it will run until all lag becomes 0.

        Default value: 0
  - name: benchmark
    description: "\U0001F3CE️ Benchmark the throughput of a connector\n\nMeasures
      how many records per second a running self managed connector\nprocesses, so
      that two runs can be compared: another --connector-tag,\nanother batch size,
      another number of tasks. Everything runs on one\ndocker host, so the numbers
      are relative: compare runs on the same\nmachine only.\n\n\U0001F393 Tip: playground
      run --benchmark runs it right after the example (also\na toggle in the playground
      run menu).\n\n--mode drain (default) pauses the connector, loads a backlog of\n--nb-records,
      resumes the connector and measures the time it takes to\nprocess the backlog.
      This is the most reproducible number, since it does\nnot depend on how fast
      the load is generated.\n\n--mode steady measures the throughput during --duration
      (after\n--warmup), while --stream-load-command runs in the background. When
      the\nconnector simply keeps up with the load (consumer lag of a sink, records\ngenerated
      by the load of a source), the summary says so: the result is\nthen the speed
      of the load, not of the connector.\n\nThe load comes from the example:\n\n  -
      sink connectors: the 'playground topic produce' of the example\n    script that
      feeds the connector is replayed with --nb-messages\n    <n> (same schema, key
      and headers), so every sink example that\n    produces its data works without
      anything else\n  - source connectors: benchmark-load.bash next to the example\n
      \   script, called with --records <n> --mode preload|stream --shape\n    bulk|small-txn|update
      (rows in the CUSTOMERS table for the\n    postgres, mysql, oracle and sql server
      examples, documents for\n    mongodb, messages for ibm mq, mqtt, activemq, sqs,
      kinesis,\n    pub/sub and cloudwatch logs, files for spool dir, filepulse,\n
      \   filestream, sftp, ftps, hdfs 2 / 3 and the generalized s3, gcs and\n    azure
      blob storage sources, see the README of the example). It is\n    called with
      --check first, so that an unsupported\n    combination fails before the connector
      is paused\n  - or --load-command / --stream-load-command, which take precedence\n\nBENCHMARK_LOAD_SCRIPT=<file>
      uses another load script than\nbenchmark-load.bash: a file name in the folder
      of the example (or an\nabsolute path), e.g. one per reproduction model named
      after its ticket\n(BENCHMARK_LOAD_SCRIPT=benchmark-load-123456.bash). It takes
      the same\narguments, and --enable-sql-datagen uses it too.\n\nThroughput is
      read from the connect JMX metrics of the tasks\n(sink-record-read-total: records
      read from kafka, including the ones\nfiltered or sent to the dlq; source-record-write-total),
      sampled every\n--interval. Results are written to --output-dir (samples csv,
      result\njson and an html report with the charts, opened in the browser at the\nend
      in an interactive terminal) and appended to the benchmark-history\nfile, and
      the summary compares them with the previous benchmark of the\nsame connector
      in the same example (or with --compare <result json>).\n\nEach result records
      the setup it ran on (host cpu and memory, container\nengine resources, connect
      image and whether it is emulated, jvm and\nheap, number of workers and brokers,
      environment, connector config with\nsecrets masked): the report shows it, and
      the summary warns when the\nprevious run was on a different setup.\n\n\U0001F6E9️
      The connect workers are recorded with Java Flight Recorder during\nthe measure
      (over JMX: the cp images have no jcmd, nothing is\nrestarted), and the report
      and the summary say where the time of the\ntask threads went: running, blocked
      on the system behind the\nconnector, in the Kafka client, locks, waits; the
      CPU by layer\n(connector, converters, SMTs, Kafka client, libraries, logging),
      hot\nmethods, allocation, GC, exceptions, with findings and next steps.\nWith
      --connector-tag, the versions are compared the same way. The\nrecording costs
      a few % of throughput: --no-flight-recorder disables\nit, and the summary warns
      when the previous run was not recorded the\nsame way. The .jfr files are kept
      in --output-dir (JDK Mission\nControl, or playground analyze flight-recorder).\n\n\U0001F4CA
      When Grafana runs (example started with --enable-jmx-grafana,\nor --enable-sql-datagen),
      the measure is annotated on the Kafka\nConnect, connector (Debezium, Oracle
      CDC, XStream, MongoDB) and\nKafka cluster dashboards, and the summary and the
      report link to\nthem at the time of the run (each version is annotated with\n--connector-tag).
      Grafana is not started by the benchmark: its\nJMX exporter and containers use
      CPU, and the summary warns when\nthe previous run was not measured the same
      way.\n\n☁️ Fully managed source connectors (ccloud/fm-*-source examples that\nship
      a benchmark-load.bash, the one of the equivalent self managed\nexample: same
      local database or broker, reached by the connector\nthrough ngrok): the records
      are counted from the end offsets of the\ntopics of the connector every --interval
      (its kafka.topic or\ntopic.prefix, and the topics consumed by the example script,\n--topic
      to choose them), since Confluent Cloud gives no JMX: no batch\ntime, running
      ratio, cpu, gc, flight recorder nor --connector-tag.\nA drain starts measuring
      at the first records seen after the resume\n(Confluent Cloud takes a few seconds
      to restart the tasks, and its\nstatus lags behind them), so the records seen
      by that first sample\nare not measured. The throughput includes the network
      between the\ndocker host and Confluent Cloud. Run the example and answer n when
      it asks to\ndelete the connector, then run the benchmark.\n\n☁️ Fully managed
      sink connectors: the load is the replay of the\n'playground topic produce' of
      the example, like for a self managed\nsink, and the records are counted from
      the offsets committed by the\nconsumer group of the connector (connect-<lcc
      id>). Confluent Cloud\ncommits them about every minute, so the end of a drain
      is known\nwithin one commit interval: a drain that sees less than 5 commits\nis
      reported as a lower bound, and the summary gives the\n--nb-records of a drain
      of 10 commits (within ~10%, usually 1M\nrecords or more).\n\n\U0001F4C8 After
      the measure of a fully managed connector, the benchmark\nreads its per minute
      metrics in the Confluent Cloud Metrics API\n(sent_records / received_records,
      exact counts published about 30s\ninto each minute): the steady throughput is
      the median of the full\nminutes of the measure (a drain of 3 minutes or more
      has one), which\ndoes not depend on when a sink commits its offsets, and the
      put batch\ntime, batch size and dlq records fill the rows that JMX gives for
      a\nself managed connector. The Metrics API uses the Cloud API key\n(CONFLUENT_CLOUD_API_KEY)
      and does not answer for a deleted connector.\n\n⚠️ Not available with the cfk
      environment yet."
    usage: playground connector benchmark [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: not needed when only
        one connector is running"
    - names:
      - "--mode"
      argument: MODE
      description: "\U0001F3C1 drain (time to process a backlog of --nb-records) or
        steady (throughput during --duration)\n\nDefault value: drain\nAllowed values:
        drain, steady"
    - names:
      - "--nb-records"
      argument: NB-RECORDS
      description: "\U0001F4AF Number of records of the backlog in drain mode (default
        is 100000)\n\nDefault value: 100000"
    - names:
      - "--shape"
      argument: SHAPE
      description: "\U0001F9F1 Shape of the load, passed to benchmark-load.bash (default
        is bulk)\n\n- bulk: one transaction with all the records\n- small-txn: one
        transaction per record\n- update: updates existing records\n- delete: deletes
        existing records (drain only; not for a JDBC source, which does not capture
        deletes; with Debezium or XStream, each deleted row also gives a tombstone,
        unless tombstones.on.delete=false)\n\nA sequence of shapes, e.g. bulk,update,delete,
        runs one drain per shape on the same rows (insert, update, then delete them)
        and compares the phases in the summary and the report. Drain of a source connector
        only.\n\nDefault value: bulk"
    - names:
      - "--record-size"
      argument: RECORD-SIZE
      description: "\U0001F3CB️ Record size in bytes, passed to benchmark-load.bash
        (default is 0: size given by the load)\n\nDefault value: 0"
    - names:
      - "--load-command"
      argument: LOAD-COMMAND
      description: "\U0001F4E5 Command that loads the backlog in drain mode, instead
        of benchmark-load.bash (or of the replayed produce of a sink)\n\nIt runs with
        bash -c, from the current directory, while the connector is paused. It must
        create the records and return: --nb-records is then the number of records
        the connector should process, unless the command prints a line BENCHMARK_RECORDS=<n>.\n\nExamples:\n\n
        \ # sink: 1M records in the topic of the connector (use the schema of its
        records)\n  --nb-records 1000000 --load-command \"playground topic produce
        -t my-topic --nb-messages 1000000 --value @predefined-schemas/avro/customer.avsc\"\n\n
        \ # source: your own script, which inserts the rows and prints BENCHMARK_RECORDS=<n>\n
        \ --load-command \"./load-my-table.sh 500000\""
    - names:
      - "--stream-load-command"
      argument: STREAM-LOAD-COMMAND
      description: "\U0001F30A Command that generates load continuously in steady
        mode, instead of benchmark-load.bash (or of the replayed produce of a sink)\n\nIt
        runs in the background with bash -c, from the current directory. At the end
        of the measure, the file named by the BENCHMARK_STOP_FILE environment variable
        is created: the command should stop at the end of its current batch when it
        exists. It is killed after 120s otherwise, and killing a producer in the middle
        of a batch can send a truncated record to the topic. If it prints BENCHMARK_BATCH=<records>
        <epoch seconds> after each batch, the summary tells when the connector only
        kept up with the load.\n\nExample, batches of 10000 records in the topic of
        the connector until the end of the measure:\n\n  --stream-load-command 'while
        [ ! -f \"\\$BENCHMARK_STOP_FILE\" ]; do playground topic produce -t my-topic
        --nb-messages 10000 --value @predefined-schemas/avro/customer.avsc; echo \"BENCHMARK_BATCH=10000
        \\$(date +%s)\"; done'"
    - names:
      - "--topic"
      - "-t"
      argument: TOPIC
      description: "\U0001F5F3 Topics to count records in at the end of a drain, to
        check the result of a source connector (default is the topics of the connector)\n\nRepeatable:
        ✓ Yes"
    - names:
      - "--duration"
      argument: DURATION
      description: |-
        ⏱️ Duration of the measure in steady mode, in seconds or with a s/m/h suffix (default is 5m)

        Default value: 5m
    - names:
      - "--warmup"
      argument: WARMUP
      description: "\U0001F525 Time excluded from the measure at the beginning in
        steady mode (default is 30s)\n\nDefault value: 30s"
    - names:
      - "--interval"
      argument: INTERVAL
      description: "\U0001F501 Interval between samples (default is 5s)\n\nDefault
        value: 5s"
    - names:
      - "--max-wait"
      argument: MAX-WAIT
      description: |-
        ⏳ Max time to wait for the backlog to be processed in drain mode (default is 30m)

        Default value: 30m
    - names:
      - "--connector-tag"
      argument: CONNECTOR-TAG
      description: "\U0001F9E9 Benchmark these versions of the connector plugin one
        after the other (repeat the flag), and compare them\n\nFor each version: playground
        update-version --connector-tag (only the connect container is restarted, the
        connector and its offsets are kept), check that the connector runs the requested
        version, an untimed warm-up drain (the worker jvm was restarted), then the
        benchmark. The original version is restored at the end, and the summary and
        the report compare the versions.\n\nExample: --connector-tag 10.8.4 --connector-tag
        10.9.9\n\n⚠️ A downgrade or a major version change can be incompatible with
        the offsets or the config of the connector: the benchmark stops at the first
        FAILED state.\n\nRepeatable: ✓ Yes"
    - names:
      - "--rounds"
      argument: ROUNDS
      description: "\U0001F501 With --connector-tag, number of rounds over the versions
        (default is 1): 2 alternates them (A B A B), which shows a drift from one
        run to the next\n\nDefault value: 1"
    - names:
      - "--output-dir"
      argument: OUTPUT-DIR
      description: "\U0001F4C2 Folder for the samples csv, the result json and the
        html report (default is /tmp/playground-benchmark)\n\nDefault value: /tmp/playground-benchmark"
    - names:
      - "--compare"
      argument: COMPARE
      description: "⚖️ Result json of a previous benchmark to compare with (default
        is the previous benchmark of the same connector in the same example, from
        the benchmark-history file)"
    - names:
      - "--no-history"
      argument: ''
      description: "\U0001F648 Do not append the result to the benchmark-history file"
    - names:
      - "--sessions"
      argument: SESSIONS
      description: "\U0001F9F5 Run the benchmark-load.bash of the example in <sessions>
        parallel sessions (default is 1)\n\nA drain splits --nb-records between them,
        steady mode gives each session batches of --nb-records. Concurrent transactions
        are what a busy database looks like to a CDC connector (interleaved transactions
        in the redo log or the WAL, several open transactions). Only with the benchmark-load.bash
        of the example, not with --load-command.\n\nDefault value: 1"
    - names:
      - "--no-flight-recorder"
      argument: ''
      description: "\U0001F6E9️ Do not record the connect workers with Java Flight
        Recorder during the measure (no \"where the time goes\" section in the report)\n\nThe
        recording costs a few % of throughput: compare runs recorded the same way."
    - names:
      - "--json"
      argument: ''
      description: "\U0001F4C4 Print the result as json instead of the summary"
  - name: show-config
    description: "\U0001F9F0 Show current connector config that was applied\n\nuse
      --force-rest-endpoint to get results with REST API /config endpoint (https://docs.confluent.io/platform/current/connect/references/restapi.html#get--connectors-(string-name)-config)"
    usage: playground connector show-config [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    - names:
      - "--force-rest-endpoint"
      argument: ''
      description: "☢️ Force using REST API /config endpoint (https://docs.confluent.io/platform/current/connect/references/restapi.html#get--connectors-(string-name)-config)"
  - name: show-config-parameters
    description: "\U0001F529 Show all possible configuration parameters of connector\n\nThe
      full reference of what the plugin accepts, with types, defaults,\nimportance
      and documentation, read from the plugin itself rather than\nfrom the website.
      Use it to check the exact spelling of a property, or\nto discover the knob you
      need.\n\nUse --open to read it in your editor, --only-show-json to get it as\njson."
    usage: playground connector show-config-parameters [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    - names:
      - "--open"
      - "-o"
      argument: ''
      description: "\U0001F516 Save output to a file and open with text editor set
        with playground config editor <editor> (default is code)"
    - names:
      - "--force-refresh"
      argument: ''
      description: "☢️ Force refresh."
    - names:
      - "--only-show-json"
      argument: ''
      description: "\U0001F4D7 Only show list of all available parameters for connector
        (with default value when applicable)"
  - name: display-metrics-api
    description: |-
      〽️ Display metrics api for fully managed connector

      Queries the Confluent Cloud Telemetry API for the connector: a summary
      with the connector and task statuses, then every metric that is not
      zero. A fully managed connector gives you no jmx and little logging, so
      this is how you tell whether it is actually doing work.

      See https://api.telemetry.confluent.cloud/docs/descriptors/datasets/cloud
    usage: playground connector display-metrics-api [OPTIONS]
    options:
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    - names:
      - "--open"
      - "-o"
      argument: ''
      description: "\U0001F516 Save output to a file and open with text editor set
        with playground config editor <editor> (default is code)"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
  - name: display-metrics-api-with-grafana
    description: "\U0001F4CA Display metrics api for fully managed connector in Grafana
      dashboard\n\nSame metrics as display-metrics-api, but plotted over time in Grafana\ninstead
      of printed once. Use it when you need to see a trend, a spike or\nthe moment
      throughput dropped, rather than the current value.\n\nIt starts its own prometheus
      and grafana containers with a dashboard\nalready provisioned, so there is nothing
      to enable beforehand and it\ndoes not interfere with the grafana of the example.\n\nNot
      supported for custom connectors."
    usage: playground connector display-metrics-api-with-grafana [OPTIONS]
    options:
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
  - name: select-config
    description: "\U0001F5DC️ Easily select config from all possible configuration
      parameters of connector\n\nAn fzf picker over everything the plugin accepts.
      Type a few letters,\npick the properties you want and they are printed, with
      their default\nvalue when there is one, ready to paste into a connector configuration.\nOn
      macOS they are copied to your clipboard as well.\n\nFaster than show-config-parameters
      when you already know roughly what\nyou are after and just want the exact property
      names.\n\n\U0001F393 Tip: use <tab> to select multiple config at once, then
      press <enter> to confirm"
    usage: playground connector select-config [OPTIONS]
    options:
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
  - name: snippets
    description: "\U0001F50C useful snippets\n\nPrints ready-to-paste blocks of connector
      configuration: the key and\nvalue converter properties for a given format with
      --converter, and the\ndead letter queue properties with --dlq. Saves you from
      looking up the\nexact property names and the schema registry settings that go
      with them."
    usage: playground connector snippets [OPTIONS]
    options:
    - names:
      - "--converter"
      argument: CONVERTER
      description: "\U0001F50C Converter\n\nAllowed values: avro, protobuf, json-schema,
        json, json-schema-enabled, string, bytearray"
    - names:
      - "--dlq"
      argument: ''
      description: "\U0001F480 dlq"
  - name: open-docs
    description: "\U0001F9D1‍\U0001F393 Open connector documentation of currently
      running connector(s)\n\nWorks out the documentation page from the connector
      class actually\nrunning and opens it, so you land on the right page for the
      right\nconnector without searching for it.\n\nUse --only-show-url to print the
      link instead, for pasting in a case."
    usage: playground connector open-docs [OPTIONS]
    options:
    - names:
      - "--only-show-url"
      argument: ''
      description: "\U0001F310 Only show url"
  - name: log-level
    description: "\U0001F9EC Set connect log level\n\nRaises the log level for the
      packages of the connector that is running,\nwithout restarting anything. Set
      it to TRACE, reproduce the problem,\nthen read 'playground connector logs'.\n\nThis
      is the difference between \"the task failed\" and seeing the request\nthat failed,
      the record that broke and what the SMT chain did to it.\n\n\U0001F393 Tip: it
      will also set io.confluent.kafka.schemaregistry.client.rest.RestService (to
      see schema registry rest requests) and org.apache.kafka.connect.runtime.TransformationChain
      (to see records before and after SMTs)\n        it will also set org.apache.kafka.connect.runtime.WorkerSinkTask
      for sink and org.apache.kafka.connect.runtime.WorkerSourceTask for source connectors."
    usage: playground connector log-level [OPTIONS]
    options:
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    - names:
      - "--level"
      - "-l"
      argument: LEVEL
      description: |-
        ❕Log level

        Required: ✓ Yes
        Allowed values: INFO, WARN, DEBUG, TRACE
  - name: logs
    description: "\U0001F575️  Tail and follow connect logs\n\nThe logs of the worker
      running your connector. Combine it with\n'playground connector log-level' to
      get more than the stack trace, and\nwith --wait-for-log to block until a given
      line appears, which is how\nexamples assert that something happened.\n\nFor
      onprem connectors, this is basically a shortcut for \"playground container logs
      --container connect\", --connector flag is not relevant\n\nFor Fully Managed
      connectors, limitations apply (see https://docs.confluent.io/cloud/current/connectors/logging-cloud-connectors.html#using-ccloud-cli)"
    usage: playground connector logs [OPTIONS]
    options:
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    - names:
      - "--open"
      - "-o"
      argument: ''
      description: "\U0001F516 Save output to a file and open with text editor set
        with playground config editor <editor> (default is code)\n\nConflicts with:
        --wait-for-log"
    - names:
      - "--wait-for-log"
      - "-w"
      argument: LOG
      description: "\U0001F634 Wait until log appears\n\nConflicts with: --open"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
  - name: open-ccloud-connector-in-browser
    description: "\U0001F916 Open Fully Managed connector in browser (Confluent Cloud
      dashboard)\n\nJumps straight to the connector's page in the Confluent Cloud
      console,\nresolving its lcc id for you, so you do not have to hunt through the\nenvironment
      and cluster menus."
    usage: playground connector open-ccloud-connector-in-browser [OPTIONS]
    options:
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    - names:
      - "--browser"
      argument: BROWSER
      description: "\U0001F30E browser name\n\nDefault browser from your system if
        not set"
  - name: display-leader-name
    description: "\U0001F451 Display Connect Worker leader name using JMX MBean leader-name
      from kafka.connect:type=connect-worker-rebalance-metrics\n\nThis is useful when
      you have multiple connect workers and want to know which one is the leader.\n\nFor
      onprem connectors, this is basically a shortcut for \"playground container exec
      -c connect -- bash -c 'export JMX_PORT=9404; jmxterm -l localhost:9404 -n -v
      silent -u admin -p admin123 -e \\\"get -b kafka.connect:type=connect-worker-rebalance-metrics
      name=leader-name\\\"'\", --connector flag is not relevant\n\nFor Fully Managed
      connectors, this is not available as JMX is not accessible."
    usage: playground connector display-leader-name
    options: []
  - name: translate
    description: "\U0001F4B1 Translate Self Managed Connector Plugin Configurations
      to Fully Managed Connector Plugin Configuration\n\nTakes the configuration of
      the self managed connector that is running\nand asks Confluent Cloud what the
      fully managed equivalent looks like.\nProperties are renamed, some disappear,
      some have no equivalent at all,\nand this tells you which before you promise
      a customer a migration.\n\nOnly translates the configuration. To actually move
      the connector along\nwith its offsets, use 'playground connector connect-migration-utility'.\n\nSee
      https://docs.confluent.io/cloud/current/api.html#tag/Managed-Connector-Plugins-(connectv1)/operation/translateConnectv1ConnectorPlugin\n\nThe
      connector example should be ran with --environment flag set to <ccloud>"
    usage: playground connector translate [OPTIONS]
    options:
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector-plugin"
      argument: CONNECTOR-PLUGIN
      description: "\U0001F50C Connector plugin name\n\n\U0001F393 Tip: use <tab>
        completion to trigger fzf completion\n\nRequired: ✓ Yes"
  - name: connect-migration-utility
    description: "\U0001F9E9 Run Kafka Connector Migration Utility (see https://github.com/confluentinc/connect-migration-utility/)
      on running connect cluster\n\nTakes a self managed connector running in the
      connect container and\nrecreates it as a fully managed connector in Confluent
      Cloud, keeping\nits offsets so consumers do not replay or skip data. Two steps:\n\n
      \ discovery   read the local connectors and export their configurations\n  migrate
      \    create the equivalent connectors on Confluent Cloud\n\nRun discovery first,
      migrate second. Use it to rehearse a customer's\nmigration and see what their
      configuration turns into.\n\nThe connector example should be ran with --environment
      flag set to ccloud.\n\nSee a full example at https://github.com/vdesabou/kafka-docker-playground/blob/master/ccloud/connect-migration-utility/README.md"
    usage: playground connector connect-migration-utility COMMAND
    options: []
    subcommands:
    - name: discovery
      description: "\U0001F468‍\U0001F52C Discover connectors in the local connect
        cluster and export their configurations to files\n  \n  see https://github.com/confluentinc/connect-migration-utility/tree/master?tab=readme-ov-file#step-1-specify-the-connector-configuration"
      usage: playground connector connect-migration-utility discovery [OPTIONS]
      options:
      - names:
        - "--verbose"
        - "-v"
        argument: ''
        description: "\U0001F41E Show command being ran."
    - name: migrate
      description: "\U0001FA84 Migrate discovered connectors to fully managed connectors\n\n
        \ see https://github.com/confluentinc/connect-migration-utility/tree/master?tab=readme-ov-file#step-2-migrate-the-connector\n
        \ ⚠️ <discovery> command should be run first"
      usage: playground connector connect-migration-utility migrate [OPTIONS]
      options:
      - names:
        - "--migration-mode"
        argument: MIGRATION-MODE
        description: |-
          - create: Create connector without any offset consideration
          - stop_create_latest_offset: Create a connector with no data loss/duplication (the python script stops the self-managed connector and fetches the latest offset and creates a fully-managed connector on Confluent Cloud using the fetched offset). See https://github.com/confluentinc/connect-migration-utility/tree/master?tab=readme-ov-file#create-a-connector-with-no-data-lossduplication.
          - create_latest_offset: Create a connector with no downtime (the python script fetches the latest offset without stopping the connector and creates a fully-managed connector on Confluent Cloud using the fetched offset. This option may cause data duplication as the self-managed connector is still running). See https://github.com/confluentinc/connect-migration-utility/tree/master?tab=readme-ov-file#create-a-connector-with-no-downtime.

          Default value: create
          Allowed values: stop_create_latest_offset, create, create_latest_offset
      - names:
        - "--sensitive-property"
        argument: SENSITIVE-PROPERTY
        description: "\U0001F510 Pass sensitive config properties when migrating connector\n\n\U0001F393
          Tip: you can pass multiple properties by specifying --sensitive-property
          multiple times\n\nExample: --sensitive-property \"aws.access.key.id=xxx\"
          --sensitive-property \"aws.secret.access.key=xxx\"\n\nRepeatable: ✓ Yes"
  - name: create-or-update
    description: "\U0001F9D1‍\U0001F3A8  Create or update connector\n\nThe command
      every example uses to deploy its connector. The json config\nis read from stdin,
      usually as a heredoc, so it stays readable in the\nscript. If the connector
      already exists it is updated in place, which\nmakes the command safe to re-run
      while you iterate on a configuration.\n\nThe command then displays the connector
      status. Add --wait to wait for\nthe connector and all its tasks to be RUNNING
      and fail with the error\nif they are not, so a broken config stops the example
      immediately\ninstead of failing silently later.\n\n\U0001F393 Tip: add --validate
      to have the config checked by the plugin before\nit is deployed, which reports
      every invalid property at once."
    usage: playground connector create-or-update [JSON] [OPTIONS]
    options:
    - names:
      - "--verbose"
      - "-v"
      argument: ''
      description: "\U0001F41E Show command being ran."
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\nRequired: ✓ Yes"
    - names:
      - "--level"
      - "-l"
      argument: LEVEL
      description: |-
        ❕Log level

        ⚠️ Not available for ccloud connectors

        Allowed values: INFO, WARN, DEBUG, TRACE
    - names:
      - "--package"
      - "-p"
      argument: PACKAGE
      description: Package name
    - names:
      - "--wait-for-zero-lag"
      argument: ''
      description: "\U0001F634 Wait until lag becomes 0"
    - names:
      - "--wait"
      argument: ''
      description: |-
        ⏳ Wait until the connector and all its tasks are RUNNING (or in --initial-state), and fail otherwise

        Same as running 'playground connector wait' right after the command. It fails right away if the connector or one of its tasks is FAILED.

        With fully managed connectors, it waits for the connector to be provisioned and restarts it if it fails while being provisioned (same as wait_for_ccloud_connector_up in example scripts).
    - names:
      - "--max-wait"
      argument: MAX_WAIT
      description: "⏳ Max time in seconds to wait with --wait (default is 120, or
        600 for fully managed connectors)"
    - names:
      - "--validate"
      argument: ''
      description: "✅ Validate config using PUT /connector-plugins/(string:name)/config/validate
        (https://docs.confluent.io/platform/current/connect/references/restapi.html#put--connector-plugins-(string-name)-config-validate)"
    - names:
      - "--skip-automatic-connector-config"
      argument: ''
      description: "\U0001F916 If example is run (playground run) with --environment
        flag, automatic configuration to adapt to the environment is added. \n\nThis
        flag allows to skip this automatic configuration (only useful to reproduce
        issues)"
    - names:
      - "--offsets"
      argument: OFFSETS
      description: "\U0001F4CD Create connector with offsets (https://docs.confluent.io/cloud/current/connectors/offsets.html#create-connectors-with-offsets)\n\n⚠️
        Only available for ccloud connectors, the connector should not really exists"
    - names:
      - "--initial-state"
      argument: INITIAL-STATE
      description: "\U0001FAB5 Create connector with specific status (https://cwiki.apache.org/confluence/display/KAFKA/KIP-980%3A+Allow+creating+connectors+in+a+stopped+state)\n\nOnly
        available if CP > 7.7\n\n⚠️ not available for ccloud connectors\n\nAllowed
        values: RUNNING, PAUSED, STOPPED"
    - names:
      - "--terraform"
      argument: ''
      description: "\U0001F3D7️ Deploy connector using Terraform instead of REST API\n\nDynamically
        converts JSON connector config to Terraform HCL and deploys using terraform
        apply\n\n⚠️ Only available for Confluent Cloud connectors"
  - name: update
    description: "\U0001F6E0️ Update connector configuration by opening current connector
      config in text editor set with playground config editor <editor> (default is
      code). Once file is saved, the new configuration is updated.\n\nThe quickest
      loop to try a configuration change: edit, save, close, and\nthe connector is
      updated. Nothing is applied if you close the file\nwithout saving."
    usage: playground connector update [OPTIONS]
    options:
    - names:
      - "--connector"
      - "-c"
      argument: CONNECTOR
      description: "\U0001F517 Connector name\n\n\U0001F393 Tip: If not specified,
        the command will apply to all connectors"
    aliases:
    - edit
    - alter
- name: ec2
  description: "✨ Create and manage AWS EC2 instances (using Cloud Formation) to run
    kafka-docker-playground\n\n\U0001FA84 Open EC2 instances directly in Visual Studio
    code using Remote Development (over SSH)\n\nRun the playground on a remote machine
    instead of your laptop, which is\nwhat you want for an example that needs far
    more CPU or memory than you\nhave, or one that must run for hours.\n\n  create
    \             provision the instance with Cloud Formation\n  open                open
    it in VS Code over SSH, as if it were local\n  push-secrets        send your credentials
    to it, over ssh\n  sync-repro-folder   keep reproduction-models in step, both
    directions\n  list / status / start / stop / delete\n\n\U0001F4B0 The instance
    is billed while it runs. Use 'playground ec2 stop' when\n   you pause, and 'playground
    ec2 delete' when you are done;\n   'playground status' reminds you when one is
    still up.\n\n\U0001F510 A pem file is created at the root of the repository when
    the instance\n   is created. Back it up, it is the only way in, and only your
    current\n   ip address is allowed to connect."
  usage: playground ec2 COMMAND
  options: []
  subcommands:
  - name: create
    description: "\U0001F477 Create kafka-docker-playground EC2 instance using AWS
      Cloud Formation\n\nOne command does the whole thing: a Cloud Formation stack,
      an instance\nwith docker and the playground repository already installed, a
      key pair,\na security group opened to your ip only. Your credentials are pushed
      to\nit over ssh, then VS Code opens on it.\n\nCreation takes a few minutes,
      and Cloud Formation keeps installing in the\nbackground for about ten more.
      Follow output.log in the root folder of\nthe instance to see where it is.\n\n\U0001F510
      AWS EC2 pem file for the ec2 instance will be created and stored in the\nroot
      folder of the repository (make sure to do a backup, it is the only\nway in).\n\n\U0001F30D
      Region being used will be the one set in your environment\n(aws configure get
      region) either by the AWS_REGION environment variable\nor ~/.aws/config.\n\n\U0001F4B0
      The instance is billed from now on. Stop it when you pause and delete\nit when
      you are done.\n\n\U0001F41A Use zsh on the instance to have everything working
      out of the box."
    usage: playground ec2 create [OPTIONS]
    options:
    - names:
      - "--instance-type"
      argument: INSTANCE-TYPE
      description: "\U0001F9D1‍\U0001F4BB instance type. default is t3.2xlarge\n\nDefault
        value: t3.2xlarge\nAllowed values: c1.medium, c1.xlarge, c3.2xlarge, c3.4xlarge,
        c3.8xlarge, c3.large, c3.xlarge, c4.2xlarge, c4.4xlarge, c4.large, c4.xlarge,
        m1.large, m1.medium, m1.small, m1.xlarge, m2.2xlarge, m2.4xlarge, m2.xlarge,
        m3.2xlarge, m3.large, m3.medium, m3.xlarge, m4.10xlarge, m4.2xlarge, m4.4xlarge,
        m4.large, m4.xlarge, t1.micro, t2.large, t2.medium, t2.micro, t2.nano, t2.small,
        t3.2xlarge"
    - names:
      - "--size"
      argument: SIZE
      description: "\U0001F4BE instance size in Gb. default is 1000 Gb\n\nDefault
        value: 1000"
    - names:
      - "--suffix"
      argument: SUFFIX
      description: "\U0001F4EE suffix to add to instance name, giving pg-<username>-<suffix>\n\nif
        not set, the name is pg-<username>-<6 random characters>\n\n\U0001F393 Tip:
        set it to the case number you are working on, so you can tell\nyour instances
        apart in 'playground ec2 list'."
  - name: delete
    description: |-
      ❌ Delete an EC2 instance created with Cloud Formation

      Deletes the Cloud Formation stack, which takes the instance, its volume
      and its security group with it, then removes the key pair on AWS and the
      local pem file. This is what stops the billing for good, unlike stop
      which only pauses it.

      ⚠️ Everything on the instance is lost, including any reproduction model
      you have not synced back with 'playground ec2 sync-repro-folder'.

      Without --instance it applies to all your instances, and asks you to
      confirm first.
    usage: playground ec2 delete [OPTIONS]
    options:
    - names:
      - "--instance"
      - "-i"
      argument: INSTANCE
      description: "\U0001F300 ec2 instance cloudformation (need to use completion
        to get all required details)\n\n\U0001F393 Tip: If not specified, the command
        will apply to all ec2 instances"
  - name: open
    description: "\U0001F468‍\U0001F4BB Open an EC2 instance using Visual Studio code\n\nOpens
      a VS Code window on the instance over ssh, using Remote\nDevelopment. The editor,
      the terminal and the playground CLI all run\nthere, so it feels like working
      locally while the containers use the\nremote machine's CPU and memory.\n\nThe
      security group is refreshed with your current ip on the way, so this\nis also
      the command to run after your ip changed and ssh stopped working.\n\n\U0001F510
      Only your current ip address will be allowed to connect."
    usage: playground ec2 open [OPTIONS]
    options:
    - names:
      - "--instance"
      - "-i"
      argument: INSTANCE
      description: "\U0001F5A5️ ec2 instance (need to use completion to get all required
        details)\n\n\U0001F393 Tip: If not specified, the command will apply to all
        ec2 instances"
    - names:
      - "--enable-sync-repro-folder"
      argument: ''
      description: "\U0001F449 Enable sync reproduction-models folder between local
        and ec2 instance"
  - name: list
    description: "\U0001F518 List all EC2 instance\n\nYour playground instances and
      their state. Anything not stopped is\ncosting money."
    usage: playground ec2 list
    options: []
  - name: stop
    description: "\U0001F534 Stop an EC2 instance\n\nShuts the instance down while
      keeping its disk, so you stop paying for\ncompute and find your work again on
      'playground ec2 start'."
    usage: playground ec2 stop [OPTIONS]
    options:
    - names:
      - "--instance"
      - "-i"
      argument: INSTANCE
      description: "\U0001F5A5️ ec2 instance (need to use completion to get all required
        details)\n\n\U0001F393 Tip: If not specified, the command will apply to all
        ec2 instances"
  - name: start
    description: "\U0001F7E2 Start an EC2 instance\n\nBoots an instance stopped earlier.
      Its public address changes, so use\n'playground ec2 open' rather than a bookmarked
      ssh command."
    usage: playground ec2 start [OPTIONS]
    options:
    - names:
      - "--instance"
      - "-i"
      argument: INSTANCE
      description: "\U0001F5A5️ ec2 instance (need to use completion to get all required
        details)\n\n\U0001F393 Tip: If not specified, the command will apply to all
        ec2 instances"
  - name: sync-repro-folder
    description: |-
      ↔️ Synchronize reproduction-models folder between local and ec2 instance

      The reproduction models you write are the only thing on the instance
      worth keeping, and deleting the instance destroys them. These two
      commands copy that folder in one direction or the other with rsync.

        local-to-ec2   push what you wrote locally, before running it there
        ec2-to-local   pull back what you wrote there, before deleting it

      'playground ec2 create' runs local-to-ec2 for you, and
      'playground ec2 open --enable-sync-repro-folder' does it again each
      time you open the instance.

      ⚠️ Get into the habit of running ec2-to-local before
      'playground ec2 delete', nothing else brings those files back.

      Note: rsync needs to be installed
    usage: playground ec2 sync-repro-folder COMMAND
    options: []
    subcommands:
    - name: local-to-ec2
      description: "\U0001F449 Sync local reproduction-models folder to ec2 instance\n\nCopies
        your local reproduction-models to the instance, so you can run\nthere a model
        you started writing on your laptop."
      usage: playground ec2 sync-repro-folder local-to-ec2 [OPTIONS]
      options:
      - names:
        - "--instance"
        - "-i"
        argument: INSTANCE
        description: "\U0001F5A5️ ec2 instance (need to use completion to get all
          required details)\n\n\U0001F393 Tip: If not specified, the command will
          apply to all ec2 instances"
    - name: ec2-to-local
      description: "\U0001F448 Sync ec2 instance reproduction-models folder to local\n\nBrings
        back the models you wrote on the instance. Run it before\n'playground ec2
        delete', otherwise they go with the instance."
      usage: playground ec2 sync-repro-folder ec2-to-local [OPTIONS]
      options:
      - names:
        - "--instance"
        - "-i"
        argument: INSTANCE
        description: "\U0001F5A5️ ec2 instance (need to use completion to get all
          required details)\n\n\U0001F393 Tip: If not specified, the command will
          apply to all ec2 instances"
  - name: push-secrets
    description: "\U0001F510 Send the secrets store to an ec2 instance\n\nWrites ~/.playground-secrets.properties
      (mode 0600) on the instance, which\nthe playground .zshrc sources on login.
      This replaces the encrypted\nsecrets.tar.gpg committed in the repository.\n\nThe
      file is piped over ssh, so no clear text copy is ever written locally\nand the
      values never appear in 'ps'.\n\nThe credentials that cannot be stored as name=value
      pairs are sent too,\nwhen they exist at the root of the repository:\n\n  aws_credentials_with_assuming_iam_role
      \      -> ~/.aws/credentials-with-assuming-iam-role\n  aws_credentials_aws_account_with_assume_role
      -> ~/.aws/credentials_aws_account_with_assume_role\n  github_ssh_key_file                          ->
      ~/.ssh/id_rsa"
    usage: playground ec2 push-secrets [OPTIONS]
    options:
    - names:
      - "--instance"
      - "-i"
      argument: INSTANCE
      description: "\U0001F5A5️ ec2 instance (need to use completion to get all required
        details)\n\n\U0001F393 Tip: If not specified, the command will apply to all
        ec2 instances"
    - names:
      - "--profile"
      argument: PROFILE
      description: "\U0001F5C2️ Secrets profile to use (default is the active one)"
    - names:
      - "--dry-run"
      argument: ''
      description: "\U0001F50D List what would be sent, change nothing"
