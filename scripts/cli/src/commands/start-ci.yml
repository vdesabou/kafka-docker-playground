name: start-ci
private: true
environment_variables:
- name: GITHUB_TOKEN 
  help: GITHUB_TOKEN
  required: true
dependencies:
  gh: visit https://cli.github.com/manual/installation to install
flags:
  - long: --test-list
    required: false
    arg: test-list
  - long: --all-failing
    required: false
  - long: --cfk
    required: false
  - long: --podman
    required: false
examples:
  - playground start-ci --cfk --all-failing
  - playground start-ci --cfk --test-list "connect/connect-cdc-xstream-oracle19-source"
  - playground start-ci --podman --test-list "connect/connect-gcp-gcs-sink"
