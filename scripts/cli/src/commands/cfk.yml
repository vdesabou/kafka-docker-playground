name: cfk
expose: always
group: Run
help: |-
  ☸️ Confluent for Kubernetes commands (cfk and cfk-rbac environments)

  The day-2 operations of a cluster deployed by CFK: change a custom
  resource and watch the operator roll it, upgrade Confluent Platform,
  upgrade the operator.

    patch      change a custom resource, wait for CFK to roll it
    roll       restart the pods of a custom resource, the supported way
    upgrade    move every custom resource to another Confluent Platform version
    operator   upgrade the CFK operator (helm chart, CRDs, init containers)
    kraft-migration   ZooKeeper to KRaft with a KRaftMigrationJob (start, status, finalize, release-lock)

  Each change waits for the operator: the statefulset changed or not, every
  pod restarted on the new revision (printed as they roll), the custom
  resource back to RUNNING, then the events of the custom resource and its
  pods since the change.

  🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-cfk
commands:

- name: patch
  group: Run
  filters:
  - cfk_environment
  help: |-
    🩹 Change a custom resource and wait for CFK to roll it

    kubectl patch <kind>/<name> in the confluent namespace (a JSON merge
    patch by default), then waits for the operator: the statefulset of the
    custom resource changed or not, every pod restarted on the new revision
    and Ready, the custom resource back to phase RUNNING. Prints the events
    of the custom resource and its pods since the change.

    A configOverrides list replaces the whole list with a merge patch: give
    every property, or use --type json with an "add" operation.
  args:
  - name: resource
    required: true
    help: 🎯 kind/name of the custom resource, for example kafka/kafka, connect/connect, kraftcontroller/kraftcontroller
  - name: patch
    required: true
    help: 🩹 The patch, JSON or YAML
  flags:
  - long: --type
    arg: type
    default: "merge"
    allowed: ["merge", "json", "strategic"]
    help: 🧩 Patch type (kubectl patch --type)
  - long: --timeout
    arg: seconds
    default: "900"
    validate: integer
    help: ⏱️ How long to wait for the roll
  - long: --no-wait
    help: 🏃 Only patch, don't wait for the roll
  examples:
  - |-
    playground cfk patch kafka/kafka '{"spec": {"configOverrides": {"server": ["log.retention.hours=72"]}}}'
  - |-
    playground cfk patch connect/connect '{"spec": {"replicas": 2}}'
  - |-
    playground cfk patch kafka/kafka '[{"op": "add", "path": "/spec/configOverrides/server/-", "value": "num.io.threads=16"}]' --type json

- name: roll
  group: Run
  filters:
  - cfk_environment
  help: |-
    🔁 Restart the pods of a custom resource, the way CFK supports

    Kafka and KRaft: a new value of the annotation kafkacluster-manual-roll in
    spec.podTemplate, the only supported way to restart them: CFK rolls one
    pod at a time, with its health checks (no under-replicated partitions).
    The other components: kubectl rollout restart of their statefulset.
    Waits for the roll like playground cfk patch.

    When to use: a change in a Secret (credentials, license), or a change of
    the custom resource the pods did not get.
  args:
  - name: resource
    required: true
    help: 🎯 kind/name of the custom resource, for example kafka/kafka, connect/connect
  flags:
  - long: --timeout
    arg: seconds
    default: "900"
    validate: integer
    help: ⏱️ How long to wait for the roll
  examples:
  - playground cfk roll kafka/kafka
  - playground cfk roll connect/connect

- name: upgrade
  group: Run
  filters:
  - cfk_environment
  help: |-
    ⬆️ Move every custom resource to another Confluent Platform version

    Changes the tag of spec.image.application of each custom resource,
    controllers first, then kafka, connect, schema registry, ksqlDB, REST
    proxy and control center, and waits for CFK to roll each one before the
    next (playground cfk patch). Then prints the image of each pod and, for
    KRaft, the finalized metadata.version: the feature level stays at the old
    version until it is upgraded (kafka-features upgrade).
  flags:
  - long: --to
    arg: version
    required: true
    help: 🎯 Confluent Platform version, for example 8.4.1
  - long: --timeout
    arg: seconds
    default: "1200"
    validate: integer
    help: ⏱️ How long to wait for the roll of each custom resource
  examples:
  - playground cfk upgrade --to 8.4.1

- name: operator
  group: Run
  help: ☸️ The CFK operator
  commands:
  - name: upgrade
    group: Run
    filters:
    - cfk_environment
    help: |-
      ⬆️ Upgrade the CFK operator, with the CFK upgrade procedure

      The steps of docs.confluent.io/operator/current/co-upgrade-cfk.html:
      reconciliation blocked on every custom resource
      (platform.confluent.io/block-reconcile=true), the CRDs of the new chart
      applied (helm never upgrades them; CFK 3.4.0 and later manage their own
      CRDs), helm upgrade of confluent-operator, the init container image of
      every custom resource staged, then reconciliation enabled again one
      component at a time, controllers first: each component rolls once, with
      the new operator and the new init container together.

      --no-block-reconcile shows the classic mistake: the new operator
      reconciles every component as soon as it starts (controllers, brokers,
      connect... roll at the same time), then the new init container images
      roll everything a second time.
    flags:
    - long: --to
      arg: version
      required: true
      help: 🎯 CFK version, for example 3.4.0
    - long: --no-block-reconcile
      help: 💥 Don't block reconciliation during the upgrade (the classic mistake)
    - long: --skip-crds
      help: 📜 Don't apply the CRDs of the new chart (CFK before 3.4.0)
    - long: --keep-init-images
      help: 🧷 Don't change the init container image of the custom resources
    - long: --timeout
      arg: seconds
      default: "1200"
      validate: integer
      help: ⏱️ How long to wait for the roll of each custom resource
    examples:
    - playground cfk operator upgrade --to 3.4.0
    - playground cfk operator upgrade --to 3.3.1 --no-block-reconcile

- name: kraft-migration
  group: Run
  help: |-
    🚚 ZooKeeper to KRaft migration with a KRaftMigrationJob

    The steps of docs.confluent.io/operator/current/co-migrate-kraft.html,
    like the kubectl confluent cluster kraft-migration plugin, with every
    kubectl command printed:

      start          KRaftController on HOLD + KRaftMigrationJob, until DUAL-WRITE
      status         phase, sub-phase, the CRs, the locks, what to do next
      finalize       the finalize annotation (irreversible), wait for COMPLETE
      release-lock   release the locks on the CRs, remove use-log4j1

    🍪 Deep dive: https://kafka-docker-playground.io/#/day-2-operations
  commands:
  - name: start
    group: Run
    filters:
    - cfk_environment
    help: |-
      🚚 Start the migration and wait for DUAL-WRITE

      Creates the KRaftController CR with the images of the Kafka CR and the
      annotations kraft-migration-hold-krc-creation (status HOLD, no pod yet)
      and use-log4j1 (CP 7.x with CFK 3), then the KRaftMigrationJob CR, and
      prints each phase and sub-phase as the operator goes through SETUP,
      MIGRATE and DUAL-WRITE, with the time spent in each. From then on the
      ZooKeeper, Kafka and KRaftController CRs are locked.
    flags:
    - long: --controllers
      arg: number
      default: "3"
      validate: integer
      help: 🗳️ Replicas of the KRaftController (an odd number)
    - long: --preflight
      help: 🔎 Enable the ZooKeeper metadata preflight check (annotation kraft-migration-enable-preflight)
    - long: --name
      arg: name
      default: "kraftmigrationjob"
      help: 🏷️ Name of the KRaftMigrationJob
    - long: --timeout
      arg: seconds
      default: "3600"
      validate: integer
      help: ⏱️ How long to wait for DUAL-WRITE
    examples:
    - playground cfk kraft-migration start
    - playground cfk kraft-migration start --controllers 1 --preflight

  - name: status
    group: Run
    filters:
    - cfk_environment
    help: 🔎 Phase, sub-phase, the CRs, the locks and what to do next
    flags:
    - long: --name
      arg: name
      default: "kraftmigrationjob"
      help: 🏷️ Name of the KRaftMigrationJob
    examples:
    - playground cfk kraft-migration status

  - name: finalize
    group: Run
    filters:
    - cfk_environment
    help: |-
      🏁 Finalize the migration (irreversible) and wait for COMPLETE

      Annotation kraft-migration-trigger-finalize-to-kraft=true on the
      KRaftMigrationJob in DUAL-WRITE: the brokers lose their ZooKeeper
      dependency, no rollback after it.
    flags:
    - long: --name
      arg: name
      default: "kraftmigrationjob"
      help: 🏷️ Name of the KRaftMigrationJob
    - long: --timeout
      arg: seconds
      default: "3600"
      validate: integer
      help: ⏱️ How long to wait for COMPLETE
    examples:
    - playground cfk kraft-migration finalize

  - name: release-lock
    group: Run
    filters:
    - cfk_environment
    help: |-
      🔓 Release the locks of the migration on the CRs

      Annotation kraft-migration-release-cr-lock=true on the KRaftMigrationJob,
      then waits for the kraft-migration-cr-lock annotations to leave the
      Kafka and KRaftController CRs: until then every change of these CRs is
      rejected (GitOps reconciliations fail). --remove-log4j1 then removes
      the use-log4j1 annotation of the KRaftController (one roll).
    flags:
    - long: --name
      arg: name
      default: "kraftmigrationjob"
      help: 🏷️ Name of the KRaftMigrationJob
    - long: --remove-log4j1
      help: 🪵 Also remove the use-log4j1 annotation of the KRaftController (it rolls)
    examples:
    - playground cfk kraft-migration release-lock --remove-log4j1

