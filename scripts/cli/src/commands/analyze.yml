name: analyze
expose: always
group: Analyze
help: |-
  🔎 Analyze commands

  Turn what you collected into findings: each command reads a file (a
  dump, a log, a bundle, a report, yours or one a customer sent) or takes
  it from a running container, and prints a digest with what is wrong and
  what to do, plus an HTML report to share (opened in your browser). They
  all work offline, and --sample runs them on the samples shipped with the
  playground, to see what they report.

    thread-dump             deadlocks, lock contention, stuck threads
    gc-logs                 GC pauses, failures, live set, leak trend
    heap-dump               Eclipse MAT leak suspects, retained sizes
    logs                    ERROR/FATAL digest of logs, folders, zips, CFK support bundles
    oracle-xstream-report   Oracle XStream diagnostics (orclcdc_diag)
    flight-recorder         JFR: where the time of the connector tasks goes
    tcp-dump                network capture: resets, TLS alerts, Kafka errors
    jscissors               traced method calls: arguments, durations, exceptions

  To collect them: playground debug thread-dump, heap-dump, flight-recorder, tcp-dump, jscissors,
  playground connector oracle-cdc-xstream generate-report,
  playground debug cfk generate-bundle.
commands:
- name: thread-dump
  dependencies:
    python3: visit https://www.python.org/downloads/ to install
  help: |-
    🧵 Analyze java thread dumps: deadlocks, lock contention, stuck and CPU-hungry threads

    📊 Reads jstack / jcmd Thread.print / kill -3 output (JDK 8 to 25), several dumps per file and container logs included, and reports: thread states and pools, deadlocks, locks with their owner and waiters, the most common stacks, and with several dumps of the same JVM: threads stuck on the same frames, the CPU used by each thread between dumps, and growing thread pools. Kafka / Connect aware (task threads, herder, broker request handlers).

    🐳 With --container (default: connect), it takes --count dumps --interval seconds apart with kill -3: the JVM prints them to the container logs, no JDK is needed in the image.

    🌐 Also writes a self-contained HTML report (inline SVG charts, works offline) in --output-dir, opened in the browser in an interactive terminal

    🧪 With --sample, it analyzes the samples shipped in tools/thread-analyzer/samples: a quick way to see what it reports.

    🔖 Exit code is 0 when the analysis completed, 2 when no thread dump was found

    🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-jvm-diagnostics
    🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%A7%B5-a-connector-looks-stuck-analyze-thread-dumps
  flags:
<%= File.read('src/flags/analyze-thread-dump-flags.yml').gsub(/^(?=.)/, '    ') %>
  examples:
  - playground analyze thread-dump --sample deadlock_jdk21
  - playground analyze thread-dump
  - playground analyze thread-dump -c broker --count 5 --interval 2
  - playground analyze thread-dump --file thread-dump-connect-2026-10-13.log
  - playground analyze thread-dump -f dump1.txt -f dump2.txt -f dump3.txt
  - playground analyze thread-dump -f ./customer-logs/connect-stdout.log
  - playground analyze thread-dump -c connect --json

- name: heap-dump
  help: |-
    🔬 Analyze a heap dump with Eclipse Memory Analyzer (MAT), run headless in Docker

    🕵️ Prints a text digest: heap overview, MAT leak suspects (accumulation point and who holds it) and the top retained sizes by class (dominator tree), and saves the MAT HTML reports (Leak_Suspects, System_Overview, Top_Components) in --output-dir

    📈 Use --compare with a second dump of the same JVM, taken later under the same load, to see which classes grow

    🌐 Also writes a self-contained HTML report, <dump>-heap-report.html in --output-dir, opened in the browser in an interactive terminal: verdict, leak suspects in plain words, Kafka-aware hints (producer buffers, consumer fetch buffers, records held by the tasks, storage sink writers, CDC queues, schema caches), retained heap by class, growth between the two dumps, and links to the MAT reports

    🐳 MAT needs roughly as much memory as the used heap of the dump (1 to 1.5x the .hprof size): give Docker enough memory or use --max-memory

    🧪 With --sample, it analyzes the samples shipped in tools/heap-analyzer/samples: a quick way to see what it reports.

    🔖 Exit code is 0 when the analysis completed, non-zero when MAT could not parse the dump (truncated file, out of memory): never a "healthy" verdict on a failed parse

    🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-jvm-diagnostics
  flags:
<%= File.read('src/flags/analyze-heap-dump-flags.yml').gsub(/^(?=.)/, '    ') %>
  examples:
  - playground analyze heap-dump --sample leak
  - playground analyze heap-dump --sample leak_growth
  - playground analyze heap-dump --file heap-dump-connect-2026-04-08.hprof
  - playground analyze heap-dump -f heap-dump-broker.hprof --output-dir ./analysis
  - playground analyze heap-dump -f heap-dump-connect.hprof --report-type leaks
  - playground analyze heap-dump -f heap-1.hprof --compare heap-2.hprof
  - playground analyze heap-dump -f big-heap-dump.hprof --max-memory 12g
  - playground analyze heap-dump --sample leak_growth --json

- name: logs
  dependencies:
    python3: visit https://www.python.org/downloads/ to install
  help: |-
    🔥 Show a digest of ERROR/FATAL records found in log files, folders or zip bundles

    The offline counterpart of 'playground container logs --errors', for
    logs that do not come from a running container: a customer support
    bundle, a CI artifact, a log file you were sent. 🐳 --from-containers
    gives the same full report for the running example: the logs of its
    containers are saved in a folder, then analyzed.

    Repeated records are de-duplicated with an occurrence count, stack
    traces are collapsed to the exception chain ("Caused by:") plus a few
    frames of the deepest cause. Only records with an explicit level are
    reported (" ERROR ", "[ERROR]", level=error, "level":"error"), plus
    uncaught java exceptions: records logged at INFO/DEBUG/TRACE, and
    level-less lines that merely contain "error" or "failed", never are.
    🙈 Known harmless records (telemetry not set up, Self-Balancing on a
    KRaft controller node, Jersey startup notices) and the warnings of the
    JDK launcher on stderr ("WARNING: sun.misc.Unsafe::…") are left out
    (--include-harmless keeps the first ones); 🌅 the connection failures of
    a component that starts before the broker, and stop once it is up, are
    a LOW known cause of their own, not the HIGH 🔌 Connection failure.
    🌐 Host names not resolved are a known cause of their own: the window,
    the hosts, the Java lookups that failed in the resolver vs the ones
    served from the negative DNS cache of the JVM, and the clients that
    could not be created ("No resolvable bootstrap urls").
    ✅ Every connector of the logs gets its card, the ones without an
    error too, and ☕ the JDK is shown when the logs give it.

    🧰 The logs of every Kafka client of Confluent are read, not only Java:
    the librdkafka lines of the C/C++, Python, Go, .NET and JavaScript
    clients ("%3|1793896102.923|FAIL|rdkafka#producer-1| …", by their
    syslog level, timestamp included, also the Node.js objects of the
    JavaScript client logger), the .NET console logger ("fail:", "crit:")
    and inner exceptions (" ---> "), Python tracebacks (chained ones as one
    record, deepest cause last) and KafkaError{code=…}, Go and Rust panics,
    uncaught Node.js errors (KafkaJS, "[cause]:"), the tracing lines of the
    Rust client. The known causes include the client ones (records not
    delivered in time, producer buffer full, max.poll.interval.ms exceeded,
    wrong security.protocol, idle connection closed by the broker).

    📂 Folders are scanned recursively. .zip, .tar, .tar.gz, .tgz,
    .tar.bz2, .tbz2, .tar.xz, .txz and .7z (bsdtar or 7-Zip) files are
    extracted in a temporary folder, .gz files are decompressed on the
    fly, binary files are skipped, and so are the copies of a file or of a
    CFK support bundle already analyzed (an archive next to its extracted
    folder). A JSON export of log events (.json, .jsonl, .ndjson, also
    gzipped: AWS CloudWatch Logs Insights @timestamp/@message, CloudWatch
    events, Elasticsearch / OpenSearch hits, structured JSON logs with
    level/logger_name/message/stack_trace) and a CSV export of log events
    (.csv, also gzipped: Kibana / OpenSearch Dashboards Discover, Splunk,
    Datadog, Grafana: one event per row, a cell holding the JSON log line of
    the container is parsed) are converted back to log lines, oldest first,
    and analyzed as a log file. Logs pasted in a Word document (.docx, .odt)
    or exported to a spreadsheet (.xlsx, .xlsm, .ods: the columns of the
    export, Excel dates converted) are converted the same way. 📷 With
    --ocr, the screenshots (and the pictures of a document) are read by OCR
    (the Vision framework of macOS, else tesseract, else tesseract in a
    container) and analyzed as "<picture> (📷 OCR)", approximate lines;
    without it, and for the PDF and the old .doc / .xls / .pptx files,
    🧰 Other files of the input lists them with what to do. So are JSON lines whatever the extension (a
    fluentd / Kubernetes / logstash dump saved as .log: streamed, a dump of
    several GB is converted in seconds and the digest reads its messages,
    not the metadata). ⚠️ An input not fully read (a truncated or
    corrupt .gz, an archive that does not fully extract) is listed at the
    end, in the HTML report and in --json (.summary.incomplete_inputs):
    never a silent ✅, and exit code 1 when nothing could be read at all.
    Bytes that are not UTF-8 (a Latin-1 character) are read as they are.
    🌍 It works offline, without Docker: bash 4.2+, python3 3.8+, jq, awk
    (🏎️ mawk when installed: on macOS, brew install mawk reads the logs
    2.5x faster than the awk of the system, same report),
    gzip and tar are enough (a CFK bundle gets its ☸️ sections when PyYAML
    is installed, else its pod logs are still read). Without the
    playground: a sparse clone of scripts/, tools/ and cfk-analysis/, or
    with nothing installed but Docker, the ghcr.io/vdesabou/kdp-analyze-logs
    image: docker run --rm --network none -v "\$PWD":/data -e
    KDP_HOST_DIR="\$PWD" ghcr.io/vdesabou/kdp-analyze-logs -f bundle.zip
    (see the deep dive, "Without the playground").
    🧰 The files of the input that another analyzer reads better (GC logs,
    thread dumps, heap dumps, flight recordings, network captures, Oracle
    XStream diagnostics reports, found by their content or name) are listed
    with the playground analyze command to run on each, in the summary, the
    HTML report and --json (.other_files); the ones extracted from an
    archive are kept next to the report (<input>-other-files/).
    🧵 The thread dumps of the input are analyzed right away by the thread
    dump analyzer (deadlocks, lock contention, stuck threads, CPU per thread
    between dumps, growing pools): 🧵 🔬 JVM dumps of the input, right after
    the verdict, each dump on the incident timeline, the full thread report
    next to the report (<input>-thread-dumps.html, .thread_dumps of --json).
    🔬 A heap dump is not (Eclipse MAT, Docker, memory): its playground
    analyze heap-dump command is at the top of the report and in the verdict
    (.heap_dumps). 🗺️ The outputs of kafka-topics --describe and kafka-log-dirs
    --describe of the input give the Cluster layout: replicas, leaders and
    disk per broker, leader imbalance and skew, offline / under-replicated /
    under min ISR partitions, replication factor 1, log dirs offline, disk
    skew (.cluster_layout); the observers of a Multi-Region Cluster are not
    replicas missing from the ISR. 🐢 The signals of a broker under pressure, read
    from INFO / WARN lines (ISR shrinks and expands per broker and partition,
    followers failing to fetch (ReplicaFetcher, not consumers), requests timed out, log cleaner failures,
    quota throttling, responses to clients already gone), are counted by
    broker with their storms, and their bursts are on the incident timeline.
    Only files with findings are
    shown. 🔭 When no file has findings, an overview says what the logs
    contain (period covered, records by level, top messages and loggers) and
    what to ask for next (a longer window, the logs of the component that
    fails, a new export of a log console). The HTML report also has
    the configuration: the configs logged at startup (KafkaConfig values:,
    DistributedConfig, connector and client configs…) and the .properties
    and connector JSON files of the input.

    ⏳ A large file (20 MB or more) shows a progress bar in the terminal
    (MB read, speed, ETA), and with 20 MB or more of input (an archive counts
    for its content, not its compressed size) the report opens
    in the browser right away as a progress page (step, a bar for the file
    being read and one for the whole input, elapsed time, speed, ETA of the file and of the whole input) that becomes the report when the analysis ends. The last line
    gives the size read and the time it took. 📤 Share in the report: the
    .zip of the report and its file pages (written next to it when they are
    under 200 MB), the summary to paste, an email. An archive (.tar, .tar.gz,
    .tgz…) shows a bar while it is extracted.

    🗂️ One report: the sections of each CFK support bundle of the input
    (pods, custom resources, events, versions, recent changes, issues by
    category) are in the log report, right after its verdict; the comparison
    of several bundles is linked from it. Several CFK bundles are analyzed in
    parallel, 4 at a time (PLAYGROUND_CFK_PARALLELISM to change it), their
    output printed in order.

    ☸️ A Confluent for Kubernetes (CFK) support bundle (kubectl confluent support-bundle or playground debug cfk generate-bundle: a folder with cluster-details.txt, or with cluster-resources/ and operator/; or a flat collection of kubectl outputs with a confluent-operator-*.log or the YAML of a platform.confluent.io custom resource at its top), alone or inside a folder or an archive, is detected and analyzed as a whole by the CFK analyzer (a container image built on first use): Warning events, pods (phase, waiting reasons, restarts, OOMKilled: from the pod YAML, or from the kubectl get pods table of a flat bundle, pods.txt), every platform.confluent.io custom resource (phase/state, ready replicas, False conditions, failed connector tasks), the environment checked against the CFK support matrix (Kubernetes, CFK operator, CP and init container versions), the recent changes (who edited which CR and when, StatefulSet rollouts, pod restarts), the configuration (kafka.properties, zookeeper.properties, schemaregistry.properties, connect.properties and controlcenter.properties rendered by CFK, configOverrides, config logged at startup, connector configs from the Connector CRs and the config dumps of the logs), a JVM default truststore set without its password, and the ERROR/FATAL records of its logs, sorted into ~30 categories (pod failures, TLS, auth, MDS/RBAC, license, KRaft, replication, storage, scheduling…) with remediation steps. 📕 The log messages and events of known CFK problems (CFK triage table of Confluent support: roll blocked by the pre-roll checks, expired certificate, INCONSISTENT_CLUSTER_ID, ZooKeeper to KRaft migration, authorizer timeout, license secret, a ConfluentRolebinding retried in a loop until the operator OOMs…) are listed first, with what they mean and the KB / docs to read; PLAYGROUND_CFK_RUNBOOKS_FILE adds the internal runbook links of Confluent support (🔒 in the terminal, the HTML report and --json). 🔄 A CR whose image is not what its StatefulSet or pods run (operator did not apply it, roll not complete) is one finding, the exceeded quota events become one finding per ResourceQuota, each Warning event is counted once (event.txt and event.yaml) and a copy of the bundle inside the bundle is analyzed once. 🕰️ The time range of each log is listed, with a finding when a log starts long after its pod or after the last change of the CRs, and CRs that keep the "Reconcile is blocked" condition after the annotation was removed are one finding. 🔁 A CR that the operator fails to delete or apply in a loop (10 times a minute or more: invalid MDS scope of a Subject binding, forbidden change of role or principal) is one critical / high finding, with the rate, its error and the restarts and memory limit of the operator: the retries without back-off grow the operator memory until it is OOMKilled. 🕒 The changes of the CRs in the hour before the first critical / high issue are marked and listed in one finding. 🧩 A Connect whose spec.build.onDemand plugins cannot be installed (config-init-container failing, install error, slow init) and a Connector CR whose class is not installed are findings with next steps. 🔁 With several CFK bundles (-f a.tgz -f b.tgz), they are compared, sorted by collection time: same cluster or not, versions, changes of the CRs between them, issues fixed / new / still there, known CFK issues, with a verdict (HTML report, "comparison" in --json). 🚚 A ZooKeeper to KRaft migration gets its own finding: phase / sub-phase of the KRaftMigrationJob, how long it has been there (events, operator requeues), its last error and the next steps of that sub-phase (DUAL-WRITE waiting for the finalize annotation is low). Probe failures and back-offs of a pod that is Running and Ready in the bundle are low and marked transient. Each issue is attributed to a component and an instance (CR name), and to its connector: --component keeps some of them, the HTML report has Component / Instance / Connector filters. 🔒 --sanitize replaces secrets, IPs, hostnames, emails and LDAP DNs by placeholders (best effort: review before sharing). 🔥 One report: its pod and operator logs go through the regular log digest, and the log report (root causes, timeline, connector cards and plugin versions, restarts, known bugs fixed later, which pod ran which task, data to request, summary for a ticket) has the ☸️ sections of the bundle right after its verdict (with --json: the bundle JSON, with .log_analysis); the issues of its log records come from the same records, and the ☸️ changes of the cluster (pods terminated or restarted, custom resources edited, rollouts) join its incident timeline, so that 🔗 and 💥 link the errors of the pod logs to them. One output for the case: <input>-ticket.md has a ☸️ section per bundle (environment, issues by severity, known CFK issues with their public links, critical and high issues), the 📥 data to request of the bundle joins the one of the logs, and --compare <before bundle> compares both the bundles (versions, CR changes, issues fixed / new / still there) and their pod logs. The ⚙️ configuration of the log report also has what only the bundle has: the properties rendered by CFK (ConfigMap <cr>-shared-config), the configOverrides of each CR and the Connector CRs (--show-config <connector> prints the CR with the config logged, config lint checks it), and 🔀 the keys of a Connector CR whose value differs from the config the worker logged when it started the connector (the operator did not apply a change). --logs-only gives only the log report, of every file of the bundle. 🎯 --problem "<component, symptom, since when>" matches the bundle against what the customer reports: the issues that explain it first, a verdict (explained, not explained, not covered by the logs), the changes before the date. 📥 A Data to request section says what to ask the customer for next, with why and the command: from the gaps of the bundle (logs that start too late, previous logs of restarted containers, no events, no operator log), from its findings (OOMKilled, Pending pods, TLS, failed connectors) and from the symptoms of --problem.

    🔒 With --sanitize, passwords and other secrets (password=…, JAAS configs, tokens, keys, credentials in URLs), IPs, hostnames, emails and LDAP DNs are replaced by placeholders (<REDACTED>, <IP-1>, <HOST-1>…, the same in the digest, the report and the JSON). Off by default: use it before sharing the output outside Confluent, and review it anyway (best effort).

    🧭 After the digest of each file, a short summary: time range, occurrences by connector, known causes with what to do (📚 and a Confluent knowledge-base article for many of them, 🔒 the internal runbooks of Confluent support when the private reproduction-models repository is there), root causes no known cause explains, and the configuration logged at startup (connectors, components, clients) with the keys changed between restarts. Also: 🏷️ the version of each connector plugin (with the playground connector-plugin changelog command since that version) and of Kafka, 📥 the data to request next from the customer, each with why and how (a complete copy of a file not fully read, a longer window, the logs since the last restart of a worker whose startup is missing, the broker or Schema Registry logs when the findings point there, a heap dump, GC logs, thread dumps or the TLS debug output for the known causes they explain, and the exact DEBUG logger to set for the errors no known cause explains), also in <input>-ticket.md, 🖥️ which worker ran which task and when (from the "Starting task" lines of each worker's logs), with 🎯 a connector whose errors all come from one worker while its tasks ran on another one at the same time without error (a DNS, truststore, plugin path or network difference of that host), 🩹 the known bugs of a plugin fixed in a later version whose error is in the logs, with a verdict from the version each connector runs (affected: upgrade to …; it has the fix: another cause; version unknown), 🔄 the restarts, stops, worker rebalances, consumer rejoins, members removed by the group coordinator of a broker (session or rebalance timeout), active controller changes and GC pauses of 1 s or more counted from the INFO lines and the GC logs (🌀 a storm when the rebalances repeat), 💥 the bursts of errors right after a GC pause, a stop, a restart or a controller change, 🔗 the errors that came right after a change (config key, restart) of the same connector, and 🧪 a config lint of each connector (errors.tolerance=all without a DLQ, a DLQ with replication factor 1, max.poll.records too high for max.poll.interval.ms, acks not all…). --connector keeps one connector, --show-config prints a configuration, --since / --until keep a window of time. 📋 <input>-ticket.md, next to the report: the same summary in Markdown, always sanitized, to paste in a ticket (also in 📤 Share of the report). 📈 With --compare repeated (oldest first), a trend over every input.

    🌐 Also writes a self-contained HTML report in --output-dir, opened in the browser in an interactive terminal: verdict, known causes (task killed, errors.tolerance exceeded, authentication, TLS, wrong security.protocol, unknown magic byte, OutOfMemoryError, fenced producer, rebalances, throttling, offsets not committed in time, task not stopped in time...), an incident timeline (all files merged: first occurrence of each error and known cause, restarts, connectors reconfigured, config changes, processes stopped, active controller changes and GC pauses of 1 s or more read from the GC logs of the input, 💥 with the burst of ERROR / WARN of every file in the 60 s after one of them when it is well above the usual rate ("39 Partition leadership changed right after broker 2 shut down"); a chart places them in time, one lane per component, long gaps cut, and a Δ column gives the time between them), a card per connector (errors, task killed, known causes, config changes, its plugin class: 🔎 inferred from the loggers of the lines of its tasks when the logs miss its startup), occurrences over time, root causes (deepest exception of each record), files with findings, and every distinct record. Everything below the filter bar is one view of the same records: the level chips, the component chips, the connector picker, the search box and the period selected by dragging over the occurrences chart (all kept in the URL: 🔗 Link to this view opens the report on the same view) all recount the two charts, the root causes, the files with findings and the record cards (double-click the chart, or ⤺ whole period, to go back). The findings keep the figures of the whole report, say how much of each of them is in the selection, and the ones with nothing in it are hidden (show them brings them back). With a connector picked, the 🔌 Connectors section keeps its card only. ⚠️ Connect logs whose task lines have no connector context ([orders-sink|task-0], the MDC %X{connector.context} of the log4j pattern) are reported, with the fix: their records cannot all be tied to their connector. 🕐 Period, a row of the filter bar, picks the period as the time picker of Grafana: quick ranges relative to the end of the logs (last 15 min of the logs…) and the times of the analysis (around the first error, the peak), from → to (paste "09:02 → 09:08"), around a time (± 5 min), ⊖ zoom out, ◀ ▶ shift (t ← / t →), ⏱️ on a row of the incident timeline. 🔎 Search every log line searches every line of every file, INFO and DEBUG included, in the browser and offline (words, "a phrase", /regex/, -exclude, level:INFO, file:connect-0, comp:connect): a histogram of the matches (drag: the period of the report), the counts per level and file, the lines sorted by time, a click for the lines around one. The lines are written compressed next to the report (in the 📤 Share .zip) within PLAYGROUND_LOG_SEARCH_MAX_MB (200 MB of lines by default, the files with findings first, 0 to turn it off), not with --sanitize.

    🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-analyze-logs
    🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%95%B5%EF%B8%8F-a-connector-failed-read-the-logs-live-or-from-a-customer-bundle
    🎬 Bite size session (--compare): https://kafka-docker-playground.io/#/sessions?id=%F0%9F%94%81-did-the-fix-work-analyze-the-logs-before-and-after-it
  environment_variables:
  - name: PLAYGROUND_LOG_PARALLELISM
    help: "⚡ Files digested at the same time, merged in the order of the input (default 4; 1: one at a time, with the progress bar of a large file)"
  - name: PLAYGROUND_AWK
    help: "🏎️ The awk that reads every line (the digest, --since / --until): mawk when it is installed (2.5x faster than the awk of macOS, same records: brew install mawk), else awk. awk forces the awk of PATH, gawk or \"busybox awk\" another one"
  - name: PLAYGROUND_CFK_PARALLELISM
    help: "⚡ CFK support bundles analyzed at the same time, a container each, or a python3 process with CFK_ANALYSIS_LOCAL (default 4)"
  - name: PLAYGROUND_LOG_RUNBOOKS_FILE
    help: "🔒 JSON file with the internal runbooks of Confluent support (GTS Confluence pages, internal KB articles) by known cause, shown with a 🔒 next to the 📚 KB in the terminal summary, the HTML report and --json (known_causes[].internal_links), never in the summary for a ticket (default reproduction-models/_miscellaneous/log-analysis/runbooks-internal.json, format in tools/report-common/known_causes.py)"
  - name: PLAYGROUND_CFK_RUNBOOKS_FILE
    help: "📕 CFK support bundle: JSON file with the internal runbook links of the known CFK issues, shown with a 🔒 in the terminal, the HTML report and --json (default reproduction-models/_miscellaneous/cfk-analysis/runbooks-internal.json, format in cfk-analysis/runbooks.py)"
  - name: CFK_ANALYSIS_LOCAL
    help: "☸️ CFK support bundle: 1 runs cfk-analysis with the python3 of the machine (PyYAML needed) instead of its Docker image, 0 always in the image (default: the image, the local python3 when there is no container engine and PyYAML is installed; 1 in the kdp-analyze-logs image)"
  - name: PLAYGROUND_HOST_PATH_MAP
    private: true
    help: "<folder in the container>=<folder on the host>: set by the kdp-analyze-logs image (/data=KDP_HOST_DIR), the paths printed and the ✏️ links of the report are those of the host"
  flags:
<%= File.read('src/flags/analyze-logs-flags.yml').gsub(/^(?=.)/, '    ') %>
  examples:
  - playground analyze logs --sample connect_task_failure
  - playground analyze logs --sample connect_many_connectors
  - playground analyze logs --sample support_bundle
  - playground analyze logs --file connect.log
  - playground analyze logs --from-containers
  - playground analyze logs --from-containers --container connect --container broker --connector my-jdbc-sink
  - playground analyze logs --file connect-logs.zip --errors-only
  - playground analyze logs -f ./logs -f broker.log.gz --max-findings 10
  - playground analyze logs -f support-bundle.zip --output-dir /tmp/log-reports
  - playground analyze logs -f connect.log --json
  - playground analyze logs --sample cfk_bundle
  - playground analyze logs --sample cfk_kraft_migration
  - playground analyze logs --sample cfk_rollout
  - playground analyze logs --sample cfk_rollout --sample cfk_rollout_after
  - playground analyze logs --sample cfk_bundle --problem "connect-0 keeps restarting since 14 Oct 08:30, orders-sink failed"
  - playground analyze logs -f ./support-bundle-ns-confluent.tar.gz -p "kafka roll stuck after the upgrade yesterday"
  - playground analyze logs -f bundle-monday.tar.gz -f bundle-tuesday.tar.gz
