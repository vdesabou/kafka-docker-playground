name: repro
expose: always
group: Repro
help: |-
  👷‍♂️ Reproduction model commands

  A reproduction model is an example written to demonstrate one specific
  problem, so that anyone can reproduce it with a single command.

    bootstrap   scaffold one from an existing example, then edit it
    list        find models by case, status, verdict, base example, author, date
    diff        what a model changes compared with its base example
    status      show or update what a model proves: expected, actual, jira, status
    assert      end a model with its verdict: 🐞 reproduced or ✅ not reproduced
    bisect      run a model on several versions: which one introduced or fixed it
    export      package one or more models as a self-contained tgz bundle
    import      unpack a bundle someone sent you, and run it
    check       scan models for secrets and customer data before committing them

  👉 Always scaffold with bootstrap rather than copying a script by hand: it
  creates the header, the docker compose override, the CLI cheat sheet and
  registers the model, which a hand-written file would be missing.

  Keep a model minimal and about one issue, state expected versus actual
  behaviour in its header (🎯 expected / 💥 actual), and never put customer
  data in it.

  🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-reproduction-models
  🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%A7%AA-the-life-of-a-reproduction-model
environment_variables:
- name: OUTPUT_FOLDER
  help: 📁 Output folder where to generate bootstrapped files
  default: reproduction-models
dependencies:
  fzf: visit https://github.com/junegunn/fzf#installation to install
commands:

- name: export
  help: |-
    📤 Export reproduction models as a self-contained tgz bundle

    Produces a single tgz that a colleague can feed to
    'playground repro import' to run your scenario as is.

    The bundle holds what the model needs, committed or not: the script,
    the files of its folder it mentions (docker compose override, producer,
    SQL files…) and the support files linked by bootstrap (README.md,
    stop.sh, benchmark-load.bash, config-*). Symlinks are stored as their
    content, so the bundle does not depend on the version of the base
    example. Git-ignored files, build output (target/), dumps, flight
    recordings, logs and credential files (keyfile.json, *.pem, *.key) are
    left out.

    A repro-manifest.json describes the bundle: the last 'playground run'
    line of each model (from playground-run-history), its case number,
    author, base example, the playground commit, the names (never the
    values) of the credentials it needs, and the sha256 of every file.

    Before anything is written, the bundle is scanned. The export stops
    (unless --force) when a file contains the value of a credential known
    to this machine ('playground secrets' store, exported credential
    variables, CLUSTER_CREDS / SCHEMA_REGISTRY_CREDS of playground.ini,
    ~/.aws/credentials) or a well-known token format (AWS access key id,
    private key, GitHub / Slack token, Google API key, JWT, Azure storage
    account key). Email addresses, public IP addresses and hard-coded
    passwords that do not come from the base example are reported as
    possible customer data. Values are never printed.

    Files outside the repository that a model needs (--connector-zip /
    --connector-jar of its run line, files whose absolute path appears in
    the script or its compose files, like ~/Downloads/config.json) are
    only listed, unless --include-artifacts packs them under
    <model folder>/artifacts/. Import then points the run line, the script
    and the compose files to the imported copies. Import also rewrites the
    paths of the exporter's checkout (like the jar path written by
    'repro bootstrap --custom-smt') to the local ones.

    --cluster-creds / --cluster-schema-registry-creds are removed from the
    run line: whoever imports runs with their own cluster.

    Without --file, the current reproduction model is exported.

    📖 Each model gets a hand-off report, <model>.REPRO.md next to its
    script in the bundle: case, jira, status, last verdict, 🎯 expected,
    💥 actual, the commands to import and run it, the credentials it
    needs, and what it changes compared with the script of its base
    example (diff). 'playground repro import' prints where it is.
    --report-only prints it (Markdown, for a Jira or a Slack message)
    without writing the bundle, --no-report leaves it out.

    📘 A README.md at the top of the bundle is the first file to open for
    someone who never used the playground: how to install it in one
    command (or open it in GitHub Codespaces), how to import and run the
    models, then their hand-off reports. Import skips it.

    📋 On macOS, the bundle is copied to the clipboard as a file: paste it
    (Cmd+V) in a Slack conversation to attach it (--no-clipboard to skip).

    🎓 Tip: start with --dry-run to see what would be packed, and what the scan finds.
    The same scan runs on commits with 'playground repro check'.
  dependencies:
    git: visit https://git-scm.com/downloads to install
  flags:
    - long: --file
      short: -f
      arg: file
      required: false
      repeatable: true
      conflicts: [--all-uncommitted, --all]
      validate: file_exists_with_trick
      completions:
        dynamic:
        - playground get-examples-list-with-fzf --repro-only "$completion_current"
      help: |-
        🔖 Reproduction model script to export (default: current one)

        Can be repeated to put several models in one bundle.
    - long: --all-uncommitted
      required: false
      conflicts: [--file]
      help: |-
        📦 Export every reproduction model with uncommitted changes (new or modified)
    - long: --all
      required: false
      private: true
      conflicts: [--file]
      help: |-
        📦 Former name of --all-uncommitted
    - long: --output
      short: -o
      arg: output
      required: false
      help: |-
        📁 Folder where to write the bundle (default: current folder, or the repository root when run from reproduction-models)
    - long: --dry-run
      required: false
      help: |-
        🔍 Only list the models and files that would be packed, and run the scan
    - long: --force
      required: false
      help: |-
        🔓 Export even if the scan finds secrets (when they are not real ones)
    - long: --include-artifacts
      required: false
      help: |-
        📎 Also pack the files outside the repository the models need (connector zip / jar, files referenced by absolute path)
    - long: --no-clipboard
      required: false
      help: |-
        📋 Do not copy the bundle to the clipboard (macOS)
    - long: --report-only
      required: false
      conflicts: [--no-report, --dry-run]
      help: |-
        📖 Print the hand-off report of the models (Markdown) on stdout, without writing the bundle (the scan still runs)
    - long: --no-report
      required: false
      help: |-
        📖 Do not put the hand-off report (<model>.REPRO.md) in the bundle
    - long: --clipboard
      required: false
      private: true
      help: |-
        📋 Former flag: the bundle is now copied to the clipboard by default
  examples:
  - playground repro export
  - playground repro export -f ~/kafka-docker-playground/reproduction-models/connect-connect-http-sink/http-repro-123456-dlq.sh --dry-run
  - playground repro export --all-uncommitted --output ~/Desktop
  - playground repro export --include-artifacts
  - playground repro export --report-only | pbcopy

- name: check
  help: |-
    🕵️ Scan reproduction models for secrets and customer data before they are committed

    Runs the scan of 'playground repro export' on the files of the
    reproduction models, without packing anything. It stops (exit code 1)
    when a file contains the value of a credential known to this machine
    ('playground secrets' store, exported credential variables,
    CLUSTER_CREDS / SCHEMA_REGISTRY_CREDS of playground.ini,
    ~/.aws/credentials) or a well-known token format (AWS access key id,
    private key, GitHub / Slack token, Google API key, JWT, Azure storage
    account key), and when a credential file (keyfile.json, *.pem, *.key,
    *.p12, *.jks, secrets.properties, playground.ini) is about to be
    committed. Email addresses, public IP addresses, hard-coded passwords
    that do not come from the base example, and dumps, logs or archives
    are reported as possible customer data, without failing. Values are
    never printed.

    Without flag, the new and modified files of reproduction-models are
    checked. Symlinks to the public examples are not.

    🪝 'playground repro bootstrap' and 'playground repro import' set up a
    pre-commit hook in reproduction-models (git config core.hooksPath
    <playground>/scripts/repro-git-hooks) that runs
    'playground repro check --staged --skip-secrets-store' on every commit.
    An existing pre-commit hook or core.hooksPath is never replaced. To skip
    the scan of one commit: git commit --no-verify, or
    PLAYGROUND_REPRO_SCAN=skip git commit. PLAYGROUND_REPRO_SCAN=full also
    reads the 'playground secrets' store.
  dependencies:
    git: visit https://git-scm.com/downloads to install
  flags:
    - long: --file
      short: -f
      arg: file
      required: false
      repeatable: true
      conflicts: [--staged, --all]
      validate: file_exists_with_trick
      completions:
        dynamic:
        - playground get-examples-list-with-fzf --repro-only "$completion_current"
      help: |-
        🔖 Reproduction model script to check (the files export would pack), can be repeated
    - long: --staged
      required: false
      conflicts: [--file, --all]
      help: |-
        🪝 Check the staged content of the files about to be committed (what the pre-commit hook uses)
    - long: --all
      required: false
      conflicts: [--file, --staged]
      help: |-
        📚 Check every file of reproduction-models, committed or not (one-time audit)
    - long: --skip-secrets-store
      required: false
      help: |-
        ⚡ Do not read the 'playground secrets' store, which can prompt (1Password): only the exported variables, playground.ini and ~/.aws/credentials values, and the token formats
    - long: --json
      required: false
      help: |-
        🤖 Print the findings as JSON (exit code 1 still means a secret was found)
  examples:
  - playground repro check
  - playground repro check --staged
  - playground repro check -f ~/kafka-docker-playground/reproduction-models/connect-connect-http-sink/http-repro-123456-dlq.sh
  - playground repro check --all --json

- name: import
  help: |-
    📥 Import a tgz bundle created by 'playground repro export'

    The bundle is extracted to a temporary folder first and checked: no
    absolute paths, no '..', no special files, and the sha256 of every file
    must match its manifest. Bundles from older versions, without manifest,
    are still accepted.

    Files identical to yours are skipped. When a file differs, the import
    stops unless --on-conflict says what to do. Files that were symlinks to
    a public example are restored as symlinks when the public file is
    identical, otherwise their content is kept.

    Then the model becomes the current one, and the command prints the
    'playground run' line to use and the credentials missing from your
    'playground secrets' profile. --run goes on with that line when
    nothing is missing (in a terminal, it asks first when containers are
    running: the run stops them).

    --file also takes a URL (a GitHub release asset, a raw file, any public
    link): the bundle is downloaded into an empty temporary folder, then
    checked like a local one. Links that need a login (Slack, Google
    Drive) must be downloaded by hand.
  flags:
  - long: --file
    short: -f
    arg: file
    required: true
    completions:
      dynamic:
      - playground get-playground-repro-export-with-fzf "$completion_current"
    help: |-
      🤐 Bundle file (playground_repro_*.tgz, any name is accepted), or its https:// URL

      🎓 Tip: use <tab> completion to trigger fzf completion
              use playground config folder_zip_or_jar <folder1> <folder2>... (default is home folder and current folder is always included) to configure where to search the files
  - long: --on-conflict
    arg: on-conflict
    required: false
    allowed: [abort, rename, overwrite]
    default: abort
    help: |-
      ⚔️ What to do when a file of the bundle differs from your copy

      abort: import nothing and list the differences
      rename: import the differing files with an -imported-<date> suffix (references in the imported scripts are updated)
      overwrite: replace your copy
  - long: --dry-run
    required: false
    conflicts: [--run]
    help: |-
      🔍 Only show the manifest, the files and the conflicts
  - long: --run
    required: false
    help: |-
      ▶️ Then run the model with its run line (bundle with one model, nothing missing: credentials, external files)
  examples:
  - playground repro import -f ~/Downloads/playground_repro_http-repro-123456-dlq_2026-10-21.tgz
  - playground repro import -f ~/Downloads/playground_repro_http-repro-123456-dlq_2026-10-21.tgz --run
  - playground repro import -f https://github.com/<owner>/<repo>/releases/download/v1/playground_repro_http-repro-123456-dlq_2026-10-21.tgz
  - playground repro import -f ~/Downloads/playground_repro_http-repro-123456-dlq_2026-10-21.tgz --on-conflict rename

- name: bootstrap
  help: |-
    🛠  Bootstrap reproduction model, just run <playground repro bootstrap> !

    🔥 HIGHLY RECOMMENDED: start in interactive mode by simple running <playground repro bootstrap> !
    
    👉 Check documentation https://kafka-docker-playground.io/#/toolkit-reproduction-models?id=%f0%9f%9b%a0-bootstrap-reproduction-model
  flags:
  - long: --file
    short: -f
    required: false
    validate: file_exists_with_trick
    arg: file
    completions:
      dynamic:
      - playground get-examples-list-with-fzf --without-repro "$completion_current"
    help: |-
      🔖 Example file to use as basis, if not set, currently running example is used
      
      ❕ It must be absolute full path

      With --config and without --file, the example is picked from the
      connector.class of the config.

      🎓 Tip: use <tab> completion to trigger fzf completion

  - long: --description
    short: -d
    required: false
    validate: not_empty
    arg: description
    help: |-
      💭 Description for the reproduction model

  - long: --expected
    required: false
    arg: expected
    help: |-
      🎯 Expected behaviour, written in the '# 🎯 expected:' line of the header

      Asked after the description in interactive mode. Update it later with
      'playground repro status --expected'.

  - long: --actual
    required: false
    arg: actual
    help: |-
      💥 Actual behaviour (the problem), written in the '# 💥 actual:' line of the header

      Asked after the description in interactive mode. Update it later with
      'playground repro status --actual'.

  - long: --jira
    required: false
    arg: jira
    help: |-
      🎫 Jira of the problem, written in the '# 🎫 jira:' line of the header

      A key (CC-1234) becomes its https://confluentinc.atlassian.net/browse/ link.

  - long: --config
    required: false
    validate: file_exists_with_trick
    arg: config-file
    completions:
      dynamic:
      - playground get-connector-config-file-with-fzf "$completion_current"
    help: |-
      📄 Connector config the customer sent, put in the model in place of the one of the example

      Any format of 'playground connector convert': a JSON config, a REST
      API dump, a CFK Connector or Strimzi KafkaConnector resource, a
      terraform confluent_connector, a connect-standalone .properties.

      - without --file, the example to start from is the one that deploys
        the same connector.class, ranked with the words of the class and
        of the config (the database of a jdbc url, the auth type…): the
        best one with --no-run, a list to pick from otherwise
      - the connector heredoc of the example that deploys the same class
        (else the first one) is replaced with the config, adapted to the
        playground like 'playground connector create-or-update' does
        (bootstrap servers, schema registry, license, replication
        factors); the connector keeps the name of the example
      - its secrets, masked values, config providers and terraform
        references become variables, checked at the top of the model so
        that 'playground run' loads them from 'playground secrets'

      In interactive mode (no --file, no --config), the first menu asks
      whether to start from an example or from a connector config: the
      files that hold a connector config are listed, newest first, from
      the folders of 'playground config folder_zip_or_jar' and the current
      folder (3 levels deep) and from ~/Downloads and ~/Desktop (5 levels
      deep, for archived downloads and SendSafely folders). When none is
      found, type, paste or drag the path of the file.

      🎓 Tip: use <tab> completion to trigger fzf completion

      🎓 Tip: then compare the running connector with the customer file:
      playground connector diff --connector <c> --file <file>

  - long: --config-connector
    required: false
    arg: connector
    help: |-
      🔗 With --config, the connector to pick when the file holds several (REST dump, several resources)

  - long: --producer
    private: true
    short: -p
    arg: producer-type
    conflicts: [--pipeline]
    default: "none"
    allowed: 
      - none
      - avro
      - avro-with-key
      - protobuf
      - protobuf-with-key
      - json-schema
      - json-schema-with-key
    help: |-
      🤎 Java producer type to use
      
      One of avro, avro-with-key, protobuf, protobuf-with-key, json-schema, json-schema-with-key

      🎓 Tip: Most of times, it's much simpler to use 'playground topic produce'. Use java producer only if you have very specific requirements such as specifying record timestamp or to do perf testing (even though CLI is also good for that)

      🎓 Tip: 'with-key' will also produce key with selected converter, otherwise LongConverter is used

  - long: --nb-producers
    private: true
    short: -n
    arg: nb-producers
    required: false
    help: |-
      2️⃣ Number of java producers to generate

  - long: --producer-schema-key
    private: true
    required: false
    help: |-
      🔰 Schema to use for the key

      ✨ Copy and paste the schema you want to use for the key, save and close the file to continue

  - long: --producer-schema-value
    private: true
    required: false
    help: |-
      🔰 Schema to use for the value

      ✨ Copy and paste the schema you want to use for the key, save and close the file to continue

  - long: --custom-smt
    help: |-
      🔧 Add a custom SMT (which is a no-op)

  - long: --connector-plugin
    required: false
    repeatable: true
    arg: connector-plugin
    completions:
      dynamic:
      - playground get-connector-plugin "$completion_current" "onprem"
    help: |-
      🔌 Add Connector plugin to CONNECT_PLUGIN_PATH

      🎓 Tip: use <tab> completion to trigger fzf completion

  - long: --pipeline
    required: false
    validate: file_exists_with_trick
    arg: sink_file
    conflicts: [--producer]
    repeatable: true
    completions:
      dynamic:
      - playground get-examples-list-with-fzf --without-repro --sink-only "$completion_current"
    help: |-
      🔖 Sink example file to use for creating a pipeline. multiple --pipeline flags can be used to create a pipeline with multiple sinks.
      
      ❕ It must be absolute full path.

      🎓 Tip: use <tab> completion to trigger fzf completion

  - long: --no-run
    required: false
    help: |-
      🛑 Only generate the reproduction model files, then exit

      Skips opening the generated file in the editor and running it, so
      the running environment is left untouched.

      🎓 Tip: use it in scripts and from AI agents, together with --file and --description

  examples:
  - playground repro bootstrap (interactive mode)
  - playground repro bootstrap -f "\$PWD/connect/connect-http-sink/http_no_auth.sh" -d "123456 dlq not working" --no-run
  - playground repro bootstrap --config ~/Downloads/customer-connector.yaml -d "123456 dlq not working" --no-run
  - playground repro bootstrap -f "\$PWD/connect/connect-http-sink/http_no_auth.sh" -d "123456 dlq not working" --expected "bad records go to the DLQ" --actual "the task fails with Unknown magic byte" --jira CC-1234 --no-run

- name: status
  help: |-
    🩹 Show or update what a reproduction model proves, from its header

    'playground repro bootstrap' writes these fields under '# 💬 comments:'
    in the header of the model, one line each:

      # 🎯 expected: what should happen
      # 💥 actual: what happens instead (the problem)
      # 🎫 jira: the Jira of the problem
      # 🩹 status: open, fixed in <version>, not a bug, customer config…

    Without flag, prints the fields with the description, case, author and
    base example (--json for scripts). With --set, --expected, --actual or
    --jira, updates the lines, then prints them. A model created before the
    fields existed gets the missing lines added after '# 💬 comments:'.

    'playground repro export' copies the fields into repro-manifest.json,
    and 'playground repro import' prints them.

    Without --file, the current reproduction model is used.
  flags:
    - long: --file
      short: -f
      arg: file
      required: false
      validate: file_exists_with_trick
      completions:
        dynamic:
        - playground get-examples-list-with-fzf --repro-only "$completion_current"
      help: |-
        🔖 Reproduction model script (default: current one)
    - long: --set
      arg: status
      required: false
      help: |-
        🩹 New status, for example: open, fixed in 10.8.3, not a bug, customer config, workaround
    - long: --expected
      arg: expected
      required: false
      help: |-
        🎯 New expected behaviour
    - long: --actual
      arg: actual
      required: false
      help: |-
        💥 New actual behaviour
    - long: --jira
      arg: jira
      required: false
      help: |-
        🎫 New Jira (a key like CC-1234 becomes its link)
    - long: --json
      required: false
      help: |-
        🤖 Print the fields as JSON
  examples:
  - playground repro status
  - playground repro status -f ~/kafka-docker-playground/reproduction-models/connect-connect-http-sink/http-repro-123456-dlq.sh --set "fixed in 10.8.3" --jira CC-1234
  - playground repro status --actual "the task fails with Unknown magic byte" --json

- name: diff
  help: |-
    🔀 Show what a reproduction model changes compared with its base example

    Compares the scenario of the model (without its header, the cheat
    sheet and the snippets after it) with the script of the example it
    was bootstrapped from, and its docker compose override with the one of
    the example. The compose override renamed by bootstrap
    (docker-compose.plaintext.repro-<description>.yml) is compared under
    the name of the example's, so that line is not reported.

    Starts with a summary per connector: the config keys changed, added
    and removed (from the 'playground connector create-or-update'
    heredocs), then the diffs (in color in a terminal).

    The hand-off report of 'playground repro export' has the same diffs.

    Without --file, the current reproduction model is used.
  flags:
    - long: --file
      short: -f
      arg: file
      required: false
      validate: file_exists_with_trick
      completions:
        dynamic:
        - playground get-examples-list-with-fzf --repro-only "$completion_current"
      help: |-
        🔖 Reproduction model (default: current one)
    - long: --summary
      required: false
      help: |-
        🧩 Only the summary: config keys changed / added / removed per connector, whether the compose override changed
    - long: --compose
      required: false
      conflicts: [--summary]
      help: |-
        🐳 Only the diff of the docker compose override
    - long: --json
      required: false
      help: |-
        🤖 Print the summary and the diffs as JSON
  examples:
  - playground repro diff
  - playground repro diff -f ~/kafka-docker-playground/reproduction-models/connect-connect-http-sink/http-repro-123456-dlq.sh --summary
  - playground repro diff --json | jq '.connectors'

- name: list
  help: |-
    📋 List the reproduction models, newest first, with their case, status and last verdict

    Reads the header of every model of reproduction-models (date, author,
    description, 🎯 expected, 💥 actual, 🎫 jira, 🩹 status), its base
    example, whether it is committed, and the last verdict recorded by
    'playground repro assert'. A model without a date in its header gets
    the date of the commit that added it; one without a description, the
    end of its file name.

    Filters can be combined. Models with uncommitted changes are marked ✏️.
  flags:
    - long: --mine
      required: false
      help: |-
        👤 Only the models whose author is you (whoami)
    - long: --case
      arg: case
      required: false
      help: |-
        🔮 Only the models of this case (6 digits at the start of the description, or in the file name)
    - long: --status
      arg: status
      required: false
      help: |-
        🩹 Only the models whose 🩹 status contains this text (open, fixed, not a bug…)
    - long: --verdict
      arg: verdict
      required: false
      allowed: [reproduced, not-reproduced, none]
      help: |-
        🧪 Only the models with this last verdict (none: never ended with 'playground repro assert' here)
    - long: --base
      arg: example
      required: false
      help: |-
        🧬 Only the models whose base example contains this text, for example connect-jdbc-sink
    - long: --since
      arg: since
      required: false
      help: |-
        📅 Only the models created since this number of days (90d) or this date (2026-01-31)
    - long: --grep
      arg: regex
      required: false
      help: |-
        🔍 Only the models whose description, expected, actual, jira or path matches this regex (case insensitive)
    - long: --uncommitted
      required: false
      help: |-
        ✏️ Only the models with uncommitted changes
    - long: --limit
      arg: number
      required: false
      default: "30"
      validate: integer
      help: |-
        🔢 Number of models shown (default: 30, 0 for all)
    - long: --json
      required: false
      help: |-
        🤖 Print the models as JSON (every field, with the last verdict and its versions)
  examples:
  - playground repro list --mine --since 90d
  - playground repro list --case 123456
  - playground repro list --status open --base connect-cdc-oracle
  - playground repro list --grep "magic byte" --limit 0
  - playground repro list --verdict reproduced --json

- name: assert
  help: |-
    🧪 End a reproduction model with its verdict: 🐞 REPRODUCED or ✅ NOT REPRODUCED

    Put it at the end of the scenario, with the check that says the
    problem is there (the 💥 actual of the header). It prints the verdict
    with the CP and connector versions, and records it in
    playground-repro-verdicts (a local file of the repository root, not
    committed), so that it can be compared between runs and versions:

      playground repro status     shows the last verdict of the model
      playground repro export     writes it in repro-manifest.json

    One check per call (combine several with --reproduced-if-command):

      --reproduced-if-log <pattern>               a line of the logs of
                                                  --container (default
                                                  connect) matches (grep)
      --reproduced-if-connector-state <state>     the connector or one of
                                                  its tasks is in this state
      --reproduced-if-records-less-than <n>       --topic has less records
      --reproduced-if-records-more-than <n>       --topic has more records
      --reproduced-if-command "<command>"         the shell command succeeds

    Both verdicts exit with 0: a model that does not reproduce is a result,
    not an error. The exit code is 1 only when the check cannot run.

    Without --file, the verdict is recorded for the current model (the one
    'playground run' runs).
  flags:
    - long: --reproduced-if-log
      arg: pattern
      required: false
      help: |-
        🔍 Reproduced when a line of the logs of --container matches this grep pattern
    - long: --container
      short: -c
      arg: container
      required: false
      default: "connect"
      help: |-
        🐳 Container whose logs --reproduced-if-log reads (default: connect)
    - long: --reproduced-if-connector-state
      arg: state
      required: false
      allowed: [FAILED, RUNNING, PAUSED, STOPPED, UNASSIGNED, RESTARTING]
      help: |-
        🧩 Reproduced when the connector or one of its tasks is in this state
    - long: --connector
      arg: connector
      required: false
      help: |-
        🔗 Connector of --reproduced-if-connector-state (default: the only one running)
    - long: --reproduced-if-records-less-than
      arg: number
      required: false
      validate: integer
      help: |-
        📉 Reproduced when --topic has less records than this (records lost, not delivered)
    - long: --reproduced-if-records-more-than
      arg: number
      required: false
      validate: integer
      help: |-
        📈 Reproduced when --topic has more records than this (duplicates, records sent to a DLQ)
    - long: --topic
      short: -t
      arg: topic
      required: false
      help: |-
        🗳 Topic of --reproduced-if-records-less-than / --reproduced-if-records-more-than
    - long: --reproduced-if-command
      arg: command
      required: false
      help: |-
        💻 Reproduced when this shell command succeeds (exit code 0)
    - long: --message
      short: -m
      arg: message
      required: false
      help: |-
        💬 Text printed with the verdict, before what the check found
    - long: --file
      short: -f
      arg: file
      required: false
      validate: file_exists_with_trick
      help: |-
        🔖 Reproduction model the verdict is recorded for (default: current one)
    - long: --json
      required: false
      help: |-
        🤖 Print the verdict as JSON
  examples:
  - playground repro assert --reproduced-if-log "Unknown magic byte"
  - playground repro assert --reproduced-if-connector-state FAILED --connector http-sink
  - playground repro assert --reproduced-if-records-less-than 10 --topic orders --message "records lost"
  - playground repro assert --reproduced-if-command "playground topic get-number-records --topic dlq | tail -1 | grep -qv '^0$'"

- name: bisect
  help: |-
    🔀 Run a reproduction model on several versions: which one introduced or fixed the problem

    Runs the model once per version ('playground run -f <model>
    --connector-tag <version>', or --tag for CP versions) and reads the
    verdict that 'playground repro assert' records at the end of each run.
    The model must end with 'playground repro assert'.

      --connector-tag A --connector-tag B …   these connector versions
      --from A --to B                         the Confluent Hub versions of
                                              the connector of the model
                                              between A and B: a binary
                                              search (first, last, then the
                                              middle until the verdict
                                              changes), --all for every one
      --tag A --tag B …                       these CP versions

    Prints the verdict of each version (🐞 reproduced, ✅ not reproduced,
    ❓ no verdict when the run stopped before 'repro assert'), the versions
    where it changes and, for a Confluent connector, the changelog between
    them ('playground connector-plugin changelog'). The log of each run is
    in /tmp/playground-repro-bisect/<model>-<version>.log, the summary in
    /tmp/playground-repro-bisect/<model>-<date>.json.

    ⚠️ Each run stops the running environment, like 'playground run', and a
    run takes the time of the model: a binary search over 30 versions is
    about 6 runs.
  flags:
    - long: --file
      short: -f
      arg: file
      required: false
      validate: file_exists_with_trick
      completions:
        dynamic:
        - playground get-examples-list-with-fzf --repro-only "$completion_current"
      help: |-
        🔖 Reproduction model to run (default: current one)
    - long: --connector-tag
      arg: connector-tag
      required: false
      repeatable: true
      conflicts: [--from, --to]
      help: |-
        🔗 Connector version to run, repeat it for each version
    - long: --from
      arg: version
      required: false
      help: |-
        ⏮️ First Confluent Hub version of the connector of the model (default: the oldest one)
    - long: --to
      arg: version
      required: false
      help: |-
        ⏭️ Last Confluent Hub version of the connector of the model (default: the latest one)
    - long: --all
      required: false
      help: |-
        📚 With --from / --to, run every version of the range instead of a binary search
    - long: --tag
      arg: tag
      required: false
      repeatable: true
      help: |-
        🎯 CP version: repeat it to compare CP versions, or give one to run every connector version on it
    - long: --run-flags
      arg: flags
      required: false
      help: |-
        ⛳ Other flags of 'playground run' for every run, for example "--environment sasl-ssl"
    - long: --json
      required: false
      help: |-
        🤖 Print the summary as JSON
  examples:
  - playground repro bisect --connector-tag 2.14.0 --connector-tag 2.14.5 --connector-tag 3.0.0
  - playground repro bisect --from 2.10.0 --to 3.0.0
  - playground repro bisect -f ~/kafka-docker-playground/reproduction-models/connect-connect-http-sink/http-repro-123456-dlq.sh --tag 7.9.0 --tag 8.2.0 --tag 8.4.0
