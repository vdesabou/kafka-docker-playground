name: codespace
expose: always
group: Codespace
filters:
  - gh_codespace
help: |-
  ☁️ Create and manage GitHub Codespaces to run kafka-docker-playground

  🪄 Open them in Visual Studio Code (or the browser), or run a command in them over ssh

  The same thing as the "Open in GitHub Codespaces" button, from the
  terminal: an Ubuntu x86_64 machine set up by .devcontainer/ (Docker with
  compose v2, fzf, playground in the PATH, the default images pulled), with
  nothing to install on your laptop and no AWS account. It is also where the
  examples that do not work on ARM64 run.

    create              create a codespace and open it
    open                open it in VS Code (or the browser with --web)
    ssh                 a shell, or one command, in it
    push-secrets        send your credentials to its secrets store
    sync-repro-folder   keep reproduction-models in step, both directions
    list / start / stop / delete

  A thin layer over 'gh codespace': it needs the GitHub CLI with the
  'codespace' scope (gh auth refresh -h github.com -s codespace).

  💰 A running codespace uses your Codespaces quota (30 hours a month on 4
     cores with GitHub Free), then is billed. It stops by itself after 30
     minutes idle; 'playground codespace stop' when you pause, and
     'playground codespace delete' when you are done (a stopped codespace
     still uses storage).

  🔐 The private reproduction-models submodule is not cloned in a codespace:
     'playground codespace sync-repro-folder local-to-codespace' copies yours.
environment_variables:
  - name: PLAYGROUND_CODESPACE_REPO
    help: 🐙 Repository the codespaces are created from, as OWNER/REPO (default vdesabou/kafka-docker-playground, set it to use your fork)
commands:
- name: create
  help: |-
    👷 Create a GitHub Codespace of kafka-docker-playground, then open it

    The codespace is created from the master branch (--branch to change it)
    on a 4-core / 16 GB machine, the minimum for a broker, Connect and Schema
    Registry. When a prebuild is configured for the repository, it starts
    with the default images already pulled; otherwise they are pulled in the
    background once it is open.

    It is named pg-<username>-<suffix>, like the ec2 instances, so that
    'playground codespace list' tells them apart.
  flags:
  - long: --machine
    required: false
    arg: machine
    default: 4-core
    allowed:
      - 4-core
      - 8-core
      - 16-core
    help: |-
      🧑‍💻 machine size: 4-core (16 GB), 8-core (32 GB) or 16-core (64 GB). default is 4-core

      🎓 Tip: an 8-core machine uses your quota twice as fast as a 4-core one
  - long: --branch
    short: -b
    required: false
    arg: branch
    default: master
    help: 🌿 branch the codespace is created from. default is master
  - long: --suffix
    required: false
    arg: suffix
    help: |-
      📮 suffix to add to the codespace display name, giving pg-<username>-<suffix>

      if not set, the name is pg-<username>-<6 random characters>

      🎓 Tip: set it to the case number you are working on
  - long: --location
    required: false
    arg: location
    allowed:
      - EastUs
      - SouthEastAsia
      - WestEurope
      - WestUs2
    help: 🌍 region of the codespace (default is picked by GitHub, close to you)
  - long: --no-open
    required: false
    help: 🙈 do not open the codespace in VS Code once it is created
  - long: --push-secrets
    required: false
    help: 🔐 once it is available, send your secrets store to it (playground codespace push-secrets)
  - long: --sync-repro-folder
    required: false
    help: 👉 once it is available, copy your reproduction-models folder to it (playground codespace sync-repro-folder local-to-codespace)
  examples:
  - playground codespace create
  - playground codespace create --suffix 123456 --machine 8-core
  - playground codespace create --branch my-feature --no-open
  - playground codespace create --suffix 123456 --push-secrets --sync-repro-folder

- name: list
  help: |-
    🔘 List your kafka-docker-playground codespaces

    Their name, branch and state. An Available one is running and uses your
    quota.

- name: open
  help: |-
    👨‍💻 Open a codespace in Visual Studio Code

    Opens your local VS Code connected to the codespace (it needs the GitHub
    Codespaces extension), or VS Code in the browser with --web. A stopped
    codespace is started on the way.

    Without --codespace, the most recently used codespace is opened.
  flags:
  - &codespace
    long: --codespace
    short: -c
    required: false
    arg: codespace
    validate: not_empty
    completions:
      dynamic:
      - playground get-codespace-list $completion_current
    help: |-
      ☁️ codespace name, as shown by 'playground codespace list' (use completion)

      🎓 Tip: if not specified, the most recently used codespace is used
  - long: --web
    short: -w
    required: false
    help: 🌐 open VS Code in the browser instead of the local VS Code
  examples:
  - playground codespace open
  - playground codespace open --web

- name: ssh
  help: |-
    🐚 Open a shell in a codespace, or run one command in it

    Everything after -- runs in the codespace, from the repository folder, in
    a login shell (so playground is in the PATH). A stopped codespace is
    started on the way.

    It needs the SSH server of .devcontainer/: a codespace created before it
    was added, or from a prebuild older than that, needs a rebuild first
    (gh codespace rebuild -c <name>).

    Without --codespace, the most recently used codespace is used.
  catch_all:
    label: command
    help: command to run in the codespace, after --
  flags:
  - *codespace
  examples:
  - playground codespace ssh
  - playground codespace ssh -- playground status
  - playground codespace ssh --codespace pg-jdoe-123456 -- docker images

- name: stop
  help: |-
    🔴 Stop a codespace

    Shuts the machine down while keeping its disk, so you stop using compute
    and find your work again on 'playground codespace start'. A codespace
    also stops by itself after 30 minutes idle.

    Without --codespace, all your running codespaces are stopped.
  flags:
  - *codespace

- name: start
  help: |-
    🟢 Start a codespace

    Starts a stopped codespace and waits until it is available. 'open' and
    'ssh' start it too.

    Without --codespace, the most recently used codespace is started.
  flags:
  - *codespace

- name: delete
  help: |-
    ❌ Delete a codespace

    This is what stops the storage billing for good, unlike stop. The branch
    and the uncommitted / unpushed state of each codespace are shown before
    you confirm.

    ⚠️ Everything in the codespace is lost, including the reproduction models
    you wrote there.

    Without --codespace, it applies to all your codespaces, and asks you to
    confirm first.
  flags:
  - *codespace

- name: push-secrets
  help: |-
    🔐 Send the secrets store to a codespace

    Resolves every variable of the profile on your laptop (1Password, macOS
    Keychain…), then imports them into the secrets store of the codespace
    (backend file, ~/.config/kafka-docker-playground): credentials as
    credentials, plain variables as plain variables. 'playground run' in the
    codespace then loads what each example declares, as on your laptop, and
    'playground secrets list' or 'check' work there. Nothing to install in the
    codespace, no 1Password token to give it.

    The values are piped over 'gh codespace ssh', so no clear text copy is
    ever written locally and they never appear in 'ps'. In the codespace they
    are stored in clear text in secrets.ini (mode 0600), like any file backend.

    The credentials that cannot be stored as name=value pairs are sent too,
    when they exist at the root of the repository (same as 'playground ec2
    push-secrets'):

      aws_credentials_with_assuming_iam_role       -> ~/.aws/credentials-with-assuming-iam-role
      aws_credentials_aws_account_with_assume_role -> ~/.aws/credentials_aws_account_with_assume_role
      github_ssh_key_file                          -> ~/.ssh/id_rsa

    ⚠️ 'Codespaces: Rebuild Container' empties the home directory: run it
    again after a rebuild.

    Without --codespace, the most recently used codespace is used.
  flags:
  - *codespace
  - long: --profile
    arg: profile
    required: false
    help: 🗂️ Secrets profile to send (default is the active one), imported into the profile of the same name
    completions:
      dynamic:
      - playground get-secret-profile-list
  - long: --dry-run
    required: false
    help: 🔍 List what would be sent, change nothing
  examples:
  - playground codespace push-secrets --dry-run
  - playground codespace push-secrets
  - playground codespace push-secrets --profile case-123456

- name: sync-repro-folder
  dependencies:
    rsync: rsync needs to be installed
  help: |-
    ↔️ Synchronize reproduction-models folder between local and a codespace

    reproduction-models is a private submodule: a codespace cannot clone it,
    and the models you write there are lost with the codespace. These two
    commands copy that folder in one direction or the other with rsync, over
    the ssh tunnel of 'gh codespace ssh' (only newer files, .git and what
    .gitignore lists are left out, nothing is deleted on the other side).

      local-to-codespace   push what you wrote locally, before running it there
      codespace-to-local   pull back what you wrote there, before deleting it

    'playground codespace create --sync-repro-folder' runs local-to-codespace
    for you.

    ⚠️ Get into the habit of running codespace-to-local before
    'playground codespace delete', nothing else brings those files back.
  commands:
  - name: local-to-codespace
    help: |-
      👉 Sync local reproduction-models folder to a codespace

      Without --codespace, the most recently used codespace is used.
    flags:
    - *codespace

  - name: codespace-to-local
    help: |-
      👈 Sync a codespace reproduction-models folder to local

      Brings back the models you wrote in the codespace. Run it before
      'playground codespace delete', otherwise they go with the codespace.

      Without --codespace, the most recently used codespace is used.
    flags:
    - *codespace
