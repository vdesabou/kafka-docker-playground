name: cleanup-cloud-details
group: Cleanup
help: |-
  🧼 Forget the cached Confluent Cloud details (environment, cluster, endpoints, API keys)

  Use it when the playground uses unexpected Confluent Cloud details
  (https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%8c%a4%ef%b8%8f-confluent-cloud-examples).

  Drops the cached environment, cluster, endpoints and API keys (including
  the configs cached for each cluster used, in .ccloud/clusters/), so the
  next ccloud example re-discovers them from scratch. Typically needed after you
  changed of Confluent Cloud organisation, or deleted the cluster from the UI
  behind the playground's back.

  ❕ Nothing is deleted in Confluent Cloud, only the local cache. To delete
     the cloud resources themselves, see 'playground cloud-resources cleanup'.
