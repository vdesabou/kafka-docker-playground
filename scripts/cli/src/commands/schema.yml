name: schema
expose: always
group: Schema
help: |-
   🔰 Schema commands

   Talk to the Schema Registry of the running environment, whether it is the
   local container or the one in Confluent Cloud, without building the urls
   and the credentials yourself.

   🔍 Read
     list                 every subject: versions, latest id, type, rule, mode
     describe             everything about a subject or a schema id
     history              timeline from _schemas: registrations, deletes, rule changes
     get                  every version of a subject, or of all subjects
     get-compatibility    the compatibility rule in force (subject or global)
     get-mode / get-alias
     metrics              the server: requests, errors, latency, schemas created and deleted

   ✍️ Write
     register             add a new version to a subject
     check-compatibility  would this schema be accepted? (nothing registered)
     test-rules           do these records pass the data contract rules?
     validate             accepted by Schema Registry X, refused by Y? (throwaway registries)
     delete               a version, or the whole subject
     set-compatibility    relax or tighten the evolution rule (subject or global)
     set-mode             READWRITE, READONLY or IMPORT (subject or global)
     set-normalize, validate-new-schemas   registry-wide behaviour
     set-alias            point one subject name at another

   📦 Move
     export / import      a registry to a folder and back, keeping the ids
     compare              two registries (mdc clusters) or two contexts
     exporter             Schema Linking: create, list, status, pause…
     contexts             the contexts of the registry (--context on the commands)

   🔀 diff compares two versions (or a version and a file) field by field,
   with the verdict of each compatibility rule.

   🪄 derive-schema turns a sample payload into an avro, json schema or
   protobuf schema, which saves writing one by hand.

   A subject is normally named after the topic: <topic>-key and
   <topic>-value. 'playground topic delete' removes both along with the
   topic.

   🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-schema
   🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%94%B0-schema-not-found-after-a-cleanup
commands:

- name: list
  group: Schema
  filters:
  - schema_registry_running
  help: |-
    📋 List the subjects of the registry

    One line per subject: number of versions, latest version and its schema
    id, schema type, and the compatibility rule and mode in force. A 🌍
    marks a value inherited from the global setting of the registry
    (no subject-level rule), which is what applies when a producer
    registers a new version.

    🎓 Tip: the subject names tell you the subject name strategy of the
    producers: <topic>-value (TopicNameStrategy), <record name>
    (RecordNameStrategy) or <topic>-<record name> (TopicRecordNameStrategy).
  flags:
  - long: --prefix
    arg: prefix
    required: false
    help: |-
      🔎 Only the subjects starting with this prefix
  - long: --deleted
    required: false
    help: |-
      🧟 Include soft deleted subjects
  - &json
    long: --json
    required: false
    help: |-
      📗 Print the result as JSON, and nothing else
  - import: src/flags/verbose.yml
  - &context
    long: --context
    arg: context
    required: false
    help: |-
      🗂️ Schema Registry context (.europe, or europe): every call goes to /contexts/<context>/…

      The subjects exported by Schema Linking land in a context of the destination registry. Default: the default context.
  - import: src/flags/cluster.yml
  examples:
  - playground schema list
  - playground schema list --prefix orders --deleted
  - playground schema list --json | jq -r '.subjects[] | select(.compatibility_source == "subject") | .subject'

- name: get
  group: Schema
  filters:
  - schema_registry_running
  help: |-
    🔰 Get all schemas versions for specified subject (if --subject is not specified, all subjects will be used)

    🎓 Tip: --schema-only prints the schema alone (latest version, or
    --version), ready to be redirected to a file:

      playground schema get --subject orders-value --version 2 --schema-only > v2.avsc
  flags:
    - &subject
      long: --subject
      required: false
      arg: subject
      conflicts:
        - "id"
      completions:
        dynamic:
        - playground get-subject-list
      help: |-
        📛 Subject name

    - long: --id
      required: false
      validate: integer
      arg: id
      conflicts:
        - "subject"
        - "deleted"
        - "--version"
      help: |-
         💯 Schema id

         With --json, the subjects and versions using this id are added.

    - long: --version
      required: false
      arg: version
      conflicts:
        - "--id"
      help: |-
        🔢 Only this version of --subject: a number, or latest

    - long: --schema-only
      required: false
      conflicts:
        - "--json"
      help: |-
        📄 Print only the schema (pretty-printed avro / json schema, protobuf as is), without the log lines

        Needs --subject (latest version unless --version is set) or --id.

    - long: --json
      required: false
      conflicts:
        - "--schema-only"
      help: |-
        📗 Print the versions as a JSON array (subject, version, id, schemaType, schema, references, metadata, ruleSet, deleted), and nothing else

    - import: src/flags/verbose.yml

    - long: --deleted
      required: false
      conflicts:
        - "id"
      help: |-
        🧟 Include soft deleted subjects

    - long: --store-in-tmp
      help: store in /tmp folder
      arg: folder
      private: true
    - *context
    - import: src/flags/cluster.yml
  examples:
  - playground schema get
  - playground schema get --subject <SUBJECT>
  - playground schema get --subject <SUBJECT> --version latest --schema-only > schema.avsc
  - playground schema get --id 3 --json
  - playground schema get --deleted

- name: register
  group: Schema
  filters:
  - schema_registry_running
  help: |-
    ⏺️ Register a schema in specified subject

    Pushes a schema into the registry without producing any data, which is
    how you set up a subject before a connector starts, or add a new version
    to check whether it passes the compatibility rules.

    The format is detected from what you give it, avro, json schema or
    protobuf all work. Pass it on stdin with a quoted heredoc, or pick one of
    the bundled schemas with tab completion on --schema.

    Remember the naming convention: a topic's schemas live under the subjects
    <topic>-key and <topic>-value, not under the topic name.

    ☢️ --id forces a specific schema id and overwrites whatever is already
    registered at that id. It exists to reproduce id collisions, it is not
    something to use casually.
  flags:
    - &subject_required
      long: --subject
      required: true
      arg: subject
      completions:
        dynamic:
        - playground get-subject-list
      help: |-
        📛 Subject name
    - import: src/flags/verbose.yml
    - long: --schema
      arg: schema
      completions:
        dynamic:
        - playground get-predefined-schemas "$completion_current"
      default: "-"
      required: false
      help: |- 
        🔥 You can either:
        
        * Set your own schema (avro, json-schema, protobuf) with stdin (see example section). 

        * Use completion to select predefined schemas (or use your own schema file) 🎓 Tip: use <tab> completion to trigger fzf completion
    - long: --id
      required: false
      validate: integer
      arg: id
      help: |-
        ☢️ Force schema id

        ❗it will replace any schema which already exists at given id

    - long: --metadata-property
      arg: metadata-property
      help: |-
        🟡 Add metadata properties to schema contract
        
        See docs: https://docs.confluent.io/platform/current/schema-registry/fundamentals/data-contracts.html#metadata-properties

        🎓 Tip: you can pass multiple properties by specifying --metadata-property multiple times

        Example: --metadata-property "metadata1=value" --metadata-property "metadata2=value"
      required: false
      repeatable: true
    - long: --normalize
      help: |-
        🫧 Add ?normalize=true at the end of the request to normalize the schema. The default is false.
    - long: --rule-set
      arg: rule-set
      required: false
      help: |-
        📏 Data contract rules: a ruleSet json ({"domainRules": [...], "migrationRules": [...]}, a bare array of domain rules, or a {"ruleSet": {...}} request body), as @<file>, a file path or inline json

        See docs: https://docs.confluent.io/platform/current/schema-registry/fundamentals/data-contracts.html#rules
    - long: --rule
      arg: rule
      required: false
      repeatable: true
      help: |-
        📏 Shortcut for a CEL condition checked when producing: <name>:<CEL expression>, added to the domain rules (kind CONDITION, type CEL, mode WRITE)

        Example: --rule 'amountPositive:message.amount > 0' --rule 'hasCurrency:size(message.currency) == 3'

        ❕ The rules run in the clients (serializers with use.latest.version=true and the kafka-schema-rules jar), not in the registry: registering them never refuses a record.
    - *context
    - import: src/flags/cluster.yml

  examples: |
    playground schema register --subject test-protobuf << 'EOF'
    syntax = "proto3";
    
    package com.github.vdesabou;
    
    message Customer {
        int64 count = 1;
        string first_name = 2;
        string last_name = 3;
        string address = 4;
    }
    EOF

    playground schema register --subject orders-value --rule 'amountPositive:message.amount > 0' --schema @order.avsc

    playground schema register --subject orders-value --rule-set @rules.json --metadata-property owner=team-a --schema @order.avsc

    playground schema register --subject test-avro --metadata-property test=test --metadata-property test2=test << 'EOF'
    {
        "type": "record",
        "namespace": "com.github.vdesabou",
        "name": "Customer",
        "fields": [
            {
                "name": "count",
                "type": "long",
                "doc": "count"
            },
            {
                "name": "first_name",
                "type": "string",
                "doc": "First Name of Customer"
            },
            {
                "name": "last_name",
                "type": "string",
                "doc": "Last Name of Customer"
            },
            {
                "name": "address",
                "type": "string",
                "doc": "Address of Customer"
            }
        ]
    }
    EOF

- name: check-compatibility
  group: Schema
  filters:
  - schema_registry_running
  help: |-
    🧪 Check whether a schema would be accepted, without registering it

    Asks the registry the same question as a register (or a producer with
    auto.register.schemas=true) would, and prints its verdict with the
    reasons (READER_FIELD_MISSING_DEFAULT_VALUE, TYPE_MISMATCH…). Nothing
    is registered.

    Without --version, the schema is checked against what the rule of the
    subject says: the latest version, or every version with a
    *_TRANSITIVE rule. --compatibility evaluates it under another rule
    (in a temporary copy of the subject, permanently deleted afterwards).

    Exit code: 0 compatible, 1 not compatible, 2 the check could not be
    done (invalid schema, unknown version…).

    🎓 Tip: 'playground schema diff --subject <s> --to @<file>' shows
    field by field what changed and why a rule refuses it.
  flags:
  - *subject_required
  - long: --schema
    arg: schema
    completions:
      dynamic:
      - playground get-predefined-schemas "$completion_current"
    default: "-"
    required: false
    help: |-
      🔥 The schema to check (avro, json schema, protobuf): on stdin (default), @<file>, a file path, or the schema itself
  - long: --version
    arg: version
    required: false
    help: |-
      🔢 Check against this version only (a number, or latest), instead of what the rule of the subject checks
  - long: --compatibility
    arg: compatibility
    allowed:
      - BACKWARD
      - BACKWARD_TRANSITIVE
      - FORWARD
      - FORWARD_TRANSITIVE
      - FULL
      - FULL_TRANSITIVE
      - NONE
    required: false
    help: |-
      🛡️ Evaluate under this rule instead of the one of the subject
  - *json
  - import: src/flags/verbose.yml
  - *context
  - import: src/flags/cluster.yml
  examples: |
    playground schema check-compatibility --subject orders-value < customer-v2.avsc
    playground schema check-compatibility --subject orders-value --schema @customer-v2.avsc --compatibility FULL_TRANSITIVE
    playground schema check-compatibility --subject orders-value --version 1 --json < customer-v2.avsc

- name: diff
  group: Schema
  help: |-
    🔀 Compare two schemas field by field, with the verdict of each compatibility rule

    Shows what changed between two versions of a subject, a version and a
    file, or two files: ➕ added and ➖ removed fields (with or without a
    default), ✏️ type, default, enum symbol, field number or required
    changes, each with a hint on the rule it breaks. Avro (nested records,
    unions, enums, logical types), JSON Schema and Protobuf are supported.

    Then, when a Schema Registry is running, its verdict for BACKWARD,
    FORWARD and FULL (asked in a temporary subject, permanently deleted
    afterwards; a --from file not registered yet consumes a schema id).

    --from and --to take a version number, latest, id:<schema id>, or
    @<file>. Defaults: --to the latest version of --subject, --from the
    version before it (the latest one when --to is a file).
  flags:
  - long: --subject
    required: false
    arg: subject
    completions:
      dynamic:
      - playground get-subject-list
    help: |-
      📛 Subject of the versions to compare (not needed for id:<n> and @<file>)
  - long: --from
    arg: from
    required: false
    help: |-
      ⬅️ The old schema: a version number, latest, id:<schema id> or @<file>
  - long: --to
    arg: to
    required: false
    help: |-
      ➡️ The new schema: a version number, latest, id:<schema id> or @<file>
  - long: --no-verdict
    required: false
    help: |-
      🙅 Only the field-level diff, don't ask the registry for the compatibility verdicts
  - *json
  - import: src/flags/verbose.yml
  - *context
  - import: src/flags/cluster.yml
  examples: |
    playground schema diff --subject orders-value
    playground schema diff --subject orders-value --from 1 --to 3
    playground schema diff --subject orders-value --to @customer-v4.avsc
    playground schema diff --from @v1.avsc --to @v2.avsc --no-verdict
    playground schema diff --from id:12 --to id:15 --json

- name: describe
  group: Schema
  filters:
  - schema_registry_running
  help: |-
    🔎 Everything about one subject, or one schema id, in one call

    For a subject: the compatibility rule and mode in force (and whether
    they come from the subject or the global setting), its alias and other
    settings, every version (soft-deleted ones too) with its id and
    registration date, its references, the schemas that reference it (a
    version they use can't be deleted), the other subjects sharing the same
    schema id, metadata and rule set, and the subject name strategy its
    name suggests, with the topic it belongs to.

    For --id: the schema type, record name, and every subject and version
    using that id (what a consumer resolves from the id in a record).
  flags:
  - long: --subject
    required: false
    arg: subject
    conflicts:
      - "--id"
    completions:
      dynamic:
      - playground get-subject-list
    help: |-
      📛 Subject name
  - long: --id
    required: false
    validate: integer
    arg: id
    conflicts:
      - "--subject"
    help: |-
      💯 Schema id (the ValueSchemaId: of 'playground topic consume')
  - *json
  - import: src/flags/verbose.yml
  - *context
  - import: src/flags/cluster.yml
  examples:
  - playground schema describe --subject orders-value
  - playground schema describe --id 3
  - playground schema describe --subject orders-value --json | jq '.versions[] | select(.deleted)'

- name: history
  group: Schema
  help: |-
    📜 Timeline of the Schema Registry, from its _schemas topic

    Every registration, soft and permanent delete (and the ids that stop
    resolving because of it), compatibility, mode and setting change, with
    its date: answers "who deleted the schema, when, soft or hard?" and
    "when was the rule relaxed?".

    Reads the kafkastore topic of the running environment (_schemas, or
    _schemas_<name>_<namespace> with CFK, see --topic), or a dump with -f:
    the output of 'playground topic consume -t _schemas --json', or of
    kafka-console-consumer --topic _schemas --from-beginning
    --property print.key=true --property print.timestamp=true, which is
    what to ask a customer for.

    Not available on Confluent Cloud, which doesn't expose _schemas: use
    the audit logs of the organization instead.

    The temporary subjects of 'schema check-compatibility' and 'schema
    diff' are hidden (--include-temporary to show them).
  flags:
  - long: --subject
    required: false
    arg: subject
    completions:
      dynamic:
      - playground get-subject-list
    help: |-
      📛 Only the events of this subject (the ids are still tracked across subjects)
  - long: --since
    arg: since
    required: false
    help: |-
      🕰️ Only the events after: 12h, 30m, 2d, or a date (2026-10-31, 2026-10-31T10:00)
  - long: --file
    short: -f
    arg: file
    required: false
    help: |-
      📄 A dump of the _schemas topic instead of the running environment (JSON lines of 'topic consume --json', or kafka-console-consumer with print.key and print.timestamp)
  - long: --topic
    arg: topic
    required: false
    help: |-
      📛 The kafkastore.topic of the Schema Registry (default: _schemas, else the first topic starting with _schemas)
  - long: --include-temporary
    required: false
    help: |-
      👻 Also show the temporary subjects of check-compatibility and diff
  - *json
  - import: src/flags/verbose.yml
  - import: src/flags/cluster.yml
  examples:
  - playground schema history
  - playground schema history --subject orders-value --since 2d
  - playground schema history -f customer-schemas-dump.txt --json | jq .summary

- name: export
  group: Schema
  filters:
  - schema_registry_running
  help: |-
    📦 Export the subjects of the registry to a folder

    One file per version (<subject>/v<n>.avsc|json|proto, pretty-printed)
    and a manifest.json with the ids, versions, references, metadata, rule
    sets, and the subject-level compatibility, mode and alias. 'playground
    schema import' loads it into another registry with the same ids, so
    records copied from the source still decode.

    🎓 Tip: export into the folder of a reproduction model and add
    'playground schema import -f <the model folder>/schemas' before
    creating the connector: the model ships the customer's schemas.
  flags:
  - long: --subject-prefix
    arg: prefix
    required: false
    help: |-
      🔎 Only the subjects starting with this prefix
  - long: --output-dir
    short: -o
    arg: folder
    default: "schemas-export"
    required: false
    help: |-
      📁 Folder to write (created if needed, files of the same name are overwritten)
  - import: src/flags/verbose.yml
  - *context
  - import: src/flags/cluster.yml
  examples:
  - playground schema export -o /tmp/schemas
  - playground schema export --subject-prefix orders -o ./schemas

- name: import
  group: Schema
  filters:
  - schema_registry_running
  help: |-
    📥 Import schemas into the registry, keeping their ids

    Loads what a customer can send about their registry:

      - a folder (or .tgz / .zip) written by 'playground schema export'
      - a JSON array of versions: curl <registry>/schemas, or
        'playground schema get --json'
      - a dump of the _schemas topic ('playground topic consume -t _schemas
        --json', or kafka-console-consumer with print.key=true and
        print.timestamp=true): the last state of every live version

    Every version is registered in IMPORT mode with its original id and
    version number (in id order, so references exist first), then the
    subject goes back to its normal mode and gets the compatibility, mode
    and alias of the source. Records written with those ids decode here.

    ⚠️ IMPORT mode needs mode.mutability=true on the registry (the
    playground's has it), and an id already used by another schema here is
    refused (42205): import into a fresh registry, or use --new-ids.
  flags:
  - long: --file
    short: -f
    arg: file
    required: true
    help: |-
      📄 Export folder, .tgz / .zip of one, JSON array of versions, or _schemas dump
  - long: --on-conflict
    arg: action
    allowed: [skip, overwrite, merge]
    default: skip
    required: false
    help: |-
      🤝 What to do with a subject that already exists: skip it, overwrite it (permanently deleted first), or merge (versions added to it)
  - long: --new-ids
    required: false
    help: |-
      🆕 Let the registry assign new ids (no IMPORT mode): the schemas are the same, the ids in old records don't match
  - long: --with-global-settings
    required: false
    help: |-
      🌍 Also apply the global compatibility of the source
  - long: --subject-prefix
    arg: prefix
    required: false
    help: |-
      🔎 Only the subjects starting with this prefix
  - long: --dry-run
    required: false
    help: |-
      🧪 Show what would be imported, and the conflicts, without changing anything
  - import: src/flags/verbose.yml
  - *context
  - import: src/flags/cluster.yml
  examples:
  - playground schema import -f /tmp/schemas --dry-run
  - playground schema import -f customer-schemas.json --on-conflict overwrite
  - playground schema import -f customer-_schemas-dump.txt --new-ids

- name: test-rules
  group: Schema
  filters:
  - schema_registry_running
  help: |-
    📏 Test the data contract rules of a subject against records

    Sends each record through the real serializer (the console producer of
    the schema-registry container, use.latest.version=true) with the
    schema and rule set of the version, into a temporary topic and subject
    deleted afterwards: ✅ the record passes the rules, ❌ which rule
    failed and its expression (Rule failed: amountPositive, Expr failed:
    'message.amount > 0'). Nothing is written to the topics of the subject.

    Exit code: 0 when every record passes, 1 otherwise.

    ❕ The rules are only kept by a Schema Registry with
    resource.extension.class=io.confluent.kafka.schemaregistry.rulehandler.RuleSetResourceExtension
    ('playground schema register' warns when they were dropped). Plaintext
    environment only, schemas without references.
  flags:
  - *subject_required
  - long: --version
    arg: version
    default: latest
    required: false
    help: |-
      🔢 Version whose rules are tested (default: latest, what a producer with use.latest.version=true uses)
  - long: --record
    arg: record
    required: false
    repeatable: true
    help: |-
      📦 A record (json), repeatable; default: stdin, one json per line
  - *json
  - import: src/flags/verbose.yml
  examples: |
    playground schema test-rules --subject orders-value --record '{"id": 1, "amount": 5.0}' --record '{"id": 2, "amount": -1.0}'

    playground schema test-rules --subject orders-value < records.jsonl

- name: contexts
  group: Schema
  filters:
  - schema_registry_running
  help: |-
    🗂️ List the contexts of the registry, with their number of subjects and mode

    Contexts are separate namespaces of subjects and schema ids in one
    registry. Schema Linking exports into one (.<name>) on the
    destination: a consumer of the default context doesn't find those ids.
  flags:
  - *json
  - import: src/flags/verbose.yml
  - import: src/flags/cluster.yml
  examples:
  - playground schema contexts
  - playground schema contexts --cluster us --json

- name: compare
  group: Schema
  help: |-
    🔀 Compare the subjects of two registries (or two contexts)

    In an mdc-* environment, --from and --to are the clusters (europe and
    us by default); --from-context / --to-context pick a context on each
    side (the destination context of a Schema Linking exporter, typically).
    Elsewhere, compare two contexts of the registry.

    For each subject: ✅ same versions, schemas and ids; ⬅️ / ➡️ only on one
    side; ❌ missing versions, different schemas, or the same schema with
    another id (records written on one side don't decode on the other) and
    a different subject-level compatibility.

    Exit code: 0 identical, 1 different.
  flags:
  - long: --from
    arg: cluster
    allowed: [us, europe]
    required: false
    help: |-
      ⬅️ Cluster of the left side (mdc-* environments, default europe)
  - long: --to
    arg: cluster
    allowed: [us, europe]
    required: false
    help: |-
      ➡️ Cluster of the right side (mdc-* environments, default us)
  - long: --from-context
    arg: context
    required: false
    help: |-
      🗂️ Context of the left side (default: the default context)
  - long: --to-context
    arg: context
    required: false
    help: |-
      🗂️ Context of the right side (default: the default context)
  - long: --subject-prefix
    arg: prefix
    required: false
    help: |-
      🔎 Only the subjects starting with this prefix
  - *json
  - import: src/flags/verbose.yml
  examples:
  - playground schema compare --from europe --to us
  - playground schema compare --from europe --to us --to-context .europe
  - playground schema compare --from-context . --to-context .migrated --json

- name: exporter
  group: Schema
  help: |-
    🔗 Schema Linking: exporters that copy subjects to another registry

    An exporter runs in the source registry and copies the subjects it
    matches (with their ids) to the destination, continuously. With context
    type AUTO they land in the context .<exporter name>, with CUSTOM in
    --destination-context, with NONE in the default context.

    In an mdc-* environment, --cluster is the source and --to the
    destination (the other cluster by default). Elsewhere, set
    --destination-url (and --destination-auth).

    ⚠️ The source registry needs the exporter extension (resource.extension
    .class, kafkastore.update.handlers, password.encoder.secret): the
    commands say what to add when it is missing, and
    other/deep-dive-labs/docker-compose.mdc-plaintext.replication.yml
    enables it on both registries of mdc-plaintext.

    See https://docs.confluent.io/platform/current/schema-registry/schema-linking-cp.html
  commands:
  - name: create
    filters:
    - schema_registry_running
    help: |-
      🔗 Create an exporter, then wait until it runs
    flags:
    - &exporter_name
      long: --name
      arg: name
      required: true
      help: |-
        📛 Exporter name
    - long: --to
      arg: cluster
      allowed: [us, europe]
      required: false
      help: |-
        ➡️ Destination cluster in an mdc-* environment (default: the other one)
    - long: --destination-url
      arg: url
      required: false
      help: |-
        🌐 Url of the destination registry, as seen from the source registry
    - long: --destination-auth
      arg: user-info
      required: false
      help: |-
        🔑 <user>:<password> (or API key:secret) of the destination registry
    - long: --context-type
      arg: type
      allowed: [AUTO, CUSTOM, NONE]
      required: false
      help: |-
        🗂️ Where the subjects land: AUTO (.<exporter name>), CUSTOM (--destination-context) or NONE (default context). Default: CUSTOM with --destination-context, else AUTO
    - long: --destination-context
      arg: context
      required: false
      help: |-
        🗂️ Destination context for --context-type CUSTOM
    - long: --subjects
      arg: subjects
      required: false
      help: |-
        🔰 Comma separated subjects or patterns to export (default: *)
    - long: --subject-rename-format
      arg: format
      required: false
      help: |-
        ✏️ Rename the subjects in the destination, e.g. dc_${subject} (${subject} is replaced by the subject name)
    - import: src/flags/verbose.yml
    - import: src/flags/cluster.yml
    examples:
    - playground schema exporter create --name eu-to-us --cluster europe --to us --destination-context europe
    - playground schema exporter create --name to-dr --destination-url https://dr-registry:8081 --destination-auth user:password --subjects "orders-value,payments-*"
  - name: list
    filters:
    - schema_registry_running
    help: |-
      📋 List the exporters of the registry, with their state
    flags:
    - *json
    - import: src/flags/verbose.yml
    - import: src/flags/cluster.yml
    examples:
    - playground schema exporter list --cluster europe
    - playground schema exporter list --json
  - name: status
    filters:
    - schema_registry_running
    help: |-
      🚦 State of an exporter (RUNNING, PAUSED, ERROR with its trace), offset and number of objects exported

      Exit code 1 when the exporter is in ERROR, or PAUSED with a trace (it stopped on a failure: 'exporter create' fails then too).
    flags:
    - *exporter_name
    - long: --wait
      required: false
      help: |-
        ⏳ Wait (30 seconds at most) until the exporter is RUNNING, PAUSED or ERROR
    - *json
    - import: src/flags/verbose.yml
    - import: src/flags/cluster.yml
    examples:
    - playground schema exporter status --name eu-to-us --cluster europe
    - playground schema exporter status --name eu-to-us --wait --json
  - name: pause
    filters:
    - schema_registry_running
    help: |-
      ⏸️ Pause an exporter
    flags:
    - *exporter_name
    - import: src/flags/verbose.yml
    - import: src/flags/cluster.yml
    examples:
    - playground schema exporter pause --name eu-to-us --cluster europe
  - name: resume
    filters:
    - schema_registry_running
    help: |-
      ▶️ Resume a paused exporter
    flags:
    - *exporter_name
    - import: src/flags/verbose.yml
    - import: src/flags/cluster.yml
    examples:
    - playground schema exporter resume --name eu-to-us --cluster europe
  - name: reset
    filters:
    - schema_registry_running
    help: |-
      ⏮️ Reset a paused exporter: it exports everything again
    flags:
    - *exporter_name
    - import: src/flags/verbose.yml
    - import: src/flags/cluster.yml
    examples:
    - playground schema exporter reset --name eu-to-us --cluster europe
  - name: delete
    filters:
    - schema_registry_running
    help: |-
      🗑️ Delete a paused exporter (the exported schemas stay in the destination)
    flags:
    - *exporter_name
    - import: src/flags/verbose.yml
    - import: src/flags/cluster.yml
    examples:
    - playground schema exporter delete --name eu-to-us --cluster europe

- name: validate
  group: Schema
  help: |-
    🧪 Register schemas in a throwaway Schema Registry of each CP version, and compare the verdicts

    Answers "a schema registered years ago is refused after the upgrade"
    without upgrading anything: for each --cp-version, a Schema Registry
    container of that version starts next to the broker of the running
    environment (its own kafkastore topic, both deleted afterwards), and
    the schemas are registered in --subject in the order given, so a
    v1 then v2 also shows the compatibility checks of each version.

    Each registry starts empty with the default settings of its version
    (validation of new schemas is on since CP 8.2.0, with the stricter
    namespaces of Avro 1.12).

    Exit code: 0 when every schema is accepted by every version, 1
    otherwise. Needs a running docker environment (not ccloud / cfk). CP
    5.x / 6.0 registries can't talk to a CP 8 broker.
  flags:
  - long: --cp-version
    arg: version
    required: true
    repeatable: true
    help: |-
      🏷️ CP version of a Schema Registry to try (repeat it: --cp-version 7.9.2 --cp-version 8.2.0)
  - long: --schema
    arg: schema
    required: false
    repeatable: true
    help: |-
      🔥 A schema: @<file>, a file path or the schema itself (repeatable, registered in that order); default: stdin
  - long: --subject
    arg: subject
    default: validate-value
    required: false
    help: |-
      📛 Subject to register in (default validate-value)
  - long: --keep
    required: false
    help: |-
      🐳 Keep the Schema Registry containers and their topics (to look at their logs or settings)
  - *json
  - import: src/flags/verbose.yml
  examples: |
    playground schema validate --cp-version 7.9.2 --cp-version 8.2.0 < legacy.avsc

    playground schema validate --cp-version 7.9.2 --cp-version 8.4.0 --schema @v1.avsc --schema @v2.avsc --json

- name: get-compatibility
  filters:
  - schema_registry_running
  group: Schema
  help: |-
    🛡️ Get the compatibility rule in force

    The rule that decides whether a new schema version is accepted. When a
    producer fails with "Schema being registered is incompatible with an
    earlier schema", this is what rejected it.

    With --subject, the subject-level rule, or the global rule of the
    registry when the subject has none (the command says which one
    applies). With --global, the global rule.
  flags:
  - &subject_or_global
    long: --subject
    required: false
    arg: subject
    conflicts:
      - "--global"
    completions:
      dynamic:
      - playground get-subject-list
    help: |-
      📛 Subject name
  - &global
    long: --global
    required: false
    conflicts:
      - "--subject"
    help: |-
      🌍 The global setting of the registry, instead of one subject
  - *json
  - import: src/flags/verbose.yml
  - *context
  - import: src/flags/cluster.yml
  examples:
  - playground schema get-compatibility --subject orders-value
  - playground schema get-compatibility --global
  - playground schema get-compatibility --subject orders-value --json

- name: set-compatibility
  filters:
  - schema_registry_running
  group: Schema
  help: |-
    🛡️ Set the compatibility rule of a subject (--subject), or of the whole registry (--global)

    Overrides the rule for one subject, or changes the default of every
    subject without a rule of its own:

      BACKWARD     new schema can read data written with the previous one
      FORWARD      previous schema can read data written with the new one
      FULL         both
      NONE         anything is accepted
      *_TRANSITIVE checked against all past versions, not just the last

    Set it to NONE when you deliberately want to register an incompatible
    schema, typically to reproduce what it does to consumers downstream.
  flags:
  - *subject_or_global
  - *global
  - import: src/flags/verbose.yml
  - import: src/flags/compatibility-required.yml
  - *context
  - import: src/flags/cluster.yml
  examples:
  - playground schema set-compatibility --subject orders-value --compatibility NONE
  - playground schema set-compatibility --global --compatibility FULL

- name: get-mode
  filters:
  - schema_registry_running
  group: Schema
  help: |-
    🔏 Get the mode in force

    READWRITE normally; READONLY if registration has been frozen; IMPORT
    while schemas are being migrated with their original ids and versions.

    With --subject, the subject-level mode, or the global mode when the
    subject has none. With --global, the global mode of the registry.
  flags:
  - *subject_or_global
  - *global
  - *json
  - import: src/flags/verbose.yml
  - *context
  - import: src/flags/cluster.yml
  examples:
  - playground schema get-mode --subject orders-value
  - playground schema get-mode --global --json

- name: set-mode
  filters:
  - schema_registry_running
  group: Schema
  help: |-
    🔏 Set the mode of a subject (--subject), or of the whole registry (--global)

      READWRITE   the normal mode, schemas can be read and registered
      READONLY    freeze the subject, registration is refused
      IMPORT      allow registering schemas at a chosen id and version,
                  which is what a migration between registries needs

    ⚠️ To enable mode changes on a Schema Registry cluster, you must also set
    mode.mutability=true in the Schema Registry properties file before
    starting Schema Registry, otherwise this command is rejected.
  flags:
  - *subject_or_global
  - *global
  - import: src/flags/verbose.yml
  - long: --mode
    arg: mode
    allowed: 
      - IMPORT
      - READONLY
      - READWRITE
    required: true
    help: |-
      Schema Registry mode
  - *context
  - import: src/flags/cluster.yml
  examples:
  - playground schema set-mode --subject orders-value --mode READONLY
  - playground schema set-mode --global --mode READWRITE

- name: set-normalize
  filters:
  - schema_registry_running
  group: Schema
  help: |-
    🧽 Set normalize at schema registry level

    With normalization on, the registry rewrites a schema into a canonical
    form before storing it, so two schemas that differ only in field order,
    whitespace or the way defaults are written get the same id instead of
    creating a new version every time.

    This applies to the whole registry, not to one subject. Turn it on when
    an example keeps registering a new version of an unchanged schema.

    See https://docs.confluent.io/platform/current/schema-registry/fundamentals/serdes-develop/index.html#schema-normalization
  flags:
  - import: src/flags/verbose.yml
  - long: --value
    arg: value
    allowed: 
      - "true"
      - "false"
    required: true
    help: |-
      true or false
  - import: src/flags/cluster.yml
  examples:
  - playground schema set-normalize --value true


- name: validate-new-schemas
  filters:
  - schema_registry_running
  group: Schema
  help: |-
    🩺 Validate new schemas (default is true since CP 8.2.0)

    Controls whether the registry checks a schema is well formed before
    accepting it. Since CP 8.2.0 this is on by default, and Avro 1.12 added
    strict namespace validation, so schemas that a customer registered years
    ago can now be rejected on a newer version.

    Set it to false to reproduce what that customer had, or to let a legacy
    schema through while you investigate. It applies to the whole registry.

    See https://docs.confluent.io/cloud/current/sr/fundamentals/serdes-develop/index.html#supported-formats:~:text=Strict%20namespace%20validation%20with%20Avro%20version%201.12
  flags:
  - import: src/flags/verbose.yml
  - long: --value
    arg: value
    allowed: 
      - "true"
      - "false"
    required: true
    help: |-
      true or false
  - import: src/flags/cluster.yml
  examples:
  - playground schema validate-new-schemas --value false


- name: delete
  filters:
  - schema_registry_running
  group: Schema
  help: |-
    🧟 Delete schema

    Without --version the whole subject goes; with it, only that version.

    A plain delete is soft: the schema is hidden but its id and version
    number stay taken, so re-registering does not reuse them. Add
    --permanent to really remove it, which is what you need before
    re-creating the same subject from scratch.

    ❕ The registry requires a soft delete before a permanent one; with
       --permanent the command does both for you.

    The command fails (exit 1) when the registry refuses the delete, and
    lists the schemas that reference a version it can't delete (42206).

    🎓 Tip: --dry-run shows the versions and ids that would be deleted, and
    which ids would stop resolving after a permanent delete (old records
    written with them could not be deserialized any more).
  flags:
  - long: --subject
    required: true
    arg: subject
    completions:
      dynamic:
      - playground get-subject-list
    help: |-
      📛 Subject name to delete:
        
        if --version is provided, only that version will be deleted. Otherwise the complete subject will be deleted
  - long: --version
    required: false
    validate: integer
    arg: version
    help: |-
      🔢 Schema version of the provided subject to delete

      Can only be used when --subject is provided
  - long: --permanent
    required: false
    help: |-
      💀 Hard delete (default is soft delete)
  - long: --dry-run
    required: false
    help: |-
      🧪 Show what would be deleted, and its effect on the schema ids, without deleting anything
  - import: src/flags/verbose.yml
  - *context
  - import: src/flags/cluster.yml
  examples:
  - playground schema delete --subject orders-value --version 2
  - playground schema delete --subject orders-value --permanent --dry-run
  - playground schema delete --subject orders-value --permanent

- name: derive-schema
  group: Schema
  help: |-
    🪄 Derive a schema based on payload

    Give it one or more json records, on stdin or with --payload, and it
    works out a schema that covers them all. Much faster than writing an
    avro schema by hand, and it handles unions when a field has different
    types across records.

    The type is called Schema unless --name is set (--namespace for its
    namespace / protobuf package). Values that look like a date, a
    timestamp, a uuid, a decimal in a string or epoch milliseconds get a 💡
    hint with the logical type to use: the plugin only sees strings and
    numbers. --output-file writes the schema, --register --subject
    registers it.
  flags:
    - long: --payload
      arg: payload
      default: "-"
      required: false
      help: |-
        📦 Payload to derive schema from
    - long: --schema-type
      required: false
      default: "AVRO"
      arg: schema-type
      help: |-
          🧩 Schema Registry schema "type":

          - AVRO
          - JSON (json schema)
          - PROTOBUF

          Default is AVRO
      allowed: 
        - AVRO
        - JSON
        - PROTOBUF
    - long: --name
      arg: name
      required: false
      help: |-
        🏷️ Name of the top-level record / message (json schema: title), instead of Schema
    - long: --namespace
      arg: namespace
      required: false
      help: |-
        🏷️ Namespace of the record (protobuf: package)
    - long: --output-file
      short: -o
      arg: file
      required: false
      help: |-
        📄 Also write the schema to this file
    - long: --register
      required: false
      help: |-
        ⏺️ Register the schema in --subject (Schema Registry of the running environment)
    - long: --subject
      arg: subject
      required: false
      help: |-
        📛 Subject for --register
  examples: |
      playground schema derive-schema --name Order --namespace com.example -o order.avsc << EOF
      {"order_id": 1, "customer": "acme", "amount": 9.99, "created": "2026-10-31T10:00:00Z"}
      EOF

      playground schema derive-schema --payload @sample.json --register --subject orders-value

      playground schema derive-schema << EOF
      {"name": "Foo", "Age": {"int": 12}}
      {"name": "Bar", "Age": {"string": "12"}}
      {"sport": "Football"}
      {"_id":{"key":"AA"},"duration":{"numberInt":"240"},"employeeNumber":{"numberInt":"12345"},"isActive":"Y","plannedAbsenceKey":"AA","startTimeMin":{"numberLong":"11599920"}}
      EOF

      playground schema derive-schema --payload '{"sport": "Football"}' --schema-type PROTOBUF

- name: set-alias
  filters:
  - schema_registry_running
  group: Schema
  help: |-
    🔯 Set a subject alias

    Makes --alias point at --subject, so a client asking for the alias gets
    the real subject's schemas. That is how you let a consumer keep its own
    subject name while the data actually lives under another one, typically
    after a topic rename or a migration between registries.

    CP 7.4.1 or higher is required to have this feature.

    See https://docs.confluent.io/platform/current/schema-registry/fundamentals/index.html#subject-aliases
  flags:
  - long: --subject
    required: true
    arg: subject
    completions:
      dynamic:
      - playground get-subject-list
    help: |-
      📛 Subject name
  - long: --alias
    required: true
    arg: alias
    help: |-
      🔯 Alias name
  - import: src/flags/verbose.yml
  - *context
  - import: src/flags/cluster.yml
  examples:
  - playground schema set-alias --subject orders-value --alias legacy-orders-value

- name: get-alias
  filters:
  - schema_registry_running
  group: Schema
  help: |-
    🔯 Get subject alias

    Shows which real subject an alias resolves to. Use it when a client reads
    schemas that do not match the subject it asked for, the alias is often
    the missing piece.

    CP 7.4.1 or higher is required to have this feature.
  flags:
  - long: --alias
    required: true
    arg: alias
    completions:
      dynamic:
      - playground get-subject-list
    help: |-
      🔯 Alias name
  - *json
  - import: src/flags/verbose.yml
  - *context
  - import: src/flags/cluster.yml
  examples:
  - playground schema get-alias --alias legacy-orders-value
  - playground schema get-alias --alias legacy-orders-value --json

- name: metrics
  filters:
  - not_ccloud_environment
  - not_cfk_environment
  help: |-
    📈 Display the key JMX metrics of Schema Registry

    Whether it is the leader, requests per second, client (4xx) and server
    (5xx) errors, average and p99 request latency, active connections, registered
    schemas, and the Avro / JSON / Protobuf schemas created and deleted
    since it started. ⚠️ marks the values to look at.

    Answers "is Schema Registry slow or failing requests?" and "how many
    schemas were registered or deleted?", next to 'playground schema list'
    for the subjects themselves.

    Read over JMX in the schema-registry container, with jmxterm (no
    restart, nothing to install).

    🎓 Tip: every metric of the container: playground get-jmx-metrics -c
    schema-registry --domain kafka.schema.registry

    🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-observability
  flags:
  - long: --json
    required: false
    help: |-
      📗 Print the raw values as JSON, and nothing else
  - import: src/flags/verbose.yml
  - import: src/flags/cluster.yml
  examples:
  - playground schema metrics
  - playground schema metrics --json
