name: zendesk
expose: always
help: |-
  🎫 Set up and check the Zendesk account of the Zendesk examples (connect-zendesk-source, fm-zendesk-source)

    setup   validate and store ZENDESK_URL, ZENDESK_USERNAME and ZENDESK_PASSWORD
    check   verify them in a few seconds: the login (users/me, the <email>/token form) and the tickets the sources read

  Nothing to configure in Zendesk: these examples only need the values,
  in the right form, still valid (a trial account ends after 14 days).

  📖 https://kafka-docker-playground.io/#/how-to-use?id=%e2%98%81%ef%b8%8f-accounts-of-the-examples
commands:
- name: setup
  help: |-
    🛠️ Validate and store the Zendesk account of the Zendesk examples (connect-zendesk-source, fm-zendesk-source)

    Takes ZENDESK_URL, ZENDESK_USERNAME and ZENDESK_PASSWORD from the environment, then the secrets store, else asks
    for them (secrets without echo), puts them in the form the examples use,
    validates them (the login (users/me, the <email>/token form) and the tickets the sources read), then stores them with 'playground secrets set'.
    Nothing is stored when the login fails.
  flags:
  - long: --no-store
    help: |-
      📋 Print the export commands instead of storing the variables
  examples:
  - playground account zendesk setup
- name: check
  help: |-
    🩺 Check the Zendesk account of the Zendesk examples (connect-zendesk-source, fm-zendesk-source)

    Read-only, a few seconds: the login (users/me, the <email>/token form) and the tickets the sources read. Each failure says why (a trial account ends after 14 days...)
    and which examples it breaks.

    Exits with 1 when the login fails.
  examples:
  - playground account zendesk check
