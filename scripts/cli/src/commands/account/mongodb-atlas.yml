name: mongodb-atlas
expose: always
help: |-
  🍃 Set up and check the MongoDB Atlas account of the MongoDB Atlas examples (fm-mongodb-atlas-sink, fm-mongodb-atlas-source)

    setup   validate and store MONGODB_ATLAS_HOST, MONGODB_ATLAS_USER and MONGODB_ATLAS_PASSWORD
    check   verify them in a few seconds: the mongodb+srv record of the host and a ping with mongosh (mongo image)

  Nothing to configure in MongoDB Atlas: these examples only need the values,
  in the right form, still valid (M0 clusters pause after 60 days without connections).

  📖 https://kafka-docker-playground.io/#/how-to-use?id=%e2%98%81%ef%b8%8f-accounts-of-the-examples
commands:
- name: setup
  help: |-
    🛠️ Validate and store the MongoDB Atlas account of the MongoDB Atlas examples (fm-mongodb-atlas-sink, fm-mongodb-atlas-source)

    Takes MONGODB_ATLAS_HOST, MONGODB_ATLAS_USER and MONGODB_ATLAS_PASSWORD from the environment, then the secrets store, else asks
    for them (secrets without echo), puts them in the form the examples use,
    validates them (the mongodb+srv record of the host and a ping with mongosh (mongo image)), then stores them with 'playground secrets set'.
    Nothing is stored when the login fails.
  flags:
  - long: --no-store
    help: |-
      📋 Print the export commands instead of storing the variables
  examples:
  - playground account mongodb-atlas setup
- name: check
  help: |-
    🩺 Check the MongoDB Atlas account of the MongoDB Atlas examples (fm-mongodb-atlas-sink, fm-mongodb-atlas-source)

    Read-only, a few seconds: the mongodb+srv record of the host and a ping with mongosh (mongo image). Each failure says why (M0 clusters pause after 60 days without connections...)
    and which examples it breaks.

    Exits with 1 when the login fails.
  examples:
  - playground account mongodb-atlas check
