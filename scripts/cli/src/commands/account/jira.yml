name: jira
expose: always
help: |-
  📋 Set up and check the Jira account of the Jira examples (connect-jira-source, fm-jira-source)

    setup   validate and store JIRA_URL, JIRA_USERNAME and JIRA_API_TOKEN
    check   verify them in a few seconds: the login (myself) and the projects the sources read

  Nothing to configure in Jira: these examples only need the values,
  in the right form, still valid (API tokens expire).

  📖 https://kafka-docker-playground.io/#/accounts
commands:
- name: setup
  help: |-
    🛠️ Validate and store the Jira account of the Jira examples (connect-jira-source, fm-jira-source)

    Takes JIRA_URL, JIRA_USERNAME and JIRA_API_TOKEN from the environment, then the secrets store, else asks
    for them (secrets without echo), puts them in the form the examples use,
    validates them (the login (myself) and the projects the sources read), then stores them with 'playground secrets set'.
    Nothing is stored when the login fails.
  flags:
  - long: --no-store
    help: |-
      📋 Print the export commands instead of storing the variables
  examples:
  - playground account jira setup
- name: check
  help: |-
    🩺 Check the Jira account of the Jira examples (connect-jira-source, fm-jira-source)

    Read-only, a few seconds: the login (myself) and the projects the sources read. Each failure says why (API tokens expire...)
    and which examples it breaks.

    Exits with 1 when the login fails.
  examples:
  - playground account jira check
