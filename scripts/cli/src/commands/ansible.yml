name: ansible
expose: always
group: Ansible
help: |-
  🅰️ cp-ansible commands (ansible and ansible-sasl-ssl environments)

  The day-2 operations of a cluster deployed by cp-ansible: change the
  inventory, run the playbook again, upgrade Confluent Platform.

    playbook    run confluent.platform.all (or another playbook) again
    inventory   read and change environment/ansible/inventory/hosts.yml
    add-host    add hosts to the running cluster (brokers, controllers, workers...)
    upgrade     move the cluster to another Confluent Platform version

  After each playbook run, the cluster is handed over to the playground
  commands again (wrappers of the binaries of the new version, client
  security of each host, CA of the https REST APIs).

  🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-ansible
commands:

- name: playbook
  group: Ansible
  filters:
  - ansible_environment
  help: |-
    ▶️ Run the playbook again on the hosts

    Runs ansible-playbook -i /inventory/hosts.yml confluent.platform.all in
    the ansible-controller container, writes the output to
    /tmp/playground-ansible-playbook.log, prints the PLAY RECAP and, when it
    fails, the error of each host. Then hands the cluster over to the
    playground commands again.

    --rolling sets deployment_strategy=rolling: one host at a time, what the
    cp-ansible procedures use to change a running cluster (upgrades,
    security changes).
  flags:
  - long: --limit
    arg: hosts
    help: 🖥️ Only these hosts or groups (ansible --limit), for example connect or kafka_broker
  - long: --tags
    arg: tags
    help: 🏷️ Only the tasks with these tags (ansible --tags), for example kafka_broker
  - long: --skip-tags
    arg: tags
    help: 🏷️ Skip the tasks with these tags (ansible --skip-tags), for example package
  - long: --rolling
    help: 🔁 One host at a time (-e deployment_strategy=rolling)
  - long: --playbook
    arg: playbook
    default: "confluent.platform.all"
    help: 📒 Playbook of the confluent.platform collection (confluent.platform.restart, confluent.platform.health_check, confluent.platform.fetch_logs...)
  - long: --verbose
    short: -v
    help: 🐞 ansible-playbook -vvv
  catch_all:
    label: ansible-playbook arguments
    help: other arguments of ansible-playbook, after --, for example -- -e kafka_broker_custom_properties_sync=true
  examples:
  - playground ansible playbook
  - playground ansible playbook --limit connect
  - playground ansible playbook --rolling --skip-tags package
  - playground ansible playbook --playbook confluent.platform.restart --limit kafka_broker
  - playground ansible playbook -- -e deployment_strategy=rolling -e pause_rolling_deployment=true

- name: inventory
  group: Ansible
  help: |-
    📋 Read and change the inventory of the ansible environment

    environment/ansible/inventory/hosts.yml, generated by the environment
    (or adapted from --ansible-inventory). Paths are yq paths, values are
    yaml (numbers, booleans, maps and lists keep their type). Changes are
    applied by the next 'playground ansible playbook'.
  commands:

  - name: get
    group: Ansible
    filters:
    - ansible_environment
    help: 🔎 Display the inventory, or the value of a yq path
    args:
    - name: path
      required: false
      help: yq path, for example .all.vars.confluent_package_version
    examples:
    - playground ansible inventory get
    - playground ansible inventory get .all.vars.confluent_package_version
    - playground ansible inventory get .all.children.kafka_connect.vars

  - name: set
    group: Ansible
    filters:
    - ansible_environment
    help: |-
      ✏️ Set the value of a yq path, and print the change

      🎓 Tip: then 'playground ansible playbook' (--limit <host> to apply it
      to one host only)
    args:
    - name: path
      required: true
      help: yq path, for example .all.vars.sasl_protocol
    - name: value
      required: true
      help: |-
        yaml value, for example plain, true, 100, or '{"num.partitions": 6}'
    examples:
    - playground ansible inventory set .all.vars.ssl_enabled true
    - |-
      playground ansible inventory set '.all.children.kafka_broker.vars.kafka_broker_custom_properties["num.partitions"]' 6
    - |-
      playground ansible inventory set .all.vars.kafka_broker_custom_listeners '{"client": {"name": "CLIENT", "port": 9093}}'

  - name: delete
    group: Ansible
    filters:
    - ansible_environment
    help: 🗑️ Remove a yq path from the inventory, and print the change
    args:
    - name: path
      required: true
      help: yq path, for example .all.vars.sasl_protocol
    examples:
    - playground ansible inventory delete .all.vars.sasl_protocol

- name: add-host
  group: Ansible
  filters:
  - ansible_environment
  help: |-
    🖥️ Add hosts to the running cluster

    Starts the containers of the hosts (empty hosts: systemd and a JDK) and
    adds them to their group of the inventory, with the JMX port they have in
    the other environments. Then deploy them with 'playground ansible
    playbook --limit <hosts>': the running hosts are not touched.

    Hosts: broker2, broker3, controller2, controller3 (dynamic KRaft quorum
    only), connect2, connect3, ksqldb-server, rest-proxy, control-center.
  args:
  - name: host
    required: true
    repeatable: true
    allowed: [broker2, broker3, controller2, controller3, connect2, connect3, ksqldb-server, rest-proxy, control-center, zookeeper2, zookeeper3]
    help: 🖥️ Host to add
  examples:
  - playground ansible add-host broker2 broker3
  - playground ansible add-host ksqldb-server

- name: upgrade
  group: Ansible
  filters:
  - ansible_environment
  help: |-
    ⬆️ Upgrade (or downgrade) Confluent Platform with cp-ansible

    Downloads the archive of the version to the cache (installation_method
    archive), sets confluent_package_version (and confluent_archive_file_source)
    in the inventory, installs the confluent.platform collection of the same
    major.minor in the controller (or --ansible-cp-version), then runs the
    playbook with deployment_strategy=rolling: one host at a time, the
    procedure of cp-ansible.
  flags:
  - long: --to
    arg: version
    required: true
    help: 🎯 Confluent Platform version, for example 8.4.1
  - long: --ansible-cp-version
    arg: version
    help: 🅰️ Version of the confluent.platform collection (default the latest patch of the same major.minor)
  - long: --parallel
    help: ⚡ Every host at once (deployment_strategy=parallel, the default of cp-ansible), instead of rolling
  - long: --no-playbook
    help: ⏸️ Only change the inventory and the collection, run the playbook yourself
  examples:
  - playground ansible upgrade --to 8.4.1
  - playground ansible upgrade --to 8.4.1 --ansible-cp-version 8.4.0
