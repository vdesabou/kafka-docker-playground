long: --ansible-inventory
arg: ansible-inventory
validate: file_exists
help: |-
  📋 ansible and ansible-sasl-ssl environments only: the cp-ansible inventory (hosts.yml) of the customer, deployed instead of the generated one

  Its variables are kept (all.vars, group vars, host vars: listeners, security, custom properties, confluent_package_version, installation_method...), its hosts become the playground hosts (the n-th host of kafka_broker is broker, broker2, broker3...), and only what cannot work here is changed and printed: connection variables (ansible_host, ansible_user, ansible_ssh_*, ansible_become*), host names of the customer in the variables, vault values (no vault password), customer certificates (ssl_custom_certs: the certificates are generated by cp-ansible), customer package mirrors.

  Also settable with ANSIBLE_CUSTOMER_INVENTORY environment variable.
