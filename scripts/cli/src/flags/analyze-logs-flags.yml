- long: --file
  short: -f
  required: false
  repeatable: true
  arg: file
  completions:
    dynamic:
    - playground get-log-files-with-fzf "$completion_current"
  help: |-
    🗒️  Log file, folder, .zip, .tar(.gz|.bz2|.xz), .7z or .gz file to analyze

    🎓 Tip: can be set several times. TAB lists the log files, exports, archives and folders of Downloads, Desktop and the current folder, newest first
- long: --from-containers
  required: false
  conflicts: [--sample]
  help: |-
    🐳 Analyze the logs of the running example: the logs of its containers (the pods of the namespace confluent with the cfk environment, previous logs of restarted pods included) are saved in /tmp/playground-container-logs-<example>-<date>/, one <container>.log each, then analyzed as a folder: the full report (restarts, rebalances, configs, connectors, --connector, --since...), not only the digest of 'playground container logs --errors'. ☕ The JDK of each container (java -version) joins the one the logs give

    🎓 Tip: --container keeps some of them. The folder is kept: give it to --compare after a fix, or to a colleague
- long: --container
  required: false
  repeatable: true
  unique: true
  arg: container
  needs: [--from-containers]
  completions:
    dynamic:
    - playground get-container-list
  help: |-
    🐳 With --from-containers, only the logs of this container (or pod with the cfk environment), instead of all of them

    🎓 Tip: can be set several times
- long: --compare
  required: false
  repeatable: true
  arg: before
  completions:
    dynamic:
    - playground get-log-files-with-fzf "$completion_current"
  help: |-
    🔁 Compare with another input: the logs before a fix, another worker, the day before. A log file, folder or archive
    (analyzed with the same --connector, --with-worker, --errors-only, --include-harmless, --include-warnings, --ocr and
    --sanitize, not --since / --until: it covers another period), or a JSON written by --json

    The report says what is new, gone, growing or shrinking: root causes, known causes, connectors and the totals by level
    (per hour when the two inputs cover different periods), in a 🔁 Comparison section, the terminal summary and
    .comparison of --json

    🎓 Tip: can be set several times, oldest first (-f day3 --compare day1 --compare day2): the comparison is with the last
    one, and a 📈 Trend gives the totals and the main root causes of every input in order (.trend of --json)
- long: --sample
  short: -s
  required: false
  repeatable: true
  conflicts: [--from-containers]
  arg: sample
  allowed: [connect_task_failure, connect_many_connectors, support_bundle, broker_pressure, jvm_dumps, kafka_streams, kafka_clients, compare_fix, cfk_bundle, cfk_kraft_migration, cfk_rollout, cfk_rollout_after]
  help: |-
    🧪 Sample of tools/log-analyzer/samples and cfk-analysis/samples

      connect_task_failure   Connect worker log: Oracle XStream connector with a wrong password, an unknown
                             outbound server, and a task failing after the outbound server was stopped
      connect_many_connectors  Connect worker (CP 8.1.2) with 8 connectors: JDBC Oracle sink killed on ORA-00942,
                             JDBC PostgreSQL source refused, S3 Access Denied, Elasticsearch malformed documents,
                             Debezium MySQL binlog purged, HTTP 503, ServiceNow 429, a custom connector; 3 of them
                             below the minimum version supported on CP 8.1 (🛟), icons, connector cards
      support_bundle         .zip with that log and a gzipped broker log
      broker_pressure        logs of 3 brokers while broker 3 falls behind (ISR shrink storm, fetch errors and
                             request timeouts of its followers, log cleaner died, responses to clients already
                             gone) with their kafka-topics --describe and kafka-log-dirs outputs: 🐢 broker
                             signals on the timeline, 🗺️ cluster layout (leader skew, under-replicated
                             partitions, a log dir offline, disk skew)
      jvm_dumps              that Connect log with 3 thread dumps of a JVM (deadlock, contention, stuck task,
                             CPU-hungry thread, growing pool) and a heap dump: 🧵 thread dumps analyzed in the
                             report, 🔬 the heap dump command at the top
      kafka_streams          logs of the 3 instances of other/kafka-streams (serde-errors.sh): an application in
                             ERROR after a poison pill, its dead stream thread, deserialization and production
                             handler errors, the 🌊 Kafka Streams section (state, rebalances, tasks, timeline)
      compare_fix            the log of a Connect worker the day after a fix, compared with the day before
                             (--compare): errors gone, a new one, rebalances growing
      kafka_clients          logs of the non-Java clients (C/C++, Python, Go, .NET, JavaScript, KafkaJS, Rust) of
                             other/client-*: a broker that refuses connections or does not resolve, records
                             timed out, an unknown property, and crashes (Python traceback, .NET unhandled
                             exception, Go and Rust panics, uncaught Node.js error)
      cfk_bundle             CFK support bundle: kafka-2 crash-looping on an expired certificate, pending volume,
                             OOMKilled Connect pod, failed connector task, Schema Registry authentication
                             failure, operator reconcile errors
      cfk_kraft_migration    CFK support bundle: ZooKeeper to KRaft migration (KRaftMigrationJob) stuck for 3
                             days in SETUP, the KRaftController missing inter replication credentials
      cfk_rollout            CFK support bundle: CP upgrade half done (KRaftController still blocked, Kafka roll
                             stuck at 2/3), operator pod refused by the ResourceQuota, stale "Reconcile is
                             blocked" conditions, operator log that starts after the last change
      cfk_rollout_after      the same cluster the next day (quota raised, KRaftController unblocked, roll
                             complete): --sample cfk_rollout --sample cfk_rollout_after compares the two
- long: --errors-only
  required: false
  conflicts: [--include-warnings]
  help: |-
    🔴 Only the ERROR/FATAL records: the WARN records are reported by default (the Kafka clients log some real problems at WARN: consumer poll timeout, records expiring in the producer, network errors), sorted after the errors
- long: --ocr
  required: false
  help: |-
    📷 Read the screenshots of the input by OCR (.png, .jpg, .gif, .bmp, .tiff, .webp, .heic, and the pictures of a Word document): the Vision framework of macOS (offline, compiled once into ~/.cache/playground), else tesseract (brew install tesseract, apt install tesseract-ocr), else tesseract in a container built on first use. Their lines are digested as "<picture> (📷 OCR)": approximate, a character can be misread, check the picture before quoting a value. Without it, the screenshots are listed in 🧰 Other files of the input
- long: --include-harmless
  required: false
  help: |-
    🙈 Keep the known harmless records (telemetry not set up, Self-Balancing on a KRaft controller node, Jersey startup notices…): left out by default, counted in a 🙈 Known harmless section of the report and in .harmless of --json
- long: --include-warnings
  required: false
  conflicts: [--errors-only]
  help: |-
    🟠 Kept for compatibility: the WARN records are reported by default (--errors-only to leave them out). With a CFK support bundle, also the WARN log records that match no known category
- long: --max-findings
  arg: max_findings
  required: false
  validate: integer
  default: "40"
  help: |-
    ✂️ Maximum number of distinct records to show per file (default 40). The HTML report and --json have them all
- long: --since
  arg: since
  required: false
  help: |-
    ⏱️ Only the lines logged at or after this time: "2026-11-06 10:00", "2026-11-06T10:00:00" or "2026-11-06". The times
    are compared as written in the logs, and the epoch times of the librdkafka lines ("%3|1793896102.923|…") as UTC; a
    line without its own time (a stack frame) follows the line before it, the lines before the first time of a file
    follow it. A file where no time is found is analyzed whole, with a warning, rather than dropped. The line numbers
    of the digest and of the report stay those of the files
- long: --until
  arg: until
  required: false
  help: |-
    ⏱️ Only the lines logged before this time (same formats as --since)
- long: --output-dir
  short: -o
  arg: output_dir
  required: false
  default: "./log-analysis-output"
  help: |-
    📂 Output directory for the HTML report (default: ./log-analysis-output), with a <report>-files/ folder next to it: a page per file with findings, which the file names and line numbers of the report open (✏️ in the editor of playground config editor)
- long: --json
  required: false
  help: |-
    🗂️  Output JSON on stdout: summary, findings, root causes and every distinct record (text digest on stderr, no HTML report)

    "type": "logs", with the analysis of each CFK support bundle found in "cfk_bundles"; "type": "cfk-bundle" (issues with their recommendation, environment, timeline) when the input is one CFK bundle
- long: --logs-only
  required: false
  help: |-
    📜 Do not detect CFK support bundles: every file of the input read as logs. By default, a CFK bundle gives one report: its *.log files (pod and operator logs) in the log digest, and its ☸️ sections (pods, custom resources, events, versions, recent changes). Use it when a folder is taken for a CFK bundle by mistake (a confluent-operator-*.log or the YAML of a platform.confluent.io resource at its top): only its *.log files would be read, a log named connect.out or stdout.txt would be left out. Without Docker, the bundle is still read: its pod logs, without its ☸️ sections
- long: --connector
  short: -c
  required: false
  repeatable: true
  arg: connector
  help: |-
    🔌 Only keep the records and the configuration of this connector ([connector|task-0] / [connector|worker] context of the log lines, WorkerSourceTask{id=connector-0}), in the digest, the summary, the HTML report and the JSON

    🎓 Tip: can be set several times. The 🔌 by connector line of the summary lists the names
- long: --with-worker
  required: false
  help: |-
    🧱 With --connector, also keep the records and configs without connector context (worker, clients of the worker, Kafka)
- long: --show-config
  required: false
  arg: name
  help: |-
    ⚙️ Print the configuration logged at startup (last dump, with the keys changed between restarts) as key = value: for a connector, its own configs (a config contained in a bigger one with the same values is only named, its producer / consumer / admin clients summed up in one line); for a config class (ProducerConfig, DistributedConfig…) or a client id, every match
- long: --json-sections
  required: false
  arg: sections
  help: |-
    🗂️ With --json, only these sections, comma separated: summary, findings, known_causes, root_causes, files, files_without_findings, coverage, configuration, timeline, connectors, comparison, trend, lifecycle, config_lint, other_files, thread_dumps, heap_dumps, cluster_layout, fixed_bugs, task_workers, data_to_request, config_drift, harmless, redaction_summary, kafka_streams, overview, cfk_bundles, cfk_comparison (default: all). For example --json-sections summary,findings,root_causes
- long: --component
  required: false
  repeatable: true
  arg: component
  allowed: [kafka, kraftcontroller, zookeeper, connect, schemaregistry, ksqldb, controlcenter, kafkarestproxy, operator, other]
  help: |-
    🧩 CFK support bundle: only keep the issues of this component (repeat --component for several). other = not a CFK component (nodes, volumes, unknown pods)
- long: --severity
  required: false
  arg: level
  allowed: [critical, high, medium, low]
  help: |-
    🎚️  CFK support bundle: only keep the issues of this severity or above (critical | high | medium | low)
- long: --problem
  short: -p
  arg: problem
  required: false
  help: |-
    🎯 CFK support bundle: the problem the customer reports, in your own words: component, symptom and since when (example: "connect-0 keeps restarting since 14 Oct 08:30, orders-sink failed")

    Matched against the bundle (keywords and dates, no AI): the components and CR / pod names (connect, kafka, kraft, schema registry, operator, connect-0…), the symptoms (roll / upgrade stuck, crash / restarts, pending, memory / OOM, TLS, auth / RBAC, KRaft migration, connector failed, slow / lag / hang, disk, network) and the dates it recognizes (2026-10-14 08:30, 14 Oct, Oct 14, yesterday, 3 hours ago). The issues that match come first, marked 🎯, with a verdict: explained, partly explained, not explained, or not covered (the logs of the bundle do not cover the date), the changes of the CRs before the date and the logs that start after it. Terminal, HTML report and "problem" in --json. It also adds what to request for these symptoms to the 📥 Data to request section
- long: --sanitize
  required: false
  help: |-
    🔒 Replace passwords and other secrets, IPs, hostnames, emails and LDAP DNs by placeholders (<REDACTED>, <IP-1>, <HOST-1>…) in the digest, the HTML report, the JSON and the CFK bundle analysis. What holds the raw lines is not written, so it is not in the 📦 .zip of the report either: the file pages, 🔎 the search of every line, the full 🧵 thread reports (their summary in the report is sanitized)

    ⚠️ Use it before sharing the output outside Confluent (best effort: review it anyway). Off by default: it can hide evidence (a dump of bytes taken for a secret, the IP of the broker) and doubles the time on large bundles
- long: --no-sanitize
  required: false
  private: true
  help: |-
    Kept for compatibility: the output is not sanitized by default, see --sanitize
