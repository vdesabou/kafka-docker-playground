name: playground
version: 1.0.0
dependencies:
  docker: visit https://docs.docker.com/get-docker to install
help: |-
  🧠 CLI for Kafka Docker Playground 🐳

  👉 Check documentation https://kafka-docker-playground.io/#/cli
filters:
- docker_running

# Use bash code here directly or a function name that references code elsewhere.
help_header_override: |
  echo
  echo $'██████  ██       █████  ██    ██  ██████  ██████   ██████  ██    ██ ███    ██ ██████  '
  echo $'██   ██ ██      ██   ██  ██  ██  ██       ██   ██ ██    ██ ██    ██ ████   ██ ██   ██ '
  echo $'██████  ██      ███████   ████   ██   ███ ██████  ██    ██ ██    ██ ██ ██  ██ ██   ██ '
  echo $'██      ██      ██   ██    ██    ██    ██ ██   ██ ██    ██ ██    ██ ██  ██ ██ ██   ██ '
  echo $'██      ███████ ██   ██    ██     ██████  ██   ██  ██████   ██████  ██   ████ ██████  '
  echo
  
flags:
- long: --vvv
  short: -v
  help: |
    🐛 set verbose output (set -x)

    ❗ it can print sensitive information ❗

- long: --output-level
  short: -o
  arg: level
  allowed: [INFO, WARN, ERROR]
  required: false
  help: |-
    ❕Log level used by all commands

    Default is INFO (all INFO, WARN and ERROR will be printed in command output)

commands:

- name: help
  help: Show help about a command
  args:
  - name: command
    help: 🆘 Help command

- name: status
  help: |-
    🗺️ Show a status

    A single screen answering "what is running right now, and is it healthy":
    the example currently running and its documentation link, the version of
    every connector, the status and configuration of each of them, the topics
    that exist, and whether an EC2 instance of yours is still up.

    Everything comes from the running containers and from playground.ini, so
    it is also the quickest way to get back your bearings after a break.

