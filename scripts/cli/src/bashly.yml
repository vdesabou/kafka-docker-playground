  - name: gc-logs
    help: |-
      📈 Analyze JVM Garbage Collection logs

      📊 Parses GC logs from local files / folders or a running container: pause statistics, Full GC and evacuation / concurrent mode failures, live set, heap floor trend (leak), allocation stalls, GC causes, and recommendations backed by a finding (Kafka-aware: compared with Kafka's own G1 settings).

      🔖 Supports JDK 7–21+ and all major collectors: G1GC, CMS, ZGC, Generational ZGC, Shenandoah, ParallelGC, SerialGC, in legacy (-XX:+PrintGCDetails) and unified (-Xlog:gc*) formats, any decoration

      🔄 Pass every rotated file (kafkaServer-gc.log, .log.0…, .gz) or their folder: files are ordered by timestamp and split by JVM restart, the latest run is analyzed (--run to pick another)

      🧪 With --sample, it analyzes the samples shipped in gc-analysis/samples: a quick way to see what it reports.

      🔖 Exit code is 0 when the analysis completed, 2 when no GC event was found

      🌐 Also writes a self-contained HTML dashboard (pause timeline, heap before / after GC, pause distribution, KPI cards, recommendations; no external resource) in --output-dir, opened in the browser in an interactive terminal

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-jvm-diagnostics
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%E2%99%BB%EF%B8%8F-long-gc-pauses-or-a-memory-leak-analyze-gc-logs
    flags: &analyze_gc_logs_flags
      - long: --file
        short: -f
        required: false
        repeatable: true
        arg: file
        validate: file_or_dir_exists
        completions:
          dynamic:
          - playground get-specific-file-extension "$completion_current" --extension "log"
        help: |-
          🗒️  GC log file or folder to analyze (repeat --file for the rotated files of the same JVM)

          ❕ Provide only one of --file, --container and --sample

          🎓 Tip: use <tab> completion to trigger fzf completion
                  use <option+enter> to use the value you typed manually
      - long: --sample
        short: -s
        required: false
        repeatable: true
        arg: sample
        allowed: [jdk7_parallel, jdk8_cms, jdk8_cms_cmf_real, jdk8_g1gc, jdk8_g1gc_details_real, jdk11_zgc, jdk17_g1gc, jdk17_shenandoah, jdk21_g1_kafka_real, jdk21_genzgc, jdk21_genzgc_real]
        help: |-
          🧪 Sample of gc-analysis/samples (repeat --sample to analyze several)

            GC logs of JDK 7 to 21 and every collector, named <jdk>_<collector>[_real]
            (_real: taken from a real Kafka / Connect JVM)
      - long: --container
        short: -c
        alias: [--pod, -p]
        required: false
        arg: container
        completions:
          dynamic:
          - playground get-container-list
        help: |-
          🐳 Container name (or pod name when cfk environment is used) to extract the GC log from

          ❕ Provide only one of --file, --container and --sample

          🔖 The GC log path is read from the java command line (-Xlog:gc*:file=… or -Xloggc:…), and its rotated files are copied too.
               Falls back to searching common log locations (/var/log, /tmp, /opt).
               The playground environments write a GC log for ZooKeeper, brokers, controllers, Schema Registry,
               Connect (-loggc, /var/log/kafka/<name>-gc.log) and ksqlDB.
      - long: --output-dir
        short: -o
        arg: output_dir
        required: false
        default: "./gc-analysis-output"
        help: |-
          📂 Output directory for the HTML report and the GC logs copied from a container (default: ./gc-analysis-output)
      - long: --html
        required: false
        private: true
        help: |-
          Deprecated: the HTML report is always written (kept so that existing commands keep working)
      - long: --json
        required: false
        help: |-
          🗂️  Output JSON stats (no text report, no HTML report)
      - long: --run
        arg: run
        required: false
        validate: integer
        help: |-
          🔄 JVM run to analyze when the log spans restarts (default: the latest, see the "JVM runs" table)
      - long: --top-pauses
        arg: top_pauses
        required: false
        default: "10"
        validate: integer
        help: |-
          📊 Number of longest pauses to display in the report (default: 10)
    examples:
    - playground analyze gc-logs --sample jdk21_g1_kafka_real
    - playground analyze gc-logs --sample jdk8_cms_cmf_real
    - playground analyze gc-logs --file gc.log
    - playground analyze gc-logs --file /var/log/kafka/kafkaServer-gc.log
    - playground analyze gc-logs -f gc.log -f gc.log.0 -f gc.log.1
    - playground analyze gc-logs --file ./customer-logs/broker-1/
    - playground analyze gc-logs --container broker
    - playground analyze gc-logs --container broker --output-dir ./gc-reports
    - playground analyze gc-logs -f kafkaServer-gc.log --json
    - playground analyze gc-logs -f kafkaServer-gc.log --run 1 --top-pauses 20

  - name: oracle-xstream-report
    help: |-
      🅾️ Analyze Oracle XStream CDC diagnostics reports (orclcdc_diag.sql)

      📊 Reads the HTML report of the Confluent diagnostics script (the file support asks for, orclcdc_diag_<date>.html) and reports: prerequisites (archivelog, supplemental logging, streams_pool_size, MAX_SGA_SIZE), the state of the capture process (its position as a date, and whether it waits for redo it cannot read), LogMiner, outbound server, apply reader, buffered queue and streams pool with thresholds, open and long running transactions, overlapping capture rules, alerts and errors of the last 7 days, the findings sorted by severity with the report section and the exact values, and the matched root-cause patterns.

      📈 Give several reports of the same database (repeat --file) to see what moved between them: captured SCN, messages captured, LCRs sent, latency, restarts.

      🎯 Describe the problem with --problem ("no records since 11th of OCT"): the report is matched against it, the date where the capture stopped is compared with yours, and the findings that explain it come first.

      🐳 With --container (default: oracle), it runs 'playground connector oracle-cdc-xstream generate-report' on the running example first, and analyzes the result.

      🧪 With --sample, it analyzes the reports shipped in tools/xstream-analyzer/samples: a quick way to see what it reports without an Oracle database.

      🌐 Also writes a self-contained HTML report (findings, prerequisites, components, streams pool advice chart, deltas between reports) in --output-dir, to share in a case; opened in the browser in an interactive terminal

      🔖 Exit code is 0 when the analysis completed, 2 when the file is not an orclcdc_diag report

      👉 Check documentation https://docs.confluent.io/kafka-connectors/oracle-xstream-cdc-source/current/troubleshooting.html#connector-diagnostics-script

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-oracle-cdc
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%85%BE%EF%B8%8F-oracle-xstream-cdc-lags-or-is-idle
    flags: &analyze_oracle_xstream_report_flags
      - long: --file
        short: -f
        required: false
        repeatable: true
        arg: file
        validate: file_exists_with_trick
        completions:
          dynamic:
          - playground get-specific-file-extension "$completion_current" --extension "html"
        help: |-
          🗒️  orclcdc_diag HTML report (repeat --file for several reports of the same database)

          ❕ Provide only one of --file, --container and --sample

          🎓 Tip: use <tab> completion to trigger fzf completion
                  use <option+enter> to use the value you typed manually
      - long: --container
        short: -c
        required: false
        arg: container
        help: |-
          🐳 Oracle container of a running XStream example to generate the report from (default: oracle)
      - long: --sample
        short: -s
        required: false
        repeatable: true
        arg: sample
        allowed: [healthy, large_transaction, detached, older_script_version, synthetic_failures, missing_archived_log]
        help: |-
          🧪 Sample report of tools/xstream-analyzer/samples (repeat --sample to compare several)

            healthy                connector running, idle database
            large_transaction      uncommitted 150,000-row insert
            detached               connector deleted: outbound server DETACHED
            older_script_version   report of an older orclcdc_diag.sql
            synthetic_failures     NOARCHIVELOG, capture ABORTED, flow control, LogMiner memory, spills, alerts
            missing_archived_log   capture WAITING FOR REDO on an archived log it cannot read: nothing captured
      - long: --problem
        short: -p
        arg: problem
        required: false
        help: |-
          🎯 Problem statement, in your own words: symptom and since when (example: "no records processed since 11th of OCT")

          The symptoms (no data, lag, missing data, duplicates, errors, memory) and dates it recognizes are matched against the report: capture position as a date, messages captured and LCRs sent, and the findings that explain it, most relevant first
      - long: --output-dir
        short: -o
        arg: output_dir
        required: false
        default: "./xstream-analysis-output"
        help: |-
          📂 Output directory for the report generated with --container and the HTML report (default: ./xstream-analysis-output)
      - long: --html
        required: false
        private: true
        help: |-
          Deprecated: the HTML report is always written (kept so that existing commands keep working)
      - long: --json
        required: false
        help: |-
          🗂️  Output JSON (findings, prerequisites, summary per component, deltas between reports)
      - long: --top
        arg: top
        required: false
        default: "10"
        validate: integer
        help: |-
          📊 Maximum number of rows per list: transactions, alerts, errors, tables (default: 10)
    examples:
    - playground analyze oracle-xstream-report --sample synthetic_failures
    - playground analyze oracle-xstream-report -s large_transaction -s detached
    - playground analyze oracle-xstream-report --sample large_transaction --json
    - playground analyze oracle-xstream-report -f orclcdc_diag_20261013_0912.html
    - playground analyze oracle-xstream-report -f day1.html -f day2.html
    - playground analyze oracle-xstream-report -f orclcdc_diag_20261013_1826.html --problem "no records processed since 11th of OCT"
    - playground analyze oracle-xstream-report --container oracle

  - name: cfk-bundle
    private: true
    help: |-
      Moved to 'playground analyze logs', which detects a CFK support bundle (kept as a hidden alias)
    flags: &analyze_cfk_bundle_flags
      - long: --bundle
        short: -b
        required: false
        arg: path
        help: |-
          🗂️  Path to the CFK support bundle (directory or .tar/.tar.gz/.tgz/.zip)
      - long: --sample
        short: -s
        required: false
        arg: sample
        allowed: [synthetic]
        help: |-
          🧪 Sample of cfk-analysis/samples

            synthetic   CFK bundle: kafka-2 crash-looping on an expired certificate, pending volume, OOMKilled Connect
                        pod, failed connector task, Schema Registry authentication failure, operator reconcile errors
      - long: --json
        required: false
        help: |-
          📄 Emit machine-readable JSON (includes per-issue recommendation) instead of the text report
      - long: --sanitize
        required: false
        help: |-
          🔒 Replace IPs, hostnames, emails and credentials by placeholders (off by default)
      - long: --no-sanitize
        required: false
        private: true
        help: |-
          Kept for compatibility: the output is not sanitized by default, see --sanitize
      - long: --severity
        required: false
        arg: level
        allowed: [critical, high, medium, low]
        help: |-
          🎚️  Filter issues by minimum severity (critical | high | medium | low)
      - long: --component
        required: false
        repeatable: true
        arg: component
        allowed: [kafka, kraftcontroller, zookeeper, connect, schemaregistry, ksqldb, controlcenter, kafkarestproxy, operator, other]
        help: |-
          🧩 Only keep the issues of this component (repeat --component for several). other = not a CFK component (nodes, volumes, unknown pods)
      - long: --top
        required: false
        arg: n
        default: "5"
        validate: integer
        help: |-
          🔢 Max number of issues to display per category in text mode (default: 5)
      - long: --include-warnings
        required: false
        help: |-
          ⚠️  Also report WARN log records that match no known category (WARN records matching a known category are always reported)
      - long: --html
        required: false
        private: true
        help: |-
          Deprecated: the HTML report is always written (kept so that existing commands keep working)
      - long: --output-dir
        required: false
        arg: dir
        default: "./cfk-reports"
        help: |-
          📁 Directory for the HTML report (default: ./cfk-reports)

  - name: flight-recorder
    help: |-
      🛩️ Analyze a Java Flight Recorder recording: where the time of the connector tasks goes

      📊 For the Kafka Connect task threads (task-thread-*, or --threads / --connector): the time of each thread by state (running, blocked on network I/O by remote host, Kafka client, locks, waiting, file I/O), the CPU by layer (connector, converters, SMTs, Kafka client, connect framework, libraries, logging, JDK), the hot methods, the allocation by class, locks and waits by site, the busiest threads of the JVM, GC pauses and exceptions, and findings with next steps. Without task thread in the recording, every thread is analyzed.

      🐳 With --container (default: connect), it records the JVM for --duration over JMX (FlightRecorderMXBean: no jcmd, which the cp images do not have, and no restart) with the settings of tools/jfr-analyzer/playground.jfc, then analyzes the recording. playground connector benchmark records the measure the same way.

      🔖 Reads .jfr files of JDK 11+ JVMs with the JDK flight recorder API, run in a eclipse-temurin:25-jdk container (pulled the first time). The settings of the recording matter: playground.jfc records socket, file, lock and park events from 1 ms and the CPU of each thread every second; a recording made with the default or profile settings of the JDK gives fewer details (throttled socket events, 10 ms thresholds).

      🌐 Also writes a self-contained HTML report (inline SVG charts, works offline) in --output-dir, opened in the browser in an interactive terminal

      🧪 With --sample, it analyzes the digests shipped in tools/jfr-analyzer/samples (no Docker needed): a quick way to see what it reports.

      🔖 Exit code is 0 when the analysis completed, 2 when the file is not a flight recording or has no event

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-jvm-diagnostics
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%9B%A9%EF%B8%8F-a-slow-connector-where-does-the-task-time-go
    flags:
      - long: --file
        short: -f
        required: false
        repeatable: true
        arg: file
        validate: file_exists
        completions:
          dynamic:
          - playground get-specific-file-extension "$completion_current" --extension "jfr"
        help: |-
          🗒️  .jfr file to analyze (repeat --file for the recordings of several connect workers over the same period)

          ❕ Provide only one of --file, --container and --sample

          🎓 Tip: use <tab> completion to trigger fzf completion
                  use <option+enter> to use the value you typed manually
      - long: --sample
        short: -s
        required: false
        arg: sample
        allowed: [jdbc_postgres_sink]
        help: |-
          🧪 Sample of tools/jfr-analyzer/samples

            jdbc_postgres_sink   drain of 3M avro records by the JDBC sink to PostgreSQL, 1 task, CP 8.3.2 (JDK 25)
      - long: --container
        short: -c
        required: false
        arg: container
        completions:
          dynamic:
          - playground get-container-list
        help: |-
          🐳 Container to record over JMX for --duration (default: connect). Its JMX port (KAFKA_JMX_PORT, SCHEMA_REGISTRY_JMX_PORT...) must be set, as in the playground environments
      - long: --duration
        arg: duration
        validate: duration
        required: false
        default: "60s"
        help: |-
          ⏱️ Duration of the recording with --container, in seconds or with a s/m/h suffix (default is 60s)
      - long: --connector
        required: false
        arg: connector
        completions:
          dynamic:
          - playground get-connector-list
        help: |-
          🔗 Analyze the task threads of this connector only (task-thread-<connector>-<n>), and classify its frames as connector code (its class is read from the connect REST API when connect is running)
      - long: --connector-class
        required: false
        arg: connector_class
        help: |-
          🔌 Class of the connector, to classify its frames as connector code (default: read from --connector, or guessed from the package)
      - long: --trace-method
        arg: method
        required: false
        repeatable: true
        help: |-
          🎯 Also record every call of this method, with its duration and its caller (method tracing of JDK 25+, JEP 520: the cp 8.3.2 images ship JDK 25): a class (all its methods), Class::method or @Annotation. The report gets a "Traced methods" section: calls, total, avg, max, the slowest calls and their stack. No argument values: for them, use playground debug jscissors

          🎓 Tip: you can pass multiple methods by specifying --trace-method multiple times
      - long: --threads
        required: false
        arg: regex
        help: |-
          🧵 Regular expression of the thread names to analyze (default: ^task-thread-, or the task threads of --connector)
      - long: --output-dir
        short: -o
        arg: output_dir
        required: false
        default: "./jfr-analysis-output"
        help: |-
          📂 Output directory for the recording taken from a container, the digest and the HTML report (default: ./jfr-analysis-output)
      - long: --json
        required: false
        help: |-
          🗂️  Output JSON (no text report, no HTML report)
      - long: --top
        arg: top
        required: false
        default: "10"
        validate: integer
        help: |-
          📊 Number of rows per section (default: 10)
    examples:
    - playground analyze flight-recorder --sample jdbc_postgres_sink
    - playground analyze flight-recorder
    - playground analyze flight-recorder -c connect --duration 2m --connector my-jdbc-sink
    - playground analyze flight-recorder --file flight-recorder-connect-2026-10-16-09-12-00.jfr
    - playground analyze flight-recorder -f /tmp/playground-benchmark/my-sink-20261016-091200-connect.jfr -f /tmp/playground-benchmark/my-sink-20261016-091200-connect2.jfr
    - playground analyze flight-recorder -f recording.jfr --threads '^pool-.*' --json
    - playground analyze flight-recorder -c connect --duration 60s --trace-method io.confluent.connect.jdbc.sink.JdbcDbWriter::write

  - name: jscissors
    help: |-
      ✂️ Analyze a jscissors trace: what the traced methods did, call by call

      Reads the folder copied by playground debug jscissors --action stop (it runs this command itself, unless --no-analyze), a pid-<pid> folder of it, or its events.jsonl.

      📊 The methods by total time (calls, average, p95, max, self time and exceptions: exact, counted by the agent for every call), the exceptions thrown by the traced methods with their stack trace and the arguments of a failing call, the calls still running when the trace stopped (a hang), the slowest calls with their arguments and return values, the call trees of each thread, the thread and heap dumps taken (with the command to analyze them), and findings with next steps (no class matched the rules, limits reached, agent errors...).

      🌐 Also writes a self-contained HTML report in --output-dir, opened in the browser in an interactive terminal

      🧪 With --sample, it analyzes a trace shipped in tools/jscissors/samples: a quick way to see what it reports.

      🔖 Exit code is 0 when the analysis completed, 2 when the folder holds no trace

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-jvm-diagnostics
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%E2%9C%82%EF%B8%8F-records-vanish-a-task-hangs-what-does-the-code-do
    flags:
      - long: --file
        short: -f
        required: false
        arg: file
        help: |-
          📂 Trace folder copied by playground debug jscissors --action stop (jscissors-<container>-<date>), a pid-<pid> folder of it, or its events.jsonl

          ❕ Provide only one of --file and --sample
      - long: --sample
        short: -s
        required: false
        arg: sample
        allowed: [filestream_sink_bad_json]
        help: |-
          🧪 Sample of tools/jscissors/samples

            filestream_sink_bad_json   FileStream sink with errors.tolerance=all, records that are not JSON: the conversion of each record, the DataException of the bad ones (with their content), the batches written
      - long: --output-dir
        short: -o
        arg: output_dir
        required: false
        default: "./jscissors-analysis-output"
        help: |-
          📂 Output directory for the HTML report (default: ./jscissors-analysis-output)
      - long: --json
        required: false
        help: |-
          🗂️  Output JSON (no text report, no HTML report)
      - long: --top
        arg: top
        required: false
        default: "15"
        validate: integer
        help: |-
          📊 Number of rows per section (default: 15)
    examples:
    - playground analyze jscissors --sample filestream_sink_bad_json
    - playground analyze jscissors -f jscissors-connect-2026-10-25-10-12-00
    - playground analyze jscissors -f jscissors-connect-2026-10-25-10-12-00 --json

  - name: tcp-dump
    help: |-
      🦈 Analyze a network capture (.pcap, .pcapng): refused and reset connections, retransmissions, TLS alerts, DNS errors, Kafka and HTTP errors and response times

      📊 Reads a capture taken by playground debug tcp-dump, or sent by a customer (tcpdump, Wireshark), and reports: the TCP conversations with their handshake time, the connections refused (SYN answered with a reset) or unanswered, the resets of established connections, retransmissions and zero windows, the TLS handshakes (SNI) and alerts with their likely cause, DNS errors, the Kafka requests by API with their response times and error codes (port 9092, the KRaft controller and the host listeners of the playground, plus --kafka-port), and the HTTP requests by endpoint with their status codes and response times, the error responses with an excerpt of the request and response bodies (plain HTTP on the usual ports of the playground: 8081 to 8083, 8088, 9006, 9021, plus --http-port).

      🏷️ Container names instead of ip addresses: with --hosts (<ip> <name> per line), or the .hosts file that playground debug tcp-dump writes next to the capture (found automatically).

      🐳 With --container, it captures for --duration with playground debug tcp-dump, then analyzes the captures.

      🔧 tshark runs in the nicolaka/netshoot image (pulled the first time): nothing to install but python3.

      🌐 Also writes a self-contained HTML report (inline SVG charts, works offline) in --output-dir, opened in the browser in an interactive terminal

      🧪 With --sample, it analyzes the captures shipped in tools/tcp-dump/samples: a quick way to see what it reports.

      🔖 Exit code is 0 when the analysis completed, 2 when the capture has no packet

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-jvm-diagnostics
    flags:
      - long: --file
        short: -f
        required: false
        repeatable: true
        arg: file
        validate: file_exists
        completions:
          dynamic:
          - playground get-specific-file-extension "$completion_current" --extension "pcap"
        help: |-
          🦈 Capture file (.pcap or .pcapng), repeat --file for several captures (one report each)

          ❕ Provide only one of --file, --container and --sample

          🎓 Tip: use <tab> completion to trigger fzf completion
                  use <option+enter> to use the value you typed manually
      - long: --sample
        short: -s
        required: false
        repeatable: true
        arg: sample
        allowed: [kafka_and_network_errors, http_errors]
        help: |-
          🧪 Sample of tools/tcp-dump/samples

            kafka_and_network_errors   a Kafka client producing and consuming, a refused connection, a connection without answer, a TLS handshake rejected (certificate_unknown) and a DNS NXDOMAIN
            http_errors                an HTTP client posting JSON records (like the HTTP sink): 200, 429, 500, 401 and 404 responses with their bodies, a slow endpoint and a request without response
      - long: --container
        short: -c
        alias: [--pod, -p]
        required: false
        repeatable: true
        arg: container
        completions:
          dynamic:
          - playground get-container-list
        help: |-
          🐳 Container name (or pod name when cfk environment is used) to capture for --duration, then analyze (default: connect)
      - long: --duration
        arg: duration
        validate: duration
        required: false
        default: "30"
        help: |-
          ⏱️ Duration of the capture with --container, in seconds or with a s/m/h suffix (default is 30 seconds)
      - long: --port
        arg: port
        validate: integer
        required: false
        help: |-
          🚪 With --container, only the traffic to or from this port
      - long: --filter
        arg: filter
        required: false
        help: |-
          🔍 With --container, a tcpdump filter expression (pcap-filter syntax)
      - long: --hosts
        arg: hosts
        validate: file_exists
        required: false
        help: |-
          🏷️ Hosts file (<ip> <name> per line) to show names instead of ip addresses (default: the .hosts file next to the capture, when there is one)
      - long: --kafka-port
        arg: kafka_port
        validate: integer
        required: false
        repeatable: true
        help: |-
          📨 Other port to decode as Kafka (9092, 9093, 29092, 29292 and 29392 are always decoded)
      - long: --http-port
        arg: http_port
        validate: integer
        required: false
        repeatable: true
        help: |-
          🌍 Other port to decode as HTTP (80, 8080, 8081, 8082, 8083, 8088, 9006 and 9021 are always decoded)
      - long: --output-dir
        short: -o
        arg: output_dir
        required: false
        default: "./tcp-dump-analysis-output"
        help: |-
          📂 Output directory for the HTML report (default: ./tcp-dump-analysis-output)
      - long: --json
        required: false
        help: |-
          🗂️  Output JSON (no text report, no HTML report)
      - long: --top
        arg: top
        required: false
        default: "10"
        validate: integer
        help: |-
          📊 Number of rows per section (default: 10)
    examples:
    - playground analyze tcp-dump --sample kafka_and_network_errors
    - playground analyze tcp-dump --sample http_errors
    - playground analyze tcp-dump -f tcp-dump-connect-9092-2026-10-25-09-25-35.pcap
    - playground analyze tcp-dump -f customer.pcapng --kafka-port 9094 --json
    - playground analyze tcp-dump -f http-sink.pcap --http-port 8443
    - playground analyze tcp-dump -c connect -c broker --port 9092 --duration 1m

- name: debug
  expose: always
  group: Debug
  help: |-
    🐞 Debug commands

    The heavy tooling, made usable: the JDK utilities, tcpdump, iptables and
    the analysis tools are run inside the right container, installed on the
    fly when missing, and their output is brought back to your machine.

    🐌 It hangs, or it is slow
      thread-dump         what every thread is doing right now
      flight-recorder     record the JVM from start to stop, then analyze it

    💾 It eats memory
      heap-dump           take a .hprof, optionally as a histogram

    🌐 It is a network or TLS problem
      tcp-dump            capture traffic, analyze it, open it in Wireshark
      testssl             probe a TLS endpoint, locally or in the cloud
      block-traffic       cut a route with iptables, to simulate an outage
      degrade-traffic     add latency, packet loss or corruption with tc
      java-debug          turn on the JVM SSL, Kerberos or class loading traces

    🔬 It is in the code
      log-level set       raise the level of any package, without a restart
      enable-remote-debugging   attach your IDE debugger to a container
      jscissors           trace method calls, arguments and return values

    📦 Hand it over
      generate-diagnostics   a support bundle for connect or broker

    🔎 To analyze what you collected (thread dumps, GC logs, heap dumps,
    logs, Oracle XStream reports, CFK bundles, flight recordings, network
    captures): playground analyze
  commands:

  - name: enable-remote-debugging
    help: |-
      ✨ Enable java remote debugging for container
      
      👉 Check documentation https://kafka-docker-playground.io/#/reusables?id=%e2%9c%a8-remote-debugging

      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%90%9E-a-breakpoint-in-a-running-connector-remote-debugging
    flags:
      - &container
        long: --container
        short: -c
        alias: [--pod, -p]
        required: false
        default: "connect"
        arg: container
        repeatable: true
        completions:
          dynamic:
          - playground get-container-list
        help: |-
          🐳 container name (or pod name when cfk environment is used)

          🎓 Tip: you can pass multiple containers by specifying --container multiple times
      - long: --skip-vs-code-config-display
        required: false
        private: true
    examples:
    - playground debug enable-remote-debugging
    - playground debug enable-remote-debugging --container broker
    - playground debug enable-remote-debugging -c broker
    - playground debug enable-remote-debugging -c connect -c broker
    - playground debug enable-remote-debugging --container schema-registry --container ksqldb-server --container control-center

  - name: disable-remote-debugging
    help: |-
      🛑 Disable java remote debugging for container
    flags:
      - *container

  - name: testssl
    help: |-
      🔐 Testing TLS/SSL encryption using https://testssl.sh/
    flags:
      - long: --uri
        arg: uri
        required: true
        help: |-
          host|host:port|URL|URL:port   port 443 is default, URL can only contain HTTPS protocol
    catch_all:
      label: testssl arguments
      help: arguments to pass to testssl, see https://testssl.sh for all options
    examples:
    - playground debug testssl --uri "https://google.com" --fast
    - playground debug testssl --uri "pkc-xxxx.us-west-2.aws.confluent.cloud:9092"

  - name: generate-diagnostics
    help: |-
      ⛑️ Generate a diagnostic bundle with Diagnostics Bundle Tool

      ⚠️ only connect and broker containers are supported for now

      see https://docs.confluent.io/platform/current/tools/diagnostics-tool.html#collect-diagnostics
    flags:
      - *container
    examples:
    - playground debug generate-diagnostics
    - playground debug generate-diagnostics --container broker

  - name: thread-dump
    help: |-
      🎯 Take a java thread dump

      🔖 It will save output to a file and open with text editor set with playground config editor <editor> (default is code)

      The first thing to take when something is stuck: it shows the stack of
      every thread, and the deadlocks if any.

      🔖 It sends kill -3 to the JVM, which prints the dump to the container logs: no JDK is needed in the image and the container is not restarted. It falls back to jstack -l when the dump does not reach the logs.

      🎓 Tip: take two or three dumps a few seconds apart. Threads that appear
      in the same place every time are the ones that are really blocked. playground analyze thread-dump does it and analyzes them.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-jvm-diagnostics
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%A7%B5-a-connector-looks-stuck-analyze-thread-dumps
    flags:
      - *container
      - long: --jstack
        required: false
        help: |-
          🔧 Use jstack -l instead of kill -3: adds the owners of java.util.concurrent locks ("Locked ownable synchronizers"). Needs a JDK in the image (on cfk, a debug container is attached); the container is never restarted
    examples:
    - playground debug thread-dump
    - playground debug thread-dump --container broker
    - playground debug thread-dump -c connect -c broker
    - playground debug thread-dump --container schema-registry --container ksqldb-server
    - playground debug thread-dump --container connect --jstack

  - name: thread-analyze
    private: true
    filename: commands/analyze/thread-dump.sh
    help: |-
      Moved to 'playground analyze thread-dump' (kept as a hidden alias)
    flags: *analyze_thread_dump_flags

  - name: heap-dump
    help: |-
      👻 Take a heap dump

      🔖 It will save output to a .hprof file. VisualVM (https://visualvm.github.io/) or MAT (https://www.eclipse.org/mat/) can be used to read the file.

      With --live, only the live objects are dumped, which runs a full GC first. Without it, every object of the
      heap is dumped, without a GC.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-jvm-diagnostics
    flags:
      - *container
      - long: --live
        required: false
        help: |-
          🧬 dump only live objects; if not specified, all objects in the heap are dumped
      - long: --histo
        required: false
        help: |-
          📊 print histogram of java object heap
    examples:
    - playground debug heap-dump
    - playground debug heap-dump --container broker
    - playground debug heap-dump -c connect -c broker
    - playground debug heap-dump --container schema-registry --live
    - playground debug heap-dump -c connect -c broker --histo

  - name: heap-analyze
    private: true
    filename: commands/analyze/heap-dump.sh
    help: |-
      Moved to 'playground analyze heap-dump' (kept as a hidden alias)
    flags: *analyze_heap_dump_flags

  - name: analyze-logs
    private: true
    filename: commands/analyze/logs.sh
    help: |-
      Moved to 'playground analyze logs' (kept as a hidden alias)
    flags: *analyze_logs_flags

  - name: gc-analyze
    private: true
    filename: commands/analyze/gc-logs.sh
    help: |-
      Moved to 'playground analyze gc-logs' (kept as a hidden alias)
    flags: *analyze_gc_logs_flags

  - name: tcp-dump
    help: |-
      🕵️‍♂️ Take a tcp dump (sniffing network)

      Captures the traffic in or out of one or more containers and brings the capture files back, with a summary and
      ready to open in Wireshark. Narrow it with --port and/or --filter (any tcpdump expression) when you know what you
      care about.

      ⏱️ Without --action, it captures for --duration (default 30s): reproduce the issue meanwhile, Ctrl+C stops it
      earlier and keeps the capture. With several --container, the captures run at the same time, so both sides of a
      connection can be compared. For a window of any length, in a script or by hand: --action start, reproduce,
      --action stop (--action status shows the running captures, kept in playground.ini as tcp_dump.<container>).

      📂 For each container, --output-dir (default: current folder) gets:

        tcp-dump-<container>-<port>-<date>.pcap                     the capture
        tcp-dump-<container>-<port>-<date>.hosts                    ip address → container name
        tcp-dump-<container>-<port>-<date>-tcp-dump-report.html     the HTML report of the analysis

      🔎 Each capture is then analyzed with playground analyze tcp-dump (--no-analyze to skip it): refused and reset
      connections, retransmissions, TLS alerts, DNS errors, Kafka and HTTP errors and response times (with the bodies of
      the HTTP error responses), with container names instead of ip addresses, as a text digest and an HTML report.

      🐳 tcpdump runs from the nicolaka/netshoot image in the network namespace of the container (an ephemeral
      container of the pod with cfk): nothing is installed in the container, so it works with any image.

      ❕ On an encrypted listener you will see the handshake and the failures (TLS alerts), but not the records
         themselves.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-jvm-diagnostics
    flags:
      - *container
      - long: --port
        arg: port
        validate: integer
        required: false
        completions:
          dynamic:
          - playground get-docker-ports
        help: |-
          🚪 Only the traffic to or from this port (default: every port)
      - long: --filter
        arg: filter
        required: false
        help: |-
          🔍 tcpdump filter expression (pcap-filter syntax), combined with --port when both are set

          Examples: 'host postgres', 'tcp[tcpflags] & tcp-rst != 0', 'not port 22'
      - long: --duration
        arg: duration
        validate: duration
        required: false
        default: "30"
        help: |-
          ⏱️ Duration of the capture without --action, in seconds or with a s/m/h suffix (default is 30 seconds)
      - long: --snaplen
        arg: snaplen
        validate: integer
        required: false
        help: |-
          ✂️ Bytes kept from each packet (default: the whole packet). 128 keeps the headers only, for long captures
      - long: --action
        allowed: [start, stop, status]
        arg: action
        required: false
        help: |-
          🟢 start, stop (copy and summarize the capture) or status, for a capture of any length (default: capture for --duration)
      - long: --output-dir
        arg: output_dir
        required: false
        default: "."
        help: |-
          📂 Folder for the capture files (default: current folder)
      - long: --no-analyze
        required: false
        help: |-
          🙈 Only copy the captures, do not analyze them with playground analyze tcp-dump
      - long: --no-open
        required: false
        help: |-
          🦈 Do not open the captures in Wireshark (they are never opened in CI or outside a terminal)
    examples:
    - playground debug tcp-dump --container control-center --port 9021 --duration 60
    - playground debug tcp-dump -c connect -c broker --port 9092 --duration 2m
    - playground debug tcp-dump -c connect --filter "host postgres and tcp[tcpflags] & tcp-rst != 0"
    - playground debug tcp-dump -c connect --action start
    - playground debug tcp-dump -c connect --action stop --output-dir /tmp/captures

  - name: block-traffic
    help: |-
      🚫 Blocking traffic using iptables

      Cuts the route from a container to a destination, so you can see how the
      system behaves during a network outage: a broker that loses the
      controller, a connector that can no longer reach its database, a client
      that cannot resolve the schema registry.

      Blocking with --action start and restoring with --action stop, so the
      failure is reversible without restarting anything.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-network-traffic
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%90%8C-a-slow-or-broken-network-on-purpose
    flags:
      - *container
      - long: --destination
        arg: destination
        required: true
        help: |-
          Destination: it could be an ip address, a container name or a hostname
      - long: --port
        arg: port
        validate: integer
        required: false
        completions:
          dynamic:
          - playground get-docker-ports
        help: |-
          Port on which tcp traffic should be blocked
      - &action_start_stop
        long: --action
        allowed: [start, stop]
        arg: action
        required: true
        help: |-
          🟢 start or stop
    examples:
    - playground debug block-traffic --destination google.com --action start
    - playground debug block-traffic --container broker --destination zookeeper --action start
    - playground debug block-traffic -c broker -c connect --destination zookeeper --action start
    - playground debug block-traffic --container schema-registry --destination broker --port 9092 --action start
    - playground debug block-traffic -c connect -c ksqldb-server --destination schema-registry --action stop

  - name: degrade-traffic
    help: |-
      🐌 Add latency, packet loss, corruption or a bandwidth limit using tc

      Some issues only happen on a slow or unreliable network: request
      timeouts, retries, rebalances, producer or consumer errors. This makes
      the traffic from a container slow or lossy, to a destination (and
      port) or to everything, and --action stop puts it back to normal
      without restarting anything.

      Several effects can be combined in one call, e.g. --latency 100ms
      --loss 1%. A new --action start replaces what was applied before on
      the container. --action status shows what is applied and the measured
      round trip to the destination.

      tc runs from the nicolaka/netshoot image in the network namespace of
      the container (an ephemeral container of the pod with cfk): nothing is
      installed in the container, so it works with any image.

      ❕ tc only shapes the packets a container sends: with --latency 100ms
      the round trip to the destination grows by 100ms. A container restart
      removes the degradation.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-network-traffic
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%90%8C-a-slow-or-broken-network-on-purpose
    flags:
      - *container
      - long: --destination
        arg: destination
        required: false
        completions:
          dynamic:
          - playground get-container-list
        help: |-
          🎯 Destination: an ip address, a container name or a hostname (default: all the traffic of the container)
      - long: --port
        arg: port
        validate: integer
        required: false
        completions:
          dynamic:
          - playground get-docker-ports
        help: |-
          🚪 Only the tcp traffic to this port of the destination
      - long: --latency
        arg: latency
        required: false
        help: |-
          ⏱️ Added latency, e.g. 100ms, 1s
      - long: --jitter
        arg: jitter
        required: false
        help: |-
          〰️ Random variation of the latency, e.g. 20ms (needs --latency)
      - long: --loss
        arg: loss
        required: false
        help: |-
          🕳️ Percentage of packets dropped, e.g. 1%
      - long: --corruption
        arg: corruption
        required: false
        help: |-
          🧨 Percentage of packets corrupted, e.g. 1%
      - long: --duplicate
        arg: duplicate
        required: false
        help: |-
          👯 Percentage of packets duplicated, e.g. 1%
      - long: --rate
        arg: rate
        required: false
        help: |-
          🚰 Bandwidth limit, e.g. 1mbit, 500kbit
      - long: --action
        allowed: [start, stop, status]
        arg: action
        required: true
        help: |-
          🟢 start, stop or status
    examples:
    - playground debug degrade-traffic --container connect --destination broker --latency 100ms --action start
    - playground debug degrade-traffic -c connect --destination broker --latency 100ms --jitter 20ms --loss 1% --action start
    - playground debug degrade-traffic -c connect -c ksqldb-server --destination broker --port 9092 --loss 5% --action start
    - playground debug degrade-traffic -c connect --rate 1mbit --action start
    - playground debug degrade-traffic -c connect --destination broker --action status
    - playground debug degrade-traffic -c connect -c ksqldb-server --action stop

  - name: java-debug
    help: |-
      🤎 JVM arguments for SSL, Kerberos or Class Loading

      Turns on the JVM's own diagnostic traces in a container and restarts it.
      This is how you find out why a TLS handshake fails, why a Kerberos
      login is refused, or which jar a class was loaded from when two
      versions collide.

      ❗ These traces are extremely verbose. Turn them back off with
         --action disable once you have what you need.
    flags:
      - *container
      - long: --type
        arg: type
        allowed: [ssl_all, ssl_handshake, class_loading, kerberos]
        required: true
        help: |-
          - ssl_all: Enable all SSL debugging, i.e -Djavax.net.debug=all
          - ssl_handshake: Enable SSL handshake debugging, i.e -Djavax.net.debug=ssl:handshake
          - class_loading: Enable class loading debugging, i.e -verbose:class
          - kerberos: Enable Kerberos debugging, i.e -Dsun.security.krb5.debug=true
      - &action_enable_disable
        long: --action
        allowed: [enable, disable]
        arg: action
        required: false
        default: "enable"
        help: |-
          🟢 enable or disable
    examples:
    - playground debug java-debug --type class_loading
    - playground debug java-debug --container broker --action start

  - name: jscissors
    help: |-
      ✂️ Trace the calls of any method of a running JVM: arguments, return values, durations, exceptions, call tree

      A java agent (tools/jscissors/agent, byte-buddy) loaded in the JVM of the container instruments the methods matching --class and --method, and records every call with what the --operation flags ask for. For a window of any length: --action start, reproduce the problem, --action stop, which copies the trace to --output-dir and analyzes it with playground analyze jscissors (methods by total time, exceptions, calls still running, slowest calls, call trees, HTML report), unless --no-analyze. With --duration, start, wait and stop in one command.

      💉 No restart: the agent is loaded in the running JVM with the attach protocol (what jcmd does, without jcmd, which the cp images do not have), or over JMX for a JDK older than 16. --action stop restores the original classes. Starting again replaces the rules. With --restart, the container is recreated with the agent in JAVA_TOOL_OPTIONS, to trace the startup of the JVM too (or when the JVM refuses the attach).

      🎯 --class and --method are exact names, or java regular expressions as soon as they hold other characters than letters, digits, '.', '$' and '_' (io.confluent.connect.jdbc.*, .*[Ww]rite.*). Only concrete methods are traced (trace the implementation class, not the interface), constructors and JDK classes (java.*, javax.*) are not. A class loaded after the start is instrumented when it loads.

      🛡️ Safe by default: values are cut to --max-value-length and the secrets found in them are masked (passwords of maps, JAAS, connection strings), at most --max-calls calls (--max-calls-per-method per method) are recorded with their details (every call is counted in the statistics), or only the ones that throw (--only-failed) or are slow (--slower-than), at most 10 thread dumps and 1 heap dump, the agent can never throw in the traced code, and a toString() of an argument is never traced. Trace what you need: a regex matching thousands of hot methods slows the JVM down.

      📂 In the trace folder (jscissors-<container>-<date>/pid-<pid>/): events.jsonl (one event per call enter / exit / dump), summary.json (statistics), agent.log, instrumented.txt, dumps/, and the HTML report.

      🔖 The session of each container is kept in playground.ini (jscissors.<container>), --action status shows it with the calls so far. The agent jar is built from tools/jscissors/agent with maven in a container the first time (and after a change of its sources).

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-jvm-diagnostics
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%E2%9C%82%EF%B8%8F-records-vanish-a-task-hangs-what-does-the-code-do
    flags:
      - *container
      - long: --action
        allowed: [start, stop, status, enable, disable]
        arg: action
        required: false
        default: "start"
        help: |-
          🟢 start (default), stop (copy the trace and analyze it) or status

          enable and disable are the former names of start and stop
      - long: --class
        arg: class
        required: false
        repeatable: true
        help: |-
          🎯 Class to trace: exact name (io.confluent.connect.jdbc.sink.JdbcDbWriter, a nested class with $), or a regex (io.confluent.connect.jdbc.sink.*)

          🎓 Tip: you can pass multiple classes by specifying --class multiple times
      - long: --method
        arg: method
        required: false
        repeatable: true
        default: ".*"
        help: |-
          🎯 Method to trace, in each --class: exact name (write) or regex (.*[Ww]rite.*), default: every method

          🎓 Tip: you can pass multiple methods by specifying --method multiple times
      - long: --operation
        arg: operation
        help: |-
          🥼 What to record on top of each call (its duration, its exception and its place in the call tree are always recorded):

          * VALUES: arguments
          * RETURN_VALUE: return value
          * STACK: stack trace of the caller
          * THREADS / RETURN_THREADS / EXCEPTION_THREADS: thread dump when the method is called / returns / throws
          * HEAP / RETURN_HEAP / EXCEPTION_HEAP: heap dump when the method is called / returns / throws
          * DELAY: duration (always recorded, kept for compatibility)

          Default values: VALUES and RETURN_VALUE

          🎓 Tip: you can pass multiple operations by specifying --operation multiple times
        required: false
        repeatable: true
        unique: true
        allowed:
          - VALUES
          - RETURN_VALUE
          - STACK
          - THREADS
          - RETURN_THREADS
          - EXCEPTION_THREADS
          - HEAP
          - RETURN_HEAP
          - EXCEPTION_HEAP
          - DELAY
        default:
          - VALUES
          - RETURN_VALUE
      - long: --config-file
        arg: config_file
        required: false
        completions:
          dynamic:
          - playground get-any-file-with-fzf "$completion_current"
        help: |-
          📜 Rules file, for different operations per class: one class{method}=OP+OP rule per line (io.confluent.connect.jdbc.sink.JdbcDbWriter{write}=VALUES+STACK), added to the rules of --class
      - long: --duration
        arg: duration
        validate: duration
        required: false
        help: |-
          ⏱️ With --action start: trace for this long (in seconds, or with a s/m/h suffix), then stop and analyze
      - long: --restart
        required: false
        help: |-
          🔁 Load the agent at the start of the JVM: the container is recreated (and recreated again without the agent by --action stop). To trace the startup, or when the JVM refuses the attach
      - long: --pid
        arg: pid
        required: false
        default: "auto"
        help: |-
          🔢 Process to attach to in the container (default: auto, the oldest java process)
      - long: --max-calls
        arg: max_calls
        required: false
        validate: integer
        help: |-
          ✂️ Calls recorded with their details in events.jsonl (default: 50000), the next ones are only counted in the statistics
      - long: --max-calls-per-method
        arg: max_calls_per_method
        required: false
        validate: integer
        help: |-
          ✂️ Calls of one method recorded with their details (default: 2000), so that a hot method does not use the whole budget
      - long: --max-value-length
        arg: max_value_length
        required: false
        validate: integer
        help: |-
          ✂️ Characters kept of each argument, return value and exception message (default: 300)
      - long: --only-failed
        required: false
        help: |-
          🎯 Record with their details (arguments, return value, stack) only the calls that throw an exception: the others are only counted in the statistics. With --slower-than, the calls that throw or are slow
      - long: --slower-than
        arg: duration
        required: false
        help: |-
          🐢 Record with their details only the calls that take at least this long (500ms, 2s, 1m): the others are only counted in the statistics. With --only-failed, the calls that are slow or throw
      - long: --output-dir
        short: -o
        arg: output_dir
        required: false
        default: "."
        help: |-
          📂 Folder for the trace and its HTML report, used by --action stop (default: current folder)
      - long: --no-analyze
        required: false
        help: |-
          🙈 With --action stop, only copy the trace, do not analyze it
    examples:
    - playground debug jscissors --class io.confluent.connect.jdbc.sink.JdbcDbWriter --method write --action start
    - playground debug jscissors --action stop
    - playground debug jscissors --action status
    - playground debug jscissors --class 'io.confluent.connect.jdbc.sink.*' --duration 60s
    - playground debug jscissors --class org.apache.kafka.connect.runtime.WorkerSinkTask --method 'poll|convertMessages' --operation VALUES --operation EXCEPTION_THREADS
    - playground debug jscissors -c broker --class kafka.server.KafkaApis --method handleProduceRequest --restart
    - playground debug jscissors --class io.confluent.connect.jdbc.sink.BufferedRecords --only-failed --duration 2m
    - playground debug jscissors --class 'io.confluent.connect.s3.*' --slower-than 500ms --action start

  - name: flight-recorder
    help: |-
      🛩️ Record a JVM with Java Flight Recorder, from --action start to --action stop

      For a window of any length, in a script or by hand: start, reproduce the problem, stop. --action stop copies the
      .jfr to --output-dir and analyzes it with playground analyze flight-recorder (where the time of the connector tasks
      goes: states, CPU by layer, hot methods, allocation, locks, GC, findings), unless --no-analyze. Open it with JDK
      Mission Control (https://jdk.java.net/jmc/) for the details. To record for a fixed time and analyze in one
      command: playground analyze flight-recorder -c <container> --duration 2m.

      🔌 The recording is driven over JMX (FlightRecorderMXBean) when the container has a JMX port (KAFKA_JMX_PORT, SCHEMA_REGISTRY_JMX_PORT...), as in the
      playground environments: the cp images ship a JRE without jcmd, and nothing is installed or restarted. Otherwise
      (cfk pods), jcmd is used when the image has it.

      ⚙️ --settings playground (default) records what the analysis needs with a low overhead
      (tools/jfr-analyzer/playground.jfc); profile and default are the settings of the JDK; all records every event
      with no threshold (scripts/cli/all.jfc), for a deep dive in JDK Mission Control, with a high overhead.

      🔖 The recording of each container is kept in playground.ini (flight_recorder.<container>), --action status shows it.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-jvm-diagnostics
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%9B%A9%EF%B8%8F-a-slow-connector-where-does-the-task-time-go
    flags:
      - *container
      - long: --action
        allowed: [start, stop, status]
        arg: action
        required: true
        help: |-
          🟢 start, stop (copy the recording and analyze it) or status
      - long: --settings
        allowed: [playground, profile, default, all]
        arg: settings
        required: false
        default: "playground"
        help: |-
          ⚙️ Settings of the recording, used by --action start (default: playground)

            playground   what playground analyze flight-recorder needs, low overhead (tools/jfr-analyzer/playground.jfc)
            profile      settings of the JDK for profiling, about 2% overhead
            default      settings of the JDK for continuous recording, about 1% overhead
            all          every event, no threshold (scripts/cli/all.jfc): high overhead, for JDK Mission Control
      - long: --trace-method
        arg: method
        required: false
        repeatable: true
        help: |-
          🎯 With --action start, also record every call of this method, with its duration and its caller (method tracing of JDK 25+, JEP 520: the cp 8.3.2 images ship JDK 25): a class (all its methods), Class::method or @Annotation. The report gets a "Traced methods" section: calls, total, avg, max, the slowest calls and their stack. No argument values: for them, use playground debug jscissors

          🎓 Tip: you can pass multiple methods by specifying --trace-method multiple times
      - long: --output-dir
        short: -o
        arg: output_dir
        required: false
        default: "."
        help: |-
          📂 Folder for the .jfr and the HTML report of the analysis, used by --action stop (default: current folder)
      - long: --no-analyze
        required: false
        help: |-
          🙈 With --action stop, only copy the recording, do not analyze it
    examples:
    - playground debug flight-recorder --action start
    - playground debug flight-recorder --action stop
    - playground debug flight-recorder --action status
    - playground debug flight-recorder -c connect -c connect2 --action start --settings profile
    - playground debug flight-recorder --action stop --output-dir /tmp/jfr --no-analyze
    - playground debug flight-recorder --action start --trace-method io.confluent.connect.jdbc.sink.BufferedRecords --trace-method io.confluent.connect.jdbc.sink.JdbcDbWriter::write

  - name: log-level
    help: |-
      🧬 Set log level for any package

      Changes the level of any logger on the running connect worker, straight
      away and without a restart, so you do not have to edit log4j properties
      and rebuild the container.

      🎓 Tip: raise only the package you suspect, for instance
      io.confluent.connect.s3 or org.apache.kafka.clients.consumer, rather
      than the root logger, or the useful lines will be lost in the noise.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-log-levels
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%A7%AC-trace-on-a-running-connector-without-a-restart
    filters:
    - connect_running
    commands:
    - name: get
      help: |-
        Get log levels

        With no --package, every logger with an explicit level is listed.
      flags:
      - &package
        long: --package
        short: -p
        required: false
        validate: not_empty
        arg: package
        help: |-
          Package name

    - name: set
      help: |-
        Set log level for specific logger

        Takes effect immediately and applies to the logger and everything
        below it in the package hierarchy.
      flags:
      - long: --package
        short: -p
        required: true
        validate: not_empty
        arg: package
        help: |-
          📦 Package name

      - &level
        long: --level
        short: -l
        arg: level
        allowed: [INFO, WARN, DEBUG, TRACE]
        required: true
        help: |-
          ❕Log level

    examples:
    - playground debug log-level get
    - playground debug log-level get -p io.confluent.connect.oracle.cdc
    - playground debug log-level get --package io.confluent.connect.oracle.cdc
    - playground debug log-level set -p io.confluent.connect.oracle.cdc.logging.LogUtils -l TRACE

  - name: cfk
    expose: always
    group: Debug
    help: |-
      🧱 CFK debug sub-commands
    commands:
      - name: cfk-bundle-analyze
        private: true
        filename: commands/analyze/cfk-bundle.sh
        help: |-
          Moved to 'playground analyze cfk-bundle' (kept as a hidden alias)
        flags: *analyze_cfk_bundle_flags

      - name: generate-bundle
        help: |-
          ⛑️ Generate a Support bundle

          see https://docs.confluent.io/operator/current/co-troubleshooting.html#support-bundle

          🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-cfk
        filters:
        - cfk_environment
        dependencies:
          kubectl: visit https://kubernetes.io/docs/tasks/tools/ to install
        flags:
        - long: --follow-logs-duration
          arg: follow-logs-duration
          validate: integer
          required: false
          default: "0"
          help: |-
            Max duration to follow logs
        examples:
        - playground debug cfk generate-bundle

      - name: sourcecode
        help: |-
          🧑‍💻 Source code of the CFK operator at the version of a cluster or of a support bundle

          The helm chart version of CFK (0.1718.10 for CFK 3.3.0) is also the image tag of the operator and the git tag
          (v0.1718.10) of its source, in the private repository confluentinc/confluent-operator (Confluent only: gh auth
          login, VPN). The tag is cloned once, shallow, in /tmp/cfk-operator-sourcecode/confluent-operator-v<tag>, and the
          folder is printed as the last line, for an agent or an engineer to read the code that logs an error.

          --grep "<message>" searches a literal part of an operator message in the code (tests and vendor left out), with
          the GitHub link of each match. With --compare-with <version>, it also says whether the message is still there in
          another version, and which of its files changed (is it fixed after X?).

          🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-cfk
        dependencies:
          git: visit https://git-scm.com/downloads to install
        flags:
        - long: --cfk-version
          arg: version
          required: false
          help: |-
            🔢 CFK version (3.3.0), mapped to its operator tag
        - long: --operator-tag
          arg: tag
          required: false
          help: |-
            🏷️ Operator tag, the helm chart version (0.1718.10)
        - long: --bundle
          short: -f
          arg: bundle
          required: false
          completions:
            dynamic:
            - playground get-any-file-with-fzf "$completion_current"
          help: |-
            📦 CFK support bundle (folder, .tar.gz, .tgz, .zip): its operator version (cluster-details.txt, operator Deployment)
        - long: --grep
          arg: message
          required: false
          help: |-
            🔎 Literal text to search in the code, a part of an operator log message ("cluster not rollable from roll pre checks")
        - long: --compare-with
          arg: version
          required: false
          help: |-
            🆚 Another CFK version or operator tag: whether the --grep text is still there, which files changed, the GitHub compare link
        - long: --only-show-url
          required: false
          help: |-
            🔗 Only print the GitHub URL of the tag (and of the comparison with --compare-with), no clone
        - long: --checkout-only
          required: false
          help: |-
            📂 Clone the tag and print its folder as the last line (also what the command does without --grep / --compare-with)
        examples:
        - playground debug cfk sourcecode --cfk-version 3.3.0 --only-show-url
        - playground debug cfk sourcecode --bundle ./support-bundle-ns-confluent.tar.gz --grep "cluster not rollable from roll pre checks"
        - playground debug cfk sourcecode --cfk-version 3.2.3 --grep "missing inter replication credentials" --compare-with 3.3.0
        - playground debug cfk sourcecode --operator-tag 0.1718.10 --checkout-only

- name: get-jmx-metrics
  group: Kafka
  help: |-
    🔢 Get JMX metrics from a container
    
    👉 Check documentation https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%94%a2-jmx-metrics
  dependencies:
    java: visit https://openjdk.org/install/ to install
  flags:
  - *container
  - long: --open
    short: -o
    help: |- 
      🔖 Save output to a file and open with text editor set with playground config editor <editor> (default is code)

  - long: --domain
    short: -d
    required: false
    arg: domain
    help: |-
      Domain name

  examples:
  - playground get-jmx-metrics --container connect
  - playground get-jmx-metrics --container connect --domain "kafka.connect kafka.consumer kafka.producer"
  - playground get-jmx-metrics -c broker
  - playground get-jmx-metrics -c connect -c broker
  - playground get-jmx-metrics --container schema-registry --container ksqldb-server --open
  - playground get-jmx-metrics -c broker -c connect --domain "kafka.server"
  x_example_outputs:
  - command: 'playground get-jmx-metrics -c connect --domain "kafka.connect"'
    output: |-
      17:24:01 ℹ️ 🪄 Copying files with docker cp
      ####### domain kafka.connect ########
      Welcome to JMX terminal. Type "help" for available commands.
      #mbean = kafka.connect:client-id="connect:8083",type=app-info:
      start-time-ms = 1791901690493;

      commit-id = 328ff4d5ac3448d6;

      version = 8.3.2-ce;

      #mbean = kafka.connect:client-id=connect-adminclient-producer,node-id=node--1,type=connect-node-metrics:
      request-rate = 0.0;

      response-rate = 0.0;
      ...

- name: container
  expose: always
  alias: pod
  group: Container
  help: |-
    🐳 Container commands

    Work on the containers of the running example without having to remember
    their names, their users or their file layout. The same commands work
    against Kubernetes pods when the example runs on the cfk environment,
    which is why 'pod' is an accepted alias.

    🔍 Look inside
      logs                 tail logs, grep them, or block until a line appears
      display-error-all    every ERROR and FATAL across all containers
      get-properties       the properties file a component actually loaded
      get-ip-addresses     addresses on the docker network
      exec / ssh           run a command, or get a shell

    🔁 Act on them
      restart / kill / pause / resume
      recreate             re-create with the same compose definition
      update               edit the compose or Kubernetes definition, apply it
      set-environment-variables   add settings, then recreate
      cp                   copy files in and out
      change-jdk           swap the JDK, to reproduce a JVM-specific issue
      kill-all             kill everything and prune volumes

    Most commands accept --container several times to act on a few containers
    at once.

    🎓 Tip: the usual names are broker, connect, schema-registry,
    control-center, ksqldb-server, plus whatever the example adds.

    🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-container-lifecycle
    🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%90%B3-restart-or-recreate-what-a-container-keeps
  commands:

    - name: get-properties
      help: |-
        📝 Get properties file from a container
        
        👉 Check documentation https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%93%9d-see-properties-file

      flags:
      - *container
      examples:
      - playground container get-properties
      - playground container get-properties --container broker
      - playground container get-properties -c broker
      x_example_outputs:
      - command: playground container get-properties -c connect
        output: |-
          17:22:51 ℹ️ 📝 Displaying properties file for connect
          bootstrap.servers=broker:9092
          config.storage.topic=connect-configs
          group.id=connect-cluster
          key.converter=org.apache.kafka.connect.storage.StringConverter
          offset.storage.topic=connect-offsets
          plugin.path=/usr/share/filestream-connectors
          rest.port=8083
          status.storage.topic=connect-status
          value.converter=io.confluent.connect.avro.AvroConverter
          value.converter.schema.registry.url=http://schema-registry:8081
          ...

    - name: recreate
      group: Container
      help: |-
        💫 Recreate container(s)

        👉 Check documentation https://kafka-docker-playground.io/#/how-to-use?id=%e2%99%bb%ef%b8%8f-re-create-containers

        Replays the docker compose command of the example, so a container is
        rebuilt from its current definition. This is what applies a change
        made with 'playground container set-environment-variables' or
        'playground container update', and what you use to restart a component
        from scratch without re-running the whole example.
      flags:
      - long: --ignore-current-versions
        required: false
        help: |-
          Ignore current confluent platform version

          By default, the current version is used

    - name: update
      group: Container
      help: |-
        ✍️ Edit and apply runtime container/pod definition

        Opens the current docker-compose (non-CFK) or Kubernetes resource YAML (CFK)
        for the target container/pod in your configured editor and applies changes
        when you save and close the file.
      flags:
      - *container
      alias:
      - edit
      - alter
      examples:
      - playground container update --container connect
      - playground container update -c splunk
      - playground container update --container connect --container broker

    - name: get-ip-addresses
      group: Container
      help: |-
        🖥️  Get ip address of running containers

        The address each container has on the docker network, which is what
        you need when a component must be reached by IP rather than by name,
        or when you are checking what a client actually connected to.
      examples:
      - playground container get-ip-addresses
      x_example_outputs:
      - command: playground container get-ip-addresses
        output: |-
          17:22:19 ℹ️ Get IP address of running containers
          /controller - 10.89.0.2
          /broker - 10.89.0.4
          /schema-registry - 10.89.0.6
          /connect - 10.89.0.7

    - name: kill-all
      group: Container
      help: |-
        💀 Kill all containers and prune all volumes

        Kills every container on your machine, playground or not, and prunes
        the volumes. Used automatically before each 'playground run' to
        guarantee a clean slate; disable that with
        'playground config container-kill-all-before-run false'.

    - name: logs
      group: Container
      help: |-
        🕵️  Tail and follow container logs

        Three ways to use it:

          --grep "ERROR"                    keep only the lines that matter
          --open                            read the whole log in your editor
          --wait-for-log "Started" -m 120   block until the line shows up

        The last one is what example scripts use to synchronise on a component
        being ready, instead of sleeping and hoping.

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-container-logs
        🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%95%B5%EF%B8%8F-a-connector-failed-read-the-logs-live-or-from-a-customer-bundle
      flags:
      - *container
      - long: --open
        short: -o
        help: |- 
          🔖 Save output to a file and open with text editor set with playground config editor <editor> (default is code)
        conflicts: [--wait-for-log, --grep, --errors]
      - long: --wait-for-log
        short: -w
        arg: log
        validate: not_empty
        help: |- 
          😴 Wait until log appears
        conflicts: [--open, --grep, --errors]
      - &logsmaxwait
        long: --max-wait
        short: -m
        arg: max_wait
        validate: integer
        default: "600"
        help: |- 
          ⏳ Max time in seconds to wait when using --wait-for-log (default 600s)
        conflicts: [--open, --grep]
      - long: --grep
        arg: grep
        required: false
        default: ""
        help: |-
          🎯 Grep pattern to filter logs

        conflicts: [--open, --wait-for-log, --errors]

      - long: --previous
        required: false
        help: |-
          🕰️ Show logs from the previous pod instance (only relevant when --environment=cfk is used)

      - long: --since
        arg: since
        required: false
        validate: not_empty
        help: |-
          🕐 Only show logs newer than a relative duration (10m, 1h) or a timestamp (2026-09-24T16:00:00)
        conflicts: [--open, --wait-for-log]

      - long: --tail
        arg: lines
        required: false
        help: |-
          🔢 Number of lines to show from the end of the logs, or "all"

          Default is 200, or all when --since, --errors, or --grep with --no-follow is used
        conflicts: [--open, --wait-for-log]

      - long: --no-follow
        required: false
        help: |-
          🛑 Print the logs and exit instead of following them

          🎓 Tip: use it in scripts and from AI agents, which otherwise never get the command back
        conflicts: [--open, --wait-for-log]

      - long: --errors
        required: false
        help: |-
          🔥 Only show a digest of ERROR/FATAL records, then exit

          Repeated records are de-duplicated with an occurrence count, stack
          traces are collapsed to the exception chain ("Caused by:") plus a few
          frames of the deepest cause. Only records with an explicit level are
          reported (" ERROR ", "[ERROR]", level=error, "level":"error"), plus
          uncaught java exceptions: records logged at INFO/DEBUG/TRACE, and
          level-less lines that merely contain "error" or "failed", never are.

          Scans the whole log unless --since or --tail narrow it.
        conflicts: [--open, --wait-for-log, --grep]

      - long: --include-warnings
        required: false
        help: |-
          🟠 With --errors, also report WARN records
        needs: [--errors]

      - long: --max-findings
        arg: max_findings
        required: false
        validate: integer
        default: "40"
        help: |-
          ✂️ With --errors, maximum number of distinct records to show (default 40)

      - long: --html
        required: false
        needs: [--errors]
        help: |-
          🌐 With --errors, also write a self-contained HTML report of the digest in /tmp/playground-log-reports (known causes, timeline, root causes, every distinct record), opened in the browser in an interactive terminal
      examples:
      - playground container logs --container connect
      - playground container logs -c connect --errors
      - playground container logs -c connect -c broker --errors --html
      - playground container logs -c connect --errors --since 10m --include-warnings
      - playground container logs -c connect --grep "Caused by" --no-follow
      - playground container logs -c connect --no-follow --tail 500
      - playground container logs -c connect --open
      - playground container logs -c connect --wait-for-log "StackOverflowError"
      - playground container logs -c connect -c broker
      - playground container logs --container schema-registry --container ksqldb-server --open
      - playground container logs -c broker -c connect -c schema-registry
      - playground container logs -c connect -c broker --wait-for-log "ERROR" --max-wait 120
      - playground container logs --container connect --grep "ERROR"
      - playground pod logs --previous
      x_example_outputs:
      - command: playground container logs -c connect --errors
        output: |-
          17:22:10 ℹ️ 🔥 ERROR/FATAL digest for connect logs
          ✅ no ERROR/FATAL record found in 12523 lines
      - command: playground container logs -c connect --errors --include-warnings --max-findings 2
        output: |-
          17:22:50 ℹ️ 🔥 ERROR/FATAL digest for connect logs
          🔎 7 distinct record(s), 13 occurrence(s), in 12743 lines

          🟠 WARN x7 (first seen line 108, last seen line 471)
          [2026-10-13 14:27:56,953] WARN [AdminClient clientId=adminclient-1] Connection to node -1 (broker/10.89.0.4:9092) could not be established. Node may not be available. (org.apache.kafka.clients.NetworkClient:899)

          🟠 WARN x1 (first seen line 737, last seen line 737)
          WARNING: A terminally deprecated method in sun.misc.Unsafe has been called

          ✂️ 5 more distinct record(s) not shown, increase --max-findings or narrow with --since
      footer: |-
        Example output:
          $ playground container logs -c connect --errors
          17:22:10 ℹ️ 🔥 ERROR/FATAL digest for connect logs
          ✅ no ERROR/FATAL record found in 12523 lines

    - name: display-error-all
      group: Container
      help: |-
        🔥 Display all ERROR/FATAL logs in all containers/pods. Useful for quick troubleshooting

        The first command to run when an example misbehaves and you do not yet
        know which component is at fault. It sweeps every container at once,
        so you do not have to guess where to look.

        Each container gets the same digest as 'playground container logs
        --errors': repeated records are de-duplicated with an occurrence count
        and stack traces are collapsed to their "Caused by:" chain. Containers
        without any finding are only listed in a final one-line summary. The
        last lines of connect are always shown raw, for failures that log no
        error.
      flags:
      - long: --since
        arg: since
        required: false
        validate: not_empty
        help: |-
          🕐 Only scan logs newer than a relative duration (10m, 1h) or a timestamp (2026-09-24T16:00:00)

      - long: --include-warnings
        required: false
        help: |-
          🟠 Also report WARN records

      - long: --max-findings
        arg: max_findings
        required: false
        validate: integer
        default: "15"
        help: |-
          ✂️ Maximum number of distinct records to show per container (default 15)

      - long: --html
        required: false
        help: |-
          🌐 Also write a self-contained HTML report of all the containers in /tmp/playground-log-reports (known causes, timeline, root causes, every distinct record), opened in the browser in an interactive terminal
      examples:
      - playground container display-error-all
      - playground container display-error-all --since 10m --include-warnings
      - playground container display-error-all --html

    - name: ssh
      group: Container
      help: |-
        🛬 SSH into container

        Interactive shell inside the container, as the user the component runs
        with. Use 'playground container exec' instead when you want to run a
        single command from a script.

      flags:
      - *container

      - long: --shell
        short: -s
        required: false
        default: "bash"
        arg: shell
        allowed: 
          - bash
          - sh
          - ksh
          - zsh
        help: |-
          💾 Shell to use (default is bash)

      examples:
      - playground container ssh -c connect
      - playground container ssh -c connect -s sh
      - playground container ssh --container connect --shell sh
      - playground container ssh -c broker
      - playground container ssh --container schema-registry --shell zsh

    - name: change-jdk
      group: Container
      help: |-
        🤎 Change java JDK version using Azul JDK (https://www.azul.com/downloads/#downloads-table-zulu)

        PS: It works for UBI8 docker images only

      flags:
      - *container

      - long: --version
        required: true
        arg: version
        allowed: 
          - "8"
          - "11"
          - "17"
          - "21"
          - "22"
          - "25"
        help: |-
          🤎 JDK version to use

      examples:
      - playground container change-jdk --container connect --version 17

    - name: exec
      group: Container
      help: |-
        🪄 Execute command in a container

        Runs one command and returns, which makes it the form to use inside
        example scripts. Add --root when the component user is not allowed to
        do what you are asking, typically to install a package or read a file
        under /etc.

      flags:
      - *container

      - long: --command
        required: true
        validate: not_empty
        arg: command
        help: |-
          📲 Command to execute

      - long: --root
        help: |-
          👑 Run command as root

      - long: --shell
        default: "bash"
        arg: shell
        allowed: 
          - bash
          - sh
          - ksh
          - zsh
        help: |-
          💾 Shell to use (default is bash)

      examples:
      - playground container exec -c connect --command "date"
      - playground container exec -c connect --command "whoami" --root
      - playground container exec --container connect --command "whoami" --shell sh
      - playground container exec -c broker -c connect --command "ps aux"
      - playground container exec --container schema-registry --container ksqldb-server --command "free -h"
      - playground container exec -c connect -c broker --command "netstat -tuln" --root

    - name: cp
      group: Container
      help: |-
        🪄 Copy files between local filesystem and container

        Works in both directions, using the container:path notation. Typically
        used to drop a jar, a certificate or a test file into a component, or
        to pull out a file the connector has written.

      flags:
      - long: --source
        required: true
        validate: not_empty
        arg: source
        help: |-
          📥 Source path (local path or container:path)

      - long: --destination
        required: true
        validate: not_empty
        arg: destination
        help: |-
          📤 Destination path (local path or container:path)

      examples:
      - playground container cp --source ./file.txt --destination connect:/tmp/file.txt
      - playground container cp --source connect:/tmp/file.txt --destination ./file.txt

    - name: restart
      group: Container
      help: |-
        🔁 Restart a container

        Stops and starts the container, keeping its definition and its data.
        Use 'playground container recreate' instead if you changed the compose
        definition or an environment variable.

      flags:
      - *container

    - name: pause
      group: Container
      help: |-
        ⏸️  Pause a container

        Freezes the processes without stopping the container: it keeps its
        connections but stops responding. A good way to simulate a hung
        broker, an unresponsive database or a GC pause, and to see how the
        rest of the system reacts.

      flags:
      - *container

    - name: resume
      alias: unpause
      group: Container
      help: |-
        ⏯️  Resume a container

        Unfreezes a container paused with 'playground container pause'.

      flags:
      - *container

    - name: kill
      group: Container
      help: |-
        🔫 Kill a container

        Stops the container abruptly, without letting it shut down cleanly,
        which is how you simulate a crash. Bring it back with
        'playground container recreate'.

      flags:
      - *container
      examples:
      - playground container kill --container connect
      - playground container kill -c broker
      - playground container kill -c connect -c broker
      - playground container kill --container schema-registry --container ksqldb-server --container control-center

    - name: set-environment-variables
      group: Container
      help: |-
        📦  Set environment variable(s) for a container

        🎓 Tip: you can pass multiple environment variables by specifying --env multiple times

        Example: --env "KAFKA_OPTS: -verbose:class" --env "CONNECT_LOG4J_LOGGERS: org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR,org.apache.kafka.connect.runtime.rest.RestServer=ERROR"

      flags:
      - *container
      - long: --env
        required: false
        repeatable: true
        conflicts:
          - --restore-original-values
        arg: env
        help: |-
          📦 Environment variables to set

          🎓 Tip: you can pass multiple environment variables by specifying --env multiple times
      - long: --restore-original-values
        conflicts:
          - --env
        required: false
        help: |-
          🧽 Restore back original values before any changes was made
      - long: --mount-jscissors-files
        required: false
        private: true
        help: |-
          Mount jscissors files for debugging

    - name: wait-for-connect-rest-api-ready
      group: Container
      private: true
      help: |-
        🚏 wait-for-connect-rest-api-ready
      flags:
        - long: --max-wait
          arg: max_wait
          validate: integer
          default: "300"
          help: |- 
            ⏳ Max time in seconds to wait

- name: topic
  expose: always
  group: Topic
  help: |-
    🗳 Topic commands

    Produce, consume and manage topics without dealing with the kafka-* shell
    scripts: the bootstrap server, the security properties and the schema
    registry url are all derived from the running environment, so the same
    command works on plaintext, on sasl-ssl and on Confluent Cloud.

    📤 Get data in
      produce         generate records from a schema, or from your own data
      create          create a topic with the partitions you need

    📥 Get data out
      consume         read from the beginning, deserialising automatically
      get-number-records   count what is in the topic
      wait-for-records     wait until the topic contains N records
      get-offsets          earliest and latest offsets per partition
      compare              a topic and its replica, is everything replicated?
      display-consumer-offsets   read the internal offsets topic

    🔧 Manage
      list / describe / alter / delete
      reassign / elect-leader   move replicas between brokers, move leaders
      dlq inspect / replay   dead letter queue grouped by error, and replay
      set-schema-compatibility   compatibility of the topic subjects
      tag             stream catalog tags (Confluent Cloud only)

    Serialisation is handled for you: 'produce' registers the schema you give
    it and 'consume' works out from the payload whether it is avro, protobuf,
    json schema or plain text.

    🎓 Tip: in an example script, 'consume --min-expected-messages N' is the
    assertion that the data made it through; it fails the run if it did not.
  commands:

    - name: get-number-records
      group: Topic
      help: |-
        💯 Get number of records in a topic

        Counts the records currently in the topic, from the partition offsets.
        The cheap way to check that a source connector produced something, or
        that a sink has data to read.

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-topic-administration
        🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%AA%9B-a-producer-gets-recordtoolargeexception
      flags:
      - &topic
        long: --topic
        short: -t
        required: false
        arg: topic
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Topic name
      - long: --isolation-level
        arg: isolation-level
        required: false
        private: true
        allowed: 
          - read_uncommitted
          - read_committed
        default: "read_uncommitted"
        help: |-
          🫥 The isolation level to use, see https://docs.confluent.io/platform/current/installation/configuration/consumer-configs.html#isolation-level
          If not set, default is read_uncommitted
      - *cluster
      examples:
      - playground topic get-number-records --topic a-topic
      - playground topic get-number-records -t a-topic
      x_example_outputs:
      - command: playground topic get-number-records --topic filestream
        output: |-
          17:22:53 ℹ️ 💯 Get number of records in topic filestream
          5

    - name: wait-for-records
      group: Topic
      help: |-
        ⏳ Wait for a topic to contain a minimum number of records

        Counts the records in the topic every --interval seconds (same count as
        'get-number-records') until there are at least
        --min-expected-messages, and fails after --max-wait seconds. A topic
        that does not exist yet counts as empty, so it can be used before a
        source connector has created its topic.

        🎓 Tip: in an example script, use it instead of a fixed sleep before
        checking what a source connector produced.

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-topic-administration
        🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%AA%9B-a-producer-gets-recordtoolargeexception
      flags:
      - long: --topic
        short: -t
        required: true
        arg: topic
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Topic name
      - long: --min-expected-messages
        arg: min_expected_messages
        validate: integer
        required: false
        default: "1"
        help: |-
          🔢 Minimum number of records to wait for (default is 1)
      - long: --max-wait
        arg: max_wait
        validate: integer
        default: "120"
        help: |-
          ⏳ Max time in seconds to wait (default is 120)
      - long: --interval
        arg: interval
        validate: integer
        default: "5"
        help: |-
          🔁 Interval in seconds between checks (default is 5)
      - *cluster
      examples:
      - playground topic wait-for-records --topic filestream
      - playground topic wait-for-records --topic filestream --min-expected-messages 10 --max-wait 300
      x_example_outputs:
      - command: playground topic wait-for-records --topic filestream --min-expected-messages 5
        output: |-
          17:22:53 ℹ️ ⏳ Waiting up to 120 seconds for topic filestream to contain at least 5 records
          17:22:58 ℹ️ ✅ topic filestream contains 5 records (expected at least 5) after 5 seconds

    - name: get-offsets
      group: Topic
      help: |-
        📍 Get earliest and latest offsets per partition of a topic

        The low and high watermarks of every partition, and the number of
        records in between. Useful to see whether retention has already
        deleted data, which partitions received records, or which offsets a
        connector should be at.

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-topic-administration
        🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%AA%9B-a-producer-gets-recordtoolargeexception
      flags:
      - *topic
      - *verbose
      - *cluster
      examples:
      - playground topic get-offsets --topic a-topic
      x_example_outputs:
      - command: playground topic get-offsets --topic filestream
        output: |-
          17:22:55 ℹ️ 📍 Earliest and latest offsets per partition of topic filestream
          PARTITION  EARLIEST        LATEST          RECORDS
          0          0               5               5
          TOTAL                                      5

    - name: compare
      group: Topic
      help: |-
        🔀 Compare a topic with its replica: is everything replicated?

        Earliest and latest offsets and number of records of every partition, on
        both sides, and what the destination misses. In an mdc-* environment
        the two sides are the clusters given with --from and --to (Replicator,
        MirrorMaker 2, Cluster Linking); elsewhere, two topics of the same
        cluster (--to-topic).

        Exits 1 when the destination has fewer records than the source. The
        counts come from the offsets: transaction markers and compaction make
        them approximate.

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-replication
      flags:
      - long: --topic
        short: -t
        required: true
        arg: topic
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Topic name in the source
      - long: --to-topic
        required: false
        arg: to_topic
        help: |-
          🎯 Topic name in the destination (default: the same name). MirrorMaker 2
          prefixes it with the source alias, e.g. EUROPE.sales_EUROPE
      - long: --from
        required: false
        arg: from
        allowed: [us, europe]
        help: |-
          🌍 Source cluster in an mdc-* environment
      - long: --to
        required: false
        arg: to
        allowed: [us, europe]
        help: |-
          🌍 Destination cluster in an mdc-* environment
      - long: --wait
        required: false
        help: |-
          ⏳ Wait until the destination has as many records as the source
      - long: --max-wait
        arg: max_wait
        required: false
        default: "120"
        validate: integer
        help: |-
          ⏳ Max seconds to wait with --wait (default 120)
      - long: --json
        required: false
        help: |-
          🤖 Print the comparison as JSON
      - *verbose
      examples:
      - playground topic compare --topic sales_EUROPE --from europe --to us
      - playground topic compare --topic sales_EUROPE --to-topic EUROPE.sales_EUROPE --from europe --to us --wait
      - playground topic compare --topic test-topic --to-topic test-topic-duplicate

    - name: display-consumer-offsets
      group: Topic
      help: |-
        📭 Display content of __consumer_offsets topic

        Decodes the internal topic where Kafka keeps committed offsets, so you
        can see exactly what each consumer group, including a sink connector,
        has committed and when.
      flags:
      - *verbose
      - *cluster

    - name: list
      group: Topic
      help: |-
        🔘 List topics

        Add --show-internal to also see the topics Kafka and Connect maintain
        for themselves, such as the connect configs, offsets and status
        topics.

        Add --sort-by-size to show the size and number of partitions of each
        topic, largest first (same as 'playground topic get-size').

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-topic-administration
        🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%AA%9B-a-producer-gets-recordtoolargeexception
      flags:
      - long: --show-internal
        help: |-
          🫥 Display internal topics
        required: false
      - long: --sort-by-size
        help: |-
          📏 Display size and number of partitions of each topic, largest first
        required: false
      - *cluster
      examples:
      - playground topic list
      - playground topic list --sort-by-size
      x_example_outputs:
      - command: playground topic list
        output: |-
          17:22:16 ℹ️ 🔘 List of topics (internal topics are excluded)
          filestream

    - name: get-size
      group: Topic
      help: |-
        📏 Get size of topics

        Shows the size and number of partitions of each topic, largest first,
        to find which topics take the most disk space. Without --topic, all
        topics are shown (add --show-internal to include internal topics).

        The size of a partition is the size of its largest replica, the size
        of a topic is the sum of its partitions.

        With ccloud environment, sizes come from the retained_bytes metric of
        the Metrics API, which lags a few minutes behind and requires
        CONFLUENT_CLOUD_API_KEY and CONFLUENT_CLOUD_API_SECRET (Cloud API key).
      flags:
      - *topic
      - long: --show-internal
        help: |-
          🫥 Include internal topics (when --topic is not set)
        required: false
      - *cluster
      examples:
      - playground topic get-size
      - playground topic get-size --topic filestream
      - playground topic get-size --show-internal

    - name: describe
      group: Topic
      help: |-
        🔬 Describe topic

        Partitions, replicas, in-sync replicas and the configuration overrides
        set on the topic. Where to look when records go to an unexpected
        partition, or when a topic is not retaining what you expected.

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-topic-administration
        🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%AA%9B-a-producer-gets-recordtoolargeexception
      flags:
      - *topic
      - *verbose
      - *cluster
      examples:
      - playground topic describe --topic filestream
      x_example_outputs:
      - command: playground topic describe --topic filestream
        output: |-
          17:22:51 ℹ️ 🔎 Describing topic filestream
          Topic: filestream  TopicId: ZTSM7bjsQxq2aigCM3C-8w  PartitionCount: 1  ReplicationFactor: 1  Configs: min.insync.replicas=1
              Topic: filestream  Partition: 0  Leader: 1  Replicas: 1  Isr: 1  Offline:   Elr:   LastKnownElr:

    - name: reassign
      group: Topic
      filters:
      - not_ccloud_environment
      help: |-
        🔀 Move the replicas of a topic to other brokers

        Wraps kafka-reassign-partitions, to reproduce a partition
        reassignment or a rebalance (needs several brokers: playground run
        --enable-multiple-brokers, brokers 1, 2 and 3). Set one of:

          --replicas 2,3   the replicas of every partition (or of --partition):
                           the first one is the preferred leader
          --brokers 1,2,3  a balanced plan over these brokers, generated by
                           kafka-reassign-partitions --generate (same
                           replication factor)

        Displays the current and the new assignment, executes it, and waits
        until the reassignment is completed (kafka-reassign-partitions
        --verify, which also removes the --throttle). The leaders only move to
        the new preferred replicas after a leader election: see 'playground
        topic elect-leader'.

        🎓 Tip: --throttle limits the replication traffic of the move, to
        keep a reassignment running for a while (under-replicated
        partitions, clients refreshing their metadata).
      flags:
      - long: --topic
        short: -t
        required: true
        arg: topic
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Topic name
      - long: --partition
        short: -p
        required: false
        arg: partition
        validate: integer
        help: |-
          🔢 Only reassign this partition (with --replicas)
      - long: --replicas
        required: false
        arg: replicas
        conflicts: [--brokers]
        help: |-
          🖥️ Comma separated broker ids of the replicas, preferred leader first (e.g. 2,3)
      - long: --brokers
        required: false
        arg: brokers
        conflicts: [--replicas, --partition]
        help: |-
          ⚖️ Comma separated broker ids to spread the partitions over (e.g. 1,2,3)
      - long: --throttle
        required: false
        arg: bytes
        validate: integer
        help: |-
          🐢 Replication throttle during the move, in bytes per second
      - long: --dry-run
        required: false
        help: |-
          🧪 Only display the current and new assignment
      - long: --no-wait
        required: false
        help: |-
          ⏩ Do not wait for the reassignment to complete (check it again with the same command and --verify-only)
      - long: --verify-only
        required: false
        help: |-
          🔎 Only display the progress of a reassignment started with --no-wait (and remove its throttle when it is completed)
      - long: --max-wait
        required: false
        arg: max-wait
        validate: integer
        default: "300"
        help: |-
          ⏳ Maximum time to wait for the reassignment, in seconds (default 300)
      - *verbose
      examples:
      - playground topic reassign --topic orders --replicas 2,3
      - playground topic reassign --topic orders --partition 0 --replicas 3,1,2
      - playground topic reassign --topic orders --brokers 1,2,3 --throttle 1024 --dry-run

    - name: elect-leader
      group: Topic
      filters:
      - not_ccloud_environment
      help: |-
        👑 Elect the leaders of a topic

        Wraps kafka-leader-election. By default, a preferred leader
        election: each partition gets back its first replica as leader (what
        auto.leader.rebalance.enable does every 5 minutes).

        With --leader, a controlled leadership move: the broker is first put
        first in the replicas of the partitions (a reassignment without data
        movement, it must already be a replica), then elected. Useful to
        reproduce a leader change (NOT_LEADER_OR_FOLLOWER, metadata refresh)
        without stopping a broker.

        --unclean elects a replica that is not in sync when no in-sync
        replica is available (data loss).
      flags:
      - long: --topic
        short: -t
        required: true
        arg: topic
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Topic name
      - long: --partition
        short: -p
        required: false
        arg: partition
        validate: integer
        help: |-
          🔢 Only this partition (default: all the partitions of the topic)
      - long: --leader
        required: false
        arg: broker
        validate: integer
        conflicts: [--unclean]
        help: |-
          👑 Broker id to make leader (it must be a replica of the partition)
      - long: --unclean
        required: false
        conflicts: [--leader]
        help: |-
          ☢️ Unclean leader election (an out-of-sync replica can become leader)
      - *verbose
      examples:
      - playground topic elect-leader --topic orders
      - playground topic elect-leader --topic orders --partition 0 --leader 2
      - playground topic elect-leader --topic orders --unclean

    - name: set-schema-compatibility
      filters:
      - schema_registry_running
      group: Topic
      help: |-
        🛡️ Change topic's schema compatibility

        Sets the compatibility level on the subjects of the topic, which is
        what you relax to let an otherwise rejected schema evolution through,
        for instance to reproduce a schema compatibility issue.
      flags:
      - *topic
      - *compatibility-required
      - *verbose
      - *cluster

    - name: consume
      filters:
      - schema_registry_running
      group: Topic
      help: |-
        📥 Consume topic from beginning

        Reads from the earliest offset and deserialises records on its own:
        the subjects <topic>-key and <topic>-value of Schema Registry decide
        between the avro, protobuf, json schema and plain console consumers
        (use --key-subject / --value-subject for other subject names).

        🎓 Tip: --min-expected-messages turns it into an assertion. It waits
        up to --timeout for that many records, consumes them and fails if
        fewer could be consumed (records that cannot be deserialized do not
        count), which is how examples verify that data actually flowed.

        The consumer stops when no record arrives for 10 seconds (30 seconds
        on Confluent Cloud), so it never waits for records that cannot come
        (transaction markers and compacted records use offsets).

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-topic-consume
        🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%93%A5-read-a-topic
      flags:
      - *verbose
      - *topic
      - long: --max-messages
        arg: max-messages
        validate: integer
        required: false
        default: "100"
        help: |-
          Max number of messages to display (default is 100)

          You can use -1 to display all messages
          
      - long: --min-expected-messages
        arg: min-expected-messages
        validate: integer
        required: false
        default: "0"
        help: |-
          Minimum expected number of records to be consumed from the topic, returns an error if this is not the case

          Records that cannot be deserialized are reported and do not count.

          Note: --topic should be specified in this case.
      - long: --grep
        arg: grep
        required: false
        default: ""
        help: |-
          Verify that topic content contains record which contains specified string

          It is searched in the records as displayed (decoded when base64 encoded), and the command fails when no record contains it.
      - long: --timeout
        arg: timeout
        validate: integer
        required: false
        default: "60"
        help: |-
          Max number of seconds to wait when --min-expected-messages is used.

          Default is 60 seconds
      - long: --tail
        required: false
        help: |-
          Tail on logs.
        conflicts: [--min-expected-messages, --max-messages, --open]

      - long: --key-subject
        required: false
        arg: key-subject
        completions:
          dynamic:
          - playground get-subject-list
        help: |-
          📛 Subject for key in schema-registry to use (useful when data was produced with --key-subject-name-strategy other than TopicNameStrategy)
          
          Note: --topic should be specified in this case.

      - long: --value-subject
        required: false
        arg: value-subject
        completions:
          dynamic:
          - playground get-subject-list
        help: |-
          📛 Subject for value in schema-registry to use (useful when data was produced with --value-subject-name-strategy other than TopicNameStrategy)
          
          Note: --topic should be specified in this case.

      - long: --max-characters
        arg: max-characters
        validate: integer
        required: false
        default: "3000"
        help: |-
          Max characters per message to display (default is 3000, 0 for no limit)

      - long: --open
        short: -o
        help: |- 
          🔖 Save full dump of topic to a file and open with text editor set with playground config editor <editor> (default is code)
        conflicts: [--max-characters, --tail, --min-expected-messages]

      - long: --isolation-level
        arg: isolation-level
        required: false
        allowed: 
          - read_uncommitted
          - read_committed
        default: "read_uncommitted"
        help: |-
          🫥 The isolation level to use, see https://docs.confluent.io/platform/current/installation/configuration/consumer-configs.html#isolation-level
          If not set, default is read_uncommitted

      - long: --last
        arg: last
        validate: integer
        required: false
        help: |-
          ⏮️ Display the last N records of the topic (the most recent ones, sorted by timestamp across partitions),
          instead of the first --max-messages

          Example: --last 10
        conflicts: [--tail, --from-timestamp, --offset, --min-expected-messages, --open, --count]

      - long: --from-timestamp
        arg: from-timestamp
        required: false
        help: |-
          ⏱️ Display the records from this time (sorted by timestamp across partitions, --max-messages still applies)

          Accepted values:

          * a date, in local time: "2026-10-22 10:30", "2026-10-22T10:30:00.250" (add Z for UTC: "2026-10-22T08:30:00Z")
          * an epoch, in milliseconds or seconds: 1792660170522
          * a duration ago: 30s, 10m, 2h, 1d
        conflicts: [--tail, --last, --offset, --open]

      - long: --partition
        arg: partition
        validate: integer
        required: false
        help: |-
          🧩 Only consume this partition (with --offset, from that offset; otherwise from the beginning, or new records with --tail)
        conflicts: [--open]

      - long: --offset
        arg: offset
        required: false
        needs: [--partition]
        help: |-
          📍 Offset of --partition to start from: a number, earliest or latest

          Example: --partition 0 --offset 1234 --max-messages 1, the record a connector is stuck on
        conflicts: [--tail, --last, --from-timestamp, --open]

      - long: --json
        required: false
        help: |-
          🧾 Print each record as a json object on one line (topic, partition, offset, timestamp, date, headers, key,
          value, schema ids): key and value are embedded as json when they are valid json, as strings otherwise.

          Only the records go to stdout, everything else goes to stderr, so the output can be piped to jq.

          Example: playground topic consume --topic orders --json | jq -r '.value.id'
        conflicts: [--open, --count, --tail]

      - long: --count
        required: false
        help: |-
          🔢 Only print the number of records consumed (with --grep, the number of records containing that string),
          on stdout: logs go to stderr. Without --topic, one "<topic> <number>" line per topic.

          Unlike playground topic get-number-records, records are counted, not offsets (transaction markers,
          compacted records and records that cannot be deserialized do not count)
        conflicts: [--tail, --open, --json]

      - long: --no-decode
        required: false
        help: |-
          🤖 Never decode the values, even when they look base64 encoded (by default, they are decoded when the first
          record is valid base64 of printable utf-8)

      - long: --print-schema
        required: false
        help: |-
          📜 Also print the key and value schemas registered for the topic
      - *cluster
      examples:
      - playground topic consume --topic filestream --min-expected-messages 2 --timeout 30
      x_example_outputs:
      - command: playground topic consume --topic filestream --min-expected-messages 2 --timeout 30
        output: |-
          17:23:00 ℹ️ ✨ Display content of topic filestream, it contains 5 messages
          17:23:00 ℹ️ 🔮🙅 topic is not using any schema for key
          17:23:00 ℹ️ 🔮🙅 topic is not using any schema for value
          CreateTime:2026-10-13 16:28:16.239|Partition:0|Offset:0|Headers:NO_HEADERS|Key:null|Value:{"id":1,"name":"Asha_Fadel50","email":"Euna.Anderson37@example.com","city":"Duluth","company":"Jacobson - Crooks"}
          CreateTime:2026-10-13 16:28:16.243|Partition:0|Offset:1|Headers:NO_HEADERS|Key:null|Value:{"id":2,"name":"Clare50","email":"Pat4@example.net","city":"West Dinoboro","company":"Hodkiewicz, Effertz and Heidenreich"}
          ...
          
    - name: produce
      filters:
      - schema_registry_running
      group: Topic
      help: |-
         📤 Produce to a topic

         See video tutorial https://youtu.be/mbzHCewG_XE

         Generates records for you rather than making you write them. Give it
         a schema, in avro, json schema or protobuf, and it registers the
         schema and produces --nb-messages records of realistic random data.
         The topic is created if it does not exist.

         Three ways to say what to send:

           a schema on stdin           generated data matching that schema
           --value <predefined>        one of the bundled schemas
           --forced-value '{...}'      your exact payload, %g being the index

         🎓 Tip: pipe the schema with a quoted heredoc, << 'EOF', so that the
         %g placeholders survive the shell.

         🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-topic-produce
         🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%93%A8-produce-realistic-test-data
      flags:

      - long: --key
        arg: key
        required: false
        completions:
          dynamic:
          - playground get-predefined-schemas "$completion_current"
        help: |-
          🗝️ Key to use. If not set, no key is used.

          🔥 You can either:
          
          * Set your own schema (avro, json-schema, protobuf) within single quotes (see examples) 
          
          * You can also generate json data using json or sql format using syntax from https://github.com/MaterializeInc/datagen

          * You can also generate json data using syntax from https://github.com/vdesabou/avro-random-generator (same as datagen source connector)

          * Use completion to select predefined schemas (or use your own schema file) 🎓 Tip: use <tab> completion to trigger fzf completion

          * Directly set payload ("%g" can be used to generate a counter)

          In case of 'raw' data (i.e not using schema):

          If the key contain a number, it will be used as starting point and incremented for each record. 
          
          Example: key1 will start with key1, then key2, etc..
          Example: mykey-10-suffix will start with mykey-10-suffix then mykey-11-suffix, etc..

          "%g" can also be used to generate a counter

          Example: key%g will start with key1, then key2, etc..

          Otherwise, the key will be same for all records.

      - long: --value
        arg: value
        completions:
          dynamic:
          - playground get-predefined-schemas "$completion_current"
        default: "-"
        required: false
        help: |- 
          🔥 You can either:
          
          * Set your own schema (avro, json-schema, protobuf) with stdin (see example section). 
          
          * You can also generate json data using json or sql format using syntax from https://github.com/MaterializeInc/datagen

          * You can also generate json data using syntax from https://github.com/vdesabou/avro-random-generator (same as datagen source connector)

          * Use completion to select predefined schemas (or use your own schema file) 🎓 Tip: use <tab> completion to trigger fzf completion

          * Directly set payload ("%g" can be used to generate a counter)

      - long: --value-format
        arg: value-format
        required: false
        allowed:
          - avro
          - json-schema
          - protobuf
          - json
          - sql
          - datagen
          - raw
        help: |-
          🔮 Format of --value, instead of detecting it from its content

          Detection looks for keywords (proto3, "type": "object", "_meta", CREATE TABLE, arg.properties,
          "type": "record"), so a raw payload containing one of them is not sent as raw data:
          use --value-format raw in that case.

          Cannot be used with --derive-value-schema-as.

      - long: --key-format
        arg: key-format
        required: false
        allowed:
          - avro
          - json-schema
          - protobuf
          - json
          - sql
          - datagen
          - raw
        help: |-
          🔮 Format of --key, instead of detecting it from its content (see --value-format)

          Cannot be used with --derive-key-schema-as.

      - *verbose
      - long: --debug
        short: -d
        required: false
        private: true
        help: |-
          debug mode (internal)
      - long: --topic
        short: -t
        required: true
        arg: topic
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Topic name
      - long: --nb-messages
        arg: nb-messages
        validate: integer
        required: false
        default: "1"
        help: |-
          💯 Number of messages to produce (default is 1)
             
          🎓  - if > <value of --max-nb-messages-per-batch> (default 300000), messages will be sent in batches of <value of --max-nb-messages-per-batch> (default 300000) records
              - if you set it to -1, an infinite number of records will also be sent in batches
      - long: --max-nb-messages-per-batch
        arg: max-nb-messages-per-batch
        validate: integer
        required: false
        default: "300000"
        help: |-
          🔼 Max number of messages to send per batch when --nb-messages > --max-nb-messages-per-batch
             if --nb-messages is set to -1, this is the number of messages sent per batch
             default is 300000
      - long: --max-nb-messages-to-generate
        arg: max-nb-messages-to-generate
        validate: integer
        required: false
        help: |-
          🔨 Max number of different messages to generate.

             - when protobuf is used, default is 50 as protobuf generation is really slow
             - when json or sql datagen format is used, default is 1000
             - when --record-size is set, default is 100
             --when nb-messages is set to -1, default is 1000
             - otherwise default is 100000
      - long: --sleep-time-between-batch
        arg: sleep-time-between-batch
        validate: integer
        required: false
        default: "0"
        help: |-
          💤 Sleep time in seconds between batches
             default is 0
      - long: --throughput
        arg: throughput
        validate: integer
        required: false
        default: "0"
        help: |-
          🐢 Maximum number of records per second (default is 0, no limit)

          Useful with --nb-messages -1 to get a steady flow of records, for example:

          playground topic produce -t a-topic --nb-messages -1 --throughput 10 --value '{"id": %g}'
      - long: --nb-partitions
        arg: nb-partitions
        validate: integer
        required: false
        default: "1"
        help: |-
          🔢 Number of partitions for the topic. (default is 1)
          
          ❌ Important: if the topic exists with another number of partitions, it is re-created when it
          is empty, and the command fails when it is not.
      - long: --compression-codec
        arg: compression-codec
        required: false
        allowed: 
          - gzip
          - snappy
          - lz4
          - zstd
        help: |-
          🤐 The compression codec: either 'gzip', 'snappy', 'lz4', or 'zstd'
          If not set, there is no compression

      - &compatibility
        long: --compatibility
        arg: compatibility
        allowed: 
          - BACKWARD
          - BACKWARD_TRANSITIVE
          - FORWARD
          - FORWARD_TRANSITIVE
          - FULL
          - FULL_TRANSITIVE
          - NONE
        help: |-
          Schema Registry compatibility rule

      - &key-subject-name-strategy
        long: --key-subject-name-strategy
        arg: key-subject-name-strategy
        allowed: 
          - TopicNameStrategy
          - RecordNameStrategy
          - TopicRecordNameStrategy
        help: |-
          Key Subject Name Strategy

      - &value-subject-name-strategy
        long: --value-subject-name-strategy
        arg: value-subject-name-strategy
        allowed: 
          - TopicNameStrategy
          - RecordNameStrategy
          - TopicRecordNameStrategy
        help: |-
          Value Subject Name Strategy

      - long: --headers
        arg: headers
        required: false
        help: |-
          🚏 Headers to use for all records. If not set, no header is used.

          Example: --headers "header1:value1,header2:value2"

          Header keys and values cannot contain "," or ":" (they are the separators).

          Note: CP 7.2+ is required.
      - long: --forced-key
        arg: forced-key
        required: false
        help: |-
          ☢️ Key to use for all records. 
          
          🎓 Tip: use --generate-only first with avro, json-schema or protobuf to get skeleton of messages and then use --forced-key to send the message you need. 
      - long: --forced-value
        arg: forced-value
        required: false
        help: |-
          ☢️ Value to use for all records. 
          
          🎓 Tip: use --generate-only first with avro, json-schema or protobuf to get skeleton of messages and then use --forced-value to send the message you need. 
      - long: --generate-only
        required: false
        help: |-
          🚪 Only generate messages without sending to kafka topic.

          Used with --forced-value, this is a powerful way to send specific messages.
      - long: --tombstone
        required: false
        help: |-
          ⚰️ Generate tombstone (record with null value). 
          
          Setting --key is recommended when this flag is used. 
          If not set, the key will also be null, hence generating a null record (both key and value being null)

          Note: CP 7.2+ is required.
      - long: --schema-id-in-header
        required: false
        help: |-
          🎯 Include schema ID in kafka header. 
          
          Uses HeaderSchemaIdSerializer for schema.id.seserializer

          Note: CP 8.1.1+ is required.
      - long: --validate
        required: false
        help: |-
          ☑️ Validate schema according to connect sink converter used

      - long: --derive-key-schema-as
        required: false
        arg: derive-key-schema-as
        help: |-
            🪄 Use playground schema derive-schema command to deduce schema from key payload

            Possible values:

            - AVRO
            - JSON (json schema)
            - PROTOBUF
        allowed: 
          - AVRO
          - JSON
          - PROTOBUF

      - long: --derive-value-schema-as
        required: false
        arg: derive-value-schema-as
        help: |-
            🪄 Use playground schema derive-schema command to deduce schema from value payload

            Possible values:

            - AVRO
            - JSON (json schema)
            - PROTOBUF
        allowed: 
          - AVRO
          - JSON
          - PROTOBUF

      - long: --no-null
        required: false
        help: |-
          🪹 Never generate null fields even for optional fields

          N.B: only work with avro and json-schema

      - long: --consume
        required: false
        help: |-
          📥 After producing, directly consume topic (until at least the number of records produced
          are consumed, or 60 seconds).

      - long: --delete-topic
        required: false
        help: |-
          ❌ Delete topic and associated schema/subject if applicable before producing data.

      - long: --reference
        arg: reference
        private: true
        help: |-
          🖇️ Schema reference
          
          See docs: https://docs.confluent.io/platform/7.6/schema-registry/fundamentals/serdes-develop/index.html#schema-references

          🎓 Tip: you can pass multiple references by specifying --reference multiple times

          🔥 You can either:
          
          * Set your own schema (avro, json-schema, protobuf) within single quotes (see examples) 
          
          * Use completion to select predefined schemas (or use your own schema file) 🎓 Tip: use <tab> completion to trigger fzf completion
        required: false
        repeatable: true
        completions:
          dynamic:
          - playground get-predefined-schemas "$completion_current"

      - long: --validate-config
        arg: validate-config
        help: |-
          🔩 Converter configuration parameters to use 
          
          See docs: https://docs.confluent.io/platform/current/schema-registry/connect.html#using-kconnect-long-with-sr

          🎓 Tip: you can pass multiple parameters by specifying --validate-config multiple times
        required: false
        repeatable: true
        allowed: 
          - scrub.invalid.names=true
          - enhanced.avro.schema.support=true
          - connect.meta.data=false
          - object.additional.properties=false
          - use.optional.for.nonrequired=true
          - ignore.default.for.nullables=true
          - generalized.sum.type.support=true
          - enhanced.protobuf.schema.support=true
          - generate.index.for.unions=false
          - int.for.enums=true
          - optional.for.nullables=true
          - generate.struct.for.nulls=true
          - wrapper.for.nullables=true
          - wrapper.for.raw.primitives=false

      - long: --producer-property
        arg: producer-property
        help: |-
          🔩 Producer configuration parameters to use 
          
          See docs: https://docs.confluent.io/platform/current/installation/configuration/producer-configs.html#cp-config-producer

          🎓 Tip: you can pass multiple parameters by specifying --producer-property multiple times

          Example: --producer-property "max.request.size=990485760" --producer-property "client.id=myid"
        required: false
        repeatable: true

      - long: --record-size
        arg: record-size
        validate: integer
        required: false
        default: "0"
        help: |-
          🏋️ Record size in bytes, eg. 1048576 for 1MB

          📢 If size is > 1Mb, --producer-property max.request.size and topic max.message.bytes will be automatically set to support the record size.

          Note that --no-null will be used when this option is set

      - long: --value-schema-id
        arg: value-schema-id
        private: true
        validate: integer
        required: false
        help: |-
          🔰 Do not auto register schema and specify schema id to use. 

          It sets --property value.schema.id=x --property auto.register=false --property use.latest.version=true

      - long: --transactional-id
        arg: transactional-id
        required: false
        help: |-
          💱 Produce the records in one transaction, with this transactional.id

          The records are produced as usual (keys, headers, schemas,
          partitioning) to a hidden staging topic with the same number of
          partitions, then copied byte for byte to the topic in one
          transaction, which is committed, aborted or left open
          (--transaction). With the default subject name strategy, the
          schemas are registered under the subjects of the topic.

          Useful to reproduce what read_committed consumers do: an open
          transaction holds the last stable offset of its partitions.

          Not available on Confluent Cloud, and not with --nb-messages -1.
      - long: --transaction
        arg: transaction
        required: false
        default: "commit"
        allowed:
        - commit
        - abort
        - open
        help: |-
          💱 How the transaction of --transactional-id ends: commit
          (default), abort, or open (left open, the coordinator aborts it
          after --transaction-timeout)
      - long: --transaction-timeout
        arg: ms
        validate: integer
        required: false
        default: "60000"
        help: |-
          ⏱️ transaction.timeout.ms of the transactional producer, in ms
          (default 60000): an open transaction is aborted by the coordinator
          after it. At most transaction.max.timeout.ms of the brokers (15
          minutes by default)
      - *cluster

      examples: |

        playground topic produce --tombstone --topic a-topic --key mykey

        playground topic produce -t payments --nb-messages 10 --value 'payment-%g' --transactional-id payments-txn --transaction open --transaction-timeout 900000

        playground topic produce -t topic-json --nb-messages 10 << 'EOF'
