                "type": "int"
              }
            }
          ],
          "name": "Customer",
          "namespace": "com.github.vdesabou",
          "type": "record"
        }
        EOF

        playground topic produce -t topic-json-schema --nb-messages 3 << 'EOF'
        {
          "\$schema": "http://json-schema.org/draft-07/schema#",
          "additionalProperties": false,
          "\$id": "http://lh.test/Customer.schema.json",
          "title": "Customer",
