name: playground
version: 1.0.0
dependencies:
  docker: visit https://docs.docker.com/get-docker to install
help: |-
  🧠 CLI for Kafka Docker Playground 🐳

  👉 Check documentation https://kafka-docker-playground.io/#/cli

  🎬 Bite size sessions (short videos): https://kafka-docker-playground.io/#/sessions
  🍪 Deep dives (one family of commands each): https://kafka-docker-playground.io/#/deep-dives
filters:
- docker_running
environment_variables:
- name: PG_VERBOSE_MODE
  private: true
  help: "Set by --vvv, propagated to the nested playground calls (internal)"
- name: PLAYGROUND_CLUSTER
  help: "🌍 Cluster used by the topic, consumer-group, connector, schema, broker and quota commands in an mdc-* environment (us or europe) when --cluster is not set"

# Use bash code here directly or a function name that references code elsewhere.
help_header_override: |
  echo
  echo $'██████  ██       █████  ██    ██  ██████  ██████   ██████  ██    ██ ███    ██ ██████  '
  echo $'██   ██ ██      ██   ██  ██  ██  ██       ██   ██ ██    ██ ██    ██ ████   ██ ██   ██ '
  echo $'██████  ██      ███████   ████   ██   ███ ██████  ██    ██ ██    ██ ██ ██  ██ ██   ██ '
  echo $'██      ██      ██   ██    ██    ██    ██ ██   ██ ██    ██ ██    ██ ██  ██ ██ ██   ██ '
  echo $'██      ███████ ██   ██    ██     ██████  ██   ██  ██████   ██████  ██   ████ ██████  '
  echo
  echo "👉 Documentation: https://kafka-docker-playground.io/#/cli"
  echo "🎬 Bite size sessions (short videos): https://kafka-docker-playground.io/#/sessions"
  echo "🍪 Deep dives (one family of commands each): https://kafka-docker-playground.io/#/deep-dives"
  echo
  
flags:
- long: --vvv
  short: -v
  help: |
    🐛 set verbose output (set -x)

    ❗ it can print sensitive information ❗

- long: --output-level
  short: -o
  arg: level
  allowed: [INFO, WARN, ERROR]
  required: false
  help: |-
    ❕Log level used by all commands

    Default is INFO (all INFO, WARN and ERROR will be printed in command output)

commands:

- name: help
  help: Show help about a command
  args:
  - name: command
    help: 🆘 Help command

- name: status
  help: |-
    🗺️ Show a status

    A single screen answering "what is running right now, and is it healthy":
    the example currently running and its documentation link, the state of
    every container (flagging the exited or restarting ones), the version of
    every connector, the status and configuration of each of them, the topics
    that exist, and whether an EC2 instance of yours is still up.

    Everything comes from the running containers and from playground.ini, so
    it is also the quickest way to get back your bearings after a break.
  examples:
  - playground status
  x_example_outputs:
  - command: playground status
    output: |-
      17:21:27 ℹ️ 🦭 Container engine: podman
      17:21:27 ℹ️ 🚀 Running example
      connect/connect-filestream-sink/filestream-sink.sh
      17:21:28 ℹ️ 🐳 Containers
      NAMES                STATUS          IMAGE
      controller           Up 53 minutes   confluentinc/cp-server:8.3.2
      broker               Up 53 minutes   confluentinc/cp-server:8.3.2
      schema-registry      Up 53 minutes   confluentinc/cp-schema-registry:8.3.2
      connect              Up 53 minutes   confluentinc/cp-server-connect:8.3.2
      17:21:28 ℹ️ 🎯 Version currently used for confluent platform
      8.3.2
      17:21:29 ℹ️ 🧩 Displaying status for 🌎onprem connector filestream-sink
      Name                           Status       Tasks                                                        Stack Trace
      -------------------------------------------------------------------------------------------------------------
      filestream-sink                ✅ RUNNING  0:🟢 RUNNING                 -
      -------------------------------------------------------------------------------------------------------------
      17:21:30 ℹ️ 🧰 Current config for 🌎onprem connector filestream-sink
      playground connector create-or-update --connector filestream-sink << EOF
      {
        "connector.class": "org.apache.kafka.connect.file.FileStreamSinkConnector",
        "file": "/tmp/output.json",
        "tasks.max": "1",
        "topics": "filestream"
      }
      EOF
      17:21:31 ℹ️ 🔘 List of topics (internal topics are excluded)
      filestream

- name: doctor
  help: |-
    🩺 Check that the container engine is ready for the playground

    Reports which engine the 'docker' CLI is really talking to — 🐳 Docker or
    🦭 Podman — and checks what has to be right before any example can start:
    the engine is reachable, compose v2 is there, there is enough memory, and,
    with podman, that short image names resolve, that privileged ports can be
    published and that bind mounts will be readable from the host.

    This is the one command that still runs when the engine is down, so it is
    what to run first when an example fails before a single container starts.

    Exits 1 if it found a blocking problem, 0 otherwise.

    👉 Check documentation https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%a6%ad-using-podman-instead-of-docker
  examples:
  - playground doctor
  x_example_outputs:
  - command: playground doctor
    output: |-
      17:23:04 ℹ️ 🩺 Checking the container engine
      17:23:04 ℹ️ ✅ 'docker' CLI found: Docker version 29.8.1, build 4a63305
      17:23:04 ℹ️ 🦭 engine detected: podman
      17:23:05 ℹ️ ✅ engine is reachable
      17:23:05 ℹ️ ✅ 'docker compose' is 5.5.1
      17:23:05 ℹ️ ✅ engine memory is 11GB
      17:23:05 ℹ️ ✅ podman 6.1.3
      17:23:06 ℹ️ ✅ podman is running rootful
      17:23:06 ℹ️ ✅ docker.io is in the podman search registries
      17:23:06 ℹ️ ✅ the podman machine shares ~

      17:23:06 ℹ️ 🩺 all good, the podman engine is ready for the playground

