- name: history
  group: Run
  help: |-
    🏰 Get an history of the examples which were run with run command and run it again

    Opens a picker over every 'playground run' command you have executed,
    most recent first and de-duplicated. The command you select is shown for
    editing before it runs, so you can change a --tag or add a flag on the way.
  dependencies:
    fzf: visit https://github.com/junegunn/fzf#installation to install

- name: find-example
  group: Run
  help: |-
    🔎 Find examples matching a free-text query, without the interactive picker

    Searches every runnable example script (connect/, ccloud/, ksqldb/,
    flink/, reproduction-models/, ...) by path, connector class, README title
    and script body. Every word of the query must match somewhere; matches in
    the path and connector class rank higher than matches in the body.

    Prints the ready-to-paste 'playground run -f' command for each hit, best
    first. Use 'playground run' instead to browse examples interactively.
  args:
  - name: query
    required: true
    help: |-
      🔤 Free-text query, e.g. "oracle cdc ssl", "fully managed s3 sink" or "jdbc source proxy"
  catch_all:
    label: more query words
    help: extra words are appended to the query, so quoting it is optional
  flags:
  - long: --category
    arg: category
    required: false
    allowed:
    - connect
    - ccloud
    - ksqldb
    - flink
    - schema-registry
    - rest-proxy
    - multi-data-center
    - other
    - operator
    - academy
    - environment
    - reproduction-models
    help: |-
      📂 Restrict the search to one top-level folder
  - long: --limit
    arg: limit
    required: false
    validate: integer
    default: "10"
    help: |-
      🔢 Maximum number of hits (default 10)
  - long: --json
    required: false
    help: |-
      📗 Print the hits as a JSON array, best first, and nothing else

      Each hit has script (absolute path), path (relative to the repository),
      title (README), connector_classes, environment, score and run_command.
      No hit prints [] and exits with code 1.

      🎓 Tip: use it in scripts and from AI agents, for example with
      jq -r '.[0].script'
  examples:
  - playground find-example "s3 sink proxy"
  - playground find-example debezium postgres fully managed
  - playground find-example "oracle cdc ssl" --category connect --limit 3
  - playground find-example "http sink oauth" --json --limit 3 | jq -r '.[].script'
  x_example_outputs:
  - command: 'playground find-example "oracle cdc ssl" --limit 2'
    output: |-
      17:22:22 ℹ️ 🔎 examples matching "oracle cdc ssl", best first
      playground run -f ~/kafka-docker-playground/connect/connect-cdc-xstream-oracle19-source/cdc-xstream-oracle19-ssl.sh
          Oracle XStream CDC Source (Oracle 19c) Source connector · io.confluent.connect.oracle.xstream.cdc.OracleXStreamSourceConnector · plaintext
      playground run -f ~/kafka-docker-playground/connect/connect-cdc-oracle19-source/cdc-oracle19-cdb-table-ssl.sh
          Oracle CDC Source (Oracle 19c) Source connector · io.confluent.connect.oracle.cdc.OracleCdcSourceConnector · plaintext
  - command: 'playground find-example "s3 sink" --limit 1 --json'
    output: |-
      [
        {
          "script": "~/kafka-docker-playground/connect/connect-aws-s3-sink/s3-sink.sh",
          "path": "connect/connect-aws-s3-sink/s3-sink.sh",
          "title": "S3 Sink connector",
          "connector_classes": [
            "io.confluent.connect.s3.S3SinkConnector"
          ],
          "environment": "plaintext",
          "score": 41.8,
          "run_command": "playground run -f ~/kafka-docker-playground/connect/connect-aws-s3-sink/s3-sink.sh"
        }
      ]
  footer: |-
    Example output:
      $ playground find-example "oracle cdc ssl" --limit 2
      17:22:22 ℹ️ 🔎 examples matching "oracle cdc ssl", best first
      playground run -f ~/kafka-docker-playground/connect/connect-cdc-xstream-oracle19-source/cdc-xstream-oracle19-ssl.sh
          Oracle XStream CDC Source (Oracle 19c) Source connector · io.confluent.connect.oracle.xstream.cdc.OracleXStreamSourceConnector · plaintext
      playground run -f ~/kafka-docker-playground/connect/connect-cdc-oracle19-source/cdc-oracle19-cdb-table-ssl.sh
          Oracle CDC Source (Oracle 19c) Source connector · io.confluent.connect.oracle.cdc.OracleCdcSourceConnector · plaintext

- name: start-environment
  private: true
  group: Run
  help: |-
    🔐 Simply start an environment listed in http://tinyurl.com/y4ybbw32:

    - ccloud
    - 2way-ssl
    - cfk
    - cfk-rbac
    - kerberos
    - ldap-authorizer-sasl-plain
    - ldap-sasl-plain
    - mdc-kerberos
    - mdc-plaintext
    - mdc-sasl-plain
    - plaintext
    - rbac-sasl-plain
    - sasl-plain
    - sasl-scram
    - sasl-ssl
    - ssl_kerberos

    Note: when running an example with <playground run>, it is already automatically done

    The environment brings up the Kafka cluster and its companions with the
    right security configuration; the example then layers its own containers
    on top with --docker-compose-override-file. Optional components
    (control-center, ksqldb, flink, rest-proxy, grafana, kcat, conduktor) are
    enabled with the --enable-* flags of 'playground run'.

    Any running environment is stopped first, and the full docker compose
    command is saved in playground.ini so that 'playground stop',
    'playground container recreate' and 'playground re-run' can replay it.
  flags:
    - &environment
      long: --environment
      required: false
      default: "plaintext"
      arg: environment
      allowed: [ccloud, 2way-ssl, cfk, cfk-rbac, kerberos, ldap-authorizer-sasl-plain, ldap-sasl-plain, mdc-kerberos, mdc-plaintext, mdc-sasl-plain, plaintext, rbac-sasl-plain, sasl-plain, sasl-scram, sasl-ssl, ssl_kerberos]
      help: |-
        🔐 The environment to start . 
        
        - ccloud
        - 2way-ssl
        - cfk
        - cfk-rbac
        - kerberos
        - ldap-authorizer-sasl-plain
        - ldap-sasl-plain
        - mdc-kerberos
        - mdc-plaintext
        - mdc-sasl-plain
        - plaintext
        - rbac-sasl-plain
        - sasl-plain
        - sasl-scram
        - sasl-ssl
        - ssl_kerberos

        Default is plaintext
    - long: --wait-for-control-center
      help: |- 
        😴 Wait for control-center instead of connect
    - long: --service
      arg: service
      private: true
      help: |-
        service to start

        Example: --service "oracle" --service "connect"
      required: false
      repeatable: true
    - long: --no-stop
      private: true
      help: |- 
        Do not stop the environment before starting it
    - long: --docker-compose-override-file
      short: -f
      validate: file_exists
      arg: docker-compose-override-file
      help: |-
        🔖 docker-compose override file

        ❕ It must be absolute full path
    - long: --rbac-role-bindings-file
      validate: file_exists
      arg: rbac-role-bindings-file
      help: |-
        🔐 rbac-sasl-plain only: bash file sourced right after the default role bindings are created, before connect, schema-registry, ksqldb and control-center start.

        Use it for role bindings or ACLs a component needs at startup, with 'playground rbac' commands, for example:

        playground rbac role-binding create --principal User:schemaregistryUser --role ResourceOwner --resource Topic:_schemas_acl

        🎓 Tip: anything not needed at startup can simply be run after 'playground start-environment'.

        ❕ It must be absolute full path (also settable with RBAC_ROLE_BINDINGS_FILE environment variable)
  examples:
  - playground start-environment
  - playground start-environment --environment rbac-sasl-plain
  - playground start-environment --environment rbac-sasl-plain --rbac-role-bindings-file "\$PWD/role-bindings.sh"

- name: switch-ccloud
  group: Run
  dependencies:
    confluent: visit https://docs.confluent.io/confluent-cli/current/overview.html to install
  help: |-
    🌩️  Switch to ccloud environment.

    It will bootstrap ccloud environment based on your previously ran ccloud example.

    Points the CLI at the Confluent Cloud cluster of your last ccloud run, so
    that 'playground topic', 'playground connector' and 'playground schema'
    talk to Confluent Cloud instead of the local containers. Nothing is
    created or destroyed, and no container is started or stopped.

    ❕ Requires that you ran a ccloud example at least once, so that the
       environment, cluster and credentials are cached in playground.ini.
       The environment you were on is remembered for 'playground switch-back'.

- name: switch-back
  group: Run
  help: |-
    💺  Switch back from previous environment before switch-ccloud was called.

    Restores the environment and connector type that were active before
    'playground switch-ccloud', so the CLI talks to your local containers
    again.

- name: switch-podman
  group: Run
  help: |-
    🦭 Switch the container engine to Podman

    Points the 'docker' CLI, 'docker compose' and the playground at the rootful
    Podman socket, through a 'podman' docker context: the switch applies to your
    current shell and to new ones, with nothing to export. On macOS the podman
    machine is started if needed. Ends with 'playground doctor'.

    Containers are not moved between engines: stop the running example first.

    ❕ Podman must be set up once, see
       https://kafka-docker-playground.io/#/how-to-use?id=🦭-using-podman-instead-of-docker
       The docker context you were on is remembered for 'playground switch-docker'.
  examples:
  - playground switch-podman

- name: switch-docker
  group: Run
  help: |-
    🐳 Switch the container engine back to Docker

    Restores the docker context that was active before 'playground switch-podman'
    (Docker Desktop's 'desktop-linux', or 'default', if none was remembered).
    Ends with 'playground doctor'.

    Containers are not moved between engines: stop the running example first.
  examples:
  - playground switch-docker

- name: update-version
  group: Run
  help: |-
    ✨ Update current confluent platform components (all with --tag or only connect with --connect-tag) or connector(s) with new version(s)

    Re-runs the example you are currently on with different versions, which is
    the fastest way to answer "does it still happen on 8.x?" or "is it fixed in
    connector 10.6.0?".

      --tag            🔢 every Confluent Platform component
      --connect-tag    🔗 only the connect container, other components untouched
      --connector-tag  🧩 the connector, from Confluent Hub
      --connector-zip  📦 the connector, from a local zip or a URL
      --connector-jar  ☕ a single jar, dropped into the existing plugin

    With no flag, you are prompted with the versions available. The versions
    currently running are read from the broker and connect containers, so the
    example must be up.

    🎓 Tip: this is a version bisect tool. Keep the example running and call it
    repeatedly until you find the version where the behaviour changes.
  flags:
  - *tag
  - *connect-tag
  - *connector-tag
  - *connector-zip
  - *connector-jar
  examples:
  - playground update-version (interactive mode)
  - playground update-version --tag 6.2.0 --connector-tag=2.5.12,10.5.7
  - playground update-version --connect-tag 6.2.0 --connector-tag=2.5.12,10.5.7

- name: open
  group: Run
  dependencies:
    fzf: visit https://github.com/junegunn/fzf#installation to install
  help: |-
    👐 When --file is not provided, simply open last example you ran with <playground run>

    Otherwise, open any file from the playground using --file.

    Opens in the editor of your choice: 'playground config editor code'
    (or vi, nano, sublime, etc). Add --open-docker-compose to also open the
    docker-compose override file the example uses, which is where the
    containers around Kafka are defined.
  flags:
  - long: --file
    short: -f
    required: false
    validate: file_exists_with_trick
    arg: file
    completions:
      dynamic:
      - playground get-any-file-with-fzf "$completion_current"
    help: |-
      🔎 Search any file and open it.
      
      ❕ It must be absolute full path

      🎓 Tip: use <tab> completion to trigger fzf completion
              use <option+enter> to use the value you typed manually

  - long: --open-docker-compose
    required: false
    help: |-
      🐳 Also open associated docker-compose file for the current example
  - long: --wait
    private: true
    help: |- 
      😴 Wait

- name: stop
  group: Run
  help: |-
    🛑 Stop currently running example

    Tears down every container of the environment and of the example, and
    removes their volumes, by replaying the docker compose command stored in
    playground.ini. Nothing is left behind, so the next example starts clean.

    ❕ Data is not kept: topics, connectors and the content of the databases
       started by the example are gone.

    For a Confluent Cloud example, the connectors and topics it created are
    listed and deleted too, after asking for confirmation. Change this with
    'playground config cleanup-ccloud-resources-after-run ask|true|false'.

  environment_variables:
  - name: PG_SKIP_CCLOUD_RUN_CLEANUP
    private: true
    help: "Set by playground run, skips the cleanup of the ccloud run resources (internal)"

- name: remove-all-docker-images
  group: Run
  help: |-
    🧨 Remove all docker images (including docker volumes)

    Reclaims disk space by wiping your whole local Docker state, not just the
    playground one. Everything has to be pulled again afterwards, so the next
    run is slow.

    🎓 Tip: prefer 'playground remove-cp-docker-images' to drop only the
    Confluent Platform versions you no longer test.

- name: remove-cp-docker-images
  group: Run
  help: |-
    🧹 Remove all Confluent Platform docker images related to a version installed locally (a confirmation will be required for every version present)

    Each Confluent Platform version you have ever run keeps a dozen images on
    disk, so this is usually where the space went. You are asked before every
    version, unless you name one with --version.

    The default version used by the playground is never proposed for removal.
  flags:
    - long: --version
      required: false
      arg: version
      completions:
        dynamic:
        - docker image ls | grep confluentinc | grep -v "<none>" | awk '{print $2}' | sort | uniq
      help: |-
        🔢 Specific version to remove

- name: refresh-cp-docker-images
  group: Run
  help: |-
    🔄 Refresh (pull from Docker) all Confluent Platform docker images related to a version installed locally

        It also refreshes images for aws, gcp and azure cli

    Useful when a version tag has been re-published, or when the cloud CLI
    images have drifted behind the API they talk to.
  flags:
    - long: --version
      required: true
      arg: version
      completions:
        dynamic:
        - docker image ls | grep confluentinc | grep -v "<none>" | awk '{print $2}' | sort | uniq
      help: |-
        🔢 Specific version to pull 

- name: cleanup-cloud-details
  group: Run
  help: |-
    🧼 playground is actively caching ccloud details (https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%8c%a4%ef%b8%8f-confluent-cloud-examples)
       use this command if you notice that the playground is using unexpected ccloud details

    Drops the cached environment, cluster, endpoints and API keys, so the next
    ccloud example re-discovers them from scratch. Typically needed after you
    changed of Confluent Cloud organisation, or deleted the cluster from the UI
    behind the playground's back.

    ❕ Nothing is deleted in Confluent Cloud, only the local cache. To delete
       the cloud resources themselves, see 'playground cleanup-cloud-resources'.


- name: open-docs
  group: Run
  help: |-
    🧑‍🎓 Open Confluent documentation of currently running example

    Jumps straight to the official Confluent page for the connector or feature
    the running example demonstrates, so you do not have to search for it.
  flags:
  - long: --only-show-url
    help: |-
      🌐 Only show url

- name: open-changelog
  group: Run
  help: |-
    📜 Open playground changelog (https://kafka-docker-playground.io/#/changelog)
  flags:
  - long: --only-show-url
    help: |-
      🌐 Only show url

- name: cleanup-cloud-resources
  group: Run
  dependencies:
    confluent: visit https://docs.confluent.io/confluent-cli/current/overview.html to install
  environment_variables:
  - name: AZ_USER 
    help: Azure user
  - name: GCP_PROJECT 
    help: GCP project
  - name: AWS_ACCESS_KEY_ID 
    help: AWS access key id
  - name: AWS_SECRET_ACCESS_KEY 
    help: AWS secret access key
  - name: GCP_KEYFILE_CONTENT 
    help: GCP keyfile (generated with "cat keyfile.json | jq -aRs .")
  help: |-
    🧹 Cleanup cloud resources that were created by running examples from the playground

    ❗it will remove all resources created by the playground, including topics, connectors, clusters, buckets, redshift cluster, etc...

    Examples that talk to a real cloud create real, billable resources, and an
    interrupted run leaves them behind. This sweeps them, scoped to the ones
    whose name contains your username, across AWS, GCP, Azure, Confluent Cloud
    and Salesforce. Restrict the scope with --resource, and run it regularly.

    Confluent Cloud: connectors whose name contains your username are deleted,
    with their dlq, success and error topics. All topics of the cluster are
    deleted only when the cluster was created by the playground for you
    (pg-<user>-*). On a cluster you provided with CLUSTER_NAME, which may be
    shared with your team, only the topics recorded as created by your own
    runs are deleted (local file playground-ccloud-created-topics): topics
    created with playground topic create / produce, and topics your fully
    managed source connectors write to, as set in their config (kafka.topic,
    api1.topics, topic.prefix...).

    You are asked to confirm every deletion, unless --force is given.

    ☢️ Deletions are permanent. Use a dedicated cloud account for the
       playground rather than one that also hosts resources you care about.
  flags:
  - long: --force
    help: |-
      ☢️ do not ask for confirmation

      ❗use with caution
  - long: --user
    private: true
    arg: user
    help: |-
      ☢️ force user
  - long: --resource
    arg: resource
    help: |-
      🛁 resource to cleanup

      If not provided, all of them are cleaned up

      🎓 Tip: you can pass multiple resources by specifying --resource multiple times
    required: false
    repeatable: true
    unique: true
    default:
      - aws
      - gcp
      - azure
      - ccloud
      - salesforce
    allowed: 
      - aws
      - gcp
      - azure
      - ccloud
      - salesforce

- name: repro
  expose: always
  group: Repro
  help: |-
    👷‍♂️ Reproduction model commands

    A reproduction model is an example written to demonstrate one specific
    problem, so that anyone can reproduce it with a single command.

      bootstrap   scaffold one from an existing example, then edit it
      export      package one or more models as a self-contained tgz bundle
      import      unpack a bundle someone sent you, and run it
      check       scan models for secrets and customer data before committing them

    👉 Always scaffold with bootstrap rather than copying a script by hand: it
    creates the header, the docker compose override, the CLI cheat sheet and
    registers the model, which a hand-written file would be missing.

    Keep a model minimal and about one issue, state expected versus actual
    behaviour in its comments header, and never put customer data in it.
  environment_variables:
  - name: OUTPUT_FOLDER
    help: 📁 Output folder where to generate bootstrapped files
    default: reproduction-models
  dependencies:
    fzf: visit https://github.com/junegunn/fzf#installation to install
  commands:

  - name: export
    help: |-
      📤 Export reproduction models as a self-contained tgz bundle

      Produces a single tgz that a colleague can feed to
      'playground repro import' to run your scenario as is.

      The bundle holds what the model needs, committed or not: the script,
      the files of its folder it mentions (docker compose override, producer,
      SQL files…) and the support files linked by bootstrap (README.md,
      stop.sh, benchmark-load.bash, config-*). Symlinks are stored as their
      content, so the bundle does not depend on the version of the base
      example. Git-ignored files, build output (target/), dumps, flight
      recordings, logs and credential files (keyfile.json, *.pem, *.key) are
      left out.

      A repro-manifest.json describes the bundle: the last 'playground run'
      line of each model (from playground-run-history), its case number,
      author, base example, the playground commit, the names (never the
      values) of the credentials it needs, and the sha256 of every file.

      Before anything is written, the bundle is scanned. The export stops
      (unless --force) when a file contains the value of a credential known
      to this machine ('playground secrets' store, exported credential
      variables, CLUSTER_CREDS / SCHEMA_REGISTRY_CREDS of playground.ini,
      ~/.aws/credentials) or a well-known token format (AWS access key id,
      private key, GitHub / Slack token, Google API key, JWT, Azure storage
      account key). Email addresses, public IP addresses and hard-coded
      passwords that do not come from the base example are reported as
      possible customer data. Values are never printed.

      Files outside the repository that a model needs (--connector-zip /
      --connector-jar of its run line, files whose absolute path appears in
      the script or its compose files, like ~/Downloads/config.json) are
      only listed, unless --include-artifacts packs them under
      <model folder>/artifacts/. Import then points the run line, the script
      and the compose files to the imported copies. Import also rewrites the
      paths of the exporter's checkout (like the jar path written by
      'repro bootstrap --custom-smt') to the local ones.

      --cluster-creds / --cluster-schema-registry-creds are removed from the
      run line: whoever imports runs with their own cluster.

      Without --file, the current reproduction model is exported.

      📋 On macOS, the bundle is copied to the clipboard as a file: paste it
      (Cmd+V) in a Slack conversation to attach it (--no-clipboard to skip).

      🎓 Tip: start with --dry-run to see what would be packed, and what the scan finds.
      The same scan runs on commits with 'playground repro check'.
    dependencies:
      git: visit https://git-scm.com/downloads to install
    flags:
      - long: --file
        short: -f
        arg: file
        required: false
        repeatable: true
        conflicts: [--all-uncommitted, --all]
        validate: file_exists_with_trick
        completions:
          dynamic:
          - playground get-examples-list-with-fzf --repro-only "$completion_current"
        help: |-
          🔖 Reproduction model script to export (default: current one)

          Can be repeated to put several models in one bundle.
      - long: --all-uncommitted
        required: false
        conflicts: [--file]
        help: |-
          📦 Export every reproduction model with uncommitted changes (new or modified)
      - long: --all
        required: false
        private: true
        conflicts: [--file]
        help: |-
          📦 Former name of --all-uncommitted
      - long: --output
        short: -o
        arg: output
        required: false
        help: |-
          📁 Folder where to write the bundle (default: current folder, or the repository root when run from reproduction-models)
      - long: --dry-run
        required: false
        help: |-
          🔍 Only list the models and files that would be packed, and run the scan
      - long: --force
        required: false
        help: |-
          🔓 Export even if the scan finds secrets (when they are not real ones)
      - long: --include-artifacts
        required: false
        help: |-
          📎 Also pack the files outside the repository the models need (connector zip / jar, files referenced by absolute path)
      - long: --no-clipboard
        required: false
        help: |-
          📋 Do not copy the bundle to the clipboard (macOS)
      - long: --clipboard
        required: false
        private: true
        help: |-
          📋 Former flag: the bundle is now copied to the clipboard by default
    examples:
    - playground repro export
    - playground repro export -f ~/kafka-docker-playground/reproduction-models/connect-connect-http-sink/http-repro-123456-dlq.sh --dry-run
    - playground repro export --all-uncommitted --output ~/Desktop
    - playground repro export --include-artifacts

  - name: check
    help: |-
      🕵️ Scan reproduction models for secrets and customer data before they are committed

      Runs the scan of 'playground repro export' on the files of the
      reproduction models, without packing anything. It stops (exit code 1)
      when a file contains the value of a credential known to this machine
      ('playground secrets' store, exported credential variables,
      CLUSTER_CREDS / SCHEMA_REGISTRY_CREDS of playground.ini,
      ~/.aws/credentials) or a well-known token format (AWS access key id,
      private key, GitHub / Slack token, Google API key, JWT, Azure storage
      account key), and when a credential file (keyfile.json, *.pem, *.key,
      *.p12, *.jks, secrets.properties, playground.ini) is about to be
      committed. Email addresses, public IP addresses, hard-coded passwords
      that do not come from the base example, and dumps, logs or archives
      are reported as possible customer data, without failing. Values are
      never printed.

      Without flag, the new and modified files of reproduction-models are
      checked. Symlinks to the public examples are not.

      🪝 'playground repro bootstrap' and 'playground repro import' set up a
      pre-commit hook in reproduction-models (git config core.hooksPath
      <playground>/scripts/repro-git-hooks) that runs
      'playground repro check --staged --skip-secrets-store' on every commit.
      An existing pre-commit hook or core.hooksPath is never replaced. To skip
      the scan of one commit: git commit --no-verify, or
      PLAYGROUND_REPRO_SCAN=skip git commit. PLAYGROUND_REPRO_SCAN=full also
      reads the 'playground secrets' store.
    dependencies:
      git: visit https://git-scm.com/downloads to install
    flags:
      - long: --file
        short: -f
        arg: file
        required: false
        repeatable: true
        conflicts: [--staged, --all]
        validate: file_exists_with_trick
        completions:
          dynamic:
          - playground get-examples-list-with-fzf --repro-only "$completion_current"
        help: |-
          🔖 Reproduction model script to check (the files export would pack), can be repeated
      - long: --staged
        required: false
        conflicts: [--file, --all]
        help: |-
          🪝 Check the staged content of the files about to be committed (what the pre-commit hook uses)
      - long: --all
        required: false
        conflicts: [--file, --staged]
        help: |-
          📚 Check every file of reproduction-models, committed or not (one-time audit)
      - long: --skip-secrets-store
        required: false
        help: |-
          ⚡ Do not read the 'playground secrets' store, which can prompt (1Password): only the exported variables, playground.ini and ~/.aws/credentials values, and the token formats
      - long: --json
        required: false
        help: |-
          🤖 Print the findings as JSON (exit code 1 still means a secret was found)
    examples:
    - playground repro check
    - playground repro check --staged
    - playground repro check -f ~/kafka-docker-playground/reproduction-models/connect-connect-http-sink/http-repro-123456-dlq.sh
    - playground repro check --all --json

  - name: import
    help: |-
      📥 Import a tgz bundle created by 'playground repro export'

      The bundle is extracted to a temporary folder first and checked: no
      absolute paths, no '..', no special files, and the sha256 of every file
      must match its manifest. Bundles from older versions, without manifest,
      are still accepted.

      Files identical to yours are skipped. When a file differs, the import
      stops unless --on-conflict says what to do. Files that were symlinks to
      a public example are restored as symlinks when the public file is
      identical, otherwise their content is kept.

      Then the model becomes the current one, and the command prints the
      'playground run' line to use and the credentials missing from your
      'playground secrets' profile.
    flags:
    - long: --file
      short: -f
      arg: file
      required: true
      validate: file_exists_with_trick
      completions:
        dynamic:
        - playground get-playground-repro-export-with-fzf "$completion_current"
      help: |-
        🤐 Bundle file (playground_repro_*.tgz, any name is accepted)

        🎓 Tip: use <tab> completion to trigger fzf completion
                use playground config folder_zip_or_jar <folder1> <folder2>... (default is home folder and current folder is always included) to configure where to search the files
    - long: --on-conflict
      arg: on-conflict
      required: false
      allowed: [abort, rename, overwrite]
      default: abort
      help: |-
        ⚔️ What to do when a file of the bundle differs from your copy

        abort: import nothing and list the differences
        rename: import the differing files with an -imported-<date> suffix (references in the imported scripts are updated)
        overwrite: replace your copy
    - long: --dry-run
      required: false
      help: |-
        🔍 Only show the manifest, the files and the conflicts
    examples:
    - playground repro import -f ~/Downloads/playground_repro_http-repro-123456-dlq_2026-10-21.tgz
    - playground repro import -f ~/Downloads/playground_repro_http-repro-123456-dlq_2026-10-21.tgz --on-conflict rename

  - name: bootstrap
    help: |-
      🛠  Bootstrap reproduction model, just run <playground repro bootstrap> !

      🔥 HIGHLY RECOMMENDED: start in interactive mode by simple running <playground repro bootstrap> !
      
      👉 Check documentation https://kafka-docker-playground.io/#/reusables?id=%f0%9f%9b%a0-bootstrap-reproduction-model
    flags:
    - long: --file
      short: -f
      required: false
      validate: file_exists_with_trick
      arg: file
      completions:
        dynamic:
        - playground get-examples-list-with-fzf --without-repro "$completion_current"
      help: |-
        🔖 Example file to use as basis, if not set, currently running example is used
        
        ❕ It must be absolute full path

        🎓 Tip: use <tab> completion to trigger fzf completion

    - long: --description
      short: -d
      required: false
      validate: not_empty
      arg: description
      help: |-
        💭 Description for the reproduction model

    - long: --producer
      private: true
      short: -p
      arg: producer-type
      conflicts: [--pipeline]
      default: "none"
      allowed: 
        - none
        - avro
        - avro-with-key
        - protobuf
        - protobuf-with-key
        - json-schema
        - json-schema-with-key
      help: |-
        🤎 Java producer type to use
        
        One of avro, avro-with-key, protobuf, protobuf-with-key, json-schema, json-schema-with-key

        🎓 Tip: Most of times, it's much simpler to use 'playground topic produce'. Use java producer only if you have very specific requirements such as specifying record timestamp or to do perf testing (even though CLI is also good for that)

        🎓 Tip: 'with-key' will also produce key with selected converter, otherwise LongConverter is used

    - long: --nb-producers
      private: true
      short: -n
      arg: nb-producers
      required: false
      help: |-
        2️⃣ Number of java producers to generate

    - long: --producer-schema-key
      private: true
      required: false
      help: |-
        🔰 Schema to use for the key

        ✨ Copy and paste the schema you want to use for the key, save and close the file to continue

    - long: --producer-schema-value
      private: true
      required: false
      help: |-
        🔰 Schema to use for the value

        ✨ Copy and paste the schema you want to use for the key, save and close the file to continue

    - long: --custom-smt
      help: |-
        🔧 Add a custom SMT (which is a no-op)

    - long: --connector-plugin
      required: false
      repeatable: true
      arg: connector-plugin
      completions:
        dynamic:
        - playground get-connector-plugin "$completion_current" "onprem"
      help: |-
        🔌 Add Connector plugin to CONNECT_PLUGIN_PATH

        🎓 Tip: use <tab> completion to trigger fzf completion

    - long: --pipeline
      required: false
      validate: file_exists_with_trick
      arg: sink_file
      conflicts: [--producer]
      repeatable: true
      completions:
        dynamic:
        - playground get-examples-list-with-fzf --without-repro --sink-only "$completion_current"
      help: |-
        🔖 Sink example file to use for creating a pipeline. multiple --pipeline flags can be used to create a pipeline with multiple sinks.
        
        ❕ It must be absolute full path.

        🎓 Tip: use <tab> completion to trigger fzf completion

    - long: --no-run
      required: false
      help: |-
        🛑 Only generate the reproduction model files, then exit

        Skips opening the generated file in the editor and running it, so
        the running environment is left untouched.

        🎓 Tip: use it in scripts and from AI agents, together with --file and --description

    examples:
    - playground repro bootstrap (interactive mode)
    - playground repro bootstrap -f "\$PWD/connect/connect-http-sink/http_no_auth.sh" -d "123456 dlq not working" --no-run

- name: get-docker-compose
  group: Kafka
  help: |-
    🐋 Get docker-compose

    Prints the fully resolved docker compose configuration of the running
    example: every file merged, every profile applied and every variable
    substituted. This is what Docker actually received, which is the thing to
    look at when a container did not get the image, port or setting you
    expected.

- name: schema
  expose: always
  group: Schema
  help: |-
     🔰 Schema commands

     Talk to the Schema Registry of the running environment, whether it is the
     local container or the one in Confluent Cloud, without building the urls
     and the credentials yourself.

     🔍 Read
       get                  every version of a subject, or of all subjects
       get-compatibility    the compatibility rule in force
       get-mode / get-alias

     ✍️ Write
       register             add a new version to a subject
       delete               a version, or the whole subject
       set-compatibility    relax or tighten the evolution rule
       set-mode             READWRITE, READONLY or IMPORT
       set-normalize, validate-new-schemas   registry-wide behaviour
       set-alias            point one subject name at another

     🪄 derive-schema turns a sample payload into an avro, json schema or
     protobuf schema, which saves writing one by hand.

     A subject is normally named after the topic: <topic>-key and
     <topic>-value. 'playground topic delete' removes both along with the
     topic.
  commands:

  - name: get
    group: Schema
    filters:
    - not_mdc_environment
    - schema_registry_running
    help: |-
      🔰 Get all schemas versions for specified subject (if --subject is not specified, all subjects will be used)
    flags:
      - &subject
        long: --subject
        required: false
        arg: subject
        conflicts:
          - "id"
        completions:
          dynamic:
          - playground get-subject-list
        help: |-
          📛 Subject name

      - long: --id
        required: false
        validate: integer
        arg: id
        conflicts:
          - "subject"
          - "deleted"
        help: |-
           💯 Schema id

      - &verbose
        long: --verbose
        short: -v
        help: 🐞 Show command being ran.

      - long: --deleted
        required: false
        conflicts:
          - "id"
        help: |-
          🧟 Include soft deleted subjects

      - long: --store-in-tmp
        help: store in /tmp folder
        arg: folder
        private: true
    examples:
    - playground schema get
    - playground schema get --subject <SUBJECT>
    - playground schema get --deleted

  - name: register
    group: Schema
    filters:
    - not_mdc_environment
    - schema_registry_running
    help: |-
      ⏺️ Register a schema in specified subject

      Pushes a schema into the registry without producing any data, which is
      how you set up a subject before a connector starts, or add a new version
      to check whether it passes the compatibility rules.

      The format is detected from what you give it, avro, json schema or
      protobuf all work. Pass it on stdin with a quoted heredoc, or pick one of
      the bundled schemas with tab completion on --schema.

      Remember the naming convention: a topic's schemas live under the subjects
      <topic>-key and <topic>-value, not under the topic name.

      ☢️ --id forces a specific schema id and overwrites whatever is already
      registered at that id. It exists to reproduce id collisions, it is not
      something to use casually.
    flags:
      - &subject_required
        long: --subject
        required: true
        arg: subject
        completions:
          dynamic:
          - playground get-subject-list
        help: |-
          📛 Subject name
      - *verbose
      - long: --schema
        arg: schema
        completions:
          dynamic:
          - playground get-predefined-schemas "$completion_current"
        default: "-"
        required: false
        help: |- 
          🔥 You can either:
          
          * Set your own schema (avro, json-schema, protobuf) with stdin (see example section). 

          * Use completion to select predefined schemas (or use your own schema file) 🎓 Tip: use <tab> completion to trigger fzf completion
      - long: --id
        required: false
        validate: integer
        arg: id
        help: |-
          ☢️ Force schema id

          ❗it will replace any schema which already exists at given id

      - long: --metadata-property
        arg: metadata-property
        help: |-
          🟡 Add metadata properties to schema contract
          
          See docs: https://docs.confluent.io/platform/current/schema-registry/fundamentals/data-contracts.html#metadata-properties

          🎓 Tip: you can pass multiple properties by specifying --metadata-property multiple times

          Example: --metadata-property "metadata1=value" --metadata-property "metadata2=value"
        required: false
        repeatable: true
      - long: --normalize
        help: |-
          🫧 Add ?normalize=true at the end of the request to normalize the schema. The default is false.

    examples: |
      playground schema register --subject test-protobuf << 'EOF'
      syntax = "proto3";
      
      package com.github.vdesabou;
      
      message Customer {
          int64 count = 1;
          string first_name = 2;
          string last_name = 3;
          string address = 4;
      }
      EOF

      playground schema register --subject test-avro --metadata-property test=test --metadata-property test2=test << 'EOF'
      {
          "type": "record",
          "namespace": "com.github.vdesabou",
          "name": "Customer",
          "fields": [
              {
                  "name": "count",
                  "type": "long",
                  "doc": "count"
              },
              {
                  "name": "first_name",
                  "type": "string",
                  "doc": "First Name of Customer"
              },
              {
                  "name": "last_name",
                  "type": "string",
                  "doc": "Last Name of Customer"
              },
              {
                  "name": "address",
                  "type": "string",
                  "doc": "Address of Customer"
              }
          ]
      }
      EOF

  - name: get-compatibility
    filters:
    - not_mdc_environment
    - schema_registry_running
    group: Schema
    help: |-
      🛡️ Get subject-level compatibility

      The rule that decides whether a new schema version is accepted. When a
      producer fails with "Schema being registered is incompatible with an
      earlier schema", this is what rejected it.
    flags:
    - *subject_required
    - *verbose

  - name: set-compatibility
    filters:
    - not_mdc_environment
    - schema_registry_running
    group: Schema
    help: |-
      🛡️ Set subject-level compatibility

      Overrides the rule for one subject:

        BACKWARD     new schema can read data written with the previous one
        FORWARD      previous schema can read data written with the new one
        FULL         both
        NONE         anything is accepted
        *_TRANSITIVE checked against all past versions, not just the last

      Set it to NONE when you deliberately want to register an incompatible
      schema, typically to reproduce what it does to consumers downstream.
    flags:
    - *subject_required
    - *verbose
    - &compatibility-required
      long: --compatibility
      arg: compatibility
      allowed: 
        - BACKWARD
        - BACKWARD_TRANSITIVE
        - FORWARD
        - FORWARD_TRANSITIVE
        - FULL
        - FULL_TRANSITIVE
        - NONE
      required: true
      help: |-
        Schema Registry compatibility rule

  - name: get-mode
    filters:
    - not_mdc_environment
    - schema_registry_running
    group: Schema
    help: |-
      🔏 Get subject-level mode

      READWRITE normally; READONLY if registration has been frozen; IMPORT
      while schemas are being migrated with their original ids and versions.
    flags:
    - *subject_required
    - *verbose

  - name: set-mode
    filters:
    - not_mdc_environment
    - schema_registry_running
    group: Schema
    help: |-
      🔏 Set subject-level mode

        READWRITE   the normal mode, schemas can be read and registered
        READONLY    freeze the subject, registration is refused
        IMPORT      allow registering schemas at a chosen id and version,
                    which is what a migration between registries needs

      ⚠️ To enable mode changes on a Schema Registry cluster, you must also set
      mode.mutability=true in the Schema Registry properties file before
      starting Schema Registry, otherwise this command is rejected.
    flags:
    - *subject_required
    - *verbose
    - long: --mode
      arg: mode
      allowed: 
        - IMPORT
        - READONLY
        - READWRITE
      required: true
      help: |-
        Schema Registry mode

  - name: set-normalize
    filters:
    - not_mdc_environment
    - schema_registry_running
    group: Schema
    help: |-
      🧽 Set normalize at schema registry level

      With normalization on, the registry rewrites a schema into a canonical
      form before storing it, so two schemas that differ only in field order,
      whitespace or the way defaults are written get the same id instead of
      creating a new version every time.

      This applies to the whole registry, not to one subject. Turn it on when
      an example keeps registering a new version of an unchanged schema.

      See https://docs.confluent.io/platform/current/schema-registry/fundamentals/serdes-develop/index.html#schema-normalization
    flags:
    - *verbose
    - long: --value
      arg: value
      allowed: 
        - "true"
        - "false"
      required: true
      help: |-
        true or false


  - name: validate-new-schemas
    filters:
    - not_mdc_environment
    - schema_registry_running
    group: Schema
    help: |-
      🩺 Validate new schemas (default is true since CP 8.2.0)

      Controls whether the registry checks a schema is well formed before
      accepting it. Since CP 8.2.0 this is on by default, and Avro 1.12 added
      strict namespace validation, so schemas that a customer registered years
      ago can now be rejected on a newer version.

      Set it to false to reproduce what that customer had, or to let a legacy
      schema through while you investigate. It applies to the whole registry.

      See https://docs.confluent.io/cloud/current/sr/fundamentals/serdes-develop/index.html#supported-formats:~:text=Strict%20namespace%20validation%20with%20Avro%20version%201.12
    flags:
    - *verbose
    - long: --value
      arg: value
      allowed: 
        - "true"
        - "false"
      required: true
      help: |-
        true or false


  - name: delete
    filters:
    - not_mdc_environment
    - schema_registry_running
    group: Schema
    help: |-
      🧟 Delete schema

      Without --version the whole subject goes; with it, only that version.

      A plain delete is soft: the schema is hidden but its id and version
      number stay taken, so re-registering does not reuse them. Add
      --permanent to really remove it, which is what you need before
      re-creating the same subject from scratch.

      ❕ The registry requires a soft delete before a permanent one; with
         --permanent the command does both for you.
    flags:
    - &subject_not_required
      long: --subject
      required: false
      arg: subject
      completions:
        dynamic:
        - playground get-subject-list
      help: |-
        📛 Subject name to delete:
          
          if --version is provided, only that version will be deleted. Otherwise the complete subject will be deleted
    - long: --version
      required: false
      validate: integer
      arg: version
      help: |-
        🔢 Schema version of the provided subject to delete

        Can only be used when --subject is provided
    - long: --permanent
      required: false
      help: |-
        💀 Hard delete (default is soft delete)
    - *verbose

  - name: derive-schema
    group: Schema
    help: |-
      🪄 Derive a schema based on payload

      Give it one or more json records, on stdin or with --payload, and it
      works out a schema that covers them all. Much faster than writing an
      avro schema by hand, and it handles unions when a field has different
      types across records.
    flags:
      - long: --payload
        arg: payload
        default: "-"
        required: false
        help: |-
          📦 Payload to derive schema from
      - long: --schema-type
        required: false
        default: "AVRO"
        arg: schema-type
        help: |-
            🧩 Schema Registry schema "type":

            - AVRO
            - JSON (json schema)
            - PROTOBUF

            Default is AVRO
        allowed: 
          - AVRO
          - JSON
          - PROTOBUF
    examples: |
        playground schema derive-schema << EOF
        {"name": "Foo", "Age": {"int": 12}}
        {"name": "Bar", "Age": {"string": "12"}}
        {"sport": "Football"}
        {"_id":{"key":"AA"},"duration":{"numberInt":"240"},"employeeNumber":{"numberInt":"12345"},"isActive":"Y","plannedAbsenceKey":"AA","startTimeMin":{"numberLong":"11599920"}}
        EOF

        playground schema derive-schema --payload '{"sport": "Football"}' --schema-type PROTOBUF

  - name: set-alias
    filters:
    - not_mdc_environment
    - schema_registry_running
    group: Schema
    help: |-
      🔯 Set a subject alias

      Makes --alias point at --subject, so a client asking for the alias gets
      the real subject's schemas. That is how you let a consumer keep its own
      subject name while the data actually lives under another one, typically
      after a topic rename or a migration between registries.

      CP 7.4.1 or higher is required to have this feature.

      See https://docs.confluent.io/platform/current/schema-registry/fundamentals/index.html#subject-aliases
    flags:
    - long: --subject
      required: true
      arg: subject
      completions:
        dynamic:
        - playground get-subject-list
      help: |-
        📛 Subject name
    - long: --alias
      required: true
      arg: alias
      help: |-
        🔯 Alias name
    - *verbose

  - name: get-alias
    filters:
    - not_mdc_environment
    - schema_registry_running
    group: Schema
    help: |-
      🔯 Get subject alias

      Shows which real subject an alias resolves to. Use it when a client reads
      schemas that do not match the subject it asked for, the alias is often
      the missing piece.

      CP 7.4.1 or higher is required to have this feature.
    flags:
    - long: --alias
      required: true
      arg: alias
      completions:
        dynamic:
        - playground get-subject-list
      help: |-
        🔯 Alias name
    - *verbose

- name: tcp-proxy
  expose: always
  group: TCP Proxy
  help: |-
    🏚 Zazkia TCP Proxy commands

    Simulate TCP connection issues (reset,delay,throttle,corrupt) using emicklei/zazkia (https://github.com/emicklei/zazkia) TCP proxy

    Slips a controllable proxy between a connector and the system it talks to,
    so you can break the connection on purpose and watch what the connector
    does: does it retry, does it lose records, does it fail the task.

      start        put the proxy in the path, rewriting the connector config
      delay        add latency to the responses
      break        drop a percentage of the responses
      close-connection, close-all-connection-with-error
      toggle-*     cut reads or writes in one direction only
      get-connections   the live connections and their statistics
      open-ui      drive all of the above from the Zazkia web UI

    🎓 Tip: start with 'playground tcp-proxy open-ui' to see what is
    happening, then reproduce the same actions from the CLI in a script.
  commands:

  - name: start
    help: |-
      💗 Start the TCP proxy and automatically replace connector config with zazkia hostname and port 49998

      Starts the proxy in front of --hostname and --port, then rewrites the
      running connector configuration so its traffic goes through it. Nothing
      else to change on your side.
    flags:
      - long: --hostname
        arg: hostname
        required: true
        completions:
          dynamic:
          - playground get-container-list
        help: |-
          Hostname used by the tcp proxy to forward request
      - long: --port
        arg: port
        validate: integer
        required: true
        completions:
          dynamic:
          - playground get-docker-ports
        help: |-
          Port used by the tcp proxy to forward request
      - &throttle-service-response
        long: --throttle-service-response
        arg: throttle-service-response
        validate: integer
        required: false
        default: "0"
        help: |-
          🐌 Throttle service response. This is bytes per second.
      - long: --delay-service-response
        arg: delay-service-response
        validate: integer
        required: false
        default: "0"
        help: |-
          ⏲️ Add milliseconds delay to service response. Default is 0 ms.
      - long: --break-service-response
        arg: break-service-response
        validate: percentage
        required: false
        default: "0"
        help: |-
          💔 Percentage of broken connections. Default is 0%.
      - &service-response-corrupt
        long: --service-response-corrupt
        required: false
        help: |-
          🦹‍♂️ Corrupt service response with random mangled bytes. By default, there is no corruption.
      - long: --skip-automatic-connector-config
        required: false
        help: |-
          🤖 By default, script will attempt to modify automatically the running connector config to use Zazkia proxy.
          
          This flag allows to skip this automatic configuration (only useful if you want to manually update connector config with zazkia tcp proxy details)
    examples:
    - playground tcp-proxy start --hostname mysql --port 3306

  - name: get-connections
    help: |-
      🧲 Get Zazkia active TCP connections config and stats

      Lists every TCP connection currently going through the proxy, with its
      id, its state (the toggles and the delay or break currently applied) and
      its stats (bytes sent and received each way).

      Start here: the id printed by this command is what the other tcp-proxy
      commands take as --connection-id. Connections in EOF state are hidden.

      🎓 Tip: every other tcp-proxy command applies to all active connections
      when you do not pass --connection-id, which is normally what you want.
    flags:
      - &connection-id
        long: --connection-id
        completions:
          dynamic:
          - playground get-zazkia-connection-list
        arg: connection-id
        validate: integer
        required: false
        help: |-
          🧲 Zazkia TCP connection id
                
  - name: delay
    help: |-
        ⏲️ Add milliseconds delay to service response.

        Slows down every response coming back from the service, without
        breaking anything. This is how you reproduce a slow database or a slow
        API: request timeouts, retries, rebalances caused by a task that takes
        too long to answer.

        Set it back to 0 to remove the delay.

        The new state is printed afterwards, so you can check it was applied.
    flags:
      - long: --delay-service-response
        arg: delay-service-response
        validate: integer
        required: true
        help: |-
          ⏲️ Add milliseconds delay to service response.
      - *connection-id

  - name: break
    help: |-
        💔 Break sending the response to the client.

        Drops the response part way through, for the given percentage of
        responses. Unlike close-connection, which kills the connection once,
        this keeps failing intermittently, which is what you need to reproduce
        the flaky network a customer is seeing rather than a clean outage.

        Set it back to 0 to stop breaking responses.

        The new state is printed afterwards, so you can check it was applied.
    flags:
      - long: --break-service-response
        arg: break-service-response
        validate: percentage
        required: true
        help: |-
          💔 Percentage of broken connections.
      - *connection-id

  - name: close-connection
    help: |-
        ❌ Close the Zazkia active TCP connections

        Kills the connection abruptly, the way a firewall or a restarted
        database would. Use it to check that the connector reconnects on its
        own, and how long it takes.

        Without --connection-id, every active connection is closed.
    flags:
      - *connection-id

  - name: close-all-connection-with-error
    help: |-
        🧹 Close all Zazkia TCP connections which are in error state

        Same as the "close all with error" button in the Zazkia UI. Connections
        left behind by a previous break or delay clutter get-connections;
        this cleans them up so you only see the live ones.

  - name: toggle-accept-connections
    help: |-
        🙅‍♂️ Change whether new connections can be accepted

        Turn it off and the service looks down to anything trying to connect,
        while the connections already open keep working. That is the way to
        reproduce a connector that cannot reconnect after a failure, or an
        exhausted connection pool.

        This is a toggle, run it again to accept connections once more.

  - name: toggle-reads-client
    help: |-
        ✅ Change whether reading data from the client is enabled.

        Stops the proxy from reading what the client sends. The client's writes
        pile up in its socket buffer and it eventually blocks, which is how you
        reproduce backpressure and produce timeouts.

        This is a toggle, run it again to restore the flow.

          See diagram in https://github.com/emicklei/zazkia#how-does-it-work- (or locally http://localhost:9191/help.html)
    flags:
      - *connection-id

  - name: toggle-reads-service
    help: |-
        ✅ Change whether reading data from the service is enabled.

        Stops the proxy from reading what the service replies. Nothing comes
        back to the client, so requests hang until they time out, without the
        connection ever being closed. This is the classic black hole that a
        TCP keepalive misconfiguration produces.

        This is a toggle, run it again to restore the flow.

          See diagram in https://github.com/emicklei/zazkia#how-does-it-work- (or locally http://localhost:9191/help.html)
    flags:
      - *connection-id

  - name: toggle-writes-client
    help: |-
        ✅ Change whether writing data to the client is enabled.

        The proxy keeps reading the service's response but never forwards it to
        the client. Close to toggle-reads-service from the client's point of
        view, except the service sees its response as fully sent, so both sides
        disagree about what happened.

        This is a toggle, run it again to restore the flow.

          See diagram in https://github.com/emicklei/zazkia#how-does-it-work- (or locally http://localhost:9191/help.html)
    flags:
      - *connection-id

  - name: toggle-writes-service
    help: |-
        ✅ Change whether writing data to the service is enabled.

        The proxy keeps reading the client's request but never forwards it to
        the service. The client believes it sent its data, the service never
        receives it, so nothing ever answers.

        This is a toggle, run it again to restore the flow.

          See diagram in https://github.com/emicklei/zazkia#how-does-it-work- (or locally http://localhost:9191/help.html)
    flags:
      - *connection-id

  - name: open-ui
    help: |-
        🌐 Just open Zazkia UI (http://localhost:9191) in your browser

        The UI shows the same connections as get-connections, but live, with
        the toggles as buttons and a diagram of which direction each one cuts.
        Easier than the CLI when you are exploring, the CLI is what you put in
        a reproduction script once you know which fault you want.

- name: tools
  expose: always
  group: Tools
  help: |-
    🧰 Tools commands

    Small utilities that are handy around the playground but are not tied to a
    running environment:

      read-avro-file        dump an avro file as readable json
      read-parquet-file     same, for parquet
      certs-create          generate a keystore and truststore for a component
      redos-check           check a topics.regex for catastrophic backtracking
      install-vscode-extension   playground completion inside VS Code

    🎓 Tip: the file readers are what you use to check what a sink connector
    really wrote, after pulling the file out with 'playground container cp'.
  commands:
  - name: install-vscode-extension
    help: |-
      🪄 Install a slightly modified version of "Shell Script Command Completion" Visual Studio Code extension (https://marketplace.visualstudio.com/items?itemName=tetradresearch.vscode-h2o)

      Gives you the same completion inside VS Code as in your terminal: while
      editing an example or a reproduction model, playground commands, flags
      and their allowed values are proposed as you type, with the help text
      on hover. Worth the two minutes of setup if you write example scripts.

      It is installed as "Shell Script Command Completion (kafka-docker-playground)"
      (tetradresearch.vscode-h2o-playground), in place of the marketplace one,
      so that VS Code does not auto-update it with the unpatched version. Run
      the command again to get a newer upstream version.

      After installation, install "playground" command:

      * Go on a .sh file

      * Type Ctrl+Shift+P (or ⌘+⇧+P on macOS) and choose "Shell Completion: Load Command Spec (experimental)" and then type "playground"

      🔖 The command spec is downloaded from the master branch: commands added in a local branch are only proposed once merged. Run "Load Command Spec" again to refresh it.

      👉 Check documentation https://kafka-docker-playground.io/#/cli?id=%f0%9f%aa%84-setup-shell-script-command-completion-visual-studio-code-extension
    examples:
    - playground tools install-vscode-extension
    dependencies:
      code: visit https://code.visualstudio.com/docs/setup/mac#_launching-from-the-command-line to install
      curl: visit https://curl.se/download.html to install
      jq: visit https://jqlang.github.io/jq/download/ to install
      unzip: install it with your package manager (brew install unzip, apt-get install unzip)
      zip: install it with your package manager (brew install zip, apt-get install zip)
  - name: read-avro-file
    help: |-
      🔖 Read provided avro file

      Prints the records as json, along with the writer schema embedded in the
      file. The way to check what a sink connector actually produced.
    flags:
    - long: --file
      short: -f
      required: false
      completions:
        dynamic:
        - playground get-specific-file-extension "$completion_current" --extension "avro"
      validate: file_exists_and_avro
      arg: file
      help: |-
        🔖 Avro file to read

        ❕ It must be absolute full path

        🎓 Tip: use <tab> completion to trigger fzf completion
                use <option+enter> to use the value you typed manually

  - name: read-parquet-file
    help: |-
      🔖 Read provided parquet file

      Prints the rows and the parquet schema, so you can verify what a sink
      connector wrote without an external tool.
    flags:
    - long: --file
      short: -f
      required: false
      completions:
        dynamic:
        - playground get-specific-file-extension "$completion_current" --extension "parquet"
      validate: file_exists_and_parquet
      arg: file
      help: |-
        🔖 Parquet file to read

        ❕ It must be absolute full path

        🎓 Tip: use <tab> completion to trigger fzf completion
                use <option+enter> to use the value you typed manually

  - name: certs-create
    help: |-
      🔐 Generate keys and certificates used for SSL

      Creates a certificate authority and, for each container, a keystore and
      a truststore in --output-folder. This is how the certificates of the
      ssl environments are produced; regenerate them when they have expired,
      or to build a set for a container the playground does not know about.
    flags:
    - long: --container
      short: -c
      alias: [--pod, -p]
      arg: container
      help: |-
        🐳 container name (or pod name when cfk environment is used)

        🎓 Tip: you can pass multiple containers by specifying --container multiple times
      required: false
      repeatable: true
      unique: true
      default:
        - broker 
        - broker2 
        - broker3
        - client 
        - schema-registry 
        - restproxy
        - connect
        - connect2
        - connect3
        - control-center
        - clientrestproxy
        - ksqldb-server
        - conduktor
    - *verbose
    - long: --output-folder
      required: true
      arg: folder
      help: |-
        📁 Folder where certificates are created

  - name: redos-check
    help: |-
      🪖 Check topics.regex for ReDos vulnerabilities using recheck (https://github.com/makenowjust-labs/recheck)

      Some regular expressions take exponential time on certain inputs. A sink
      connector using such a pattern in topics.regex can pin a CPU and stall
      the whole worker on a topic name that happens to hit the bad case, with
      nothing in the logs to explain it.

      Give it the regex and it answers safe, vulnerable, or timeout when the
      analysis itself takes longer than --timeout. The exit code matches:
      0 safe, 1 vulnerable, 2 timeout.

      🎓 Tip: worth running whenever a customer reports a connect worker at
      100% CPU with no progress and a topics.regex in the configuration.
    flags:
      - long: --topic-regex
        arg: regex
        required: true
        help: |-
          🔣 Topic regex to test
      - long: --timeout
        arg: timeout
        validate: integer
        required: false
        default: "1"
        help: |-
          Max number of seconds to wait for ReDos check.

          Default is 1 second

- name: analyze
  alias: analyse
  expose: always
  group: Analyze
  help: |-
    🔎 Analyze commands

    Turn what you collected into findings: each command reads a file (a
    dump, a log, a bundle, a report, yours or one a customer sent) or takes
    it from a running container, and prints a digest with what is wrong and
    what to do, plus an HTML report to share (opened in your browser). They
    all work offline, and --sample runs them on the samples shipped with the
    playground, to see what they report.

      thread-dump             deadlocks, lock contention, stuck threads
      gc-logs                 GC pauses, failures, live set, leak trend
      heap-dump               Eclipse MAT leak suspects, retained sizes
      logs                    ERROR/FATAL digest of logs, folders, zips
      oracle-xstream-report   Oracle XStream diagnostics (orclcdc_diag)
      cfk-bundle              CFK support bundle: pods, events, CRs, logs
      flight-recorder         JFR: where the time of the connector tasks goes

    To collect them: playground debug thread-dump, heap-dump, flight-recorder,
    playground connector oracle-cdc-xstream generate-report,
    playground debug cfk generate-bundle.
  commands:
  - name: thread-dump
    help: |-
      🧵 Analyze java thread dumps: deadlocks, lock contention, stuck and CPU-hungry threads

      📊 Reads jstack / jcmd Thread.print / kill -3 output (JDK 8 to 25), several dumps per file and container logs included, and reports: thread states and pools, deadlocks, locks with their owner and waiters, the most common stacks, and with several dumps of the same JVM: threads stuck on the same frames, the CPU used by each thread between dumps, and growing thread pools. Kafka / Connect aware (task threads, herder, broker request handlers).

      🐳 With --container (default: connect), it takes --count dumps --interval seconds apart with kill -3: the JVM prints them to the container logs, no JDK is needed in the image.

      🌐 Also writes a self-contained HTML report (inline SVG charts, works offline) in --output-dir, opened in the browser in an interactive terminal

      🧪 With --sample, it analyzes the samples shipped in tools/thread-analyzer/samples: a quick way to see what it reports.

      🔖 Exit code is 0 when the analysis completed, 2 when no thread dump was found
    flags: &analyze_thread_dump_flags
      - long: --file
        short: -f
        required: false
        repeatable: true
        arg: file
        validate: file_or_dir_exists
        completions:
          dynamic:
          - playground get-specific-file-extension "$completion_current" --extension "log"
        help: |-
          🗒️  Thread dump file or folder (repeat --file for several dumps of the same JVM)

          ❕ Provide only one of --file, --container and --sample

          🎓 Tip: use <tab> completion to trigger fzf completion
                  use <option+enter> to use the value you typed manually
      - long: --sample
        short: -s
        required: false
        repeatable: true
        arg: sample
        allowed: [deadlock_jdk21, deadlock_jdk8, healthy_connect]
        help: |-
          🧪 Sample of tools/thread-analyzer/samples

            deadlock_jdk21     3 jstack -l dumps of one JDK 21 JVM, 3 s apart: deadlock, blocked threads, CPU-hot thread, stuck task, leaking pool
            deadlock_jdk8      the same scenario, one dump, JDK 8
            healthy_connect    3 kill -3 dumps of a healthy CP 8.3.2 Connect worker, from its container logs
      - long: --container
        short: -c
        alias: [--pod, -p]
        required: false
        arg: container
        completions:
          dynamic:
          - playground get-container-list
        help: |-
          🐳 Container name (or pod name when cfk environment is used) to take the thread dumps from (default: connect)
      - long: --count
        arg: count
        required: false
        default: "3"
        validate: integer
        help: |-
          🔢 Number of thread dumps to take with --container (default: 3)
      - long: --interval
        arg: interval
        required: false
        default: "5"
        validate: integer
        help: |-
          ⏱️  Seconds between two thread dumps with --container (default: 5)
      - long: --output-dir
        short: -o
        arg: output_dir
        required: false
        default: "./thread-analysis-output"
        help: |-
          📂 Output directory for the thread dumps taken from a container and the HTML report (default: ./thread-analysis-output)
      - long: --html
        required: false
        private: true
        help: |-
          Deprecated: the HTML report is always written (kept so that existing commands keep working)
      - long: --json
        required: false
        help: |-
          🗂️  Output JSON (no text report, no HTML report)
      - long: --top
        arg: top
        required: false
        default: "10"
        validate: integer
        help: |-
          📊 Number of rows per section (default: 10)
    examples:
    - playground analyze thread-dump --sample deadlock_jdk21
    - playground analyze thread-dump
    - playground analyze thread-dump -c broker --count 5 --interval 2
    - playground analyze thread-dump --file thread-dump-connect-2026-10-13.log
    - playground analyze thread-dump -f dump1.txt -f dump2.txt -f dump3.txt
    - playground analyze thread-dump -f ./customer-logs/connect-stdout.log
    - playground analyze thread-dump -c connect --json

  - name: heap-dump
    help: |-
      🔬 Analyze a heap dump with Eclipse Memory Analyzer (MAT), run headless in Docker

      🕵️ Prints a text digest: heap overview, MAT leak suspects (accumulation point and who holds it) and the top retained sizes by class (dominator tree), and saves the MAT HTML reports (Leak_Suspects, System_Overview, Top_Components) in --output-dir

      📈 Use --compare with a second dump of the same JVM, taken later under the same load, to see which classes grow

      🐳 MAT needs roughly as much memory as the used heap of the dump (1 to 1.5x the .hprof size): give Docker enough memory or use --max-memory

      🧪 With --sample, it analyzes the samples shipped in tools/heap-analyzer/samples: a quick way to see what it reports.

      🔖 Exit code is 0 when the analysis completed, non-zero when MAT could not parse the dump (truncated file, out of memory): never a "healthy" verdict on a failed parse
    flags: &analyze_heap_dump_flags
      - long: --file
        short: -f
        required: false
        completions:
          dynamic:
          - playground get-specific-file-extension "$completion_current" --extension "hprof"
        validate: file_exists_and_hprof
        arg: file
        help: |-
          🔖 Heap dump to analyze (.hprof, or .hprof.gz as written by jcmd GC.heap_dump -gz)

          🎓 Tip: use <tab> completion to trigger fzf completion
                  use <option+enter> to use the value you typed manually
      - long: --sample
        short: -s
        required: false
        arg: sample
        allowed: [leak, leak_growth]
        help: |-
          🧪 Sample of tools/heap-analyzer/samples

            leak          heap dump of a JVM with a session cache that is never evicted (MAT leak suspect)
            leak_growth   two dumps of that JVM a few seconds apart: the later one is compared with the earlier one
      - long: --output-dir
        short: -o
        arg: output_dir
        required: false
        default: "./heap-analysis"
        help: |-
          📂 Output directory for the digest (summary.txt), the MAT HTML reports and mat.log (default: ./heap-analysis)
      - long: --report-type
        short: -r
        arg: report_type
        allowed: [all, leaks, overview, top-components]
        required: false
        default: "all"
        help: |-
          📋 MAT HTML report(s) to generate (the text digest is always printed)

          - all: the three reports below
          - leaks: leak suspects (org.eclipse.mat.api:suspects)
          - overview: system overview (org.eclipse.mat.api:overview)
          - top-components: top components per class loader (org.eclipse.mat.api:top_components)
      - long: --max-memory
        arg: max_memory
        required: false
        help: |-
          🧠 Java heap given to MAT, e.g. 8g (default: 80% of the Docker memory)
      - long: --compare
        arg: file
        required: false
        completions:
          dynamic:
          - playground get-specific-file-extension "$completion_current" --extension "hprof"
        validate: file_exists_and_hprof
        help: |-
          📈 Second heap dump of the same JVM, taken later: prints the classes whose instance count and shallow size grew
    examples:
    - playground analyze heap-dump --sample leak
    - playground analyze heap-dump --sample leak_growth
    - playground analyze heap-dump --file heap-dump-connect-2026-04-08.hprof
    - playground analyze heap-dump -f heap-dump-broker.hprof --output-dir ./analysis
    - playground analyze heap-dump -f heap-dump-connect.hprof --report-type leaks
    - playground analyze heap-dump -f heap-1.hprof --compare heap-2.hprof
    - playground analyze heap-dump -f big-heap-dump.hprof --max-memory 12g

  - name: logs
    help: |-
      🔥 Show a digest of ERROR/FATAL records found in log files, folders or zip bundles

      The offline counterpart of 'playground container logs --errors', for
      logs that do not come from a running container: a customer support
      bundle, a CI artifact, a log file you were sent.

      Repeated records are de-duplicated with an occurrence count, stack
      traces are collapsed to the exception chain ("Caused by:") plus a few
      frames of the deepest cause. Only records with an explicit level are
      reported (" ERROR ", "[ERROR]", level=error, "level":"error"), plus
      uncaught java exceptions: records logged at INFO/DEBUG/TRACE, and
      level-less lines that merely contain "error" or "failed", never are.

      📂 Folders are scanned recursively. .zip, .tar, .tar.gz and .tgz files
      are extracted in a temporary folder, .gz files are decompressed on the
      fly, binary files are skipped. Only files with findings are shown.
    flags: &analyze_logs_flags
      - long: --file
        short: -f
        required: false
        repeatable: true
        arg: file
        help: |-
          🗒️  Log file, folder, .zip, .tar(.gz) or .gz file to analyze

          🎓 Tip: can be set several times
      - long: --sample
        short: -s
        required: false
        repeatable: true
        arg: sample
        allowed: [connect_task_failure, support_bundle]
        help: |-
          🧪 Sample of tools/log-analyzer/samples

            connect_task_failure   Connect worker log: Oracle XStream connector with a wrong password, an unknown
                                   outbound server, and a task failing after the outbound server was stopped
            support_bundle         .zip with that log and a gzipped broker log
      - long: --include-warnings
        required: false
        help: |-
          🟠 Also report WARN records
      - long: --max-findings
        arg: max_findings
        required: false
        validate: integer
        default: "40"
        help: |-
          ✂️ Maximum number of distinct records to show per file (default 40)
    examples:
    - playground analyze logs --sample connect_task_failure
    - playground analyze logs --sample support_bundle --include-warnings
    - playground analyze logs --file connect.log
    - playground analyze logs --file connect-logs.zip --include-warnings
    - playground analyze logs -f ./logs -f broker.log.gz --max-findings 10
    x_example_outputs:
    - command: playground analyze logs -f connect.log
      output: |-
        17:23:19 ℹ️ 🔥 ERROR/FATAL digest for connect.log
        🔎 1 distinct record(s), 2 occurrence(s), in 12 lines

        🔴 ERROR x2 (first seen line 2, last seen line 10)
        [2026-10-13 10:00:05,123] ERROR [http-sink|task-0] WorkerSinkTask{id=http-sink-0} Task threw an uncaught and unrecoverable exception. Task is being killed and will not recover until manually restarted (org.apache.kafka.connect.runtime.WorkerTask:234)
            org.apache.kafka.connect.errors.ConnectException: Exiting WorkerSinkTask due to unrecoverable exception.
            Caused by: org.apache.kafka.connect.errors.ConnectException: Error while processing HTTP request with Url : http://httpserver:9006/api/messages, Status code : 500
                at io.confluent.connect.http.writer.HttpWriterImpl.handleErrors(HttpWriterImpl.java:405)

        17:23:19 ℹ️ 📊 1 file(s) with findings out of 1 scanned (binary files skipped: 0)
    footer: |-
      Example output:
        $ playground analyze logs -f connect.log
        17:23:19 ℹ️ 🔥 ERROR/FATAL digest for connect.log
        🔎 1 distinct record(s), 2 occurrence(s), in 12 lines

        🔴 ERROR x2 (first seen line 2, last seen line 10)
        [2026-10-13 10:00:05,123] ERROR [http-sink|task-0] WorkerSinkTask{id=http-sink-0} Task threw an uncaught and unrecoverable exception. Task is being killed and will not recover until manually restarted (org.apache.kafka.connect.runtime.WorkerTask:234)
            org.apache.kafka.connect.errors.ConnectException: Exiting WorkerSinkTask due to unrecoverable exception.
            Caused by: org.apache.kafka.connect.errors.ConnectException: Error while processing HTTP request with Url : http://httpserver:9006/api/messages, Status code : 500
                at io.confluent.connect.http.writer.HttpWriterImpl.handleErrors(HttpWriterImpl.java:405)

        17:23:19 ℹ️ 📊 1 file(s) with findings out of 1 scanned (binary files skipped: 0)

  - name: gc-logs
    help: |-
      📈 Analyze JVM Garbage Collection logs

      📊 Parses GC logs from local files / folders or a running container: pause statistics, Full GC and evacuation / concurrent mode failures, live set, heap floor trend (leak), allocation stalls, GC causes, and recommendations backed by a finding (Kafka-aware: compared with Kafka's own G1 settings).

      🔖 Supports JDK 7–21+ and all major collectors: G1GC, CMS, ZGC, Generational ZGC, Shenandoah, ParallelGC, SerialGC, in legacy (-XX:+PrintGCDetails) and unified (-Xlog:gc*) formats, any decoration

      🔄 Pass every rotated file (kafkaServer-gc.log, .log.0…, .gz) or their folder: files are ordered by timestamp and split by JVM restart, the latest run is analyzed (--run to pick another)

      🧪 With --sample, it analyzes the samples shipped in gc-analysis/samples: a quick way to see what it reports.

      🔖 Exit code is 0 when the analysis completed, 2 when no GC event was found

      🌐 Also writes a self-contained HTML dashboard (pause timeline, heap before / after GC, pause distribution, KPI cards, recommendations; no external resource) in --output-dir, opened in the browser in an interactive terminal
    flags: &analyze_gc_logs_flags
      - long: --file
        short: -f
        required: false
        repeatable: true
        arg: file
        validate: file_or_dir_exists
        completions:
          dynamic:
          - playground get-specific-file-extension "$completion_current" --extension "log"
        help: |-
          🗒️  GC log file or folder to analyze (repeat --file for the rotated files of the same JVM)

          ❕ Provide only one of --file, --container and --sample

          🎓 Tip: use <tab> completion to trigger fzf completion
                  use <option+enter> to use the value you typed manually
      - long: --sample
        short: -s
        required: false
        repeatable: true
        arg: sample
        allowed: [jdk7_parallel, jdk8_cms, jdk8_cms_cmf_real, jdk8_g1gc, jdk8_g1gc_details_real, jdk11_zgc, jdk17_g1gc, jdk17_shenandoah, jdk21_g1_kafka_real, jdk21_genzgc, jdk21_genzgc_real]
        help: |-
          🧪 Sample of gc-analysis/samples (repeat --sample to analyze several)

            GC logs of JDK 7 to 21 and every collector, named <jdk>_<collector>[_real]
            (_real: taken from a real Kafka / Connect JVM)
      - long: --container
        short: -c
        alias: [--pod, -p]
        required: false
        arg: container
        completions:
          dynamic:
          - playground get-container-list
        help: |-
          🐳 Container name (or pod name when cfk environment is used) to extract the GC log from

          ❕ Provide only one of --file, --container and --sample

          🔖 The GC log path is read from the java command line (-Xlog:gc*:file=… or -Xloggc:…), and its rotated files are copied too.
               Falls back to searching common log locations (/var/log, /tmp, /opt).
               The playground environments write a GC log for ZooKeeper, brokers, controllers, Schema Registry,
               Connect (-loggc, /var/log/kafka/<name>-gc.log) and ksqlDB.
      - long: --output-dir
        short: -o
        arg: output_dir
        required: false
        default: "./gc-analysis-output"
        help: |-
          📂 Output directory for the HTML report and the GC logs copied from a container (default: ./gc-analysis-output)
      - long: --html
        required: false
        private: true
        help: |-
          Deprecated: the HTML report is always written (kept so that existing commands keep working)
      - long: --json
        required: false
        help: |-
          🗂️  Output JSON stats (no text report, no HTML report)
      - long: --run
        arg: run
        required: false
        validate: integer
        help: |-
          🔄 JVM run to analyze when the log spans restarts (default: the latest, see the "JVM runs" table)
      - long: --top-pauses
        arg: top_pauses
        required: false
        default: "10"
        validate: integer
        help: |-
          📊 Number of longest pauses to display in the report (default: 10)
    examples:
    - playground analyze gc-logs --sample jdk21_g1_kafka_real
    - playground analyze gc-logs --sample jdk8_cms_cmf_real
    - playground analyze gc-logs --file gc.log
    - playground analyze gc-logs --file /var/log/kafka/kafkaServer-gc.log
    - playground analyze gc-logs -f gc.log -f gc.log.0 -f gc.log.1
    - playground analyze gc-logs --file ./customer-logs/broker-1/
    - playground analyze gc-logs --container broker
    - playground analyze gc-logs --container broker --output-dir ./gc-reports
    - playground analyze gc-logs -f kafkaServer-gc.log --json
    - playground analyze gc-logs -f kafkaServer-gc.log --run 1 --top-pauses 20

  - name: oracle-xstream-report
    help: |-
      🅾️ Analyze Oracle XStream CDC diagnostics reports (orclcdc_diag.sql)

      📊 Reads the HTML report of the Confluent diagnostics script (the file support asks for, orclcdc_diag_<date>.html) and reports: prerequisites (archivelog, supplemental logging, streams_pool_size, MAX_SGA_SIZE), the state of the capture process (its position as a date, and whether it waits for redo it cannot read), LogMiner, outbound server, apply reader, buffered queue and streams pool with thresholds, open and long running transactions, overlapping capture rules, alerts and errors of the last 7 days, the findings sorted by severity with the report section and the exact values, and the matched root-cause patterns.

      📈 Give several reports of the same database (repeat --file) to see what moved between them: captured SCN, messages captured, LCRs sent, latency, restarts.

      🎯 Describe the problem with --problem ("no records since 11th of OCT"): the report is matched against it, the date where the capture stopped is compared with yours, and the findings that explain it come first.

      🐳 With --container (default: oracle), it runs 'playground connector oracle-cdc-xstream generate-report' on the running example first, and analyzes the result.

      🧪 With --sample, it analyzes the reports shipped in tools/xstream-analyzer/samples: a quick way to see what it reports without an Oracle database.

      🌐 Also writes a self-contained HTML report (findings, prerequisites, components, streams pool advice chart, deltas between reports) in --output-dir, to share in a case; opened in the browser in an interactive terminal

      🔖 Exit code is 0 when the analysis completed, 2 when the file is not an orclcdc_diag report

      👉 Check documentation https://docs.confluent.io/kafka-connectors/oracle-xstream-cdc-source/current/troubleshooting.html#connector-diagnostics-script
    flags: &analyze_oracle_xstream_report_flags
      - long: --file
        short: -f
        required: false
        repeatable: true
        arg: file
        validate: file_exists_with_trick
        completions:
          dynamic:
          - playground get-specific-file-extension "$completion_current" --extension "html"
        help: |-
          🗒️  orclcdc_diag HTML report (repeat --file for several reports of the same database)

          ❕ Provide only one of --file, --container and --sample

          🎓 Tip: use <tab> completion to trigger fzf completion
                  use <option+enter> to use the value you typed manually
      - long: --container
        short: -c
        required: false
        arg: container
        help: |-
          🐳 Oracle container of a running XStream example to generate the report from (default: oracle)
      - long: --sample
        short: -s
        required: false
        repeatable: true
        arg: sample
        allowed: [healthy, large_transaction, detached, older_script_version, synthetic_failures, missing_archived_log]
        help: |-
          🧪 Sample report of tools/xstream-analyzer/samples (repeat --sample to compare several)

            healthy                connector running, idle database
            large_transaction      uncommitted 150,000-row insert
            detached               connector deleted: outbound server DETACHED
            older_script_version   report of an older orclcdc_diag.sql
            synthetic_failures     NOARCHIVELOG, capture ABORTED, flow control, LogMiner memory, spills, alerts
            missing_archived_log   capture WAITING FOR REDO on an archived log it cannot read: nothing captured
      - long: --problem
        short: -p
        arg: problem
        required: false
        help: |-
          🎯 Problem statement, in your own words: symptom and since when (example: "no records processed since 11th of OCT")

          The symptoms (no data, lag, missing data, duplicates, errors, memory) and dates it recognizes are matched against the report: capture position as a date, messages captured and LCRs sent, and the findings that explain it, most relevant first
      - long: --output-dir
        short: -o
        arg: output_dir
        required: false
        default: "./xstream-analysis-output"
        help: |-
          📂 Output directory for the report generated with --container and the HTML report (default: ./xstream-analysis-output)
      - long: --html
        required: false
        private: true
        help: |-
          Deprecated: the HTML report is always written (kept so that existing commands keep working)
      - long: --json
        required: false
        help: |-
          🗂️  Output JSON (findings, prerequisites, summary per component, deltas between reports)
      - long: --top
        arg: top
        required: false
        default: "10"
        validate: integer
        help: |-
          📊 Maximum number of rows per list: transactions, alerts, errors, tables (default: 10)
    examples:
    - playground analyze oracle-xstream-report --sample synthetic_failures
    - playground analyze oracle-xstream-report -s large_transaction -s detached
    - playground analyze oracle-xstream-report --sample large_transaction --json
    - playground analyze oracle-xstream-report -f orclcdc_diag_20261013_0912.html
    - playground analyze oracle-xstream-report -f day1.html -f day2.html
    - playground analyze oracle-xstream-report -f orclcdc_diag_20261013_1826.html --problem "no records processed since 11th of OCT"
    - playground analyze oracle-xstream-report --container oracle

  - name: cfk-bundle
    help: |-
      📦 Analyze a Confluent for Kubernetes (CFK) support bundle

      🔍 Checks Warning events, pods (phase, waiting reasons, restarts, OOMKilled), every platform.confluent.io custom resource (phase/state, ready replicas, False conditions, failed connector tasks) and the ERROR/FATAL records of every log (rotated and .gz included, with their Caused by chain and an occurrence count), sorts them into ~30 categories (pod failures, TLS, auth, MDS/RBAC, license, KRaft, replication, storage, scheduling, …) and prints concrete remediation steps per category.

      🧭 Also prints the environment (Kubernetes version, CFK operator version, application / init image of every component, from cluster-details.txt and the CRs) and checks it against the CFK support matrix (Kubernetes, Confluent Platform and Control Center ranges, init container on the operator version), lists the recent changes (who edited which CR and when, from managedFields, StatefulSet rollouts, pod (re)starts) and flags a JVM default truststore (-Djavax.net.ssl.trustStore) set without its password, the cause of "trustAnchors parameter must be non-empty". One issue per root cause: the connector tasks it affects are listed with it.

      ✅ Works offline on any bundle produced by kubectl confluent support-bundle (or playground debug cfk generate-bundle): no cfk environment needed.

      🔒 Sanitization (secrets / IPs / hostnames / emails / LDAP DNs) is ON by default. It is best effort: review the output before sharing it. Pass --no-sanitize only for internal/test bundles.

      🔖 Accepts a directory or a .tar / .tar.gz / .tgz / .zip archive.

      🔖 Use --json to emit machine-readable output for downstream tooling.

      🧩 Each issue is attributed to a component (kafka, kraftcontroller, connect, schemaregistry, operator…) and to the instance (CR name, e.g. connect-peh) it comes from. Use --component to keep only some of them, or the Component / Instance buttons of the HTML report.

      🌐 Prints the text digest and also writes a self-contained HTML report in --output-dir, opened in the browser in an interactive terminal.

      🧪 With --sample, it analyzes the samples shipped in cfk-analysis/samples: a quick way to see what it reports.

      🔖 Exit code is 0 when the analysis completed (whatever was found, read the summary), 64 for an invalid, unsafe or empty bundle.
    flags: &analyze_cfk_bundle_flags
      - long: --bundle
        short: -b
        required: false
        arg: path
        help: |-
          🗂️  Path to the CFK support bundle (directory or .tar/.tar.gz/.tgz/.zip)
      - long: --sample
        short: -s
        required: false
        arg: sample
        allowed: [synthetic]
        help: |-
          🧪 Sample of cfk-analysis/samples

            synthetic   CFK bundle: kafka-2 crash-looping on an expired certificate, pending volume, OOMKilled Connect
                        pod, failed connector task, Schema Registry authentication failure, operator reconcile errors
      - long: --json
        required: false
        help: |-
          📄 Emit machine-readable JSON (includes per-issue recommendation) instead of the text report
      - long: --no-sanitize
        required: false
        help: |-
          ⚠️  Disable sanitization of IPs, hostnames, emails, and credentials.

          🚫 NEVER use this for customer bundles. Internal/test bundles only.
      - long: --severity
        required: false
        arg: level
        allowed: [critical, high, medium, low]
        help: |-
          🎚️  Filter issues by minimum severity (critical | high | medium | low)
      - long: --component
        required: false
        repeatable: true
        arg: component
        allowed: [kafka, kraftcontroller, zookeeper, connect, schemaregistry, ksqldb, controlcenter, kafkarestproxy, operator, other]
        help: |-
          🧩 Only keep the issues of this component (repeat --component for several). other = not a CFK component (nodes, volumes, unknown pods)
      - long: --top
        required: false
        arg: n
        default: "5"
        validate: integer
        help: |-
          🔢 Max number of issues to display per category in text mode (default: 5)
      - long: --include-warnings
        required: false
        help: |-
          ⚠️  Also report WARN log records that match no known category (WARN records matching a known category are always reported)
      - long: --html
        required: false
        private: true
        help: |-
          Deprecated: the HTML report is always written (kept so that existing commands keep working)
      - long: --output-dir
        required: false
        arg: dir
        default: "./cfk-reports"
        help: |-
          📁 Directory for the HTML report (default: ./cfk-reports)
    examples:
    - playground analyze cfk-bundle --sample synthetic
    - playground analyze cfk-bundle --bundle ./customer-bundle.tar.gz
    - playground analyze cfk-bundle --bundle ./extracted-bundle/
    - playground analyze cfk-bundle --bundle ./bundle.zip --severity high
    - playground analyze cfk-bundle --bundle ./bundle.tar --component connect
    - playground analyze cfk-bundle --bundle ./bundle.tar.gz --json > report.json
    - playground analyze cfk-bundle -b ./bundle.tgz --output-dir ./reports
    - playground analyze cfk-bundle -b ./bundle.tgz --include-warnings

  - name: flight-recorder
    help: |-
      🛩️ Analyze a Java Flight Recorder recording: where the time of the connector tasks goes

      📊 For the Kafka Connect task threads (task-thread-*, or --threads / --connector): the time of each thread by state (running, blocked on network I/O by remote host, Kafka client, locks, waiting, file I/O), the CPU by layer (connector, converters, SMTs, Kafka client, connect framework, libraries, logging, JDK), the hot methods, the allocation by class, locks and waits by site, the busiest threads of the JVM, GC pauses and exceptions, and findings with next steps. Without task thread in the recording, every thread is analyzed.

      🐳 With --container (default: connect), it records the JVM for --duration over JMX (FlightRecorderMXBean: no jcmd, which the cp images do not have, and no restart) with the settings of tools/jfr-analyzer/playground.jfc, then analyzes the recording. playground connector benchmark records the measure the same way.

      🔖 Reads .jfr files of JDK 11+ JVMs with the JDK flight recorder API, run in a eclipse-temurin:25-jdk container (pulled the first time). The settings of the recording matter: playground.jfc records socket, file, lock and park events from 1 ms and the CPU of each thread every second; a recording made with the default or profile settings of the JDK gives fewer details (throttled socket events, 10 ms thresholds).

      🌐 Also writes a self-contained HTML report (inline SVG charts, works offline) in --output-dir, opened in the browser in an interactive terminal

      🧪 With --sample, it analyzes the digests shipped in tools/jfr-analyzer/samples (no Docker needed): a quick way to see what it reports.

      🔖 Exit code is 0 when the analysis completed, 2 when the file is not a flight recording or has no event
    flags:
      - long: --file
        short: -f
        required: false
        repeatable: true
        arg: file
        validate: file_exists
        completions:
          dynamic:
          - playground get-specific-file-extension "$completion_current" --extension "jfr"
        help: |-
          🗒️  .jfr file to analyze (repeat --file for the recordings of several connect workers over the same period)

          ❕ Provide only one of --file, --container and --sample

          🎓 Tip: use <tab> completion to trigger fzf completion
                  use <option+enter> to use the value you typed manually
      - long: --sample
        short: -s
        required: false
        arg: sample
        allowed: [jdbc_postgres_sink]
        help: |-
          🧪 Sample of tools/jfr-analyzer/samples

            jdbc_postgres_sink   drain of 3M avro records by the JDBC sink to PostgreSQL, 1 task, CP 8.3.2 (JDK 25)
      - long: --container
        short: -c
        required: false
        arg: container
        completions:
          dynamic:
          - playground get-container-list
        help: |-
          🐳 Container to record over JMX for --duration (default: connect). Its JMX port (KAFKA_JMX_PORT, SCHEMA_REGISTRY_JMX_PORT...) must be set, as in the playground environments
      - long: --duration
        arg: duration
        validate: duration
        required: false
        default: "60s"
        help: |-
          ⏱️ Duration of the recording with --container, in seconds or with a s/m/h suffix (default is 60s)
      - long: --connector
        required: false
        arg: connector
        completions:
          dynamic:
          - playground get-connector-list
        help: |-
          🔗 Analyze the task threads of this connector only (task-thread-<connector>-<n>), and classify its frames as connector code (its class is read from the connect REST API when connect is running)
      - long: --connector-class
        required: false
        arg: connector_class
        help: |-
          🔌 Class of the connector, to classify its frames as connector code (default: read from --connector, or guessed from the package)
      - long: --threads
        required: false
        arg: regex
        help: |-
          🧵 Regular expression of the thread names to analyze (default: ^task-thread-, or the task threads of --connector)
      - long: --output-dir
        short: -o
        arg: output_dir
        required: false
        default: "./jfr-analysis-output"
        help: |-
          📂 Output directory for the recording taken from a container, the digest and the HTML report (default: ./jfr-analysis-output)
      - long: --json
        required: false
        help: |-
          🗂️  Output JSON (no text report, no HTML report)
      - long: --top
        arg: top
        required: false
        default: "10"
        validate: integer
        help: |-
          📊 Number of rows per section (default: 10)
    examples:
    - playground analyze flight-recorder --sample jdbc_postgres_sink
    - playground analyze flight-recorder
    - playground analyze flight-recorder -c connect --duration 2m --connector my-jdbc-sink
    - playground analyze flight-recorder --file flight-recorder-connect-2026-10-16-09-12-00.jfr
    - playground analyze flight-recorder -f /tmp/playground-benchmark/my-sink-20261016-091200-connect.jfr -f /tmp/playground-benchmark/my-sink-20261016-091200-connect2.jfr
    - playground analyze flight-recorder -f recording.jfr --threads '^pool-.*' --json

- name: debug
  expose: always
  group: Debug
  help: |-
    🐞 Debug commands

    The heavy tooling, made usable: the JDK utilities, tcpdump, iptables and
    the analysis tools are run inside the right container, installed on the
    fly when missing, and their output is brought back to your machine.

    🐌 It hangs, or it is slow
      thread-dump         what every thread is doing right now
      flight-recorder     record the JVM from start to stop, then analyze it

    💾 It eats memory
      heap-dump           take a .hprof, optionally as a histogram

    🌐 It is a network or TLS problem
      tcp-dump            capture traffic, open it in Wireshark
      testssl             probe a TLS endpoint, locally or in the cloud
      block-traffic       cut a route with iptables, to simulate an outage
      degrade-traffic     add latency, packet loss or corruption with tc
      java-debug          turn on the JVM SSL, Kerberos or class loading traces

    🔬 It is in the code
      log-level set       raise the level of any package, without a restart
      enable-remote-debugging   attach your IDE debugger to a container
      jscissors           trace method calls, arguments and return values

    📦 Hand it over
      generate-diagnostics   a support bundle for connect or broker

    🔎 To analyze what you collected (thread dumps, GC logs, heap dumps,
    logs, Oracle XStream reports, CFK bundles, flight recordings): playground analyze
  commands:

  - name: enable-remote-debugging
    help: |-
      ✨ Enable java remote debugging for container
      
      👉 Check documentation https://kafka-docker-playground.io/#/reusables?id=%e2%9c%a8-remote-debugging
    flags:
      - &container
        long: --container
        short: -c
        alias: [--pod, -p]
        required: false
        default: "connect"
        arg: container
        repeatable: true
        completions:
          dynamic:
          - playground get-container-list
        help: |-
          🐳 container name (or pod name when cfk environment is used)

          🎓 Tip: you can pass multiple containers by specifying --container multiple times
      - long: --skip-vs-code-config-display
        required: false
        private: true
    examples:
    - playground debug enable-remote-debugging
    - playground debug enable-remote-debugging --container broker
    - playground debug enable-remote-debugging -c broker
    - playground debug enable-remote-debugging -c connect -c broker
    - playground debug enable-remote-debugging --container schema-registry --container ksqldb-server --container control-center

  - name: disable-remote-debugging
    help: |-
      🛑 Disable java remote debugging for container
    flags:
      - *container

  - name: testssl
    help: |-
      🔐 Testing TLS/SSL encryption using https://testssl.sh/
    flags:
      - long: --uri
        arg: uri
        required: true
        help: |-
          host|host:port|URL|URL:port   port 443 is default, URL can only contain HTTPS protocol
    catch_all:
      label: testssl arguments
      help: arguments to pass to testssl, see https://testssl.sh for all options
    examples:
    - playground debug testssl --uri "https://google.com" --fast
    - playground debug testssl --uri "pkc-xxxx.us-west-2.aws.confluent.cloud:9092"

  - name: generate-diagnostics
    help: |-
      ⛑️ Generate a diagnostic bundle with Diagnostics Bundle Tool

      ⚠️ only connect and broker containers are supported for now

      see https://docs.confluent.io/platform/current/tools/diagnostics-tool.html#collect-diagnostics
    flags:
      - *container
    examples:
    - playground debug generate-diagnostics
    - playground debug generate-diagnostics --container broker

  - name: thread-dump
    help: |-
      🎯 Take a java thread dump

      🔖 It will save output to a file and open with text editor set with playground config editor <editor> (default is code)

      The first thing to take when something is stuck: it shows the stack of
      every thread, and the deadlocks if any.

      🔖 It sends kill -3 to the JVM, which prints the dump to the container logs: no JDK is needed in the image and the container is not restarted. It falls back to jstack -l when the dump does not reach the logs.

      🎓 Tip: take two or three dumps a few seconds apart. Threads that appear
      in the same place every time are the ones that are really blocked. playground analyze thread-dump does it and analyzes them.
    flags:
      - *container
      - long: --jstack
        required: false
        help: |-
          🔧 Use jstack -l instead of kill -3: adds the owners of java.util.concurrent locks ("Locked ownable synchronizers"). Needs a JDK in the image (on cfk, a debug container is attached); the container is never restarted
    examples:
    - playground debug thread-dump
    - playground debug thread-dump --container broker
    - playground debug thread-dump -c connect -c broker
    - playground debug thread-dump --container schema-registry --container ksqldb-server
    - playground debug thread-dump --container connect --jstack

  - name: thread-analyze
    private: true
    filename: commands/analyze/thread-dump.sh
    help: |-
      Moved to 'playground analyze thread-dump' (kept as a hidden alias)
    flags: *analyze_thread_dump_flags

  - name: heap-dump
    help: |-
      👻 Take a heap dump

      🔖 It will save output to a .hprof file. VisualVM (https://visualvm.github.io/) or MAT (https://www.eclipse.org/mat/) can be used to read the file.

      It will run a full gc first. If you don't want this, use
    flags:
      - *container
      - long: --live
        required: false
        help: |-
          🧬 dump only live objects; if not specified, all objects in the heap are dumped
      - long: --histo
        required: false
        help: |-
          📊 print histogram of java object heap
    examples:
    - playground debug heap-dump
    - playground debug heap-dump --container broker
    - playground debug heap-dump -c connect -c broker
    - playground debug heap-dump --container schema-registry --live
    - playground debug heap-dump -c connect -c broker --histo

  - name: heap-analyze
    private: true
    filename: commands/analyze/heap-dump.sh
    help: |-
      Moved to 'playground analyze heap-dump' (kept as a hidden alias)
    flags: *analyze_heap_dump_flags

  - name: analyze-logs
    private: true
    filename: commands/analyze/logs.sh
    help: |-
      Moved to 'playground analyze logs' (kept as a hidden alias)
    flags: *analyze_logs_flags

  - name: gc-analyze
    private: true
    filename: commands/analyze/gc-logs.sh
    help: |-
      Moved to 'playground analyze gc-logs' (kept as a hidden alias)
    flags: *analyze_gc_logs_flags

  - name: tcp-dump
    help: |-
      🕵️‍♂️ Take a tcp dump (sniffing network)

      Captures the traffic in or out of a container for --duration seconds and
      brings the capture file back, ready to open in Wireshark. Narrow it with
      --port when you know which one you care about.

      ❕ On an encrypted listener you will see the handshake and the failures,
         but not the records themselves.
    flags:
      - *container
      - long: --port
        arg: port
        validate: integer
        required: false
        completions:
          dynamic:
          - playground get-docker-ports
        help: |-
          Port on which tcp dump should be done, if not set sniffing is done on every port
      - long: --duration
        arg: duration
        validate: integer
        required: false
        default: "30"
        help: |-
          Duration of the dump (default is 30 seconds).
    examples:
    - playground debug tcp-dump --container control-center --port 9021 --duration 60

  - name: block-traffic
    help: |-
      🚫 Blocking traffic using iptables

      Cuts the route from a container to a destination, so you can see how the
      system behaves during a network outage: a broker that loses the
      controller, a connector that can no longer reach its database, a client
      that cannot resolve the schema registry.

      Blocking with --action start and restoring with --action stop, so the
      failure is reversible without restarting anything.
    flags:
      - *container
      - long: --destination
        arg: destination
        required: true
        help: |-
          Destination: it could be an ip address, a container name or a hostname
      - long: --port
        arg: port
        validate: integer
        required: false
        completions:
          dynamic:
          - playground get-docker-ports
        help: |-
          Port on which tcp traffic should be blocked
      - &action_start_stop
        long: --action
        allowed: [start, stop]
        arg: action
        required: true
        help: |-
          🟢 start or stop
    examples:
    - playground debug block-traffic --destination google.com --action start
    - playground debug block-traffic --container broker --destination zookeeper --action start
    - playground debug block-traffic -c broker -c connect --destination zookeeper --action start
    - playground debug block-traffic --container schema-registry --destination broker --port 9092 --action start
    - playground debug block-traffic -c connect -c ksqldb-server --destination schema-registry --action stop

  - name: degrade-traffic
    help: |-
      🐌 Add latency, packet loss, corruption or a bandwidth limit using tc

      Some issues only happen on a slow or unreliable network: request
      timeouts, retries, rebalances, producer or consumer errors. This makes
      the traffic from a container slow or lossy, to a destination (and
      port) or to everything, and --action stop puts it back to normal
      without restarting anything.

      Several effects can be combined in one call, e.g. --latency 100ms
      --loss 1%. A new --action start replaces what was applied before on
      the container. --action status shows what is applied and the measured
      round trip to the destination.

      tc runs from the nicolaka/netshoot image in the network namespace of
      the container (an ephemeral container of the pod with cfk): nothing is
      installed in the container, so it works with any image.

      ❕ tc only shapes the packets a container sends: with --latency 100ms
      the round trip to the destination grows by 100ms. A container restart
      removes the degradation.
    flags:
      - *container
      - long: --destination
        arg: destination
        required: false
        completions:
          dynamic:
          - playground get-container-list
        help: |-
          🎯 Destination: an ip address, a container name or a hostname (default: all the traffic of the container)
      - long: --port
        arg: port
        validate: integer
        required: false
        completions:
          dynamic:
          - playground get-docker-ports
        help: |-
          🚪 Only the tcp traffic to this port of the destination
      - long: --latency
        arg: latency
        required: false
        help: |-
          ⏱️ Added latency, e.g. 100ms, 1s
      - long: --jitter
        arg: jitter
        required: false
        help: |-
          〰️ Random variation of the latency, e.g. 20ms (needs --latency)
      - long: --loss
        arg: loss
        required: false
        help: |-
          🕳️ Percentage of packets dropped, e.g. 1%
      - long: --corruption
        arg: corruption
        required: false
        help: |-
          🧨 Percentage of packets corrupted, e.g. 1%
      - long: --duplicate
        arg: duplicate
        required: false
        help: |-
          👯 Percentage of packets duplicated, e.g. 1%
      - long: --rate
        arg: rate
        required: false
        help: |-
          🚰 Bandwidth limit, e.g. 1mbit, 500kbit
      - long: --action
        allowed: [start, stop, status]
        arg: action
        required: true
        help: |-
          🟢 start, stop or status
    examples:
    - playground debug degrade-traffic --container connect --destination broker --latency 100ms --action start
    - playground debug degrade-traffic -c connect --destination broker --latency 100ms --jitter 20ms --loss 1% --action start
    - playground debug degrade-traffic -c connect -c ksqldb-server --destination broker --port 9092 --loss 5% --action start
    - playground debug degrade-traffic -c connect --rate 1mbit --action start
    - playground debug degrade-traffic -c connect --destination broker --action status
    - playground debug degrade-traffic -c connect -c ksqldb-server --action stop

  - name: java-debug
    help: |-
      🤎 JVM arguments for SSL, Kerberos or Class Loading

      Turns on the JVM's own diagnostic traces in a container and restarts it.
      This is how you find out why a TLS handshake fails, why a Kerberos
      login is refused, or which jar a class was loaded from when two
      versions collide.

      ❗ These traces are extremely verbose. Turn them back off with
         --action disable once you have what you need.
    flags:
      - *container
      - long: --type
        arg: type
        allowed: [ssl_all, ssl_handshake, class_loading, kerberos]
        required: true
        help: |-
          - ssl_all: Enable all SSL debugging, i.e -Djavax.net.debug=all
          - ssl_handshake: Enable SSL handshake debugging, i.e -Djavax.net.debug=ssl:handshake
          - class_loading: Enable class loading debugging, i.e -verbose:class
          - kerberos: Enable Kerberos debugging, i.e -Dsun.security.krb5.debug=true
      - &action_enable_disable
        long: --action
        allowed: [enable, disable]
        arg: action
        required: false
        default: "enable"
        help: |-
          🟢 enable or disable
    examples:
    - playground debug java-debug --type class_loading
    - playground debug java-debug --container broker --action start

  - name: jscissors
    help: |-
      ✂️ jscissors is an instrumentation framework and can help to analyse control flow and perform some specific logging

      * Control Flow Tracing: By dynamically instrumenting Java code, the tool meticulously tracks the precise sequence of executed methods at runtime. This capability offers invaluable insights into how an application navigates its logic. The tool provides a way to generate a stack trace when a method is called. 
      * Additional Logging: This enhanced logging capability provides a way to print the input arguments to a method and return value from a method. 
      * Delve into heap area: Generating heap dump at a method call will be crucial to analyze the state of JVM at a given point. The tool has capabilities to generate thread dump as well to track the state of all the threads when a method is called. 

    flags:
      - *container
      - long: --operation
        arg: operation
        help: |-
          🥼 operation to perform:

          * VALUES: print method input arguments
          * RETURN_VALUE: print method return value
          * THREADS: print thread dump when method is called
          * HEAP: print heap dump when method is called
          * STACK: print stack trace when method is called
          * EXCEPTION_HEAP: print heap dump when an exception is thrown during method execution
          * DELAY: print time taken for method execution

          Default values: VALUES, RETURN_VALUE, DELAY and STACK

          🎓 Tip: you can pass multiple operations by specifying --operation multiple times
        required: false
        repeatable: true
        unique: true
        allowed: 
          - VALUES
          - RETURN_VALUE
          - THREADS
          - HEAP
          - STACK
          - EXCEPTION_HEAP
          - DELAY
        default:
          - VALUES
          - RETURN_VALUE
          - DELAY
          - STACK
      - long: --class
        arg: class
        required: true
        help: |-
          class name to instrument (it supports regex like oracle.jdbc.*)
      - long: --method
        arg: method
        required: false
        repeatable: true
        default: ".*"
        help: |-
          method name to instrument (it supports regex like .*find.*)

          🎓 Tip: you can pass multiple methods by specifying --method multiple times
      - *action_enable_disable
    examples:
    - playground debug jscissors
    - playground debug jscissors --container broker


  - name: flight-recorder
    help: |-
      🛩️ Record a JVM with Java Flight Recorder, from --action start to --action stop

      For a window of any length, in a script or by hand: start, reproduce the problem, stop. --action stop copies the
      .jfr to --output-dir and analyzes it with playground analyze flight-recorder (where the time of the connector tasks
      goes: states, CPU by layer, hot methods, allocation, locks, GC, findings), unless --no-analyze. Open it with JDK
      Mission Control (https://jdk.java.net/jmc/) for the details. To record for a fixed time and analyze in one
      command: playground analyze flight-recorder -c <container> --duration 2m.

      🔌 The recording is driven over JMX (FlightRecorderMXBean) when the container has a JMX port (KAFKA_JMX_PORT, SCHEMA_REGISTRY_JMX_PORT...), as in the
      playground environments: the cp images ship a JRE without jcmd, and nothing is installed or restarted. Otherwise
      (cfk pods), jcmd is used when the image has it.

      ⚙️ --settings playground (default) records what the analysis needs with a low overhead
      (tools/jfr-analyzer/playground.jfc); profile and default are the settings of the JDK; all records every event
      with no threshold (scripts/cli/all.jfc), for a deep dive in JDK Mission Control, with a high overhead.

      🔖 The recording of each container is kept in playground.ini (flight_recorder.<container>), --action status shows it.
    flags:
      - *container
      - long: --action
        allowed: [start, stop, status]
        arg: action
        required: true
        help: |-
          🟢 start, stop (copy the recording and analyze it) or status
      - long: --settings
        allowed: [playground, profile, default, all]
        arg: settings
        required: false
        default: "playground"
        help: |-
          ⚙️ Settings of the recording, used by --action start (default: playground)

            playground   what playground analyze flight-recorder needs, low overhead (tools/jfr-analyzer/playground.jfc)
            profile      settings of the JDK for profiling, about 2% overhead
            default      settings of the JDK for continuous recording, about 1% overhead
            all          every event, no threshold (scripts/cli/all.jfc): high overhead, for JDK Mission Control
      - long: --output-dir
        short: -o
        arg: output_dir
        required: false
        default: "."
        help: |-
          📂 Folder for the .jfr and the HTML report of the analysis, used by --action stop (default: current folder)
      - long: --no-analyze
        required: false
        help: |-
          🙈 With --action stop, only copy the recording, do not analyze it
    examples:
    - playground debug flight-recorder --action start
    - playground debug flight-recorder --action stop
    - playground debug flight-recorder --action status
    - playground debug flight-recorder -c connect -c connect2 --action start --settings profile
    - playground debug flight-recorder --action stop --output-dir /tmp/jfr --no-analyze

  - name: log-level
    help: |-
      🧬 Set log level for any package

      Changes the level of any logger on the running connect worker, straight
      away and without a restart, so you do not have to edit log4j properties
      and rebuild the container.

      🎓 Tip: raise only the package you suspect, for instance
      io.confluent.connect.s3 or org.apache.kafka.clients.consumer, rather
      than the root logger, or the useful lines will be lost in the noise.
    filters:
    - connect_running
    commands:
    - name: get
      help: |-
        Get log levels

        With no --package, every logger with an explicit level is listed.
      flags:
      - &package
        long: --package
        short: -p
        required: false
        validate: not_empty
        arg: package
        help: |-
          Package name

    - name: set
      help: |-
        Set log level for specific logger

        Takes effect immediately and applies to the logger and everything
        below it in the package hierarchy.
      flags:
      - long: --package
        short: -p
        required: true
        validate: not_empty
        arg: package
        help: |-
          📦 Package name

      - &level
        long: --level
        short: -l
        arg: level
        allowed: [INFO, WARN, DEBUG, TRACE]
        required: true
        help: |-
          ❕Log level

    examples:
    - playground debug log-level get
    - playground debug log-level get -p io.confluent.connect.oracle.cdc
    - playground debug log-level get --package io.confluent.connect.oracle.cdc
    - playground debug log-level set -p io.confluent.connect.oracle.cdc.logging.LogUtils -l TRACE

  - name: cfk
    expose: always
    group: Debug
    help: |-
      🧱 CFK debug sub-commands
    commands:
      - name: cfk-bundle-analyze
        private: true
        filename: commands/analyze/cfk-bundle.sh
        help: |-
          Moved to 'playground analyze cfk-bundle' (kept as a hidden alias)
        flags: *analyze_cfk_bundle_flags

      - name: generate-bundle
        help: |-
          ⛑️ Generate a Support bundle

          see https://docs.confluent.io/operator/current/co-troubleshooting.html#support-bundle
        filters:
        - cfk_environment
        dependencies:
          kubectl: visit https://kubernetes.io/docs/tasks/tools/ to install
        flags:
        - long: --follow-logs-duration
          arg: follow-logs-duration
          validate: integer
          required: false
          default: "0"
          help: |-
            Max duration to follow logs
        examples:
        - playground debug cfk generate-bundle

- name: get-jmx-metrics
  group: Kafka
  help: |-
    🔢 Get JMX metrics from a container
    
    👉 Check documentation https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%94%a2-jmx-metrics
  dependencies:
    java: visit https://openjdk.org/install/ to install
  flags:
  - *container
  - long: --open
    short: -o
    help: |- 
      🔖 Save output to a file and open with text editor set with playground config editor <editor> (default is code)

  - long: --domain
    short: -d
    required: false
    arg: domain
    help: |-
      Domain name

  examples:
  - playground get-jmx-metrics --container connect
  - playground get-jmx-metrics --container connect --domain "kafka.connect kafka.consumer kafka.producer"
  - playground get-jmx-metrics -c broker
  - playground get-jmx-metrics -c connect -c broker
  - playground get-jmx-metrics --container schema-registry --container ksqldb-server --open
  - playground get-jmx-metrics -c broker -c connect --domain "kafka.server"
  x_example_outputs:
  - command: 'playground get-jmx-metrics -c connect --domain "kafka.connect"'
    output: |-
      17:24:01 ℹ️ 🪄 Copying files with docker cp
      ####### domain kafka.connect ########
      Welcome to JMX terminal. Type "help" for available commands.
      #mbean = kafka.connect:client-id="connect:8083",type=app-info:
      start-time-ms = 1791901690493;

      commit-id = 328ff4d5ac3448d6;

      version = 8.3.2-ce;

      #mbean = kafka.connect:client-id=connect-adminclient-producer,node-id=node--1,type=connect-node-metrics:
      request-rate = 0.0;

      response-rate = 0.0;
      ...

- name: container
  expose: always
  alias: pod
  group: Container
  help: |-
    🐳 Container commands

    Work on the containers of the running example without having to remember
    their names, their users or their file layout. The same commands work
    against Kubernetes pods when the example runs on the cfk environment,
    which is why 'pod' is an accepted alias.

    🔍 Look inside
      logs                 tail logs, grep them, or block until a line appears
      display-error-all    every ERROR and FATAL across all containers
      get-properties       the properties file a component actually loaded
      get-ip-addresses     addresses on the docker network
      exec / ssh           run a command, or get a shell

    🔁 Act on them
      restart / kill / pause / resume
      recreate             re-create with the same compose definition
      update               edit the compose or Kubernetes definition, apply it
      set-environment-variables   add settings, then recreate
      cp                   copy files in and out
      change-jdk           swap the JDK, to reproduce a JVM-specific issue
      kill-all             kill everything and prune volumes

    Most commands accept --container several times to act on a few containers
    at once.

    🎓 Tip: the usual names are broker, connect, schema-registry,
    control-center, ksqldb-server, plus whatever the example adds.
  commands:

    - name: get-properties
      help: |-
        📝 Get properties file from a container
        
        👉 Check documentation https://kafka-docker-playground.io/#/how-to-use?id=%f0%9f%93%9d-see-properties-file

      flags:
      - *container
      examples:
      - playground container get-properties
      - playground container get-properties --container broker
      - playground container get-properties -c broker
      x_example_outputs:
      - command: playground container get-properties -c connect
        output: |-
          17:22:51 ℹ️ 📝 Displaying properties file for connect
          bootstrap.servers=broker:9092
          config.storage.topic=connect-configs
          group.id=connect-cluster
          key.converter=org.apache.kafka.connect.storage.StringConverter
          offset.storage.topic=connect-offsets
          plugin.path=/usr/share/filestream-connectors
          rest.port=8083
          status.storage.topic=connect-status
          value.converter=io.confluent.connect.avro.AvroConverter
          value.converter.schema.registry.url=http://schema-registry:8081
          ...

    - name: recreate
      group: Container
      help: |-
        💫 Recreate container(s)

        👉 Check documentation https://kafka-docker-playground.io/#/how-to-use?id=%e2%99%bb%ef%b8%8f-re-create-containers

        Replays the docker compose command of the example, so a container is
        rebuilt from its current definition. This is what applies a change
        made with 'playground container set-environment-variables' or
        'playground container update', and what you use to restart a component
        from scratch without re-running the whole example.
      flags:
      - long: --ignore-current-versions
        required: false
        help: |-
          Ignore current confluent platform version

          By default, the current version is used

    - name: update
      group: Container
      help: |-
        ✍️ Edit and apply runtime container/pod definition

        Opens the current docker-compose (non-CFK) or Kubernetes resource YAML (CFK)
        for the target container/pod in your configured editor and applies changes
        when you save and close the file.
      flags:
      - *container
      alias:
      - edit
      - alter
      examples:
      - playground container update --container connect
      - playground container update -c splunk
      - playground container update --container connect --container broker

    - name: get-ip-addresses
      group: Container
      help: |-
        🖥️  Get ip address of running containers

        The address each container has on the docker network, which is what
        you need when a component must be reached by IP rather than by name,
        or when you are checking what a client actually connected to.
      examples:
      - playground container get-ip-addresses
      x_example_outputs:
      - command: playground container get-ip-addresses
        output: |-
          17:22:19 ℹ️ Get IP address of running containers
          /controller - 10.89.0.2
          /broker - 10.89.0.4
          /schema-registry - 10.89.0.6
          /connect - 10.89.0.7

    - name: kill-all
      group: Container
      help: |-
        💀 Kill all containers and prune all volumes

        Kills every container on your machine, playground or not, and prunes
        the volumes. Used automatically before each 'playground run' to
        guarantee a clean slate; disable that with
        'playground config container-kill-all-before-run false'.

    - name: logs
      group: Container
      help: |-
        🕵️  Tail and follow container logs

        Three ways to use it:

          --grep "ERROR"                    keep only the lines that matter
          --open                            read the whole log in your editor
          --wait-for-log "Started" -m 120   block until the line shows up

        The last one is what example scripts use to synchronise on a component
        being ready, instead of sleeping and hoping.
      flags:
      - *container
      - long: --open
        short: -o
        help: |- 
          🔖 Save output to a file and open with text editor set with playground config editor <editor> (default is code)
        conflicts: [--wait-for-log, --grep, --errors]
      - long: --wait-for-log
        short: -w
        arg: log
        validate: not_empty
        help: |- 
          😴 Wait until log appears
        conflicts: [--open, --grep, --errors]
      - &logsmaxwait
        long: --max-wait
        short: -m
        arg: max_wait
        validate: integer
        default: "600"
        help: |- 
          ⏳ Max time in seconds to wait when using --wait-for-log (default 600s)
        conflicts: [--open, --grep]
      - long: --grep
        arg: grep
        required: false
        default: ""
        help: |-
          🎯 Grep pattern to filter logs

        conflicts: [--open, --wait-for-log, --errors]

      - long: --previous
        required: false
        help: |-
          🕰️ Show logs from the previous pod instance (only relevant when --environment=cfk is used)

      - long: --since
        arg: since
        required: false
        validate: not_empty
        help: |-
          🕐 Only show logs newer than a relative duration (10m, 1h) or a timestamp (2026-09-24T16:00:00)
        conflicts: [--open, --wait-for-log]

      - long: --tail
        arg: lines
        required: false
        help: |-
          🔢 Number of lines to show from the end of the logs, or "all"

          Default is 200, or all when --since, --errors, or --grep with --no-follow is used
        conflicts: [--open, --wait-for-log]

      - long: --no-follow
        required: false
        help: |-
          🛑 Print the logs and exit instead of following them

          🎓 Tip: use it in scripts and from AI agents, which otherwise never get the command back
        conflicts: [--open, --wait-for-log]

      - long: --errors
        required: false
        help: |-
          🔥 Only show a digest of ERROR/FATAL records, then exit

          Repeated records are de-duplicated with an occurrence count, stack
          traces are collapsed to the exception chain ("Caused by:") plus a few
          frames of the deepest cause. Only records with an explicit level are
          reported (" ERROR ", "[ERROR]", level=error, "level":"error"), plus
          uncaught java exceptions: records logged at INFO/DEBUG/TRACE, and
          level-less lines that merely contain "error" or "failed", never are.

          Scans the whole log unless --since or --tail narrow it.
        conflicts: [--open, --wait-for-log, --grep]

      - long: --include-warnings
        required: false
        help: |-
          🟠 With --errors, also report WARN records
        needs: [--errors]

      - long: --max-findings
        arg: max_findings
        required: false
        validate: integer
        default: "40"
        help: |-
          ✂️ With --errors, maximum number of distinct records to show (default 40)
      examples:
      - playground container logs --container connect
      - playground container logs -c connect --errors
      - playground container logs -c connect --errors --since 10m --include-warnings
      - playground container logs -c connect --grep "Caused by" --no-follow
      - playground container logs -c connect --no-follow --tail 500
      - playground container logs -c connect --open
      - playground container logs -c connect --wait-for-log "StackOverflowError"
      - playground container logs -c connect -c broker
      - playground container logs --container schema-registry --container ksqldb-server --open
      - playground container logs -c broker -c connect -c schema-registry
      - playground container logs -c connect -c broker --wait-for-log "ERROR" --max-wait 120
      - playground container logs --container connect --grep "ERROR"
      - playground pod logs --previous
      x_example_outputs:
      - command: playground container logs -c connect --errors
        output: |-
          17:22:10 ℹ️ 🔥 ERROR/FATAL digest for connect logs
          ✅ no ERROR/FATAL record found in 12523 lines
      - command: playground container logs -c connect --errors --include-warnings --max-findings 2
        output: |-
          17:22:50 ℹ️ 🔥 ERROR/FATAL digest for connect logs
          🔎 7 distinct record(s), 13 occurrence(s), in 12743 lines

          🟠 WARN x7 (first seen line 108, last seen line 471)
          [2026-10-13 14:27:56,953] WARN [AdminClient clientId=adminclient-1] Connection to node -1 (broker/10.89.0.4:9092) could not be established. Node may not be available. (org.apache.kafka.clients.NetworkClient:899)

          🟠 WARN x1 (first seen line 737, last seen line 737)
          WARNING: A terminally deprecated method in sun.misc.Unsafe has been called

          ✂️ 5 more distinct record(s) not shown, increase --max-findings or narrow with --since
      footer: |-
        Example output:
          $ playground container logs -c connect --errors
          17:22:10 ℹ️ 🔥 ERROR/FATAL digest for connect logs
          ✅ no ERROR/FATAL record found in 12523 lines

    - name: display-error-all
      group: Container
      help: |-
        🔥 Display all ERROR/FATAL logs in all containers/pods. Useful for quick troubleshooting

        The first command to run when an example misbehaves and you do not yet
        know which component is at fault. It sweeps every container at once,
        so you do not have to guess where to look.

        Each container gets the same digest as 'playground container logs
        --errors': repeated records are de-duplicated with an occurrence count
        and stack traces are collapsed to their "Caused by:" chain. Containers
        without any finding are only listed in a final one-line summary. The
        last lines of connect are always shown raw, for failures that log no
        error.
      flags:
      - long: --since
        arg: since
        required: false
        validate: not_empty
        help: |-
          🕐 Only scan logs newer than a relative duration (10m, 1h) or a timestamp (2026-09-24T16:00:00)

      - long: --include-warnings
        required: false
        help: |-
          🟠 Also report WARN records

      - long: --max-findings
        arg: max_findings
        required: false
        validate: integer
        default: "15"
        help: |-
          ✂️ Maximum number of distinct records to show per container (default 15)
      examples:
      - playground container display-error-all
      - playground container display-error-all --since 10m --include-warnings

    - name: ssh
      group: Container
      help: |-
        🛬 SSH into container

        Interactive shell inside the container, as the user the component runs
        with. Use 'playground container exec' instead when you want to run a
        single command from a script.

      flags:
      - *container

      - long: --shell
        short: -s
        required: false
        default: "bash"
        arg: shell
        allowed: 
          - bash
          - sh
          - ksh
          - zsh
        help: |-
          💾 Shell to use (default is bash)

      examples:
      - playground container ssh -c connect
      - playground container ssh -c connect -s sh
      - playground container ssh --container connect --shell sh
      - playground container ssh -c broker
      - playground container ssh --container schema-registry --shell zsh

    - name: change-jdk
      group: Container
      help: |-
        🤎 Change java JDK version using Azul JDK (https://www.azul.com/downloads/#downloads-table-zulu)

        PS: It works for UBI8 docker images only

      flags:
      - *container

      - long: --version
        required: true
        arg: version
        allowed: 
          - "8"
          - "11"
          - "17"
          - "21"
          - "22"
          - "25"
        help: |-
          🤎 JDK version to use

      examples:
      - playground container change-jdk --container connect --version 17

    - name: exec
      group: Container
      help: |-
        🪄 Execute command in a container

        Runs one command and returns, which makes it the form to use inside
        example scripts. Add --root when the component user is not allowed to
        do what you are asking, typically to install a package or read a file
        under /etc.

      flags:
      - *container

      - long: --command
        required: true
        validate: not_empty
        arg: command
        help: |-
          📲 Command to execute

      - long: --root
        help: |-
          👑 Run command as root

      - long: --shell
        default: "bash"
        arg: shell
        allowed: 
          - bash
          - sh
          - ksh
          - zsh
        help: |-
          💾 Shell to use (default is bash)

      examples:
      - playground container exec -c connect --command "date"
      - playground container exec -c connect --command "whoami" --root
      - playground container exec --container connect --command "whoami" --shell sh
      - playground container exec -c broker -c connect --command "ps aux"
      - playground container exec --container schema-registry --container ksqldb-server --command "free -h"
      - playground container exec -c connect -c broker --command "netstat -tuln" --root

    - name: cp
      group: Container
      help: |-
        🪄 Copy files between local filesystem and container

        Works in both directions, using the container:path notation. Typically
        used to drop a jar, a certificate or a test file into a component, or
        to pull out a file the connector has written.

      flags:
      - long: --source
        required: true
        validate: not_empty
        arg: source
        help: |-
          📥 Source path (local path or container:path)

      - long: --destination
        required: true
        validate: not_empty
        arg: destination
        help: |-
          📤 Destination path (local path or container:path)

      examples:
      - playground container cp --source ./file.txt --destination connect:/tmp/file.txt
      - playground container cp --source connect:/tmp/file.txt --destination ./file.txt

    - name: restart
      group: Container
      help: |-
        🔁 Restart a container

        Stops and starts the container, keeping its definition and its data.
        Use 'playground container recreate' instead if you changed the compose
        definition or an environment variable.

      flags:
      - *container

    - name: pause
      group: Container
      help: |-
        ⏸️  Pause a container

        Freezes the processes without stopping the container: it keeps its
        connections but stops responding. A good way to simulate a hung
        broker, an unresponsive database or a GC pause, and to see how the
        rest of the system reacts.

      flags:
      - *container

    - name: resume
      alias: unpause
      group: Container
      help: |-
        ⏯️  Resume a container

        Unfreezes a container paused with 'playground container pause'.

      flags:
      - *container

    - name: kill
      group: Container
      help: |-
        🔫 Kill a container

        Stops the container abruptly, without letting it shut down cleanly,
        which is how you simulate a crash. Bring it back with
        'playground container recreate'.

      flags:
      - *container
      examples:
      - playground container kill --container connect
      - playground container kill -c broker
      - playground container kill -c connect -c broker
      - playground container kill --container schema-registry --container ksqldb-server --container control-center

    - name: set-environment-variables
      group: Container
      help: |-
        📦  Set environment variable(s) for a container

        🎓 Tip: you can pass multiple environment variables by specifying --env multiple times

        Example: --env "KAFKA_OPTS: -verbose:class" --env "CONNECT_LOG4J_LOGGERS: org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR,org.apache.kafka.connect.runtime.rest.RestServer=ERROR"

      flags:
      - *container
      - long: --env
        required: false
        repeatable: true
        conflicts:
          - --restore-original-values
        arg: env
        help: |-
          📦 Environment variables to set

          🎓 Tip: you can pass multiple environment variables by specifying --env multiple times
      - long: --restore-original-values
        conflicts:
          - --env
        required: false
        help: |-
          🧽 Restore back original values before any changes was made
      - long: --mount-jscissors-files
        required: false
        private: true
        help: |-
          Mount jscissors files for debugging

    - name: wait-for-connect-rest-api-ready
      group: Container
      private: true
      help: |-
        🚏 wait-for-connect-rest-api-ready
      flags:
        - long: --max-wait
          arg: max_wait
          validate: integer
          default: "300"
          help: |- 
            ⏳ Max time in seconds to wait

- name: topic
  expose: always
  group: Topic
  filters:
  - not_mdc_environment
  help: |-
    🗳 Topic commands

    Produce, consume and manage topics without dealing with the kafka-* shell
    scripts: the bootstrap server, the security properties and the schema
    registry url are all derived from the running environment, so the same
    command works on plaintext, on sasl-ssl and on Confluent Cloud.

    📤 Get data in
      produce         generate records from a schema, or from your own data
      create          create a topic with the partitions you need

    📥 Get data out
      consume         read from the beginning, deserialising automatically
      get-number-records   count what is in the topic
      wait-for-records     wait until the topic contains N records
      get-offsets          earliest and latest offsets per partition
      display-consumer-offsets   read the internal offsets topic

    🔧 Manage
      list / describe / alter / delete
      dlq inspect / replay   dead letter queue grouped by error, and replay
      set-schema-compatibility   compatibility of the topic subjects
      tag             stream catalog tags (Confluent Cloud only)

    Serialisation is handled for you: 'produce' registers the schema you give
    it and 'consume' works out from the payload whether it is avro, protobuf,
    json schema or plain text.

    🎓 Tip: in an example script, 'consume --min-expected-messages N' is the
    assertion that the data made it through; it fails the run if it did not.
  commands:

    - name: get-number-records
      group: Topic
      help: |-
        💯 Get number of records in a topic

        Counts the records currently in the topic, from the partition offsets.
        The cheap way to check that a source connector produced something, or
        that a sink has data to read.
      flags:
      - &topic
        long: --topic
        short: -t
        required: false
        arg: topic
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Topic name
      - long: --isolation-level
        arg: isolation-level
        required: false
        private: true
        allowed: 
          - read_uncommitted
          - read_committed
        default: "read_uncommitted"
        help: |-
          🫥 The isolation level to use, see https://docs.confluent.io/platform/current/installation/configuration/consumer-configs.html#isolation-level
          If not set, default is read_uncommitted
      examples:
      - playground topic get-number-records --topic a-topic
      - playground topic get-number-records -t a-topic
      x_example_outputs:
      - command: playground topic get-number-records --topic filestream
        output: |-
          17:22:53 ℹ️ 💯 Get number of records in topic filestream
          5

    - name: wait-for-records
      group: Topic
      help: |-
        ⏳ Wait for a topic to contain a minimum number of records

        Counts the records in the topic every --interval seconds (same count as
        'get-number-records') until there are at least
        --min-expected-messages, and fails after --max-wait seconds. A topic
        that does not exist yet counts as empty, so it can be used before a
        source connector has created its topic.

        🎓 Tip: in an example script, use it instead of a fixed sleep before
        checking what a source connector produced.
      flags:
      - long: --topic
        short: -t
        required: true
        arg: topic
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Topic name
      - long: --min-expected-messages
        arg: min_expected_messages
        validate: integer
        required: false
        default: "1"
        help: |-
          🔢 Minimum number of records to wait for (default is 1)
      - long: --max-wait
        arg: max_wait
        validate: integer
        default: "120"
        help: |-
          ⏳ Max time in seconds to wait (default is 120)
      - long: --interval
        arg: interval
        validate: integer
        default: "5"
        help: |-
          🔁 Interval in seconds between checks (default is 5)
      examples:
      - playground topic wait-for-records --topic filestream
      - playground topic wait-for-records --topic filestream --min-expected-messages 10 --max-wait 300
      x_example_outputs:
      - command: playground topic wait-for-records --topic filestream --min-expected-messages 5
        output: |-
          17:22:53 ℹ️ ⏳ Waiting up to 120 seconds for topic filestream to contain at least 5 records
          17:22:58 ℹ️ ✅ topic filestream contains 5 records (expected at least 5) after 5 seconds

    - name: get-offsets
      group: Topic
      help: |-
        📍 Get earliest and latest offsets per partition of a topic

        The low and high watermarks of every partition, and the number of
        records in between. Useful to see whether retention has already
        deleted data, which partitions received records, or which offsets a
        connector should be at.
      flags:
      - *topic
      - *verbose
      examples:
      - playground topic get-offsets --topic a-topic
      x_example_outputs:
      - command: playground topic get-offsets --topic filestream
        output: |-
          17:22:55 ℹ️ 📍 Earliest and latest offsets per partition of topic filestream
          PARTITION  EARLIEST        LATEST          RECORDS
          0          0               5               5
          TOTAL                                      5

    - name: display-consumer-offsets
      group: Topic
      help: |-
        📭 Display content of __consumer_offsets topic

        Decodes the internal topic where Kafka keeps committed offsets, so you
        can see exactly what each consumer group, including a sink connector,
        has committed and when.
      flags:
      - *verbose

    - name: list
      group: Topic
      help: |-
        🔘 List topics

        Add --show-internal to also see the topics Kafka and Connect maintain
        for themselves, such as the connect configs, offsets and status
        topics.

        Add --sort-by-size to show the size and number of partitions of each
        topic, largest first (same as 'playground topic get-size').
      flags:
      - long: --show-internal
        help: |-
          🫥 Display internal topics
        required: false
      - long: --sort-by-size
        help: |-
          📏 Display size and number of partitions of each topic, largest first
        required: false
      examples:
      - playground topic list
      - playground topic list --sort-by-size
      x_example_outputs:
      - command: playground topic list
        output: |-
          17:22:16 ℹ️ 🔘 List of topics (internal topics are excluded)
          filestream

    - name: get-size
      group: Topic
      help: |-
        📏 Get size of topics

        Shows the size and number of partitions of each topic, largest first,
        to find which topics take the most disk space. Without --topic, all
        topics are shown (add --show-internal to include internal topics).

        The size of a partition is the size of its largest replica, the size
        of a topic is the sum of its partitions.

        With ccloud environment, sizes come from the retained_bytes metric of
        the Metrics API, which lags a few minutes behind and requires
        CONFLUENT_CLOUD_API_KEY and CONFLUENT_CLOUD_API_SECRET (Cloud API key).
      flags:
      - *topic
      - long: --show-internal
        help: |-
          🫥 Include internal topics (when --topic is not set)
        required: false
      examples:
      - playground topic get-size
      - playground topic get-size --topic filestream
      - playground topic get-size --show-internal

    - name: describe
      group: Topic
      help: |-
        🔬 Describe topic

        Partitions, replicas, in-sync replicas and the configuration overrides
        set on the topic. Where to look when records go to an unexpected
        partition, or when a topic is not retaining what you expected.
      flags:
      - *topic
      - *verbose
      examples:
      - playground topic describe --topic filestream
      x_example_outputs:
      - command: playground topic describe --topic filestream
        output: |-
          17:22:51 ℹ️ 🔎 Describing topic filestream
          Topic: filestream  TopicId: ZTSM7bjsQxq2aigCM3C-8w  PartitionCount: 1  ReplicationFactor: 1  Configs: min.insync.replicas=1
              Topic: filestream  Partition: 0  Leader: 1  Replicas: 1  Isr: 1  Offline:   Elr:   LastKnownElr:

    - name: set-schema-compatibility
      filters:
      - schema_registry_running
      group: Topic
      help: |-
        🛡️ Change topic's schema compatibility

        Sets the compatibility level on the subjects of the topic, which is
        what you relax to let an otherwise rejected schema evolution through,
        for instance to reproduce a schema compatibility issue.
      flags:
      - *topic
      - *compatibility-required
      - *verbose

    - name: consume
      filters:
      - schema_registry_running
      group: Topic
      help: |-
        📥 Consume topic from beginning

        Reads from the earliest offset and deserialises records on its own:
        the subjects <topic>-key and <topic>-value of Schema Registry decide
        between the avro, protobuf, json schema and plain console consumers
        (use --key-subject / --value-subject for other subject names).

        🎓 Tip: --min-expected-messages turns it into an assertion. It waits
        up to --timeout for that many records, consumes them and fails if
        fewer could be consumed (records that cannot be deserialized do not
        count), which is how examples verify that data actually flowed.

        The consumer stops when no record arrives for 10 seconds (30 seconds
        on Confluent Cloud), so it never waits for records that cannot come
        (transaction markers and compacted records use offsets).
      flags:
      - *verbose
      - *topic
      - long: --max-messages
        arg: max-messages
        validate: integer
        required: false
        default: "100"
        help: |-
          Max number of messages to display (default is 100)

          You can use -1 to display all messages
          
      - long: --min-expected-messages
        arg: min-expected-messages
        validate: integer
        required: false
        default: "0"
        help: |-
          Minimum expected number of records to be consumed from the topic, returns an error if this is not the case

          Records that cannot be deserialized are reported and do not count.

          Note: --topic should be specified in this case.
      - long: --grep
        arg: grep
        required: false
        default: ""
        help: |-
          Verify that topic content contains record which contains specified string

          It is searched in the records as displayed (decoded when base64 encoded), and the command fails when no record contains it.
      - long: --timeout
        arg: timeout
        validate: integer
        required: false
        default: "60"
        help: |-
          Max number of seconds to wait when --min-expected-messages is used.

          Default is 60 seconds
      - long: --tail
        required: false
        help: |-
          Tail on logs.
        conflicts: [--min-expected-messages, --max-messages, --open]

      - long: --key-subject
        required: false
        arg: key-subject
        completions:
          dynamic:
          - playground get-subject-list
        help: |-
          📛 Subject for key in schema-registry to use (useful when data was produced with --key-subject-name-strategy other than TopicNameStrategy)
          
          Note: --topic should be specified in this case.

      - long: --value-subject
        required: false
        arg: value-subject
        completions:
          dynamic:
          - playground get-subject-list
        help: |-
          📛 Subject for value in schema-registry to use (useful when data was produced with --value-subject-name-strategy other than TopicNameStrategy)
          
          Note: --topic should be specified in this case.

      - long: --max-characters
        arg: max-characters
        validate: integer
        required: false
        default: "3000"
        help: |-
          Max characters per message to display (default is 3000, 0 for no limit)

      - long: --open
        short: -o
        help: |- 
          🔖 Save full dump of topic to a file and open with text editor set with playground config editor <editor> (default is code)
        conflicts: [--max-characters, --tail, --min-expected-messages]

      - long: --isolation-level
        arg: isolation-level
        required: false
        allowed: 
          - read_uncommitted
          - read_committed
        default: "read_uncommitted"
        help: |-
          🫥 The isolation level to use, see https://docs.confluent.io/platform/current/installation/configuration/consumer-configs.html#isolation-level
          If not set, default is read_uncommitted

      - long: --last
        arg: last
        validate: integer
        required: false
        help: |-
          ⏮️ Display the last N records of the topic (the most recent ones, sorted by timestamp across partitions),
          instead of the first --max-messages

          Example: --last 10
        conflicts: [--tail, --from-timestamp, --offset, --min-expected-messages, --open, --count]

      - long: --from-timestamp
        arg: from-timestamp
        required: false
        help: |-
          ⏱️ Display the records from this time (sorted by timestamp across partitions, --max-messages still applies)

          Accepted values:

          * a date, in local time: "2026-10-22 10:30", "2026-10-22T10:30:00.250" (add Z for UTC: "2026-10-22T08:30:00Z")
          * an epoch, in milliseconds or seconds: 1792660170522
          * a duration ago: 30s, 10m, 2h, 1d
        conflicts: [--tail, --last, --offset, --open]

      - long: --partition
        arg: partition
        validate: integer
        required: false
        help: |-
          🧩 Only consume this partition (with --offset, from that offset; otherwise from the beginning, or new records with --tail)
        conflicts: [--open]

      - long: --offset
        arg: offset
        required: false
        needs: [--partition]
        help: |-
          📍 Offset of --partition to start from: a number, earliest or latest

          Example: --partition 0 --offset 1234 --max-messages 1, the record a connector is stuck on
        conflicts: [--tail, --last, --from-timestamp, --open]

      - long: --json
        required: false
        help: |-
          🧾 Print each record as a json object on one line (topic, partition, offset, timestamp, date, headers, key,
          value, schema ids): key and value are embedded as json when they are valid json, as strings otherwise.

          Only the records go to stdout, everything else goes to stderr, so the output can be piped to jq.

          Example: playground topic consume --topic orders --json | jq -r '.value.id'
        conflicts: [--open, --count, --tail]

      - long: --count
        required: false
        help: |-
          🔢 Only print the number of records consumed (with --grep, the number of records containing that string),
          on stdout: logs go to stderr. Without --topic, one "<topic> <number>" line per topic.

          Unlike playground topic get-number-records, records are counted, not offsets (transaction markers,
          compacted records and records that cannot be deserialized do not count)
        conflicts: [--tail, --open, --json]

      - long: --no-decode
        required: false
        help: |-
          🤖 Never decode the values, even when they look base64 encoded (by default, they are decoded when the first
          record is valid base64 of printable utf-8)

      - long: --print-schema
        required: false
        help: |-
          📜 Also print the key and value schemas registered for the topic
      examples:
      - playground topic consume --topic filestream --min-expected-messages 2 --timeout 30
      x_example_outputs:
      - command: playground topic consume --topic filestream --min-expected-messages 2 --timeout 30
        output: |-
          17:23:00 ℹ️ ✨ Display content of topic filestream, it contains 5 messages
          17:23:00 ℹ️ 🔮🙅 topic is not using any schema for key
          17:23:00 ℹ️ 🔮🙅 topic is not using any schema for value
          CreateTime:2026-10-13 16:28:16.239|Partition:0|Offset:0|Headers:NO_HEADERS|Key:null|Value:{"id":1,"name":"Asha_Fadel50","email":"Euna.Anderson37@example.com","city":"Duluth","company":"Jacobson - Crooks"}
          CreateTime:2026-10-13 16:28:16.243|Partition:0|Offset:1|Headers:NO_HEADERS|Key:null|Value:{"id":2,"name":"Clare50","email":"Pat4@example.net","city":"West Dinoboro","company":"Hodkiewicz, Effertz and Heidenreich"}
          ...
          
    - name: produce
      filters:
      - schema_registry_running
      group: Topic
      help: |-
         📤 Produce to a topic

         See video tutorial https://youtu.be/mbzHCewG_XE

         Generates records for you rather than making you write them. Give it
         a schema, in avro, json schema or protobuf, and it registers the
         schema and produces --nb-messages records of realistic random data.
         The topic is created if it does not exist.

         Three ways to say what to send:

           a schema on stdin           generated data matching that schema
           --value <predefined>        one of the bundled schemas
           --forced-value '{...}'      your exact payload, %g being the index

         🎓 Tip: pipe the schema with a quoted heredoc, << 'EOF', so that the
         %g placeholders survive the shell.
      flags:

      - long: --key
        arg: key
        required: false
        completions:
          dynamic:
          - playground get-predefined-schemas "$completion_current"
        help: |-
          🗝️ Key to use. If not set, no key is used.

          🔥 You can either:
          
          * Set your own schema (avro, json-schema, protobuf) within single quotes (see examples) 
          
          * You can also generate json data using json or sql format using syntax from https://github.com/MaterializeInc/datagen

          * You can also generate json data using syntax from https://github.com/vdesabou/avro-random-generator (same as datagen source connector)

          * Use completion to select predefined schemas (or use your own schema file) 🎓 Tip: use <tab> completion to trigger fzf completion

          * Directly set payload ("%g" can be used to generate a counter)

          In case of 'raw' data (i.e not using schema):

          If the key contain a number, it will be used as starting point and incremented for each record. 
          
          Example: key1 will start with key1, then key2, etc..
          Example: mykey-10-suffix will start with mykey-10-suffix then mykey-11-suffix, etc..

          "%g" can also be used to generate a counter

          Example: key%g will start with key1, then key2, etc..

          Otherwise, the key will be same for all records.

      - long: --value
        arg: value
        completions:
          dynamic:
          - playground get-predefined-schemas "$completion_current"
        default: "-"
        required: false
        help: |- 
          🔥 You can either:
          
          * Set your own schema (avro, json-schema, protobuf) with stdin (see example section). 
          
          * You can also generate json data using json or sql format using syntax from https://github.com/MaterializeInc/datagen

          * You can also generate json data using syntax from https://github.com/vdesabou/avro-random-generator (same as datagen source connector)

          * Use completion to select predefined schemas (or use your own schema file) 🎓 Tip: use <tab> completion to trigger fzf completion

          * Directly set payload ("%g" can be used to generate a counter)

      - long: --value-format
        arg: value-format
        required: false
        allowed:
          - avro
          - json-schema
          - protobuf
          - json
          - sql
          - datagen
          - raw
        help: |-
          🔮 Format of --value, instead of detecting it from its content

          Detection looks for keywords (proto3, "type": "object", "_meta", CREATE TABLE, arg.properties,
          "type": "record"), so a raw payload containing one of them is not sent as raw data:
          use --value-format raw in that case.

          Cannot be used with --derive-value-schema-as.

      - long: --key-format
        arg: key-format
        required: false
        allowed:
          - avro
          - json-schema
          - protobuf
          - json
          - sql
          - datagen
          - raw
        help: |-
          🔮 Format of --key, instead of detecting it from its content (see --value-format)

          Cannot be used with --derive-key-schema-as.

      - *verbose
      - long: --debug
        short: -d
        required: false
        private: true
        help: |-
          debug mode (internal)
      - long: --topic
        short: -t
        required: true
        arg: topic
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Topic name
      - long: --nb-messages
        arg: nb-messages
        validate: integer
        required: false
        default: "1"
        help: |-
          💯 Number of messages to produce (default is 1)
             
          🎓  - if > <value of --max-nb-messages-per-batch> (default 300000), messages will be sent in batches of <value of --max-nb-messages-per-batch> (default 300000) records
              - if you set it to -1, an infinite number of records will also be sent in batches
      - long: --max-nb-messages-per-batch
        arg: max-nb-messages-per-batch
        validate: integer
        required: false
        default: "300000"
        help: |-
          🔼 Max number of messages to send per batch when --nb-messages > --max-nb-messages-per-batch
             if --nb-messages is set to -1, this is the number of messages sent per batch
             default is 300000
      - long: --max-nb-messages-to-generate
        arg: max-nb-messages-to-generate
        validate: integer
        required: false
        help: |-
          🔨 Max number of different messages to generate.

             - when protobuf is used, default is 50 as protobuf generation is really slow
             - when json or sql datagen format is used, default is 1000
             - when --record-size is set, default is 100
             --when nb-messages is set to -1, default is 1000
             - otherwise default is 100000
      - long: --sleep-time-between-batch
        arg: sleep-time-between-batch
        validate: integer
        required: false
        default: "0"
        help: |-
          💤 Sleep time in seconds between batches
             default is 0
      - long: --throughput
        arg: throughput
        validate: integer
        required: false
        default: "0"
        help: |-
          🐢 Maximum number of records per second (default is 0, no limit)

          Useful with --nb-messages -1 to get a steady flow of records, for example:

          playground topic produce -t a-topic --nb-messages -1 --throughput 10 --value '{"id": %g}'
      - long: --nb-partitions
        arg: nb-partitions
        validate: integer
        required: false
        default: "1"
        help: |-
          🔢 Number of partitions for the topic. (default is 1)
          
          ❌ Important: if the topic exists with another number of partitions, it is re-created when it
          is empty, and the command fails when it is not.
      - long: --compression-codec
        arg: compression-codec
        required: false
        allowed: 
          - gzip
          - snappy
          - lz4
          - zstd
        help: |-
          🤐 The compression codec: either 'gzip', 'snappy', 'lz4', or 'zstd'
          If not set, there is no compression

      - &compatibility
        long: --compatibility
        arg: compatibility
        allowed: 
          - BACKWARD
          - BACKWARD_TRANSITIVE
          - FORWARD
          - FORWARD_TRANSITIVE
          - FULL
          - FULL_TRANSITIVE
          - NONE
        help: |-
          Schema Registry compatibility rule

      - &key-subject-name-strategy
        long: --key-subject-name-strategy
        arg: key-subject-name-strategy
        allowed: 
          - TopicNameStrategy
          - RecordNameStrategy
          - TopicRecordNameStrategy
        help: |-
          Key Subject Name Strategy

      - &value-subject-name-strategy
        long: --value-subject-name-strategy
        arg: value-subject-name-strategy
        allowed: 
          - TopicNameStrategy
          - RecordNameStrategy
          - TopicRecordNameStrategy
        help: |-
          Value Subject Name Strategy

      - long: --headers
        arg: headers
        required: false
        help: |-
          🚏 Headers to use for all records. If not set, no header is used.

          Example: --headers "header1:value1,header2:value2"

          Header keys and values cannot contain "," or ":" (they are the separators).

          Note: CP 7.2+ is required.
      - long: --forced-key
        arg: forced-key
        required: false
        help: |-
          ☢️ Key to use for all records. 
          
          🎓 Tip: use --generate-only first with avro, json-schema or protobuf to get skeleton of messages and then use --forced-key to send the message you need. 
      - long: --forced-value
        arg: forced-value
        required: false
        help: |-
          ☢️ Value to use for all records. 
          
          🎓 Tip: use --generate-only first with avro, json-schema or protobuf to get skeleton of messages and then use --forced-value to send the message you need. 
      - long: --generate-only
        required: false
        help: |-
          🚪 Only generate messages without sending to kafka topic.

          Used with --forced-value, this is a powerful way to send specific messages.
      - long: --tombstone
        required: false
        help: |-
          ⚰️ Generate tombstone (record with null value). 
          
          Setting --key is recommended when this flag is used. 
          If not set, the key will also be null, hence generating a null record (both key and value being null)

          Note: CP 7.2+ is required.
      - long: --schema-id-in-header
        required: false
        help: |-
          🎯 Include schema ID in kafka header. 
          
          Uses HeaderSchemaIdSerializer for schema.id.seserializer

          Note: CP 8.1.1+ is required.
      - long: --validate
        required: false
        help: |-
          ☑️ Validate schema according to connect sink converter used

      - long: --derive-key-schema-as
        required: false
        arg: derive-key-schema-as
        help: |-
            🪄 Use playground schema derive-schema command to deduce schema from key payload

            Possible values:

            - AVRO
            - JSON (json schema)
            - PROTOBUF
        allowed: 
          - AVRO
          - JSON
          - PROTOBUF

      - long: --derive-value-schema-as
        required: false
        arg: derive-value-schema-as
        help: |-
            🪄 Use playground schema derive-schema command to deduce schema from value payload

            Possible values:

            - AVRO
            - JSON (json schema)
            - PROTOBUF
        allowed: 
          - AVRO
          - JSON
          - PROTOBUF

      - long: --no-null
        required: false
        help: |-
          🪹 Never generate null fields even for optional fields

          N.B: only work with avro and json-schema

      - long: --consume
        required: false
        help: |-
          📥 After producing, directly consume topic (until at least the number of records produced
          are consumed, or 60 seconds).

      - long: --delete-topic
        required: false
        help: |-
          ❌ Delete topic and associated schema/subject if applicable before producing data.

      - long: --reference
        arg: reference
        private: true
        help: |-
          🖇️ Schema reference
          
          See docs: https://docs.confluent.io/platform/7.6/schema-registry/fundamentals/serdes-develop/index.html#schema-references

          🎓 Tip: you can pass multiple references by specifying --reference multiple times

          🔥 You can either:
          
          * Set your own schema (avro, json-schema, protobuf) within single quotes (see examples) 
          
          * Use completion to select predefined schemas (or use your own schema file) 🎓 Tip: use <tab> completion to trigger fzf completion
        required: false
        repeatable: true
        completions:
          dynamic:
          - playground get-predefined-schemas "$completion_current"

      - long: --validate-config
        arg: validate-config
        help: |-
          🔩 Converter configuration parameters to use 
          
          See docs: https://docs.confluent.io/platform/current/schema-registry/connect.html#using-kconnect-long-with-sr

          🎓 Tip: you can pass multiple parameters by specifying --validate-config multiple times
        required: false
        repeatable: true
        allowed: 
          - scrub.invalid.names=true
          - enhanced.avro.schema.support=true
          - connect.meta.data=false
          - object.additional.properties=false
          - use.optional.for.nonrequired=true
          - ignore.default.for.nullables=true
          - generalized.sum.type.support=true
          - enhanced.protobuf.schema.support=true
          - generate.index.for.unions=false
          - int.for.enums=true
          - optional.for.nullables=true
          - generate.struct.for.nulls=true
          - wrapper.for.nullables=true
          - wrapper.for.raw.primitives=false

      - long: --producer-property
        arg: producer-property
        help: |-
          🔩 Producer configuration parameters to use 
          
          See docs: https://docs.confluent.io/platform/current/installation/configuration/producer-configs.html#cp-config-producer

          🎓 Tip: you can pass multiple parameters by specifying --producer-property multiple times

          Example: --producer-property "max.request.size=990485760" --producer-property "client.id=myid"
        required: false
        repeatable: true

      - long: --record-size
        arg: record-size
        validate: integer
        required: false
        default: "0"
        help: |-
          🏋️ Record size in bytes, eg. 1048576 for 1MB

          📢 If size is > 1Mb, --producer-property max.request.size and topic max.message.bytes will be automatically set to support the record size.

          Note that --no-null will be used when this option is set

      - long: --value-schema-id
        arg: value-schema-id
        private: true
        validate: integer
        required: false
        help: |-
          🔰 Do not auto register schema and specify schema id to use. 

          It sets --property value.schema.id=x --property auto.register=false --property use.latest.version=true

      examples: |

        playground topic produce --tombstone --topic a-topic --key mykey

        playground topic produce -t topic-json --nb-messages 10 << 'EOF'
        {
            "_meta": {
                "topic": "",
                "key": "",
                "relationships": []
            },
            "nested": {
                "phone": "faker.phone.imei()",
                "website": "faker.internet.domainName()"
            },
            "id": "iteration.index",
            "name": "faker.internet.userName()",
            "email": "faker.internet.exampleEmail()",
            "phone": "faker.phone.imei()",
            "website": "faker.internet.domainName()",
            "city": "faker.location.city()",
