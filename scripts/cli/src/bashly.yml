    - name: create
      group: Topic
      help: |-
        🆕 Create topic

        Only needed when you want something other than the defaults, since
        'playground topic produce' creates the topic on the fly. Any extra
        argument is passed through to kafka-topics --create, so --config works
        as usual.

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-topic-administration
        🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%AA%9B-a-producer-gets-recordtoolargeexception
      flags:
      - *verbose
      - long: --topic
        short: -t
        required: true
        arg: topic
        help: |-
          🗳 Topic name
      - long: --nb-partitions
        arg: nb-partitions
        validate: integer
        required: false
        default: "1"
        help: |-
          Number of partitions for the topic. (default is 1)
      - *cluster
      catch_all:
        label: arguments
        help: |-
          Any arguments to be used with kafka-topics --create
        required: false
      examples: |
        playground topic create --topic atopic
        playground topic create --topic atopic --nb-partitions 8 --config retention.ms=30000 --config cleanup.policy=compact
        
    - name: delete
      group: Topic
      help: |-
        ❌ Delete topic and associated schema/subject if applicable

        Also removes the key and value subjects from the schema registry,
        which is what you usually want: a topic re-created with a leftover
        subject keeps the old compatibility rules and the old schema history.
        Keep them with --skip-delete-schema. When the topic no longer exists,
        its leftover key and value subjects are still deleted.

        A regex is accepted, matched in full, to clean up a family of topics
        at once.

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-topic-administration
        🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%AA%9B-a-producer-gets-recordtoolargeexception
      flags:
      - *verbose
      - long: --topic
        short: -t
        required: true
        arg: topic
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Topic name or regex pattern (full match)

          Examples: my-topic, my-topic-.*
      - long: --skip-delete-schema
        required: false
        help: |-
          🔰 Do not delete subject/schema
      - *cluster

    - name: alter
      group: Topic
      help: |-
        🪛 Alter topic config

        Changes topic level settings on a live topic, which is how you
        reproduce behaviour driven by configuration: a small
        max.message.bytes to trigger a record too large error, a short
        retention.ms to expire data, a compacted cleanup.policy, and so on.

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-topic-administration
        🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%AA%9B-a-producer-gets-recordtoolargeexception
      flags:
      - *verbose
      - long: --topic
        short: -t
        required: true
        arg: topic
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Topic name
      - *cluster
      catch_all:
        label: arguments
        help: |-
          Any arguments to be used with kafka-configs --alter. If the topic does not exist, it is created first.
        required: false
      examples: |
        playground topic alter --topic atopic --add-config max.message.bytes=5242940

    - name: dlq
      group: Topic
      expose: always
      help: |-
        📬 Dead letter queue commands

        Read the dead letter queue of a sink connector
        (errors.tolerance=all with errors.deadletterqueue.topic.name, or the
        dlq-<lcc id> topic of a fully managed connector) without decoding
        its headers by hand, and send the records back once the cause is
        fixed.

          inspect   records grouped by error (exception, message, root cause,
                    original topic, partition and offsets)
          replay    produce the records again to their original topic, or
                    to --to

        Without --topic, the dead letter queue of --connector, or of the only
        running connector that has one, is used.

        The errors are in the __connect.errors.* headers, which are only
        written with "errors.deadletterqueue.context.headers.enable": "true"
        ('playground connector snippets --dlq' has it).

        👉 Example: https://github.com/vdesabou/kafka-docker-playground/tree/master/other/reprocess-dlq-messages-with-sink-connector

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-troubleshooting
        🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%A9%BA-a-sink-is-running-but-writes-nothing
      commands:

        - name: inspect
          group: Topic
          help: |-
            🩺 Show what is in a dead letter queue, grouped by error

            Reads the whole dead letter queue (up to --max-messages) and groups
            the records by connector, stage (key / value converter,
            transformation, task put...) and exception, most frequent first.
            For each group: the exception and its message, the root cause (last
            "Caused by:" of the stack trace), the original topic, partition and
            offsets, the offsets in the dead letter queue and a sample value.

            Keys and values are read as raw bytes, so it works whatever the
            format of the records (avro, protobuf, json schema, plain json).

            🌐 Also writes a self-contained HTML report in --output-dir, opened in the browser in an interactive terminal (--no-open to skip): known causes, when the records arrived, the groups with their original offsets and a sample value, and the replay commands.

            👉 Example: https://github.com/vdesabou/kafka-docker-playground/tree/master/other/reprocess-dlq-messages-with-sink-connector
          flags:
          - &dlq-topic
            long: --topic
            short: -t
            required: false
            arg: topic
            completions:
              dynamic:
              - playground get-topic-list
            help: |-
              📬 Dead letter queue topic

              ℹ️ If not set, the dead letter queue of --connector, or of the only running connector that has one
          - &dlq-connector
            long: --connector
            short: -c
            required: false
            arg: connector
            completions:
              dynamic:
              - playground get-connector-list
            help: |-
              🔗 Connector whose dead letter queue is used (errors.deadletterqueue.topic.name, or dlq-<lcc id> for a fully managed connector)
          - &dlq-max-messages
            long: --max-messages
            required: false
            arg: max_messages
            validate: integer
            default: "10000"
            help: |-
              🔢 Maximum number of records to read (default is 10000)
          - &dlq-grep
            long: --grep
            required: false
            arg: regex
            help: |-
              🔎 Only the records whose exception class, message or root cause match this regex (java syntax)
          - long: --json
            required: false
            help: |-
              🤖 Print the groups as JSON (no HTML report)
          - long: --output-dir
            short: -o
            arg: output_dir
            required: false
            default: "/tmp/playground-dlq-inspect"
            help: |-
              📂 Output directory for the HTML report (default: /tmp/playground-dlq-inspect)
          - long: --no-open
            required: false
            help: |-
              🙈 Do not open the HTML report in the browser
          - *verbose
          - *cluster
          examples:
          - playground topic dlq inspect --topic dlq
          - playground topic dlq inspect --connector http-sink
          - playground topic dlq inspect --topic dlq --grep "Unknown magic byte"
          - playground topic dlq inspect --topic dlq --output-dir ./case-123456 --no-open
          x_example_outputs:
          - command: playground topic dlq inspect --topic dlq
            output: |-
              17:22:05 ℹ️ 🩺 Inspecting dead letter queue dlq
              17:22:09 ℹ️ 📊 10 records in 1 group(s), most frequent first

              🔢 10 record(s) of connector filestream-sink, stage VALUE_CONVERTER (io.confluent.connect.avro.AvroConverter)
                ❌ org.apache.kafka.connect.errors.DataException: Failed to deserialize data for topic filestream to Avro:
                🌱 root cause: org.apache.kafka.common.errors.SerializationException: Unknown magic byte!
                📍 original records: topic filestream partition 0 offsets 0..9 (10)
                📬 dlq partition 0 offsets 0..9
                🔎 sample value: {"f1":"value1"}

              17:22:09 ℹ️ 🎓 replay them once the cause is fixed: playground topic dlq replay --topic dlq
              17:22:09 ℹ️ ✅ HTML report saved: /tmp/playground-dlq-inspect/dlq-dlq-20261013-172209.html
              17:22:09 ℹ️ 🔗 Open in browser: file:///tmp/playground-dlq-inspect/dlq-dlq-20261013-172209.html

        - name: replay
          group: Topic
          help: |-
            🔁 Produce the records of a dead letter queue again

            Once the cause is fixed (converter, schema, mapping...), sends the
            records back to the topic they came from (their
            __connect.errors.topic header), or to --to, so that the sink
            connector processes them again. Keys, values, timestamps and the
            other headers are kept as they are (raw bytes), the
            __connect.errors.* headers are removed unless
            --keep-error-headers is set.

            Only the records already in the dead letter queue when the command
            starts are read, and they are not deleted from it: a record that
            fails again is added to the dead letter queue a second time.

            🎓 Tip: --dry-run shows how many records would go to which topic,
            and --grep replays only one kind of error.

            👉 Example: https://github.com/vdesabou/kafka-docker-playground/tree/master/other/reprocess-dlq-messages-with-sink-connector
          flags:
          - *dlq-topic
          - *dlq-connector
          - long: --to
            required: false
            arg: to
            completions:
              dynamic:
              - playground get-topic-list
            help: |-
              📤 Topic to produce to

              ℹ️ If not set, each record goes back to its original topic (__connect.errors.topic header)
          - *dlq-max-messages
          - *dlq-grep
          - long: --keep-error-headers
            required: false
            help: |-
              🏷️ Keep the __connect.errors.* headers on the replayed records
          - long: --dry-run
            required: false
            help: |-
              🧪 Only display how many records would be replayed, and to which topics
          - *verbose
          - *cluster
          examples:
          - playground topic dlq replay --topic dlq --dry-run
          - playground topic dlq replay --topic dlq
          - playground topic dlq replay --connector http-sink --grep "Unknown magic byte" --to retry-topic
          x_example_outputs:
          - command: playground topic dlq replay --topic dlq
            output: |-
              17:22:05 ℹ️ 🔁 Replaying dead letter queue dlq to the original topics (__connect.errors.topic header)
                📤 10 record(s) to topic filestream
              17:22:09 ℹ️ ✅ 10 records replayed

    - name: tag
      group: Topic
      filters:
      - ccloud_environment
      help: |-
        🏷️ Stream Catalog tags (Confluent Cloud only)

        Tag definitions live in the Stream Catalog of the environment, served
        by the Schema Registry endpoint. Create a tag once, then assign it to
        topics and search topics by tag.

          list     tag definitions
          create   create a tag definition
          delete   delete a tag definition
          add      assign a tag to a topic
          remove   remove a tag from a topic
          show     tags assigned to a topic
          search   topics having a tag

        🎓 Tip: a newly created topic can take a minute to show up in the
        Stream Catalog before a tag can be assigned to it.
      commands:
      - name: list
        help: |-
          🏷️ List tag definitions
        flags:
        - *verbose

      - name: create
        help: |-
          🆕 Create a tag definition
        flags:
        - long: --tag
          required: true
          arg: tag
          help: |-
            🏷️ Tag name (letters, digits and underscores, starting with a letter)
        - long: --description
          required: false
          arg: description
          default: ""
          help: |-
            📝 Tag description
        - *verbose
        examples:
        - playground topic tag create --tag PII --description "Personally identifiable information"

      - name: delete
        help: |-
          ❌ Delete a tag definition

          The tag must not be assigned to any topic anymore.
        flags:
        - &catalog-tag
          long: --tag
          required: true
          arg: tag
          completions:
            dynamic:
            - playground get-catalog-tag-list
          help: |-
            🏷️ Tag name
        - *verbose
        examples:
        - playground topic tag delete --tag PII

      - name: add
        help: |-
          🏷️ Assign a tag to a topic
        flags:
        - &topic-required
          long: --topic
          short: -t
          required: true
          arg: topic
          completions:
            dynamic:
            - playground get-topic-list
          help: |-
            🗳 Topic name
        - *catalog-tag
        - *verbose
        examples:
        - playground topic tag add --topic pageviews --tag PII

      - name: remove
        help: |-
          🧽 Remove a tag from a topic
        flags:
        - *topic-required
        - *catalog-tag
        - *verbose
        examples:
        - playground topic tag remove --topic pageviews --tag PII

      - name: show
        help: |-
          🔎 Show tags assigned to a topic
        flags:
        - *topic-required
        - *verbose
        examples:
        - playground topic tag show --topic pageviews

      - name: search
        help: |-
          🔎 Search topics having a tag
        flags:
        - *catalog-tag
        - *verbose
        examples:
        - playground topic tag search --tag PII

- name: quota
  expose: always
  group: Kafka
  filters:
  - not_ccloud_environment
  help: |-
    🚦 Client quota commands

    Read, set and remove the client quotas of the brokers (wraps kafka-configs
    --entity-type users|clients): produce and fetch bandwidth, request time
    and partition mutation rate. Works on plaintext, secured environments and
    cfk (not on Confluent Cloud, where quotas are managed with the client
    quotas API).

      get      quotas of a user, client id or connector, or all of them
      set      set one or more quotas
      delete   remove quotas

    A quota applies to --user, --client-id, or both (the quota of that client
    id for that user only). --all-users / --all-client-ids set the default
    quota, used by every user / client id without a more specific one.
    --connector targets the client ids of the tasks of a self-managed
    connector: connector-consumer-<connector>-<task> for a sink,
    connector-producer-<connector>-<task> for a source.

    🎓 Tip: to reproduce a throttled sink connector (lag growing,
    fetch-throttle-time-avg above 0), set a small --consumer-byte-rate on it,
    then follow the lag with 'playground connector show-lag'.
  commands:

    - name: get
      group: Kafka
      help: |-
        🔎 Display client quotas

        Without any flag, displays every quota (users, client ids, and users +
        client ids).
      flags:
      - &quota-user
        long: --user
        short: -u
        required: false
        arg: user
        conflicts: [--all-users]
        help: |-
          👤 User (principal name, e.g. client for User:client)
      - &quota-client-id
        long: --client-id
        required: false
        arg: client-id
        conflicts: [--connector, --all-client-ids]
        help: |-
          🏷️ Client id (client.id of the producer or consumer)
      - &quota-connector
        long: --connector
        short: -c
        required: false
        arg: connector
        conflicts: [--client-id, --all-client-ids]
        completions:
          dynamic:
          - playground get-connector-list
        help: |-
          🔗 Self-managed connector: use the client ids of its tasks

          connector-consumer-<connector>-<task> for a sink,
          connector-producer-<connector>-<task> for a source.
      - &quota-all-users
        long: --all-users
        required: false
        conflicts: [--user]
        help: |-
          👥 Default quota of all users (used by the users without their own quota)
      - &quota-all-client-ids
        long: --all-client-ids
        required: false
        conflicts: [--client-id, --connector]
        help: |-
          🏷️ Default quota of all client ids (used by the client ids without their own quota)
      - *verbose
      - *cluster
      examples:
      - playground quota get
      - playground quota get --connector filestream-sink
      - playground quota get --user client --client-id my-app

    - name: set
      group: Kafka
      help: |-
        🚦 Set client quotas

        Set one or more of --producer-byte-rate, --consumer-byte-rate,
        --request-percentage and --controller-mutation-rate, on --user,
        --client-id, --connector, --all-users or --all-client-ids. The
        quotas already set on the entity and not given here are kept.

        Clients are throttled right away, without restart: the broker delays
        its responses, and the clients report it in their produce-throttle-time-avg
        and fetch-throttle-time-avg metrics.
      flags:
      - *quota-user
      - *quota-client-id
      - *quota-connector
      - *quota-all-users
      - *quota-all-client-ids
      - long: --producer-byte-rate
        required: false
        arg: bytes
        validate: integer
        help: |-
          📤 Produce bandwidth, in bytes per second, per broker (producer_byte_rate)
      - long: --consumer-byte-rate
        required: false
        arg: bytes
        validate: integer
        help: |-
          📥 Fetch bandwidth, in bytes per second, per broker (consumer_byte_rate)
      - long: --request-percentage
        required: false
        arg: percentage
        help: |-
          ⏱️ Share of the broker request handler and network threads time, in percent of one thread (request_percentage, decimals allowed, e.g. 0.2)
      - long: --controller-mutation-rate
        required: false
        arg: rate
        validate: integer
        help: |-
          🧬 Partitions created or deleted per second (controller_mutation_rate)
      - *verbose
      - *cluster
      examples:
      - playground quota set --connector filestream-sink --consumer-byte-rate 1024
      - playground quota set --client-id my-producer --producer-byte-rate 10240
      - playground quota set --all-users --request-percentage 50
      x_example_outputs:
      - command: playground quota set --connector filestream-sink --consumer-byte-rate 1024
        output: |-
          15:02:10 ℹ️ 🚦 Setting consumer_byte_rate=1024 on client-id connector-consumer-filestream-sink-0
          Completed updating config for client-id connector-consumer-filestream-sink-0.
          Quota configs for client-id 'connector-consumer-filestream-sink-0' are consumer_byte_rate=1024.0

    - name: delete
      group: Kafka
      help: |-
        🗑️ Remove client quotas

        Removes the quotas given with --producer-byte-rate,
        --consumer-byte-rate, --request-percentage and
        --controller-mutation-rate (no value), or all the quotas of the
        entity when none is given.
      flags:
      - *quota-user
      - *quota-client-id
      - *quota-connector
      - *quota-all-users
      - *quota-all-client-ids
      - long: --producer-byte-rate
        required: false
        help: |-
          📤 Only remove producer_byte_rate
      - long: --consumer-byte-rate
        required: false
        help: |-
          📥 Only remove consumer_byte_rate
      - long: --request-percentage
        required: false
        help: |-
          ⏱️ Only remove request_percentage
      - long: --controller-mutation-rate
        required: false
        help: |-
          🧬 Only remove controller_mutation_rate
      - *verbose
      - *cluster
      examples:
      - playground quota delete --connector filestream-sink
      - playground quota delete --all-users --request-percentage

- name: broker
  expose: always
  group: Kafka
  help: |-
    🖥️ Broker commands

      config            read and change dynamic broker configs
      health            brokers down, partition problems, KRaft quorum
      stop / start      stop (or kill) a broker, start it again
      rolling-restart   restart the brokers one by one, safely
      transactions      list transactions, find and abort hanging ones
      describe          brokers, KRaft quorum, feature levels, API versions
      metrics           key JMX metrics of each broker

    Not available on Confluent Cloud and multi data center environments.

    🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-broker
  commands:

  - name: config
    expose: always
    group: Kafka
    filters:
    - not_ccloud_environment
    help: |-
      ⚙️ Dynamic broker config commands

      Read and change the configuration of the running brokers, without
      restart (wraps kafka-configs --entity-type brokers). Works on plaintext,
      secured environments and cfk (not on Confluent Cloud, where broker
      configs can't be changed).

        get      dynamic configs, or the value and source of one key
        set      set a key, cluster-wide or on one broker
        delete   remove a dynamic value (back to the static or default one)

      Without --broker, set and delete apply to the cluster-wide default,
      used by every broker without its own value. Only the configs marked
      "dynamic" (per-broker or cluster-wide) in the broker configuration
      reference can be changed: kafka-configs refuses the others.

      🎓 Tip: changing a broker environment variable with 'playground
      container set-environment-variables' also works for the read-only
      configs, but recreates the container.
    commands:

      - name: get
        group: Kafka
        help: |-
          🔎 Display dynamic broker configs

          Without --key, displays the dynamic configs set cluster-wide and on
          each broker (or on --broker only). With --key, displays the value used
          by each broker and where it comes from (DYNAMIC_BROKER_CONFIG,
          DYNAMIC_DEFAULT_BROKER_CONFIG, STATIC_BROKER_CONFIG or DEFAULT_CONFIG).
          With --all, displays every config of the broker.
        flags:
        - &broker-config-broker
          long: --broker
          short: -b
          required: false
          arg: broker
          validate: integer
          help: |-
            🖥️ Broker id (default: all brokers, plus the cluster-wide default for set and delete)
        - &broker-config-key
          long: --key
          short: -k
          required: false
          arg: key
          completions:
            static:
            - background.threads
            - compression.type
            - follower.replication.throttled.rate
            - leader.replication.throttled.rate
            - log.cleaner.io.max.bytes.per.second
            - log.cleaner.threads
            - log.message.timestamp.type
            - log.retention.bytes
            - log.retention.ms
            - log.segment.bytes
            - max.connection.creation.rate
            - max.connections
            - max.connections.per.ip
            - message.max.bytes
            - min.insync.replicas
            - num.io.threads
            - num.network.threads
            - num.replica.fetchers
            - unclean.leader.election.enable
          help: |-
            🔑 Config key (e.g. log.retention.ms)
        - long: --all
          required: false
          conflicts: [--key]
          help: |-
            📜 Display every config of the broker (static and default ones too), not only the dynamic ones
        - *verbose
        - *cluster
        examples:
        - playground broker config get
        - playground broker config get --key num.io.threads
        - playground broker config get --broker 1 --all
        x_example_outputs:
        - command: playground broker config get --key log.retention.ms
          output: |-
            15:02:10 ℹ️ 🔎 Value of log.retention.ms on each broker
            BROKER   VALUE                SOURCE
            1        60000                DYNAMIC_DEFAULT_BROKER_CONFIG

      - name: set
        group: Kafka
        help: |-
          ⚙️ Set a dynamic broker config

          Applied right away, without restart, cluster-wide or on --broker only.
          A value with commas (a list) is sent as one value.
        flags:
        - *broker-config-broker
        - <<: *broker-config-key
          required: true
        - long: --value
          required: true
          arg: value
          help: |-
            ✏️ New value
        - *verbose
        - *cluster
        examples:
        - playground broker config set --key log.retention.ms --value 60000
        - playground broker config set --broker 1 --key num.io.threads --value 16
        - playground broker config set --key leader.replication.throttled.rate --value 1048576

      - name: delete
        group: Kafka
        help: |-
          🗑️ Remove a dynamic broker config

          The broker falls back to the next value: the cluster-wide default
          (when removing it from --broker), the static one of server.properties,
          or the Kafka default.
        flags:
        - *broker-config-broker
        - <<: *broker-config-key
          required: true
        - *verbose
        - *cluster
        examples:
        - playground broker config delete --key log.retention.ms
        - playground broker config delete --broker 1 --key num.io.threads

  - name: health
    group: Kafka
    filters:
    - not_ccloud_environment
    help: |-
      🩺 Check the health of the cluster

      One digest of what makes a cluster unhealthy:

        - broker containers that are not registered (stopped, starting) or fenced
        - under-replicated partitions (kafka-topics --under-replicated-partitions)
        - partitions under min.insync.replicas (--under-min-isr-partitions):
          acks=all producers fail with NotEnoughReplicasException (a topic
          whose replication factor is below min.insync.replicas is only a ⚠️
          warning: it is a config problem, not a broker one)
        - unavailable partitions, without leader (--unavailable-partitions)
        - the KRaft quorum: leader, lag and last caught up time of each node
          (kafka-metadata-quorum describe --replication)

      Exits with 1 when the cluster is not healthy. With --wait-healthy, waits
      until it is (for example after 'playground broker start' or a
      'container restart'), up to --max-wait seconds.

      Works on plaintext, secured environments and cfk.
    flags:
    - long: --wait-healthy
      required: false
      help: |-
        ⏳ Wait until the cluster is healthy (up to --max-wait seconds)
    - long: --max-wait
      required: false
      arg: max-wait
      validate: integer
      default: "120"
      help: |-
        ⏳ Maximum time to wait with --wait-healthy, in seconds (default 120)
    - long: --json
      required: false
      help: |-
        📗 Print the result as JSON (healthy, brokers, partitions, kraft_quorum), and nothing else
    - *verbose
    - *cluster
    examples:
    - playground broker health
    - playground broker health --wait-healthy --max-wait 300
    - playground broker health --json | jq '.under_replicated_partitions | length'
    x_example_outputs:
    - command: playground broker health
      output: |-
        17:42:10 ℹ️ 🩺 Health of the cluster
        17:42:11 ℹ️ 🖥️ registered brokers: 1,3
        17:42:11 ❌ broker 2 (container broker2) is not registered: it is stopped (playground broker start --broker 2)
        17:42:13 ❌ 3 under-replicated partitions
        TOPIC     PARTITION  LEADER  REPLICAS  ISR
        orders    0          1       1,2,3     1,3
        orders    1          3       2,3,1     3,1
        orders    2          1       3,1,2     3,1
        17:42:15 ℹ️ ✅ no under min.insync.replicas partition
        17:42:17 ℹ️ ✅ no unavailable (no leader) partition
        17:42:19 ℹ️ 🗳️ KRaft quorum: leader is node 4
        NODE  STATUS    LOG_END_OFFSET  LAG  LAST_CAUGHT_UP
        4     Leader    1250            0    0s ago
        1     Observer  1250            0    0s ago
        2     Observer  1100            150  85s ago ⚠️
        3     Observer  1250            0    0s ago
        17:42:19 ❌ cluster is not healthy: brokers down: 2, 3 under-replicated partitions

  - name: stop
    group: Kafka
    filters:
    - not_ccloud_environment
    - not_cfk_environment
    help: |-
      🛑 Stop a broker

      Stops the container of a broker with a controlled shutdown: its leaders
      move to the other replicas first. With --kill, the container is killed
      instead, like a crash (no controlled shutdown, the leaders move only after
      the broker session times out).

      Useful to reproduce what clients and connectors do when a broker goes
      away: NOT_LEADER_OR_FOLLOWER, NotEnoughReplicasException, metadata
      refresh, retries. Start it again with 'playground broker start'.

      🎓 Tip: needs several brokers to keep the cluster available, start the
      example with 'playground run --enable-multiple-brokers'.
    flags:
    - &broker-id-required
      long: --broker
      short: -b
      required: true
      arg: broker
      validate: integer
      completions:
        static:
        - "1"
        - "2"
        - "3"
      help: |-
        🖥️ Broker id
    - long: --kill
      required: false
      help: |-
        🔫 Kill the broker (like a crash) instead of a controlled shutdown
    - *verbose
    - *cluster
    examples:
    - playground broker stop --broker 2
    - playground broker stop --broker 2 --kill

  - name: start
    group: Kafka
    filters:
    - not_ccloud_environment
    - not_cfk_environment
    help: |-
      ▶️ Start a broker stopped with 'playground broker stop'

      Starts the container of the broker, waits for it to be registered, then
      for the cluster to be healthy again (its replicas back in sync, see
      'playground broker health'), up to --max-wait seconds.
    flags:
    - *broker-id-required
    - long: --max-wait
      required: false
      arg: max-wait
      validate: integer
      default: "180"
      help: |-
        ⏳ Maximum time to wait for the broker and the cluster, in seconds (default 180)
    - long: --no-wait
      required: false
      help: |-
        ⏩ Do not wait for the broker to be registered and the cluster to be healthy
    - *verbose
    - *cluster
    examples:
    - playground broker start --broker 2
    - playground broker start --broker 2 --no-wait

  - name: rolling-restart
    group: Kafka
    filters:
    - not_ccloud_environment
    - not_cfk_environment
    help: |-
      🔄 Restart the brokers one by one, like a rolling upgrade

      Checks that the cluster is healthy (--force to skip), then for each
      broker: restarts its container (controlled shutdown), waits for it to be
      registered and for the cluster to be healthy again before the next one.
      Stops at the first broker that does not come back healthy within
      --max-wait seconds.

      Useful to reproduce connector or client errors, duplicates or rebalances
      during a rolling upgrade or restart of the brokers.

      🎓 Tip: to change a broker setting that needs a restart, use 'playground
      container set-environment-variables' (it recreates the container).
    flags:
    - long: --brokers
      required: false
      arg: brokers
      help: |-
        🖥️ Comma separated broker ids, restarted in this order (default: all brokers, by id)
    - long: --max-wait
      required: false
      arg: max-wait
      validate: integer
      default: "300"
      help: |-
        ⏳ Maximum time to wait for each broker to be back and the cluster healthy, in seconds (default 300)
    - long: --force
      required: false
      help: |-
        ☢️ Restart even if the cluster is not healthy before starting
    - *verbose
    - *cluster
    examples:
    - playground broker rolling-restart
    - playground broker rolling-restart --brokers 3,2,1 --max-wait 600
    x_example_outputs:
    - command: playground broker rolling-restart
      output: |-
        17:50:02 ℹ️ 🔄 [1/3] Restarting broker 1 (container broker)
        17:50:31 ℹ️ ✅ [1/3] broker 1 restarted, cluster is healthy (29s)
        17:50:31 ℹ️ 🔄 [2/3] Restarting broker 2 (container broker2)
        17:50:58 ℹ️ ✅ [2/3] broker 2 restarted, cluster is healthy (27s)
        17:50:58 ℹ️ 🔄 [3/3] Restarting broker 3 (container broker3)
        17:51:26 ℹ️ ✅ [3/3] broker 3 restarted, cluster is healthy (28s)
        17:51:26 ℹ️ 🎉 rolling restart of brokers 1,2,3 done in 84s

  - name: transactions
    expose: always
    group: Kafka
    filters:
    - not_ccloud_environment
    help: |-
      💱 Transaction commands

      Inspect the transactions of the cluster and recover from hanging ones
      (wraps kafka-transactions). Works on plaintext, secured environments and
      cfk.

        list                 transactional ids, coordinator and state
        describe             one transactional id: partitions, duration
        describe-producers   producers of a topic, open transactions
        find-hanging         transactions forgotten by their coordinator
        abort                abort a hanging transaction

      An open transaction holds the last stable offset (LSO) of its partitions:
      read_committed consumers (sink connectors of a topic written by an
      exactly-once source, Kafka Streams with exactly_once_v2...) don't read
      past it, and their lag never drains. It ends when it commits, aborts, or
      after transaction.timeout.ms. A hanging transaction never ends: find it
      with find-hanging and abort it.
    commands:

      - name: list
        group: Kafka
        help: |-
          📋 List the transactional ids
        flags:
        - long: --state
          required: false
          arg: state
          allowed:
          - Empty
          - Ongoing
          - PrepareCommit
          - PrepareAbort
          - CompleteCommit
          - CompleteAbort
          - Dead
          - PrepareEpochFence
          help: |-
            🔎 Only the transactional ids in this state
        - long: --pattern
          required: false
          arg: regex
          help: |-
            🔎 Only the transactional ids matching this regular expression
        - *verbose
        - *cluster
        examples:
        - playground broker transactions list
        - playground broker transactions list --state Ongoing
        - playground broker transactions list --pattern "connect-cluster-.*"

      - name: describe
        group: Kafka
        help: |-
          🔎 Describe a transactional id

          State, producer id and epoch, timeout, start time and duration of the
          current transaction, and the partitions it writes to.
        flags:
        - long: --transactional-id
          short: -i
          required: true
          arg: transactional-id
          help: |-
            🆔 Transactional id (playground broker transactions list)
        - *verbose
        - *cluster
        examples:
        - playground broker transactions describe --transactional-id my-txn-producer

      - name: describe-producers
        group: Kafka
        help: |-
          🏭 Describe the active producers of a topic

          For each partition (or --partition only): the producers that wrote
          to it recently, and the start offset of their open transaction (⚠️).
          That offset is where read_committed consumers are blocked.
        flags:
        - long: --topic
          short: -t
          required: true
          arg: topic
          completions:
            dynamic:
            - playground get-topic-list
          help: |-
            🗳 Topic name
        - long: --partition
          short: -p
          required: false
          arg: partition
          validate: integer
          help: |-
            🔢 Only this partition (default: all the partitions of the topic)
        - *verbose
        - *cluster
        examples:
        - playground broker transactions describe-producers --topic orders
        - playground broker transactions describe-producers --topic orders --partition 0

      - name: find-hanging
        group: Kafka
        help: |-
          🧟 Find hanging transactions

          A transaction is hanging when it is open on a partition for longer
          than --max-transaction-timeout minutes, and its coordinator does not
          know it anymore: it will never end on its own. Searches every broker,
          or --broker, or the partitions of --topic.

          Exits with 1 when hanging transactions are found, and prints the
          abort command of each.
        flags:
        - long: --broker
          short: -b
          required: false
          arg: broker
          validate: integer
          help: |-
            🖥️ Only the partitions of this broker (default: all brokers)
        - long: --topic
          short: -t
          required: false
          arg: topic
          completions:
            dynamic:
            - playground get-topic-list
          help: |-
            🗳 Only the partitions of this topic
        - long: --partition
          short: -p
          required: false
          arg: partition
          validate: integer
          help: |-
            🔢 Only this partition (needs --topic)
        - long: --max-transaction-timeout
          required: false
          arg: minutes
          validate: integer
          default: "15"
          help: |-
            ⏱️ transaction.max.timeout.ms of the brokers, in minutes: only the transactions open for longer are checked (default 15)
        - *verbose
        - *cluster
        examples:
        - playground broker transactions find-hanging
        - playground broker transactions find-hanging --topic orders
        - playground broker transactions find-hanging --broker 1 --max-transaction-timeout 5

      - name: abort
        group: Kafka
        help: |-
          🧹 Abort a hanging transaction

          Writes an abort marker for the transaction started at --start-offset
          on a partition (requires administrative privileges). Its records are
          discarded, and read_committed consumers move on. The start offset is
          printed by find-hanging and describe-producers.
        flags:
        - long: --topic
          short: -t
          required: true
          arg: topic
          completions:
            dynamic:
            - playground get-topic-list
          help: |-
            🗳 Topic name
        - long: --partition
          short: -p
          required: true
          arg: partition
          validate: integer
          help: |-
            🔢 Partition
        - long: --start-offset
          required: true
          arg: offset
          validate: integer
          help: |-
            📍 Start offset of the transaction to abort
        - *verbose
        - *cluster
        examples:
        - playground broker transactions abort --topic orders --partition 0 --start-offset 1234

  - name: describe
    group: Kafka
    filters:
    - not_ccloud_environment
    help: |-
      🗺️ Describe the cluster

      The brokers (id, endpoint, rack, fenced, container, and the broker
      containers that are not registered), the KRaft quorum (cluster id,
      active controller, voters and observers, from kafka-metadata-quorum
      describe --status) and the feature levels (metadata.version... from
      kafka-features describe).

      With --api-versions, the API versions supported by a broker (wraps
      kafka-broker-api-versions): useful when an old client fails with
      UnsupportedVersionException.
    flags:
    - long: --api-versions
      required: false
      help: |-
        🔌 Display the API versions supported by a broker instead
    - long: --broker
      short: -b
      required: false
      arg: broker
      validate: integer
      help: |-
        🖥️ Broker id for --api-versions (default: the first broker)
    - *verbose
    - *cluster
    examples:
    - playground broker describe
    - playground broker describe --api-versions --broker 2

  - name: metrics
    group: Kafka
    filters:
    - not_ccloud_environment
    - not_cfk_environment
    help: |-
      📈 Display the key JMX metrics of the brokers

      One column per broker: partitions and leaders, under-replicated and
      under min ISR partitions, request handler and network processor idle
      ratio, request queue size, produce and fetch p99 latency, messages and
      bytes in and out per second, ISR shrinks and expands, failed produce and
      fetch requests. ⚠️ marks the values to look at.

      Answers "is the broker the bottleneck?", for example during a
      'playground connector benchmark'. With --topic, the rates and failed
      requests are the ones of this topic.

      🎓 Tip: every metric of a broker: playground get-jmx-metrics -c broker
    flags:
    - long: --broker
      short: -b
      required: false
      arg: broker
      validate: integer
      help: |-
        🖥️ Only this broker (default: all brokers)
    - long: --topic
      short: -t
      required: false
      arg: topic
      completions:
        dynamic:
        - playground get-topic-list
      help: |-
        🗳 Rates and failed requests of this topic only
    - long: --json
      required: false
      help: |-
        📗 Print the raw values as JSON, one object per broker, and nothing else
    - *verbose
    - *cluster
    examples:
    - playground broker metrics
    - playground broker metrics --topic orders
    - playground broker metrics --broker 1 --json

- name: consumer-group
  expose: always
  group: Topic
  help: |-
    👥 Consumer group commands

    Inspect any consumer group (not only the ones of sink connectors): which
    groups exist, their state and members, and the committed offsets and lag
    per partition. Works on plaintext, secured environments, cfk and
    Confluent Cloud.

      list            consumer groups, optionally with their state
      describe        committed offsets and lag, or --state, or --members
      reset-offsets   rewind or fast-forward a group (earliest, latest, datetime...)
      delete          delete a group, or its offsets for one topic

    🎓 Tip: for a sink connector, 'playground connector show-lag' follows the
    lag until it reaches 0.

    🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-offsets-and-lag
    🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%E2%8F%AA-the-lag-of-a-sink-is-stuck
  commands:

    - name: list
      group: Topic
      help: |-
        👥 List consumer groups
      flags:
      - long: --state
        required: false
        help: |-
          🚦 Also display the state of each group (Stable, Empty, PreparingRebalance...)
      - *verbose
      - *cluster
      examples:
      - playground consumer-group list
      - playground consumer-group list --state
      x_example_outputs:
      - command: playground consumer-group list
        output: |-
          17:22:17 ℹ️ 👥 Listing consumer groups
          connect-filestream-sink

    - name: describe
      group: Topic
      help: |-
        🔬 Describe consumer group

        By default, shows the committed offset, log end offset and lag of
        every partition consumed by the group, followed by the total lag.
        Use --state for the coordinator, assignment strategy and state, and
        --members for the members and their assigned partitions.
      flags:
      - long: --group
        short: -g
        required: false
        arg: group
        completions:
          dynamic:
          - playground get-consumer-group-list
        help: |-
          👥 Consumer group name

          ℹ️ If not set, all consumer groups are described
      - long: --state
        required: false
        help: |-
          🚦 Display state of the group (coordinator, assignment strategy, state, number of members)
      - long: --members
        required: false
        help: |-
          🧑‍🤝‍🧑 Display members of the group and their assigned partitions
      - *verbose
      - *cluster
      examples:
      - playground consumer-group describe --group connect-http-sink
      - playground consumer-group describe --group my-app --members
      - playground consumer-group describe --group my-app --state
      x_example_outputs:
      - command: playground consumer-group describe --group connect-filestream-sink
        output: |-
          17:23:03 ℹ️ 🔬 Describing consumer group connect-filestream-sink

          GROUP                   TOPIC           PARTITION  CURRENT-OFFSET  LOG-END-OFFSET  LAG             CONSUMER-ID                                                               HOST            CLIENT-ID
          connect-filestream-sink filestream      0          5               5               0               connector-consumer-filestream-sink-0-01fb326c-c344-4c45-ba76-b8c048b539f4 /10.89.0.7      connector-consumer-filestream-sink-0
          17:23:04 ℹ️ 🏁 Total lag for consumer group connect-filestream-sink: 0

    - name: reset-offsets
      group: Topic
      help: |-
        ⏪ Reset the committed offsets of a consumer group

        Wraps kafka-consumer-groups --reset-offsets: set exactly one of
        --to-earliest, --to-latest, --to-offset, --to-datetime, --shift-by
        or --by-duration. All the topics of the group are reset, unless
        --topic is set (topic, or topic:partition[,partition]).

        The offsets are changed right away (kafka-consumer-groups --execute):
        use --dry-run to only see the new offsets. The group must have no
        active member.

        🎓 Tip: for a sink connector (group connect-<connector>), use
        'playground connector offsets reset|alter', which stops and resumes
        the connector for you.
      flags:
      - long: --group
        short: -g
        required: true
        arg: group
        completions:
          dynamic:
          - playground get-consumer-group-list
        help: |-
          👥 Consumer group name
      - long: --topic
        short: -t
        required: false
        arg: topic
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Topic to reset (topic, or topic:partition[,partition])

          ℹ️ If not set, all the topics of the group are reset
      - long: --to-earliest
        required: false
        help: |-
          ⏮️ Reset to the earliest offset
      - long: --to-latest
        required: false
        help: |-
          ⏭️ Reset to the latest offset (skip everything that is in the topic)
      - long: --to-offset
        required: false
        arg: offset
        validate: integer
        help: |-
          📍 Reset to this offset
      - long: --to-datetime
        required: false
        arg: datetime
        help: |-
          📅 Reset to the first offset at or after this date (YYYY-MM-DDTHH:mm:SS.sss, e.g. 2026-10-20T08:00:00.000)
      - long: --shift-by
        required: false
        arg: shift
        help: |-
          ↔️ Move the offsets by this number of records (negative to go back, e.g. -100)
      - long: --by-duration
        required: false
        arg: duration
        help: |-
          ⏱️ Reset to the offsets of this long ago (ISO-8601 duration, e.g. PT1H for one hour ago, P1D for one day)
      - long: --dry-run
        required: false
        help: |-
          🧪 Only display the new offsets, do not change them
      - *verbose
      - *cluster
      examples:
      - playground consumer-group reset-offsets --group my-app --to-earliest
      - playground consumer-group reset-offsets --group my-app --topic orders --shift-by -100 --dry-run
      - playground consumer-group reset-offsets --group my-app --to-datetime 2026-10-20T08:00:00.000
      x_example_outputs:
      - command: playground consumer-group reset-offsets --group my-app --to-earliest
        output: |-
          17:23:03 ℹ️ ⏪ Resetting offsets of consumer group my-app on all its topics to earliest
          GROUP                          TOPIC                          PARTITION  NEW-OFFSET
          my-app                         filestream                     0          0
          17:23:04 ℹ️ ✅ Offsets of consumer group my-app reset

    - name: delete
      group: Topic
      help: |-
        🗑️ Delete a consumer group, or its offsets for one topic

        Wraps kafka-consumer-groups --delete. With --topic, only the
        committed offsets of that topic are deleted (--delete-offsets), the
        group keeps its other offsets.

        The group must have no active member: for a sink connector, stop or
        delete the connector first.
      flags:
      - long: --group
        short: -g
        required: true
        arg: group
        completions:
          dynamic:
          - playground get-consumer-group-list
        help: |-
          👥 Consumer group name
      - long: --topic
        short: -t
        required: false
        arg: topic
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Only delete the committed offsets of this topic
      - *verbose
      - *cluster
      examples:
      - playground consumer-group delete --group my-app
      - playground consumer-group delete --group my-app --topic orders

- name: flink
  expose: always
  group: Flink
  filters:
  - flink_running
  help: |-
    🐿️ Flink commands

    Run Flink SQL and manage the jobs of the Flink cluster started with
    'playground run --enable-flink' (jobmanager REST API on port 18081).

      sql         run Flink SQL statements (stdin or --file) with the SQL client
      list-jobs   jobs of the cluster with their state, start time and duration
      cancel      cancel a job, or all running jobs

    🎓 Tip: the Flink UI is served on the same port as the REST API:
    http://localhost:18081. See the flink/flink-sql-kafka example.
  commands:

    - name: sql
      group: Flink
      help: |-
        🐿️ Run Flink SQL statements with the SQL client

        The statements are read from stdin (heredoc) or --file, and run in
        one SQL client session (bin/sql-client.sh -f) in the sql-client
        container, or in the jobmanager container when sql-client is stopped. So
        CREATE TABLE and the INSERT INTO that uses it must be sent in the
        same call.

        Results are printed as tables (tableau result mode). An INSERT INTO
        submits a job to the cluster and returns right away: its job id is
        printed, follow it with 'playground flink list-jobs'.

        The client stops at the first failing statement, and the command
        then exits with code 1.

        🎓 Tip: a SELECT on an unbounded table (Kafka, datagen) never ends in
        streaming mode: add a LIMIT, or SET 'execution.runtime-mode' = 'batch'
        on a bounded source. Otherwise the client is stopped after
        --max-wait seconds.
      flags:
      - long: --file
        short: -f
        required: false
        arg: file
        validate: file_exists
        completions:
          dynamic:
          - playground get-specific-file-extension "$completion_current" --extension "sql"
        help: |-
          📄 File with the SQL statements, separated by ;

          ℹ️ If not set, the statements are read from stdin
      - long: --max-wait
        short: -w
        required: false
        arg: max_wait
        validate: integer
        default: "120"
        help: |-
          ⏳ Stop the SQL client after this number of seconds (default 120)
      - *verbose
      examples:
      - |-
        playground flink sql << 'EOF'
        CREATE TABLE orders (id INT, product STRING) WITH (
          'connector' = 'datagen', 'rows-per-second' = '1'
        );
        CREATE TABLE sink (id INT, product STRING) WITH ('connector' = 'print');
        INSERT INTO sink SELECT * FROM orders;
        EOF
      - playground flink sql --file ./queries.sql
      x_example_outputs:
      - command: playground flink sql --file ./queries.sql
        output: |-
          13:20:47 ℹ️ 🐿️ Running Flink SQL statements in sql-client container (Flink 2.3.0, http://localhost:18081)
          Flink SQL> CREATE TABLE src (id INT) WITH ('connector'='datagen','rows-per-second'='1')[INFO] Execute statement succeeded.
          Flink SQL> CREATE TABLE snk (id INT) WITH ('connector'='blackhole')[INFO] Execute statement succeeded.
          Flink SQL> [INFO] Submitting SQL update statement to the cluster...
          [INFO] SQL update statement has been successfully submitted to the cluster:
          Job ID: 972185f42739cba34766e6dea6d80a50
          13:20:49 ℹ️ 🚀 Job 972185f42739cba34766e6dea6d80a50 submitted, follow it with: playground flink list-jobs

    - name: list-jobs
      group: Flink
      help: |-
        📋 List the jobs of the Flink cluster

        Job id, state, name, start time and duration of every job, most
        recent first. For a FAILED job, the root exception is also printed.
      flags:
      - long: --state
        required: false
        arg: state
        allowed:
        - INITIALIZING
        - CREATED
        - RUNNING
        - FAILING
        - FAILED
        - CANCELLING
        - CANCELED
        - FINISHED
        - RESTARTING
        - SUSPENDED
        - RECONCILING
        help: |-
          🚦 Only list the jobs in this state
      - long: --json
        required: false
        help: |-
          📗 Print the jobs as a JSON array (the /jobs/overview REST API response) and nothing else
      - *verbose
      examples:
      - playground flink list-jobs
      - playground flink list-jobs --state RUNNING
      - playground flink list-jobs --json | jq -r '.[].jid'
      x_example_outputs:
      - command: playground flink list-jobs
        output: |-
          13:22:10 ℹ️ 📋 Jobs of the Flink cluster (Flink 2.3.0, http://localhost:18081)
          JOB ID                            STATE     NAME                                              START                DURATION
          972185f42739cba34766e6dea6d80a50  RUNNING   insert-into_default_catalog.default_database.snk  2026-10-29 14:20:48  1m22s

    - name: cancel
      group: Flink
      help: |-
        🛑 Cancel a Flink job

        Cancels --job, or every running job with --all, and waits until the
        job is CANCELED (30 seconds at most). Without --job and --all, the
        running job is cancelled when there is only one.
      flags:
      - long: --job
        short: -j
        required: false
        arg: job
        conflicts: [--all]
        completions:
          dynamic:
          - playground get-flink-job-list
        help: |-
          🆔 Id of the job to cancel (see playground flink list-jobs)
      - long: --all
        required: false
        conflicts: [--job]
        help: |-
          💥 Cancel all running jobs
      - *verbose
      examples:
      - playground flink cancel
      - playground flink cancel --job 972185f42739cba34766e6dea6d80a50
      - playground flink cancel --all

- name: rbac
  expose: always
  group: RBAC
  help: |-
    🛡️ RBAC commands (rbac-sasl-plain and cfk-rbac environments, plus Confluent Cloud ACLs)

    Change permissions of the running rbac-sasl-plain or cfk-rbac environment
    without opening a shell in a container: the commands call the MDS REST API
    (http://localhost:8091, a port-forward to the kafka service on cfk-rbac) as
    superUser.

      role-binding   create, delete and list role bindings
      user           add, delete and list LDAP users and their groups
      acl            create, delete and list ACLs (MDS centralized ACLs, or
                     regular Kafka ACLs with --kafka-acls). On a Confluent
                     Cloud run, ACLs of the Confluent Cloud cluster

    🎓 Tip: principals are User:<name> or Group:<name>, a bare name means User:<name>.

    🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-secured-environments
    🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%94%90-the-same-example-under-sasl_ssl-and-rbac
  commands:

    - name: role-binding
      expose: always
      group: RBAC
      filters:
      - rbac_environment
      help: |-
        🔐 Role binding commands
      commands:

        - name: create
          group: RBAC
          help: |-
            🔐 Create a role binding

            Without --resource, the role is bound on the whole cluster
            (SystemAdmin, ClusterAdmin, SecurityAdmin, UserAdmin, AuditAdmin,
            Operator). With --resource, it is bound on that resource
            (ResourceOwner, DeveloperRead, DeveloperWrite, DeveloperManage).

            The scope is deduced from the resource type when --scope is not set:
            Subject is schema-registry, Connector is connect, KsqlCluster is
            ksqldb, anything else is kafka.
          flags:
          - long: --principal
            short: -p
            required: false
            arg: principal
            help: |-
              🧑 Principal, User:<name> or Group:<name> (a bare name means User:<name>)

              ❕ Required, unless --file is set
          - long: --role
            short: -r
            required: false
            arg: role
            allowed: [ResourceOwner, DeveloperRead, DeveloperWrite, DeveloperManage, SystemAdmin, ClusterAdmin, SecurityAdmin, UserAdmin, AuditAdmin, Operator]
            help: |-
              🎩 Role name

              ❕ Required, unless --file is set
          - &rbac-resource
            long: --resource
            required: false
            arg: resource
            help: |-
              📦 Resource, <ResourceType>:<name>, for example Topic:orders, Group:my-app,
              Subject:orders-value, Connector:my-sink, TransactionalId:my-tx, Cluster:kafka-cluster

              ℹ️ If not set, the role is bound on the whole cluster
          - &rbac-prefix
            long: --prefix
            required: false
            help: |-
              🔤 The resource name is a prefix (PREFIXED pattern) instead of a literal name
          - &rbac-scope
            long: --scope
            required: false
            arg: scope
            allowed: [kafka, schema-registry, connect, ksqldb]
            help: |-
              🎯 Cluster the role binding applies to

              ℹ️ If not set, it is deduced from the resource type (kafka when there is no resource)
          - long: --file
            required: false
            validate: file_exists
            arg: file
            help: |-
              📄 Create all the role bindings of a file, one per line: <principal> <role> <resource or -> [prefix] [scope=<scope>]

              See environment/rbac-sasl-plain/role-bindings.txt (the default role bindings) for the format.
          - *verbose
          examples:
          - playground rbac role-binding create --principal User:alice --role DeveloperRead --resource Topic:orders
          - playground rbac role-binding create --principal User:alice --role ResourceOwner --resource Topic:orders --prefix
          - playground rbac role-binding create --principal User:connectorSA --role ResourceOwner --resource Subject:orders-value
          - playground rbac role-binding create --principal Group:KafkaDevelopers --role SystemAdmin --scope connect
          - playground rbac role-binding create --file "\$PWD/role-bindings.txt"

        - name: delete
          group: RBAC
          help: |-
            🗑️ Delete a role binding

            Same flags as 'playground rbac role-binding create'.
          flags:
          - &rbac-principal-required
            long: --principal
            short: -p
            required: true
            arg: principal
            help: |-
              🧑 Principal, User:<name> or Group:<name> (a bare name means User:<name>)
          - &rbac-role
            long: --role
            short: -r
            required: true
            arg: role
            allowed: [ResourceOwner, DeveloperRead, DeveloperWrite, DeveloperManage, SystemAdmin, ClusterAdmin, SecurityAdmin, UserAdmin, AuditAdmin, Operator]
            help: |-
              🎩 Role name
          - *rbac-resource
          - *rbac-prefix
          - *rbac-scope
          - *verbose
          examples:
          - playground rbac role-binding delete --principal User:alice --role DeveloperRead --resource Topic:orders
          - playground rbac role-binding delete --principal User:alice --role SystemAdmin

        - name: list
          group: RBAC
          help: |-
            📋 List role bindings

            Without --principal, every principal with a role binding is listed.
          flags:
          - &rbac-principal
            long: --principal
            short: -p
            required: false
            arg: principal
            help: |-
              🧑 Principal, User:<name> or Group:<name> (a bare name means User:<name>)

              ℹ️ If not set, role bindings of all principals are listed
          - long: --scope
            required: false
            arg: scope
            allowed: [kafka, schema-registry, connect, ksqldb]
            help: |-
              🎯 Only list role bindings of this cluster

              ℹ️ If not set, all clusters are listed
          - *verbose
          examples:
          - playground rbac role-binding list
          - playground rbac role-binding list --principal User:connectorSA
          - playground rbac role-binding list --scope schema-registry

    - name: user
      expose: always
      group: RBAC
      filters:
      - rbac_environment
      help: |-
        🧑 LDAP user commands

        Users live in the openldap container. They authenticate on the broker
        with SASL/PLAIN (their LDAP password) and log in to MDS, Control
        Center, Schema Registry and Connect REST API with basic auth.
        Changes apply to the running environment, without restart.
      commands:

        - name: add
          group: RBAC
          help: |-
            ➕ Add an LDAP user

            The user can connect right away. MDS picks up new group
            memberships (for Group:<name> role bindings) within its LDAP
            refresh interval (60 seconds by default).
          flags:
          - &rbac-user
            long: --user
            short: -u
            required: true
            arg: user
            help: |-
              🧑 User name (principal User:<user>)
          - long: --password
            required: false
            arg: password
            help: |-
              🔑 Password

              ℹ️ If not set, <user>-secret
          - long: --group
            short: -g
            required: false
            repeatable: true
            unique: true
            arg: group
            help: |-
              👥 Group to add the user to (principal Group:<group>), created if it does not exist. Can be set several times.
          - *verbose
          examples:
          - playground rbac user add --user bob
          - playground rbac user add --user bob --password bob-pwd --group KafkaDevelopers

        - name: delete
          group: RBAC
          help: |-
            🗑️ Delete an LDAP user, and remove it from its groups

            Its role bindings and ACLs are not deleted.
          flags:
          - *rbac-user
          - *verbose
          examples:
          - playground rbac user delete --user bob

        - name: list
          group: RBAC
          help: |-
            📋 List LDAP users and their groups
          flags:
          - *verbose
          examples:
          - playground rbac user list

    - name: acl
      expose: always
      group: RBAC
      filters:
      - rbac_or_ccloud_environment
      help: |-
        🚦 ACL commands

        By default, ACLs are MDS centralized ACLs (stored in the
        _confluent-metadata-auth topic and enforced by the CONFLUENT access rule
        provider). With --kafka-acls, they are regular Kafka ACLs created with
        kafka-acls (ZK_ACL or KRAFT_ACL access rule provider).

        ⛅ On a Confluent Cloud run, they are the ACLs of the Confluent Cloud
        cluster (confluent kafka acl). --connector then uses the service
        account of a fully managed connector created with
        playground run --ccloud-service-account as principal, to reproduce
        authorization errors: delete or deny one of its ACLs, then restart the
        connector.

        🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%91%A4-a-fully-managed-connector-with-a-service-account-loses-an-acl
      commands:

        - name: create
          group: RBAC
          help: |-
            🚦 Create ACLs, one per --operation
          flags:
          - &rbac-acl-principal
            long: --principal
            short: -p
            required: false
            arg: principal
            help: |-
              🧑 Principal, User:<name> or Group:<name> (a bare name means User:<name>)

              ⛅ On Confluent Cloud, User:sa-xxxxx (service account) or User:u-xxxxx (user)

              ❕ Required, unless --connector is set
          - &rbac-acl-connector
            long: --connector
            short: -c
            required: false
            arg: connector
            completions:
              dynamic:
              - playground get-connector-list
            help: |-
              🔗 Use the service account of this fully managed connector (kafka.service.account.id) as principal

              ⛅ Confluent Cloud only, see playground run --ccloud-service-account
          - &rbac-operation
            long: --operation
            short: -o
            required: true
            repeatable: true
            unique: true
            arg: operation
            allowed: [ALL, READ, WRITE, CREATE, DELETE, ALTER, DESCRIBE, CLUSTER_ACTION, DESCRIBE_CONFIGS, ALTER_CONFIGS, IDEMPOTENT_WRITE]
            help: |-
              ⚙️ Operation, can be set several times
          - &rbac-acl-resource
            long: --resource
            required: true
            arg: resource
            help: |-
              📦 Resource, <ResourceType>:<name> with ResourceType one of Topic, Group,
              Cluster, TransactionalId, DelegationToken. Use Cluster:kafka-cluster for the cluster.
          - *rbac-prefix
          - &rbac-deny
            long: --deny
            required: false
            help: |-
              ⛔ DENY instead of ALLOW
          - &rbac-host
            long: --host
            required: false
            arg: host
            help: |-
              🖥️ Host the ACL applies to

              ℹ️ If not set, all hosts (*)
          - &rbac-kafka-acls
            long: --kafka-acls
            required: false
            help: |-
              🧰 Use regular Kafka ACLs (kafka-acls) instead of MDS centralized ACLs
          - *verbose
          examples:
          - playground rbac acl create --principal User:charlie --operation WRITE --operation DESCRIBE --resource Topic:orders
          - playground rbac acl create --principal User:charlie --operation READ --resource Group:my-app --prefix
          - playground rbac acl create --principal User:charlie --operation READ --resource Topic:orders --kafka-acls
          - playground rbac acl create --connector HttpSink_\$USER --operation READ --resource Topic:http-topic --deny

        - name: delete
          group: RBAC
          help: |-
            🗑️ Delete ACLs, one per --operation

            Same flags as 'playground rbac acl create'.
          flags:
          - *rbac-acl-principal
          - *rbac-acl-connector
          - *rbac-operation
          - *rbac-acl-resource
          - *rbac-prefix
          - *rbac-deny
          - *rbac-host
          - *rbac-kafka-acls
          - *verbose
          examples:
          - playground rbac acl delete --principal User:charlie --operation WRITE --resource Topic:orders
          - playground rbac acl delete --connector HttpSink_\$USER --operation READ --resource Group:connect-lcc- --prefix

        - name: list
          group: RBAC
          help: |-
            📋 List ACLs

            Lists both MDS centralized ACLs and regular Kafka ACLs, or the ACLs of
            the Confluent Cloud cluster on a Confluent Cloud run.
          flags:
          - *rbac-principal
          - *rbac-acl-connector
          - *verbose
          examples:
          - playground rbac acl list
          - playground rbac acl list --principal User:charlie
          - playground rbac acl list --connector HttpSink_\$USER

- name: connector-plugin
  expose: always
  group: Connector-Plugin
  help: |-
    🔌 Connector-plugin commands

    Questions about connector plugins on Confluent Hub, answered without a
    running environment:

      versions              every released version of a plugin
      changelog             what changed between two versions (release notes)
      display-last-updated  what was published recently, by vendor
      search-jar            which jars ship in it, and which class is where
      config-key            what a config key does, its default, since when, who sets it
      sourcecode            open the source on GitHub

    🎓 Tip: search-jar answers "is this class really in the plugin, and with
    which signature", which is the question behind most NoSuchMethodError and
    ClassNotFoundException reports.

    🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-plugin
    🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%A7%91%F0%9F%92%BB-the-source-code-of-a-connector-at-the-customers-version
  commands:
  - name: search-jar
    help: |-
      ☕ List jars for a connector plugin from confluent hub https://www.confluent.io/hub/

      Downloads the plugin and lists the jars it ships. With --class it also
      finds which jar contains that class and prints its method signatures
      with javap.

      That answers the two questions a NoClassDefFoundError or a
      NoSuchMethodError raises: is the class actually shipped, and does the
      bundled version have the signature the code is calling. Run it again
      with another --connector-tag to see when a dependency changed.
    dependencies:
      javap: visit https://openjdk.org/install/ to install
    flags:
    - &connector-plugin
      long: --connector-plugin
      short: -c
      required: true
      arg: connector-plugin
      completions:
        dynamic:
        - playground get-connector-plugin "$completion_current" "onprem"
      help: |-
        🔌 Connector plugin name

        🎓 Tip: use <tab> completion to trigger fzf completion
    - *connector-tag
    - long: --class
      arg: class
      required: false
      help: |- 
        ☕ Java class name to search for in all jars
    examples: |
      playground connector-plugin search-jar --connector-plugin confluentinc/kafka-connect-s3 --class WebIdentityTokenCredentialsProvider
    x_example_outputs:
    - command: playground connector-plugin search-jar --connector-plugin confluentinc/kafka-connect-s3 --class WebIdentityTokenCredentialsProvider
      output: |-
        17:23:33 ℹ️ 🔌 Downloading connector plugin confluentinc/kafka-connect-s3:latest
        17:23:49 ℹ️ 🤎 Listing jar files
        accessors-smart-2.4.9.jar
        aircompressor-2.0.3.jar
        ...
        17:23:49 ℹ️ Searching for java class WebIdentityTokenCredentialsProvider in all jars
        17:23:57 ℹ️ 👉 method signatures from ./auth-2.28.23.jar jar for class software.amazon.awssdk.auth.credentials.WebIdentityTokenCredentialsProviderFactory
        Compiled from "WebIdentityTokenCredentialsProviderFactory.java"
        public interface software.amazon.awssdk.auth.credentials.WebIdentityTokenCredentialsProviderFactory {
          public abstract software.amazon.awssdk.auth.credentials.AwsCredentialsProvider create(software.amazon.awssdk.auth.credentials.internal.WebIdentityTokenCredentialProperties);
        }

  - name: versions
    help: |-
      💯 List versions for a connector plugin from confluent hub https://www.confluent.io/hub/

      What to feed to --connector-tag when you want to test another version,
      and the way to find out which release you are behind on. The list is
      cached; use --force-refresh after a brand new release.
    flags:
    - *connector-plugin
    - &force_refresh
      long: --force-refresh
      required: false
      help: |-
        ☢️ Force refresh.
    - long: --last
      arg: last
      required: false
      validate: integer
      conflicts: [--all]
      help: |-
        🆕 Number of last versions to show
    - long: --with-changelog
      required: false
      help: |-
        📜 Show the release notes of each version under it

        From the changelog feeds of docs.confluent.io, like playground connector-plugin changelog: Confluent self-managed plugins only.
    examples: |
      playground connector-plugin versions --connector-plugin confluentinc/kafka-connect-s3
      playground connector-plugin versions --connector-plugin confluentinc/kafka-connect-jdbc --last 3 --with-changelog
    x_example_outputs:
    - command: playground connector-plugin versions --connector-plugin confluentinc/kafka-connect-http --last 3
      output: |-
        17:23:19 ℹ️ 💯 Listing last 3 versions for connector plugin confluentinc/kafka-connect-http
        🔢 v1.7.12 - 📅 release date: 2026-01-29 (256 days ago)
        🔢 v1.7.13 - 📅 release date: 2026-05-05 (160 days ago)
        🔢 v1.7.14 - 📅 release date: 2026-10-01 (11 days ago)
        🌐 documentation: https://docs.confluent.io/kafka-connect-http/current/index.html

  - name: changelog
    help: |-
      📜 Show the release notes of a connector plugin between two versions

      Reads the changelog feeds of docs.confluent.io (one per minor line, for
      example https://docs.confluent.io/kafka-connectors/s3-sink/12.1/changelog.xml)
      and lists every change after --from, up to --to, newest first, with the
      release date from Confluent Hub.

      It answers "the customer runs 10.5.7: is their bug fixed in a later
      version, and in which one?" in one call: pass the customer version as
      --from and the symptom as --grep. The CC-xxxxx ids are the Jira tickets
      of the fixes.

      Without --from, only the minor line of --to is shown (for example every
      12.1.x up to 12.1.15).

      Only Confluent self-managed plugins documented under
      docs.confluent.io/kafka-connectors have a feed. Fully managed connectors
      and partner plugins don't. Answers are cached for one day in
      /tmp/connector-plugin-changelog (--force-refresh).

      🎓 Tip: then read the code of the fix with playground connector-plugin sourcecode --checkout-only
    flags:
    - *connector-plugin
    - long: --from
      arg: from
      required: false
      validate: not_empty
      help: |-
        🔢 Version in use: show the changes of the versions after it (excluded)
    - long: --to
      arg: to
      required: false
      validate: not_empty
      help: |-
        🔢 Show the changes up to this version (included)

        Default is the latest version on Confluent Hub
    - long: --grep
      arg: grep
      required: false
      validate: not_empty
      help: |-
        🔎 Only show the changes matching this regular expression (case insensitive)

        Example: --grep "CVE|offset|NullPointerException"
    - long: --json
      required: false
      help: |-
        🤖 Print the result as JSON
    - *force_refresh
    examples: |
      playground connector-plugin changelog --connector-plugin confluentinc/kafka-connect-s3 --from 12.0.10
      playground connector-plugin changelog --connector-plugin confluentinc/kafka-connect-jdbc --from 10.7.4 --grep "timestamp|CVE"
      playground connector-plugin changelog --connector-plugin confluentinc/kafka-connect-http --to 1.7.10
      playground connector-plugin changelog --connector-plugin confluentinc/kafka-connect-oracle-cdc --from 2.14.0 --json

  - name: display-last-updated
    help: |-
      🆕 List last updated connector plugins from confluent hub https://www.confluent.io/hub/

      A quick way to see what has just been released on the Hub, which often
      explains why an example that passed yesterday behaves differently today.
    flags:
    - long: --days
      arg: days
      required: false
      default: "3"
      validate: integer
      help: |-
        📅 Number of days to look back

        Default is 3 days
    - long: --vendor
      required: false
      validate: not_empty
      arg: vendor
      help: |-
        🏢 Only display results for this vendor
    examples: |
      playground connector-plugin display-last-updated --days 7
  - name: config-key
    help: |-
      🔑 Explain a connector configuration key: documentation, type, default, since when, and which examples set it

      Answers "what does this key do, what is its default, since which
      version does it exist, and how is it used" in one call, without a
      running environment.

      📗 Documentation, type, default, importance and group come from the
      configuration reference that CI records for every tested connector,
      self-managed and fully managed (the config-<class>.txt files next to
      the examples, refreshed with the latest connector version).

      📅 The git history of that file tells when CI first saw the key, which
      is when a new connector version introduced it. Versions you ran
      locally (playground connector show-config-parameters cache) are also
      checked one by one.

      🧪 Examples that set the key are listed with the value they use.

      Without --connector-class, every connector having the key is listed.
      When the key is not found, similar keys are suggested.
    flags:
      - long: --key
        short: -k
        required: true
        arg: key
        validate: not_empty
        help: |-
          🔑 Exact configuration key, for example behavior.on.null.values
      - long: --connector-class
        short: -c
        required: false
        arg: connector-class
        help: |-
          🔌 Only this connector: part of its class name or fully managed type, case insensitive

          Examples: S3SinkConnector, io.confluent.connect.jdbc.JdbcSinkConnector, S3_SINK, jdbc
      - long: --max-examples
        required: false
        arg: max_examples
        validate: integer
        default: "10"
        help: |-
          🧪 Maximum number of examples to show (default 10)
    examples:
    - playground connector-plugin config-key --key behavior.on.null.values
    - playground connector-plugin config-key --key behavior.on.null.values --connector-class S3SinkConnector
    - playground connector-plugin config-key -k s3.part.size -c S3_SINK
    - playground connector-plugin config-key -k errors.tolerance -c jdbc --max-examples 3
    x_example_outputs:
    - command: playground connector-plugin config-key --key flush.size
      output: |-
        17:22:28 ℹ️ 🔌 12 connector(s) have key flush.size, use --connector-class to see the details of one
           defaults: null (x7), 1000 (x5)

        CONNECTOR                                                                TYPE  DEFAULT  IMPORTANCE
        AzureBlobSink                                                            INT   1000     HIGH
        GcsSink                                                                  INT   1000     HIGH
        io.confluent.connect.gcs.GcsSinkConnector                                INT   null     HIGH
        io.confluent.connect.hdfs.HdfsSinkConnector                              INT   null     HIGH
        io.confluent.connect.s3.S3SinkConnector                                  INT   null     HIGH
        S3_SINK                                                                  INT   1000     HIGH
        ...

        17:22:30 ℹ️ 🧪 427 line(s) in examples set flush.size, values used (most frequent first):
           "3"                            x275 e.g. connect/connect-gcp-gcs-source/gcs-source-backup-and-restore.sh:98
           "1000"                         x63  e.g. ccloud/fm-azure-data-lake-storage-gen2-sink/fully-managed-azure-data-lake-storage-gen2-sink.sh:134
           "1"                            x14  e.g. connect/connect-ftps-sink/ftps-sink.sh:55
    footer: |-
      Example output:
        $ playground connector-plugin config-key --key flush.size
        17:22:28 ℹ️ 🔌 12 connector(s) have key flush.size, use --connector-class to see the details of one
           defaults: null (x7), 1000 (x5)

        CONNECTOR                                                                TYPE  DEFAULT  IMPORTANCE
        AzureBlobSink                                                            INT   1000     HIGH
        GcsSink                                                                  INT   1000     HIGH
        io.confluent.connect.gcs.GcsSinkConnector                                INT   null     HIGH
        io.confluent.connect.hdfs.HdfsSinkConnector                              INT   null     HIGH
        io.confluent.connect.s3.S3SinkConnector                                  INT   null     HIGH
        S3_SINK                                                                  INT   1000     HIGH
        ...

        17:22:30 ℹ️ 🧪 427 line(s) in examples set flush.size, values used (most frequent first):
           "3"                            x275 e.g. connect/connect-gcp-gcs-source/gcs-source-backup-and-restore.sh:98
           "1000"                         x63  e.g. ccloud/fm-azure-data-lake-storage-gen2-sink/fully-managed-azure-data-lake-storage-gen2-sink.sh:134
           "1"                            x14  e.g. connect/connect-ftps-sink/ftps-sink.sh:55

  - name: sourcecode
    help: |
      🧑‍💻 Open source code url in your browser (or in your editor when used with --open)

      You can compare different sourcecode versions by specifying --connector-tag two times, in such case it will open github in comparison mode
      
      🏗️ Compile code and generate zip file(s) by providing --compile flag

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-plugin
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%A7%91%F0%9F%92%BB-the-source-code-of-a-connector-at-the-customers-version

    environment_variables:
    - name: GH_TOKEN
      help: "🔑 GitHub token, needed for fully managed connectors (cc-docker-connect is private)"
    - name: GITHUB_TOKEN
      help: "🔑 GitHub token, used when GH_TOKEN is not set"
    flags:
      - long: --connector-plugin
        short: -c
        required: true
        arg: connector-plugin
        completions:
          dynamic:
          - playground get-connector-plugin "$completion_current" "all"
        help: |-
          🔌 Connector plugin name

          🎓 Tip: use <tab> completion to trigger fzf completion
      - long: --only-show-url
        help: |-
          🌐 Only show url
      - long: --connector-tag
        arg: connector_tag
        repeatable: true
        required: false
        help: |- 
          🔗 Connector version to use

          By default, for each connector, the latest available version on Confluent Hub is used (for Confluent employees, it will also get latest versions for fully managed connectors)

          💌 Confluent employees only: for fully managed connectors, use the cc-connect image version for the pcc. You must have a Confluent Github token set with GITHUB_TOKEN or GH_TOKEN environment variable and also be using Confluent VPN.

          🎓 Tip: set to " " in order to select the version dynamically (for Confluent plugins, the preview shows the release notes of each version)

          🎓 Tip: you can compare different sourcecode versions by specifying --connector-tag two times, in such case it will open github in comparison mode
      - long: --compile
        required: false
        conflicts: [--checkout-only]
        help: |-
          🏗️ Checkout and compile code

          You must have git installed.

          💌 Confluent employees only: make sure to follow "Maven FAQ", you also need to be on Confluent VPN with proper AWS credentials set in order to be able to download proprietary dependencies.
      - long: --compile-jdk-version
        required: false
        needs: [--compile]
        arg: compile_jdk_version
        allowed: 
          - "8"
          - "11"
          - "17"
          - "21"
          - "25"
        help: |-
          🤎 JDK version to use when compiling
          It will check in pom.xml for maven-compiler-plugin source/target version or release version and set jdk accordingly
          Default is 11
      - long: --compile-verbose
        short: -v
        needs: [--compile]
        help: 🐞 Show output of compilation.
      - long: --open
        short: -o
        conflicts: [--checkout-only]
        help: |- 
          🔖 Checkout the code and open with text editor set with playground config editor <editor> (default is code)
      - long: --checkout-only
        required: false
        conflicts: [--open, --compile]
        help: |-
          📂 Checkout the code at the right tag and print the path of the folder, nothing else

          No browser, no editor, no question: an existing checkout of the same
          version in /tmp/connector-plugin-sourcecode is reused. The path is
          the last line of the output.

          🎓 Tip: use it in scripts and from AI agents, which can then read the code
    examples: |

      # will checkout the latest version from hub and print the path of the folder
      playground connector-plugin sourcecode --connector-plugin confluentinc/kafka-connect-hdfs --checkout-only

      # will open latest version from hub source code
      playground connector-plugin sourcecode --connector-plugin confluentinc/kafka-connect-hdfs

      # will ask you to select a version
      playground connector-plugin sourcecode --connector-plugin confluentinc/kafka-connect-hdfs --connector-tag " "

      # if you're a confluent employee (make sure to set your aws credentials), it will also work on proprietary connectors and fully managed connectors
      playground connector-plugin sourcecode --connector-plugin confluentinc/MqttSource

      # comparison mode:
      playground connector-plugin sourcecode --connector-plugin confluentinc/kafka-connect-hdfs --connector-tag "10.2.1" --connector-tag "10.2.0"

      # comparison mode (with versions selection):
      playground connector-plugin sourcecode --connector-plugin confluentinc/kafka-connect-hdfs --connector-tag " " --connector-tag " "

      # compile 
      playground connector-plugin sourcecode --connector-plugin confluentinc/kafka-connect-jdbc --compile

      # if you're a confluent employee (make sure to set your aws credentials and follow Maven FAQ), it will also work on proprietary connectors and fully managed connectors 
      playground connector-plugin sourcecode --connector-plugin confluentinc/kafka-connect-oracle-xstream-cdc-source --compile --connector-tag "1.2.0" --compile-verbose

      # will open repository in your editor
      playground connector-plugin sourcecode --connector-plugin confluentinc/kafka-connect-hdfs --open
    x_example_outputs:
    - command: playground connector-plugin sourcecode --connector-plugin confluentinc/kafka-connect-s3 --only-show-url
      output: |-
        17:22:31 ℹ️ ✨ --connector-tag was not set, using latest version on hub 12.1.13
        17:22:31 ℹ️ 🧑‍💻🌐 sourcecode for plugin confluentinc/kafka-connect-s3 for 12.1.13 version is available at:
        https://github.com/confluentinc/kafka-connect-storage-cloud/tree/v12.1.13

- name: connector
  expose: always
  group: Connector
  help: |-
    🔗 Connector commands

    Everything you would otherwise do with curl on the Connect REST API, with
    the right host, port and credentials already figured out. The same
    commands work whether the connector is self managed in the connect
    container or fully managed in Confluent Cloud.

    🔍 Look at what is running
      status                  is it RUNNING, and if not, the full stack trace
      wait                    wait until it is RUNNING (or another state)
      error-recommendations   suggested fixes for a failed fully managed connector
      show-config             the configuration actually applied
      diff                    running config vs a file, another connector or the defaults
      logs                    tail connect logs, filtered and followed
      show-lag                consumer lag of a sink, until it reaches zero
      benchmark               records per second, compared with the previous run
      offsets get             where the connector is reading or writing
      smt test                what a transform chain does to a record, step by step

    🛠️ Change it
      create-or-update        create it, or apply a new config, from stdin
      validate                check a config with the plugin, without creating it
      update                  edit the running config in your editor
      pause / resume / stop / restart / delete
      offsets alter / reset   rewind or fast-forward a connector

    🧑‍🔬 Understand it
      show-config-parameters  every parameter the plugin accepts
      select-config           pick parameters interactively
      versions                installed version vs latest on Confluent Hub
      sourcecode              open the source on GitHub, or diff two versions
      open-docs               open the Confluent documentation
      snippets                ready-to-paste converter and dlq config

    🐞 Dig deeper
      log-level               raise connect log level for this connector
      enable-remote-debugging attach a java debugger to the connector code
      translate               self managed config to fully managed config

    Without --connector, commands apply to every connector of the example,
    which is usually what you want since most examples run only one.
  commands:
  - name: status
    help: |-
      🧩 Show status of all connectors

      The connector state, the state of each task, and for a failed task the
      full stack trace, which is the thing you actually need. Add --verbose to
      see the underlying REST call.
    environment_variables:
    - name: PG_SKIP_ERROR_RECOMMENDATIONS
      private: true
      help: "Do not print error recommendations for FAILED connectors (internal)"
    - name: PG_SKIP_DIAGNOSE_HINT
      private: true
      help: "Do not print the playground connector diagnose hint (internal)"
    flags:
    - *verbose
    - &connector
      long: --connector
      short: -c
      required: false
      arg: connector
      completions:
        dynamic:
        - playground get-connector-list
      help: |-
        🔗 Connector name

        🎓 Tip: If not specified, the command will apply to all connectors
    - *cluster
    examples:
    - playground connector status
    x_example_outputs:
    - command: playground connector status
      output: |-
        17:22:05 ℹ️ 🧩 Displaying status for 🌎onprem connector filestream-sink
        Name                           Status       Tasks                                                        Stack Trace
        -------------------------------------------------------------------------------------------------------------
        filestream-sink                ✅ RUNNING  0:🟢 RUNNING                 -
        -------------------------------------------------------------------------------------------------------------

  - name: wait
    help: |-
      ⏳ Wait for connectors to reach a state

      Polls the connector status every --interval seconds until the connector
      and all its tasks are in --state (RUNNING by default), and fails after
      --max-wait seconds, displaying the status with the stack trace.

      RUNNING is only reached when the connector and its tasks are still
      RUNNING one --interval later, since a task is RUNNING before it
      processes its first record and can fail right after.

      When waiting for RUNNING, it fails right away if the connector or one of
      its tasks is FAILED, since a failed task does not recover on its own,
      and runs 'playground connector diagnose' on it: status with the trace,
      digest of the connect errors since the wait started, offsets, next
      steps and HTML report, opened in the browser from an interactive
      terminal ('playground config open-diagnose-report-on-failure false' to
      only print its path, PG_SKIP_AUTO_DIAGNOSE=1 for the status only).
      A connector RUNNING without any task for 30 seconds (Replicator without
      matching topic yet, JDBC source without table) is accepted with a
      warning. A Datagen task that failed with "Stopping connector: generated
      the configured N number of messages" ("iterations" reached) is
      completed, not FAILED, and counts as RUNNING.
      For the same reason, --state FAILED is reached as soon as the connector
      or one of its tasks is FAILED (the connector itself usually stays
      RUNNING when only a task fails).

      🎓 Tip: 'connector create-or-update' already waits for RUNNING. Use
      it for another state, or after 'connector create-or-update --no-wait'.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-create-or-update
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%94%8C-the-sink-fails-right-after-it-is-deployed
    environment_variables:
    - name: PG_SKIP_AUTO_DIAGNOSE
      help: "🩺 Set to 1 to display only the status of a FAILED connector, instead of running 'connector diagnose' on it (also for create-or-update)"
    flags:
    - *verbose
    - *connector
    - long: --state
      arg: state
      required: false
      default: "RUNNING"
      allowed:
        - RUNNING
        - PAUSED
        - STOPPED
        - FAILED
      help: |-
        🎯 State to wait for (default is RUNNING)
    - long: --max-wait
      arg: max_wait
      validate: integer
      default: "120"
      help: |-
        ⏳ Max time in seconds to wait (default is 120)
    - long: --interval
      arg: interval
      validate: integer
      default: "5"
      help: |-
        🔁 Interval in seconds between status checks (default is 5)
    - *cluster
    examples:
    - playground connector wait --connector filestream-sink
    - playground connector wait --connector filestream-sink --state PAUSED --max-wait 60
    x_example_outputs:
    - command: playground connector wait --connector filestream-sink
      output: |-
        17:22:05 ℹ️ ⏳ Waiting up to 120 seconds for 🌎onprem connector filestream-sink to be RUNNING
        17:22:10 ℹ️ ✅ 🌎onprem connector filestream-sink is RUNNING (1 task(s)) after 5 seconds

  - name: validate
    help: |-
      ✅ Validate a connector config without creating the connector

      Sends the config to the validate endpoint of the plugin
      (PUT /connector-plugins/<class>/config/validate) and prints every
      invalid property with its error message. Nothing is created or
      changed, so it is the dry run of 'create-or-update' for a customer
      config. Exits with 1 if the config is invalid.

      The config is read from stdin: json, or a format customers send (CFK /
      Strimzi custom resource, terraform, .properties, a dump of GET
      /connectors?expand=info with --connector to pick one, see 'playground
      connector convert'). Without stdin, --connector validates the config
      of that running connector, for example after switching to another
      connector version.

      The same automatic config as 'create-or-update' is added for the
      environment of the example (security settings on sasl-ssl...),
      unless --skip-automatic-connector-config is set.

      🎓 Tip: works for fully managed connectors too, with the validate
      endpoint of Confluent Cloud.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-create-or-update
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%94%8C-the-sink-fails-right-after-it-is-deployed
    args:
    - name: json
      default: "-"
      help: json (reads from stdin if empty)
    flags:
    - *verbose
    - long: --connector
      short: -c
      required: false
      arg: connector
      completions:
        dynamic:
        - playground get-connector-list
      help: |-
        🔗 Connector name

        Name given to the validate endpoint with a config on stdin. Without
        stdin, the running connector whose config is validated.
    - long: --skip-automatic-connector-config
      required: false
      help: |-
        🤖 Do not add the automatic configuration of the environment (security settings on sasl-ssl...) before validating
    - *cluster
    examples:
    - |-
      playground connector validate << EOF
      {
        "connector.class": "FileStreamSink",
        "topics": "filestream",
        "file": "/tmp/output.json",
        "tasks.max": "abc"
      }
      EOF
    - playground connector validate --connector filestream-sink
    x_example_outputs:
    - command: playground connector validate (tasks.max is abc)
      output: |-
        17:22:05 ℹ️ 🔎 Validating 🌎onprem connector config (nothing is created)
        17:22:05 ❗ ❌ Validation errors found in connector config
        tasks.max ->> Invalid value abc for configuration tasks.max: Not a number of type INT

  - name: diff
    help: |-
      🔀 Diff the config of a running connector with another config

      Compares the config of a running connector, key by key, with:

        stdin              a config (plain json, the heredoc printed by
                           'show-config', or a format customers send: CFK /
                           Strimzi custom resource, terraform, .properties,
                           a dump of GET /connectors?expand=info, see
                           'playground connector convert')
        --file             the same, from a file, e.g. the config of a
                           customer
        --with-connector   another running connector
        --defaults         the default value of each parameter of the plugin:
                           shows only what the connector changes, and the
                           keys set to their default that could be removed

      Keys only on one side, and keys with different values, are listed.
      Passwords masked by the REST API are not compared.

      🎓 Tip: run it with the config of a customer and the config of the
      example to see right away what differs.

      🌐 Also writes a self-contained HTML report in --output-dir, opened in the browser in an interactive terminal (--no-open to skip): the keys side by side with the documentation, type and default of each one (from the configuration reference of the plugin), what the important differences mean (converters, error handling, transforms...), and the secrets masked.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-create-or-update
    flags:
    - *verbose
    - *connector
    - long: --file
      short: -f
      required: false
      arg: file
      validate: file_exists
      completions:
        dynamic:
        - playground get-specific-file-extension "$completion_current" --extension "json"
      help: |-
        📄 File with the config to compare with (json, a create-or-update heredoc, a CFK / Strimzi custom resource, terraform, .properties, a dump of GET /connectors?expand=info)
    - long: --with-connector
      required: false
      arg: with_connector
      completions:
        dynamic:
        - playground get-connector-list
      help: |-
        🔗 Other running connector to compare with
    - long: --defaults
      required: false
      help: |-
        💤 Compare with the default value of each parameter of the plugin
    - long: --json
      required: false
      help: |-
        🤖 Print the result as JSON (no HTML report)
    - long: --output-dir
      short: -o
      arg: output_dir
      required: false
      default: "/tmp/playground-connector-diff"
      help: |-
        📂 Output directory for the HTML report (default: /tmp/playground-connector-diff)
    - long: --no-open
      required: false
      help: |-
        🙈 Do not open the HTML report in the browser
    - *cluster
    examples:
    - playground connector diff --connector filestream-sink --file customer-config.json
    - playground connector diff --connector filestream-sink --with-connector filestream-sink2
    - playground connector diff --connector filestream-sink --defaults
    - |-
      playground connector diff --connector filestream-sink << EOF
      {
        "connector.class": "FileStreamSink",
        "topics": "filestream",
        "file": "/tmp/output.json"
      }
      EOF
    x_example_outputs:
    - command: playground connector diff --connector filestream-sink --file customer-config.json
      output: |-
        17:22:05 ℹ️ 🔀 Diff of connector filestream-sink (➖) with customer-config.json (➕)
          ✏️  tasks.max
               ➖ 1
               ➕ 4
          ➕ errors.tolerance = all   (only in customer-config.json)
        17:22:05 ℹ️ 📊 2 key(s) differ, 6 identical
        17:22:05 ℹ️ ✅ HTML report saved: /tmp/playground-connector-diff/diff-filestream-sink-customer-config.json-20261013-172205.html
        17:22:05 ℹ️ 🔗 Open in browser: file:///tmp/playground-connector-diff/diff-filestream-sink-customer-config.json-20261013-172205.html

  - name: convert
    help: |-
      🔄 Convert a connector config from the format a customer sent to another one

      Reads the config in any of these formats (detected, --from to force
      one), and writes it in the format of --to:

        json          a plain config, the REST API format {"name": ...,
                      "config": {...}}, a dump of GET /connectors?expand=info
        heredoc       a 'playground connector create-or-update' heredoc, as
                      printed by show-config
        cfk           a CFK Connector custom resource (spec.class,
                      spec.taskMax, spec.configs)
        strimzi       a Strimzi KafkaConnector custom resource
        terraform     a confluent_connector resource (config_nonsensitive +
                      config_sensitive)
        properties    a connect-standalone .properties file

      The default, --to heredoc, is ready to paste in an example or a
      reproduction model. For heredoc and json, the config is adapted to the
      playground like 'playground connector create-or-update' does
      (--no-adapt to keep it as is). Masked secrets, config providers
      (${file:...}) and terraform references are listed; in a heredoc they
      become variables to export.

      The converted config is printed on stdout, the findings on stderr: the
      output can be redirected to a file.

      🎓 Tip: answer a customer in their own format, --to cfk or --to
      terraform, or compare their config with the running one with
      'playground connector diff --connector <c> --file <their file>' (any
      of these formats).

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-create-or-update
    args:
    - name: file
      required: false
      default: "-"
      help: path of the file with the config (@file works too); reads from stdin if empty
    flags:
    - *verbose
    - long: --connector
      short: -c
      required: false
      arg: connector
      help: |-
        🔗 Connector to pick when the file holds several (a dump of GET /connectors?expand=info, several custom resources or terraform resources)
    - long: --to
      short: -t
      required: false
      arg: format
      default: "heredoc"
      allowed: [heredoc, json, cfk, strimzi, terraform, properties]
      help: |-
        🎯 Output format (default: heredoc)
    - long: --from
      required: false
      arg: format
      default: "auto"
      allowed: [auto, json, heredoc, cfk, strimzi, terraform, properties]
      help: |-
        🔍 Input format (default: auto, detected from the content)
    - long: --name
      short: -n
      required: false
      arg: name
      help: |-
        🏷️ Name of the connector in the output (default: the name in the config)
    - long: --no-adapt
      required: false
      help: |-
        🧷 With --to heredoc or json, keep the config as it is (no rewrite of the bootstrap servers, schema registry, license, replication factors, client security)
    - long: --secrets-as-variables
      required: false
      help: |-
        🔐 Also turn the secret values written as they are (passwords, keys, tokens, JAAS configs) into variables to export, like the masked ones

        For --to heredoc (and the values to fill in of --json): the heredoc can then go in a script that is committed,
        like a reproduction model ('playground repro bootstrap --config' uses it).
    - long: --json
      required: false
      help: |-
        🤖 Print the detected format, the name, the config and the values to fill in as JSON
    examples:
    - playground connector convert customer-connector.yaml
    - playground connector convert customer-connector.yaml --secrets-as-variables
    - playground connector convert connectors.json --connector s3-sink --to json
    - playground connector convert connector.properties --to cfk
    - playground connector convert main.tf --to heredoc --no-adapt

  - name: error-recommendations
    filters:
    - ccloud_environment
    help: |-
      💡 Show error recommendations for fully managed connectors

      Confluent Cloud analyses the failure stack trace of a failed fully
      managed or custom connector and suggests remediation steps. Nothing is
      returned for a healthy connector, or for one that only failed config
      validation: 'playground connector status' shows those errors.
    flags:
    - *verbose
    - *connector
    examples:
    - playground connector error-recommendations --connector MySinkConnector

  - name: oracle-cdc-xstream
    help: |
      🅾️ Specific Oracle CDC Xstream commands

      With XStream, half of the interesting state lives in the database, not
      in Connect. A connector that shows RUNNING while no change arrives is
      almost always a capture process or an outbound server that is stuck on
      the Oracle side, and the connect logs say nothing about it.

        debug             query the XStream views from the Oracle container
        generate-report   run the official diagnostics script

      Only available when an oracle container is running. To analyze a report
      (also one sent by a customer), use 'playground analyze oracle-xstream-report'.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-oracle-cdc
    filters:
    - oracle_running
    commands:
    - name: generate-report
      help: |
        ⚙️ Generate and open oracle cdc xstream connector diagnostics

        Runs the diagnostics script Confluent support asks for, and opens the
        result. This is the file to attach to a case rather than pasting
        individual query outputs.

        🔎 'playground analyze oracle-xstream-report -c oracle' generates it and
        analyzes it in one go.

        See https://docs.confluent.io/kafka-connectors/oracle-xstream-cdc-source/current/troubleshooting.html#connector-diagnostics-script

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-oracle-cdc
    - name: debug
      help: |
        🐞 Execute various SQL commands to debug xstream components

        Runs a series of queries against the XStream views inside the oracle
        container and prints the results, with a link to the Oracle
        documentation of each view:

          capture processes   their status, SCN values and latencies
          redo logs           the files each capture process still needs
          outbound server     general state, current transaction, low position
          parameters          capture and apply settings actually in effect
          rules               the rules the XStream components are using

        Read it top to bottom when a connector is RUNNING but idle: a capture
        process not in CAPTURING CHANGES, or an SCN that never moves, tells
        you the problem is in the database and not in the connector.

        🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-oracle-cdc

  - name: smt
    help: |-
      🧪 Single message transforms (SMT)

        test                         apply a transform chain to a record, step by step

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-smt-test
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%94%80-what-does-this-transform-chain-do-to-a-record
    commands:
    - name: test
      help: |-
        🧪 Apply the transform chain (SMT) of a connector to a record, step by step

        Shows what each transform changes (topic, key, value, headers, schema field by field), the result of each predicate, a record dropped by a transform, and the transform that throws with its config and its error. No topic or connector is created: the chain runs in a small harness in the connect container, with the classpath and the plugin.path of the worker, so the transforms, predicates and converters are the same classes and versions as in the worker.

        The transforms come from a running connector (--connector) or from a connector config on stdin (or --config @file). The record is a json (--record): schemaless, or {"schema": ..., "payload": ...} like the JsonConverter for a record with a schema. Or a real record of a topic (--from-topic, --offset), converted with the converters of the connector (avro, protobuf, json schema with schema registry).

        --cp-version runs the same test with the built-in transforms of other CP versions (throwaway cp-server-connect containers), --smt-plugin installs a Confluent Hub plugin for the test only (the worker is not changed), --smt-jar adds a jar (custom SMT development).

        An html report of the steps (the value after each step with the added, changed and removed fields highlighted, the schema diff, the predicates, the error with its stack trace, and with --cp-version a comparison of the versions) is written to /tmp/playground-smt-test, and opened in the browser in an interactive terminal.

        🎓 Tip: the connector config can be a whole connector config: only transforms.*, predicates.* and the converters are used.
      filters:
      - docker_running
      flags:
      - *verbose
      - long: --connector
        short: -c
        arg: connector
        required: false
        completions:
          dynamic:
          - playground get-connector-list
        help: |-
          🔗 Use the transforms, predicates and converters of this running connector
      - long: --config
        arg: config
        required: false
        help: |-
          📄 Connector config with the transforms (json, or @file), instead of --connector or stdin
      - long: --record
        arg: record
        required: false
        help: |-
          🧾 Record to transform (json, or @file): {"topic": "orders", "key": ..., "value": ..., "headers": {...}, "timestamp": <ms>}

          key and value are schemaless json, or {"schema": ..., "payload": ...} for a record with a schema. Headers are typed like the SimpleHeaderConverter does (string, int64, float64, boolean, map, array), or {"schema": ..., "payload": ...}; give them as a list [{"key": ..., "value": ...}] for several headers with the same key. Default: a schemaless record with a value {"id": 1, "name": "foo"}
      - long: --from-topic
        arg: from-topic
        required: false
        completions:
          dynamic:
          - playground get-topic-list
        help: |-
          🗳 Read the record from this topic instead of --record, and convert it with the converters of the connector
      - long: --offset
        arg: offset
        validate: integer
        required: false
        default: "0"
        help: |-
          📍 Offset of the record with --from-topic (default is 0)
      - long: --partition
        arg: partition
        validate: integer
        required: false
        default: "0"
        help: |-
          🧩 Partition of the record with --from-topic (default is 0)
      - long: --type
        arg: type
        required: false
        allowed:
          - sink
          - source
        help: |-
          🔀 Build a sink or a source record (default: the type of --connector, sink otherwise)
      - long: --cp-version
        arg: cp-version
        required: false
        repeatable: true
        help: |-
          🔢 Run the test with the built-in transforms of these CP versions (repeat the flag), in throwaway cp-server-connect containers, to compare them. The plugins of the running worker are not available there, only --smt-plugin and --smt-jar
      - long: --smt-plugin
        arg: smt-plugin
        required: false
        repeatable: true
        help: |-
          🧩 Confluent Hub plugin with transforms, installed for the test only (owner/name:version), e.g. confluentinc/connect-transforms:1.6.2
      - long: --smt-jar
        arg: smt-jar
        required: false
        repeatable: true
        validate: file_exists
        help: |-
          ☕ Jar with transforms to add for the test (custom SMT development). Repeat it for the jars it depends on: they are loaded together, as one plugin
      - long: --json
        required: false
        help: |-
          📄 Print the steps as json
      - long: --no-open
        required: false
        help: |-
          🚫 Do not open the html report in the browser (it is still written, and its path printed)
      - *cluster
      examples:
      - playground connector smt test --connector filestream-sink
      - playground connector smt test --connector filestream-sink --record '{"topic":"filestream","key":"k1","value":{"id":1,"name":"foo"}}'
      - playground connector smt test --connector my-sink --from-topic orders --offset 42
      - playground connector smt test --record @record.json --config @transforms.json --cp-version 7.9.0 --cp-version 8.3.2
      - playground connector smt test --connector my-sink --smt-plugin confluentinc/connect-transforms:1.6.2

  - name: offsets
    help: |
      💈 Handle source and sink connectors offsets

      Where a connector is in its data: for a source, the position it keeps in
      the system it reads from (a SCN, a binlog position, a file offset); for a
      sink, the consumer group offsets of the topics it consumes.

        get                          show them
        alter                        edit them in your editor, then apply
        reset                        start over from the beginning
        get-offsets-request-status   did the last change go through

      This uses the first-class offsets API (KIP-875), so it needs CP 7.5 for
      get and CP 7.6 for alter and reset. On older CP the playground falls back
      to kafka-consumer-groups, which only covers sink connectors.

      The connector must not be running while its offsets change: alter and
      reset stop it and resume it for you.

      🎓 Tip: a sink that reprocesses everything and a source that re-snapshots
      are usually offsets problems, not connector problems. Look here first.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-offsets-and-lag
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%E2%8F%AA-the-lag-of-a-sink-is-stuck
    commands:
    - name: get
      help: |
        🏹 Get current offsets for source and sink connectors

        Prints the offsets json returned by the Connect REST API, or the
        Confluent Cloud offsets API for a fully managed connector. For a sink
        on CP older than 7.5, it falls back to kafka-consumer-groups
        --describe on the connect-<connector> consumer group.

        Run it before and after alter or reset to check what really moved.

        See https://docs.confluent.io/cloud/current/connectors/offsets.html
      flags:
      - *verbose
      - *connector
      - *cluster
      examples:
      - playground connector offsets get
      x_example_outputs:
      - command: playground connector offsets get
        output: |-
          17:22:15 ℹ️ 🏹 Getting offsets for 🌎onprem  connector filestream-sink
          {
            "offsets": [
              {
                "partition": {
                  "kafka_partition": 0,
                  "kafka_topic": "filestream"
                },
                "offset": {
                  "kafka_offset": 5
                }
              }
            ]
          }
    - name: reset
      help: |
        🆕 Reset offsets for source and sink connectors

        Wipes the recorded offsets so the connector starts over: a source
        re-reads its origin from the beginning, a sink re-consumes its topics
        from the earliest offset. The connector is stopped and resumed around
        the reset.

        ⚠️ Everything is reprocessed, so expect duplicates downstream unless
        the target is idempotent. Use alter when you only want to move back
        to a specific point.

        See https://docs.confluent.io/cloud/current/connectors/offsets.html
      flags:
      - *verbose
      - *connector
      - *cluster
    - name: alter
      help: |
        ⛏️ Alter offsets for source and sink connectors

        Fetches the current offsets, opens them in your editor, and applies
        what you saved once you close the file. That is how you rewind a sink
        to a given offset, or move a source back to an earlier position,
        without replaying everything.

        The connector is stopped before the change and resumed after it. On
        Confluent Cloud the change is asynchronous, so the command then polls
        get-offsets-request-status and prints the resulting offsets.

        See https://docs.confluent.io/cloud/current/connectors/offsets.html
      flags:
      - *verbose
      - *connector
      - *cluster
    - name: get-offsets-request-status
      help: |
        👁️‍🗨️ Get the status of the previous offset request

        On Confluent Cloud, alter and reset only queue a request. This shows
        whether it was APPLIED or FAILED, and the error when it failed, which
        is the only place the reason shows up.

        Only for fully managed and custom connectors, self managed connectors
        apply the change synchronously.

        See https://docs.confluent.io/cloud/current/connectors/offsets.html
      flags:
      - *verbose
      - *connector

  - name: plugins
    help: |-
      🎨 Show all connector plugins installed. You can also display transforms, converters and predicates using --all flag

      The first thing to check when a connector fails to be created with
      "Failed to find any class that implements Connector": the class you
      asked for is not in this list, so the plugin was not installed or not
      picked up from the plugin path.
    flags:
    - *verbose
    - long: --all
      required: false
      help: |-
        🌕 Show also transforms, converters, predicates available
    - *cluster

  - name: pause
    help: |-
      ⏸️  Pause connector

      Tasks stop processing but stay assigned, and the configuration is kept.
      Handy to let a backlog build up, or to freeze a connector while you
      change the system it talks to. Resume with 'playground connector resume'.
    flags:
    - *verbose
    - *connector
    - *cluster

  - name: versions
    help:  |
      🧞 Get current and latest versions available on Confluent Hub for connector(s) used in example

      Tells you in one line whether you are testing an outdated connector.
      To move to the version reported as latest, re-run the example with
      'playground update-version --connector-tag <version>'.

      For Confluent plugins, the last 5 versions come with their release notes
      (playground connector-plugin versions --with-changelog), and an outdated
      version with the playground connector-plugin changelog command that lists
      everything that changed since.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-run-and-versions
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%8E%AF-is-it-fixed-in-a-newer-version

  - name: sourcecode
    help: |
      🧑‍💻 open source code url for connector(s) used in example

      You can compare different sourcecode versions by specifying --connector-tag two times, in such case it will open github in comparison mode

      💌 Confluent employees only: for fully managed connectors, use the cc-connect image version for the pcc. You must have a Confluent Github token set with GITHUB_TOKEN or GH_TOKEN environment variable and also be using Confluent VPN.
    flags:
      - long: --only-show-url
        help: |-
          🌐 Only show url
      - long: --connector-tag
        arg: connector_tag
        repeatable: true
        required: false
        help: |- 
          🔗 Connector version to use

          By default, for each connector, the current version is used (for Confluent employees, it will also get latest versions for fully managed connectors)

          🎓 Tip: set to " " in order to select the version dynamically (for Confluent plugins, the preview shows the release notes of each version)

          🎓 Tip: you can compare different sourcecode versions by specifying --connector-tag two times, in such case it will open github in comparison mode
      - long: --compile
        required: false
        private: true
        # help: |-
        #   🏗️ Checkout and compile code

        #   You must have git installed.

        #   💌 Confluent employees only: make sure to follow "Maven FAQ", you also need to be on Confluent VPN with proper AWS credentials set in order to be able to download proprietary dependencies.

        #   ⚠️ This does not work for fully and custom connectors.
      - long: --compile-jdk-version
        required: false
        private: true
        needs: [--compile]
        arg: compile_jdk_version
        allowed: 
          - "8"
          - "11"
          - "17"
          - "21"
          - "25"
        help: |-
          🤎 JDK version to use when compiling
          It will check in pom.xml for maven-compiler-plugin source/target version or release version and set jdk accordingly
          Default is 11
      - long: --compile-verbose
        short: -v
        private: true
        needs: [--compile]
        help: 🐞 Show output of compilation.
      - long: --forced-url
        private: true
        needs: [--compile]
        help: 🔗 Set github url (to compile cp for example)
      - long: --enable-remote-debugging
        required: false
        private: true
        needs: [--compile]
        help: |-
          ✨ This will enable java remote debugging for connect container
      
          👉 Check documentation https://kafka-docker-playground.io/#/reusables?id=%e2%9c%a8-remote-debugging

          ⚠️ This does not work for fully and custom connectors.
    examples: |

      # will open current version source code for current running connector
      # if you're a confluent employee (make sure to set your aws credentials), it will also work on proprietary connectors and fully managed connectors
      playground connector sourcecode

      # will ask you to select a version
      playground connector sourcecode --connector-tag " "

      # comparison mode:
      playground connector sourcecode --connector-tag "10.2.1" --connector-tag "10.2.0"

      # comparison mode (with versions selection):
      playground connector sourcecode --connector-tag " " --connector-tag " "

  - name: enable-remote-debugging
    dependencies:
      git: visit https://docs.confluent.io/confluent-cli/current/overview.html to install
    help: |-
      ✨ Enable java remote debugging for the connector.

      👉 Check documentation https://kafka-docker-playground.io/#/reusables?id=%e2%9c%a8-remote-debugging

      🏗️ It will checkout (you need git installed) and compile code for the connector (required for remote debugging).

      💌 Confluent employees only: make sure to follow "Maven FAQ", you also need to be on Confluent VPN with proper AWS credentials set in order to be able to download proprietary dependencies.

      ⚠️ This does not work for fully and custom connectors.

  - name: disable-remote-debugging
    help: |-
      🛑 Disable java remote debugging for the connector.

  - name: restart
    help: |-
      ♻️  Restart connector

      The usual way to recover a connector whose tasks are FAILED after you
      fixed the cause. Use --task-id to restart a single failed task and leave
      the healthy ones alone, or --only-failed to restart only what is FAILED,
      in every connector when --connector is not set.
    flags:
    - *verbose
    - *connector
    - long: --task-id
      short: -t
      arg: task_id
      validate: integer
      required: false
      conflicts: [--only-failed]
      help: |-
        🔧 Restart specific task ID only (instead of restarting entire connector)
    - long: --only-failed
      required: false
      conflicts: [--task-id]
      help: |-
        🩹 Restart only the connector instances and tasks that are FAILED, and leave the RUNNING ones alone

        A connector with nothing FAILED is skipped. Uses the KIP-745 REST call
        (restart?includeTasks=true&onlyFailed=true, CP 7.0+); with older CP
        versions and fully managed connectors, restarts each FAILED task one by one.
    - *cluster
    examples:
    - playground connector restart
    - playground connector restart --connector filestream-sink --task-id 0
    - playground connector restart --only-failed

  - name: tasks
    help: |-
      🧵 Show the tasks of a connector: state, worker, config and partitions

      Answers "why does task 0 get all the tables, partitions or files?" and
      "which worker runs which task after a rebalance?":

        state and worker    of each task (/status), with a per-worker summary
                            when there are several connect workers
        task config         the keys whose value differs between the tasks,
                            or from the connector config: this is how a
                            connector splits its work (tables of a JDBC
                            source, task.id, files...). --all-keys for the
                            whole config of each task
        partitions          for a sink, the topic partitions assigned to each
                            task, from its consumer group connect-<connector>

      🎓 Tip: 'tasks.max' is a maximum, a source connector can create fewer
      tasks (one JDBC task per table at most).

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-troubleshooting
    flags:
    - *verbose
    - *connector
    - long: --all-keys
      required: false
      help: |-
        📜 Show the whole config of each task, not only the keys that differ
    - long: --json
      required: false
      help: |-
        🤖 Print the result as JSON
    - *cluster
    examples:
    - playground connector tasks
    - playground connector tasks --connector jdbc-source --all-keys
    - playground connector tasks --connector filestream-sink --json

  - name: topics
    help: |-
      📚 Show the topics a connector is using, or reset that list

      The active topics of each connector, as tracked by the worker (KIP-558):
      the topics a source connector has written to, and the topics a sink
      connector has consumed from (useful with topics.regex). The list only
      grows while the connector runs: --reset empties it, and it fills again
      with the topics used from then on.

      🎓 Tip: feed the result to 'playground topic consume --topic <t>' or
      'playground topic dlq inspect'.

      ⚠️ Self-managed connectors only (CP 5.5+, topic.tracking.enable=true on
      the worker, the default). --reset also needs
      topic.tracking.allow.reset=true on the worker (the default).
    flags:
    - *verbose
    - *connector
    - long: --reset
      required: false
      conflicts: [--json]
      help: |-
        🧹 Empty the list of active topics of the connector (PUT /connectors/<connector>/topics/reset)
    - long: --json
      required: false
      conflicts: [--reset]
      help: |-
        🤖 Print the result as JSON
    - *cluster
    examples:
    - playground connector topics
    - playground connector topics --connector s3-sink --json
    - playground connector topics --connector s3-sink --reset

  - name: stop
    help: |-
      🛑 Stop connector (only available if CP > 7.5)

      Stronger than pause: the tasks are shut down and unassigned, so the
      connector consumes no resources at all. This is the state in which
      offsets can be altered or reset.
    flags:
    - *verbose
    - *connector
    - *cluster

  - name: resume
    alias: unpause
    help: |-
      ⏯️  Resume connector

      Restarts processing after a pause or a stop, from the offsets where the
      connector left off.
    flags:
    - *verbose
    - *connector
    - *cluster

  - name: delete
    help: |-
      🗑️  Delete connector

      Removes the connector and its configuration. Its offsets survive in the
      Kafka internal topics, so re-creating it under the same name resumes
      where it stopped rather than starting over.

      For a fully managed or custom connector, the topics the connector
      created on its own are deleted as well: dead letter queue and, for
      connectors with a reporter, success and error topics (dlq-lcc-xxxx,
      success-lcc-xxxx, error-lcc-xxxx, or the names set in the config with
      errors.deadletterqueue.topic.name, reporter.error.topic.name and
      reporter.result.topic.name). Keep them with --keep-related-topics.
    flags:
    - *verbose
    - *connector
    - long: --keep-related-topics
      help: |-
        🔰 Do not delete the dlq, success and error topics of a fully managed or custom connector
    - *cluster

  - name: diagnose
    help: |-
      🩺 Diagnose a connector in one call: status, errors and progress

      Chains the commands you would run one after the other when a connector
      misbehaves, and returns:

        🗺️  status       connector and task states, with the trace of a failed task
        🔥 errors       digest of the connect ERROR/FATAL records (self-managed),
                        or Confluent Cloud error recommendations (fully managed)
        🐢 progress     consumer lag of a sink (its committed offsets when a task is not
                        RUNNING), or offsets of a source
        👉 next steps   the commands to dig further

      It never follows logs and never waits for the lag to reach 0, so it is
      safe to use from scripts and AI agents.

      🌐 Also writes a self-contained HTML report in --output-dir, to attach to a case, opened in the browser in an interactive terminal (--no-open to skip): verdict, findings, status and traces of the tasks, error records naming the connector, lag per partition or offsets, next steps, and the configuration (secrets masked).

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-troubleshooting
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%A9%BA-a-sink-is-running-but-writes-nothing
    flags:
    - *verbose
    - *connector
    - long: --since
      arg: since
      required: false
      default: "1h"
      help: |-
        🕐 Only look at connect logs newer than this (default 1h). Docker durations: 10m, 2h... (self-managed only)
    - long: --max-findings
      arg: max_findings
      required: false
      validate: integer
      default: "15"
      help: |-
        ✂️ Maximum number of distinct error records to show (default 15). The HTML report has them all
    - long: --output-dir
      short: -o
      arg: output_dir
      required: false
      default: "/tmp/playground-diagnose"
      help: |-
        📂 Output directory for the HTML report (default: /tmp/playground-diagnose)
    - long: --no-open
      required: false
      help: |-
        🙈 Do not open the HTML report in the browser
    - *cluster
    examples:
    - playground connector diagnose
    - playground connector diagnose --connector http-sink
    - playground connector diagnose --connector http-sink --since 10m --max-findings 5
    - playground connector diagnose --connector http-sink --output-dir ./case-123456 --no-open
    x_example_outputs:
    - command: playground connector diagnose
      output: |-
        17:22:06 ℹ️ 🩺 diagnosing 🌎onprem connector filestream-sink

        17:22:06 ℹ️ 🗺️  1/4 status
        17:22:07 ℹ️ 🧩 Displaying status for 🌎onprem connector filestream-sink
        Name                           Status       Tasks                                                        Stack Trace
        -------------------------------------------------------------------------------------------------------------
        filestream-sink                ✅ RUNNING  0:🟢 RUNNING                 -
        -------------------------------------------------------------------------------------------------------------

        17:22:07 ℹ️ 🔥 2/4 errors: digest of connect ERROR/FATAL records since 1h (whole worker, not only this connector)
        ✅ no ERROR/FATAL record found in 12523 lines

        17:22:07 ℹ️ 🐢 3/4 progress: consumer lag of sink filestream-sink
        topic: filestream partition: 0   current-offset: 5          end-offset: 5          lag: 0          [🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹] 100% 🏁

        17:22:10 ℹ️ 👉 4/4 next steps
           🐌 RUNNING but no progress? run this command again, then take a thread dump if lag or offsets do not move
           playground connector show-config --connector filestream-sink
           playground container logs -c connect --grep "filestream-sink" --no-follow --tail 200
           playground debug log-level set --package <connector package> --level TRACE
           playground debug thread-dump --container connect

        17:22:10 ℹ️ ✅ HTML report saved: /tmp/playground-diagnose/connector-diagnose-filestream-sink-20261013-172210.html
        17:22:10 ℹ️ 🔗 Open in browser: file:///tmp/playground-diagnose/connector-diagnose-filestream-sink-20261013-172210.html
    footer: |-
      Example output:
        $ playground connector diagnose
        17:22:06 ℹ️ 🩺 diagnosing 🌎onprem connector filestream-sink

        17:22:06 ℹ️ 🗺️  1/4 status
        17:22:07 ℹ️ 🧩 Displaying status for 🌎onprem connector filestream-sink
        Name                           Status       Tasks                                                        Stack Trace
        -------------------------------------------------------------------------------------------------------------
        filestream-sink                ✅ RUNNING  0:🟢 RUNNING                 -
        -------------------------------------------------------------------------------------------------------------

        17:22:07 ℹ️ 🔥 2/4 errors: digest of connect ERROR/FATAL records since 1h (whole worker, not only this connector)
        ✅ no ERROR/FATAL record found in 12523 lines

        17:22:07 ℹ️ 🐢 3/4 progress: consumer lag of sink filestream-sink
        topic: filestream partition: 0   current-offset: 5          end-offset: 5          lag: 0          [🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹] 100% 🏁

        17:22:10 ℹ️ 👉 4/4 next steps
           🐌 RUNNING but no progress? run this command again, then take a thread dump if lag or offsets do not move
           playground connector show-config --connector filestream-sink
           playground container logs -c connect --grep "filestream-sink" --no-follow --tail 200
           playground debug log-level set --package <connector package> --level TRACE
           playground debug thread-dump --container connect

        17:22:10 ℹ️ ✅ HTML report saved: /tmp/playground-diagnose/connector-diagnose-filestream-sink-20261013-172210.html
        17:22:10 ℹ️ 🔗 Open in browser: file:///tmp/playground-diagnose/connector-diagnose-filestream-sink-20261013-172210.html

  - name: history
    help: |-
      🕰️ Show the history of a connector: state changes, failures, restarts and config changes

      Answers "when did it fail? how many times was it restarted? on which
      worker? what changed in the config just before?", hours after the
      fact, when 'playground connector status' only shows the current state.

      Reads the internal topics of the connect cluster, one timeline per
      connector:

        connect-status    every state of the connector and of each task
                          (RUNNING, FAILED with the first line of the trace,
                          PAUSED, UNASSIGNED...), the worker and generation,
                          and the first time each topic was used
        connect-configs   creation, each config change (keys added, removed,
                          changed), task configs committed, pause / stop /
                          resume, deletion

      Ends with a summary: failures per task, restarts, config changes and
      the current state with its age. Secrets in the configs are masked.

      🎓 Tip: works for deleted connectors too (--connector <name>), and
      --since 1h keeps the recent events.

      ⚠️ These topics are compacted: on a long-running cluster, old states
      are gone, only the last one of each connector and task is kept for
      sure. Self-managed connectors only (the topic names are read from the
      worker properties, --config-topic and --status-topic to override them).

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-troubleshooting
    flags:
    - *verbose
    - long: --connector
      short: -c
      required: false
      arg: connector
      completions:
        dynamic:
        - playground get-connector-list
      help: |-
        🔗 Connector name, running or deleted

        🎓 Tip: If not specified, the command will apply to all connectors found in the internal topics
    - long: --since
      arg: since
      required: false
      validate: duration
      help: |-
        ⏱️ Only show the events of the last <since> (30s, 10m, 2h)
    - long: --config-topic
      arg: config_topic
      required: false
      help: |-
        🗂️ Config topic of the connect cluster (default: config.storage.topic of the worker, connect-configs)
    - long: --status-topic
      arg: status_topic
      required: false
      help: |-
        🗂️ Status topic of the connect cluster (default: status.storage.topic of the worker, connect-status)
    - long: --json
      required: false
      help: |-
        🤖 Print the events and the summary as JSON
    - *cluster
    examples:
    - playground connector history
    - playground connector history --connector jdbc-sink --since 1h
    - playground connector history --connector jdbc-sink --json

  - name: show-lag
    help: |
      🐢 Show lag of sink connector

      The consumer lag of the sink, refreshed every --interval seconds, so you
      see whether it is catching up, standing still or falling behind. A lag
      that does not move while the connector reports RUNNING means the tasks
      are stuck rather than slow.

      It will run until all lag becomes 0 (press ctrl-c to exit)

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-offsets-and-lag
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%E2%8F%AA-the-lag-of-a-sink-is-stuck
    flags:
    - *verbose
    - *connector
    - long: --interval
      arg: interval
      validate: integer
      required: false
      default: "20"
      help: |-
        Interval between lag checks (default is 20 seconds).
    - long: --max-wait
      arg: max_wait
      validate: integer
      default: "0"
      help: |- 
        ⏳ Max time in seconds to wait for lag to become 0. If set to 0 (default), it will run until all lag becomes 0.
    - *cluster
    examples:
    - playground connector show-lag
    x_example_outputs:
    - command: playground connector show-lag
      output: |-
        17:22:14 ℹ️ 🏁 consumer lag for 🌎onprem connector filestream-sink is 0 ! took: 0min 2sec
        topic: filestream partition: 0   current-offset: 5          end-offset: 5          lag: 0          [🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹🔹] 100% 🏁

  - name: benchmark
    help: |-
      🏎️ Benchmark the throughput of a connector

      Measures how many records per second a running self managed connector
      processes, so that two runs can be compared: another --connector-tag,
      another batch size, another number of tasks. Everything runs on one
      docker host, so the numbers are relative: compare runs on the same
      machine only.

      🎓 Tip: playground run --benchmark runs it right after the example (also
      a toggle in the playground run menu).

      --mode drain (default) pauses the connector, loads a backlog of
      --nb-records, resumes the connector and measures the time it takes to
      process the backlog. This is the most reproducible number, since it does
      not depend on how fast the load is generated.

      --mode steady measures the throughput during --duration (after
      --warmup), while --stream-load-command runs in the background. When the
      connector simply keeps up with the load (consumer lag of a sink, records
      generated by the load of a source), the summary says so: the result is
      then the speed of the load, not of the connector.

      ⏱️ For a source connector, --mode steady also measures the end-to-end
      latency of the records: kafka record timestamp - time of the change in
      the source system (a field of the value). After the measure, the
      benchmark reads the records written to the topics of the connector
      during it (all of them up to 100000, a sample spread over the measure
      otherwise), and the summary, the result json and the report give its
      p50 / p95 / p99 / max (over time, distribution, slowest records), also
      in the comparable runs and the --connector-tag comparisons. When the
      connector simply keeps up with the load, this is the number to compare.
      The field is --latency-field, or the one the load writes the time of
      the change to (create_ts of the CUSTOMERS table, update_ts with --shape
      update), or source.ts_ms of a CDC envelope (commit time in the
      database), or wallTime / clusterTime of a MongoDB change event. It is
      not measured in a drain, where the latency of a record is the time it
      waited in the backlog.

      The load comes from the example:

        - sink connectors: the 'playground topic produce' of the example
          script that feeds the connector is replayed with --nb-messages
          <n> (same schema, key and headers), so every sink example that
          produces its data works without anything else
        - source connectors: benchmark-load.bash next to the example
          script, called with --records <n> --mode preload|stream --shape
          bulk|small-txn|update (rows in the CUSTOMERS table for the
          postgres, mysql, oracle and sql server examples, documents for
          mongodb, messages for ibm mq, mqtt, activemq, sqs, kinesis,
          pub/sub and cloudwatch logs, files for spool dir, filepulse,
          filestream, sftp, ftps, hdfs 2 / 3 and the generalized s3, gcs and
          azure blob storage sources, see the README of the example). It is
          called with --check first, so that an unsupported
          combination fails before the connector is paused
        - or --load-command / --stream-load-command, which take precedence

      BENCHMARK_LOAD_SCRIPT=<file> uses another load script than
      benchmark-load.bash: a file name in the folder of the example (or an
      absolute path), e.g. one per reproduction model named after its ticket
      (BENCHMARK_LOAD_SCRIPT=benchmark-load-123456.bash). It takes the same
      arguments, and --enable-sql-datagen uses it too.

      Throughput is read from the connect JMX metrics of the tasks
      (sink-record-read-total: records read from kafka, including the ones
      filtered or sent to the dlq; source-record-write-total), sampled every
      --interval. Results are written to --output-dir (samples csv, result
      json and an html report with the charts, opened in the browser at the
      end in an interactive terminal) and appended to the benchmark-history
      file, and the summary compares them with the previous benchmark of the
      same connector in the same example (or with --compare <result json>).

      Each result records the setup it ran on (host cpu and memory, container
      engine resources, connect image and whether it is emulated, jvm and
      heap, number of workers and brokers, environment, connector config with
      secrets masked): the report shows it, and the summary warns when the
      previous run was on a different setup.

      🛩️ The connect workers are recorded with Java Flight Recorder during
      the measure (over JMX: the cp images have no jcmd, nothing is
      restarted), and the report and the summary say where the time of the
      task threads went: running, blocked on the system behind the
      connector, in the Kafka client, locks, waits; the CPU by layer
      (connector, converters, SMTs, Kafka client, libraries, logging), hot
      methods, allocation, GC, exceptions, with findings and next steps.
      With --connector-tag, the versions are compared the same way. The
      recording costs a few % of throughput: --no-flight-recorder disables
      it, and the summary warns when the previous run was not recorded the
      same way. The .jfr files are kept in --output-dir (JDK Mission
      Control, or playground analyze flight-recorder).

      📊 When Grafana runs (example started with --enable-jmx-grafana,
      or --enable-sql-datagen), the measure is annotated on the Kafka
      Connect, connector (Debezium, Oracle CDC, XStream, MongoDB) and
      Kafka cluster dashboards, and the summary and the report link to
      them at the time of the run (each version is annotated with
      --connector-tag). Grafana is not started by the benchmark: its
      JMX exporter and containers use CPU, and the summary warns when
      the previous run was not measured the same way.

      ☁️ Fully managed source connectors (ccloud/fm-*-source examples that
      ship a benchmark-load.bash, the one of the equivalent self managed
      example: same local database or broker, reached by the connector
      through ngrok): the records are counted from the end offsets of the
      topics of the connector every --interval (its kafka.topic or
      topic.prefix, and the topics consumed by the example script,
      --topic to choose them), since Confluent Cloud gives no JMX: no batch
      time, running ratio, cpu, gc, flight recorder nor --connector-tag.
      A drain starts measuring at the first records seen after the resume
      (Confluent Cloud takes a few seconds to restart the tasks, and its
      status lags behind them), so the records seen by that first sample
      are not measured. The throughput includes the network between the
      docker host and Confluent Cloud. Run the example and answer n when it asks to
      delete the connector, then run the benchmark.

      ☁️ Fully managed sink connectors: the load is the replay of the
      'playground topic produce' of the example, like for a self managed
      sink, and the records are counted from the offsets committed by the
      consumer group of the connector (connect-<lcc id>). Confluent Cloud
      commits them about every minute, so the end of a drain is known
      within one commit interval: a drain that sees less than 5 commits
      is reported as a lower bound, and the summary gives the
      --nb-records of a drain of 10 commits (within ~10%, usually 1M
      records or more).

      📈 After the measure of a fully managed connector, the benchmark
      reads its per minute metrics in the Confluent Cloud Metrics API
      (sent_records / received_records, exact counts published about 30s
      into each minute): the steady throughput is the median of the full
      minutes of the measure (a drain of 3 minutes or more has one), which
      does not depend on when a sink commits its offsets, and the put batch
      time, batch size and dlq records fill the rows that JMX gives for a
      self managed connector. The Metrics API uses the Cloud API key
      (CONFLUENT_CLOUD_API_KEY) and does not answer for a deleted connector.

      ⚠️ Not available with the cfk environment yet.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-benchmark
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%93%88-is-version-y-slower-benchmark-two-versions
    environment_variables:
    - name: BENCHMARK_LOAD_SCRIPT
      help: "📜 Load script to use instead of benchmark-load.bash: a file of the example folder, or an absolute path"
    - name: BENCHMARK_MATRIX_CHILD
      private: true
      help: "Set for the child runs of --shape / --connector-tag matrices (internal)"
    - name: BENCHMARK_MATRIX_RESULTS
      private: true
      help: "File where a child run appends its result file (internal)"
    - name: BENCHMARK_NO_OPEN
      private: true
      help: "Do not open the HTML report in a browser (internal)"
    filters:
    - connect_running
    flags:
    - *verbose
    - long: --connector
      short: -c
      required: false
      arg: connector
      completions:
        dynamic:
        - playground get-connector-list
      help: |-
        🔗 Connector name

        🎓 Tip: not needed when only one connector is running
    - long: --mode
      arg: mode
      required: false
      default: "drain"
      allowed:
        - drain
        - steady
      help: |-
        🏁 drain (time to process a backlog of --nb-records) or steady (throughput during --duration)
    - long: --nb-records
      arg: nb-records
      validate: integer
      required: false
      default: "100000"
      help: |-
        💯 Number of records of the backlog in drain mode (default is 100000)
    - long: --shape
      arg: shape
      required: false
      default: "bulk"
      completions:
        dynamic:
        - printf '%s\n' bulk small-txn update delete bulk,update,delete small-txn,update,delete
      help: |-
        🧱 Shape of the load, passed to benchmark-load.bash (default is bulk)

        - bulk: one transaction with all the records
        - small-txn: one transaction per record
        - update: updates existing records
        - delete: deletes existing records (drain only; not for a JDBC source, which does not capture deletes; with Debezium or XStream, each deleted row also gives a tombstone, unless tombstones.on.delete=false)

        A sequence of shapes, e.g. bulk,update,delete, runs one drain per shape on the same rows (insert, update, then delete them) and compares the phases in the summary and the report. Drain of a source connector only.
    - long: --record-size
      arg: record-size
      validate: integer
      required: false
      default: "0"
      help: |-
        🏋️ Record size in bytes, passed to benchmark-load.bash (default is 0: size given by the load)
    - long: --load-command
      arg: load-command
      required: false
      help: |-
        📥 Command that loads the backlog in drain mode, instead of benchmark-load.bash (or of the replayed produce of a sink)

        It runs with bash -c, from the current directory, while the connector is paused. It must create the records and return: --nb-records is then the number of records the connector should process, unless the command prints a line BENCHMARK_RECORDS=<n>.

        Examples:

          # sink: 1M records in the topic of the connector (use the schema of its records)
          --nb-records 1000000 --load-command "playground topic produce -t my-topic --nb-messages 1000000 --value @predefined-schemas/avro/customer.avsc"

          # source: your own script, which inserts the rows and prints BENCHMARK_RECORDS=<n>
          --load-command "./load-my-table.sh 500000"
    - long: --stream-load-command
      arg: stream-load-command
      required: false
      help: |-
        🌊 Command that generates load continuously in steady mode, instead of benchmark-load.bash (or of the replayed produce of a sink)

        It runs in the background with bash -c, from the current directory. At the end of the measure, the file named by the BENCHMARK_STOP_FILE environment variable is created: the command should stop at the end of its current batch when it exists. It is killed after 120s otherwise, and killing a producer in the middle of a batch can send a truncated record to the topic. If it prints BENCHMARK_BATCH=<records> <epoch seconds> after each batch, the summary tells when the connector only kept up with the load.

        Example, batches of 10000 records in the topic of the connector until the end of the measure:

          --stream-load-command 'while [ ! -f "\$BENCHMARK_STOP_FILE" ]; do playground topic produce -t my-topic --nb-messages 10000 --value @predefined-schemas/avro/customer.avsc; echo "BENCHMARK_BATCH=10000 \$(date +%s)"; done'

        A line BENCHMARK_LATENCY_FIELD=<field> tells which field of the records of a source holds the time of the change, for the end-to-end latency (see --latency-field).
    - long: --topic
      short: -t
      arg: topic
      required: false
      repeatable: true
      completions:
        dynamic:
        - playground get-topic-list
      help: |-
        🗳 Topics to count records in at the end of a drain, to check the result of a source connector (default is the topics of the connector)
    - long: --duration
      arg: duration
      validate: duration
      required: false
      default: "5m"
      help: |-
        ⏱️ Duration of the measure in steady mode, in seconds or with a s/m/h suffix (default is 5m)
    - long: --warmup
      arg: warmup
      validate: duration
      required: false
      default: "30s"
      help: |-
        🔥 Time excluded from the measure at the beginning in steady mode (default is 30s)
    - long: --interval
      arg: interval
      validate: duration
      required: false
      default: "5s"
      help: |-
        🔁 Interval between samples (default is 5s)
    - long: --max-wait
      arg: max-wait
      validate: duration
      required: false
      default: "30m"
      help: |-
        ⏳ Max time to wait for the backlog to be processed in drain mode (default is 30m)
    - long: --connector-tag
      arg: connector-tag
      required: false
      repeatable: true
      help: |-
        🧩 Benchmark these versions of the connector plugin one after the other (repeat the flag), and compare them

        For each version: playground update-version --connector-tag (only the connect container is restarted, the connector and its offsets are kept), check that the connector runs the requested version, an untimed warm-up drain (the worker jvm was restarted), then the benchmark. The original version is restored at the end, and the summary and the report compare the versions.

        Example: --connector-tag 10.8.4 --connector-tag 10.9.9

        ⚠️ A downgrade or a major version change can be incompatible with the offsets or the config of the connector: the benchmark stops at the first FAILED state.
    - long: --rounds
      arg: rounds
      validate: integer
      required: false
      default: "1"
      help: |-
        🔁 With --connector-tag, number of rounds over the versions (default is 1): 2 alternates them (A B A B), which shows a drift from one run to the next
    - long: --output-dir
      arg: output-dir
      required: false
      default: "/tmp/playground-benchmark"
      help: |-
        📂 Folder for the samples csv, the result json and the html report (default is /tmp/playground-benchmark)
    - long: --compare
      arg: compare
      validate: file_exists
      required: false
      help: |-
        ⚖️ Result json of a previous benchmark to compare with (default is the previous benchmark of the same connector in the same example, from the benchmark-history file)
    - long: --no-history
      required: false
      help: |-
        🙈 Do not append the result to the benchmark-history file
    - long: --sessions
      arg: sessions
      validate: integer
      required: false
      default: "1"
      help: |-
        🧵 Run the benchmark-load.bash of the example in <sessions> parallel sessions (default is 1)

        A drain splits --nb-records between them, steady mode gives each session batches of --nb-records. Concurrent transactions are what a busy database looks like to a CDC connector (interleaved transactions in the redo log or the WAL, several open transactions). Only with the benchmark-load.bash of the example, not with --load-command.
    - long: --no-flight-recorder
      required: false
      help: |-
        🛩️ Do not record the connect workers with Java Flight Recorder during the measure (no "where the time goes" section in the report)

        The recording costs a few % of throughput: compare runs recorded the same way.
    - long: --latency-field
      arg: latency-field
      required: false
      conflicts: [--no-latency]
      help: |-
        ⏱️ Field of the records of a source connector that holds the time of the change in the source system, for the end-to-end latency measured in --mode steady (kafka record timestamp - this field)

        A dotted path for a nested field (after.create_ts, source.ts_ms), matched case insensitively, through avro unions. Its value can be an epoch in s, ms, µs or ns, an ISO-8601 string, or a MongoDB date or timestamp.

        Default: the field the load writes the time of the change to (BENCHMARK_LATENCY_FIELD printed by benchmark-load.bash: create_ts of the CUSTOMERS table, update_ts with --shape update), otherwise source.ts_ms of a CDC envelope (commit time in the database), wallTime or clusterTime of a MongoDB change event.

        🎓 Tip: use a column with milliseconds (TIMESTAMP(3)), and --shape small-txn: with --shape bulk, a default CURRENT_TIMESTAMP is the start of the transaction of the whole batch.
    - long: --no-latency
      required: false
      conflicts: [--latency-field]
      help: |-
        🙈 Do not measure the end-to-end latency of a source connector in --mode steady (it reads the records of the measure after it)
    - long: --json
      required: false
      help: |-
        📄 Print the result as json instead of the summary
    examples:
    - playground connector benchmark --connector filestream-sink --nb-records 3000000
    - playground connector benchmark --connector jdbc-postgres-source --nb-records 1000000 --shape small-txn
    - playground connector benchmark --mode steady --duration 2m --warmup 20s
    - playground connector benchmark --connector debezium-postgres-source --mode steady --duration 2m --shape small-txn --latency-field after.create_ts
    - playground connector benchmark --nb-records 1000000 --load-command "playground topic produce -t my-topic --nb-messages 1000000 --value @predefined-schemas/avro/customer.avsc"
    - playground connector benchmark --mode steady --duration 2m --stream-load-command 'while [ ! -f "\$BENCHMARK_STOP_FILE" ]; do playground topic produce -t my-topic --nb-messages 10000 --value @predefined-schemas/avro/customer.avsc; echo "BENCHMARK_BATCH=10000 \$(date +%s)"; done'
    - playground connector benchmark --load-command "./my-load.sh" --json
    - playground connector benchmark --nb-records 1000000 --connector-tag 10.8.4 --connector-tag 10.9.9 --rounds 2
    - playground connector benchmark --nb-records 1000000 --no-flight-recorder
    - playground connector benchmark --nb-records 1000000 --shape small-txn --sessions 5
    - playground connector benchmark --nb-records 500000 --shape bulk,update,delete

  - name: show-config
    help:  |
      🧰 Show current connector config that was applied
      
      use --force-rest-endpoint to get results with REST API /config endpoint (https://docs.confluent.io/platform/current/connect/references/restapi.html#get--connectors-(string-name)-config)
    flags:
    - *verbose
    - *connector
    - &noclipboard
      long: --no-clipboard
      required: false
      private: true
      help: |-
        do not copy to clipboard (internal)
    - long: --force-rest-endpoint
      required: false
      help: |-
        ☢️ Force using REST API /config endpoint (https://docs.confluent.io/platform/current/connect/references/restapi.html#get--connectors-(string-name)-config)
    - *cluster

  - name: show-config-parameters
    help: |-
      🔩 Show all possible configuration parameters of connector

      The full reference of what the plugin accepts, with types, defaults,
      importance and documentation, read from the plugin itself rather than
      from the website. Use it to check the exact spelling of a property, or
      to discover the knob you need.

      Use --open to read it in your editor, --only-show-json to get it as
      json.
    flags:
    - *verbose
    - *connector
    - long: --open
      short: -o
      help: |- 
        🔖 Save output to a file and open with text editor set with playground config editor <editor> (default is code)
    - *force_refresh
    -  &only_show_file_path
      long: --only-show-file-path
      required: false
      private: true
      help: |-
        📂 Only show the path of the file containing the configuration parameters
    - &only_show_json
      long: --only-show-json
      required: false
      help: |-
        📗 Only show list of all available parameters for connector (with default value when applicable)
    -  &only_show_json_file_path
      long: --only-show-json-file-path
      required: false
      private: true
      help: |-
        📂 Only show the path of the json file containing the configuration parameters
    - *cluster

  - name: metrics
    help: |-
      📈 Show the metrics of a connector: throughput, time, errors, and the metrics of the connector itself

      Answers "is it making progress?", "how many records were tolerated,
      skipped, retried or sent to the dead letter queue?" and "where does
      the time go, poll or put?", one column per task:

        throughput   records polled / written per second (source), read /
                     sent per second (sink), and the totals since the task
                     started
        time         average time of a poll (source) or a put (sink) batch,
                     offset commit time and failures, running / pause ratio
        errors       records that failed, were skipped (errors.tolerance=all),
                     retried or sent to the DLQ, last error time

        connector    the other MBeans of the connector: Debezium
                     (debezium.<plugin>:server=<topic.prefix>, also Oracle
                     XStream), MongoDB, Oracle CDC... any MBean with a
                     connector=<connector> key

      Ends with what stands out (errors, skipped records, a slow put, a task
      that never got a record, a Debezium connector lagging, disconnected,
      with a full queue or snapshotting) and the command to run next. Rates
      are the averages Kafka Connect computes over its last samples (about 1
      minute).

      Read over JMX from the connect worker(s) running the tasks, with the
      kafka-jmx tool of the connect image: no restart, nothing to install.
      For a fully managed connector, the metrics come from the Confluent
      Cloud Telemetry API ('playground connector display-metrics-api').

      🎓 Tip: use --watch 10s while a load runs, or 'playground connector
      benchmark' to measure the throughput.

      ⚠️ Not on cfk environments: use 'playground get-jmx-metrics -c connect-0
      --domain kafka.connect'.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-troubleshooting
    flags:
    - *verbose
    - *connector
    - long: --watch
      short: -w
      arg: interval
      required: false
      validate: duration
      help: |-
        🔁 Refresh every <interval> (30, 30s, 5m) until ctrl-c
    - long: --json
      required: false
      conflicts: [--watch]
      help: |-
        🤖 Print the result as JSON
    examples:
    - playground connector metrics
    - playground connector metrics --connector jdbc-sink --watch 10s
    - playground connector metrics --connector jdbc-sink --json

  - name: display-metrics-api
    help: |-
      〽️ Display metrics api for fully managed connector

      Queries the Confluent Cloud Telemetry API for the connector: a summary
      with the connector and task statuses, then every metric that is not
      zero. A fully managed connector gives you no jmx and little logging, so
      this is how you tell whether it is actually doing work.

      See https://api.telemetry.confluent.cloud/docs/descriptors/datasets/cloud
    flags:
    - *connector
    - long: --open
      short: -o
      help: |-
        🔖 Save output to a file and open with text editor set with playground config editor <editor> (default is code)
    - *verbose

  - name: display-metrics-api-with-grafana
    help: |-
      📊 Display metrics api for fully managed connector in Grafana dashboard

      Same metrics as display-metrics-api, but plotted over time in Grafana
      instead of printed once. Use it when you need to see a trend, a spike or
      the moment throughput dropped, rather than the current value.

      It starts its own prometheus and grafana containers with a dashboard
      already provisioned, so there is nothing to enable beforehand and it
      does not interfere with the grafana of the example.

      Not supported for custom connectors.
    flags:
    - *connector

  - name: select-config
    help: |-
      🗜️ Easily select config from all possible configuration parameters of connector

      An fzf picker over everything the plugin accepts. Type a few letters,
      pick the properties you want and they are printed, with their default
      value when there is one, ready to paste into a connector configuration.
      On macOS they are copied to your clipboard as well.

      Faster than show-config-parameters when you already know roughly what
      you are after and just want the exact property names.

      🎓 Tip: use <tab> to select multiple config at once, then press <enter> to confirm
    dependencies:
      fzf: visit https://github.com/junegunn/fzf#installation to install
    flags:
    - *connector

  - name: snippets
    help: |-
      🔌 useful snippets

      Prints ready-to-paste blocks of connector configuration: the key and
      value converter properties for a given format with --converter, and the
      dead letter queue properties with --dlq. Saves you from looking up the
      exact property names and the schema registry settings that go with them.
    flags:
    - long: --converter
      required: false
      arg: converter
      allowed: 
        - avro
        - protobuf
        - json-schema
        - json
        - json-schema-enabled
        - string
        - bytearray
      help: |-
        🔌 Converter
    - long: --dlq
      required: false
      help: |- 
        💀 dlq
    examples: |
      playground connector snippets --converter avro --dlq

  - name: open-docs
    help: |-
      🧑‍🎓 Open connector documentation of currently running connector(s)

      Works out the documentation page from the connector class actually
      running and opens it, so you land on the right page for the right
      connector without searching for it.

      Use --only-show-url to print the link instead, for pasting in a case.
    flags:
    - long: --only-show-url
      help: |-
        🌐 Only show url

  - name: log-level
    help: |-
      🧬 Set connect log level

      Raises the log level for the packages of the connector that is running,
      without restarting anything. Set it to TRACE, reproduce the problem,
      then read 'playground connector logs'.

      This is the difference between "the task failed" and seeing the request
      that failed, the record that broke and what the SMT chain did to it.

      🎓 Tip: it will also set io.confluent.kafka.schemaregistry.client.rest.RestService (to see schema registry rest requests) and org.apache.kafka.connect.runtime.TransformationChain (to see records before and after SMTs)
              it will also set org.apache.kafka.connect.runtime.WorkerSinkTask for sink and org.apache.kafka.connect.runtime.WorkerSourceTask for source connectors.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-log-levels
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%A7%AC-trace-on-a-running-connector-without-a-restart
    flags:
    - *connector
    - *level
    - *cluster

  - name: logs
    group: Connect
    help: |-
      🕵️  Tail and follow connect logs

      The logs of the worker running your connector. Combine it with
      'playground connector log-level' to get more than the stack trace, and
      with --wait-for-log to block until a given line appears, which is how
      examples assert that something happened.

      For onprem connectors, this is basically a shortcut for "playground container logs --container connect", --connector flag is not relevant

      For Fully Managed connectors, limitations apply (see https://docs.confluent.io/cloud/current/connectors/logging-cloud-connectors.html#using-ccloud-cli)
    flags:
    - *connector
    - long: --open
      short: -o
      conflicts: [--wait-for-log]
      help: |-
        🔖 Save output to a file and open with text editor set with playground config editor <editor> (default is code)
    - long: --wait-for-log
      short: -w
      arg: log
      validate: not_empty
      conflicts: [--open]
      help: |-
        😴 Wait until log appears
    - *verbose
    - *cluster

  - name: open-ccloud-connector-in-browser
    group: Connect
    help: |-
      🤖 Open Fully Managed connector in browser (Confluent Cloud dashboard)

      Jumps straight to the connector's page in the Confluent Cloud console,
      resolving its lcc id for you, so you do not have to hunt through the
      environment and cluster menus.
    flags:
    - *connector
    - long: --browser
      required: false
      arg: browser
      help: |-
        🌎 browser name

        Default browser from your system if not set

  - name: display-leader-name
    group: Connect
    help: |-
      👑 Display Connect Worker leader name using JMX MBean leader-name from kafka.connect:type=connect-worker-rebalance-metrics

      This is useful when you have multiple connect workers and want to know which one is the leader.

      For onprem connectors, this is basically a shortcut for "playground container exec -c connect -- bash -c 'export JMX_PORT=9404; jmxterm -l localhost:9404 -n -v silent -u admin -p admin123 -e \"get -b kafka.connect:type=connect-worker-rebalance-metrics name=leader-name\"'", --connector flag is not relevant

      For Fully Managed connectors, this is not available as JMX is not accessible.
    flags:
    - *cluster

  - name: translate
    help: |
      💱 Translate Self Managed Connector Plugin Configurations to Fully Managed Connector Plugin Configuration

      Takes the configuration of the self managed connector that is running
      and asks Confluent Cloud what the fully managed equivalent looks like.
      Properties are renamed, some disappear, some have no equivalent at all,
      and this tells you which before you promise a customer a migration.

      Only translates the configuration. To actually move the connector along
      with its offsets, use 'playground connector connect-migration-utility'.

      See https://docs.confluent.io/cloud/current/api.html#tag/Managed-Connector-Plugins-(connectv1)/operation/translateConnectv1ConnectorPlugin

      The connector example should be ran with --environment flag set to <ccloud>
    dependencies:
      confluent: visit https://docs.confluent.io/confluent-cli/current/overview.html to install
    flags:
    - *connector
    - *verbose
    - long: --connector-plugin
      required: true
      arg: connector-plugin
      completions:
        dynamic:
        - playground get-connector-plugin "$completion_current" "fm"
      help: |-
        🔌 Connector plugin name

        🎓 Tip: use <tab> completion to trigger fzf completion

  - name: connect-migration-utility
    help: |
      🧩 Run Kafka Connector Migration Utility (see https://github.com/confluentinc/connect-migration-utility/) on running connect cluster

      Takes a self managed connector running in the connect container and
      recreates it as a fully managed connector in Confluent Cloud, keeping
      its offsets so consumers do not replay or skip data. Two steps:

        discovery   read the local connectors and export their configurations
        migrate     create the equivalent connectors on Confluent Cloud

      Run discovery first, migrate second. Use it to rehearse a customer's
      migration and see what their configuration turns into.

      The connector example should be ran with --environment flag set to ccloud.

      See a full example at https://github.com/vdesabou/kafka-docker-playground/blob/master/ccloud/connect-migration-utility/README.md

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-fully-managed
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%9A%9A-move-a-self-managed-connector-to-fully-managed
    filters:
    - ccloud_environment
    dependencies:
      confluent: visit https://docs.confluent.io/confluent-cli/current/overview.html to install
    commands:
    - name: discovery
      help: |
        👨‍🔬 Discover connectors in the local connect cluster and export their configurations to files
          
          see https://github.com/confluentinc/connect-migration-utility/tree/master?tab=readme-ov-file#step-1-specify-the-connector-configuration
      flags:
      - *verbose

    - name: migrate
      help: |
        🪄 Migrate discovered connectors to fully managed connectors

          see https://github.com/confluentinc/connect-migration-utility/tree/master?tab=readme-ov-file#step-2-migrate-the-connector
          ⚠️ <discovery> command should be run first

      flags:
      - long: --migration-mode
        arg: migration-mode
        allowed: [stop_create_latest_offset, create, create_latest_offset]
        required: false
        default: create
        help: |-
          - create: Create connector without any offset consideration
          - stop_create_latest_offset: Create a connector with no data loss/duplication (the python script stops the self-managed connector and fetches the latest offset and creates a fully-managed connector on Confluent Cloud using the fetched offset). See https://github.com/confluentinc/connect-migration-utility/tree/master?tab=readme-ov-file#create-a-connector-with-no-data-lossduplication.
          - create_latest_offset: Create a connector with no downtime (the python script fetches the latest offset without stopping the connector and creates a fully-managed connector on Confluent Cloud using the fetched offset. This option may cause data duplication as the self-managed connector is still running). See https://github.com/confluentinc/connect-migration-utility/tree/master?tab=readme-ov-file#create-a-connector-with-no-downtime.
      - long: --sensitive-property
        arg: sensitive-property
        help: |-
          🔐 Pass sensitive config properties when migrating connector
          
          🎓 Tip: you can pass multiple properties by specifying --sensitive-property multiple times

          Example: --sensitive-property "aws.access.key.id=xxx" --sensitive-property "aws.secret.access.key=xxx"
        required: false
        repeatable: true
      - long: --no-open
        required: false
        help: |-
          🚫 Do not open the generated configurations in the editor, and do not offer to open the fully managed connector in the browser

          The configurations are used as generated by <discovery> (with the --sensitive-property values applied), so the command runs unattended (scripts, agents)
      examples:
      - playground connector connect-migration-utility migrate --migration-mode stop_create_latest_offset --sensitive-property 'aws.access.key.id=\$AWS_ACCESS_KEY_ID' --sensitive-property 'aws.secret.access.key=\$AWS_SECRET_ACCESS_KEY'
      - playground connector connect-migration-utility migrate --migration-mode create_latest_offset --no-open

  - name: create-or-update
    help: |-
      🧑‍🎨  Create or update connector

      The command every example uses to deploy its connector. The json config
      is read from stdin, usually as a heredoc, so it stays readable in the
      script. If the connector already exists it is updated in place, which
      makes the command safe to re-run while you iterate on a configuration.

      The command then waits for the connector and all its tasks to be
      RUNNING, displays the connector status, and fails with the error if
      they are not, so a broken config stops the example immediately instead
      of failing silently later. A FAILED connector or task is reported with
      'playground connector diagnose' (trace, error digest, offsets, next
      steps and HTML report, opened in the browser unless 'playground config
      open-diagnose-report-on-failure false'). When the script that runs is a reproduction
      model, a connector that is not RUNNING is only reported as a warning,
      since a reproduction model often creates a failing connector on
      purpose. Use --wait to fail there too, --no-wait to skip the wait.

      Fully managed connectors are only waited for with --wait.

      🎓 Tip: add --validate to have the config checked by the plugin before
      it is deployed, which reports every invalid property at once.

      An update shows the keys added, removed and changed compared to the
      running config (secrets masked).

      The config can also be given as the path of a file, and in the
      formats customers send (detected, see 'playground connector
      convert'): the REST API format ({"name": ..., "config": {...}}), a
      dump of GET /connectors?expand=info, a CFK Connector or Strimzi
      KafkaConnector custom resource, a terraform confluent_connector
      resource, or a connect-standalone .properties file. When the file
      holds several connectors, the one named --connector is used.

      A config that comes from elsewhere (a file, or one of these formats)
      is adapted to the playground (--no-adapt to keep it as is, --adapt
      to adapt a plain json heredoc too): bootstrap servers and schema
      registry urls whose hosts are not containers of the playground,
      the credentials of that schema registry, a license, replication
      factors above the number of brokers, and on plaintext the security of
      the clients whose bootstrap servers were rewritten. Masked secrets,
      config providers of the customer environment (${file:...}),
      terraform references and the keys still pointing to external systems
      are listed. The heredocs of the examples are never changed.

      🍪 Deep dive: https://kafka-docker-playground.io/#/deep-dive-connector-create-or-update
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%94%8C-the-sink-fails-right-after-it-is-deployed
      🎬 Bite size session: https://kafka-docker-playground.io/#/sessions?id=%F0%9F%8F%97%EF%B8%8F-deploy-a-fully-managed-connector-with-terraform
    environment_variables:
    - name: PG_CCLOUD_SERVICE_ACCOUNT
      help: "👤 true: create fully managed connectors with a service account and the ACLs of the documentation (set by playground run --ccloud-service-account)"
    - name: PG_CCLOUD_SERVICE_ACCOUNT_ACLS
      help: "🚦 With PG_CCLOUD_SERVICE_ACCOUNT, ACLs of the service account: docs (default), full or none"
    - name: PG_CCLOUD_SERVICE_ACCOUNT_ID
      help: "👤 With PG_CCLOUD_SERVICE_ACCOUNT, existing service account to use as is, instead of creating one"
    - name: PG_CCLOUD_SERVICE_ACCOUNT_ACL_EXCLUDE
      help: "🙈 With PG_CCLOUD_SERVICE_ACCOUNT, regex of the ACLs not to create, matched on <OPERATION> <ResourceType>:<name> [prefix]"
    args:
    - name: json
      
      # Set the default path value to -, which is the standard operator for stdin.
      default: "-"
      help: json (or another supported format), or the path of a file (@file works too); reads from stdin if empty

    flags:
    - *verbose
    - *noclipboard
    - long: --connector
      short: -c
      required: true
      arg: connector
      completions:
        dynamic:
        - playground get-connector-list
      help: |-
        🔗 Connector name
    - long: --no-adapt
      required: false
      conflicts: [--adapt]
      help: |-
        🧷 Deploy a config that comes from elsewhere (a file, another format) as it is: do not rewrite its bootstrap servers, schema registry, license, replication factors and client security
    - long: --adapt
      required: false
      conflicts: [--no-adapt]
      help: |-
        🔧 Adapt a plain json config too (a customer config pasted in a heredoc): by default, only a file or another format is adapted, never the heredocs of the examples
    - long: --level
      short: -l
      arg: level
      allowed: [INFO, WARN, DEBUG, TRACE]
      required: false
      help: |-
        ❕Log level

        ⚠️ Not available for ccloud connectors
    - long: --package
      short: -p
      required: false
      validate: not_empty
      arg: package
      needs: [--level]
      help: |-
        Package name (with --level: the log level of that package instead of the connector's)
    - long: --wait-for-zero-lag
      help: |-
        😴 Wait until lag becomes 0
    - long: --wait
      required: false
      conflicts: [--no-wait]
      help: |-
        ⏳ Wait until the connector and all its tasks are RUNNING (or in --initial-state), and fail otherwise

        Self-managed connectors are waited for by default: --wait also makes the command fail when the script that runs is a reproduction model (by default, it is only a warning there).

        Same as running 'playground connector wait' right after the command. It fails right away if the connector or one of its tasks is FAILED. An update of a PAUSED or STOPPED connector waits for that state.

        With fully managed connectors, it waits for the connector to be provisioned and restarts it if it fails while being provisioned (same as wait_for_ccloud_connector_up in example scripts).
    - long: --no-wait
      required: false
      conflicts: [--wait, --max-wait]
      help: |-
        🏃 Do not wait for the connector and its tasks to be RUNNING, only display the status

        🎓 Tip: use it to create a connector that is expected to fail, then check it with 'playground connector wait --state FAILED'
    - long: --max-wait
      arg: max_wait
      validate: integer
      required: false
      conflicts: [--no-wait]
      help: |-
        ⏳ Max time in seconds to wait for the connector (default is 120, or 600 for fully managed connectors with --wait)
    - long: --validate
      required: false
      help: |-
        ✅ Validate config using PUT /connector-plugins/(string:name)/config/validate (https://docs.confluent.io/platform/current/connect/references/restapi.html#put--connector-plugins-(string-name)-config-validate)
    - long: --skip-automatic-connector-config
      required: false
      help: |-
        🤖 If example is run (playground run) with --environment flag, automatic configuration to adapt to the environment is added. 
        
        This flag allows to skip this automatic configuration (only useful to reproduce issues)
    - long: --offsets
      arg: offsets
      validate: json
      required: false
      help: |-
        📍 Create connector with offsets (https://docs.confluent.io/cloud/current/connectors/offsets.html#create-connectors-with-offsets)

        ⚠️ Only available for ccloud connectors, the connector should not really exists

    - long: --initial-state
      arg: initial-state
      allowed:
        - RUNNING
        - PAUSED
        - STOPPED
      required: false
      help: |-
        🪵 Create connector with specific status (https://cwiki.apache.org/confluence/display/KAFKA/KIP-980%3A+Allow+creating+connectors+in+a+stopped+state)

        If the connector already exists, its config is updated, then it is paused, stopped or resumed.

        Only available if CP > 7.7

        ⚠️ not available for ccloud connectors

    - long: --dry-run
      required: false
      conflicts: [--wait, --wait-for-zero-lag, --terraform, --level]
      help: |-
        🌵 Print the final config (with the automatic configuration added for the environment, the CFK rewrites)
        and the request that would be sent, without deploying anything

        With --ccloud-service-account, the service account and its ACLs are not created.

    - long: --terraform
      required: false
      help: |-
        🏗️ Deploy connector using Terraform instead of REST API

        Dynamically converts JSON connector config to Terraform HCL and deploys using terraform apply

        The values of config_sensitive are masked in the output. The Terraform folder of a connector
        (.terraform-playground/<connector>-*) is reused: running the command again updates the connector, and a
        connector created with the REST API is imported first. playground connector delete runs terraform destroy.

        ⚠️ Only available for Confluent Cloud connectors
    - *cluster

    examples: |
      playground connector create-or-update -c filestream-sink << EOF
      {
          "tasks.max": "1",
          "connector.class": "org.apache.kafka.connect.file.FileStreamSinkConnector",
          "topics": "filestream",
          "file": "/tmp/output.json",
          "key.converter": "org.apache.kafka.connect.storage.StringConverter",
          "value.converter": "org.apache.kafka.connect.json.JsonConverter",
          "value.converter.schemas.enable": "false"
      }
      EOF

      playground connector create-or-update -c filestream-sink --offsets '[{"partition":{"kafka_topic":"filestream","kafka_partition":0},"offset":{"kafka_offset":8}}]' << EOF
      {
          "tasks.max": "1",
          "connector.class": "org.apache.kafka.connect.file.FileStreamSinkConnector",
          "topics": "filestream",
          "file": "/tmp/output.json",
          "key.converter": "org.apache.kafka.connect.storage.StringConverter",
          "value.converter": "org.apache.kafka.connect.json.JsonConverter",
          "value.converter.schemas.enable": "false"
      }
      EOF

  - name: update
    help: |-
      🛠️ Update connector configuration by opening current connector config in text editor set with playground config editor <editor> (default is code). Once file is saved, the new configuration is updated.

      The quickest loop to try a configuration change: edit, save, close, and
      the connector is updated. Nothing is applied if you close the file
      without saving.
    flags:
    - *connector
    - *cluster
    examples: |
      playground connector update -c filestream-sink
    alias:
    - edit
    - alter
  examples:
  - playground connector status
  - playground connector status --json
  - playground connector resume --connector <connector-name>
  - playground connector pause -c <connector-name>
  - playground connector delete -c <connector-name>

- name: ec2
  expose: always
  group: EC2
  filters:
    - aws_ec2_permissions
  help: |-
    ✨ Create and manage AWS EC2 instances (using Cloud Formation) to run kafka-docker-playground

    🪄 Open EC2 instances directly in Visual Studio code using Remote Development (over SSH)

    Run the playground on a remote machine instead of your laptop, which is
    what you want for an example that needs far more CPU or memory than you
    have, or one that must run for hours.

      create              provision the instance with Cloud Formation
      open                open it in VS Code over SSH, as if it were local
      push-secrets        send your credentials to it, over ssh
      sync-repro-folder   keep reproduction-models in step, both directions
      list / status / start / stop / delete

    💰 The instance is billed while it runs. Use 'playground ec2 stop' when
       you pause, and 'playground ec2 delete' when you are done;
       'playground status' reminds you when one is still up.

    🔐 A pem file is created at the root of the repository when the instance
       is created. Back it up, it is the only way in, and only your current
       ip address is allowed to connect.
  commands:
  - name: create
    help: |-
      👷 Create kafka-docker-playground EC2 instance using AWS Cloud Formation

      One command does the whole thing: a Cloud Formation stack, an instance
      with docker and the playground repository already installed, a key pair,
      a security group opened to your ip only. Your credentials are pushed to
      it over ssh, then VS Code opens on it.

      Creation takes a few minutes, and Cloud Formation keeps installing in the
      background for about ten more. Follow output.log in the root folder of
      the instance to see where it is.

      🔐 AWS EC2 pem file for the ec2 instance will be created and stored in the
      root folder of the repository (make sure to do a backup, it is the only
      way in).

      🌍 Region being used will be the one set in your environment
      (aws configure get region) either by the AWS_REGION environment variable
      or ~/.aws/config.

      💰 The instance is billed from now on. Stop it when you pause and delete
      it when you are done.

      🐚 Use zsh on the instance to have everything working out of the box.
    flags:
    - long: --instance-type
      required: false
      arg: instance-type
      default: t3.2xlarge
      allowed: 
        - c1.medium
        - c1.xlarge
        - c3.2xlarge
        - c3.4xlarge
        - c3.8xlarge
        - c3.large
        - c3.xlarge
        - c4.2xlarge
        - c4.4xlarge
        - c4.large
        - c4.xlarge
        - m1.large
        - m1.medium
        - m1.small
        - m1.xlarge
        - m2.2xlarge
        - m2.4xlarge
        - m2.xlarge
        - m3.2xlarge
        - m3.large
        - m3.medium
        - m3.xlarge
        - m4.10xlarge
        - m4.2xlarge
        - m4.4xlarge
        - m4.large
        - m4.xlarge
        - t1.micro
        - t2.large
        - t2.medium
        - t2.micro
        - t2.nano
        - t2.small
        - t3.2xlarge
      help: |-
        🧑‍💻 instance type. default is t3.2xlarge

    - long: --size
      required: false
      arg: size
      default: "1000"
      validate: integer
      help: |-
        💾 instance size in Gb. default is 1000 Gb

    - long: --suffix
      required: false
      arg: suffix
      help: |-
        📮 suffix to add to instance name, giving pg-<username>-<suffix>

        if not set, the name is pg-<username>-<6 random characters>

        🎓 Tip: set it to the case number you are working on, so you can tell
        your instances apart in 'playground ec2 list'.

  - name: delete
    help: |- 
      ❌ Delete an EC2 instance created with Cloud Formation

      Deletes the Cloud Formation stack, which takes the instance, its volume
      and its security group with it, then removes the key pair on AWS and the
      local pem file. This is what stops the billing for good, unlike stop
      which only pauses it.

      ⚠️ Everything on the instance is lost, including any reproduction model
      you have not synced back with 'playground ec2 sync-repro-folder'.

      Without --instance it applies to all your instances, and asks you to
      confirm first.
    flags:
      - long: --instance
        short: -i
        required: false
        arg: instance
        validate: not_empty
        completions:
          dynamic:
          - playground get-ec2-cloudformation-list $completion_current
        help: |-
          🌀 ec2 instance cloudformation (need to use completion to get all required details)

          🎓 Tip: If not specified, the command will apply to all ec2 instances

  - name: open
    help: |-
      👨‍💻 Open an EC2 instance using Visual Studio code

      Opens a VS Code window on the instance over ssh, using Remote
      Development. The editor, the terminal and the playground CLI all run
      there, so it feels like working locally while the containers use the
      remote machine's CPU and memory.

      The security group is refreshed with your current ip on the way, so this
      is also the command to run after your ip changed and ssh stopped working.

      🔐 Only your current ip address will be allowed to connect.
    flags:
      - &instance
        long: --instance
        short: -i
        required: false
        arg: instance
        validate: not_empty
        completions:
          dynamic:
          - playground get-ec2-instance-list $completion_current
        help: |-
          🖥️ ec2 instance (need to use completion to get all required details)

          🎓 Tip: If not specified, the command will apply to all ec2 instances
      - long: --enable-sync-repro-folder
        required: false
        help: |-
          👉 Enable sync reproduction-models folder between local and ec2 instance

  - name: allow-my-ip
    private: true
    help: 🛂 Allow your current ip to connect to ec2 instance via ssh
    flags:
      - *instance
      
  - name: list
    help: |-
      🔘 List all EC2 instance

      Your playground instances and their state. Anything not stopped is
      costing money.

  - name: stop
    help: |-
      🔴 Stop an EC2 instance

      Shuts the instance down while keeping its disk, so you stop paying for
      compute and find your work again on 'playground ec2 start'.
    flags:
      - *instance

  - name: start
    help: |-
      🟢 Start an EC2 instance

      Boots an instance stopped earlier. Its public address changes, so use
      'playground ec2 open' rather than a bookmarked ssh command.
    flags:
      - *instance

  - name: status
    help: 🗺️ Show a status
    private: true
    flags:
      - long: --instance
        short: -i
        required: true
        arg: instance
        validate: not_empty
        help: |-
          🖥️ EC2 instance name
      - long: --all
        help: |- 
          return all details

  - name: sync-repro-folder
    dependencies:
      rsync: rsync needs to be installed
    help: |
        ↔️ Synchronize reproduction-models folder between local and ec2 instance

        The reproduction models you write are the only thing on the instance
        worth keeping, and deleting the instance destroys them. These two
        commands copy that folder in one direction or the other with rsync.

          local-to-ec2   push what you wrote locally, before running it there
          ec2-to-local   pull back what you wrote there, before deleting it

        'playground ec2 create' runs local-to-ec2 for you, and
        'playground ec2 open --enable-sync-repro-folder' does it again each
        time you open the instance.

        ⚠️ Get into the habit of running ec2-to-local before
        'playground ec2 delete', nothing else brings those files back.

        Note: rsync needs to be installed
    commands:
    - name: local-to-ec2
      help: |-
        👉 Sync local reproduction-models folder to ec2 instance

        Copies your local reproduction-models to the instance, so you can run
        there a model you started writing on your laptop.
      flags:
        - *instance

    - name: ec2-to-local
      help: |-
        👈 Sync ec2 instance reproduction-models folder to local

        Brings back the models you wrote on the instance. Run it before
        'playground ec2 delete', otherwise they go with the instance.
      flags:
        - *instance

  - name: push-secrets
    help: |-
      🔐 Send the secrets store to an ec2 instance

      Writes ~/.playground-secrets.properties (mode 0600) on the instance, which
      the playground .zshrc sources on login. This replaces the encrypted
      secrets.tar.gpg committed in the repository.

      The file is piped over ssh, so no clear text copy is ever written locally
      and the values never appear in 'ps'.

      The credentials that cannot be stored as name=value pairs are sent too,
      when they exist at the root of the repository:

        aws_credentials_with_assuming_iam_role       -> ~/.aws/credentials-with-assuming-iam-role
        aws_credentials_aws_account_with_assume_role -> ~/.aws/credentials_aws_account_with_assume_role
        github_ssh_key_file                          -> ~/.ssh/id_rsa
    flags:
      - *instance
      - long: --profile
        arg: profile
        required: false
        help: 🗂️ Secrets profile to use (default is the active one)
        completions:
          dynamic:
          - playground get-secret-profile-list
      - long: --dry-run
        required: false
        help: 🔍 List what would be sent, change nothing
    examples:
    - playground ec2 push-secrets
    - playground ec2 push-secrets --instance pg-vsaboulin-abc123
