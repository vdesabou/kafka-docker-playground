name: playground
version: 1.0.0
dependencies:
  docker: visit https://docs.docker.com/get-docker to install
help: |-
  🧠 CLI for Kafka Docker Playground 🐳

  👉 Check documentation https://kafka-docker-playground.io/#/cli

  🎬 Bite size sessions (short videos): https://kafka-docker-playground.io/#/sessions
  🍪 Deep dives (one family of commands each): https://kafka-docker-playground.io/#/deep-dives
  🧭 Which command answers my question? playground find-command "<question>"
filters:
- docker_running
environment_variables:
- name: PG_VERBOSE_MODE
  private: true
  help: "Set by --vvv, propagated to the nested playground calls (internal)"
- name: PLAYGROUND_CLUSTER
  help: "🌍 Cluster used by the topic, consumer-group, connector, schema, broker and quota commands in an mdc-* environment (us or europe) when --cluster is not set"

# Use bash code here directly or a function name that references code elsewhere.
help_header_override: |
  echo
  echo $'██████  ██       █████  ██    ██  ██████  ██████   ██████  ██    ██ ███    ██ ██████  '
  echo $'██   ██ ██      ██   ██  ██  ██  ██       ██   ██ ██    ██ ██    ██ ████   ██ ██   ██ '
  echo $'██████  ██      ███████   ████   ██   ███ ██████  ██    ██ ██    ██ ██ ██  ██ ██   ██ '
  echo $'██      ██      ██   ██    ██    ██    ██ ██   ██ ██    ██ ██    ██ ██  ██ ██ ██   ██ '
  echo $'██      ███████ ██   ██    ██     ██████  ██   ██  ██████   ██████  ██   ████ ██████  '
  echo
  echo "👉 Documentation: https://kafka-docker-playground.io/#/cli"
  echo "🎬 Bite size sessions (short videos): https://kafka-docker-playground.io/#/sessions"
  echo "🍪 Deep dives (one family of commands each): https://kafka-docker-playground.io/#/deep-dives"
  echo "🧭 Which command answers my question? playground find-command \"<question>\""
  echo
  
flags:
- long: --vvv
  short: -v
  help: |
    🐛 set verbose output (set -x)

    ❗ it can print sensitive information ❗

- long: --output-level
  short: -o
  arg: level
  allowed: [INFO, WARN, ERROR]
  required: false
  help: |-
    ❕Log level used by all commands

    Default is INFO (all INFO, WARN and ERROR will be printed in command output)

# One file per top-level command, in src/commands/<command>.yml, next to the bash partials of
# its subcommands (src/commands/<command>/<subcommand>.sh). Add a command by creating its file
# and importing it below, never by writing the command body here.
#
# A flag used by several top-level commands lives in src/flags/<flag>.yml and is pulled in with
# `- import: src/flags/<flag>.yml`: a YAML anchor cannot cross files (inside a single command
# file, anchors are still the way to reuse a flag across its subcommands). A whole *list* of
# flags shared by two commands cannot be imported, because an import replaces a single list
# item: it is included with ERB instead, see src/flags/analyze-*-flags.yml.
#
# Paths are relative to scripts/cli/, not to the file doing the import.
commands:
- import: src/commands/help.yml

- import: src/commands/status.yml

- import: src/commands/doctor.yml

