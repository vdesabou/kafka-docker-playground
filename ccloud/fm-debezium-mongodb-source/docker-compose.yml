---
services:

  mongodb:
    # Pinned below MongoDB 8.0: MongoDB 8.0+ deliberately refuses to start on Linux
    # kernel 6.19+ (which this CI infra runs) due to a known TCMalloc/rseq
    # incompatibility - see https://jira.mongodb.org/browse/SERVER-121912.
    # Confirmed directly from mongod's own startup log via CI (CC-44953).
    image: mongo:7.0.43
    hostname: mongodb
    container_name: mongodb
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: debezium
      MONGO_INITDB_ROOT_PASSWORD: dbz
    entrypoint: [ "/usr/bin/mongod", "--bind_ip_all", "--replSet", "debezium" ]

  mongo-express:
    image: mongo-express:latest
    hostname: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - 18081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: debezium
      ME_CONFIG_MONGODB_ADMINPASSWORD: dbz
      ME_CONFIG_MONGODB_URL: mongodb://debezium:dbz@mongodb:27017/
      

  # https://ngrok.com/docs/using-ngrok-with/docker/
  ngrok:
    image: ngrok/ngrok:latest
    hostname: ngrok
    container_name: ngrok
    ports:
      - 4040:4040
    restart: unless-stopped
    depends_on:
      - mongodb
    command:
      - "start"
      - "--all"
      - "--log=stdout"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ../../ccloud/fm-debezium-mongodb-source/ngrok.yml:/etc/ngrok.yml
    environment:
      NGROK_AUTHTOKEN: $NGROK_AUTH_TOKEN