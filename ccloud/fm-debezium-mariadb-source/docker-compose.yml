---
services:

  mariadb:
    image: mariadb:latest
    hostname: mariadb
    container_name: mariadb
    volumes:
      - ../../ccloud/fm-debezium-mariadb-source/mysql.cnf:/etc/mysql/conf.d/custom.cnf
      - ../../ccloud/fm-debezium-mariadb-source/mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_HOST: 172.%


  # https://ngrok.com/docs/using-ngrok-with/docker/
  ngrok:
    image: ${NGROK_IMAGE:-ngrok/ngrok:latest}
    hostname: ngrok
    container_name: ngrok
    ports:
      - 4040:4040
    restart: unless-stopped
    depends_on:
      - mariadb
    command:
      - "start"
      - "--all"
      - "--log=stdout"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ../../ccloud/fm-debezium-mariadb-source/ngrok.yml:/etc/ngrok.yml
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTH_TOKEN:-}
      BORE_SERVER: ${BORE_SERVER:-}
      BORE_SECRET: ${BORE_SECRET:-}
