---
services:
  activemq:
    image: rmohr/activemq:5.15.9
    hostname: activemq
    container_name: activemq
    # in rmohr/activemq:5.15.9, WORKDIR /opt/activemq is an absolute symlink to /opt/apache-activemq-5.15.9:
    # podman (CI) resolves it on the host and fails with "mkdir .../opt/activemq: file exists" (#9174)
    working_dir: /opt/apache-activemq-5.15.9
    ports:
      - '61616:61616'
      - '8161:8161'

  # https://ngrok.com/docs/using-ngrok-with/docker/
  ngrok:
    image: ngrok/ngrok:latest
    hostname: ngrok
    container_name: ngrok
    ports:
      - 4040:4040
    restart: unless-stopped
    depends_on:
      - activemq
    command:
      - "start"
      - "--all"
      - "--log=stdout"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ../../ccloud/fm-active-mq-source/ngrok.yml:/etc/ngrok.yml
    environment:
      NGROK_AUTHTOKEN: $NGROK_AUTH_TOKEN