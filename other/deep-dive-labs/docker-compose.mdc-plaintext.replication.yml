---
services:
  # lab of https://kafka-docker-playground.io/#/deep-dive-replication (replication.sh):
  # cluster links are created on the destination cluster (europe), as in multi-data-center/cluster-linking
  broker-europe:
    environment:
      KAFKA_CONFLUENT_CLUSTER_LINK_ENABLE: "true"
      KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: "1"

  broker-us:
    environment:
      KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: "1"

  # Schema Linking (playground schema exporter): the exporter extension on both registries, so that schemas can be
  # exported in both directions (https://docs.confluent.io/platform/current/schema-registry/schema-linking-cp.html)
  schema-registry-europe:
    environment:
      SCHEMA_REGISTRY_RESOURCE_EXTENSION_CLASS: io.confluent.schema.exporter.SchemaExporterResourceExtension
      SCHEMA_REGISTRY_KAFKASTORE_UPDATE_HANDLERS: io.confluent.schema.exporter.storage.SchemaExporterUpdateHandler
      SCHEMA_REGISTRY_PASSWORD_ENCODER_SECRET: playground-secret

  schema-registry-us:
    environment:
      SCHEMA_REGISTRY_RESOURCE_EXTENSION_CLASS: io.confluent.schema.exporter.SchemaExporterResourceExtension
      SCHEMA_REGISTRY_KAFKASTORE_UPDATE_HANDLERS: io.confluent.schema.exporter.storage.SchemaExporterUpdateHandler
      SCHEMA_REGISTRY_PASSWORD_ENCODER_SECRET: playground-secret
