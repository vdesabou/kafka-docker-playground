---
services:

  client-kafkajs:
    build:
      context: ../../other/client-kafkajs/
      args:
        # optional: another client version, see README.md
        CLIENT_VERSION: ${CLIENT_VERSION:-}
    hostname: client-kafkajs
    container_name: client-kafkajs
    volumes:
      - ../../other/client-kafkajs/client.properties:/tmp/client.properties:ro
    depends_on:
      - broker
      - schema-registry
