---
services:

  client-dotnet:
    build:
      context: ../../other/client-dotnet/
      args:
        # optional: another client version, see README.md
        CLIENT_VERSION: ${CLIENT_VERSION:-}
    hostname: client-dotnet
    container_name: client-dotnet
    volumes:
      - ../../other/client-dotnet/client.properties:/tmp/client.properties:ro
    depends_on:
      - broker
      - schema-registry

