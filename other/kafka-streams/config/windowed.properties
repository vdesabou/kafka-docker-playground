# StreamsConfig of the windowed scenario (windowed.sh). bootstrap.servers is set by the example (STREAMS_BOOTSTRAP_SERVERS).
# 🎓 Replace with the customer's StreamsConfig, keep the app.* keys: they configure the scenario, not Kafka Streams.
application.id=streams-windowed
processing.guarantee=at_least_once
num.stream.threads=1
commit.interval.ms=1000
auto.offset.reset=earliest
replication.factor=1

# tumbling windows of 1 minute, records up to 30 seconds late are still counted (grace period)
app.window.size.ms=60000
app.window.grace.ms=30000
# retention of the window store, at least size + grace (0: Kafka Streams default, size + grace)
app.window.retention.ms=0
# suppression buffer: 0 for unbounded (in memory), N to shut the application down when N records are buffered
app.suppress.max.records=0
