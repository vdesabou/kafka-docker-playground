# StreamsConfig of the eos scenario (eos.sh), the count topology with exactly-once processing.
# bootstrap.servers is set by the example (STREAMS_BOOTSTRAP_SERVERS).
# 🎓 Replace with the customer's StreamsConfig, keep the app.* keys: they configure the scenario, not Kafka Streams.
application.id=streams-eos
processing.guarantee=exactly_once_v2
num.stream.threads=1
num.standby.replicas=0
# with exactly-once, a commit is a transaction commit: the output is visible to read_committed consumers at each commit
commit.interval.ms=1000
auto.offset.reset=earliest
replication.factor=1
# a paused instance leaves the group after 10 seconds instead of 45, its transaction is aborted after 10 seconds
consumer.session.timeout.ms=10000
producer.transaction.timeout.ms=10000
