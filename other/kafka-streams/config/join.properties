# StreamsConfig of the join scenario (join.sh). bootstrap.servers is set by the example (STREAMS_BOOTSTRAP_SERVERS).
# 🎓 Replace with the customer's StreamsConfig, keep the app.* keys: they configure the scenario, not Kafka Streams.
application.id=streams-join
processing.guarantee=at_least_once
num.stream.threads=1
commit.interval.ms=1000
auto.offset.reset=earliest
replication.factor=1
# no caching: every update of the tables is forwarded, the outputs are easier to follow
statestore.cache.max.bytes=0
# the same before Kafka Streams 3.4 (an unknown config is only a warning)
cache.max.bytes.buffering=0

# also start the copartition-demo application: a join of two topics that are not co-partitioned (6 and 3 partitions):
# refused up to Kafka Streams 3.1, silently losing join results since 3.2
app.copartition.demo=true
