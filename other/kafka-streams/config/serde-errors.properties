# StreamsConfig of the serde-errors scenario (serde-errors.sh). bootstrap.servers is set by the example (STREAMS_BOOTSTRAP_SERVERS).
# 🎓 Replace with the customer's StreamsConfig, keep the app.* keys: they configure the scenario, not Kafka Streams.
application.id=streams-serde-errors
processing.guarantee=at_least_once
num.stream.threads=1
commit.interval.ms=1000
auto.offset.reset=earliest
replication.factor=1

# a record that cannot be deserialized (poison pill) is logged and skipped. The default, LogAndFailExceptionHandler,
# stops the application: the fail-on-poison-pill demo application uses it
default.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
# a record the producer refuses because it is too large is logged and skipped, anything else fails
default.production.exception.handler=io.confluent.playground.streams.ContinueOnRecordTooLargeHandler
# small on purpose: the "inflate" payment produces a value larger than this
producer.max.request.size=4096

app.schema.registry.url=http://schema-registry:8081
