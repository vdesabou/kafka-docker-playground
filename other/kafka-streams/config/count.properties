# StreamsConfig of the count scenario (count.sh), read by the 3 instances (streams, streams2, streams3).
# 🎓 Replace with the customer's StreamsConfig: bootstrap.servers is set by the example (STREAMS_BOOTSTRAP_SERVERS),
# and the topology needs String keys and values on the input topic. Keys starting with "app." configure the scenario.
application.id=streams-count
processing.guarantee=at_least_once
num.stream.threads=1
num.standby.replicas=0
commit.interval.ms=1000
auto.offset.reset=earliest
# a single broker: internal topics (repartition, changelog) with replication factor 1
replication.factor=1
