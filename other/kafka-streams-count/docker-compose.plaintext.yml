---
services:

  streams: &streams
    image: eclipse-temurin:17-jre
    hostname: streams
    container_name: streams
    depends_on:
      - broker
    environment:
      STREAMS_BOOTSTRAP_SERVERS: broker:9092
      KAFKA_CLIENT_TAG: ${KAFKA_CLIENT_TAG}
    volumes:
      - ../../other/kafka-streams-count/streams/target:/app
      - ../../other/kafka-streams-count/streams.properties:/etc/kafka-streams/streams.properties
    command: ["bash", "-c", "exec java -Xmx256m -jar /app/kafka-streams-count-$${KAFKA_CLIENT_TAG}-jar-with-dependencies.jar"]

  streams2:
    <<: *streams
    hostname: streams2
    container_name: streams2

  streams3:
    <<: *streams
    hostname: streams3
    container_name: streams3
