---
services:

  schema-registry:
    environment:
      SCHEMA_REGISTRY_CONFLUENT_SCHEMA_REGISTRY_ANONYMOUS_PRINCIPAL: 'true'
      # '/*' (as in the documentation) does not work: it is the same path spec as the "authenticate everything"
      # constraint, which wins, and anonymous requests get 401 Unauthorized. List the Schema Registry resources instead
      SCHEMA_REGISTRY_AUTHENTICATION_SKIP_PATHS: '/subjects/*,/schemas/*,/config/*,/mode/*,/compatibility/*,/contexts/*'
