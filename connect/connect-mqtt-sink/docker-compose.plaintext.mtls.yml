---
services:

  mosquitto:
    image: eclipse-mosquitto:1.6.13
    hostname: mosquitto
    container_name: mosquitto
    ports:
      - 9001:9001
      - 8883:8883
    volumes:
      - ../../connect/connect-mqtt-sink/mtls/mosquitto.conf:/etc/mosquitto/mosquitto.conf
      - ../../connect/connect-mqtt-sink/password:/etc/mosquitto/passwd
      - ../../connect/connect-mqtt-sink/security/snakeoil-ca-1.crt:/etc/mosquitto/certs/ca.crt
      - ../../connect/connect-mqtt-sink/security/mosquitto.certificate.pem:/etc/mosquitto/certs/server.crt
      - ../../connect/connect-mqtt-sink/security/mosquitto.key:/etc/mosquitto/certs/server.key
    command: ["/usr/sbin/mosquitto", "-c", "/etc/mosquitto/mosquitto.conf"]

  connect:
    depends_on:
      - mosquitto
    volumes:
      - ../../connect/connect-mqtt-sink/security/kafka.connect.truststore.jks:/tmp/truststore.jks
      - ../../connect/connect-mqtt-sink/security/kafka.connect.keystore.jks:/tmp/keystore.jks
    environment:
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components/confluentinc-kafka-connect-mqtt