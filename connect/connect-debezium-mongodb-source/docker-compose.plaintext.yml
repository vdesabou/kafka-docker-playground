---
services:

  mongodb:
    # Pinned below MongoDB 8.0: the CI host runs a Linux 6.19+ (here: 7.0.0-aws) kernel,
    # and MongoDB 8.0+ deliberately refuses to start on such kernels due to a known
    # TCMalloc/rseq incompatibility - see https://jira.mongodb.org/browse/SERVER-121912.
    # Confirmed directly from mongod's own startup log via CI (CC-44953).
    image: mongo:7.0.43
    hostname: mongodb
    container_name: mongodb
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: debezium
      MONGO_INITDB_ROOT_PASSWORD: dbz
    entrypoint: [ "/usr/bin/mongod", "--bind_ip_all", "--replSet", "debezium" ]

  mongo-express:
    image: mongo-express:latest
    hostname: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - 18081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: myuser
      ME_CONFIG_MONGODB_ADMINPASSWORD: mypassword
      ME_CONFIG_MONGODB_URL: mongodb://myuser:mypassword@mongodb:27017/
      
  connect:
    depends_on:
      - mongodb
    environment:
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components/debezium-debezium-connector-mongodb
