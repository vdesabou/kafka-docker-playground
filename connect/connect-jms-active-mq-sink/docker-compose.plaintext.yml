---
services:
  activemq:
    image: rmohr/activemq:5.15.9
    hostname: activemq
    container_name: activemq
    # rmohr/activemq:5.15.9 sets WORKDIR=/opt/activemq which already exists in the
    # image layer; podman refuses to mkdir over it. 
    working_dir: /opt/activemq 
    ports:
      - '61616:61616'
      - '8161:8161'

  connect:
    depends_on:
      - activemq
    environment:
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components/confluentinc-kafka-connect-jms-sink