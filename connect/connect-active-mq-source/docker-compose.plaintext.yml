---
services:
  activemq:
    image: rmohr/activemq:5.15.9
    hostname: activemq
    container_name: activemq
    # in rmohr/activemq:5.15.9, WORKDIR /opt/activemq is an absolute symlink to /opt/apache-activemq-5.15.9:
    # podman (CI) resolves it on the host and fails with "mkdir .../opt/activemq: file exists" (#9174)
    working_dir: /opt/apache-activemq-5.15.9
    ports:
      - '61616:61616'
      - '8161:8161'

  connect:
    environment:
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components/confluentinc-kafka-connect-activemq