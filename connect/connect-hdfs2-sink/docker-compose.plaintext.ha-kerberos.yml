---

# Hadoop checks the Kerberos principal of its peers (jn/_HOST, nn/_HOST, dn/_HOST) against the name
# returned by a reverse DNS lookup of their IP. Docker answers <container>.<network>, which is the FQDN here,
# but podman (aardvark-dns) answers the short container name first, so the namenode rejects the journal nodes with
# 'Server has invalid Kerberos principal: jn/journal1.kerberos-demo.local@EXAMPLE.COM' (#9652).
# Static IPs + /etc/hosts entries make the reverse lookup return the FQDN with both engines.
x-hadoop-hosts: &hadoop-hosts
  - "namenode1.kerberos-demo.local:172.28.0.11"
  - "namenode2.kerberos-demo.local:172.28.0.12"
  - "journal1.kerberos-demo.local:172.28.0.13"
  - "journal2.kerberos-demo.local:172.28.0.14"
  - "journal3.kerberos-demo.local:172.28.0.15"
  - "datanode.kerberos-demo.local:172.28.0.16"
  - "resourcemanager.kerberos-demo.local:172.28.0.17"
  - "activator.kerberos-demo.local:172.28.0.18"
  - "connect.kerberos-demo.local:172.28.0.19"

services:

  krb5:
    image: flokkr/krb5
    hostname: krb5.kerberos-demo.local
    container_name: krb5
    volumes:
    - ../../connect/connect-hdfs2-sink/ha-kerberos/krb5.conf:/etc/krb5.conf
    # see fork https://github.com/vdesabou/issuer to avoid KrbException: Message stream modified (41) (https://stackoverflow.com/a/68212311/2381999)
    - ../../connect/connect-hdfs2-sink/ha-kerberos/issuer:/root/issuer

  namenode1:
    image: flokkr/hadoop:latest
    hostname: namenode1.kerberos-demo.local
    container_name: namenode1
    networks:
      default:
        ipv4_address: 172.28.0.11
    extra_hosts: *hadoop-hosts
    depends_on:
      - krb5
    env_file:
      - ../../connect/connect-hdfs2-sink/ha-kerberos/config
    environment:
        ENSURE_NAMENODE_DIR: "/tmp/hadoop-hadoop/dfs/name"
        # wait for the journal nodes, slow to install on podman, then hdfsinit.sh retries the format until they answer
        WAITFOR: "journal1.kerberos-demo.local:8485 journal2.kerberos-demo.local:8485 journal3.kerberos-demo.local:8485"
        WAITFOR_TIMEOUT: 300
        SLEEP_SECONDS: 20
        # HADOOP_OPTS: "-Djava.net.preferIPv4Stack=true -Dsun.security.krb5.debug=true -Dsun.security.spnego.debug -Dsun.security.krb5.disableReferrals=true -Djdk.security.allowNonCaAnchor=true"
    command: ["hdfs", "namenode"]
    volumes:
        - ../../connect/connect-hdfs2-sink/ha-kerberos/krb5.conf:/opt/launcher/plugins/011_kerberos/krb5.conf
        - ../../connect/connect-hdfs2-sink/ha-kerberos/installer.sh:/opt/launcher/plugins/005_installer/installer.sh
        - ../../connect/connect-hdfs2-sink/ha-kerberos/waitfor.sh:/opt/launcher/plugins/006_waitfor/waitfor.sh
        - ../../connect/connect-hdfs2-sink/ha-kerberos/hdfsinit.sh:/opt/launcher/plugins/012_hdfsinit/hdfsinit.sh
        - ../../connect/connect-hdfs2-sink/hadoop-2.7.4.tar.gz:/opt/download/hadoop.tar.gz

  namenode2:
    image: flokkr/hadoop:latest
    hostname: namenode2.kerberos-demo.local
    container_name: namenode2
    networks:
      default:
        ipv4_address: 172.28.0.12
    extra_hosts: *hadoop-hosts
    env_file:
      - ../../connect/connect-hdfs2-sink/ha-kerberos/config
    depends_on:
      - krb5
    environment:
        ENSURE_STANDBY_NAMENODE_DIR: "/tmp/hadoop-hadoop/dfs/name"
        #ENSURE_NAMENODE_CLUSTERID: "sh"
        # wait for namenode1, then hdfsinit.sh retries the bootstrap until namenode1 answers
        WAITFOR: "namenode1.kerberos-demo.local:9820"
        WAITFOR_TIMEOUT: 300
        SLEEP_SECONDS: 10
        # HADOOP_OPTS: "-Djava.net.preferIPv4Stack=true -Dsun.security.krb5.debug=true -Dsun.security.spnego.debug -Dsun.security.krb5.disableReferrals=true -Djdk.security.allowNonCaAnchor=true"
    command: ["hdfs", "namenode"]
    volumes:
        - ../../connect/connect-hdfs2-sink/ha-kerberos/krb5.conf:/opt/launcher/plugins/011_kerberos/krb5.conf
        - ../../connect/connect-hdfs2-sink/ha-kerberos/installer.sh:/opt/launcher/plugins/005_installer/installer.sh
        - ../../connect/connect-hdfs2-sink/ha-kerberos/waitfor.sh:/opt/launcher/plugins/006_waitfor/waitfor.sh
        - ../../connect/connect-hdfs2-sink/ha-kerberos/hdfsinit.sh:/opt/launcher/plugins/012_hdfsinit/hdfsinit.sh
        - ../../connect/connect-hdfs2-sink/hadoop-2.7.4.tar.gz:/opt/download/hadoop.tar.gz

  journal1:
    image: flokkr/hadoop:latest
    hostname: journal1.kerberos-demo.local
    container_name: journal1
    networks:
      default:
        ipv4_address: 172.28.0.13
    extra_hosts: *hadoop-hosts
    depends_on:
      - krb5
    env_file:
      - ../../connect/connect-hdfs2-sink/ha-kerberos/config
    #environment:
        # HADOOP_OPTS: "-Djava.net.preferIPv4Stack=true -Dsun.security.krb5.debug=true -Dsun.security.spnego.debug -Dsun.security.krb5.disableReferrals=true -Djdk.security.allowNonCaAnchor=true"
    command: ["hdfs", "journalnode"]
    volumes:
        - ../../connect/connect-hdfs2-sink/ha-kerberos/krb5.conf:/opt/launcher/plugins/011_kerberos/krb5.conf
        - ../../connect/connect-hdfs2-sink/ha-kerberos/installer.sh:/opt/launcher/plugins/005_installer/installer.sh
        - ../../connect/connect-hdfs2-sink/hadoop-2.7.4.tar.gz:/opt/download/hadoop.tar.gz

  journal2:
    image: flokkr/hadoop:latest
    hostname: journal2.kerberos-demo.local
    container_name: journal2
    networks:
      default:
        ipv4_address: 172.28.0.14
    extra_hosts: *hadoop-hosts
    depends_on:
      - krb5
    env_file:
      - ../../connect/connect-hdfs2-sink/ha-kerberos/config
    #environment:
        # HADOOP_OPTS: "-Djava.net.preferIPv4Stack=true -Dsun.security.krb5.debug=true -Dsun.security.spnego.debug -Dsun.security.krb5.disableReferrals=true -Djdk.security.allowNonCaAnchor=true"
    command: ["hdfs", "journalnode"]
    volumes:
        - ../../connect/connect-hdfs2-sink/ha-kerberos/krb5.conf:/opt/launcher/plugins/011_kerberos/krb5.conf
        - ../../connect/connect-hdfs2-sink/ha-kerberos/installer.sh:/opt/launcher/plugins/005_installer/installer.sh
        - ../../connect/connect-hdfs2-sink/hadoop-2.7.4.tar.gz:/opt/download/hadoop.tar.gz

  journal3:
    image: flokkr/hadoop:latest
    hostname: journal3.kerberos-demo.local
    container_name: journal3
    networks:
      default:
        ipv4_address: 172.28.0.15
    extra_hosts: *hadoop-hosts
    depends_on:
      - krb5
    env_file:
      - ../../connect/connect-hdfs2-sink/ha-kerberos/config
    command: ["hdfs", "journalnode"]
    #environment:
         # HADOOP_OPTS: "-Djava.net.preferIPv4Stack=true -Dsun.security.krb5.debug=true -Dsun.security.spnego.debug -Dsun.security.krb5.disableReferrals=true -Djdk.security.allowNonCaAnchor=true"
    volumes:
        - ../../connect/connect-hdfs2-sink/ha-kerberos/krb5.conf:/opt/launcher/plugins/011_kerberos/krb5.conf
        - ../../connect/connect-hdfs2-sink/ha-kerberos/installer.sh:/opt/launcher/plugins/005_installer/installer.sh
        - ../../connect/connect-hdfs2-sink/hadoop-2.7.4.tar.gz:/opt/download/hadoop.tar.gz

  datanode:
    image: flokkr/hadoop:latest
    command: ["hdfs", "datanode"]
    hostname: datanode.kerberos-demo.local
    container_name: datanode
    networks:
      default:
        ipv4_address: 172.28.0.16
    extra_hosts: *hadoop-hosts
    depends_on:
      - krb5
    env_file:
      - ../../connect/connect-hdfs2-sink/ha-kerberos/config
    environment:
        SLEEP_SECONDS: 60
        # HADOOP_OPTS: "-Djava.net.preferIPv4Stack=true -Dsun.security.krb5.debug=true -Dsun.security.spnego.debug -Dsun.security.krb5.disableReferrals=true -Djdk.security.allowNonCaAnchor=true"
    volumes:
        - ../../connect/connect-hdfs2-sink/ha-kerberos/krb5.conf:/opt/launcher/plugins/011_kerberos/krb5.conf
        - ../../connect/connect-hdfs2-sink/ha-kerberos/installer.sh:/opt/launcher/plugins/005_installer/installer.sh
        - ../../connect/connect-hdfs2-sink/hadoop-2.7.4.tar.gz:/opt/download/hadoop.tar.gz

  resourcemanager:
    image: flokkr/hadoop:latest
    hostname: resourcemanager.kerberos-demo.local
    container_name: resourcemanager
    networks:
      default:
        ipv4_address: 172.28.0.17
    extra_hosts: *hadoop-hosts
    depends_on:
      - krb5
    command: ["yarn", "resourcemanager"]
    env_file:
        - ../../connect/connect-hdfs2-sink/ha-kerberos/config
    volumes:
        - ../../connect/connect-hdfs2-sink/ha-kerberos/krb5.conf:/opt/launcher/plugins/011_kerberos/krb5.conf
        - ../../connect/connect-hdfs2-sink/ha-kerberos/installer.sh:/opt/launcher/plugins/005_installer/installer.sh
        - ../../connect/connect-hdfs2-sink/hadoop-2.7.4.tar.gz:/opt/download/hadoop.tar.gz

  activator:
    image: flokkr/hadoop:latest
    hostname: activator.kerberos-demo.local
    container_name: activator
    networks:
      default:
        ipv4_address: 172.28.0.18
    extra_hosts: *hadoop-hosts
    depends_on:
      - krb5
    command: kinit -kt /opt/hadoop/etc/hadoop/nn.keytab nn/activator.kerberos-demo.local;hdfs haadmin -transitionToActive nn1
    env_file:
      - ../../connect/connect-hdfs2-sink/ha-kerberos/config
    environment:
        SLEEP_SECONDS: 70
    volumes:
      - ../../connect/connect-hdfs2-sink/ha-kerberos/installer.sh:/opt/launcher/plugins/005_installer/installer.sh
      - ../../connect/connect-hdfs2-sink/hadoop-2.7.4.tar.gz:/opt/download/hadoop.tar.gz

  connect:
    hostname: connect.kerberos-demo.local
    networks:
      default:
        ipv4_address: 172.28.0.19
    extra_hosts: *hadoop-hosts
    volumes:
      - ../../connect/connect-hdfs2-sink/ha-kerberos/krb5.conf:/etc/krb5.conf
      - ../../connect/connect-hdfs2-sink/ha-kerberos/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ../../connect/connect-hdfs2-sink/ha-kerberos/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    environment:
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components/confluentinc-kafka-connect-hdfs
      # JDK 17
      KAFKA_OPTS: "--add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED"

networks:
  default:
    name: kerberos-demo.local
    ipam:
      config:
        - subnet: 172.28.0.0/16
          # containers without a static IP (broker, schema-registry...) get one from here, away from the static ones
          ip_range: 172.28.1.0/24