---
# Playground Academy, intermediate exercise: tasks.max is 4, but only one task works (https://kafka-docker-playground.io/#/academy)
services:

  connect:
    environment:
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components/confluentinc-kafka-connect-http

  httpserver:
    build:
      context: ../../connect/connect-http-sink/httpserver
    hostname: httpserver
    container_name: httpserver
    # always rebuilt: an image cached before a change of server.js would miss its endpoints
    pull_policy: build
    ports:
      - "9006:9006"
