  <script>
    window.$docsify = {
      name: 'kafka-docker-playground',
      repo: 'vdesabou/kafka-docker-playground',
      coverpage: true,
      themeColor: "#d7eff6",
      homepage   : 'introduction.md',
      loadSidebar: 'sidebar.md',
      notFoundPage: '_404.md',

      // NAVIGATION
      // -----------------------------------------------------------------
      auto2top   : true,
      maxLevel   : 3,
      // h4 sub-sections are in the "On this page" table of contents (plugin below), which keeps the sidebar short
      subMaxLevel: 3,

      // PLUGINS
      // -----------------------------------------------------------------
      search: {
          // 'auto' only indexes pages linked from the sidebar: also index the CLI reference pages (cli-pages.js)
          // keep in sync with sidebar.md
          paths      : ['/introduction', '/content', '/how-to-use', '/cli', '/reports', '/sessions', '/deep-dives', '/deep-dive-network-traffic', '/deep-dive-topic-produce', '/deep-dive-topic-consume',
                        '/deep-dive-connector-create-or-update', '/deep-dive-connector-troubleshooting', '/deep-dive-container-logs', '/deep-dive-offsets-and-lag',
                        '/deep-dive-log-levels', '/deep-dive-connector-smt-test', '/deep-dive-reproduction-models', '/deep-dive-container-lifecycle',
                        '/deep-dive-connector-plugin', '/deep-dive-schema', '/deep-dive-jvm-diagnostics', '/deep-dive-run-and-versions',
                        '/deep-dive-topic-administration', '/deep-dive-secured-environments', '/deep-dive-connector-benchmark', '/deep-dive-fully-managed', '/deep-dive-secrets', '/deep-dive-oracle-cdc', '/how-it-works', '/reusables',
                        '/academy', '/tips-and-tricks', '/claude-code', '/legacy-java-producer', '/changelog'].concat(window.KDP_CLI_PAGES || []),
          namespace  : 'kdp',
          // the index is cached in localStorage: rebuild it hourly, as CI updates the generated pages several times a day (default: 1 day)
          maxAge     : 3600000,
          depth      : 3,
          noData     : 'No results!',
          placeholder: 'Search...'
      },
      'flexible-alerts': {
        style: 'callout'
      },
      // docsify-copy-code (defaults)
      copyCode: {
        buttonText : 'Copy to clipboard',
        errorText  : 'Error',
        successText: 'Copied'
      },
      tabs: {
        persist    : true,      // default
        sync       : true,      // default
        theme      : 'classic', // default
        tabComments: true,      // default
        tabHeadings: true       // default
      },
      plugins: [
        // "Edit on github" link to the source of the page in docs/ of https://github.com/vdesabou/kafka-docker-playground,
        // except on generated pages (CLI reference, content, introduction, changelog), which have no source file there
        function (hook, vm) {
          var generated = /^(playground .*|index|cli|content|introduction|badges|changelog)\.md$/;
          hook.afterEach(function (html) {
            var file = vm.route.file && decodeURIComponent(vm.route.file);
            if (!file || generated.test(file)) {
              return html;
            }
            var url = 'https://github.com/vdesabou/kafka-docker-playground/edit/master/docs/' + encodeURI(file);
            return '<div style="overflow: auto"><p style="float: right"><a style="text-decoration: underline" target="_blank" rel="noopener" href="' + url + '">Edit on github</a></p></div>' + html;
          });
        },
        // Links to a section (?id=...): docsify scrolls once, right after rendering, but the images and videos above
        // the section load afterwards and push it down (2455px for the benchmark section of reusables). Keep the
        // section at the top while the page grows, until the reader scrolls or 10s have passed.
        function (hook, vm) {
          var stopPrevious = function () {};
          hook.doneEach(function () {
            // docsify reuses .markdown-section: stop the alignment started for the previous page
            stopPrevious();
            var id = vm.route.query.id;
            var content = document.querySelector('.markdown-section');
            if (!id || !content || !window.ResizeObserver) {
              return;
            }
            var stopped = false, timer = null, observer = null;
            var userEvents = ['wheel', 'touchstart', 'keydown', 'mousedown'];
            function stop() {
              stopped = true;
              observer && observer.disconnect();
              userEvents.forEach(function (e) { window.removeEventListener(e, stop); });
            }
            function align() {
              // getElementById: the ids contain emojis, no CSS escaping needed
              var target = document.getElementById(id);
              if (!stopped && target) {
                window.scrollTo(0, Math.round(target.getBoundingClientRect().top + window.pageYOffset - (vm.config.topMargin || 0)));
              }
            }
            stopPrevious = stop;
            userEvents.forEach(function (e) { window.addEventListener(e, stop, { passive: true }); });
            // after the 500ms scroll animation of docsify, whose end position is computed when it starts
            setTimeout(function () {
              if (stopped) {
                return;
              }
              align();
              observer = new ResizeObserver(function () {
                clearTimeout(timer);
                timer = setTimeout(align, 100);
              });
              observer.observe(content);
            }, 600);
            setTimeout(stop, 10000);
          });
        },
        // Videos: the introduction alone embeds 8 looping clips (autoplay loop muted), which the browser would all
        // download as soon as the page opens. Load only their metadata (size and first frame, so the layout doesn't move)
        // and play each clip while it is on screen. A clip paused by the reader stays paused; with "reduce motion"
        // enabled in the OS, nothing plays by itself.
        function (hook) {
          var observer = null;
          var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          hook.afterEach(function (html) {
            // before the HTML is inserted: once in the DOM, an autoplay video starts downloading
            return html.replace(/<video\b([^>]*)>/g, function (tag, attrs) {
              if (!/\spreload=/.test(attrs)) {
                attrs += ' preload="metadata"';
              }
              return '<video' + attrs.replace(/\sautoplay\b/, ' data-autoplay') + '>';
            });
          });
          hook.doneEach(function () {
            observer && observer.disconnect();
            if (reduceMotion || !window.IntersectionObserver) {
              return;
            }
            observer = new IntersectionObserver(function (entries) {
              entries.forEach(function (entry) {
                var video = entry.target;
                if (entry.isIntersecting) {
                  if (!video.kdpPausedByReader) {
                    video.play().catch(function () {});
                  }
                } else if (!video.paused) {
                  video.kdpPausedByObserver = true;
                  video.pause();
                }
              });
            }, { threshold: 0.25 });
            document.querySelectorAll('.markdown-section video[data-autoplay]').forEach(function (video) {
              video.addEventListener('pause', function () {
                video.kdpPausedByReader = !video.kdpPausedByObserver;
                video.kdpPausedByObserver = false;
              });
              video.addEventListener('play', function () {
                video.kdpPausedByReader = false;
              });
              observer.observe(video);
            });
          });
        },
        // "On this page" table of contents on the right of long pages (6 headings or more), when the screen is wide
        // enough (see main.css). The sidebar lists the sections down to h3 (subMaxLevel), this one also lists the h4
        // sub-sections (academy, reusables, CLI options) and highlights the one being read.
        function (hook) {
          var MIN_HEADINGS = 6;
          var toc = document.createElement('nav');
          var entries = [];
          var scheduled = false;
          toc.className = 'page-toc';
          toc.setAttribute('aria-label', 'On this page');

          function update() {
            scheduled = false;
            // hidden while the cover page is on screen (homepage)
            var cover = document.querySelector('section.cover.show');
            document.body.classList.toggle('page-toc-hidden', !!cover && cover.getBoundingClientRect().bottom > 0);
            var current = null;
            for (var i = 0; i < entries.length && entries[i].heading.getBoundingClientRect().top <= 120; i++) {
              current = entries[i];
            }
            entries.forEach(function (entry) {
              entry.link.classList.toggle('active', entry === current);
            });
            // keep the active entry visible when the table of contents is taller than the screen, without scrolling the page
            if (current) {
              var top = current.link.offsetTop;
              if (top < toc.scrollTop || top + current.link.offsetHeight > toc.scrollTop + toc.clientHeight) {
                toc.scrollTop = top - toc.clientHeight / 3;
              }
            }
          }
          window.addEventListener('scroll', function () {
            if (!scheduled) {
              scheduled = true;
              window.requestAnimationFrame(update);
            }
          }, { passive: true });

          hook.doneEach(function () {
            // headings inside tabs are skipped: they are hidden unless their tab is selected
            var headings = Array.prototype.filter.call(
              document.querySelectorAll('.markdown-section h2, .markdown-section h3, .markdown-section h4'),
              function (h) { return h.id && !h.closest('.docsify-tabs'); }
            );
            entries = [];
            toc.innerHTML = '<p class="page-toc-title">On this page</p>';
            document.body.classList.toggle('has-page-toc', headings.length >= MIN_HEADINGS);
            if (headings.length < MIN_HEADINGS) {
              return;
            }
            headings.forEach(function (h) {
              var anchor = h.querySelector('a.anchor');
              var link = document.createElement('a');
              link.href = anchor ? anchor.getAttribute('href') : '#';
              // the heading's rendered HTML, so that CLI options keep their code style
              link.innerHTML = anchor ? anchor.innerHTML : h.innerHTML;
              link.className = 'page-toc-' + h.tagName.toLowerCase();
              toc.appendChild(link);
              entries.push({ heading: h, link: link });
            });
            if (!toc.parentNode) {
              document.body.appendChild(toc);
            }
            toc.scrollTop = 0;
            update();
          });
        }
      ]
    }
  </script>
