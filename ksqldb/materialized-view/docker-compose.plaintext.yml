---
services:
  mysql:
    image: mysql:8.1
    hostname: mysql
    container_name: mysql
    volumes:
      - ../../ksqldb/materialized-view/mysql.cnf:/etc/mysql/conf.d/custom.cnf
      - ../../ksqldb/materialized-view/mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_HOST: 172.%

  connect:
    volumes:
      - ../../confluent-hub:/usr/share/confluent-hub-components
    environment:
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components/debezium-debezium-connector-mysql
      
  ksqldb-server:
    depends_on:
      - broker
      - schema-registry
      - mysql
    # CREATE SOURCE CONNECTOR runs the connector on the connect container (KSQL_KSQL_CONNECT_URL of the environment,
    # http://connect:8083), which has the Debezium MySQL plugin: the Connect worker embedded in ksqldb-server fails to
    # start on CP 8 ("Failed to connect to and describe Kafka cluster") and takes ksqldb-server down with it
