---
services:
  connect:
    volumes:
      - ../../ksqldb/benchmarking-scenarios/schemas:/tmp/schemas
    environment:
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components/confluentinc-kafka-connect-datagen

  ksqldb-server:
    depends_on:
      - broker
      - schema-registry
    # the datagen connectors run on the connect container (KSQL_KSQL_CONNECT_URL of the environment, http://connect:8083):
    # KSQL_CONNECT_* variables would configure a Connect worker embedded in ksqldb-server, which does not start on CP 8
