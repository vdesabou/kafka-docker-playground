---
# cp-ansible environment: the services below are empty Linux hosts (systemd containers, no Kafka inside).
# start.sh runs the confluent.platform.all playbook from ansible-controller, which installs Confluent Platform in them.
# The optional hosts have a profile, enabled by the --enable-* flags of playground run (see start.sh).
x-host: &host
  build: ../../environment/ansible/host
  image: kdp-ansible-host:ubuntu2404
  # systemd as PID 1, the settings of cp-ansible's molecule scenarios
  privileged: true
  cgroup: host
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # Confluent Platform archive downloaded once by start.sh (installation_method: archive)
    - ${ANSIBLE_ARCHIVE_CACHE_DIR}:/cache:ro

x-connect-host: &connect-host
  <<: *host
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - ${ANSIBLE_ARCHIVE_CACHE_DIR}:/cache:ro
    # connector plugins installed by playground run, as in the other environments
    - ../../confluent-hub:/usr/share/confluent-hub-components

services:

  controller:
    <<: *host
    hostname: controller
    container_name: controller

  controller2:
    <<: *host
    hostname: controller2
    container_name: controller2
    profiles:
      - controller-nodes

  controller3:
    <<: *host
    hostname: controller3
    container_name: controller3
    profiles:
      - controller-nodes

  broker:
    <<: *host
    hostname: broker
    container_name: broker

  broker2:
    <<: *host
    hostname: broker2
    container_name: broker2
    profiles:
      - kafka-nodes

  broker3:
    <<: *host
    hostname: broker3
    container_name: broker3
    profiles:
      - kafka-nodes

  schema-registry:
    <<: *host
    hostname: schema-registry
    container_name: schema-registry
    ports:
      - "8081:8081"

  connect:
    <<: *connect-host
    hostname: connect
    container_name: connect
    ports:
      - "8083:8083"

  connect2:
    <<: *connect-host
    hostname: connect2
    container_name: connect2
    ports:
      - "8283:8083"
    profiles:
      - connect-nodes

  connect3:
    <<: *connect-host
    hostname: connect3
    container_name: connect3
    ports:
      - "8383:8083"
    profiles:
      - connect-nodes

  ksqldb-server:
    <<: *host
    hostname: ksqldb-server
    container_name: ksqldb-server
    ports:
      - "8088:8088"
    profiles:
      - ksqldb

  rest-proxy:
    <<: *host
    hostname: rest-proxy
    container_name: rest-proxy
    ports:
      - "8082:8082"
    profiles:
      - rest-proxy

  control-center:
    <<: *host
    hostname: control-center
    container_name: control-center
    ports:
      - "9021:9021"
    profiles:
      - control-center

  ansible-controller:
    build:
      context: ../../environment/ansible/ansible-controller
      args:
        ANSIBLE_CORE_VERSION: ${ANSIBLE_CORE_VERSION}
        CP_ANSIBLE_VERSION: ${CP_ANSIBLE_VERSION_SPEC}
    image: kdp-ansible-controller:${ANSIBLE_CONTROLLER_IMAGE_TAG}
    hostname: ansible-controller
    container_name: ansible-controller
    volumes:
      # the docker connection plugin runs 'docker exec' on the hosts through the engine socket
      - ${ANSIBLE_DOCKER_SOCKET}:/var/run/docker.sock
      # hosts.yml generated by start.sh: edit it and run the playbook again
      - ../../environment/ansible/inventory:/inventory
