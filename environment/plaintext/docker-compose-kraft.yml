---
services:

  controller:
    image: ${CP_KAFKA_IMAGE}:${CP_KAFKA_TAG}
    hostname: controller
    container_name: controller
    volumes:
      - ../../environment/plaintext/jmx-exporter:/usr/share/jmx_exporter/
    ports:
      - "10005:10005"
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${PLAYGROUND_INTERNAL_TOPICS_MIN_ISR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      # topic __internal_confluent_only_broker_info (otherwise default.replication.factor, 1)
      KAFKA_CONFLUENT_BROKER_TYPE_TOPIC_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_MIN_ISR: ${PLAYGROUND_INTERNAL_TOPICS_MIN_ISR:-1}
      KAFKA_JMX_PORT: 10005
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${PLAYGROUND_CONTROLLER_QUORUM_VOTERS:-4@controller:9093}
      KAFKA_LISTENERS: 'CONTROLLER://controller:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      #KAFKA_LOG_DIRS: '/tmp/kraft-controller-logs'
      #KAFKA_METRIC_REPORTERS: $KAFKA_METRIC_REPORTERS
      #KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker:9092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      CONFLUENT_METRICS_ENABLE: 'true'
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'
      # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid"
      # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      EXTRA_ARGS: -name kafkaServer -loggc ${GRAFANA_AGENT_BROKER}
      PYROSCOPE_APPLICATION_NAME: "kraft-controller"
      PYROSCOPE_SERVER_ADDRESS: "http://pyroscope:4040"

  controller2:
    image: ${CP_KAFKA_IMAGE}:${CP_KAFKA_TAG}
    hostname: controller2
    container_name: controller2
    profiles:
      - "controller_nodes"
    volumes:
      - ../../environment/plaintext/jmx-exporter:/usr/share/jmx_exporter/
    ports:
      - "12005:12005"
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${PLAYGROUND_INTERNAL_TOPICS_MIN_ISR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      # topic __internal_confluent_only_broker_info (otherwise default.replication.factor, 1)
      KAFKA_CONFLUENT_BROKER_TYPE_TOPIC_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      KAFKA_CONFLUENT_CLUSTER_LINK_METADATA_TOPIC_MIN_ISR: ${PLAYGROUND_INTERNAL_TOPICS_MIN_ISR:-1}
      KAFKA_JMX_PORT: 12005
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${PLAYGROUND_CONTROLLER_QUORUM_VOTERS:-4@controller:9093}
      KAFKA_LISTENERS: 'CONTROLLER://controller2:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      #KAFKA_LOG_DIRS: '/tmp/kraft-controller-logs'
      #KAFKA_METRIC_REPORTERS: $KAFKA_METRIC_REPORTERS
      #KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker:9092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      CONFLUENT_METRICS_ENABLE: 'true'
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'
      # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid"
      # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      EXTRA_ARGS: -name kafkaServer -loggc ${GRAFANA_AGENT_BROKER}
      PYROSCOPE_APPLICATION_NAME: "kraft-controller2"
      PYROSCOPE_SERVER_ADDRESS: "http://pyroscope:4040"

  controller3:
    image: ${CP_KAFKA_IMAGE}:${CP_KAFKA_TAG}
    hostname: controller3
    container_name: controller3
    profiles:
      - "controller_nodes"
    volumes:
      - ../../environment/plaintext/jmx-exporter:/usr/share/jmx_exporter/
    ports:
      - "13005:13005"
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${PLAYGROUND_INTERNAL_TOPICS_MIN_ISR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${PLAYGROUND_INTERNAL_TOPICS_REPLICATION_FACTOR:-1}
