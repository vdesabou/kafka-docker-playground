# Prometheus of the mdc-plaintext environment with --enable-jmx-grafana: same jobs as environment/plaintext/prometheus/prometheus.yml
# (the dashboards are shared), one target per cluster, told apart by the label env (the "env" variable of the dashboards)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 15s

rule_files:
  - "alert.rules"

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: hostname
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'

  - job_name: "kafka-broker"
    static_configs:
      - targets:
          - "broker-europe:1234"
        labels:
          env: "europe"
      - targets:
          - "broker-us:1234"
        labels:
          env: "us"
    relabel_configs:
      - source_labels: [__address__]
        target_label: hostname
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'

  - job_name: "kafka-controller"
    static_configs:
      - targets:
          - "controller-europe:1234"
        labels:
          env: "europe"
      - targets:
          - "controller-us:1234"
        labels:
          env: "us"
    relabel_configs:
      - source_labels: [__address__]
        target_label: hostname
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'

  - job_name: "kafka-connect"
    static_configs:
      - targets:
          - "connect-europe:1234"
        labels:
          env: "europe"
          kafka_connect_cluster_id: "connect-europe"
      - targets:
          - "connect-us:1234"
        labels:
          env: "us"
          kafka_connect_cluster_id: "connect-us"
    relabel_configs:
      - source_labels: [__address__]
        target_label: hostname
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'

  - job_name: "kafka-lag-exporter"
    static_configs:
      - targets:
          - "kafka-lag-exporter:9999"
        labels:
          env: "mdc"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'
