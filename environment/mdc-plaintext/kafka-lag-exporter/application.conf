kafka-lag-exporter {
  port = 9999

  client-group-id = "kafkalagexporter"
  lookup-table-size = 120
  poll-interval = 60

  # the two clusters of the mdc-plaintext environment: the "cluster_name" label of the Kafka Lag Exporter dashboard
  clusters = [
    {
      name = "europe"
      bootstrap-brokers = "broker-europe:9092"
    },
    {
      name = "us"
      bootstrap-brokers = "broker-us:9092"
    }
  ]
}
